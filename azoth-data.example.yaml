# ============================================================================
#  azoth user data file - TEMPLATE
# ============================================================================
#
#  Copy this to `azoth-data.yaml` at the repository root, fill in the values you
#  are entitled to use, and check it with:
#
#      python tools/check_user_data.py azoth-data.yaml
#
#  Then, once it passes, compile it into the files both implementations read:
#
#      python tools/gen_user_data.py azoth-data.yaml
#      maturin develop
#
#  That overwrites the placeholders under `data/` IN PLACE, because Rust embeds
#  them at compile time and needs them at the paths the code names. Nothing stops
#  you committing the result by accident - so don't. `git checkout -- data/`
#  restores the shipped placeholders.
#
#  `azoth-data.yaml` is gitignored. Do NOT commit it, and do not commit the data
#  files generated from it: if the values came from a standard you licensed,
#  committing them redistributes them, which is the thing this mechanism exists
#  to avoid. See docs/src/copyright.md.
#
#  This template validates as it stands. That is deliberate and a test enforces
#  it: a template that does not pass its own checker teaches the wrong shape.
#  Everything below is therefore marked `estimated_dummy`, including the rows you
#  will replace. The shape of a non-placeholder row is shown in comments, because
#  an active row claiming `verified` would be a citation nobody had checked -
#  which is the failure this whole mechanism is organised against.
#
#  ---------------------------------------------------------------------------
#  WHY THIS FILE EXISTS
#  ---------------------------------------------------------------------------
#
#  Some of what these calculations need is not copyrightable and some of it is.
#
#  A *fact* is not copyrightable: that a 90-degree standard elbow has an
#  equivalent length of thirty diameters is a fact, and recording it with a
#  citation is fine. A *table* is copyrightable: transcribing Crane TP-410's
#  tables into this repository would redistribute the standard's expression of
#  those facts, which this project does not do.
#
#  So the repository ships placeholders, and you supply the real values here.
#  That keeps the arithmetic, the range checks and the tests in the open while
#  keeping the licensed expression of the data with whoever licensed it.
#
#  ---------------------------------------------------------------------------
#  WHAT IS NOT IN THIS FILE
#  ---------------------------------------------------------------------------
#
#  Single coefficients are NOT here, because they do not need to be. A discharge
#  coefficient, a pump efficiency, a friction factor and a Crane f_t are function
#  arguments - pass yours directly:
#
#      azoth.hydraulics.orifice_flow(..., Cd=0.61)
#
#  This file is for *sets* of data that a calculation looks up by name: the
#  fitting registry today, and whatever else comes to need a table later.
#
#  ---------------------------------------------------------------------------
#  STATUS VALUES, AND WHY THEY MATTER
#  ---------------------------------------------------------------------------
#
#    verified         You checked it against the source named in source_ref.
#                     Only you can say this, and only if you did.
#    unverified       Not a placeholder, but not checked by anyone either.
#    estimated_dummy  A placeholder. Keep the word DUMMY in the citation; the
#                     checker enforces that, so a placeholder cannot be quietly
#                     promoted by editing one field.
#
#  `source_ref` and `source_locator` are required for anything that is not
#  `estimated_dummy`, and `source_ref` must be one of:
#
#    arweave:<43-char transaction id>   preferred: content-addressed, immutable,
#                                       independently timestamped
#    doi:<doi>
#    https://...
#
#  Prose is not accepted. A reference a tool cannot fetch is the same as no
#  reference at all, and this is checked rather than trusted.
#
# ============================================================================

# Bump only if the format changes; the checker rejects unknown versions rather
# than guessing at what a newer shape meant.
schema_version: 1

# ---------------------------------------------------------------------------
#  Fittings
# ---------------------------------------------------------------------------
#
#  Read by `azoth.hydraulics.crane_k_factors` and by the `azoth pipe` CLI, where
#  it becomes the fitting share of a pressure drop. Until you supply your own,
#  every row here is a placeholder, which the `verify_status` column records.
#
#  `n_ld` is the equivalent length ratio L_eq/D for fully turbulent flow, which
#  is the coefficient such a table expresses. Record which basis you used in
#  `f_t_basis`: using the actual friction factor at the flow Reynolds number
#  instead of the fully turbulent f_T is a defensible variant that gives a
#  different answer, so the basis has to travel with the number.
#
fittings:
  # An invented row. The id and the shape are real; the number is not, and the
  # citation says so. Replace the whole list with your own.
  - id: 90_elbow
    family: bend
    name: 90 degree standard elbow
    n_ld: 30.0
    f_t_basis: f_t
    citation: "EXAMPLE ROW - DUMMY VALUE, not from any standard. Replace with your own data."
    verify_status: estimated_dummy
    source_ref: ""
    source_locator: ""

  # What a finished row looks like. Uncomment it once you have the value and the
  # document it came from, and change verify_status only if you personally
  # checked it against that document.
  #
  # - id: gate_valve_open
  #   family: valve
  #   name: gate valve, fully open
  #   n_ld: 8.0
  #   f_t_basis: f_t
  #   citation: "Read from the source named below."
  #   verify_status: verified
  #   source_ref: "arweave:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
  #   source_locator: "Table 2, gate valve, fully open"

# ---------------------------------------------------------------------------
#  Fluid properties
# ---------------------------------------------------------------------------
#
#  Read by the CLI and by `azoth.properties` to turn a fluid name and a
#  temperature into a density and a viscosity. Linear interpolation between the
#  points you give, and no extrapolation: past either end a straight-line
#  extension is a confident wrong number rather than a small error. Water's
#  viscosity varies by a factor of six across 0-100 C, which is why.
#
#  Keys are fluid names and each becomes a table. Tabulate over a range that
#  covers the temperatures you will ask for, and in ascending temperature order.
#
fluids:
  # An example fluid, deliberately not water: the repository already carries
  # water and air, and this is here to show the shape rather than to be used.
  example_fluid:
    - temperature_c: 0.0
      density_kg_m3: 1000.0
      dynamic_viscosity_pa_s: 0.0018
      citation: "EXAMPLE ROW - DUMMY VALUE, not from any standard."
      verify_status: estimated_dummy
      source_ref: ""
      source_locator: ""

    - temperature_c: 100.0
      density_kg_m3: 958.0
      dynamic_viscosity_pa_s: 0.00028
      citation: "EXAMPLE ROW - DUMMY VALUE, not from any standard."
      verify_status: estimated_dummy
      source_ref: ""
      source_locator: ""
