[workspace]
resolver = "3"
members = [
  "crates/azoth-core",
  "crates/azoth-test-support",
  "crates/azoth-hydraulics",
  "crates/azoth-thermal",
  "crates/azoth-eos",
  "crates/azoth-reactions",
  "crates/azoth-standards",
  "crates/azoth-process",
  "crates/azoth-python",
  "crates/azoth-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/PatrickMockridge/Azoth"
description = "Open, validated, citable chemical engineering calculations"
authors = ["azoth contributors"]

[workspace.dependencies]
azoth-core = { path = "crates/azoth-core" }
azoth-test-support = { path = "crates/azoth-test-support" }
azoth-hydraulics = { path = "crates/azoth-hydraulics" }
azoth-thermal = { path = "crates/azoth-thermal" }
azoth-eos = { path = "crates/azoth-eos" }
azoth-reactions = { path = "crates/azoth-reactions" }
azoth-standards = { path = "crates/azoth-standards" }
azoth-process = { path = "crates/azoth-process" }
azoth-python = { path = "crates/azoth-python" }
azoth-cli = { path = "crates/azoth-cli" }

# Units. Fixed-SI quantities at the public boundary; plain f64 inside. See
# crates/azoth-core/src/units.rs for why the API is not generic over U.
uom = "0.38"

# Typed errors. Every variant carries enough context to name the offending
# field, which is what makes a failure actionable rather than just loud.
thiserror = "2"

# Reading the fittings registry. A real CSV parser rather than split(','):
# the file currently has no quoted fields, but silently mis-parsing a quoted
# citation the day someone adds one is not a failure mode worth risking for
# one small, ubiquitous dependency.
csv = "1"

# Reading a user's keycard. `toml` is the reference implementation of the format
# the rest of this repository's data is written in, and reading a card is the one
# place Rust needs a data format it did not generate itself. `serde` derive is what
# makes a card a typed document - a section the reader does not know is a field it
# does not have, rather than a key it walked past.
serde = { version = "1", features = ["derive"] }
# A session's result as JSON, which is what a front-end and an agent both read. A real
# encoder rather than `format!` for the reason the CSV comment above gives: escaping a
# quote, a backslash or a control character by hand is a silent failure the day a component
# name carries one, and JSON has no representation for a non-finite number at all.
serde_json = "1"
toml = "1"

# The Python extension. abi3-py312 gives one wheel tag covering CPython
# 3.12 and later, so the release matrix does not need a wheel per version.
pyo3 = { version = "0.29", features = ["abi3-py312"] }

# CLI argument parsing.
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
# Panics must unwind, not abort: the PyO3 layer converts a Rust panic into a
# Python exception. With panic=abort a panic anywhere in the Rust stack takes
# the interpreter down with no traceback, which is untraceable for a user.
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Physical constants and comparisons are numeric; pedantic float lints fight the
# domain rather than helping it.
cast_precision_loss = "allow"
similar_names = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
