# The facts the normative pages state, and the probe that measures each.
#
# This file holds no measured value. A `{hole}` is a name for a measurement, never a
# number, and `tools/check_doc_claims.py` refuses one that carries a value - because a
# check that can be satisfied by editing this file is a check that gets satisfied by
# editing this file. When a claim fails, the page or the tree is what changes.
#
# `text` is a contiguous span of the page with each measured value replaced by a hole.
# Whitespace is the only liberty taken in matching, so a span that wraps in the source
# may be written here on one line; punctuation must be exact, because a page that
# retypes an em dash is a stale declaration rather than a claim that quietly moved.
#
# Probes: specs.calcs, specs.models, specs.ids, specs.unported_rows, unit_ops.declared,
# unit_ops.kernels, unit_ops.dispatch, unit_ops.refusals, vocabulary.units,
# lean.axioms_gated, lean.axioms_dim, lean.gate_printed, lean.guards_gated, lean.modules,
# pairs.eos_files,
# skills.total, skills.azoth, skills.screening_p11, provenance.ids,
# provenance.partially_verified, path, lean.gated.
# `python tools/check_doc_claims.py --probe <name>` prints one measurement.

# --- what the library carries -------------------------------------------------

[[claim]]
page = "docs/src/architecture/specification.md"
text = "azoth has **{total} ids** — {calcs} calculations and {models} models."
measure = { total = "specs.ids", calcs = "specs.calcs", models = "specs.models" }

[[claim]]
page = "README.md"
text = "The full catalog — {calcs} calculations and {models} models"
measure = { calcs = "specs.calcs", models = "specs.models" }

# The refusals the model specs declare. Stated once, because the number is the whole
# point of the field: a row is a claim both implementations keep, and a count that moved
# without a row being added or removed is the kind of drift this file exists to catch.
[[claim]]
page = "docs/src/architecture/specification.md"
text = "The models declare **{unported_rows} refusals**"
measure = { unported_rows = "specs.unported_rows" }

# --- what a result says about itself ------------------------------------------
#
# The block is generated from the same registry the id counts come from, so these move
# whenever a calculation is added or a validation case lands. A number typed into the
# README or the safety page would be wrong within a tranche.

[[claim]]
page = "README.md"
text = "recomputes all {ids} of them"
measure = { ids = "provenance.ids" }

[[claim]]
page = "docs/src/safety.md"
text = "{count} of the {ids} ids read `partially_verified`"
measure = { count = "provenance.partially_verified", ids = "provenance.ids" }

# --- the unit-operation palette -----------------------------------------------
#
# Four claims, four probes, because "carries a kernel" and "is dispatchable" are
# different sets: `unit_ops.packed_column` has a kernel and is refused by name.

[[claim]]
page = "ROADMAP.md"
text = "declares {declared} unit operations of which **{kernels} carry kernels**"
measure = { declared = "unit_ops.declared", kernels = "unit_ops.kernels" }

[[claim]]
page = "docs/src/architecture/specification.md"
text = "declares {declared} unit operations with typed channels"
measure = { declared = "unit_ops.declared" }

[[claim]]
page = "docs/src/architecture/process-schema.md"
text = "**{kernels} of the {declared} palette entries carry a registered `process.*` id**"
measure = { kernels = "unit_ops.kernels", declared = "unit_ops.declared" }

[[claim]]
page = "docs/src/index.md"
text = "{declared} unit operations declared on typed channels, {kernels} of them with kernels"
measure = { declared = "unit_ops.declared", kernels = "unit_ops.kernels" }

[[claim]]
page = "docs/src/architecture/middleware.md"
text = "the `DISPATCH` table, {entries} entries and **{refusals}** refusal by name"
measure = { entries = "unit_ops.dispatch", refusals = "unit_ops.refusals" }

# --- the Lean gate ------------------------------------------------------------
#
# The page states the number of gated lines, not a count of claims: the file prints
# axioms for the witness theorems beside the claims they keep from being vacuous, and
# says why. Those are the files' own numbers and a reader can count them.

# The registration-hardening tranche's own measurement: the pyo3 wrapper is generated for the
# ids whose kernel takes the declared inputs and hand-written for the rest. Both numbers move
# together, and each is read from the side it belongs to - the generated file and the modules.
[[claim]]
page = "docs/src/architecture/specification.md"
text = "generated for **{generated}** of the registered ids and hand-written for **{hand}**"
measure = { generated = "layout.wrappers_generated", hand = "layout.wrappers_hand" }

# The same pair for the bridge adapter, which is generated for the ids whose signature is the
# public wrapper's and hand-written for the rest. The two counts are disjoint and together they
# are the registry - `test_gen_python_bridge.py` holds that - so a reader can check the pair
# against 194 without reading either file.
[[claim]]
page = "docs/src/architecture/specification.md"
text = "The bridge adapter is generated for **{generated}** and hand-written for **{hand}**"
measure = { generated = "layout.bridge_generated", hand = "layout.bridge_hand" }

[[claim]]
page = "docs/src/calculus/index.md"
text = "**{gated}** `#print axioms` lines in `Azoth/Axioms.lean`, {dim} of them `Azoth.Dim`'s, **{gate}** in the generated `Azoth/Gate.lean` - one per canonical unit, checking that the table's exponents name the dimension `lean-units` calls by that name, plus one for `Azoth.Inputs`, which holds the palette's input table to the vocabulary's own exponents - and **{guards}** in the generated `Azoth/GuardGate.lean`"
measure = { gated = "lean.axioms_gated", dim = "lean.axioms_dim", gate = "lean.gate_printed", guards = "lean.guards_gated" }

[[claim]]
page = "docs/src/calculus/index.md"
text = "{modules} modules in all"
measure = { modules = "lean.modules" }

[[claim]]
page = "docs/src/calculus/index.md"
text = "`{theorem}` is the adequacy claim"
measure = { theorem = "lean.gated" }

# --- the vocabulary and the validation record ---------------------------------

[[claim]]
page = "README.md"
text = "{units}-unit vocabulary"
measure = { units = "vocabulary.units" }

[[claim]]
page = "docs/src/architecture/specification.md"
text = "`validation/eos/` holds {cases} paired cases"
measure = { cases = "pairs.eos_files" }

# --- paths and the skills catalog ---------------------------------------------

[[claim]]
page = "docs/src/architecture/specification.md"
text = "the readers are `{python_reader}` and"
measure = { python_reader = "path" }

[[claim]]
page = "docs/src/agentic/roadmap.md"
text = "{calcs} calculations and {models} models the library implements"
measure = { calcs = "specs.calcs", models = "specs.models" }

[[claim]]
page = "docs/src/agentic/roadmap.md"
text = "{azoth_basis} are: the four `library/` skills"
measure = { azoth_basis = "skills.azoth" }

[[claim]]
page = "docs/src/agentic/roadmap.md"
text = "The remaining {placeholders} are placeholders — {screening} `screening`, {advisory} `advisory`, {data_retrieval} `data-retrieval` and {hybrid} `hybrid`"
measure = { placeholders = "skills.placeholders", screening = "skills.screening", advisory = "skills.advisory", data_retrieval = "skills.data_retrieval", hybrid = "skills.hybrid" }

# --- what CI cannot measure ----------------------------------------------------
#
# A skip must still quote text its page carries, so a skip whose sentence is rewritten
# goes stale loudly rather than staying silent.

[[skip]]
page = "docs/src/architecture/specification.md"
text = "NeqSim master is 1,299,006 lines of Java across 3,410 files."
reason = "no NeqSim checkout in CI; the page states the command that measures it (`find src/main/java -name '*.java' | wc -l` at the pinned revision)"
