[build-system]
# maturin, because the Rust core is exposed as a compiled extension module.
# Until `crates/azoth-python` is built, `pip install .` will fail - which is
# expected, and is why pytest is configured with `pythonpath` below so the test
# suite runs against the source tree without needing an install at all.
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "azoth"
version = "0.1.0"
description = "An opinionated port of NeqSim to Rust, with every calculation mirrored in Python"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-CC-BY-4.0"]
authors = [{ name = "azoth contributors" }]
keywords = ["chemical-engineering", "hydraulics", "fluid-mechanics", "engineering", "validation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  # Units. The whole public API speaks pint quantities, so this is not optional.
  "pint>=0.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.9",
  "mypy>=1.13",
  # Needed to build the extension, so it is part of developing rather than an
  # optional extra. CI installs this list and nothing else - see the note there.
  "maturin>=1.15",
  # The spec tools read YAML and validate against the JSON Schema. Listed here
  # because the test suite shells out to `tools/gen_registry.py --check`, so a
  # dev environment without them fails a test rather than skipping one.
  "pyyaml>=6",
  "jsonschema>=4.20",
]

[project.urls]
Homepage = "https://github.com/PatrickMockridge/Azoth"
Documentation = "https://github.com/PatrickMockridge/Azoth/tree/main/docs"

[tool.maturin]
# Mixed Rust/Python layout: the Rust extension is one private module inside the
# Python package, not a package of its own. `python-source` is the directory
# *containing* the `azoth` package, which the src-layout puts one level down.
python-source = "python/src"
module-name = "azoth._core"
manifest-path = "crates/azoth-python/Cargo.toml"
features = ["pyo3/extension-module"]
# The CSV tables, so an installed wheel can find its own data. `include` copies a
# file to its path relative to the project root, and maturin 1.15 offers no way to
# redirect that - so the wheel carries `data/...` at the distribution root rather
# than inside the `azoth` package. `azoth/_data.py` searches both, because the two
# ways of shipping data land in different places.
include = ["data/fittings/*.csv", "data/fluids/*.csv", "data/components/*.csv"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
# Import `azoth` straight from the source tree, so the suite runs without an
# editable install and without the Rust extension having been built.
# `python/tests` is on the path too, so the shared `_helpers` module is
# importable from every test file without making the test tree a package.
pythonpath = ["python/src", "python/tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
  "requires_rust: test needs the compiled azoth._core extension",
]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["python/src", "python/tests"]
# `docs/` is excluded because it is generated output, compared byte-for-byte
# against a regeneration by the docs-drift gate. Ruff 0.16 formats Python code
# fences *inside Markdown*, so leaving it in scope rewrites the equation shown on
# a calc page - `)**2` becomes `) ** 2` - and the page stops matching the spec it
# was generated from. The docs-drift gate then fails on every run.
#
# Note that `[tool.ruff.format] exclude` alone does NOT prevent this; the
# Markdown code-block path ignores it. The top-level exclusion does.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "UP",       # pyupgrade
  "B",        # flake8-bugbear
  "SIM",      # flake8-simplify
  "RUF",      # ruff-specific
  "PTH",      # flake8-use-pathlib
  "RET",      # flake8-return
  "ARG",      # unused arguments
  "TID",      # tidy imports
]
ignore = [
  # Physical quantity names are short by convention (L, D, Re, mu) and match the
  # symbols in the published equations the calcs are transcribed from.
  "E741",     # ambiguous variable name, e.g. `l`
]

[tool.ruff.format]
# The generated registry is the generator's output and is compared byte-for-byte
# against a regeneration by `tools/gen_registry.py --check`. Letting the
# formatter rewrite it would fail that gate for a purely cosmetic reason. It
# remains linted; only reformatting is skipped.
exclude = ["python/src/azoth/_registry_gen.py", "python/src/azoth/_models_gen.py"]

[tool.ruff.lint.per-file-ignores]
# Tests legitimately hard-code expected numbers and use long assertion messages.
"python/tests/**" = ["ARG001", "ARG002"]
# Generated from the specs. Its values are repr()s of spec contents, so line
# length is not something the generator controls and not something a reader
# benefits from wrapping. Correctness of this file is asserted by
# test_registry_contract.py, not by a linter.
"python/src/azoth/_registry_gen.py" = ["E501"]
"python/src/azoth/_models_gen.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "python/src"
# Both the library and its tests are held to strict. Test code reading the
# generated registry has to reach for `Any` in places, but that is done
# explicitly at those points rather than by relaxing the whole suite.
files = ["python/src", "python/tests"]
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
# Generated from the specs; its structure is asserted by tests rather than typed.
exclude = ["python/src/azoth/_registry_gen\\.py"]

[[tool.mypy.overrides]]
# pint ships type information that does not survive `--strict` cleanly: its
# Quantity is generic, and every bare `Quantity` becomes a [type-arg] error.
# The wrapper in azoth.core.units confines that to one module and exposes a
# single `Q = Quantity[float]` alias, so the rest of the package is fully typed.
module = ["pint", "pint.*"]
follow_untyped_imports = false

[[tool.mypy.overrides]]
module = ["azoth._registry_gen", "azoth._models_gen"]
ignore_errors = true

[[tool.mypy.overrides]]
# PyYAML publishes no type information. The only consumer on the checked path is
# the spec_lint test, which writes a synthetic spec out as YAML and needs a real
# parser to do it. A stub package would be a new dev dependency for that one
# import; the tools themselves are already outside `files`.
module = ["yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Neither `jsonschema` nor `referencing` publishes type information. The consumers
# on the checked path are `test_keycard_schema.py`, which validates documents
# against the real schemas rather than a mock - a schema is only worth testing
# against the validator that reads it - and it needs `referencing` to resolve the
# `$ref` between the two schema documents. Same reasoning as `yaml` above: a stub
# package would be a new dev dependency for one import, and the tools that use the
# same libraries are already outside `files`.
module = ["jsonschema", "referencing"]
ignore_missing_imports = true
