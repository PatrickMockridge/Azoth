[package]
name = "azoth-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "PyO3 bindings exposing the azoth Rust core to Python"

[lib]
# Deliberately not `azoth_core`: that collides with the `azoth-core` crate's
# own rlib, and cargo warns about the output-filename clash. The Python-facing
# module path comes from `module-name` in [tool.maturin], not from here.
name = "azoth_python"
crate-type = ["cdylib", "rlib"]

[dependencies]
azoth-core.workspace = true
azoth-hydraulics.workspace = true
azoth-thermal.workspace = true
azoth-eos.workspace = true
azoth-process.workspace = true
uom.workspace = true
pyo3 = { workspace = true }

[features]
default = []
# Enabled by maturin when building the extension. Kept out of `default` so that
# `cargo test` can link against libpython normally: with `extension-module` set,
# the crate deliberately does not link it, and every test binary fails to build.
extension-module = ["pyo3/extension-module"]

[dev-dependencies]
# Starts the interpreter for a test binary that links libpython. Without it
# `Python::with_gil` refuses to run, which is why the transport tests below the
# result types could not exist. Only the test build sees this: the wheel is built
# with `extension-module`, where auto-initializing is wrong.
pyo3 = { workspace = true, features = ["auto-initialize"] }

[lints]
workspace = true
