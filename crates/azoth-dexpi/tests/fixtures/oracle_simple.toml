# The topology `validation/neqsim/Dexpi20ProcessProbe.java` builds, as a flowsheet.
#
# **Not a shipped example.** It exists so the oracle test can take NeqSim's pinned Process
# export and azoth's export of the same process and compare what the two documents say. The
# equipment ids are NeqSim's, so a step identifier is the same string in both files.
id = "flowsheets.oracle_simple"
name = "DEXPI oracle simple"

products = ["GAS", "OIL"]

[[inputs]]
name = "FEED"
components = ["methane", "n-butane"]
n = 11.357
z = [0.8, 0.2]
P = 5.0e6
T = 303.15

[[instances]]
id = "V-101"
unit = "unit_ops.separator"
[instances.parameters]
pressure_drop = 0.0
gas_in_liquid = 0.0

[[instances]]
id = "K-101"
unit = "unit_ops.compressor"
[instances.parameters]
outlet_pressure = 8.0e6
isentropic_efficiency = 1.0

[[instances]]
id = "E-101"
unit = "unit_ops.cooler"
[instances.parameters]
outlet_temperature = 303.15

[[instances]]
id = "FV-101"
unit = "unit_ops.throttling_valve"
[instances.parameters]
outlet_pressure = 1.0e6

[[connections]]
from = "FEED"
to = "V-101.feed"

[[connections]]
from = "V-101.vapour"
to = "K-101.inlet"

[[connections]]
from = "K-101.outlet"
to = "E-101.inlet"

[[connections]]
from = "E-101.outlet"
to = "FV-101.inlet"

[[connections]]
from = "FV-101.outlet"
to = "GAS"

[[connections]]
from = "V-101.liquid"
to = "OIL"
