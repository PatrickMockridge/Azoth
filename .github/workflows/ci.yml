name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # **The nightly calls this file, and so will the release.** `mode: full` runs every job
  # whatever the diff says, which is what makes "the whole suite runs nightly" a fact about one
  # workflow rather than a claim about two that have to be kept in step. A caller that passes
  # nothing gets what a push gets.
  workflow_call:
    inputs:
      mode:
        type: string
        default: scoped

env:
  CARGO_TERM_COLOR: always
  # Fail fast on a Rust warning rather than letting it accumulate.
  RUSTFLAGS: -D warnings

jobs:
  # **The one job that decides all the others.** It reads the diff once, writes `job=<bool>`
  # lines for every job below, and prints why - so a job that does not run is a job this said
  # `false` about, visible in the summary, rather than an absence nobody explained. The
  # decision and the work come from one place: `tools/test_scope.py --plan` and
  # `tools/test_scope.py --job <name>` read the same table, so they cannot disagree.
  scope:
    name: scope
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.plan.outputs.base }}
      rust-test: ${{ steps.plan.outputs.rust-test }}
      python-test: ${{ steps.plan.outputs.python-test }}
      wheel-data: ${{ steps.plan.outputs.wheel-data }}
      ui: ${{ steps.plan.outputs.ui }}
      docs-build: ${{ steps.plan.outputs.docs-build }}
      docs-drift: ${{ steps.plan.outputs.docs-drift }}
      lean-verify: ${{ steps.plan.outputs.lean-verify }}
      validation: ${{ steps.plan.outputs.validation }}
    steps:
      - uses: actions/checkout@v4
        with:
          # `test_scope.py` diffs against the commit this push starts from, so that commit has
          # to be in the clone; the default fetch-depth of one has only the tip.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # **Every tracked path, through the table.** A diff can only show the holes a diff
      # happens to touch; this walks the whole tree, so the day a directory is added and no
      # rule knows it the gate says so instead of the map quietly gaining another path that
      # comes back green.
      - name: the map places every path
        run: python tools/test_scope.py --audit
      - id: plan
        name: which jobs this diff reaches
        run: |
          BASE="${{ github.event.before }}"
          case "$BASE" in ""|0000000000000000000000000000000000000000) BASE="HEAD~1" ;; esac
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          python tools/test_scope.py --base "$BASE" --plan \
            ${{ inputs.mode == 'full' && '--full' || '' }} >> "$GITHUB_OUTPUT"
          {
            echo "## What this diff reaches"
            echo
            python tools/test_scope.py --base "$BASE" --plan --explain
          } >> "$GITHUB_STEP_SUMMARY"

  spec-validate:
    name: spec-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip jsonschema
      # Every spec under specs/ must validate against the schema, and must
      # satisfy the semantic rules the schema cannot express. Also prints the
      # count of estimated-dummy data rows, so placeholder data is visible in
      # every build log rather than only where it is used.
      - run: python tools/spec_lint.py
      # The mechanism P5 names for the prose standard, which until now was named by
      # nothing that ran. It needs no dependencies beyond the standard library, and it
      # did not pass on this tree when it was first run: it was reporting its own phrase
      # list, seven of its nine hits.
      - run: python tools/prose_lint.py
      # `json.loads` keeps the last of two identical keys and discards the first
      # without saying so, and `check_schema` does not look for them either - so a
      # schema can carry a duplicated keyword and pass every other gate here.
      # keycard.schema.json did, in two places.
      - run: python tools/check_json_keys.py
      # The numerical-safety rule in `docs/src/calculus/numerics.md`, for the two cases
      # that are decidable from a line of source: an integral exponent written as a
      # float (which is NaN or complex for a negative base), and a decimal that
      # approximates a rational (`0.3333` for `1/3`, measured to differ by 4.6e-4 at
      # x = 10^6). A line says its decimal is NeqSim's own with a `numerics-ok:` marker.
      - run: python tools/check_numerics.py
      # Every executable claim - a panic, an unreachable arm, a debug assertion, a
      # guarantee-worded expect, a Python assert - names the test that would falsify it
      # with a `claim-ok:` marker, and the marker names a test that exists. Read in both
      # directions, so a marker left behind by a moved claim is an error too. The named
      # test is the behavioural half; the checker cannot prove it drives the branch.
      - run: python tools/check_claims.py
      # The front end's own three shapes, which no other checker reads: a cast on the wire
      # boundary where the decoder belongs, a magnitude with significant digits written in
      # the editor, and a part of the envelope kept in local state beside it. `ui/src` was
      # the fourth place the vocabulary page's "no factor is written down" rule had never
      # been swept, and the cast rule's first run found eleven sites.
      - run: python tools/check_ui.py
      # The vendoring record: every column of every vendored upstream, and what was
      # done with it. It also prints the tally, because the interesting number is how
      # many columns are absent because the model does not exist yet.
      - run: python tools/check_manifest.py
      # And the half of a manifest row `check_manifest.py` cannot decide: a column recorded as
      # unread, against whether the tree reads the field the readers put it in. `PARACHOR`,
      # `LJEPS` and the three `LIQUIDCONDUCTIVITY` columns were each corrected by hand after
      # going false, and this is what reads the claim.
      - run: python tools/audit_manifest.py --check
      # The two version numbers, held to each other: `pyproject.toml`'s is what the wheel
      # is published as, `Cargo.toml`'s is what every binary reports - and it reaches a
      # client as `azoth mcp`'s `serverInfo.version`. Each is correct for the file it was
      # written in, so nothing in the build notices a release that bumped one and not the
      # other: it ships a wheel whose own MCP server names a different number.
      - run: python tools/check_versions.py
      # The vendored MCP schemas against the digests `NOTICE` pins for them - the half of that
      # pin a push can check. The other half, re-fetching the URLs, needs the network and runs
      # on a schedule (`.github/workflows/mcp-pin.yml`), because a fetch that failed there has
      # to be told apart from a specification revision that moved: this tool exits 1 for drift
      # and 2 for "could not decide", and only the scheduled caller can act on the difference.
      - run: python tools/check_mcp_schema.py
      # The numbers and paths the normative pages state, against the tree that produces
      # them. `check_links.py` says a link resolves and `prose_lint.py` says a page is
      # written well; neither says a page is *true*, and `prose_lint.py` excludes
      # `docs/src` on purpose - so until this line nothing read the docs for facts, and
      # a page quoting a count the code moved went stale with every gate green.
      # `docs/claims.toml` declares the claims and holds no measured value, so a failure
      # is fixed on the page or in the tree and never by editing the declaration.
      - run: python tools/check_doc_claims.py
      # What the port does not carry, held between the three places it is written: the
      # spec's `[[unported]]` rows, the Rust refusals and the Python refusals. Measured,
      # `billet_schultes_1999` was refused by the Python half, carried by the Rust half
      # and declared ported by the spec, and no test could see it - the cross-language
      # test compares cases, and no case stated that value.
      - run: python tools/check_unported.py
      # The skill catalog against the SKILL.md files it points at, and each SKILL.md
      # against the required sections. Needs no `azoth` import, so it runs before the
      # library is built.
      - run: python tools/validate_skills.py
      # The shipped data files against the vendored copies of NeqSim's tables. Needs
      # no NeqSim checkout, because the sources are committed - which is what lets
      # this run here rather than only on a machine that has one.
      - run: python tools/gen_databank.py --check
      # The reaction tables the reactions crate reads, against the vendored copies. The
      # same shape as the line above and for the same reason, and separate from it
      # because those are the component and interaction data and these are the reactions.
      - run: python tools/gen_reaction_data.py --check
      # The baseline keycard against the compiled component data it derives from.
      - run: python tools/gen_keycard.py --check
      # The recorded NeqSim cases against the probe captures they are derived from.
      # Needs no JDK and no NeqSim jar - the captures are committed and the jar is
      # gitignored - which is what lets this gate run here rather than only on a
      # machine that has both.
      - run: python tools/gen_neqsim_cases.py --check
      # The unit vocabulary table against the four artefacts compiled from it - the
      # schema's unit enum, the Rust conversion table, the Python map and the keycard
      # loader's list. One table, one generator, and this is what says the generated
      # copies are current rather than merely agreeing with each other. It needs only
      # jsonschema, installed above.
      - run: python tools/gen_vocabulary.py --check
      # The palette bundle a browser carries, and the model-input table a unit-op form's widget is
      # chosen from. Both are stdlib-only in what they import, and both shell out to `rustfmt` -
      # which is why they sit beside the vocabulary's check rather than in a job of their own: that
      # line already relies on the runner image carrying the toolchain.
      - run: python tools/gen_palette.py --check
      - run: python tools/gen_model_inputs.py --check
      # The guard theorems, against the manifest and the specs. Both are stdlib-only: the
      # checker answers "is every edge-case class owned", and Lean is what answers whether the
      # claims are true - which is the `lean-verify` job's, because it needs the toolchain.
      - run: python tools/gen_guard_theorems.py --check
      - run: python tools/check_guards.py
      # The pages and the Lean tree against each other: a name a page calls proved has to be a
      # declaration, and a proved claim has to name a gated theorem. Stdlib only, like the rest.
      - run: python tools/audit_lean_claims.py --check
      # The domain each card parameter has to lie in, against the schema it is declared in.
      # Stdlib only: it reads the schema and emits both readers' tables.
      - run: python tools/gen_parameter_bounds.py --check

  rust-test:
    name: rust-test
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.rust-test == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # `test_scope.py` diffs against the commit this push starts from, so that commit
          # has to be in the clone; the default fetch-depth of one has only the tip.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # **What this change reaches, which is not the whole workspace.** The full set runs in
      # `.github/workflows/nightly.yml` on a 24-hour cycle. A push runs the crates its diff
      # touches and every crate that depends on them - read off the manifests by
      # `tools/test_scope.py`, never listed here, because a list here would be a second copy
      # of the graph and would be the one that drifts. The *base* comes from `scope`, so the
      # job that decides and the job that runs are looking at one diff.
      - name: the scoped Rust set
        run: |
          python tools/test_scope.py --base "${{ needs.scope.outputs.base }}" \
            ${{ inputs.mode == 'full' && '--full' || '' }} \
            --no-gate --job rust-test > "$RUNNER_TEMP/scope.sh"
          cat "$RUNNER_TEMP/scope.sh"
          bash -e "$RUNNER_TEMP/scope.sh"
      # **The front end's fixtures are the library's own output, and this is what says so.**
      # The check lives in this job rather than in `ui` for one reason: it runs the CLI, so it
      # needs a cargo build, and this job has just made one. The `ui` job's own gate is
      # `test/currency.test.ts`, which asks the module that job builds for the same three
      # documents - a stale fixture fails there whether or not this ran.
      - run: python tools/gen_ui_fixtures.py --check

  rust-lint:
    name: rust-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # **The workspace clippy moved to the nightly.** `cargo clippy -p <the diff's crates>` runs
      # in `rust-test`, where a push needs it; the whole-workspace pass is close-out-shaped and
      # belongs with the rest of the full surface.

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.python-test == 'true'
    env:
      # The scoped set runs instrumented, so the check below can say whether the tests that ran
      # executed the lines the diff changed. One run rather than two.
      AZOTH_COVERAGE: "1"
      # The whole point of this job. Without it, a broken extension build makes
      # every test pass on the Python path while the cross-language agreement
      # this project promises is verified by nothing.
      AZOTH_REQUIRE_RUST: "1"
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
        with:
          # `test_scope.py` diffs against the commit this push starts from.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # `--no-install-project` skips building the package, which matters because
      # the build backend is maturin and building here would need the extension
      # built twice. The extension is built by `maturin develop` below, which
      # installs the package properly.
      #
      # Installing the `dev` extra rather than repeating its contents is what
      # stops the two drifting. They already did: these jobs installed a
      # narrower set than the tests import, so mypy could not see pytest's
      # decorators and the registry-contract test could not shell out to the
      # generator, neither of which failed locally where the full set is present.
      - run: uv sync --extra dev --no-install-project
      # Builds the extension against the venv interpreter, so both backends are
      # available and the cross-implementation tests actually run.
      - run: .venv/bin/maturin develop
      # **What this change reaches, which is not the whole suite.** The full Python tree runs
      # in `.github/workflows/nightly.yml`. A push runs its own models' cases on both
      # backends, the namespaces its diff touches, and the generator checks - the list comes
      # from `tools/test_scope.py`, which reads the specs and the manifests rather than a
      # table kept here.
      #
      # **The trade, stated because it is real**: a push can go green while something the
      # nightly would have caught is red, for up to a day. That is what buys an hour per
      # change back, and the nightly is what makes it safe. A release tag should require a
      # green nightly.
      - name: the scoped Python set
        env:
          # Absent on a runner, but stated so a developer copying this command
          # does not get a different result because their shell sets it.
          PYTHONPATH: ""
        run: |
          python tools/test_scope.py --base "${{ needs.scope.outputs.base }}" \
            ${{ inputs.mode == 'full' && '--full' || '' }} \
            --no-gate --job python-test > "$RUNNER_TEMP/scope.sh"
          cat "$RUNNER_TEMP/scope.sh"
          bash -e "$RUNNER_TEMP/scope.sh"
      # **Every target has to collect something.** An empty collection is a green run over
      # nothing, and it is the one failure a scoped set can hide that a full one cannot.
      - name: every target selects a test
        env:
          PYTHONPATH: ""
        run: |
          python tools/test_scope.py --base "${{ needs.scope.outputs.base }}" \
            ${{ inputs.mode == 'full' && '--full' || '' }} \
            --job python-test --verify-selection
      # **And the tests that ran executed the changed lines.** `--verify-selection` proves the
      # targets collect something; a target can collect forty tests and touch none of the code
      # the diff changed. This writes the document the check reads, from the run above.
      - name: did the scoped set run the changed lines?
        env:
          PYTHONPATH: ""
        run: |
          .venv/bin/python -m coverage json -o coverage.json
          python tools/check_coverage.py \
            --base "${{ needs.scope.outputs.base }}" --json coverage.json
      # The skill tests: smoke checks that the API the skills document still exists.
      # Collected separately because the main run is scoped to python/tests. Not scoped in
      # turn: they read the skills, which no diff here claims, and they are quick.
      - run: .venv/bin/python -m pytest skills
        env:
          PYTHONPATH: ""

  wheel-data:
    name: wheel-data
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.wheel-data == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install --upgrade pip maturin
      # A release build, because this job is about the artifact a user installs
      # rather than about the code.
      - run: maturin build --release -o dist
      # A venv of its own, so the wheel is installed rather than the source tree.
      # `python/src` is deliberately not on the path: the whole point is to run
      # what a user would get.
      - run: python -m venv /tmp/wheel-venv
      - run: /tmp/wheel-venv/bin/pip install dist/*.whl
      # Run from outside the repository. From inside it, `azoth/_data.py` walks up
      # and finds `data/` at the repo root, so every check below would pass on a
      # wheel that shipped no data at all - which is the failure this job exists
      # for. The script also asserts that the resolved files are not in the repo,
      # so a run that accidentally had the source tree in reach fails rather than
      # passing quietly.
      - name: Resolve the data from an installed wheel
        run: cd /tmp && /tmp/wheel-venv/bin/python "$GITHUB_WORKSPACE/tools/check_wheel_data.py"

  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      # pytest is required here even though nothing is run with it: mypy checks
      # the tests, and cannot resolve `@pytest.mark.parametrize` without it.
      - run: uv sync --extra dev --no-install-project
      - run: .venv/bin/ruff check
      - run: .venv/bin/ruff format --check
      # Strict, over both the library and its tests.
      - run: .venv/bin/mypy

  ui:
    name: ui
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `wasm-pack build` compiles the crate for this target. The workspace's
          # `panic = "unwind"` is inert on it - the crate's own module doc records that.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Pinned rather than `latest`, for the reason `docs-build` installs mdbook with
      # `--locked`: a build tool that can change under CI is a failure nobody can reproduce.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"
      - run: npm ci
        working-directory: ui
      # **Before `npm test`.** `ui/src/wasm/pkg/` is gitignored, so the browser test has no module
      # to load until this has run - `npm run build` runs it again, which is accepted rather than
      # worked around, because the script is what a developer runs.
      - run: npm run wasm
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: npm run build
        working-directory: ui
      # **The boundary the Rust tests cannot reach.** Every function in `azoth-wasm` is a call
      # into the wire layer and a string out, so what is untested there is the seam itself: that
      # a wasm-bindgen constructor works, that a `Result` arrives as a JS exception rather than a
      # trap, and that the module carries its own palette with no filesystem and no fetch. The
      # file documents exactly these two commands and nothing ran them.
      - name: the wasm boundary, driven the way a browser drives it
        run: |
          wasm-pack build crates/azoth-wasm --target nodejs --out-dir pkg --release \
            --no-pack --no-typescript
          node crates/azoth-wasm/test/smoke.mjs crates/azoth-wasm/pkg/azoth_wasm.js

  docs-build:
    name: docs-build
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.docs-build == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The docs tools are Rust binaries; caching them keeps this job from
          # spending minutes compiling mdBook and its preprocessors every run.
          cache-all-crates: true
      - name: Install mdBook and preprocessors
        run: |
          cargo install mdbook mdbook-katex mdbook-mermaid --locked
      - name: Check internal links
        run: python3 tools/check_links.py
      - name: Build the book
        run: mdbook build docs

  docs-drift:
    name: docs-drift
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.docs-drift == 'true'
    env:
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      # The generators import the runtime to render bounds, so the full dev set
      # is needed here - see the note in tools/gen_docs.py.
      - run: uv sync --extra dev --no-install-project
      # `gen_docs` and `gen_registry` need only the pure-Python runtime, but
      # `gen_stub` asks `azoth.process` for each model's signature - and that
      # namespace reaches the Stream layer, which is `azoth._core`. Without a
      # build here it failed at import, which is why this step exists.
      - run: .venv/bin/maturin develop
      # The gate that makes "the docs are generated from the registry" true
      # rather than aspirational. Regenerate everything and fail on any diff:
      # a spec edited without regenerating its docs, registry, or tests is
      # caught here and nowhere else.
      - name: Regenerate everything
        run: |
          .venv/bin/python tools/gen_vocabulary.py
          .venv/bin/python tools/gen_docs.py
          .venv/bin/python tools/gen_registry.py
          .venv/bin/python tools/gen_models.py
          .venv/bin/python tools/gen_python_record_outputs.py
          .venv/bin/python tools/gen_stub.py
          .venv/bin/python tools/gen_model_inputs.py
          .venv/bin/python tools/gen_python_registry.py
          .venv/bin/python tools/gen_python_transport.py
          .venv/bin/python tools/gen_python_register.py
          .venv/bin/python tools/gen_guard_theorems.py
          .venv/bin/python tools/gen_dispatch.py
          .venv/bin/python tools/gen_python_records.py
          .venv/bin/python tools/gen_python_wrappers.py
          .venv/bin/python tools/gen_python_bridge.py
          .venv/bin/python tools/gen_python_result.py
          .venv/bin/python tools/gen_rust_model_records.py
          .venv/bin/python tools/gen_parameter_bounds.py
      - name: Fail if anything drifted
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run:"
            echo "::error::  python tools/gen_vocabulary.py && python tools/gen_docs.py"
            echo "::error::  python tools/gen_registry.py && python tools/gen_models.py"
            echo "::error::  python tools/gen_stub.py && python tools/gen_model_inputs.py"
            echo "::error::  python tools/gen_python_registry.py"
            echo "::error::  python tools/gen_python_transport.py"
            echo "::error::  python tools/gen_python_register.py"
            echo "::error::  python tools/gen_guard_theorems.py"
            echo "::error::  python tools/gen_dispatch.py"
            echo "::error::  python tools/gen_python_records.py"
            echo "::error::  python tools/gen_python_wrappers.py"
            echo "::error::  python tools/gen_python_bridge.py"
            echo "::error::  python tools/gen_python_result.py"
            echo "::error::  python tools/gen_rust_model_records.py"
            echo "::error::  python tools/gen_parameter_bounds.py"
            exit 1
          fi

  lean-verify:
    name: lean-verify
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.lean-verify == 'true'
    # Mathlib's oleans come from the cache rather than from a build of Mathlib.
    # Without `cache get` this job compiles Mathlib, which is nearer an hour than
    # a minute - so the cache step is not an optimisation, it is what makes the
    # job possible, and the timeout says so rather than leaving it to the default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      # The toolchain is pinned by lean/lean-toolchain and fetched on first use;
      # the dependencies are pinned by lean/lake-manifest.json, which is committed.
      - name: Fetch the Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build
        working-directory: lean
        run: lake build
      # Every theorem this development claims, and the axioms it rests on. This is
      # a completeness gate rather than a correctness one: it reports the
      # transitive axiom set of each proof term, so a `sorry` anywhere in the
      # dependency chain fails here - including one inside the vendored
      # `lean/vendor/lean-units/`, which a scan over `Azoth/` cannot see.
      - name: The axiom gate
        run: python3 tools/check_lean_axioms.py

  provenance:
    name: provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `git describe` cannot see the tag without the full history, and the
          # record would silently claim "no tag" for a tagged build.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Generated here so every build produces a reviewable record, not only
      # tagged releases. It is unsigned on a branch, and says so.
      - run: python tools/provenance.py --out provenance.json
      - name: Show what it recorded
        run: |
          python - <<'EOF'
          import json
          record = json.load(open("provenance.json"))
          git = record["git"]
          print(f"commit {git['commit']} tag {git['tag']} dirty {git['dirty']}")
          missing = [
              f"{c['id']}:{f['path']}"
              for c in record["calcs"]
              for f in [c["spec"], *c["code"], *c["tests"]]
              if not f["present"]
          ]
          print(f"{len(record['calcs'])} calc(s)")
          if missing:
              print("files recorded as absent:")
              for m in missing:
                  print(f"  {m}")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: provenance.json

  validation:
    name: validation
    runs-on: ubuntu-latest
    needs: scope
    if: needs.scope.outputs.validation == 'true'
    env:
      # External validation cases, so they need the real implementation on both
      # sides rather than a skip that quietly verifies nothing.
      AZOTH_REQUIRE_RUST: "1"
      VIRTUAL_ENV: ${{ github.workspace }}/.venv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev --no-install-project
      - run: .venv/bin/maturin develop
      # A validation case is an external check on a calculation. Anything that
      # disagrees with the recorded numbers fails here.
      - run: .venv/bin/python -m pytest python/tests/validation
        env:
          PYTHONPATH: ""
