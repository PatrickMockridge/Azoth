name: Pages

# **The editor, where a browser can reach it.** The library compiles to wasm and the editor
# already runs entirely in the page, so publication is a static artifact and not a deployment:
# there is no server, no session and nothing to authenticate. `azoth serve` is the other door and
# is not used here.
#
# The build is repeated rather than borrowed from CI, because a deploy has to be gated on the
# artifact it is about to publish: `npm run build` runs the type check, `npm test` the wire and
# gesture tests, and `check:dist` asks the built page for its own files under `/Azoth/`.
on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - "crates/azoth-wasm/**"
      - "crates/azoth-core/**"
      - "crates/azoth-eos/**"
      - "crates/azoth-hydraulics/**"
      - "crates/azoth-thermal/**"
      - "crates/azoth-reactions/**"
      - "crates/azoth-standards/**"
      - "crates/azoth-process/**"
      - "crates/azoth-sheets/**"
      - "specs/unit_ops/**"
      - "specs/flowsheets/**"
      - "specs/calcs/**"
      - "specs/calcbooks/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer main supersedes an older one rather than queueing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build the editor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # `wasm-pack build` compiles the crate for this target, as the `ui` CI job does.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Pinned, for the same reason the `ui` CI job pins it: a build tool that can change under
      # a deploy is a failure nobody can reproduce.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: "v0.13.1"
      - run: npm ci
        working-directory: ui
      - run: npm run build
        working-directory: ui
        env:
          # Shown in the editor, so a cached page says which build it is.
          VITE_AZOTH_BUILD: ${{ github.sha }}
      - run: npm test
        working-directory: ui
      - run: npm run check:dist
        working-directory: ui
      # `enablement: true` asks GitHub to turn Pages on when it is not yet configured; a token
      # that cannot do that fails here rather than at the deploy with a less obvious message.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ui/dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: [build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
