name: nightly

# The full gate, once a day. **This is where "everything" lives.**
#
# A push runs `python tools/test_scope.py --plan`, which decides per job whether the diff
# reaches it, and eleven of `ci.yml`'s twelve jobs are behind that decision. The whole
# surface - every job, both languages, every generator, the Lean build, the front end, the
# wheel - is this workflow's, on a 24-hour cycle and on a runner with the memory a developer
# box does not have. So a green push is not a claim that the tree is sound; it is a claim that
# nothing *this change reaches* is broken, and this is what closes the gap within a day.
#
# **It calls `ci.yml` rather than repeating it.** `mode: full` makes `--plan` say `true` for
# every job, so "the nightly runs everything" is a fact about one list rather than a claim
# about two that have to be kept in step. Before this it ran the tests and none of the other
# twenty-five gates, which is how a job can be described as complete and not be.
#
# **A red nightly is a finding, not scenery.** It is the only thing that runs the tests no
# diff claimed, so it is the only place a cross-cutting break shows up before a release.
# Triage it before starting the next tranche; a red one left standing makes every later red
# unreadable.

on:
  schedule:
    # 04:17 UTC. Not on the hour and not on a half hour: every repository on GitHub that asks
    # for "nightly" lands on the same few minutes, and the queue is worst exactly there.
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  full:
    uses: ./.github/workflows/ci.yml
    with:
      mode: full
