# The catalog of azoth skills: the single machine-readable source of truth.
#
# An agent discovers a skill by reading this file — the name, the `USE WHEN:` trigger
# in the description, and the path to the `SKILL.md` it should open. Nothing here is
# repeated in the `SKILL.md`, so there is no second copy to drift.
#
# `calculation_basis` says how a skill's numbers are produced: `azoth` drives the
# validated library, `screening` is an educational placeholder, `advisory` is
# methodology with no numeric output, `data-retrieval` returns data, and `hybrid`
# mixes screening with at least one azoth step. An optional `tranche` names the port
# tranche (P0–P12) that will back a `screening` skill; `azoth`-basis skills omit it.
#
# Validated by tools/validate_skills.py.

catalog_version = "1.0"

