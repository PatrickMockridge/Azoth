not_vendored:
  - id: neqsim/COMP_EXT.csv
    reason: >-
      no-implementation: 86 MB and 76,705 rows of heavy and characterised fluids. A
      plus-fraction needs a characterisation method - a distillation curve, a set of
      pseudo-components - and this library has none, so the rows would be unreachable.
  - id: "neqsim/UNIFAC*.csv"
    reason: >-
      no-implementation: activity-coefficient group contributions, twelve files. An
      activity model is a different kind of calculation from an equation of state.
  - id: neqsim/PitzerParameters.csv
    reason: "no-implementation: electrolyte activity coefficients, and the ions are excluded from the component rows."
  - id: neqsim/COMPSALT.csv
    reason: "no-implementation: salt solubility products, and no electrolyte model exists here."
  - id: neqsim/element.csv
    reason: "no-implementation: the atoms making up each component, which only a reaction model reads."
  - id: "neqsim/REACTIONDATA*.csv"
    reason: "no-implementation: reaction kinetics and equilibrium, and no reactor exists here. Four files."
  - id: neqsim/ReactionKSPdata.csv
    reason: "no-implementation: solubility products for the reaction models."
  - id: neqsim/GibbsReactDatabase/
    reason: "no-implementation: Gibbs free-energy minimisation, which is a reactor, not a flash."
  - id: "neqsim/ISO6976constants*.csv"
    reason: "no-implementation: fiscal metering constants for natural-gas energy content, which is a reporting standard rather than a calculation."
  - id: neqsim/fiscal/
    reason: "no-implementation: fiscal metering parameters."
  - id: neqsim/powergeneration/
    reason: "no-implementation: gas-turbine catalogues and CO2 tax tables, which are economics rather than physics."
  - id: neqsim/AdsorptionParameters.csv
    reason: "no-implementation: adsorption isotherms, and no adsorption model exists here."
  - id: neqsim/chemical_compatibility_rules.csv
    reason: "no-implementation: material-compatibility rules, which are a design aid rather than a calculation."
  - id: neqsim/scale_remediation.csv
    reason: "no-implementation: scale-treatment guidance, which is a knowledge base rather than a model."
  - id: neqsim/STOCCOEFDATA.csv
    reason: "no-implementation: stoichiometric coefficients, which only a reaction model reads."
  - id: neqsim/MBWR32param.csv
    reason: "no-implementation: a 32-parameter modified Benedict-Webb-Rubin equation of state, which is a different equation from a cubic."
  - id: neqsim/PIPEDATA.csv
    reason: "no-implementation: pipe schedule dimensions, which a line-sizing calculation would read and this library does not perform."
