              no-implementation: a cubic equation of state has no notion of an ion, and
              NeqSim fills these rows' critical columns with one shared default - 29 rows
              carrying the same Pc, omega and Vc is not a coincidence.
          - selector: "COMPTYPE == '0' (the column is empty)"
