          - citation
        rows:
          - selector: "COMPTYPE == 'ion'"
            count: 62
            reason: >-
              not-ported: the electrolyte models; NeqSim's `PhaseDesmukhMather` and
              `PitzerScaleActivityModel`. NeqSim fills these rows' critical columns with
              one shared default, because a cubic has no notion of an ion - 29 rows
              carrying the same Pc, omega and Vc is not a coincidence - so vendoring them
              before the electrolyte model exists would ship filler as data.
          - selector: "COMPTYPE == '0' (the column is empty)"
            count: 18
            reason: >-
              not-a-value: a row with no type has no critical constants to read
              either, so there is nothing to carry across.
          - selector: "COMPTYPE in {ice, salt, seawater, asphaltene}"
            count: 4
            reason: >-
              not-ported: hydrate, electrolyte and asphaltene models; NeqSim's
              `PhaseHydrate`, `ComponentSalt` and `pvtsimulation/flowassurance/`. Each is
              a phase or a mixture rather than a substance, and the model that would read
              the row is not ported.
