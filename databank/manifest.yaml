not_vendored:
  # Files NeqSim ships that azoth does not vendor, each with the model that would
  # read it. `not-ported` here means the same thing it means for a column: NeqSim has
  # the capability and this library has not ported it, so the entry names where.
  - id: neqsim/COMP_EXT.csv
    reason: >-
      not-ported: plus-fraction characterisation; NeqSim's `pvtsimulation/`. 86 MB and
      76,705 rows of heavy and characterised fluids, and a plus-fraction is a
      distillation curve and a set of pseudo-components rather than a critical
      constant. Unreachable until that characterisation exists.
  - id: "neqsim/UNIFAC*.csv"
    reason: "not-ported: UNIFAC group contributions, twelve files; NeqSim's `PhaseGEUnifac`."
  - id: neqsim/PitzerParameters.csv
    reason: "not-ported: electrolyte activity coefficients; NeqSim's `PitzerScaleActivityModel`."
  - id: neqsim/COMPSALT.csv
    reason: "not-ported: salt solubility products; NeqSim's `ComponentSalt` and the electrolyte phases."
  - id: neqsim/element.csv
    reason: "not-ported: reaction stoichiometry; NeqSim's `chemicalreactions/`."
  - id: "neqsim/REACTIONDATA*.csv"
    reason: "not-ported: reaction kinetics and equilibrium, four files; NeqSim's `chemicalreactions/`."
  - id: neqsim/ReactionKSPdata.csv
    reason: "not-ported: reaction solubility products; NeqSim's `chemicalreactions/`."
  - id: neqsim/GibbsReactDatabase/
    reason: "not-ported: Gibbs free-energy minimisation; NeqSim's `thermodynamicoperations/`."
  - id: "neqsim/ISO6976constants*.csv"
    reason: "not-ported: natural-gas energy content to ISO 6976; NeqSim's `physicalproperties/`."
  - id: neqsim/fiscal/
    reason: "not-ported: fiscal metering; NeqSim's `process/measurementdevice/`."
  - id: neqsim/powergeneration/
    reason: "not-ported: gas-turbine models and CO2 tax tables; NeqSim's `process/equipment/`."
  - id: neqsim/AdsorptionParameters.csv
    reason: "not-ported: adsorption isotherms; NeqSim's `physicalproperties/interfaceproperties/solidadsorption`."
  - id: neqsim/chemical_compatibility_rules.csv
    reason: "not-ported: material compatibility; NeqSim's `process/` material-selection models."
  - id: neqsim/scale_remediation.csv
    reason: "not-ported: mineral scale; NeqSim's `pvtsimulation/flowassurance/`."
  - id: neqsim/STOCCOEFDATA.csv
    reason: "not-ported: reaction stoichiometry; NeqSim's `chemicalreactions/`."
  - id: neqsim/MBWR32param.csv
    reason: "not-ported: the 32-parameter Benedict-Webb-Rubin equation; NeqSim's `PhaseBWRSEos`."
