# What azoth takes from each upstream file, and why it takes no more.
#
# Read with `tools/manifest.py`, checked by `tools/check_manifest.py`. Every column
# of every vendored upstream is listed here exactly once, and the check fails if that
# stops being true in either direction - so this file cannot describe a tree that no
# longer exists.
#
# A reason is `<prefix>: <text>` from a closed list. The prefixes, and what each one
# is for, are in `tools/manifest.py`'s docstring. The counting matters: the number of
# columns marked `not-ported` is the porting backlog, and each one names the NeqSim
# model that would close it. `tools/check_manifest.py` prints the tally - a grep does
# not work, because a reason is a quoted flow mapping.
schema_version: 1

