id: hydraulics.friction_factor_swamee_jain
name: Swamee-Jain friction factor (explicit)
equation: "f = 0.25 / (log10(relative_roughness / 3.7 + 5.74 / Re**0.9))**2"
latex: 'f = \frac{0.25}{\left[\log_{10}\!\left(\frac{\varepsilon/D}{3.7} + \frac{5.74}{Re^{0.9}}\right)\right]^{2}}'

source:
  standard: Swamee, P. K.; Jain, A. K. (1976)
  edition: "Journal of the Hydraulics Division, ASCE, 102(5), 657-664"
  equation: "\"Explicit equations for pipe-flow problems\""

verification:
  status: verified
  notes: >
    Citation confirmed: Swamee, P.K. and Jain, A.K. (1976), "Explicit equations
    for pipe-flow problems", Journal of the Hydraulics Division, ASCE, 102(5),
    657-664. This is the explicit approximation to the Colebrook equation, and is
    provided alongside it so callers can trade a small accuracy loss for the
    absence of an iteration. It is NOT a replacement for Colebrook in the sense
    of being more correct - it is an approximation of it.

inputs:
  re:
    unit: dimensionless
    description: Reynolds number
  relative_roughness:
    unit: dimensionless
    description: "absolute roughness divided by internal diameter (epsilon / D)"

outputs:
  f:
    unit: dimensionless
    description: Darcy-Weisbach friction factor

valid_range:
  - quantity: re
    min: 0
    min_inclusive: false
    severity: error
    rationale: Re**0.9 is zero at Re = 0 and the 5.74/Re**0.9 term is singular

  - quantity: relative_roughness
    min: 0
    severity: error
    rationale: negative roughness is unphysical

  - quantity: re
    min: 5000
    min_inclusive: false
    severity: warning
    rationale: >
      Below Re = 5000 the equation is outside the range stated in the original
      paper, where the approximation was fitted. It still returns a number, so
      this is a warning rather than an error, but that number is not covered by
      the paper's accuracy claim.

  - quantity: re
    max: 1.0e+8
    max_inclusive: false
    severity: warning
    rationale: upper Reynolds-number bound stated in the original paper

  - quantity: relative_roughness
    min: 1.0e-6
    min_inclusive: false
    severity: warning
    rationale: lower relative-roughness bound stated in the original paper

  - quantity: relative_roughness
    max: 1.0e-2
    max_inclusive: false
    severity: warning
    rationale: >
      Upper relative-roughness bound stated in the original paper (10**-2). NOTE:
      the literature is not consistent here - several widely used references quote
      the upper bound as 5e-2 instead, and a few quote 4e-5 as the lower bound.
      This spec encodes the original paper's figures. The value last listed in
      `references` is the comparison against Colebrook that justifies the loose
      tolerance on the agreement test.

assumptions:
  - fully turbulent flow
  - circular pipe running full
  - steady, fully developed, single-phase, incompressible flow
  - uniform sand-grain roughness of height epsilon
  - Newtonian fluid
  - accuracy within about 1% of the Colebrook equation over the stated range

references:
  - Swamee, P. K.; Jain, A. K. (1976). "Explicit equations for pipe-flow problems." Journal of the Hydraulics Division, ASCE, 102(5), 657-664.
  - Colebrook, C. F. (1939). "Turbulent flow in pipes, with particular reference to the transition region between the smooth and rough pipe laws." Journal of the Institution of Civil Engineers, 11(4), 133-156. (the implicit equation this approximates)

worked_example:
  source: derived from the equation above
  derivation: >
    For Re = 1.0e5 and relative_roughness = 4.6e-4 (commercial steel,
    epsilon = 0.046 mm in a 100 mm pipe - the same case as the Colebrook spec, so
    the two can be compared directly):
      relative_roughness/3.7 = 1.2432432432432433e-4
      5.74/Re**0.9           = 1.815147376936649e-4
      sum                    = 3.0583906201798924e-4
      log10(sum)             = -3.5145070469306843
      f = 0.25 / (-3.5145070469306843)**2 = 0.02024003092624823
    The Colebrook equation gives 0.02016203204441411 for the same inputs, so the
    explicit approximation is 0.39% high here - comfortably inside the paper's
    stated 1% over this range.
  inputs: { re: 100000.0, relative_roughness: 4.6e-4 }
  expected: { f: 0.0202400309 }
  tolerance: 1.0e-6

implementations:
  python: azoth.hydraulics.friction_factor_swamee_jain
  rust: azoth_hydraulics::friction_factor_swamee_jain

tests:
  - id: commercial_steel_worked_example
    type: worked_example
    status: active

  - id: agrees_with_colebrook_within_one_percent
    type: reference
    status: active
    source: >
      Cross-method comparison against the Colebrook equation, which is the
      quantity this approximation exists to approximate. Compared at Re = 1e5 and
      Re = 1e6 for relative_roughness = 4.6e-4. The paper claims agreement within
      1% over the stated range; the tolerance below is set to that claim, so a
      regression that broke the approximation would fail against the published
      accuracy rather than against a number we chose ourselves.
    note: >
      This test needs BOTH friction factor implementations, so it also serves as
      the cross-check that the two correlations in this slice are consistent with
      each other. The expected value is the Colebrook result.

      The point is strictly inside the stated range, not on its boundary. That is
      deliberate: measured behaviour shows the explicit approximation degrading
      near the lower limit, reaching 1.39% at Re = 5000 against the paper's
      headline 1% claim, and returning to 0.59% by Re = 1e4. The published figure
      is therefore not uniform across the claimed range, and asserting it at the
      boundary would have been asserting something the paper does not actually
      deliver there. The boundary case is pinned by a separate test in the
      Colebrook suite rather than hidden by a loosened tolerance.
    inputs: { re: 100000.0, relative_roughness: 4.6e-4 }
    expected: { f: 0.0201620320 }
    tolerance: 1.0e-2

  - id: exact_smooth_pipe_limit
    type: reference
    status: active
    source: >
      With relative_roughness = 0 the equation reduces to
      f = 0.25 / (log10(5.74/Re**0.9))**2, which is explicit and can be evaluated
      by hand. At Re = 1e5: 5.74/Re**0.9 = 1.815147376936649e-4, its log10 is
      -3.741088107602027, so f = 0.25/13.995740... = 0.01786257789. This pins the
      implementation against a directly computable value rather than against the
      other implementation. For reference, Colebrook gives 0.01798977 in the same
      smooth limit - 0.7% apart, which is the price of the explicit form.
    inputs: { re: 100000.0, relative_roughness: 0.0 }
    expected: { f: 0.01786257789 }
    tolerance: 1.0e-4

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
