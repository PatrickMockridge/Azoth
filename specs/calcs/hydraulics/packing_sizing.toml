type = "reference"
status = "active"
source = "The capture's `mellapak_250y_absorber_sized` row: a **structured** packing, whose factor comes from its own row of the table rather than Pall-Ring-50's. Its raw diameter is `0.2973` m, below the table's floor, so the answer is the floor `0.3` m - a port that sized on the raw number would report a vessel `0.2973` m across, which is not a vessel.\n"
tolerance = 1e-9
