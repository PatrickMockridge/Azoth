id: hydraulics.pump_power
name: Pump shaft power from flow, head and efficiency
equation: "power = rho * g * q * H / eta"
latex: 'P = \frac{\rho\,g\,Q\,H}{\eta}'

source:
  standard: "standard pump hydraulics; the hydraulic-power relation in any fluids text"

notes: >
  This is the commonest relation in pump engineering: hydraulic power is
  `rho * g * Q * H`, and dividing by the efficiency gives the shaft power the
  motor has to supply. It is reproduced in every pump handbook and fluids text.

  What has NOT been done is checking this spec against a named source, which is
  why `source.equation` is left unstated rather than quoting an equation number.
  No specific standard is claimed in `source.standard` either: the relation is
  too general to belong to one, and naming whichever handbook happened to be at
  hand would be a citation chosen for how it looks.

  `unverified` rather than `source_needed`, on the distinction the schema draws:
  nothing about the physics is in doubt, only whether anyone has opened a source
  and checked the form this spec writes down. The worked example is derived from
  the equation and runs, which `source_needed` would forbid.

  # `g` is a constant, not an input

  `g = 9.80665 m/s**2`, standard gravity. This is a *defined* value, not a
  measured one - the CGPM fixed it exactly in 1901 - which puts it in the same
  category as pi rather than in the same category as a fluid's density. Baking a
  definition into an equation does not hide an assumption in the way baking in a
  measured property would, and it keeps the interface to the four quantities a
  caller actually knows.

  The alternative was to take `g` as a fifth input, which would have meant adding
  `m/s**2` to the unit vocabulary. It was rejected as a worse default rather than
  as more work: a caller who has to supply `g` can supply a wrong one, and local
  gravity varies by about 0.3% with latitude and a little more with altitude -
  far below the uncertainty in a pump efficiency that is itself an input. A
  caller who does need local gravity can scale the result by `g_local / 9.80665`,
  and the calibration tools all report head in metres of the pumped fluid, which
  is what this calc takes.

  # Why there are no warning bounds

  Pump efficiency is not a correlation with a validated range; it is a number the
  caller supplies from a manufacturer's curve. A band below some efficiency would
  read as validation while asserting something no source states - the same
  reasoning as `thermal.conduction_plane_wall`. What can be checked is checked:
  efficiency outside `(0, 1]` is unphysical rather than merely unusual, and it is
  an error.


inputs:
  rho:
    unit: kg/m**3
    description: >
      density of the pumped fluid. Taken as constant across the pump, so a fluid
      whose density changes appreciably through it - a gas, or a liquid near its
      boiling point - is not described by one value.
  q:
    unit: m**3/s
    description: >
      volumetric flow rate. A magnitude: the sign is not modelled, and a negative
      value is rejected rather than read as reversed flow.
  H:
    unit: m
    description: >
      head developed by the pump, in metres of the pumped fluid - the *delivered*
      or useful head, not the head the impeller generates before its own internal
      losses. Those losses are what `eta` accounts for, so counting them in `H` as
      well would apply them twice.
  eta:
    unit: dimensionless
    description: >
      overall pump efficiency: hydraulic power delivered divided by shaft power
      supplied. Between 0 and 1. This is the pump's efficiency, not the
      motor's - a motor efficiency is a separate loss between the shaft and the
      electrical supply, and folding it in here would make the result a different
      quantity.

outputs:
  power:
    unit: W
    description: >
      shaft power the pump must be supplied with. Always at least the hydraulic
      power `rho * g * q * H`, since dividing by an efficiency no greater than 1
      cannot reduce it.

valid_range:
  - quantity: rho
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      power scales linearly with density, so a non-positive density would give a
      zero or negative shaft power - a number that is wrong rather than merely out
      of range.

  - quantity: q
    min: 0
    severity: error
    rationale: >
      flow is a magnitude and the sign is not modelled, so a negative value is a
      caller error rather than reversed flow. Zero is allowed and correct: no flow
      moves no fluid, so no power is required.

  - quantity: H
    min: 0
    severity: error
    rationale: >
      a negative head means the machine is extracting energy from the fluid, which
      is a turbine and a different calculation. Zero is allowed and gives zero
      power: developing no head needs no power.

  - quantity: eta
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      `eta` is a divisor, so zero is singular - and physically it would mean a pump
      requiring infinite shaft power to deliver finite hydraulic power.

  - quantity: eta
    max: 1
    severity: error
    rationale: >
      An efficiency above 1 would mean more hydraulic power out than shaft power
      in. That is not an engineering uncertainty to warn about but a violation of
      the first law, so it is rejected rather than flagged. The bound is inclusive
      because 1 is the ideal pump: lossless, and a legitimate limiting case.

assumptions:
  - steady state; the flow and head are not changing with time
  - the fluid is incompressible and its density is constant through the pump
  - "`H` is the total head developed, including the static lift, the friction and
    fitting losses in the circuit, and any velocity-head difference between the
    pump's inlet and outlet. This calc does not compute any of those - it converts
    a head the caller already knows into a power."
  - the pump is a single unit, not stages in series or machines in parallel
  - "`eta` is the pump's own efficiency at the operating point. It is not the
    motor's, and it is not a wire-to-water figure. NOT CHECKED - it cannot be,
    there is nothing here to check it against."
  - the operating point is on the pump's curve rather than beyond its range. A pump
    run far outside its curve can have an efficiency very different from the one
    quoted, and nothing in these four inputs reveals that.
  - no account of the fluid's vapour pressure; cavitation is not modelled and NPSH
    is a separate calculation

references:
  - "Standard gravity: the 1901 CGPM resolution fixed it at exactly 9.80665 m/s**2. Cited as a definition, not as the source of the equation."
  - "The relation itself is general pump engineering, reproduced in every pump handbook and fluids text. No specific source is claimed - see `notes`."

worked_example:
  source: derived from the equation above
  derivation: >
    Water at 20 C pumped at 10 L/s against 30 m of head by a pump of 75% efficiency:
      rho = 998 kg/m**3, q = 0.01 m**3/s, H = 30 m, eta = 0.75, g = 9.80665 m/s**2

      rho * g   = 998 * 9.80665        = 9787.036699999999 W/(m**3/s)
      * q       = 9787.036699999999 * 0.01 = 97.87036699999999
      * H       = 97.87036699999999 * 30   = 2936.1110099999996
      / eta     = 2936.1110099999996 / 0.75 = 3914.8146799999995 W

    The intermediate `rho * g * q * H` is worth naming: it is 2936.111 W, the
    *hydraulic* power delivered to the fluid. The shaft power is that divided by the
    efficiency, so 3914.815 W - which is the answer, and the reason the result is
    always at least the hydraulic power.
  inputs: { rho: 998.0, q: 0.01, H: 30.0, eta: 0.75 }
  expected: { power: 3914.81468 }
  tolerance: 1.0e-12

implementations:
  python: azoth.hydraulics.pump_power
  rust: azoth_hydraulics::pump_power

tests:
  - id: water_10_litres_per_second_worked_example
    type: worked_example
    status: active

  - id: denser_fluid_different_operating_point
    type: reference
    status: active
    source: >
      Derived from the equation above, with a different fluid, flow, head and
      efficiency from the worked example, so an implementation that had hardcoded
      the worked example's answer would fail. A brine-like fluid at 1200 kg/m**3,
      50 L/s, 12 m and 60% efficiency:
        rho * g = 1200 * 9.80665 = 11767.98
        q * H / eta = 0.05 * 12 / 0.60 = 1.0
        power = 11767.98 * 1.0 = 11767.98 W
      The flow, head and efficiency were chosen to make `q * H / eta` exactly 1, so
      the expected value is `rho * g` and can be read off by hand without a
      calculator - which makes this a check a reader can perform rather than one
      they have to trust.
    inputs: { rho: 1200.0, q: 0.05, H: 12.0, eta: 0.60 }
    expected: { power: 11767.98 }
    tolerance: 1.0e-12

  - id: an_ideal_pump_delivers_the_hydraulic_power_exactly
    type: reference
    status: active
    source: >
      Derived from the equation above. At eta = 1 the pump is lossless, so the shaft
      power must equal the hydraulic power `rho * g * q * H` and nothing else should
      be left in the expression:
        power(eta=1) = 998 * 9.80665 * 0.01 * 30 / 1 = 2936.1110099999996 W
      This pins the efficiency term rather than the whole formula. A dropped or
      inverted `eta` would still produce a plausible number at the worked example's
      0.75 - and would be exactly right here, which is the point: it separates the
      two halves of the equation so a failure says which half broke.
    inputs: { rho: 998.0, q: 0.01, H: 30.0, eta: 1.0 }
    expected: { power: 2936.11101 }
    tolerance: 1.0e-12

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
    note: >
      The same physical operating point described in SI and in US customary units
      must give the same shaft power in watts. Density, flow and head all carry
      units and all three are converted, so any accidental factor between them
      shows up immediately.

  - id: monotonic
    type: property
    property: monotonic
    status: active
    note: >
      Shaft power must rise with density, flow and head, and fall with efficiency.
      These are the four partial derivatives, and between them they catch an
      inverted ratio - which the point-value tests above might not, since a wrong
      formula can still be right at one operating point.
