[[valid_range]]
quantity = "column_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the four areas are its square\n"
[[valid_range]]
quantity = "tray_spacing"
min = 0
min_inclusive = false
severity = "error"
rationale = "the capacity factor is read at it and the backup is judged against it\n"
[[valid_range]]
quantity = "weir_height"
min = 0
min_inclusive = true
severity = "error"
rationale = "a weir of no height is a tray with no liquid head, which is degenerate but readable\n"
[[valid_range]]
quantity = "hole_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the weeping minimum and the residual head both read it, and the latter divides by it\n"
[[valid_range]]
quantity = "hole_area_fraction"
min = 0
min_inclusive = false
severity = "error"
rationale = "the hole area is the active area times it, and both hole velocities divide by that\n"
[[valid_range]]
quantity = "downcommer_area_fraction"
min = 0
min_inclusive = true
max = 0.5
max_inclusive = false
severity = "error"
rationale = "the active area is `1 - 2` of it, so half leaves no bubbling area\n"
[[valid_range]]
quantity = "vapor_mass_flow"
min = 0
min_inclusive = false
severity = "error"
rationale = "the flow parameter and both velocities divide by it\n"
[[valid_range]]
quantity = "liquid_mass_flow"
min = 0
min_inclusive = false
severity = "error"
rationale = "the weir crest and the flow parameter both read it\n"
[[valid_range]]
quantity = "vapor_density"
min = 0
min_inclusive = false
severity = "error"
rationale = "the volumetric flow, the F-factor and the flooding velocity all divide by it\n"
[[valid_range]]
quantity = "liquid_density"
min = 0
min_inclusive = false
severity = "error"
rationale = "every head in millimetres of liquid is converted by it\n"
[[valid_range]]
quantity = "liquid_viscosity"
min = 0
min_inclusive = false
severity = "error"
rationale = "O'Connell's efficiency takes its logarithm\n"
[[valid_range]]
quantity = "surface_tension"
min = 0
min_inclusive = false
severity = "error"
rationale = "the flooding correction raises it to the 0.2\n"
[[valid_range]]
quantity = "relative_volatility"
min = 0
min_inclusive = false
severity = "error"
rationale = "O'Connell's efficiency takes its logarithm too\n"
[implementations]
python = "azoth.hydraulics.tray_hydraulics"
rust = "azoth_hydraulics::tray_hydraulics"
