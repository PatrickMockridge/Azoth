id = "hydraulics.pump_power"
name = "Pump shaft power from flow, head and efficiency"
equation = "power = rho * g * q * H / eta"
latex = '''P = \frac{\rho\,g\,Q\,H}{\eta}'''
assumptions = ["steady state; the flow and head are not changing with time", "the fluid is incompressible and its density is constant through the pump", "`H` is the total head developed, including the static lift, the friction and fitting losses in the circuit, and any velocity-head difference between the pump's inlet and outlet.", "the pump is a single unit, not stages in series or machines in parallel", "`eta` is the pump's own efficiency at the operating point, not the motor's.", "The operating point is on the pump's curve rather than beyond its range.", "no account of the fluid's vapour pressure; cavitation is not modelled and NPSH is a separate calculation"]
references = ["Standard gravity: the 1901 CGPM resolution fixed it at exactly 9.80665 m/s**2.", "No specific source is claimed: the relation is general pump engineering."]
[source]
standard = "standard pump hydraulics; the hydraulic-power relation in any fluids text"
[inputs]
[inputs.rho]
unit = "kg/m**3"
description = "Density of the pumped fluid, taken as constant across the pump."
[inputs.q]
unit = "m**3/s"
description = "Volumetric flow rate."
[inputs.H]
unit = "m"
description = "Head developed by the pump, in metres of the pumped fluid."
[inputs.eta]
unit = "dimensionless"
description = "Overall pump efficiency: hydraulic power delivered divided by shaft power supplied, between 0 and 1."
[outputs]
[outputs.power]
unit = "W"
description = "Shaft power the pump must be supplied with."
[[valid_range]]
quantity = "rho"
min = 0
min_inclusive = false
severity = "error"
rationale = """\
    power scales linearly with density, so a non-positive density would give a zero or \
    negative shaft power - a number that is wrong rather than merely out of range.\n\
    """
[[valid_range]]
quantity = "q"
min = 0
severity = "error"
rationale = """\
    flow is a magnitude and the sign is not modelled, so a negative value is a caller error \
    rather than reversed flow. Zero is allowed and correct: no flow moves no fluid, so no \
    power is required.\n\
    """
[[valid_range]]
quantity = "H"
min = 0
severity = "error"
rationale = """\
    a negative head means the machine is extracting energy from the fluid, which is a \
    turbine and a different calculation. Zero is allowed and gives zero power: developing no \
    head needs no power.\n\
    """
[[valid_range]]
quantity = "eta"
min = 0
min_inclusive = false
severity = "error"
rationale = """\
    `eta` is a divisor, so zero is singular - and physically it would mean a pump requiring \
    infinite shaft power to deliver finite hydraulic power.\n\
    """
[[valid_range]]
quantity = "eta"
max = 1
severity = "error"
rationale = "An efficiency above 1 would mean more hydraulic power out than shaft power in."
[worked_example]
source = "derived from the equation above"
derivation = "Water at 20 C pumped at 10 L/s against 30 m of head by a pump of 75% efficiency:\n  rho = 998 kg/m**3, q = 0.01 m**3/s, H = 30 m, eta = 0.75, g = 9.80665 m/s**2\n\n  rho * g   = 998 * 9.80665        = 9787.036699999999 W/(m**3/s)\n  * q       = 9787.036699999999 * 0.01 = 97.87036699999999\n  * H       = 97.87036699999999 * 30   = 2936.1110099999996\n  / eta     = 2936.1110099999996 / 0.75 = 3914.8146799999995 W\n\nrho * g * q * H = 2936.1110099999996 W is the hydraulic power delivered to the fluid."
tolerance = 1e-12
[worked_example.inputs]
rho = 998.0
q = 0.01
H = 30.0
eta = 0.75
[worked_example.expected]
power = 3914.81468
[implementations]
python = "azoth.hydraulics.pump_power"
rust = "azoth_hydraulics::pump_power"
[[tests]]
id = "water_10_litres_per_second_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "denser_fluid_different_operating_point"
type = "reference"
status = "active"
source = "Derived from the equation above at 1200 kg/m**3, 50 L/s, 12 m and 60% efficiency.\n  rho * g = 1200 * 9.80665 = 11767.98\n  q * H / eta = 0.05 * 12 / 0.60 = 1.0\n  power = 11767.98 * 1.0 = 11767.98 W"
tolerance = 1e-12
[tests.inputs]
rho = 1200.0
q = 0.05
H = 12.0
eta = 0.6
[tests.expected]
power = 11767.98
[[tests]]
id = "an_ideal_pump_delivers_the_hydraulic_power_exactly"
type = "reference"
status = "active"
source = "Derived from the equation above at eta = 1, the lossless limit.\n  power(eta=1) = 998 * 9.80665 * 0.01 * 30 / 1 = 2936.1110099999996 W"
tolerance = 1e-12
[tests.inputs]
rho = 998.0
q = 0.01
H = 30.0
eta = 1.0
[tests.expected]
power = 2936.11101
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
[[tests]]
id = "monotonic"
type = "property"
property = "monotonic"
status = "active"
