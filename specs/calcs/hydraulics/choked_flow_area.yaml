id: hydraulics.choked_flow_area
name: Choked-flow throat area for an ideal gas
equation: "A = m_dot / (sqrt(k * rho0 * P0) * (2 / (k + 1))**((k + 1) / (2 * (k - 1))))"
latex: 'A = \frac{\dot m}{\sqrt{k\,\rho_0 P_0}\,\left(\frac{2}{k+1}\right)^{\frac{k+1}{2(k-1)}}}'

source:
  standard: "the isentropic critical-flow relation from gas dynamics; API 520 / ISO 4126 for relief valve sizing, which this calc does NOT implement"
  equation: "TODO: source needed"

verification:
  status: unverified
  notes: >
    This is the isentropic choked-flow relation: the mass flux through a throat when
    the downstream pressure is low enough that the flow reaches sonic velocity there
    and stops responding to it. The derivation is standard gas dynamics and appears
    in every compressible-flow text. What has NOT been done is checking this spec
    against a named source, so `source.equation` is TODO.

    # Why this is not called relief_valve_area

    It was going to be. The four calcs this registry set out to add were orifice,
    control valve, relief valve and pump, and this is the fourth.

    But relief valve *sizing* to a standard is not what this calculation does. API
    520's sizing equation wraps this relation in de-rating coefficients - a discharge
    coefficient, a back-pressure correction, a combination factor - whose values are
    the standard's, tabulated. Reproducing those tables is what this project's
    copyright rule forbids, so the honest option was to ship the physics and leave
    the factors to the caller.

    And a calc that shipped the physics under the name `relief_valve_area` would
    overclaim: a caller looking for "relief valve sizing" would find it, use it, and
    get an area that is missing every de-rating factor the standard requires - too
    small, in the unsafe direction, and looking entirely ordinary. Calc ids are
    permanent public identifiers - they appear in provenance records and citations -
    so the name is the one thing here that cannot be fixed later. It is named for
    what it computes.

    The application is not lost. The relation is the basis of relief valve sizing,
    rupture disc sizing and any choked-gas discharge, and the de-rating factors are
    a composition the caller performs visibly - exactly as the `azoth pipe` CLI
    composes fitting losses rather than a calc baking them in.

    # Why this one has a warning bound when the last four did not

    `orifice_flow`, `pump_power`, `conduction_plane_wall` and `control_valve_cv` each
    carry no warning bounds, and each says why: the relation is exact given its
    inputs, so there is no fitted range outside which it stops being trustworthy, and
    the uncertainty lives in a caller-supplied coefficient.

    This one is different in a way worth naming. `k` is a **property of a substance**,
    not a coefficient in a convention, and substances have a known range: every real
    gas has an isentropic exponent above 1 and none above 5/3, the monatomic limit. So
    there is a factual band to warn about, and no equivalent band existed for the
    other four.

    # A bound this calc cannot express, and why

    The choked assumption - the one the whole relation rests on - is that the pressure
    downstream is below the critical ratio `(2/(k+1))**(k/(k-1))`, which is 0.528 for
    air and 0.546 for a k of 1.3. The calc does not take a downstream pressure, so it
    cannot check this.

    It could take one. What it cannot do is *declare* the check: the threshold is a
    function of `k`, and the schema's range checks are typed constants with no
    expression parser, deliberately. So a downstream pressure input would buy a check
    the spec could not describe - and a check the spec cannot describe is one the
    warning-parity test would reject, since that test asserts a result's warnings
    match the spec's declared bounds exactly. Recorded as an assumption the caller
    must satisfy, the same way `darcy_weisbach` records its Mach number limit.

inputs:
  m_dot:
    unit: kg/s
    description: >
      mass flow rate the throat must pass. Zero is allowed and correctly needs no
      area; a negative value is a caller error rather than reversed flow.
  P0:
    unit: Pa
    description: >
      stagnation (upstream total) pressure. The relation is written for stagnation
      conditions because that is what a relief valve's inlet is taken to be - the
      approach velocity is assumed negligible. A significant inlet velocity means
      this should be the static pressure plus the velocity head, and this calc does
      not do that conversion.
  rho0:
    unit: kg/m**3
    description: >
      stagnation density. Taken directly rather than derived from a gas constant and
      a molecular weight, which keeps this calc out of the ideal-gas equation and out
      of a decision about which gas constant and which molecular weight. A caller who
      has pressure and temperature should form the density first, with whatever
      equation of state is appropriate - and for a real gas that is exactly where the
      compressibility factor belongs.
  k:
    unit: dimensionless
    description: >
      isentropic exponent, the ratio of specific heats cp/cv. Above 1 for every real
      gas and at most 5/3, the monatomic limit - which is the one bound here that is
      a fact about substances rather than a convention.

outputs:
  a:
    unit: m**2
    description: >
      throat area required to pass `m_dot` when the flow is choked. The *minimum*
      area: at a larger downstream pressure the same flow needs a larger throat,
      because the flow is no longer sonic there. See the assumption on choking.

valid_range:
  - quantity: m_dot
    min: 0
    severity: error
    rationale: >
      flow is proportional to area, so a negative rate would give a negative area.
      Zero is allowed and correct: passing no mass needs no throat.

  - quantity: P0
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      stagnation pressure enters under the square root, so zero gives no mass flux and
      would make the required area infinite; negative would make the root imaginary.

  - quantity: rho0
    min: 0
    min_inclusive: false
    severity: error
    rationale: stagnation density likewise enters under the square root and must be positive

  - quantity: k
    min: 1
    min_inclusive: false
    severity: error
    rationale: >
      `k - 1` appears in a denominator in the exponent, so `k = 1` is a division by
      zero - and physically it is a substance whose specific heats are equal, which
      no gas is. `k = 1` is the boundary and is excluded.

  - quantity: k
    max: 1.6666666666666667
    severity: warning
    code: OUT_OF_VALID_RANGE
    rationale: >
      No known gas has an isentropic exponent above 5/3, which is the monatomic
      limit - one atom, three degrees of freedom, no vibrational contribution. A
      value above it is much more likely a lookup or a unit mistake than an exotic
      working fluid, and it is a warning rather than an error because `k` is a
      property: the relation evaluates perfectly well, and refusing would be less
      useful than saying so. This is the first warning bound in five calcs, and the
      difference is that `k` has a known range as a substance where the coefficients
      the others take do not.

assumptions:
  - "ideal gas, with constant specific heats. A real gas needs a compressibility factor and a temperature-dependent `k`, and this calc has neither - which is a real limit: near a relief valve's set pressure a condensable vapour is often far from ideal."
  - "**the flow is choked**: the pressure downstream of the throat is below the critical ratio `(2/(k+1))**(k/(k-1))`, which is 0.528 for air. NOT CHECKED - the calc has no downstream pressure. This is the assumption the whole relation rests on, and it cannot be a bound because the threshold depends on `k`; see `verification`."
  - "isentropic expansion: adiabatic, and frictionless through the throat. Real losses are precisely what a standard's discharge coefficient accounts for, and applying one is the caller's composition here."
  - the area is the throat - the minimum area - and the flow there is one-dimensional and normal to it
  - no inlet or outlet losses, no back-pressure correction, no rupture-disc or combination factors. These are the de-rating coefficients a standard requires, and this calc applies none of them, deliberately and visibly rather than invisibly.
  - single-phase gas at the throat. A liquid droplet, a condensate or a flashing liquid invalidates the relation, and a two-phase inlet needs an entirely different treatment.
  - "`k` constant through the expansion, which it is not exactly: it varies with temperature, and a large expansion changes the temperature a great deal - the throat of a choked flow is markedly colder than its inlet"
  - stagnation conditions upstream, i.e. the approach velocity is negligible. Standard for a relief valve; not for a nozzle with a fast inlet.

references:
  - "The isentropic critical-flow relation is standard compressible-flow theory and appears in every gas dynamics text: the mass flux through a throat is `sqrt(k rho0 P0)` times a function of `k` alone. No specific source is claimed - see `verification`."
  - "API 520 Part I, Sizing and Selection of Pressure-Relieving Devices, and ISO 4126, Safety devices for protection against excessive pressure - the standards for relief valve sizing. Cited for context: this calc does NOT implement their sizing equations or reproduce their de-rating coefficients, and no part of them is reproduced here."

worked_example:
  source: derived from the equation above
  derivation: >
    Air-like conditions at a convenient size: 1 kg/s of gas with an isentropic
    exponent of 1.4, at 1 MPa of stagnation pressure and 10 kg/m**3 of stagnation
    density.

    At k = 1.4 the exponent is a whole number and the geometric factor is exact,
    which is why these numbers were chosen - the derivation can be checked by hand
    rather than only by trusting the code:

      (k + 1) / (2 * (k - 1)) = 2.4 / 0.8 = 3            exactly
      2 / (k + 1)             = 2 / 2.4 = 5/6            exactly
      (5/6)**3                = 125/216 = 0.5787037037037037

    Then the pressure-and-density part, which is not exact:

      k * rho0 * P0 = 1.4 * 10.0 * 1000000.0 = 14000000.0
      sqrt(14000000.0) = 3741.657386773941

    So the critical mass flux is

      G* = 3741.657386773941 * 0.5787037037037037 = 2165.310987716401 kg/(m**2 s)

    and the area, which is the mass flow divided by it:

      A = 1.0 / 2165.310987716401 = 0.00046182742602466937 m**2

    That is 461.8 mm**2. The arithmetic is worth reading twice, because the geometric
    factor is *dimensionless* and the whole unit structure lives in
    `sqrt(k rho0 P0)`, which is a mass flux: `sqrt(Pa * kg/m**3)` is `kg/(m**2 s)`.
    A formula whose units do not resolve to an area is wrong, and this one does.
  inputs: { m_dot: 1.0, P0: 1000000.0, rho0: 10.0, k: 1.4 }
  expected: { a: 0.00046182742602466937 }
  tolerance: 1.0e-12

implementations:
  python: azoth.hydraulics.choked_flow_area
  rust: azoth_hydraulics::choked_flow_area

tests:
  - id: air_like_conditions_worked_example
    type: worked_example
    status: active

  - id: different_in_every_input
    type: reference
    status: active
    source: >
      Derived from the equation above with every input different from the worked
      example, so an implementation that had hardcoded that answer would fail. A
      diatomic-to-polyatomic exponent of 1.3, 2.5 kg/s, half a megapascal and
      6 kg/m**3:

        (k + 1) / (2 * (k - 1)) = 2.3 / 0.6 = 3.8333333333333326
        2 / (k + 1)             = 2 / 2.3 = 0.8695652173913044
        that to that power      = 0.5852277961374616
        sqrt(1.3 * 6.0 * 500000.0) = sqrt(3900000.0) = 1974.84176581315
        G* = 1974.84176581315 * 0.5852277961374616 = 1155.7322943270428 kg/(m**2 s)
        A  = 2.5 / 1155.7322943270428 = 0.0021631306940814474 m**2

      The exponent here is not a whole number, unlike the worked example, so this
      case exercises the general power rather than a cube - which the worked
      example's `(5/6)**3` does not.
    inputs: { m_dot: 2.5, P0: 500000.0, rho0: 6.0, k: 1.3 }
    expected: { a: 0.0021631306940814474 }
    tolerance: 1.0e-12

  - id: agrees_with_the_stagnation_temperature_form
    type: reference
    status: active
    source: >
      The same relation is usually written with the stagnation temperature and the
      gas constant rather than the stagnation density:

        G* = P0 * sqrt(k / (R T0)) * (2/(k+1))**((k+1)/(2(k-1)))

      which is the same expression, because `rho0 = P0 / (R T0)` for an ideal gas.
      Evaluating both for air at 1 MPa and 300 K, R = 287 J/(kg K):

        rho0 = 1000000.0 / (287.0 * 300.0) = 11.614401858304298 kg/m**3
        textbook form: G* = 2333.558560606226 kg/(m**2 s)
        A = 1.0 / 2333.558560606226 = 0.00042853006428954324 m**2

      They agree to fifteen significant figures, the difference being the order of
      the operations. This is a cross-check against an *independent algebraic form*
      of the same physics rather than against the same expression evaluated twice -
      which is the difference between a test that could fail and one that cannot.
      The input is given here as `rho0` because that is what this calc takes.
    inputs: { m_dot: 1.0, P0: 1000000.0, rho0: 11.614401858304298, k: 1.4 }
    expected: { a: 0.00042853006428954324 }
    tolerance: 1.0e-12

  - id: monotonic
    type: property
    property: monotonic
    status: active
    note: >
      The area rises with the mass flow and falls with pressure, density and the
      isentropic exponent, and is zero when the mass flow is. The last of those is
      the least obvious: a higher `k` means a larger geometric factor and a higher
      critical flux, so the same flow needs less area.

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
    note: >
      The same throat described in SI and in US customary units must come out the
      same. `m_dot` and `rho0` are the two inputs carrying a unit here - `P0` too,
      which is converted to psi for the other half - and the area that comes back is
      in square metres either way.
