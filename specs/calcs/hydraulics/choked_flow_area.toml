id = "hydraulics.choked_flow_area"
name = "Choked-flow throat area for an ideal gas"
equation = "A = m_dot / (sqrt(k * rho0 * P0) * (2 / (k + 1))**((k + 1) / (2 * (k - 1))))"
latex = '''A = \frac{\dot m}{\sqrt{k\,\rho_0 P_0}\,\left(\frac{2}{k+1}\right)^{\frac{k+1}{2(k-1)}}}'''
assumptions = ["The gas is ideal, with constant specific heats.", "The flow is choked: the pressure downstream of the throat is below the critical ratio.", "The expansion is isentropic: adiabatic and frictionless through the throat.", "the area is the throat - the minimum area - and the flow there is one-dimensional and normal to it", "There are no inlet or outlet losses, no back-pressure correction and no rupture-disc or combination factors.", "The gas is single-phase at the throat.", "`k` is constant through the expansion.", "Stagnation conditions upstream: the approach velocity is negligible."]
references = ["No specific source is claimed: the isentropic critical-flow relation is standard compressible-flow theory.", "API 520 Part I, Sizing and Selection of Pressure-Relieving Devices, and ISO 4126, Safety devices for protection against excessive pressure."]
[source]
standard = """\
    the isentropic critical-flow relation from gas dynamics; API 520 / ISO 4126 for relief \
    valve sizing, which this calc does NOT implement"""
[inputs]
[inputs.m_dot]
unit = "kg/s"
description = "Mass flow rate the throat must pass."
[inputs.P0]
unit = "Pa"
description = "Stagnation (upstream total) pressure."
[inputs.rho0]
unit = "kg/m**3"
description = "Stagnation density."
[inputs.k]
unit = "dimensionless"
description = "Isentropic exponent, the ratio of specific heats cp/cv."
[outputs]
[outputs.a]
unit = "m**2"
description = "Throat area required to pass m_dot when the flow is choked."
[[valid_range]]
quantity = "m_dot"
min = 0
severity = "error"
rationale = """\
    flow is proportional to area, so a negative rate would give a negative area. Zero is \
    allowed and correct: passing no mass needs no throat.\n\
    """
[[valid_range]]
quantity = "P0"
min = 0
min_inclusive = false
severity = "error"
rationale = """\
    stagnation pressure enters under the square root, so zero gives no mass flux and would \
    make the required area infinite; negative would make the root imaginary.\n\
    """
[[valid_range]]
quantity = "rho0"
min = 0
min_inclusive = false
severity = "error"
rationale = "stagnation density likewise enters under the square root and must be positive"
[[valid_range]]
quantity = "k"
min = 1
min_inclusive = false
severity = "error"
rationale = "`k - 1` appears in a denominator in the exponent, so `k = 1` is a division by zero."
[[valid_range]]
quantity = "k"
max = 1.6666666666666667
severity = "warning"
code = "OUT_OF_VALID_RANGE"
rationale = "No known gas has an isentropic exponent above 5/3, the monatomic limit."
[worked_example]
source = "derived from the equation above"
derivation = "Air-like conditions at a convenient size: 1 kg/s of gas with an isentropic exponent of 1.4, at 1 MPa of stagnation pressure and 10 kg/m**3 of stagnation density.\n\n  (k + 1) / (2 * (k - 1)) = 2.4 / 0.8 = 3            exactly\n  2 / (k + 1)             = 2 / 2.4 = 5/6            exactly\n  (5/6)**3                = 125/216 = 0.5787037037037037\n\n  k * rho0 * P0 = 1.4 * 10.0 * 1000000.0 = 14000000.0\n  sqrt(14000000.0) = 3741.657386773941\n\n  G* = 3741.657386773941 * 0.5787037037037037 = 2165.310987716401 kg/(m**2 s)\n\n  A = 1.0 / 2165.310987716401 = 0.00046182742602466937 m**2"
tolerance = 1e-12
[worked_example.inputs]
m_dot = 1.0
P0 = 1000000.0
rho0 = 10.0
k = 1.4
[worked_example.expected]
a = 0.00046182742602466937
[implementations]
python = "azoth.hydraulics.choked_flow_area"
rust = "azoth_hydraulics::choked_flow_area"
[[tests]]
id = "air_like_conditions_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "different_in_every_input"
type = "reference"
status = "active"
source = "Derived from the equation above at an isentropic exponent of 1.3, 2.5 kg/s, half a megapascal and 6 kg/m**3.\n\n  (k + 1) / (2 * (k - 1)) = 2.3 / 0.6 = 3.8333333333333326\n  2 / (k + 1)             = 2 / 2.3 = 0.8695652173913044\n  that to that power      = 0.5852277961374616\n  sqrt(1.3 * 6.0 * 500000.0) = sqrt(3900000.0) = 1974.84176581315\n  G* = 1974.84176581315 * 0.5852277961374616 = 1155.7322943270428 kg/(m**2 s)\n  A  = 2.5 / 1155.7322943270428 = 0.0021631306940814474 m**2"
tolerance = 1e-12
[tests.inputs]
m_dot = 2.5
P0 = 500000.0
rho0 = 6.0
k = 1.3
[tests.expected]
a = 0.0021631306940814474
[[tests]]
id = "agrees_with_the_stagnation_temperature_form"
type = "reference"
status = "active"
source = "Derived from the stagnation-temperature form of the relation, for air at 1 MPa and 300 K with R = 287 J/(kg K).\n\n  G* = P0 * sqrt(k / (R T0)) * (2/(k+1))**((k+1)/(2(k-1)))\n\n  rho0 = 1000000.0 / (287.0 * 300.0) = 11.614401858304298 kg/m**3\n  textbook form: G* = 2333.558560606226 kg/(m**2 s)\n  A = 1.0 / 2333.558560606226 = 0.00042853006428954324 m**2"
tolerance = 1e-12
[tests.inputs]
m_dot = 1.0
P0 = 1000000.0
rho0 = 11.614401858304298
k = 1.4
[tests.expected]
a = 0.00042853006428954324
[[tests]]
id = "monotonic"
type = "property"
property = "monotonic"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
