id: hydraulics.control_valve_cv
name: Liquid flow through a control valve from its flow coefficient
equation: "q = CV_TO_SI * Cv * sqrt(dP / SG)"
latex: 'Q = C_v \sqrt{\frac{\Delta P}{SG}}'

source:
  standard: "the liquid sizing equation for control valves; IEC 60534 for the coefficient tables, which this calc does not implement"

notes: >
  The relation is standard control-valve sizing: the flow through a valve is
  proportional to its flow coefficient and to the square root of the pressure
  drop divided by the specific gravity. What has NOT been done is checking this
  spec against a named source, so `source.equation` is omitted rather than quoting
  an equation number.

  # The coefficient is an input, and its *units* are the hard part

  `Cv` is supplied by the caller. IEC 60534's published coefficient values are a
  table, and reproducing a table is what this project's copyright rule forbids -
  see [Copyright and licensed data](../copyright.md). So the coefficient is an
  input, exactly as `Cd` is to `orifice_flow`.

  But `Cv` is a harder case than `Cd`, and the difference is worth stating. `Cd`
  is genuinely dimensionless: a ratio of flows. **`Cv` is not dimensionless.** It
  is defined as the flow of water in US gallons per minute at a pressure drop of
  one pound per square inch, so it carries the units
  `gpm / sqrt(psi)` - and this spec has to declare it `dimensionless` because
  the schema's unit vocabulary cannot express a fractional power of a non-SI
  unit. That declaration is a fiction of necessity, and the whole job of this
  calculation is to undo it correctly.

  So the constant in the equation is not decoration. It is
  `(1 gpm in m**3/s) / sqrt(1 psi in Pa)`, derived below from the definitions of
  the gallon and the pound-force, and it is what converts a coefficient in a US
  convention into a flow in SI. Burying it in an input description would make
  every caller re-derive - and mis-derive - the same factor.

  # Which convention, and the Kv alternative

  This calc takes the US `Cv`. The metric `Kv` is defined against
  `m**3/h` and `bar`, and the two differ by a fixed factor - `Kv = 0.865 * Cv`
  to the precision those conventions are usually quoted at. A caller holding `Kv`
  should convert once, deliberately, rather than pass it where `Cv` is expected:
  the error is a factor of 1.156, which is large, silent, and produces a
  perfectly ordinary-looking flow.

  # Why there are no warning bounds

  The fourth calc with none, and the same reasoning as the other three: the
  relation is exact given its inputs, so there is no fitted range outside which it
  stops being trustworthy. What varies is the caller's coefficient, and the
  conditions under which a published coefficient is valid - choked flow, flashing,
  laminar or transitional flow - are functions of pressures and a vapour pressure
  this calc does not have. They are assumptions here, not bounds, because a bound
  could not be evaluated.


inputs:
  Cv:
    unit: dimensionless
    description: >
      valve flow coefficient in the US convention: the flow of water in US gallons
      per minute at a pressure drop of one pound per square inch. Dimensionless in
      this schema's vocabulary for want of a unit that can express `gpm/sqrt(psi)`,
      which is what it actually carries - see `notes`. Supplied by the
      caller from a manufacturer's or a standard's data; this calc does not
      compute or catalogue it.
  dP:
    unit: Pa
    description: >
      pressure drop across the valve. A magnitude: a negative value is rejected
      rather than read as reversed flow, and zero correctly gives zero flow.
  SG:
    unit: dimensionless
    description: >
      specific gravity of the liquid: its density divided by the density of water
      at the reference temperature the coefficient convention uses, 15.6 C (60 F).
      Declared explicitly because it is a real convention rather than a trivial
      one - a caller who computes specific gravity against water at 4 C instead
      will differ in the third decimal place, which is small but is a bias rather
      than a rounding.

outputs:
  q:
    unit: m**3/s
    description: volumetric flow rate through the valve

valid_range:
  - quantity: Cv
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      flow is proportional to the coefficient, so a non-positive one gives no flow
      or negative flow - a number that is wrong rather than merely unusual. A
      closed valve is `Cv = 0` and is correctly a different question, since no
      coefficient describes it.

  - quantity: dP
    min: 0
    severity: error
    rationale: >
      a negative drop would mean flow in the other direction, which is a different
      calculation and not the one named here. Zero is allowed and correct: no
      pressure difference drives no flow.

  - quantity: SG
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      specific gravity is a divisor inside the square root, so zero is singular and
      negative would make the root imaginary.

assumptions:
  - single-phase liquid flow. A flashing or cavitating liquid is not described by this relation at all, and neither is a two-phase inlet.
  - non-choked flow. Above a limiting pressure drop the flow through a valve stops rising with the difference, and the relation above over-predicts without limit. The limit depends on a pressure-recovery factor and the liquid's vapour pressure, neither of which this calc has. NOT CHECKED - it cannot be, and it is the assumption most likely to be violated in practice.
  - fully turbulent flow through the valve, which is what a published coefficient assumes. At low Reynolds numbers the coefficient falls off and the true flow is smaller.
  - the coefficient is for the valve at the travel and trim it is actually installed at. A partially open valve, or one with a different trim from the catalogue entry, has a different coefficient, and nothing in these three inputs reveals it.
  - the installed valve has no attached fittings whose loss is being counted twice. Reducers, strainers and silence-trim hardware all add resistance, and the sizing coefficient usually already includes some of them.
  - "`SG` is relative to water at 15.6 C, the reference the `Cv` convention uses. A caller working from density ratios at another reference temperature has a small systematic offset, not a random error."
  - the pressure drop is the difference across the valve itself, between the tappings the coefficient is defined against, and not the difference across a sub-circuit containing it

references:
  - "IEC 60534, Industrial-process control valves, Part 2-1: Flow capacity - the standard for control valve sizing and for the published coefficient data. Cited for context: this calc does NOT implement its tables, and no part of them is reproduced here."
  - "The relation Q = Cv * sqrt(dP/SG) is standard control-valve sizing and appears in every instrument engineer's handbook. No specific source is claimed - see `notes`."
  - "The SI conversion constant is derived, not cited: 1 US gallon = 3.785411784 L and 1 lbf = 4.4482216152605 N are both exact definitions, so the constant is arithmetic rather than a fitted value."

worked_example:
  source: derived from the equation above
  derivation: >
    Chosen to make the definition of `Cv` visible rather than to look realistic:
    water at a pressure drop of exactly one pound per square inch, where the
    relation reduces to "the flow in gpm is the coefficient".

    The constant first. `Cv` is in gpm per root psi, the flow is wanted in m**3/s
    and the drop is given in Pa, so the constant is (1 gpm in m**3/s) divided by
    the square root of (1 psi in Pa), both of which are exact:

      1 US gallon      = 3.785411784e-3 m**3            (definition)
      1 gpm            = 3.785411784e-3 / 60 = 6.30901964e-5 m**3/s
      1 lbf            = 4.4482216152605 N              (definition)
      1 in             = 0.0254 m                       (definition)
      1 psi            = 4.4482216152605 / 0.0254**2 = 6894.757293168361 Pa
      sqrt(1 psi)      = 83.03467524575719
      CV_TO_SI         = 6.30901964e-05 / 83.03467524575719 = 7.59805421208337e-07

    Then the example, at Cv = 10, dP = 1 psi = 6894.757293168361 Pa, SG = 1:

      q = 7.59805421208337e-7 * 10 * sqrt(6894.757293168361 / 1)
        = 7.59805421208337e-07 * 10 * 83.03467524575719
        = 6.309019640000001e-4 m**3/s

    which is 10 gpm, and should be: `Cv` is defined as the gpm of water at one
    psi, so at one psi the flow is the coefficient. The example is a check on the
    constant as much as on the arithmetic - a wrong constant would give a flow
    that is not the coefficient in gpm, and the derivation would not close.
  inputs: { Cv: 10.0, dP: 6894.757293168361, SG: 1.0 }
  expected: { q: 0.0006309019640000001 }
  tolerance: 1.0e-12

implementations:
  python: azoth.hydraulics.control_valve_cv
  rust: azoth_hydraulics::control_valve_cv

tests:
  - id: unit_drop_at_unit_specific_gravity_worked_example
    type: worked_example
    status: active

  - id: realistic_bar_of_drop
    type: reference
    status: active
    source: >
      Derived from the equation above at a realistic operating point, and
      independently cross-checked in the convention's own units so that a wrong
      conversion constant cannot pass both routes: Cv = 10, SG = 1, and 1 bar of
      drop (100000 Pa).

      Through the SI constant:
        q = 7.59805421208337e-7 * 10 * sqrt(100000) = 0.00240271570956195 m**3/s

      Through the convention, converting the drop first:
        100000 Pa / 6894.757293168361 Pa per psi = 14.503773773020923 psi
        Q = 10 * sqrt(14.503773773020923) = 38.0838204136887 gpm
        q = 38.0838204136887 * 6.30901964e-05 = 0.0024027157095619493 m**3/s

      The two agree to about fifteen significant figures, the difference being the
      order the multiplications happen in rather than anything physical: one route
      folds three conversions into one constant, the other applies a pressure
      conversion, a square root and then a flow conversion. Both routes are written
      out because they share no arithmetic, so a mistake in any of the conversions
      would have to be matched by a compensating mistake in the other route to give
      the same answer.
    inputs: { Cv: 10.0, dP: 100000.0, SG: 1.0 }
    expected: { q: 0.00240271570956195 }
    tolerance: 1.0e-12

  - id: a_coefficient_of_one_passes_one_gallon_per_minute
    type: reference
    status: active
    source: >
      The definition of `Cv`, stated directly: a coefficient of 1 passes 1 gpm of
      water at 1 psi of drop. So the result must be exactly 1 gpm in SI,
      6.30901964e-5 m**3/s.
      This pins the constant against the definition rather than against the
      worked example, which uses a coefficient of 10 and could be right at that
      point for the wrong reason.
    inputs: { Cv: 1.0, dP: 6894.757293168361, SG: 1.0 }
    expected: { q: 6.30901964e-05 }
    tolerance: 1.0e-12

  - id: denser_liquid_passes_less
    type: reference
    status: active
    source: >
      Derived from the equation above. Specific gravity is a divisor under the
      root, so a denser liquid passes less at the same drop, by the square root of
      the ratio rather than in proportion:
        sqrt(6894.757293168361 / 1.2) = 75.79994114536171
        q(SG = 1.2) = 7.59805421208337e-07 * 10 * 75.79994114536171
                    = 0.0005759320620951871 m**3/s
      which is the unit-gravity flow divided by the square root of 1.2, and not by
      1.2. A form that divided by `SG` rather than its square root, or that treated
      gravity as linear, gives a different answer here.
    inputs: { Cv: 10.0, dP: 6894.757293168361, SG: 1.2 }
    expected: { q: 0.0005759320620951871 }
    tolerance: 1.0e-12

  - id: monotonic
    type: property
    property: monotonic
    status: active
    note: >
      Flow rises with the coefficient and with the pressure drop, and falls with
      specific gravity, and is zero when the drop is. The directions place each
      input in the expression: a wrong power, a misplaced square root or an
      inverted ratio all show up as a direction changing.

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
    note: >
      The same valve and operating point described with the drop in psi rather
      than pascals must give the same flow. This is a genuine conversion of an
      input rather than a restatement of the coefficient convention, which is
      dimensionless and cannot round-trip - and it is worth having separately,
      because `dP` is the one input here that carries a unit at all.
