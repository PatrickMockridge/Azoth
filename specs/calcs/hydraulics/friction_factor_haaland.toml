id = "hydraulics.friction_factor_haaland"
name = "Haaland friction factor (explicit)"
equation = "f = (1.0 / (-1.8 * log10((relative_roughness / 3.7)**1.11 + 6.9 / Re)))**2"
latex = """\
    f = \\left[-1.8\\,\\log_{10}\\!\\left[\\left(\\frac{\\varepsilon/D}{3.7}\\right)^{1.11} \
    + \\frac{6.9}{Re}\\right]\\right]^{-2}"""
assumptions = ["fully turbulent flow", "circular pipe running full", "steady, fully developed, single-phase, incompressible flow", "uniform sand-grain roughness of height epsilon", "Newtonian fluid", "accuracy within about 2% of the Colebrook equation over the range above", """\
    the roughness is the sand-grain equivalent, which is what the correlation was fitted to; \
    a pipe whose real surface differs in character will not be described by it however well \
    epsilon is estimated"""]
references = ["Haaland, S. E. (1983). \"Simple and explicit formulas for the friction factor in turbulent pipe flow.\" Journal of Fluids Engineering, 105(1), 89-90.", "Colebrook, C. F. (1939). \"Turbulent flow in pipes, with particular reference to the transition region between the smooth and rough pipe laws.\" J. Inst. Civ. Eng., 11(4), 133-156."]
[source]
standard = "Haaland, S. E. (1983)"
edition = "Journal of Fluids Engineering, 105(1), 89-90"
[inputs]
[inputs.re]
unit = "dimensionless"
description = "Reynolds number"
[inputs.relative_roughness]
unit = "dimensionless"
description = "absolute roughness divided by internal diameter (epsilon / D)"
[outputs]
[outputs.f]
unit = "dimensionless"
description = "Darcy-Weisbach friction factor"
[[valid_range]]
quantity = "re"
min = 0
min_inclusive = false
severity = "error"
rationale = "the 6.9/Re term is singular at Re = 0"
[[valid_range]]
quantity = "relative_roughness"
min = 0
severity = "error"
rationale = "negative roughness is unphysical"
[[valid_range]]
quantity = "re"
min = 4000
min_inclusive = false
severity = "warning"
rationale = "Below Re ~ 4000 the equation is outside turbulent pipe flow, which is the regime it approximates within Colebrook."
[[valid_range]]
quantity = "relative_roughness"
max = 0.05
max_inclusive = true
severity = "warning"
rationale = "Above epsilon/D ~ 0.05 the Moody framework is no longer meaningful."
[worked_example]
source = "derived from the equation above"
derivation = "For Re = 1.0e5 and relative_roughness = 4.6e-4 (commercial steel, epsilon = 0.046 mm in a 100 mm pipe):\n  relative_roughness/3.7        = 4.6e-4 / 3.7            = 1.2432432432432433e-4\n  (relative_roughness/3.7)**1.11 = 1.2432432432432433e-4 ** 1.11 = 4.62335540280221e-5\n  6.9/Re                        = 6.9 / 1.0e5             = 6.9e-5\n  sum                           = 4.62335540280221e-5 + 6.9e-5 = 1.1523355402802211e-4\n  log10(sum)                    = -3.938421043417981\n  -1.8 * log10(sum)             = 7.089157878152366\n  f = (1 / 7.089157878152366)**2 = 1.41060527...e-2 ** 2    = 0.019898058496980637"
tolerance = 1e-06
[worked_example.inputs]
re = 100000.0
relative_roughness = 0.00046
[worked_example.expected]
f = 0.0198980585
[implementations]
python = "azoth.hydraulics.friction_factor_haaland"
rust = "azoth_hydraulics::friction_factor_haaland"
[[tests]]
id = "commercial_steel_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "agrees_with_colebrook_within_two_percent"
type = "reference"
status = "active"
source = "Cross-check against the Colebrook equation at the same inputs; the published accuracy for the explicit form is about 1-2%, and the expected value is Colebrook's result."
tolerance = 0.02
[tests.inputs]
re = 100000.0
relative_roughness = 0.00046
[tests.expected]
f = 0.020162032
[[tests]]
id = "smooth_pipe_limit"
type = "reference"
status = "active"
source = "With relative_roughness = 0 the equation reduces to an explicit form that can be evaluated by hand.\n  f = (1 / (-1.8 * log10(6.9/Re)))**2\n  At Re = 1e5: 6.9/1e5 = 6.9e-5, its log10 is -4.161150909262744, so -1.8 * that is 7.490071634672939\n  f = 1/7.490071634672939**2 = 0.017824939200764653"
tolerance = 1e-06
[tests.inputs]
re = 100000.0
relative_roughness = 0.0
[tests.expected]
f = 0.017824939200764653
