id: hydraulics.orifice_flow
name: Flow through an orifice from the pressure difference across it
equation: "q = Cd * (math.pi * d**2 / 4) * sqrt(2 * dP / rho)"
latex: 'Q = C_d \frac{\pi d^{2}}{4} \sqrt{\frac{2\,\Delta P}{\rho}}'

source:
  standard: "the orifice equation; ISO 5167 for the discharge coefficient, which this calc does not implement"

inputs:
  d:
    unit: mm
    description: >
      orifice bore diameter. Millimetres because that is how bores are quoted in
      piping work; the calculation works in metres internally, so any length is
      accepted. Not the pipe diameter - this calc has no pipe, so it cannot form
      the diameter ratio a standard's discharge coefficient would be a function of.
  dP:
    unit: Pa
    description: >
      pressure difference across the orifice, between the tappings the coefficient
      is defined against. A magnitude: a negative value is rejected rather than read
      as reversed flow, and zero correctly gives zero flow.
  rho:
    unit: kg/m**3
    description: >
      density of the fluid. Taken as constant through the orifice, so a fluid whose
      density changes appreciably across it is not described by one value - see the
      compressibility assumption.
  Cd:
    unit: dimensionless
    description: >
      discharge coefficient: actual flow divided by the ideal flow through the same
      area at the same pressure difference. A property of the geometry and the
      Reynolds number, supplied by the caller. This calc adds no velocity-of-approach
      or other correction, so it must be the coefficient for the form written above.

outputs:
  q:
    unit: m**3/s
    description: volumetric flow rate through the orifice

valid_range:
  - quantity: d
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      the bore is squared, so a zero bore would give zero area and zero flow, and a
      negative one would give a positive area from a nonsensical input. Both are
      caller errors rather than physical states.

  - quantity: dP
    min: 0
    severity: error
    rationale: >
      a negative difference would mean flow in the other direction, which is a
      different calculation and not the one named here. Zero is allowed and correct:
      no pressure difference drives no flow.

  - quantity: rho
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      density is a divisor inside the square root, so zero is singular and negative
      would make the root imaginary.

  - quantity: Cd
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      a non-positive coefficient would give a flow that is zero or in the wrong
      direction - wrong rather than merely unusual.

  - quantity: Cd
    max: 1
    severity: error
    rationale: >
      the ideal, lossless orifice passes exactly the ideal flow, so a coefficient
      above 1 would claim more flow than an obstruction of that area can pass at
      that pressure difference. That is not an uncertainty to warn about but a
      violation of the relation, so it is rejected. The bound is inclusive because 1
      is the ideal limit and a legitimate one.

assumptions:
  - incompressible flow. A gas with a significant pressure ratio across the orifice needs an expansion factor, which this calc does not apply - `Cd` cannot absorb it, because the expansion factor is a function of the pressure ratio and the heat capacity ratio. NOT CHECKED - it cannot be, this calc has no expansion factor, no heat capacity ratio and no upstream pressure.
  - the fluid is single-phase, Newtonian and free of suspended solids
  - the orifice is a square-edged plate, and `Cd` describes that geometry. Other primaries - a nozzle, a Venturi, a cone - have different coefficients, and nothing here reveals which was meant.
  - "`Cd` is valid at this Reynolds number and this diameter ratio. A standard's coefficient is fitted over stated ranges of both, and this calc has neither, so it cannot check the coefficient it was handed. This is the assumption that most needs the caller's attention."
  - the pressure difference is measured between the tappings the coefficient is defined against. Corner, flange and D-and-D/2 tappings give different numbers for the same flow, and the coefficient differs accordingly.
  - the approach velocity is accounted for either inside `Cd` or not at all - this calc adds no velocity-of-approach factor. See the note on conventions in `notes`.
  - steady flow, with no pulsation; an orifice in a pulsating flow reads a difference that is not the mean
  - fully developed, undisturbed velocity profile approaching the orifice. Close-coupled fittings or a partly closed valve upstream can change the coefficient substantially, and the required straight lengths are a standard's concern rather than this calc's.

references:
  - "ISO 5167-1 and -2, Measurement of fluid flow by means of pressure differential devices - the standard for orifice plates and their discharge coefficients. Cited for context: this calc does NOT implement its coefficient, and no part of its tables or text is reproduced here."
  - "The relation q = Cd * A * sqrt(2*dP/rho) is standard fluid mechanics and appears in every fluids text. No specific source is claimed - see `notes`."

worked_example:
  source: derived from the equation above
  derivation: >
    Water through a 50 mm orifice with 25 kPa across it, at a discharge coefficient
    of 0.62 - a representative value for a square-edged plate, supplied here as an
    input rather than derived:

      d          = 50 mm                = 0.05 m
      A          = pi * 0.05**2 / 4     = 0.001963495408493621 m**2
      2*dP/rho   = 2 * 25000 / 998      = 50.100200400801604
      sqrt(...)  = sqrt(50.100200400801604) = 7.07814950398772
      q = 0.62 * 0.001963495408493621 * 7.07814950398772
        = 0.008616706712060997 m**3/s

    That is 8.617 L/s. The two halves are worth separating, because they scale
    differently: the area is linear in the bore squared, and the flow is linear in
    `Cd` but only as the square root of the pressure difference. Doubling `Cd`
    doubles the flow; doubling the pressure difference multiplies it by 1.414.
  inputs: { d: 50.0, dP: 25000.0, rho: 998.0, Cd: 0.62 }
  expected: { q: 0.008616706712060997 }
  tolerance: 1.0e-12

implementations:
  python: azoth.hydraulics.orifice_flow
  rust: azoth_hydraulics::orifice_flow

tests:
  - id: water_through_a_50mm_orifice_worked_example
    type: worked_example
    status: active

  - id: larger_bore_and_lower_differential
    type: reference
    status: active
    source: >
      Derived from the equation above, with every input different from the worked
      example so an implementation that had hardcoded that answer would fail. A
      100 mm bore with 10 kPa across it, water at 1000 kg/m**3 and Cd = 0.61:
        A = pi * 0.100**2 / 4 = 0.007853981633974483 m**2
        sqrt(2 * 10000 / 1000) = sqrt(20) = 4.47213595499958
        q = 0.61 * 0.007853981633974483 * 4.47213595499958
          = 0.021425684929674216 m**3/s
      Note the bore quadrupling in area while the differential fell: this case is
      larger in flow despite the smaller pressure difference, which a wrong power of
      `d` would get backwards.
    inputs: { d: 100.0, dP: 10000.0, rho: 1000.0, Cd: 0.61 }
    expected: { q: 0.021425684929674216 }
    tolerance: 1.0e-12

  - id: an_ideal_orifice_passes_the_ideal_flow
    type: reference
    status: active
    source: >
      Derived from the equation above. At Cd = 1 the orifice is lossless and the
      flow is the ideal one for that area and difference:
        q = 1 * 0.001963495408493621 * 7.07814950398772 = 0.013897914051711287 m**3/s
      This separates the coefficient from the rest of the expression. A dropped or
      misapplied `Cd` would still give a plausible number at the worked example's
      0.62 and would be exactly right here - so if the two cases fail together the
      fault is in the area or the root, and if only the worked example fails it is
      in the coefficient.
    inputs: { d: 50.0, dP: 25000.0, rho: 998.0, Cd: 1.0 }
    expected: { q: 0.013897914051711287 }
    tolerance: 1.0e-12

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
  - id: monotonic
    type: property
    property: monotonic
    status: active
