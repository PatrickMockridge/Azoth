id = "hydraulics.crane_k_factors"
name = "Fitting resistance coefficients by the equivalent-length method"
summary = "Total fitting resistance coefficient from a list of fittings and their equivalent lengths. The coefficients are equivalent-length engineering defaults, cited but not verified against Crane TP-410."
equation = "K = f_t * sum(n_ld for each fitting)"
latex = '''K = f_t \sum_{i} n_{L/D,i}'''
assumptions = ["fully turbulent flow in the fittings, which is what the tabulated coefficients describe", "valves are fully open; a throttled or partly open valve has a much higher coefficient and should be sized by its flow coefficient instead", "fittings are separated by enough straight pipe that their losses do not interact", "the fitting and the pipe are the same nominal size", "single-phase, incompressible flow", "the coefficients are NeqSim's equivalent-length defaults, not a verified transcription of Crane TP-410; design use requires a licensed copy of the standard or manufacturer data"]
references = ["Crane Technical Paper No. 410, \"Flow of Fluids Through Valves, Fittings and Pipe\" (2013).", "NeqSim master (118d9aff), `process/equipment/pipeline/Fittings.java` `STANDARD_LD_VALUES`, Apache-2.0: equivalent-length defaults, not a verified Crane TP-410 transcription. The one azoth-only row, `plug_valve_straightway`, remains an estimated dummy."]
[source]
standard = "Crane TP-410"
edition = "2013 method; the coefficient set is NeqSim's equivalent-length default, not a verified Crane transcription"
[inputs]
[inputs.fittings]
type = "fitting_list"
description = "One or more fitting ids, resolved against data/fittings/crane_k_factors.csv."
[inputs.f_t]
unit = "dimensionless"
description = "Darcy friction factor the resistance coefficients are based on; Crane specifies the fully turbulent value f_T at the nominal fitting size."
[outputs]
[outputs.k_total]
unit = "dimensionless"
description = "Total resistance coefficient for the listed fittings, to be used in K * (rho * v**2 / 2)."
[outputs.f_t]
unit = "dimensionless"
description = "the friction factor the coefficients were based on"
[outputs.components]
type = "record_list"
description = "one row per fitting supplied, in the order they were listed"
[outputs.components.fields]
[outputs.components.fields.fitting_id]
type = "string"
description = "the fitting's id in the registry"
[outputs.components.fields.n_ld]
unit = "dimensionless"
description = "equivalent length ratio, L_eq / D"
[outputs.components.fields.k]
unit = "dimensionless"
description = "this fitting's resistance coefficient, f_t * n_ld"
[[valid_range]]
quantity = "f_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "a non-positive friction factor gives a negative loss"
[[valid_range]]
quantity = "n_fittings"
computed_from = ["fittings"]
min = 1
severity = "error"
rationale = """\
    An empty fitting list is a caller error rather than a physical state - the calculation \
    would silently return zero loss, which reads as "no fittings" when the caller may have \
    meant to pass some.\n\
    """
[data]
fittings = "data/fittings/crane_k_factors.csv"
[worked_example]
source = "derived from the equation above"
derivation = "A 90 degree standard elbow plus a fully open gate valve, with f_t = 0.018.\n  n_ld(90_elbow)        = 30      <- NeqSim default, unverified\n  n_ld(gate_valve_open) = 8       <- NeqSim default, unverified\n  sum(n_ld)             = 38\n  K = f_t * sum(n_ld)   = 0.018 * 38 = 0.684"
tolerance = 1e-09
[worked_example.inputs]
f_t = 0.018
fittings = ["90_elbow", "gate_valve_open"]
[worked_example.expected]
k_total = 0.684
[implementations]
python = "azoth.hydraulics.crane_k_factors"
rust = "azoth_hydraulics::crane_k_factors"
[[tests]]
id = "elbow_and_gate_valve_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "single_fitting_matches_coefficient"
type = "reference"
status = "active"
source = "Derived from the equation above, with NeqSim's unverified default for `elbow_90_standard`: K = 0.019 * 30 = 0.57."
tolerance = 1e-09
[tests.inputs]
f_t = 0.019
fittings = ["90_elbow"]
[tests.expected]
k_total = 0.57
[[tests]]
id = "expanded_catalogue_tee_branch"
type = "reference"
status = "active"
source = "Derived from the equation above, with NeqSim's unverified default for `tee_branch`: K = 0.018 * 60 = 1.08."
tolerance = 1e-09
[tests.inputs]
f_t = 0.018
fittings = ["tee_branch"]
[tests.expected]
k_total = 1.08
[[tests]]
id = "scaling_is_linear_in_f_t"
type = "property"
property = "symmetry"
status = "active"
