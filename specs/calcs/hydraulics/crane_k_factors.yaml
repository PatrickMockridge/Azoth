id: hydraulics.crane_k_factors
name: Fitting resistance coefficients by the equivalent-length method
equation: "K = f_t * sum(n_ld for each fitting)"
latex: 'K = f_t \sum_{i} n_{L/D,i}'

source:
  standard: Crane TP-410
  edition: "2013"

inputs:
  fittings:
    type: fitting_list
    description: >
      One or more fitting ids, resolved against data/fittings/crane_k_factors.csv.
      An unknown id is a caller error and raises, rather than being skipped or
      treated as zero loss.

  f_t:
    unit: dimensionless
    description: >
      Darcy friction factor used as the basis for the resistance coefficients.
      Crane specifies f_T, the fully turbulent friction factor at the nominal
      fitting size. Using the actual friction factor at the flow Reynolds number
      instead is a common and slightly more accurate variant, and is what the
      `azoth pipe` CLI does. Either is defensible; both must be stated, because
      they give different answers.

outputs:
  k_total:
    unit: dimensionless
    description: >
      Total resistance coefficient for the listed fittings, to be used in
      K * (rho * v**2 / 2). Equivalent to the Darcy-Weisbach friction loss over an
      added length of pipe equal to sum(n_ld) * D.

valid_range:
  - quantity: f_t
    min: 0
    min_inclusive: false
    severity: error
    rationale: a non-positive friction factor gives a negative loss

  - quantity: n_fittings
    computed_from: [fittings]
    min: 1
    severity: error
    rationale: >
      An empty fitting list is a caller error rather than a physical state - the
      calculation would silently return zero loss, which reads as "no fittings"
      when the caller may have meant to pass some.

assumptions:
  - fully turbulent flow in the fittings, which is what the tabulated coefficients describe
  - valves are fully open; a throttled or partly open valve has a much higher coefficient and should be sized by its flow coefficient instead
  - fittings are separated by enough straight pipe that their losses do not interact
  - the fitting and the pipe are the same nominal size
  - single-phase, incompressible flow

data:
  fittings: data/fittings/crane_k_factors.csv

references:
  - Crane Technical Paper No. 410, "Flow of Fluids Through Valves, Fittings and Pipe" (2013) - the equivalent-length method and the L_eq/D approach. The coefficients in this repository are NOT taken from it.
  - "The coefficients in data/fittings/crane_k_factors.csv are estimated dummy values for software testing, with no source. They are not reproduced from, and do not represent, any copyrighted table."

worked_example:
  source: derived from the equation above
  derivation: >
    The CLI example from the project brief: a 90 degree standard elbow plus a fully
    open gate valve, with f_t = 0.018 (a typical fully turbulent friction factor for
    a 100 mm pipe).
      n_ld(90_elbow)        = 30      <- ESTIMATED DUMMY COEFFICIENT
      n_ld(gate_valve_open) = 8       <- ESTIMATED DUMMY COEFFICIENT
      sum(n_ld)             = 38
      K = f_t * sum(n_ld)   = 0.018 * 38 = 0.684
    The coefficients are placeholders (see `notes` above), so this example
    validates the arithmetic and the data lookup path only. If the dummy 30 is
    changed to any other number, the expected value here changes with it: the test
    cannot and does not tell you whether 30 is right.
  inputs:
    f_t: 0.018
    fittings: [90_elbow, gate_valve_open]
  expected: { k_total: 0.684 }
  tolerance: 1.0e-9

implementations:
  python: azoth.hydraulics.crane_k_factors
  rust: azoth_hydraulics::crane_k_factors

tests:
  - id: elbow_and_gate_valve_worked_example
    type: worked_example
    status: active
  - id: single_fitting_matches_coefficient
    type: reference
    status: active
    source: >
      Derived: a single 90 degree standard elbow at f_t = 0.019 must give exactly
      K = 0.019 * 30 = 0.57. Chosen with a different f_t from the worked example so
      a bug that hardcoded the worked example's answer would be caught.
    inputs: { f_t: 0.019, fittings: [90_elbow] }
    expected: { k_total: 0.57 }
    tolerance: 1.0e-9

  - id: scaling_is_linear_in_f_t
    type: property
    property: symmetry
    status: active
