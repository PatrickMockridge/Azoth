type = "worked_example"
status = "active"
[[tests]]
id = "the_built_in_is_the_reference_and_the_file_is_material_qualified"
type = "reference"
status = "active"
source = "The same state: the resolved geometry is the **built-in** metal Pall-Ring-50 - `120.0` m**2/m**3, void `0.96`, factor `66` - while the file's metal row (`112.6`, `0.951`, `85`) and plastic row (`111.1`, `0.919`, `180`) sit beside it under material-qualified names. **A port that let the file replace the built-in, as it did before upstream PR #4405, would answer the plastic row's flood and a different HETP.**\n"
tolerance = 1e-9
[tests.inputs]
packing = "Pall-Ring-50"
column_diameter = 1.0
packed_height = 5.0
vapor_mass_flow = 0.35
liquid_mass_flow = 3.5
vapor_density = 45.0
liquid_density = 990.0
vapor_viscosity = 1.8e-5
liquid_viscosity = 6.5e-4
surface_tension = 0.072
vapor_diffusivity = 3.3e-7
liquid_diffusivity = 1.9e-9
hydraulic_capacity_factor = 1.0
[tests.expected]
specific_surface_area = 120.0
void_fraction = 0.96
packing_factor = 66.0
percent_flood = 5.8567963880187115
hetp = 1.44
