source = "The capture's `mellapak_250y_absorber` row, which is a **structured** packing: the pressure drop's liquid-loading coefficient is `0.010` rather than `0.015` and the HETP estimate is `100/a + 0.1` rather than the nominal-size rule, so both branch on the category. Its HETP is the upper clamp again, `1.0` m from an estimate of `0.5`.\n"
tolerance = 1e-9
