id = "reactions.equilibrium_constant"
name = "Equilibrium constant of one reaction"
equation = "ln K = K1 + K2/T + K3*ln T + K4*T\n\nd(ln K)/dT = -K1/T**2 + K2/T + K3\n\ndH = d(ln K)/dT * R * T**2\n\nwith K1..K4 read from the named reaction's row in one of NeqSim's three reaction tables, and R = 8.3144621 J/(mol K) as NeqSim's `ThermodynamicConstantsInterface` fixes it."
latex = '''\ln K = K_{1} + \frac{K_{2}}{T} + K_{3}\ln T + K_{4}T, \qquad \frac{d\ln K}{dT} = -\frac{K_{1}}{T^{2}} + \frac{K_{2}}{T} + K_{3}, \qquad \Delta H = \frac{d\ln K}{dT}RT^{2}'''
assumptions = [
    "**the four coefficients are fitted, not derived.** `K2` carries the van't Hoff term, `K3` the heat-capacity term and `K4` a linear one; `K4` is zero in all but a handful of rows. A port that dropped the `ln T` term would still agree with the capture near 298 K and diverge away from it.",
    "**the three tables are different standard states, not a fallback chain.** `CO2water`'s `K1` is `253.235548` on the standard source against `653.705141388` on the Pitzer one: the two answers cross near 313 K and differ by 24 percent at 423 K.",
    "`TREF` is `298.15` in every row of all three tables and **the correlation does not read it**: it is the temperature the fit is anchored at, so `ln K` at `T = TREF` is not any particular value. Nothing here uses it.",
    "**the heat's sign is about the reaction as the table writes it.** A negative `dH` is exothermic in the forward direction the row's stoichiometry gives - `CO2 + H2O -> H2CO3` for `CO2water` - and says nothing about the reverse, which is the same row read backwards.",
    "**the lookup does not consult `usereaction`**, matching `ChemicalReactionFactory.getChemicalReaction`, which selects on the name alone. Seven of the standard table's 47 rows carry 1, so `methanecombustion` is dormant and is still answered here.",
    "**a duplicated name resolves to the first row.** `MDEAprot` appears twice in the standard table, `Austgen1989` with `usereaction` 0 and `Huttenhuis2005` with 1, and NeqSim's `dataSet.next()` takes the first - so the disabled row answers.",
    "**the row's `ACTENERGY` and `R` columns are not read here.** They parameterise the rate law, which is a property of the same row and a different quantity; on the path NeqSim actually runs, a table reaction is put on the legacy temperature correlation, which ignores both.",
    "no pressure dependence: `K` is a function of temperature and the row alone. A pressure correction would be a different standard state and is not in this correlation.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ChemicalReaction` is the port source: `getK(PhaseInterface)` for the constant and `getReactionHeat(PhaseInterface)` for the heat.",
    "van 't Hoff, J. H. (1884). \"Etudes de dynamique chimique.\" Frederik Muller & Co., Amsterdam. The `1/T` term and the relation the heat of reaction is read through.",
    "Plummer, L. N.; Busenberg, E. (1982). \"The solubilities of calcite, aragonite and vaterite in CO2-H2O solutions between 0 and 90 C.\" Geochimica et Cosmochimica Acta 46(6), 1011-1040. The `CO2water` row's own citation, carried in the table and reported as an output.",
]
[source]
standard = "NeqSim master `ChemicalReaction`"
edition = "Its `getK(PhaseInterface)` and `getReactionHeat(PhaseInterface)`, over the `REACTIONDATA` family. The coefficients are read from the row named in the `reaction` input rather than supplied by the caller, which is why no coefficient unit appears in this calc's inputs."
[inputs]
[inputs.reaction]
type = "string"
description = "The reaction's name as its table spells it - `CO2water`, `waterreac`, `carbonate`. A name the source does not carry is refused rather than defaulted.\n"
[inputs.source]
type = "enum"
values = ["standard", "pitzer", "kent-eisenberg"]
description = "which of NeqSim's three reaction tables the row is read from: `standard`, `pitzer` (the same reactions on a molality standard state, the only one whose rows carry a validation status) or `kent-eisenberg`. **Required rather than defaulting**: the three are different standard states.\n"
[inputs.T]
unit = "K"
description = "absolute temperature at which the constant is evaluated. The correlation takes `ln T`, so it is bounded below by zero and not by a fitted range.\n"
[outputs]
[outputs.ln_k]
unit = "dimensionless"
description = "`ln K` at the caller's temperature, from the row's four coefficients.\n"
[outputs.k]
unit = "dimensionless"
description = "`exp(ln_k)`. Dimensionless because the correlation's standard state is what makes the constant so.\n"
[outputs.ln_k_derivative]
unit = "1/K"
description = "`d(ln K)/dT`, van 't Hoff's derivative. The reaction heat is this times `R T**2`.\n"
[outputs.reaction_heat]
unit = "J/mol"
description = "`d(ln K)/dT * R * T**2`, the heat of reaction as the row's forward direction gives it. Negative is exothermic in that direction.\n"
[outputs.reference]
type = "string"
description = "The row's own literature citation, which the table carries per reaction and which differs between the sources: `Plummer-Busenberg1982` on the standard row of `CO2water` against `USGS-PHREEQC3-PlummerBusenberg1982-fit-0-90C` on the Pitzer one. Reported so which fit answered is visible.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature, and the correlation takes its logarithm\n"
[worked_example]
source = "NeqSim master, `ChemicalReaction.getK` and `getReactionHeat`, from `validation/neqsim/captures/reaction_probe.tsv`"
derivation = "The standard source's `CO2water` row at 298.15 K, whose coefficients the table states as `K1 = 253.235548`, `K2 = -12865.665607`, `K3 = -39.440767`, `K4 = 0`:\n\n  ln 298.15            = 5.697732638...\n  K2/T                 = -12865.665607/298.15   = -43.151799...\n  K3*ln T              = -39.440767*5.697732638  = -224.717423...\n  ln K = 253.235548 - 43.151799 - 224.717423    = -14.633690407708798\n  K    = exp(-14.633690407708798)               = 4.412340363006617e-07\n\n  d(ln K)/dT = -K2/T**2 + K3/T + K4\n             = 12865.665607/88893.4225 - 39.440767/298.15\n             = 0.144731... - 0.132285...          = 0.0124454...\n  dH         = 0.0124454... * 298.15**2 * 8.3144621  = 9199.128566216192 J/mol\n\nThe capture's row at that temperature is `lnK=-14.633690407708798 K=4.412340363006617E-7 reaction_heat=9199.128566216192`."
tolerance = 1e-12
[worked_example.inputs]
reaction = "CO2water"
source = "standard"
T = 298.15
[worked_example.expected]
ln_k = -14.633690407708798
k = 4.412340363006617e-07
reaction_heat = 9199.128566216192
[implementations]
python = "azoth.reactions.equilibrium_constant"
rust = "azoth_reactions::equilibrium_constant"
[[tests]]
id = "the_co2_water_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "the_same_row_far_from_the_reference_temperature"
type = "reference"
status = "active"
source = "The capture's `CO2water` row at 423.15 K, 125 K above the fit's anchor. A port that dropped the `ln T` term matches the worked example to eleven figures and misses this one, which is the only state that exercises `K3`.\n"
tolerance = 1e-12
[tests.inputs]
reaction = "CO2water"
source = "standard"
T = 423.15
[tests.expected]
ln_k = -15.695936068561252
k = 1.525251908618576e-07
reaction_heat = -31791.96673583765
[[tests]]
id = "the_pitzer_source_is_a_different_standard_state"
type = "reference"
status = "active"
source = "The Pitzer source's `CO2water` row at 423.15 K. **Not at 298.15 K**: the two fits are anchored near there and cross at about 313 K, so at the reference temperature they agree to eight parts in ten thousand and the state would prove nothing. At 423.15 K they differ by 0.21 in `ln K`, which is a factor of 1.24 in `K`.\n"
tolerance = 1e-12
[tests.inputs]
reaction = "CO2water"
source = "pitzer"
T = 423.15
[tests.expected]
ln_k = -15.483910703072212
k = 1.8854847466869188e-07
reaction_heat = -22651.697394518887
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
