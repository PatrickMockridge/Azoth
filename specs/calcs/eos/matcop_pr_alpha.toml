id = "eos.matcop_pr_alpha"
name = "Mathias-Copeman alpha function with a Peng-Robinson supercritical fallback"
equation = "alpha = (1 + mc1*(1 - sqrt(Tr)) + mc2*(1 - sqrt(Tr))**2 + mc3*(1 - sqrt(Tr))**3)**2 below the critical point, else the standard PR form (1 + m*(1 - sqrt(Tr)))**2 with m = 0.37464 + 1.54226*omega - 0.26992*omega**2"
latex = '''\alpha = \begin{cases} \left(1 + m(1 - \sqrt{T_r})\right)^2 & T_r > 1 \text{ or } c_1 < 10^{-20} \\ \left(1 + c_1(1 - \sqrt{T_r}) + c_2(1 - \sqrt{T_r})^2 + c_3(1 - \sqrt{T_r})^3\right)^2 & \text{otherwise} \end{cases}, \quad m = 0.37464 + 1.54226\omega - 0.26992\omega^2'''
assumptions = ["the three Mathias-Copeman coefficients are the caller's fitted parameters, not derived.\n", "above the critical temperature (``Tr > 1``), or when the first coefficient is below 1e-20, the alpha falls back to the standard Peng-Robinson form, which needs the acentric factor for ``m``.\n"]
references = ["Mathias, P. M.; Copeman, T. W. (1983). \"Extension of the Peng-Robinson equation of state to complex mixtures: evaluation of the various forms of the local composition concept.\" Fluid Phase Equilib. 13, 91-108. DOI 10.1016/0378-3812(83)80084-3."]
[source]
standard = "NeqSim 3.20.0 `AttractiveTermMatCopPR`"
edition = "`alpha(temperature)`, ported verbatim"
doi = "10.1016/0378-3812(83)80084-3"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "the acentric factor, used only for the supercritical fallback\n"
[inputs.mc1]
unit = "dimensionless"
description = "the first Mathias-Copeman coefficient\n"
[inputs.mc2]
unit = "dimensionless"
description = "the second Mathias-Copeman coefficient\n"
[inputs.mc3]
unit = "dimensionless"
description = "the third Mathias-Copeman coefficient\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes a square root of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "omega = 0.1, mc1 = 0.5, mc2 = 0.2, mc3 = -0.1, Tr = 0.7:\n\n  Tr <= 1, so the Mathias-Copeman form is used.\n  sqrt(Tr) = sqrt(0.7) = 0.8366600265340756\n  1 - sqrt(Tr) = 0.16333997346592444\n  (1 - sqrt(Tr))**2 = 0.0266799469318489\n  (1 - sqrt(Tr))**3 = 0.004357901823920472\n  inner = 1 + 0.5*0.16333997346592444 + 0.2*0.0266799469318489 - 0.1*0.004357901823920472 = 1.0865701859369399\n  alpha = 1.0865701859369399**2 = 1.180634768967036\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.1
mc1 = 0.5
mc2 = 0.2
mc3 = -0.1
Tr = 0.7
[worked_example.expected]
alpha = 1.180634768967036
[implementations]
python = "azoth.eos.matcop_pr_alpha"
rust = "azoth_eos::matcop_pr_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "supercritical_falls_back_to_pr"
type = "reference"
status = "active"
source = "Above the critical temperature the alpha falls back to the standard Peng-Robinson form, with m = 0.37464 + 1.54226*0.1 - 0.26992*0.01 = 0.5261668:\n\n  1 - sqrt(1.5) = -0.22474487139158894\n  alpha = (1 + 0.5261668*(-0.22474487139158894))**2 = 0.777477260954653\n"
tolerance = 1e-12
[tests.inputs]
omega = 0.1
mc1 = 0.5
mc2 = 0.2
mc3 = -0.1
Tr = 1.5
[tests.expected]
alpha = 0.777477260954653
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
