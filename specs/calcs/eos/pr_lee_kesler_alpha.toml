id = "eos.pr_lee_kesler_alpha"
name = "Peng-Robinson alpha function with a Soave-form m-factor"
equation = "alpha = (1 + m*(1 - sqrt(Tr)))**2 with m = 0.480 + 1.574*omega - 0.176*omega**2"
latex = '''\alpha = \left(1 + m(1 - \sqrt{T_r})\right)^2, \quad m = 0.480 + 1.574\omega - 0.176\omega^2'''
assumptions = ["despite the class name, this is the Soave (SRK) m-factor applied within the Peng-Robinson alpha form, not the Lee-Kesler BWR enthalpy method; NeqSim retains the class for backward compatibility.\n", "the alpha is cubic-agnostic; the `a` and `b` it scales are the cubic's own.\n"]
references = ["Soave, G. (1972). \"Equilibrium constants from a modified Redlich-Kwong equation of state.\" Chem. Eng. Sci. 27(6), 1197-1203."]
[source]
standard = "NeqSim master `AttractiveTermPrLeeKesler`"
edition = "`alpha(temperature)`, ported verbatim"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "the acentric factor\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes a square root of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "omega = 0.1, Tr = 0.7:\n\n  m = 0.480 + 1.574*0.1 - 0.176*0.01 = 0.63564\n  sqrt(Tr) = sqrt(0.7) = 0.8366600265340756\n  1 - sqrt(Tr) = 0.16333997346592444\n  m*(1 - sqrt(Tr)) = 0.63564*0.16333997346592444 = 0.10382542073388021\n  alpha = (1 + 0.10382542073388021)**2 = 1.2184305594583278\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.1
Tr = 0.7
[worked_example.expected]
alpha = 1.2184305594583278
[implementations]
python = "azoth.eos.pr_lee_kesler_alpha"
rust = "azoth_eos::pr_lee_kesler_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
