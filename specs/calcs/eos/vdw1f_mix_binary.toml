id = "eos.vdw1f_mix_binary"
name = "van der Waals one-fluid mixing, for a binary"
equation = """\
    a_mix = z1**2*a1 + 2*z1*(1 - z1)*(1 - k12)*(a1*a2)**0.5 + (1 - z1)**2*a2\n\
    b_mix = z1*b1 + (1 - z1)*b2\n\
    """
latex = """\
    a_{\\mathrm{mix}} = z_{1}^{2}a_{1} + 2z_{1}z_{2}\\left(1 - \
    k_{12}\\right)\\sqrt{a_{1}a_{2}} + z_{2}^{2}a_{2}, \\qquad b_{\\mathrm{mix}} = \
    z_{1}b_{1} + z_{2}b_{2}"""
assumptions = ["""\
    `k12` is a fitted parameter for the pair intended, and its correctness is NOT CHECKED - \
    this library ships no values for it and has no second source.""", "The convention is `a12 = (1 - k12)*sqrt(a1*a2)`; authors differ, so a value copied from a table without checking its convention is a plausible-looking wrong number.\n", "the two components' `A` and `B` must come from the *same* equation of state and the same temperature.\n", """\
    this is not a pressure or temperature dependence. `A` and `B` carry those; this calc \
    only combines them.""", "no volume translation is applied, and no `l12` covolume correction."]
references = ["""\
    van der Waals, J. D. (1890). \"On the Continuity of the Gaseous and Liquid States.\" \
    (the origin of the quadratic mixing form; the citation is unconfirmed - see `notes`)""", "Poling, B. E.; Prausnitz, J. M.; O'Connell, J. P. \\\"The Properties of Gases and Liquids\\\", 5th ed."]
[source]
standard = """\
    van der Waals, J. D. (1890); and the conventional one-fluid treatment in any modern \
    cubic-EOS text"""
edition = """\
    The classical mixing rule. Its modern form, and the role of k12, are set out in e.g. \
    Poling, Prausnitz & O'Connell, The Properties of Gases and Liquids, 5th ed., ch. 5."""
[inputs]
[inputs.z1]
unit = "dimensionless"
description = "Mole fraction of component 1 in the phase being mixed; component 2 is `1 - z1`, so there is no `z2` input.\n"
[inputs.a1]
unit = "dimensionless"
description = "the cubic's attraction parameter `A` for component 1, from `eos.pr_alpha_ab`"
[inputs.a2]
unit = "dimensionless"
description = "the same for component 2"
[inputs.b1]
unit = "dimensionless"
description = "the cubic's repulsion parameter `B` for component 1"
[inputs.b2]
unit = "dimensionless"
description = "the same for component 2"
[inputs.k12]
unit = "dimensionless"
description = "The binary interaction parameter for the pair, supplied by the caller; conventionally small and positive for light-hydrocarbon pairs.\n"
[outputs]
[outputs.a_mix]
unit = "dimensionless"
description = "the mixture's attraction parameter, `1/2 * sum_i sum_j z_i z_j a_ij`"
[outputs.b_mix]
unit = "dimensionless"
description = "the mixture's repulsion parameter, the mole-fraction-weighted mean of the pure ones - linear and parameter-free, with no `l12` covolume correction.\n"
[[valid_range]]
quantity = "z1"
min = 0
max = 1
severity = "error"
rationale = "A mole fraction. Both ends are admitted, since a pure component is a legitimate limiting case and `z1 = 0` or `1` must reproduce the pure-component parameters.\n"
[[valid_range]]
quantity = "a_mix"
min = 0
min_inclusive = false
severity = "error"
rationale = "`a_mix` is a quadratic form in `(z1, z2)` with matrix `[[a1, a12], [a12, a2]]` where `a12 = (1 - k12)*sqrt(a1*a2)`, so it is non-negative for every composition exactly when `0 <= k12 <= 2`.\n"
[worked_example]
source = "derived from the equation above"
derivation = "The propane-like and methane-like reduced parameters already in this namespace, at equal-ish proportions, with a k12 chosen to be round.\n**The value 0.05 is illustrative and is not a fitted parameter for this - or any - pair.**\n\n  z1 = 0.6,  a1 = 0.20206500174625697,  b1 = 0.02431127309496514\n            a2 = 0.08448417260831159,  b2 = 0.025932024634629486\n  k12 = 0.05\n\nThe three terms of the double sum, in order:\n\n  z1**2 * a1                     = 0.36 * 0.20206500174625697 = 0.0727434006286525\n  sqrt(a1*a2)                    = sqrt(0.20206500174625697 * 0.08448417260831159)\n                                 = 0.1306571639276988\n  2*z1*(1 - z1)*(1 - k12)*sqrt   = 2 * 0.6 * 0.4 * 0.95 * 0.1306571639276988\n                                 = 0.05957966675103065\n  (1 - z1)**2 * a2               = 0.16 * 0.08448417260831159 = 0.013517467617329857\n\na_mix = 0.0727434006286525 + 0.05957966675103065 + 0.013517467617329857\n      = 0.14584053499701302\n\nb_mix = 0.6 * 0.02431127309496514 + 0.4 * 0.025932024634629486\n      = 0.014586763856979084 + 0.010372809853851795\n      = 0.02495957371083088\n"
tolerance = 1e-12
[worked_example.inputs]
z1 = 0.6
a1 = 0.20206500174625697
a2 = 0.08448417260831159
b1 = 0.02431127309496514
b2 = 0.025932024634629486
k12 = 0.05
[worked_example.expected]
a_mix = 0.14584053499701302
b_mix = 0.02495957371083088
[implementations]
python = "azoth.eos.vdw1f_mix_binary"
rust = "azoth_eos::vdw1f_mix_binary"
[[tests]]
id = "propane_like_and_methane_like_with_k12"
type = "worked_example"
status = "active"
[[tests]]
id = "a_pure_component_reproduces_its_own_parameters"
type = "reference"
status = "active"
source = "Derived from the equations above: at `z1 = 1` the quadratic form must collapse to component 1's own parameters and at `z1 = 0` to component 2's.\n\n  z1 = 1: a_mix = 1**2*a1 = a1 = 0.20206500174625697,  b_mix = b1 = 0.02431127309496514\n  z1 = 0: a_mix = a2 = 0.08448417260831159,            b_mix = b2 = 0.025932024634629486\n"
tolerance = 1e-15
[tests.inputs]
z1 = 1.0
a1 = 0.20206500174625697
a2 = 0.08448417260831159
b1 = 0.02431127309496514
b2 = 0.025932024634629486
k12 = 0.05
[tests.expected]
a_mix = 0.20206500174625697
b_mix = 0.02431127309496514
[[tests]]
id = "ethane_and_a_large_k12"
type = "reference"
status = "active"
source = "Derived from the equations above, at a different composition, different parameters and a much larger interaction parameter:\n\n  z1 = 0.25, a1 = 0.115, a2 = 0.31, b1 = 0.018, b2 = 0.041, k12 = 0.4\n\n  z1**2*a1                   = 0.0625 * 0.115 = 0.0071875\n  sqrt(a1*a2)                = sqrt(0.115 * 0.31) = 0.18881207588499208\n  2*z1*(1-z1)*(1-k12)*sqrt   = 2 * 0.25 * 0.75 * 0.6 * 0.18881207588499208\n                             = 0.04248271707412321\n  (1-z1)**2*a2               = 0.5625 * 0.31 = 0.174375\n  a_mix                      = 0.0071875 + 0.04248271707412321 + 0.174375\n                             = 0.22404521707412323\n  b_mix                      = 0.25*0.018 + 0.75*0.041 = 0.0045 + 0.03075 = 0.03525\n`a_mix = 0.22404521707412323`.\n"
tolerance = 1e-12
[tests.inputs]
z1 = 0.25
a1 = 0.115
a2 = 0.31
b1 = 0.018
b2 = 0.041
k12 = 0.4
[tests.expected]
a_mix = 0.22404521707412323
b_mix = 0.03525
[[tests]]
id = "monotonic"
type = "property"
property = "monotonic"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "skipped"
skip_reason = "Every input and every output is dimensionless, so there is no unit to convert. Declared rather than omitted so the omission is a recorded decision.\n"
