id = "eos.pitzer_scale_activity"
name = "Binary Pitzer activity coefficients for a scale-forming brine"
equation = "I = 0.5 m (nu_c z_c^2 + nu_a z_a^2)\n\naPhi = A ln10 / 3,  f = -aPhi (sqrt(I)/(1 + b sqrt(I)) + 2/b ln(1 + b sqrt(I)))\n\nB_gamma = 2 beta0 + 2 beta1 (1 - (1 + x - x^2/2) exp(-x))/(alpha1^2 I),  x = alpha1 sqrt(I)\n\nln(gamma) = |z_c z_a| f + m (2 nu_c nu_a/nu) B_gamma + m^2 (3 (nu_c nu_a)^1.5/nu) C"
latex = '''I = \tfrac{1}{2}m\left(\nu_c z_c^2 + \nu_a z_a^2\right), \qquad \ln\gamma_\pm = |z_c z_a| f^\gamma + m\,\frac{2\nu_c\nu_a}{\nu}B^\gamma + m^2\,\frac{3(\nu_c\nu_a)^{3/2}}{\nu}C^\phi'''
assumptions = [
    "**the parameters are the PHREEQC `pitzer.dat` sets the tree already vendors**: `data/components/PitzerPhreeqc.csv`, read through the same catalogue the electrolyte models use, a family the table does not carry being zero as the class's padding makes it.\n",
    "the model is **binary by construction**: eight salts' mean coefficients and nine ions' mapped coefficients, with no theta/psi mixing matrix; a brine whose topology needs one is outside it.\n",
    "the six-term expression is about 298.15 K: `A0 + A1(1/T - 1/Tr) + A2 ln(T/Tr) + A3(T - Tr) + A4(T^2 - Tr^2) + A5(1/T^2 - 1/Tr^2)`.\n",
    "**trace ions are mapped by the MacInnes convention**: a divalent is `mean(salt)^3 / gamma_NaCl^2`, bicarbonate is `gamma_NaHCO3^2 / gamma_NaCl`, and sodium and chloride are the NaCl mean coefficient itself.\n",
    "**the mean coefficient computes its own ionic strength from the salt molality** and ignores the configured one; only the mapped coefficients use the configured strength. At a zero molality the mean is exactly one.\n",
    "the salt's `alpha1`/`alpha2` are 2/0 except CaCl2 and NaHCO3, which take 2/12; the beta2 term is added only when alpha2 is positive and beta2 is not zero.\n",
    "the class refuses a non-positive temperature and a negative ionic strength or molality in its constructor; this calc refuses them by range rather than in prose.\n",
]
references = [
    "NeqSim master, `pvtsimulation/flowassurance/PitzerScaleActivityModel.java`, Apache-2.0, commit f0c7436c6923766b1e22957b7075f650600457a7.",
    "`validation/neqsim/captures/pitzer_scale_activity_probe.tsv` - the Hamer-Wu NaCl curve, the eight salts' raw parameter sets, the nine coefficients at a strength grid and the products.",
    "Pitzer, K. S. (1991). Activity Coefficients in Electrolyte Solutions, 2nd edition. Hamer, W. J.; Wu, Y.-C. (1972). J. Phys. Chem. Ref. Data 1, 1047-1100. PHREEQC version 3 `pitzer.dat`.",
]
[source]
standard = "NeqSim master `PitzerScaleActivityModel`"
edition = "`getMeanActivityCoefficient`, `calculateIonActivityCoefficients`, `meanAtEquivalentIonicStrength`, `betaGammaTerm` and `temperatureParameter`, ported."
[inputs]
[inputs.temperature]
unit = "K"
description = "absolute temperature; the six-term expressions are evaluated about 298.15 K.\n"
[inputs.ionic_strength_molal]
unit = "mol/kg"
description = "the strength that configures the trace-ion mapping.\n"
[inputs.debye_huckel_a]
unit = "dimensionless"
description = "the Debye-Huckel A in log10 units, the caller's.\n"
[inputs.salt]
type = "enum"
values = ["nacl", "cacl2", "bacl2", "srcl2", "fecl2", "na2so4", "na2co3", "nahco3"]
description = "the binary salt whose mean coefficient is wanted.\n"
[inputs.salt_molality]
unit = "mol/kg"
description = "the salt's molality; the mean coefficient computes its own ionic strength from it.\n"
[inputs.ion]
type = "enum"
values = ["sodium", "chloride", "calcium", "barium", "strontium", "ferrous", "sulphate", "carbonate", "bicarbonate"]
description = "the ion whose mapped coefficient is reported.\n"
[inputs.cation]
type = "enum"
values = ["sodium", "chloride", "calcium", "barium", "strontium", "ferrous", "sulphate", "carbonate", "bicarbonate"]
description = "the product's cation.\n"
[inputs.anion]
type = "enum"
values = ["sodium", "chloride", "calcium", "barium", "strontium", "ferrous", "sulphate", "carbonate", "bicarbonate"]
description = "the product's anion.\n"
[outputs]
[outputs.mean_activity_coefficient]
unit = "dimensionless"
description = "the selected salt's mean molal activity coefficient at `salt_molality`.\n"
[outputs.ion_activity_coefficient]
unit = "dimensionless"
description = "the selected ion's coefficient at the configured strength.\n"
[outputs.activity_coefficient_product]
unit = "dimensionless"
description = "the selected cation's and anion's coefficients, multiplied.\n"
[outputs.gamma_sodium]
unit = "dimensionless"
description = "sodium's coefficient.\n"
[outputs.gamma_chloride]
unit = "dimensionless"
description = "chloride's coefficient.\n"
[outputs.gamma_calcium]
unit = "dimensionless"
description = "calcium's coefficient.\n"
[outputs.gamma_barium]
unit = "dimensionless"
description = "barium's coefficient.\n"
[outputs.gamma_strontium]
unit = "dimensionless"
description = "strontium's coefficient.\n"
[outputs.gamma_ferrous]
unit = "dimensionless"
description = "ferrous iron's coefficient.\n"
[outputs.gamma_sulphate]
unit = "dimensionless"
description = "sulphate's coefficient.\n"
[outputs.gamma_carbonate]
unit = "dimensionless"
description = "carbonate's coefficient.\n"
[outputs.gamma_bicarbonate]
unit = "dimensionless"
description = "bicarbonate's coefficient.\n"
[[valid_range]]
quantity = "temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "The class's constructor throws on it; a non-positive absolute temperature is not a state.\n"
[[valid_range]]
quantity = "ionic_strength_molal"
min = 0
min_inclusive = true
severity = "error"
rationale = "The constructor accepts zero and refuses a negative strength.\n"
[[valid_range]]
quantity = "salt_molality"
min = 0
min_inclusive = true
severity = "error"
rationale = "A molality cannot be negative; zero is the mean's exact one.\n"
[worked_example]
source = "the capture's Hamer-Wu NaCl point at 1 molal, 298.15 K, with the calculator's own Debye-Huckel A"
derivation = "NaCl at m = 1 mol/kg, T = 298.15 K, A = 0.5107140231833494:\n\n  I = 0.5*1*(1 + 1) = 1, sqrtI = 1\n  aPhi = A*ln10/3 = 0.39198749885499856\n  f = -aPhi*(1/2.2 + 2/1.2*ln(2.2)) = -0.6932851835815221\n  beta0 = 0.07534, beta1 = 0.2769 at 298.15 K\n  B_gamma = 2*0.07534 + 2*0.2769*(1 - (1 + 2 - 2)exp(-2))/(4*1) = 0.270392830035891\n  C = 0.00148\n  ln(gamma) = -0.6932851835815221 + 1*1*0.270392830035891 + 1*3*0.00148 = -0.42067235354563115\n  gamma = 0.6566052005348894\n"
tolerance = 1e-12
[worked_example.inputs]
temperature = 298.15
ionic_strength_molal = 1.0
debye_huckel_a = 0.5107140231833494
salt = "nacl"
salt_molality = 1.0
ion = "sulphate"
cation = "barium"
anion = "sulphate"
[worked_example.expected]
mean_activity_coefficient = 0.6566052005348894
ion_activity_coefficient = 0.06779517668245114
activity_coefficient_product = 0.01298921509374087
gamma_sodium = 0.6566052005348894
gamma_sulphate = 0.06779517668245114
gamma_barium = 0.191594973704127
