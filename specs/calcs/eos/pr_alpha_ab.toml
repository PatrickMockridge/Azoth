id = "eos.pr_alpha_ab"
name = "Peng-Robinson alpha function and reduced attraction parameters"
equation = """\
    alpha = (1 + kappa*(1 - Tr**0.5))**2\n\
    a_reduced = 0.45724333333*alpha*Pr/Tr**2\n\
    b_reduced = 0.077803333*Pr/Tr\n\
    """
latex = """\
    \\alpha = \\left[1 + \\kappa\\left(1 - \\sqrt{T_{r}}\\right)\\right]^{2}, \\qquad A = \
    \\frac{\\Omega_{a}\\,\\alpha\\,P_{r}}{T_{r}^{2}}, \\qquad B = \
    \\frac{\\Omega_{b}\\,P_{r}}{T_{r}}"""
assumptions = ["the alpha function is the 1976 Peng-Robinson form. PRSV, PR-Twu and every later revision change exactly this temperature dependence, so a result computed here is not comparable with one from those.\n", "kappa is positive, so alpha rises as Tr falls. It is not checked here; `eos.pr_kappa` warns when the coefficient comes out negative.\n", """\
    `Tr` and `Pr` are reduced against a critical point that is correct for the component \
    intended. NOT CHECKED - Tc and Pc are the caller's, and this calc has no second source \
    for them.""", "the range of reduced temperature over which the alpha function's fit holds is NOT established, and no bound asserts one.\n", "A and B are the reduced parameters of the Peng-Robinson cubic and go with that cubic's mixing rules, not with another equation of state's.\n", "**`Omega_a` and `Omega_b` are NeqSim's, not the paper's**: 0.45724333333 and 0.077803333, from `ComponentPR`'s `a = .45724333333*R**2*Tc**2/Pc` and `b = .077803333*R*Tc/Pc`.\n"]
references = ["Peng, D. Y.; Robinson, D. B. (1976). \\\"A New Two-Constant Equation of State.\\\" Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011.", "NeqSim master, `neqsim.thermo.component.ComponentPR`, constructor."]
[source]
standard = "Peng, D. Y.; Robinson, D. B. (1976)"
edition = """\
    A New Two-Constant Equation of State. Industrial & Engineering Chemistry Fundamentals, \
    15(1), 59-64"""
doi = "10.1021/i160057a011"
[inputs]
[inputs.kappa]
unit = "dimensionless"
description = "The Peng-Robinson alpha-function coefficient, from `eos.pr_kappa`. A property of the substance alone, with no temperature or pressure dependence.\n"
[inputs.Tr]
unit = "dimensionless"
description = "Reduced temperature, T / Tc, against the critical temperature the caller supplies.\n"
[inputs.Pr]
unit = "dimensionless"
description = "reduced pressure, P / Pc"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "The alpha function, where all of Peng-Robinson's temperature dependence lives: a square, so never negative, and 1 at Tr = 1 whatever kappa is.\n"
[outputs.a_reduced]
unit = "dimensionless"
description = "A = a*alpha*P/(R**2*T**2), the dimensionless attraction parameter called `A` in the cubic - not the dimensional `a` in Pa*m**6/mol**2.\n"
[outputs.b_reduced]
unit = "dimensionless"
description = "B = b*P/(R*T), the dimensionless repulsion parameter, called `B` in the cubic"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Tr` appears as a square root in alpha and as a squared divisor in `a_reduced`; Tr = 0 is singular, a negative Tr leaves the square root undefined, and neither is a state.\n"
[[valid_range]]
quantity = "Pr"
min = 0
min_inclusive = false
severity = "error"
rationale = "Pr = 0 drives both A and B to zero, and B is a divisor in the fugacity-coefficient expression that consumes this calc's output, so the ideal-gas limit would hand the next step a division by zero.\n"
[worked_example]
source = "derived from the equations above"
derivation = "A propane-like component at Tr = 0.8, Pr = 0.25, with the coefficient `eos.pr_kappa` gives for omega = 0.152:\n\n  sqrt(Tr)        = sqrt(0.8)                        = 0.8944271909999159\n  1 - sqrt(Tr)    = 1 - 0.8944271909999159           = 0.10557280900008414\n  kappa * that    = 0.60282728832 * 0.10557280900008414\n                                                     = 0.06364217016984601\n  1 + that                                           = 1.063642170169846\n  alpha = 1.063642170169846**2                       = 1.1313346661636197\n\n  Omega_a * alpha = 0.45724333333 * 1.1313346661636197\n                                                     = 0.5172952338684362\n  * Pr            = 0.5172952338684362 * 0.25        = 0.12932380846710906\n  / Tr**2         = 0.12932380846710906 / 0.64       = 0.20206845072985785\n  a_reduced                                          = 0.20206845072985785\n\n  Omega_b * Pr    = 0.077803333 * 0.25               = 0.01945083325\n  / Tr            = 0.01945083325 / 0.8              = 0.0243135415625\n  b_reduced                                          = 0.0243135415625\n\n"
tolerance = 1e-12
[worked_example.inputs]
kappa = 0.60282728832
Tr = 0.8
Pr = 0.25
[worked_example.expected]
alpha = 1.1313346661636197
a_reduced = 0.20206845072985785
b_reduced = 0.0243135415625
[implementations]
python = "azoth.eos.pr_alpha_ab"
rust = "azoth_eos::pr_alpha_ab"
[[tests]]
id = "propane_at_tr_0_8_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "at_the_critical_point_the_parameters_are_the_omegas"
type = "reference"
status = "active"
source = "Derived from the equations above, at Tr = Pr = 1, where `1 - sqrt(Tr)` is exactly zero, so alpha is exactly 1 whatever kappa is and A and B collapse to Omega_a and Omega_b:\n\n  sqrt(1)  = 1\n  1 - 1    = 0\n  alpha    = (1 + kappa*0)**2 = 1.0    exactly, for any kappa\n  a_reduced = Omega_a * 1 * 1 / 1**2 = 0.45724333333\n  b_reduced = Omega_b * 1 / 1        = 0.077803333\n"
tolerance = 1e-15
[tests.inputs]
kappa = 0.60282728832
Tr = 1.0
Pr = 1.0
[tests.expected]
alpha = 1.0
a_reduced = 0.45724333333
b_reduced = 0.077803333
[[tests]]
id = "supercritical_and_a_different_kappa"
type = "reference"
status = "active"
source = "Derived from the equations above, at a supercritical state with a different coefficient: methane, kappa = 0.392217407205312 at omega = 0.01142, Tr = 1.5, Pr = 0.5:\n\n  1 - sqrt(1.5) = 1 - 1.224744871391589 = -0.22474487139158894\n  kappa * that  = 0.392217407205312 * -0.22474487139158894\n                                             = -0.08814885073990032\n  alpha         = (1 - 0.08814885073990032)**2 = 0.8314725184069646\n\n  a_reduced     = 0.45724333333 * 0.8314725184069646 * 0.5 / 2.25\n                = 0.08448561464193118\n  b_reduced     = 0.077803333 * 0.5 / 1.5\n                = 0.025934444333333334\n"
tolerance = 1e-12
[tests.inputs]
kappa = 0.392217407205312
Tr = 1.5
Pr = 0.5
[tests.expected]
alpha = 0.8314725184069646
a_reduced = 0.08448561464193118
b_reduced = 0.025934444333333334
[[tests]]
id = "monotonic"
type = "property"
property = "monotonic"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "skipped"
skip_reason = """\
    Every input and every output is dimensionless, so there is no unit to convert. Declared \
    rather than omitted so the omission is a recorded decision, following `crane_k_factors` \
    and `eos.pr_kappa`.\n\
    """
