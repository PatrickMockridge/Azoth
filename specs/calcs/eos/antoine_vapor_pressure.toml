id = "eos.antoine_vapor_pressure"
name = "Antoine vapour pressure from NeqSim's correlation"
equation = "p_sat = { dippr101: exp(A + B/T + C*ln(T) + D*T**E); pow10: 1e5*10**(A - B/(T + C - 273.15)); pow10kpa: 10**(A - B/(T + C)); exp: 1e5*exp(A - B/(T + C)); wagner: exp((1-x)**-1*(A*x + B*x**1.5 + C*x**3 + D*x**6))*Pc, x = 1 - T/Tc }"
latex = '''p_{\mathrm{sat}} = \begin{cases}
e^{\,A + B/T + C \ln T + D T^{E}} & \text{dippr101}\\
10^{5}\,10^{\,A - B/(T + C - 273.15)} & \text{pow10}\\
10^{\,A - B/(T + C)} & \text{pow10kpa}\\
10^{5}\,e^{\,A - B/(T + C)} & \text{exp}\\
e^{\,(A x + B x^{3/2} + C x^{3} + D x^{6})/(1-x)}\,P_c,\ x = 1 - T/T_c & \text{wagner}
\end{cases}'''
assumptions = ["`none` is a **marker, not a form**, and is not in `form`'s vocabulary: upstream added it in `83b64e5` (PR #3775) for a row whose correlation is *unavailable*, coefficients zero. Wagner on those zeros returns `exp(0)*Pc`, so `nc12` reports `1.82e6 Pa` where its value is `42 Pa`. `_ge_phase` refuses.\n", "the five coefficients are the raw `ANTOINEA`-`ANTOINEE` NeqSim ships, in its internal unit, and the `1e5` factors recover pascals from NeqSim's bar output. NOT CHECKED - the coefficients come from the caller.\n", "`form` selects one of five correlations; the raw `AntoineVapPresLiqType` labels map as `pow10` -> `pow10`, `pow10KPa` -> `pow10kpa`, `exp`/`log` -> `exp`, `loglog`/`log10` -> `wagner` (NeqSim's dispatch has no branch for those two), and any other label with a non-zero `E` -> `dippr101`.\n", "`E` decides the form and not only the label: a non-zero `E` selects `dippr101` unless the label is `pow10` or `pow10KPa`, which keep precedence because their coefficients are log10-based. This is NeqSim's own rule, `Component.usesDipprVaporPressureCorrelation`.\n", "the rule matters because twenty rows in NeqSim's `COMP.csv` carry DIPPR-101 coefficients under the label `log`, which names the two-term exponential. Reading the label alone returns `i-pentane` at 8.3e38 bar where the correlation gives 0.918.\n", "`Tc` and `Pc` are used only by the Wagner form; the other three ignore them.\n", "the coefficients are a heterogeneous upstream mix, and 93 of this databank's rows carry one repeated filler tuple on a `log` label, which yields a near-constant pressure rather than a physical one. Upstream has since marked those rows `none`.\n"]
references = ["Antoine, C. (1888). \\\"Tensions des vapeurs; nouvelle relation entre les tensions et les températures.\\\" Comptes Rendus des Séances de l'Académie des Sciences 107, 681-684.", "Wagner, W. (1973). \\\"New vapour pressure measurements for argon and nitrogen and a new method for establishing rational vapour pressure equations.\\\" Cryogenics 13(8), 470-482. DOI 10.1016/0011-2275(73)90003-9."]
[source]
standard = "NeqSim's `getAntoineVaporPressure`"
edition = "the four correlations NeqSim master evaluates in `thermo/component/Component.java`, ported verbatim"
[inputs]
[inputs.A]
unit = "dimensionless"
description = "The first Antoine coefficient, NeqSim's internal scale.\n"
[inputs.B]
unit = "dimensionless"
description = "The second Antoine coefficient.\n"
[inputs.C]
unit = "dimensionless"
description = "The third Antoine coefficient.\n"
[inputs.D]
unit = "dimensionless"
description = "The fourth Antoine coefficient, used only by the Wagner form.\n"
[inputs.E]
unit = "dimensionless"
description = "The fifth Antoine coefficient, the DIPPR-101 exponent. Used by `dippr101` and ignored by the other four; a non-zero value also selects that form.\n"
[inputs.form]
type = "enum"
values = ["dippr101", "pow10", "pow10kpa", "exp", "wagner"]
description = "The correlation form, one of the five NeqSim evaluates. `dippr101` is selected by a non-zero `E` rather than by the label; see the assumptions.\n"
[inputs.Tc]
unit = "K"
description = "Critical temperature, used only by the Wagner form.\n"
[inputs.Pc]
unit = "Pa"
description = "Critical pressure, used only by the Wagner form.\n"
[inputs.T]
unit = "K"
description = "Absolute temperature.\n"
[outputs]
[outputs.p_sat]
unit = "Pa"
description = "The pure-component vapour pressure at `T`.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute temperature; zero and below are not states.\n"
[[valid_range]]
quantity = "Tc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Tc` is the divisor in `x = 1 - T/Tc` for the Wagner form; zero or negative is not a critical temperature.\n"
[[valid_range]]
quantity = "Pc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Pc` scales the Wagner form; a non-positive value is not a critical pressure.\n"
[worked_example]
source = "derived from the equation above"
derivation = "Methane's coefficients, A = 5.23243, B = 891.0098, C = 332.0975, D = 0, E = 0, with form `pow10`, at T = 300 K:\n\n  B / (T + C - 273.15) = 891.0098 / (300 + 332.0975 - 273.15) = 891.0098 / 358.9475 = 2.482284\n  A - that                 = 5.23243 - 2.482284 = 2.750146\n  10**2.750146             = 562.5298119539252\n  p_sat = 1e5 * 562.5298119539252 = 56252981.19539252 Pa\n\nwhich reproduces NeqSim's `getAntoineVaporPressure` (562.5298119539252 bar).\n"
tolerance = 1e-12
[worked_example.inputs]
A = 5.23243
B = 891.0098
C = 332.0975
D = 0.0
E = 0.0
form = "pow10"
Tc = 190.56
Pc = 4599000.0
T = 300.0
[worked_example.expected]
p_sat = 56252981.19539252
[implementations]
python = "azoth.eos.antoine_vapor_pressure"
rust = "azoth_eos::antoine_vapor_pressure"
[[tests]]
id = "methane_pow10_worked_example"
type = "worked_example"
status = "active"
