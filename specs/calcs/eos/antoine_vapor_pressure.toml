[[tests]]
id = "223_tm_c4_wagner"
type = "reference"
status = "active"
source = "Derived from the equation above, at 223-TM-C4's `loglog` coefficients (the Wagner fall-through), A = -7.76451, B = 1.45838, C = -2.7758, D = -1.23303, Tc = 531.1 K, Pc = 2.95e6 Pa, T = 300 K:\n\n  x = 1 - 300/531.1 = 0.435134626\n  poly = -7.76451*x + 1.45838*x**1.5 - 2.7758*x**3 - 1.23303*x**6 = -3.197066556\n  exp(poly / (1-x)) = exp(-3.197066556 / 0.564865374) = 0.003482957491\n  p_sat = 0.003482957491 * 2.95e6 = 10274.724598532119 Pa, matching NeqSim's 0.1027472459853213 bar.\n"
tolerance = 1e-12
[tests.inputs]
A = -7.76451
B = 1.45838
C = -2.7758
D = -1.23303
E = 0.0
form = "wagner"
Tc = 531.1
Pc = 2950000.0
T = 300.0
[tests.expected]
