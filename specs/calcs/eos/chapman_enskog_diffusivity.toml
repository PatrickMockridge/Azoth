id = "eos.chapman_enskog_diffusivity"
name = "Gas binary diffusivity from the Chapman-Enskog theory"
equation = "D = 0.00266 * T**1.5 / (P * sqrt(MAB) * sigmaAB**2 * OmegaD(T/epsAB))   [cm**2/s], with MAB in g/mol, sigmaAB in angstrom, epsAB in K, P in bar and T in K, and OmegaD the Neufeld collision integral; D*1e-4 recovers m**2/s."
latex = '''D_{AB} = \frac{0.00266\,T^{1.5}}{P\,\sqrt{M_{AB}}\,\sigma_{AB}^{2}\,\Omega_D\!\left(\frac{T}{\varepsilon_{AB}}\right)},\qquad \Omega_D = \frac{A}{t^{B}} + \frac{C}{e^{Dt}} + \frac{E}{e^{Ft}} + \frac{G}{e^{Ht}}'''
assumptions = ["**this is a gas phase's default diffusivity, not Fuller's.** `GasPhysicalProperties` assigns the base `Diffusivity` class to a gas, and the Fuller class is reached only by `setDiffusionCoefficientModel`. `RateBasedPackedColumn` selects nothing, so this is what its segment fluxes use.\n", "the pair parameters are inputs; `azoth_eos::databank::lennard_jones_pair` combines two components' values the way `GasPhysicalPropertyMethod` does: `sigma = (sigma_i + sigma_j)/2`, `eps = sqrt(eps_i eps_j)`, `MAB = 2/(1/M_i + 1/M_j)` in **g/mol**.\n", "the correlation is dimensionless in `eps` and `t = T/eps`, and NeqSim prints a `kg/mol` molar mass into it: this spec takes kg/mol and multiplies by 1000 for the g/mol the equation is written in.\n", "outside NeqSim's `Diffusivity.T_MIN`/`T_MAX` band the class *warns* rather than refusing (`enableTemperatureWarnings`); the port says the same in its own vocabulary.\n"]
references = ["Chapman, S.; Enskog, D. (1917). \\\"The kinetic theory of gases.\\\" Cambridge University Press. The first-approximation pair diffusivity of a dilute gas.", "Neufeld, P. D.; Janzen, A. R.; Aziz, R. A. (1972). \\\"Empirical equations to calculate 16 of the transport collision integrals for the Lennard-Jones (12-6) potential.\\\" J. Chem. Phys. 57(3), 1100-1102. DOI 10.1063/1.1678363. The collision integral's eight coefficients.", "Poling, B. E.; Prausnitz, J. M.; O'Connell, J. P. (2001). \\\"The Properties of Gases and Liquids\\\", 5th ed., McGraw-Hill. Table E-1 carries the textbook Lennard-Jones parameters; `Diffusivity.useDiffusionLJOverride` is the switch between them and the database values.", "`validation/neqsim/captures/phase_transport_probe.tsv` - the phase's own transport properties and the default binary matrix, four fluids, and per row the value the explicitly selected `Chapman-Enskog` model answers.\n"]
[source]
standard = "Chapman, S.; Enskog, D. (1917)"
edition = "The first-approximation gas pair diffusivity, with Neufeld's collision-integral fit; ported from NeqSim's `physicalproperties/methods/gasphysicalproperties/diffusivity/Diffusivity.calcBinaryDiffusionCoefficient`."
doi = "10.1063/1.1678363"
[inputs]
[inputs.MA]
unit = "kg/mol"
description = "Molar mass of the first component of the pair.\n"
[inputs.MB]
unit = "kg/mol"
description = "Molar mass of the second.\n"
[inputs.sigma]
unit = "m"
description = "The **pair's** Lennard-Jones collision diameter, in metres - NeqSim's `binaryMolecularDiameter`, in angstrom times 1e-10. The combining rule is in `azoth_eos::databank::lennard_jones_pair`.\n"
[inputs.eps]
unit = "K"
description = "The **pair's** Lennard-Jones energy parameter over Boltzmann's constant, in kelvin - NeqSim's `binaryEnergyParameter`.\n"
[inputs.T]
unit = "K"
description = "Absolute temperature.\n"
[inputs.P]
unit = "Pa"
description = "Absolute pressure, which the correlation takes in bar - the port converts.\n"
[outputs]
[outputs.d]
unit = "m**2/s"
description = "The pair's binary diffusion coefficient.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute temperature; zero and below are not states.\n"
[[valid_range]]
quantity = "T"
min = 200.0
max = 2000.0
min_inclusive = true
max_inclusive = true
severity = "warning"
rationale = "`Diffusivity.T_MIN` and `T_MAX`: outside that band the class's own `enableTemperatureWarnings` says the correlation is not validated.\n"
[[valid_range]]
quantity = "sigma"
min = 0
min_inclusive = false
severity = "error"
rationale = "`sigma` is squared and divides; a non-positive collision diameter is not a pair.\n"
[[valid_range]]
quantity = "eps"
min = 0
min_inclusive = false
severity = "error"
rationale = "`T/eps` is the collision integral's argument; a non-positive energy parameter is not a pair.\n"
[worked_example]
source = "the capture's `methane_nitrogen_298K_1atm` row, on the **database** Lennard-Jones parameters - the route the rate-based column takes\n"
derivation = "methane and nitrogen at 298.15 K and 1.01325 bar. The database's parameters are methane 2.52 angstrom / 155.809006022 K and nitrogen 3.132506748 angstrom / 126.578386713 K, and `lennard_jones_pair` combines them:\n\n  sigma = (2.52 + 3.132506748)/2 = 2.826253374 angstrom = 2.826253374e-10 m\n  eps   = sqrt(155.809006022 * 126.578386713) = 140.43522570075095 K\n  MAB   = 2/(1/0.016043 + 1/0.0280135) = 20.402010168760572 g/mol\n\n  t = 298.15/140.43522570075095 = 2.123046\n  OmegaD = 1.06036/t**0.15610 + 0.19300/e**(0.47635 t) + 1.03587/e**(1.52996 t) + 1.76474/e**(3.89411 t) = 1.053684068773204\n  D = 0.00266 * 298.15**1.5 / (1.01325 * sqrt(20.402010168760572) * 2.826253374**2 * 1.053684068773204) = 0.3555070057344887 cm**2/s\n  D = 3.555070057344887e-5 m**2/s\n\nwhich is NeqSim's own default answer for the row, to the last digit.\n"
tolerance = 1e-12
[worked_example.inputs]
MA = 0.016043
MB = 0.0280135
sigma = 2.826253374e-10
eps = 140.43522570075095
T = 298.15
P = 101325.0
[worked_example.expected]
d = 3.555070057344887e-5
[implementations]
python = "azoth.eos.chapman_enskog_diffusivity"
rust = "azoth_eos::chapman_enskog_diffusivity"
[[tests]]
id = "methane_nitrogen_database_lennard_jones_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "the_textbook_parameters_are_a_second_route"
type = "reference"
status = "active"
source = "The same pair on Poling's **textbook** Lennard-Jones parameters, which is what selecting the `\"Chapman-Enskog\"` model does through `useDiffusionLJOverride(true)`: methane 3.758 angstrom / 148.6 K, nitrogen 3.798 angstrom / 71.4 K, from the class's own `DIFFUSION_LJ_PARAMS` table.\n\n  sigma = 3.778 angstrom, eps = 103.00504841996823 K\n  d = 2.1853611628506023e-5 m**2/s\n\n**The two routes differ by 63 per cent**, and the textbook one is the accurate one: Marrero & Mason (1972) measure `2.2e-5` for this pair, so the default route is 62 per cent high and this one is within one per cent. That is not this id's business - it takes the parameters it is given - but it is why the port records both.\n"
tolerance = 1e-12
[tests.inputs]
MA = 0.016043
MB = 0.0280135
sigma = 3.778e-10
eps = 103.00504841996823
T = 298.15
P = 101325.0
[tests.expected]
d = 2.1853611628506023e-5
