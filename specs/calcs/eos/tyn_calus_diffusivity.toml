id = "eos.tyn_calus_diffusivity"
name = "Liquid binary diffusivity from the Tyn-Calus correlation"
equation = "D = 8.93e-8 * VB**0.267 * T / (eta*VA**0.433)   [cm**2/s],  with VA and VB in cm**3/mol, eta in cP and T in K; the molar volumes are clamped to [20, 600] cm**3/mol and the viscosity to [0.01, 500] cP, and D*1e-4 recovers m**2/s."
latex = '''D_{AB}^0 = 8.93\times10^{-8}\,\frac{V_B^{0.267}\,T}{\eta_B\,V_A^{0.433}}'''
assumptions = ["`VA` and `VB` are the solute and solvent liquid molar volumes at the normal boiling point; the caller gets them as `M/rho_normal`, or the Tyn-Calus estimate `0.285*Vc**1.048` when the density is unknown.\n", "`eta` is the *solvent* viscosity at `T`, in the same unit the correlation expects (cP); a caller converts a Pa*s viscosity by multiplying by 1000.\n", "the molar volumes and viscosity are clamped to NeqSim's `[20, 600]` cm**3/mol and `[0.01, 500]` cP; the correlation is not applied outside them.\n", "the correlation is for a *binary* pair at infinite dilution of the solute in the solvent.\n"]
references = ["Tyn, M. T.; Calus, W. F. (1975). \\\"Diffusion coefficients in dilute binary liquid mixtures.\\\" J. Chem. Eng. Data 20(1), 106-109. DOI 10.1021/je60064a006."]
[source]
standard = "Tyn, M. T.; Calus, W. F. (1975)"
edition = "Diffusion coefficients in dilute binary liquid mixtures. J. Chem. Eng. Data 20(1), 106-109"
doi = "10.1021/je60064a006"
[inputs]
[inputs.VA]
unit = "m**3/mol"
description = "Solute molar volume at its normal boiling point.\n"
[inputs.VB]
unit = "m**3/mol"
description = "Solvent molar volume at its normal boiling point.\n"
[inputs.T]
unit = "K"
description = "Absolute temperature.\n"
[inputs.eta]
unit = "Pa*s"
description = "Solvent dynamic viscosity at `T`.\n"
[outputs]
[outputs.d]
unit = "m**2/s"
description = "The binary diffusion coefficient at infinite dilution, the published equation's D.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute temperature; zero and below are not states.\n"
[worked_example]
source = "derived from the equation above"
derivation = "benzene in toluene at 298.15 K: VA = 88.1648 cm**3/mol, VB = 105.7876 cm**3/mol, eta = 0.91635 cP:\n\n  VA = 8.816478555304741e-5 m**3/mol -> 88.1648 cm**3/mol (no clamp, within [20, 600])\n  VB = 1.0578760045924226e-4 m**3/mol -> 105.7876 cm**3/mol (no clamp)\n  eta = 9.163501315189954e-4 Pa*s -> 0.91635 cP\n  D = 8.93e-8 * 105.7876**0.267 * 298.15 / (0.91635 * 88.1648**0.433) = 1.4502274002446276e-5 cm**2/s\n  D = 1.4502274002446276e-9 m**2/s\n\nwhich is NeqSim `TynCalusDiffusivity`'s value at the same state.\n"
tolerance = 1e-12
[worked_example.inputs]
VA = 8.816478555304741e-5
VB = 1.0578760045924226e-4
T = 298.15
eta = 9.163501315189954e-4
[worked_example.expected]
d = 1.4502274002446276e-9
[implementations]
python = "azoth.eos.tyn_calus_diffusivity"
rust = "azoth_eos::tyn_calus_diffusivity"
[[tests]]
id = "benzene_in_toluene_worked_example"
