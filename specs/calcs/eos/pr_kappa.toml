id = "eos.pr_kappa"
name = "Peng-Robinson attraction-parameter coefficient"
equation = "kappa = 0.37464 + 1.54226*omega - 0.26992*omega**2"
latex = '''\kappa = 0.37464 + 1.54226\,\omega - 0.26992\,\omega^{2}'''
assumptions = ["""\
    the acentric factor supplied is correct for the component intended. NOT CHECKED - this \
    calc has no databank and no second source; omega comes from the caller and is taken at \
    face value.""", "omega is taken as the constant Pitzer acentric factor evaluated at Tr = 0.7.\n", "the coefficient applies to the 1976 Peng-Robinson alpha function and to nothing else; a kappa from here is not comparable with one from another revision.\n", "the range of acentric factors over which the correlation was fitted is NOT established, and no bound asserts one.\n", "this calc returns a coefficient, not an equation of state.\n"]
references = ["Peng, D. Y.; Robinson, D. B. (1976). \\\"A New Two-Constant Equation of State.\\\" Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011.", "Pitzer, K. S. (1955). \\\"The Volumetric and Thermodynamic Properties of Fluids. I. Theoretical Basis and Virial Coefficients.\\\" J. Am. Chem. Soc. 77(13), 3427-3433. DOI 10.1021/ja01618a002."]
[source]
standard = "Peng, D. Y.; Robinson, D. B. (1976)"
edition = """\
    A New Two-Constant Equation of State. Industrial & Engineering Chemistry Fundamentals, \
    15(1), 59-64"""
doi = "10.1021/i160057a011"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "Acentric factor of the pure component, as defined by Pitzer at a reduced temperature of 0.7: -log10(Pr_sat/Pr_c) - 1.\n"
[outputs]
[outputs.kappa]
unit = "dimensionless"
description = "The coefficient in the Peng-Robinson alpha function, alpha = (1 + kappa*(1 - sqrt(Tr)))**2. A property of the substance alone, with no temperature or pressure dependence.\n"
[[valid_range]]
quantity = "kappa"
min = 0
min_inclusive = false
severity = "warning"
rationale = "The polynomial passes through zero at omega = -0.23338349942403008 and omega = 5.947150541510574, and kappa is negative below the lower one.\n"
[worked_example]
source = "derived from the equation above"
derivation = "Propane-like, omega = 0.152 - the conventional acentric factor for propane:\n\n  1.54226 * omega      = 1.54226 * 0.152            = 0.23442352\n  omega**2             = 0.152 * 0.152              = 0.023104\n  0.26992 * omega**2   = 0.26992 * 0.023104         = 0.00623623168\n  0.37464 + 0.23442352 = 0.60906352\n  0.60906352 - 0.00623623168 = 0.60282728832\n\nkappa = 0.60282728832.\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.152
[worked_example.expected]
kappa = 0.60282728832
[implementations]
python = "azoth.eos.pr_kappa"
rust = "azoth_eos::pr_kappa"
[[tests]]
id = "propane_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "methane_at_a_very_different_acentric_factor"
type = "reference"
status = "active"
source = "Derived from the equation above, at an acentric factor far from the worked example's: methane, omega = 0.01142.\n\n  1.54226 * 0.01142       = 0.0176126092\n  0.01142**2              = 0.0001304164\n  0.26992 * 0.0001304164  = 0.000035201994688\n  0.37464 + 0.0176126092  = 0.3922526092\n  0.3922526092 - 0.000035201994688 = 0.392217407205312\n\nkappa = 0.392217407205312, the exact decimal value.\n"
tolerance = 1e-12
[tests.inputs]
omega = 0.01142
[tests.expected]
kappa = 0.392217407205312
[[tests]]
id = "a_negative_acentric_factor_warns"
type = "reference"
status = "active"
source = "Derived from the equation above, at helium's acentric factor, omega = -0.385:\n\n  1.54226 * -0.385    = -0.59377010\n  (-0.385)**2         = 0.148225\n  0.26992 * 0.148225  = 0.04000889200\n  0.37464 - 0.59377010 = -0.21913010\n  -0.21913010 - 0.04000889200 = -0.25913899200\n\nkappa = -0.259138992, below the polynomial's root at omega = -0.23338349942403008: returned carrying OUT_OF_VALID_RANGE.\n"
tolerance = 1e-09
[tests.inputs]
omega = -0.385
[tests.expected]
kappa = -0.259138992
[[tests]]
id = "monotonic"
type = "property"
property = "monotonic"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "skipped"
skip_reason = "Both the input and the output are dimensionless, so there is no unit to convert. Declared rather than omitted so the omission is a recorded decision.\n"
