id = "eos.mollerup_alpha"
name = "Mollerup alpha function"
equation = "alpha = 1 + p1*(1/Tr - 1) + p2*Tr*ln(Tr) + p3*(Tr - 1)"
latex = '''\alpha = 1 + p_1\left(\frac{1}{T_r} - 1\right) + p_2\,T_r\ln T_r + p_3\left(T_r - 1\right)'''
assumptions = ["the three parameters are the caller's fitted Mollerup coefficients; NeqSim's default is all zero, which is the trivial alpha of one.\n", "the alpha is cubic-agnostic; the `a` and `b` it scales are the cubic's own.\n"]
references = ["Mollerup, J. (1986). \"Thermodynamic properties from a cubic equation of state.\" Fluid Phase Equilib. 25, 329-352."]
[source]
standard = "NeqSim 3.20.0 `AttractiveTermMollerup`"
edition = "`alpha(temperature)`, ported verbatim"
[inputs]
[inputs.p1]
unit = "dimensionless"
description = "the first Mollerup parameter\n"
[inputs.p2]
unit = "dimensionless"
description = "the second Mollerup parameter\n"
[inputs.p3]
unit = "dimensionless"
description = "the third Mollerup parameter\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes `1/Tr` and `ln(Tr)`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "p1 = 0.1, p2 = 0.05, p3 = 0.02, Tr = 0.7:\n\n  1/Tr - 1 = 1/0.7 - 1 = 0.4285714285714286\n  Tr*ln(Tr) = 0.7*ln(0.7) = -0.2496724607571127\n  Tr - 1 = -0.3\n  alpha = 1 + 0.1*0.4285714285714286 + 0.05*(-0.2496724607571127) + 0.02*(-0.3) = 1.0243735198192874\n"
tolerance = 1e-12
[worked_example.inputs]
p1 = 0.1
p2 = 0.05
p3 = 0.02
Tr = 0.7
[worked_example.expected]
alpha = 1.0243735198192874
[implementations]
python = "azoth.eos.mollerup_alpha"
rust = "azoth_eos::mollerup_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
