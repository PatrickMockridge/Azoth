id = "eos.twucoon_statoil_alpha"
name = "Twu-Coon Statoil alpha function"
equation = "alpha = Tr**(c*(b-1)) * exp(a*(1 - Tr**(b*c)))"
latex = '''\alpha = T_r^{c(b-1)} \exp\left(a\left(1 - T_r^{bc}\right)\right)'''
assumptions = ["the three parameters are the caller's fitted Twu-Coon parameters, not the cubic's `a` and `b`.\n", "the alpha is cubic-agnostic; the `a` and `b` it scales are the cubic's own.\n", "the formula is arithmetic-identical to `twucoon_param_alpha`; NeqSim ships both classes, selecting this one for mercury.\n"]
references = ["Twu, C. H.; Coon, J. E.; Cunningham, J. R. (1995). \"A new generalized alpha function for a cubic equation of state. Part 1. Peng-Robinson equation.\" Fluid Phase Equilib. 105, 49-59. DOI 10.1016/0378-3812(94)02601-V."]
[source]
standard = "NeqSim master `AttractiveTermTwuCoonStatoil`"
edition = "`alpha(temperature)`, ported verbatim"
doi = "10.1016/0378-3812(94)02601-V"
[inputs]
[inputs.a]
unit = "dimensionless"
description = "the first Twu-Coon parameter\n"
[inputs.b]
unit = "dimensionless"
description = "the second Twu-Coon parameter\n"
[inputs.c]
unit = "dimensionless"
description = "the third Twu-Coon parameter\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes fractional powers of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "a = 0.5, b = 0.5, c = 2.0, Tr = 0.5:\n\n  c*(b-1) = 2.0*(0.5-1) = -1.0\n  Tr**(c*(b-1)) = 0.5**-1.0 = 2.0\n  b*c = 0.5*2.0 = 1.0\n  Tr**(b*c) = 0.5**1.0 = 0.5\n  1 - Tr**(b*c) = 0.5\n  a*(1 - Tr**(b*c)) = 0.5*0.5 = 0.25\n  exp(0.25) = 1.2840254166877414\n  alpha = 2.0 * 1.2840254166877414 = 2.568050833375483\n"
tolerance = 1e-12
[worked_example.inputs]
a = 0.5
b = 0.5
c = 2.0
Tr = 0.5
[worked_example.expected]
alpha = 2.568050833375483
[implementations]
python = "azoth.eos.twucoon_statoil_alpha"
rust = "azoth_eos::twucoon_statoil_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
