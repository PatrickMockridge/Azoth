id = "eos.rk_departure"
name = "Redlich-Kwong fugacity coefficient and departure functions"
equation = """\
    psi = -1/2\n\
    I = ln((z + b_reduced)/z)\n\
    c = a_reduced/b_reduced\n\
    ln_phi = z - 1 - ln(z - b_reduced) - c*I\n\
    h_dep_rt = (z - 1) + c*(psi - 1)*I\n\
    s_dep_r = ln(z - b_reduced) + c*psi*I\n\
    """
latex = """\
    \\psi = -\\frac{1}{2}, \\qquad I = \\ln\\frac{z + B}{z}, \\qquad C = \\frac{A}{B}, \
    \\qquad \\ln\\varphi = z - 1 - \\ln\\left(z - B\\right) - CI, \\qquad \
    \\frac{H^{R}}{RT} = \\left(z - 1\\right) + C\\left(\\psi - 1\\right)I, \\qquad \
    \\frac{S^{R}}{R} = \\ln\\left(z - B\\right) + C\\psi I"""
assumptions = ["**`z` is a root of the cubic that `a_reduced` and `b_reduced` define.** NOT CHECKED here, and not checkable: it would mean solving the cubic.\n", "the departure functions are relative to the ideal-gas state at the same temperature and pressure.\n", "no mixing rule is applied. These are pure-component departure functions, computed from the composition-weighted `A` and `B` a caller passes.\n", "the alpha derivative `psi` is the constant `-1/2` - RK's `1/sqrt(Tr)` has no fitted coefficient, so `psi` and `T*dpsi/dT` are constants and this calc takes neither `kappa` nor `Tr`.\n"]
references = ["Redlich, O.; Kwong, J. N. S. (1949). \\\"On the Thermodynamics of Solutions. V.\\\" Chemical Reviews 44(1), 233-244. DOI 10.1021/cr60137a013."]
[source]
standard = "Redlich, O.; Kwong, J. N. S. (1949)"
edition = "On the Thermodynamics of Solutions. V. Chemical Reviews, 44(1), 233-244"
doi = "10.1021/cr60137a013"
[inputs]
[inputs.a_reduced]
unit = "dimensionless"
description = "the cubic's attraction parameter `A`, from `eos.rk_alpha_ab`"
[inputs.b_reduced]
unit = "dimensionless"
description = "the cubic's repulsion parameter `B`, from `eos.rk_alpha_ab`"
[inputs.z]
unit = "dimensionless"
description = "The compressibility factor, from the cubic. This calc does not check that `z` is a root of the cubic `A` and `B` define.\n"
[outputs]
[outputs.ln_phi]
unit = "dimensionless"
description = "The logarithm of the fugacity coefficient.\n"
[outputs.h_dep_rt]
unit = "dimensionless"
description = "The departure enthalpy divided by `R*T`.\n"
[outputs.s_dep_r]
unit = "dimensionless"
description = "the departure entropy divided by `R`"
[outputs.cp_dep_r]
unit = "dimensionless"
description = "The departure heat capacity divided by `R`.\n"
[[valid_range]]
quantity = "b_reduced"
min = 0
min_inclusive = false
severity = "error"
rationale = "`b_reduced` appears as a divisor in the coefficient `A/B`, and at B = 0 the departure functions are zero - the ideal-gas limit, which is not reachable by division.\n"
[[valid_range]]
quantity = "z_minus_b_reduced"
computed_from = ["z", "b_reduced"]
min = 0
min_inclusive = false
severity = "error"
rationale = "`z` appears as `ln(z - b_reduced)`, so `z = b_reduced` is the zero-volume limit and `z < b_reduced` makes the logarithm of a negative number.\n"
[worked_example]
source = "derived from the equations above"
derivation = "The vapour root of the propane-like state in this namespace:\n\n  A = 0.1866943088347048    from eos.rk_alpha_ab at Tr = 0.8, Pr = 0.25\n  B = 0.02707510936404929   from the same call\n  z = 0.8119920001727409    the larger admissible root\n\n  psi = -1/2\n  I   = ln((z + B)/z) = ln(0.8390671095367901 / 0.8119920001727409) = 0.03281681856870471\n  C   = A/B = 0.1866943088347048 / 0.02707510936404929 = 6.895440705963152\n  z - B = 0.7849168908086916,   ln(z - B) = -0.2422426534574107\n\nAnd the outputs:\n\n  ln_phi   = z - 1 - ln(z - B) - C*I = -0.17200180559684855\n  h_dep_rt = (z - 1) + C*(psi - 1)*I = -0.5272648660603503\n  s_dep_r  = ln(z - B) + C*psi*I      = -0.3552630604635018\n\nThe identity closes: h_dep_rt - s_dep_r = -0.1720018055968485 against ln_phi = -0.17200180559684855.\n\n"
tolerance = 1e-12
[worked_example.inputs]
a_reduced = 0.1866943088347048
b_reduced = 0.02707510936404929
z = 0.8119920001727409
[worked_example.expected]
ln_phi = -0.17200180559684855
h_dep_rt = -0.5272648660603503
s_dep_r = -0.3552630604635018
cp_dep_r = 1.2455752814017873
[implementations]
python = "azoth.eos.rk_departure"
rust = "azoth_eos::rk_departure"
[[tests]]
id = "propane_vapour_root_worked_example"
type = "worked_example"
status = "active"
