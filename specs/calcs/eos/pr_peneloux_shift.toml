id = "eos.pr_peneloux_shift"
name = "Peng-Robinson Peneloux volume-translation parameter"
equation = "c = 0.50033*(0.25969 - Z_RA)*R*Tc/Pc,  Z_RA = 0.29056 - 0.08775*omega"
latex = '''c = 0.50033\,\left(0.25969 - Z_{\mathrm{RA}}\right)\frac{R\,T_c}{P_c}, \qquad Z_{\mathrm{RA}} = 0.29056 - 0.08775\,\omega'''
assumptions = ["the acentric factor, critical temperature and critical pressure are those of the component intended. NOT CHECKED - this calc has no databank and no second source; all three come from the caller and are taken at face value.\n", "`Z_RA` is the Rackett compressibility: the caller's when `z_ra` is given and non-zero, else `0.29056 - 0.08775*omega`. **That is NeqSim's own rule** - `ComponentPR.getVolumeCorrection()` reads the databank's `RACKETZ` field and falls back to the correlation only where it is below `1e-10`.\n", "**the fallback is the wrong answer for 132 of the 348 rows**, which carry a `RACKETZ` the correlation does not reproduce - for water the *sign* is wrong: `+2.929079e-6` from the table against `-8.05e-8` from the correlation, a 14% density difference.\n", "`R` is the exact molar gas constant from the 2019 SI definition, not NeqSim's truncated `8.3144621` - the same value `eos.pr_molar_volume` uses, and the shift is subtracted from that calc's volume.\n", "the shift is a volume translation only: it corrects the reported molar volume and density and does not change phase equilibrium, which NeqSim's own `SystemPrEosvolcor` documents.\n", """\
    NeqSim's `ComponentPRvolcor.calculatePenelouxShift()` holds a second expression, \
    `0.1154 - 0.4406*(0.29056 - 0.08775*omega)`, but it is private dead code - \
    `getVolumeCorrection()` returns the `0.50033*(0.25969 - Z_RA)` form this ports.""",
"applying the shift is the caller's step: `v_corr = v - sum_i x_i*c_i`, with `v` from `eos.pr_molar_volume` and the per-component shifts mixed linearly.\n"]
references = ["Péneloux, A.; Rauzy, E.; Fréze, R. (1982). \\\"A consistent correction for Redlich-Kwong-Soave volumes.\\\" Fluid Phase Equilibria 8(1), 7-23. DOI 10.1016/0378-3812(82)80002-2.", "Rackett, H. G. (1970). \\\"Equation of state for saturated liquids.\\\" J. Chem. Eng. Data 15(4), 514-517. DOI 10.1021/je60047a012."]
[source]
standard = "Péneloux, A.; Rauzy, E.; Fréze, R. (1982)"
edition = "A consistent correction for Redlich-Kwong-Soave volumes. Fluid Phase Equilibria, 8(1), 7-23"
doi = "10.1016/0378-3812(82)80002-2"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "Acentric factor of the pure component, as in `eos.pr_kappa`.\n"
[inputs.Tc]
unit = "K"
description = "Critical temperature of the pure component.\n"
[inputs.Pc]
unit = "Pa"
description = "Critical pressure of the pure component.\n"
[inputs.z_ra]
unit = "dimensionless"
optional = true
description = """\
    The Rackett compressibility ``Z_RA``, the databank's NeqSim ``RACKETZ`` column. \
    **A zero means the table carries none and the correlation is used** - NeqSim's own \
    rule: ``ComponentPR.getVolumeCorrection()`` replaces the field with \
    ``0.29056 - 0.08775*omega`` only where it is below ``1e-10``.\n\
    """
[outputs]
[outputs.c]
unit = "m**3/mol"
description = "The volume-translation parameter. A property of the substance alone; `v_corr = v - c` where `v` is the untranslated molar volume.\n"
[[valid_range]]
quantity = "Tc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Tc` is a factor in the numerator, so a non-positive value would give a non-positive or reversed shift, and a critical temperature at or below zero is not a substance.\n"
[[valid_range]]
quantity = "Pc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Pc` is a divisor; zero pressure is not a critical point and a negative one is not a state.\n"
[worked_example]
source = "derived from the equation above"
derivation = "Propane-like, omega = 0.152, Tc = 369.83 K, Pc = 4.248e6 Pa:\n\n  Z_RA = 0.29056 - 0.08775*0.152 = 0.277222\n  0.25969 - Z_RA              = -0.017532\n  0.50033 * -0.017532         = -0.00877178556\n  R = 6.02214076e23 * 1.380649e-23 = 8.31446261815324 J/(mol*K)\n  R*Tc/Pc = 8.31446261815324 * 369.83 / 4.248e6 = 0.000723855393143035\n  c = -0.00877178556 * 0.000723855393143035 = -6.349504285100194e-06 m**3/mol\n\nThe shift is negative: this component's untranslated volume is too small, so `v_corr = v - c` enlarges it.\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.152
Tc = 369.83
Pc = 4248000.0
[worked_example.expected]
c = -6.349504285100194e-06
[implementations]
python = "azoth.eos.pr_peneloux_shift"
rust = "azoth_eos::pr_peneloux_shift"
[[tests]]
id = "propane_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "methane_at_a_very_different_acentric_factor"
type = "reference"
status = "active"
source = "Derived from the equation above, at methane's acentric factor, omega = 0.01142, Tc = 190.56 K, Pc = 4.599e6 Pa:\n\n  Z_RA = 0.29056 - 0.08775*0.01142 = 0.289557895\n  0.25969 - Z_RA = -0.029867895\n  0.50033 * -0.029867895 = -0.014943803905\n  R*Tc/Pc = 8.31446261815324 * 190.56 / 4.599e6 = 0.00034454321694427266\n  c = -0.014943803905 * 0.00034454321694427266 = -5.148298028001139e-06 m**3/mol\n"
tolerance = 1e-12
[tests.inputs]
omega = 0.01142
Tc = 190.56
Pc = 4599000.0
[tests.expected]
c = -5.148298028001139e-06
[[tests]]
id = "water_reads_its_databank_rackett_z_and_not_the_correlation"
type = "reference"
status = "active"
source = """\
    Water's databank row carries `RACKETZ = 0.235662374`, and this is the case that \
    separates the field from the fallback. With it:\n\
    \n\
      Z_RA = 0.235662374\n\
      0.25969 - Z_RA = 0.024027626\n\
      0.50033 * 0.024027626 = 0.0120217422...\n\
      R*Tc/Pc = 8.31446261815324 * 647.3 / 22.089e6 = 2.436449...e-04\n\
      c = +2.929079399385604e-06 m**3/mol\n\
    \n\
    **The critical constants are the table's and not water's physical ones.** They are \
    `374.15` C and `220.89` bar, which is `647.3` K and `22 089 000` Pa, where IAPWS gives \
    `647.096` and `22 064 000` - and that 3e-4 difference in `Tc` moves the shift by \
    `8.2e-4` relative, which is why this case's numbers are not round.\n\
    \n\
    **The correlation would give the opposite sign**: `Z_RA = 0.29056 - 0.08775*0.3443 = \
    0.260349` gives `c = -8.0503e-08`, which on liquid water's `2.1238e-05` m**3/mol is a \
    14% difference in density - `983.93` kg/m**3 against `848.23`. That is the measurement \
    `validation/neqsim/VolCorrProbe.java` reports, and it is why `z_ra` exists as an input.\n\
    """
tolerance = 1e-12
[tests.inputs]
omega = 0.3443
Tc = 647.3
Pc = 22089000.0
z_ra = 0.235662374
[tests.expected]
c = 2.929079399385604e-06
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
