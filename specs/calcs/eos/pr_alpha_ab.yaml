id: eos.pr_alpha_ab
name: Peng-Robinson alpha function and reduced attraction parameters
equation: |
  alpha = (1 + kappa*(1 - Tr**0.5))**2
  a_reduced = 0.45724333333*alpha*Pr/Tr**2
  b_reduced = 0.077803333*Pr/Tr
latex: '\alpha = \left[1 + \kappa\left(1 - \sqrt{T_{r}}\right)\right]^{2}, \qquad A = \frac{\Omega_{a}\,\alpha\,P_{r}}{T_{r}^{2}}, \qquad B = \frac{\Omega_{b}\,P_{r}}{T_{r}}'

source:
  standard: Peng, D. Y.; Robinson, D. B. (1976)
  edition: "A New Two-Constant Equation of State. Industrial & Engineering Chemistry Fundamentals, 15(1), 59-64"
  doi: "10.1021/i160057a011"

inputs:
  kappa:
    unit: dimensionless
    description: >
      The Peng-Robinson alpha-function coefficient, from `eos.pr_kappa`. A
      property of the substance alone - no temperature, no pressure - which is
      why it is an input here rather than computed: this calc turns it into the
      temperature-dependent attraction.
  Tr:
    unit: dimensionless
    description: >
      Reduced temperature, T / Tc. The critical temperature is the caller's - this
      library ships a databank of pure-component constants, but `Tc` still comes in with the component because a reduced temperature is what this calc takes.
  Pr:
    unit: dimensionless
    description: reduced pressure, P / Pc

outputs:
  alpha:
    unit: dimensionless
    description: >
      The alpha function, which is where all of Peng-Robinson's temperature
      dependence lives. It is a square, so it is never negative; it is 1 at
      Tr = 1 whatever kappa is, which is what makes the critical point special.
  a_reduced:
    unit: dimensionless
    description: >
      A = a*alpha*P/(R**2*T**2), the dimensionless attraction parameter, called
      `A` in the cubic. Not the dimensional `a` in Pa*m**6/mol**2, which would
      need a gas constant and a pressure unit - writing the cubic in A and B is
      what lets the whole of this namespace be dimensionless.
  b_reduced:
    unit: dimensionless
    description: B = b*P/(R*T), the dimensionless repulsion parameter, called `B` in the cubic

valid_range:
  - quantity: Tr
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      `Tr` appears as a square root in alpha and as a divisor, squared, in
      `a_reduced`. Tr = 0 is singular, a negative Tr makes the square root
      undefined, and neither is a limiting case worth returning a number for -
      both are caller errors. `b_reduced` is the one term that would survive,
      which is exactly why the bound belongs on the input rather than being left
      to each output.

  - quantity: Pr
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      Pr = 0 drives both A and B to zero, and B appears as a divisor in the
      fugacity-coefficient expression that consumes this calc's output. The
      ideal-gas limit is a real and useful state, but it is not a state a cubic
      equation of state describes - and a calc that returned A = B = 0 would be
      handing the next step a division by zero rather than a limit. The bound
      says so here, where the reason is visible, instead of downstream where it
      would read as a mystery.

assumptions:
  - the alpha function is the 1976 Peng-Robinson form. Peng-Robinson-Stryjek-Vera, PR-Twu and every later revision change exactly this temperature dependence, and a result computed here is not comparable with one from those. PRSV's coefficient has its own calc, `eos.prsv_kappa`, and its output can be passed to this one - the alpha function it feeds is unchanged, which is the whole point of splitting kappa out.
  - kappa is positive, so alpha rises as Tr falls. It is not checked here, because the check belongs where kappa is formed - `eos.pr_kappa` warns when the coefficient comes out negative - and repeating it here would make a caller fixing the root cause see two warnings for one mistake.
  - "`Tr` and `Pr` are reduced against a critical point that is correct for the component intended. NOT CHECKED - Tc and Pc are the caller's, and this calc has no second source for them."
  - the range of reduced temperature over which the alpha function's fit holds is NOT established, and no bound asserts one. The fitted range is unconfirmed - see `eos.pr_kappa`'s notes - so a warning bound here would be inventing a number. This calc is smooth and well conditioned at every Tr it accepts; whether its *result* is right is the fit's question, not this calc's.
  - A and B are the reduced parameters of the Peng-Robinson cubic and are used with that cubic's mixing rules. They are not interchangeable with another equation of state's reduced parameters, even where the symbols coincide.
  - "**`Omega_a` and `Omega_b` are NeqSim 3.20.0's, not the paper's.** NeqSim's `ComponentPR` constructor sets `a = .45724333333*R**2*Tc**2/Pc` and `b = .077803333*R*Tc/Pc`, so the pair here is 0.45724333333 and 0.077803333. The paper prints `0.45724` and `0.07780`; the cubic's triple-root condition gives 0.4572355289213822 and 0.07779607390388846 exactly. All three differ, and NeqSim's is the paper's printed value plus 3.3333e-6 in both constants - a constant offset, which is what makes it read as a transcription artefact carried forward rather than a refit.

    **The port rule decides it, and the measurement is what makes that concrete.** Substituting NeqSim's pair into the reference implementation reproduces NeqSim's own `TPflash` to twelve significant figures: beta 0.8422055475803881 against 0.842205547583653 for methane/n-butane at 330 K and 25 bar. The exact pair leaves a residue of 1.4e-4 on the same state - see `validation/eos/methane_butane_flash_against_neqsim.json`, which records the fluid, the state and the driver that printed NeqSim's answer. Carrying NeqSim's literals is what makes azoth a port of NeqSim rather than a reimplementation of Peng-Robinson that resembles it; a version that corrected the upstream would disagree with it by 1.4e-4 everywhere, forever, and could never be validated against it at all."

references:
  - 'Peng, D. Y.; Robinson, D. B. (1976). "A New Two-Constant Equation of State." Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011. (the origin of the alpha function. Its printed coefficients are NOT the ones this calc uses: `assumptions` records why, and what the pair in the equations above is.)'
  - 'NeqSim 3.20.0, `neqsim.thermo.component.ComponentPR`, constructor: the source of the two `Omega` constants this calc uses. Not a peer-reviewed source - it is the upstream being ported, which is a different kind of authority and the one that settles the question here.'

worked_example:
  source: derived from the equations above
  derivation: >
    A propane-like component at Tr = 0.8, Pr = 0.25, with the coefficient
    `eos.pr_kappa` gives for omega = 0.152. The three steps, in the order the
    spec states them:

      sqrt(Tr)        = sqrt(0.8)                        = 0.8944271909999159
      1 - sqrt(Tr)    = 1 - 0.8944271909999159           = 0.10557280900008414
      kappa * that    = 0.60282728832 * 0.10557280900008414
                                                         = 0.06364217016984601
      1 + that                                           = 1.063642170169846
      alpha = 1.063642170169846**2                       = 1.1313346661636197

      Omega_a * alpha = 0.45724333333 * 1.1313346661636197
                                                         = 0.5172952338684362
      * Pr            = 0.5172952338684362 * 0.25        = 0.12932380846710906
      / Tr**2         = 0.12932380846710906 / 0.64       = 0.20206845072985785
      a_reduced                                          = 0.20206845072985785

      Omega_b * Pr    = 0.077803333 * 0.25               = 0.01945083325
      / Tr            = 0.01945083325 / 0.8              = 0.0243135415625
      b_reduced                                          = 0.0243135415625

    Every value above was checked against exact decimal arithmetic in
    arbitrary-precision arithmetic rather than against a second run of the same
    floating-point code, and the largest deviation is 2.4e-16 relative - a few
    units in the last place, which is what a five-operation chain with a square
    root should produce. Unlike `eos.pr_kappa`'s worked example this one is not
    bit-exact, so the tolerance below is 1e-12 relative rather than 1e-15: it
    accounts for the rounding, not for the model.

    The inputs are deliberately round numbers - 0.8 and 0.25 are both exact in
    binary - so that a discrepancy in the output is the arithmetic's and not the
    inputs'.

    Note that these are NOT the values the paper's printed Omega constants would
    give. Substituting 0.45724 and 0.07780 gives a_reduced = 0.2020669776393177 and
    b_reduced = 0.024312499999999997, which differ in the sixth and fifth
    significant figures respectively - 7.3e-6 and 4.3e-5 relative. The distances are
    small at ordinary conditions; near the critical point they are what the cubic's
    critical compressibility is made of, and `assumptions` records why this spec
    uses NeqSim's pair rather than either the printed one or the exact one.
  inputs: { kappa: 0.60282728832, Tr: 0.8, Pr: 0.25 }
  expected: { alpha: 1.1313346661636197, a_reduced: 0.20206845072985785, b_reduced: 0.0243135415625 }
  tolerance: 1.0e-12

implementations:
  python: azoth.eos.pr_alpha_ab
  rust: azoth_eos::pr_alpha_ab

tests:
  - id: propane_at_tr_0_8_worked_example
    type: worked_example
    status: active

  - id: at_the_critical_point_the_parameters_are_the_omegas
    type: reference
    status: active
    source: >
      Derived from the equations above, at Tr = Pr = 1. This is the case that
      pins the two Omega constants directly: at the critical point
      `1 - sqrt(Tr)` is exactly zero, so alpha is exactly 1 whatever kappa is,
      and A and B collapse to Omega_a and Omega_b:

        sqrt(1)  = 1
        1 - 1    = 0
        alpha    = (1 + kappa*0)**2 = 1.0    exactly, for any kappa
        a_reduced = Omega_a * 1 * 1 / 1**2 = 0.45724333333
        b_reduced = Omega_b * 1 / 1        = 0.077803333

      A test that asserts the constants are what they are, in the one place the
      equation exposes them with nothing else in the way. It also catches both
      other pairs: an implementation using the paper's printed 0.45724 and
      0.07780 fails this by 7.3e-6 and 4.3e-5 relative, and one using the exact
      values the triple-root condition gives, 0.4572355289213822 and
      0.07779607390388846, fails it by 1.7e-5 and 9.3e-5. Which pair is in the
      source is the whole of the difference between agreeing with NeqSim and not,
      so it is asserted at 1e-15 rather than loosely.
    inputs: { kappa: 0.60282728832, Tr: 1.0, Pr: 1.0 }
    expected: { alpha: 1.0, a_reduced: 0.45724333333, b_reduced: 0.077803333 }
    tolerance: 1.0e-15

  - id: supercritical_and_a_different_kappa
    type: reference
    status: active
    source: >
      Derived from the equations above, at a state that is not near the critical
      point in either reduced variable and at kappa for a very different
      substance. Methane, kappa = 0.392217407205312 from `eos.pr_kappa` at
      omega = 0.01142, at Tr = 1.5 and Pr = 0.5:

        1 - sqrt(1.5) = 1 - 1.224744871391589 = -0.22474487139158894
        kappa * that  = 0.392217407205312 * -0.22474487139158894
                                                   = -0.08814885073990032
        alpha         = (1 - 0.08814885073990032)**2 = 0.8314725184069646

        a_reduced     = 0.45724333333 * 0.8314725184069646 * 0.5 / 2.25
                      = 0.08448561464193118
        b_reduced     = 0.077803333 * 0.5 / 1.5
                      = 0.025934444333333334

      Worth having for three reasons. It exercises the branch where
      `1 - sqrt(Tr)` is negative and kappa reduces the attraction rather than
      increasing it, so an implementation with a sign error in the alpha function
      fails here and not in the worked example. It uses an acentric factor two
      orders of magnitude from the worked example's, so a hardcoded answer fails.
      And it is above the critical temperature, which is where a cubic equation
      of state is most used and least tested.
    inputs: { kappa: 0.392217407205312, Tr: 1.5, Pr: 0.5 }
    expected: { alpha: 0.8314725184069646, a_reduced: 0.08448561464193118, b_reduced: 0.025934444333333334 }
    tolerance: 1.0e-12

  - id: monotonic
    type: property
    property: monotonic
    status: active
  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: skipped
    skip_reason: >
      Every input and every output is dimensionless, so there is no unit to
      convert. Declared rather than omitted so the omission is a recorded
      decision, following `crane_k_factors` and `eos.pr_kappa`.
