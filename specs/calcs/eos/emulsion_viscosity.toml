id = "eos.emulsion_viscosity"
name = "Oil-water emulsion viscosity and phase inversion point"
equation = "WC_inv = 1 / (1 + (mu_o/mu_w)^0.25 (rho_w/rho_o)^0.5), clamped to [0.20, 0.90], shifted by 0.10 (t - 0.5), clamped to [0.15, 0.95]\n\nW/O below WC_inv: mu_c = mu_o, mu_d = mu_w, phi = WC\nO/W at or above:   mu_c = mu_w, mu_d = mu_o, phi = 1 - WC\n\nmu_eff = mu_c * mu_r\nmu_r: Einstein 1 + 2.5 phi; Taylor 1 + 2.5 phi (mu_d + 0.4 mu_c)/(mu_d + mu_c)\n      Brinkman (1 - phi)^-2.5; Pal-Rhodes (1 - phi/phi_max)^(-2.5 phi_max)\n      Woelflin exp(k phi), k 2.5 | 4 | 6; Richardson exp((2.5 + 5 t) phi)\n\nmu_eff *= 1 + 2 (t - 0.5) when t > 0.5; *= 1 - 0.5 eff when the demulsifier is present"
latex = '''WC_{\mathrm{inv}} = \frac{1}{1 + (\mu_o/\mu_w)^{1/4}(\rho_w/\rho_o)^{1/2}}, \qquad \mu_{\mathrm{eff}} = \mu_c\,\mu_r\,f_{\mathrm{tight}}\,f_{\mathrm{demul}}}'''
assumptions = [
    "the class takes cP and a water-cut fraction; this calc takes Pa*s for the two viscosities and the water cut as a volume fraction, and returns Pa*s.\n",
    "**the inversion point is Arirachakaran's correlation**, clamped to `[0.20, 0.90]` as the class clamps it, shifted by `0.10 (t - 0.5)` and clamped again to `[0.15, 0.95]`.\n",
    "**the continuous phase is oil below the inversion point and water at or above it**, so the dispersed fraction is the water cut or its complement and the effective viscosity is the continuous phase's times the relative one.\n",
    "**the six models are the class's**: Einstein and Taylor for dilute suspensions, Brinkman's `(1-phi)^-2.5`, Pal-Rhodes with the maximum packing fraction and its 1e6 jam, Woelflin's three coefficients and Richardson's exponential.\n",
    "**the tightness correction applies only above 0.5**, as `1 + 2 (t - 0.5)`, and a demulsifier at an efficiency `e` reduces the effective viscosity by at most half: `1 - 0.5 e`.\n",
    "the class's temperature, pressure, interfacial-tension and shear-rate setters reach only its JSON and no arithmetic, so they are not inputs; the viscosity-versus-water-cut sweep is a caller's loop.\n",
    "the `phi >= 1` branch and the unknown-model default are not reachable through this calc: the inversion clamps keep the dispersed fraction below one, and the model is an enum.\n",
]
references = [
    "NeqSim master, `pvtsimulation/flowassurance/EmulsionViscosityCalculator.java`, Apache-2.0, commit f0c7436c6923766b1e22957b7075f650600457a7.",
    "`validation/neqsim/captures/flow_assurance_remainder_probe.tsv` - the nineteen states: all six models, the jammed packing fraction, Woelflin's three bands, both inversion clamps, the two water-cut ends, both tightness multipliers and two demulsifier efficiencies.",
    "Arirachakaran, S.; Ogbe, D. O.; Economides, M. J. (1989). An analysis of oil/water flow phenomena in horizontal pipes. SPE 18836.",
]
[source]
standard = "NeqSim master `EmulsionViscosityCalculator`"
edition = "`calculate`, `calculateInversionPoint`, the six relative-viscosity models and the tightness and demulsifier corrections. The viscosity-curve sweep and the Gson report are compositions, and the unused setters are stored only."
[inputs]
[inputs.oil_viscosity]
unit = "Pa*s"
description = "the oil phase's dynamic viscosity.\n"
[inputs.water_viscosity]
unit = "Pa*s"
description = "the water phase's dynamic viscosity.\n"
[inputs.oil_density]
unit = "kg/m**3"
description = "the oil phase's density.\n"
[inputs.water_density]
unit = "kg/m**3"
description = "the water phase's density.\n"
[inputs.water_cut]
unit = "dimensionless"
description = "the water volume fraction.\n"
[inputs.max_packing_fraction]
unit = "dimensionless"
description = "the maximum dispersed-phase packing fraction, 0.74 as the class's default.\n"
[inputs.model]
type = "enum"
values = ["einstein", "taylor", "brinkman", "pal_rhodes", "woelflin", "richardson"]
description = "the relative-viscosity model.\n"
[inputs.tightness_factor]
unit = "dimensionless"
description = "the emulsion tightness, which shifts the inversion point and scales the viscosity above 0.5.\n"
[inputs.demulsifier_present]
type = "boolean"
description = "whether a demulsifier is dosed.\n"
[inputs.demulsifier_efficiency]
unit = "dimensionless"
description = "the demulsifier efficiency, which halves its effect on the viscosity.\n"
[outputs]
[outputs.effective_viscosity]
unit = "Pa*s"
description = "the effective emulsion viscosity.\n"
[outputs.relative_viscosity]
unit = "dimensionless"
description = "the model's relative viscosity before the tightness and demulsifier corrections.\n"
[outputs.viscosity_ratio]
unit = "dimensionless"
description = "the effective viscosity over the continuous phase's.\n"
[outputs.inversion_water_cut]
unit = "dimensionless"
description = "the water cut at which the phases invert.\n"
[outputs.emulsion_type]
type = "enum"
values = ["water_in_oil", "oil_in_water"]
description = "which phase is continuous at the stated water cut.\n"
[outputs.is_inverted]
type = "boolean"
description = "whether the water cut is at or above the inversion point.\n"
[[valid_range]]
quantity = "oil_viscosity"
min = 0
min_inclusive = false
severity = "error"
rationale = "A viscosity is positive.\n"
[[valid_range]]
quantity = "water_viscosity"
min = 0
min_inclusive = false
severity = "error"
rationale = "A viscosity is positive, and the inversion correlation divides by it.\n"
[[valid_range]]
quantity = "oil_density"
min = 0
min_inclusive = false
severity = "error"
rationale = "A density is positive.\n"
[[valid_range]]
quantity = "water_density"
min = 0
min_inclusive = false
severity = "error"
rationale = "A density is positive.\n"
[[valid_range]]
quantity = "water_cut"
min = 0
min_inclusive = true
max = 1
max_inclusive = true
severity = "error"
rationale = "A volume fraction lies in [0, 1].\n"
[[valid_range]]
quantity = "max_packing_fraction"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "A packing fraction lies in (0, 1].\n"
[worked_example]
source = "the capture's `default_pal` row"
derivation = "The class's default state: 10 cP oil, 0.5 cP water, densities 850 and 1020, a 0.30 water cut, Pal-Rhodes at a 0.74 packing fraction and a 0.5 tightness.\n\n  WC_inv = 1 / (1 + (10/0.5)^0.25 (1020/850)^0.5) = 0.30152\n  the 0.30 cut is below it, so W/O with phi = 0.30\n  mu_r = (1 - 0.30/0.74)^(-2.5*0.74) = 2.61632\n  mu_eff = 10 cP * 2.61632 = 26.1632 cP\n"
tolerance = 1e-09
[worked_example.inputs]
oil_viscosity = 0.01
water_viscosity = 0.0005
oil_density = 850.0
water_density = 1020.0
water_cut = 0.3
max_packing_fraction = 0.74
model = "pal_rhodes"
tightness_factor = 0.5
demulsifier_present = false
demulsifier_efficiency = 0.0
[worked_example.expected]
effective_viscosity = 0.026163222223187113
relative_viscosity = 2.6163222223187113
viscosity_ratio = 2.6163222223187113
inversion_water_cut = 0.30151501914789675
emulsion_type = "water_in_oil"

