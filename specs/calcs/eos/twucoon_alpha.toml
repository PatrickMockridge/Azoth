id = "eos.twucoon_alpha"
name = "Twu-Coon alpha function"
equation = "alpha = Tr**a*exp(b*(1 - Tr**c)) + omega*(Tr**d*exp(e*(1 - Tr**f)) - Tr**a*exp(b*(1 - Tr**c))),  with a = -0.201158, b = 0.141599, c = 2.29528, d = -0.660145, e = 0.500315, f = 2.63165"
latex = '''\alpha = T_r^{a} e^{b(1 - T_r^{c})} + \omega\left(T_r^{d} e^{e(1 - T_r^{f})} - T_r^{a} e^{b(1 - T_r^{c})}\right)'''
assumptions = ["the six constants are NeqSim's, fitted for heavy components; the acentric factor is the caller's.\n", "the alpha is cubic-agnostic; the `a` and `b` it scales are the cubic's own.\n"]
references = ["Twu, C. H.; Coon, J. E.; Cunningham, J. R. (1995). \"A new generalized alpha function for a cubic equation of state. Part 1. Peng-Robinson equation.\" Fluid Phase Equilib. 105, 49-59. DOI 10.1016/0378-3812(94)02601-V."]
[source]
standard = "NeqSim master `AttractiveTermTwuCoon`"
edition = "`alpha(temperature)`, ported verbatim"
doi = "10.1016/0378-3812(94)02601-V"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "the acentric factor\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes fractional powers of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "omega = 0.152, Tr = 0.7:\n\n  Tr**a = 0.7**-0.201158 = 1.0743845847761824\n  exp(b*(1 - Tr**c)) = exp(0.141599*(1 - 0.7**2.29528)) = 1.08236801469908\n  low = 1.0743845847761824 * 1.08236801469908 = 1.1628795100474918\n  Tr**d = 0.7**-0.660145 = 1.2654871930319278\n  exp(e*(1 - Tr**f)) = exp(0.500315*(1 - 0.7**2.63165)) = 1.356099774953404\n  high = 1.2654871930319278 * 1.356099774953404 = 1.7161268976770123\n  alpha = 1.1628795100474918 + 0.152*(1.7161268976770123 - 1.1628795100474918) = 1.2469731129671788\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.152
Tr = 0.7
[worked_example.expected]
alpha = 1.2469731129671788
[implementations]
python = "azoth.eos.twucoon_alpha"
rust = "azoth_eos::twucoon_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
