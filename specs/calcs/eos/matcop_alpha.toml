id = "eos.matcop_alpha"
name = "Mathias-Copeman alpha function"
equation = "alpha = (1 + mc1*(1 - sqrt(Tr)) + mc2*(1 - sqrt(Tr))**2 + mc3*(1 - sqrt(Tr))**3)**2"
latex = '''\alpha = \left(1 + c_1(1 - \sqrt{T_r}) + c_2(1 - \sqrt{T_r})^2 + c_3(1 - \sqrt{T_r})^3\right)^2'''
assumptions = ["the three coefficients are the caller's fitted Mathias-Copeman parameters, not computed from the acentric factor.\n", "the alpha is cubic-agnostic; the `a` and `b` it scales are the cubic's own, so one correlation serves Peng-Robinson and Soave-Redlich-Kwong alike.\n"]
references = ["Mathias, P. M.; Copeman, T. W. (1983). \"Extension of the Peng-Robinson equation of state to complex mixtures: evaluation of the various forms of the local composition concept.\" Fluid Phase Equilib. 13, 91-108. DOI 10.1016/0378-3812(83)80084-3."]
[source]
standard = "NeqSim 3.20.0 `AttractiveTermMatCop`"
edition = "`alpha(temperature)`, ported verbatim"
doi = "10.1016/0378-3812(83)80084-3"
[inputs]
[inputs.mc1]
unit = "dimensionless"
description = "the first Mathias-Copeman coefficient\n"
[inputs.mc2]
unit = "dimensionless"
description = "the second Mathias-Copeman coefficient\n"
[inputs.mc3]
unit = "dimensionless"
description = "the third Mathias-Copeman coefficient\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes a square root of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "mc1 = 0.1, mc2 = 0.05, mc3 = 0.02, Tr = 0.7:\n\n  sqrt(Tr) = sqrt(0.7) = 0.8366600265340756\n  1 - sqrt(Tr) = 0.16333997346592444\n  (1 - sqrt(Tr))**2 = 0.0266799469318489\n  (1 - sqrt(Tr))**3 = 0.004357901823920471\n  inner = 1 + 0.1*0.16333997346592444 + 0.05*0.0266799469318489 + 0.02*0.004357901823920471 = 1.0177551527296633\n  alpha = 1.0177551527296633**2 = 1.0358255509077803\n"
tolerance = 1e-12
[worked_example.inputs]
mc1 = 0.1
mc2 = 0.05
mc3 = 0.02
Tr = 0.7
[worked_example.expected]
alpha = 1.0358255509077803
[implementations]
python = "azoth.eos.matcop_alpha"
rust = "azoth_eos::matcop_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
