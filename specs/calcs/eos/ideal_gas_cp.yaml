id: eos.ideal_gas_cp
name: Ideal-gas heat capacity from a polynomial
equation: "Cp/R = a + b*theta + c*theta**2 + d*theta**3,  theta = T/(1000 K)"
latex: '\frac{C_{p}}{R} = a + b\,\theta + c\,\theta^{2} + d\,\theta^{3}, \qquad \theta = \frac{T}{T_{0}}, \qquad T_{0} = 1000\ \mathrm{K}'

source:
  standard: The standard four-term ideal-gas heat-capacity polynomial
  edition: >
    The form is the conventional one - `Cp/R` as a cubic in temperature - and is set
    out in e.g. Poling, Prausnitz & O'Connell, The Properties of Gases and Liquids,
    5th ed., ch. 3. The reference temperature is the scale at which the coefficients
    are quoted, not a fitted quantity.

inputs:
  a:
    unit: dimensionless
    description: >
      the constant term of `Cp/R`. Dimensionless, as are the three that follow, because
      the polynomial is divided through by `R` - which is what lets a published table's
      numbers be used unchanged.
  b:
    unit: dimensionless
    description: the coefficient of `theta`
  c:
    unit: dimensionless
    description: the coefficient of `theta**2`
  d:
    unit: dimensionless
    description: the coefficient of `theta**3`
  T:
    unit: K
    description: >
      absolute temperature. Must be in the range the coefficients were fitted over,
      which is **not checked** - see `assumptions`.

outputs:
  cp_over_r:
    unit: dimensionless
    description: >
      the polynomial's own value, reported because it is what a reader checking the
      arithmetic by hand computes first. `cp` is this multiplied by `R`.
  cp:
    unit: J/(mol*K)
    description: >
      the ideal-gas heat capacity. Carries a warning when it comes out non-positive,
      which means the polynomial has been evaluated outside the range it was fitted
      over.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute temperature, and the divisor in the reduced temperature; zero and
      below are not states. The bound is on `T` and not on `theta` because `theta` is
      what the equation uses while `T` is what the caller supplies, so naming `T` is
      what makes the message legible.

  - quantity: cp
    min: 0
    min_inclusive: false
    severity: warning
    rationale: >
      a heat capacity is positive by definition, so a negative one means the polynomial
      has turned over outside its fitted range. A warning rather than an error because
      the arithmetic is well defined and a caller inspecting the limit is doing
      something legitimate - but it must not pass in silence, because the value feeds
      an integral downstream and a negative heat capacity produces an enthalpy that is
      wrong by an amount nobody can see.

assumptions:
  - "**`a`, `b`, `c` and `d` are the caller's, and their correctness is NOT CHECKED.** This library ships no heat-capacity coefficients and no component data of any kind. A transposed digit in one of them produces a heat capacity that is wrong everywhere and looks entirely reasonable."
  - "**`T` must lie inside the range the coefficients were fitted over, and that is NOT CHECKED and cannot be.** A fitted polynomial is meaningless outside its range and the way it fails is a turning-over, not an obvious explosion. The non-positive bound above catches the case where it has turned over far enough to change sign; it does not catch the much more likely case where the value is simply wrong by a few per cent."
  - "the coefficients describe the ideal-gas heat capacity, so the value is a property of the substance at that temperature and not of any real fluid state. Deviation from ideality is `eos.pr_departure`'s business and is not applied here."
  - "the polynomial's form is the caller's as well. A substance whose heat capacity is better described by a different expression - a Shomate polynomial, a table of values, an association model - is not served by this calc, and passing its coefficients to a four-term cubic is a mistake this library cannot detect."

references:
  - 'Poling, B. E.; Prausnitz, J. M.; O''Connell, J. P. "The Properties of Gases and Liquids", 5th ed., chapter 3. (the standard statement of the four-term ideal-gas heat-capacity polynomial and the convention for quoting its coefficients; the edition is described rather than page-cited, and is unconfirmed)'

implementations:
  python: azoth.eos.ideal_gas_cp
  rust: azoth_eos::ideal_gas_cp

worked_example:
  source: derived from the equation above, with coefficients chosen to be arithmetic a reader can do in their head
  derivation: >
    With `a = 4.0`, `b = 1.0`, `c = -0.5`, `d = 0.1` and `T = 500 K`:

    ```text
    theta = 500/1000 = 0.5
    Cp/R  = 4.0 + 1.0*0.5 + (-0.5)*0.25 + 0.1*0.125
          = 4.0 + 0.5 - 0.125 + 0.0125
          = 4.3875
    Cp    = 4.3875 * 8.31446261815324 = 36.47970473714734 J/(mol*K)
    ```

    Every term is exact in binary except the final multiplication, so the expected
    values are given to full double precision and the tolerance is tight. The
    coefficients are **illustrative and are not fitted to any substance** - the
    arithmetic is the point, and this library ships no coefficients to fit them to.
  inputs: { a: 4.0, b: 1.0, c: -0.5, d: 0.1, T: 500.0 }
  expected: { cp_over_r: 4.3875, cp: 36.47970473714734 }
  tolerance: 1.0e-12

tests:
  - id: illustrative_coefficients_worked_example
    type: worked_example
    status: active

  - id: a_second_temperature
    type: reference
    status: active
    source: >
      The same coefficients at `T = 300 K`, so the worked example is not a single
      point. `theta = 0.3`:

        4.0 + 1.0*0.3         = 4.3
        (-0.5)*0.09           = -0.045
        0.1*0.027             = 0.0027
        Cp/R                  = 4.3 - 0.045 + 0.0027 = 4.2577

      and `Cp = 4.2577 * 8.31446261815324 = 35.40048748931105 J/(mol*K)`. Both terms are
      exact decimals, so the only rounding is the final multiplication.
    inputs: { a: 4.0, b: 1.0, c: -0.5, d: 0.1, T: 300.0 }
    expected: { cp_over_r: 4.2577, cp: 35.40048748931105 }
    tolerance: 1.0e-12

  - id: a_polynomial_that_has_turned_over
    type: reference
    status: active
    source: >
      `a = 4.0`, `b = -20.0`, `c = 10.0`, `d = 1.0` at `T = 1000 K`, so `theta = 1` and

        Cp/R = 4 - 20 + 10 + 1 = -5

      giving `Cp = -41.5723130907662 J/(mol*K)`. A negative heat capacity is what a cubic
      with the wrong coefficients does at the end of its range, and this case exists so
      that the `cp > 0` bound has something to fire on rather than being an assertion
      nobody runs. The coefficients are synthetic and chosen for that.

      The bound's *firing* is asserted in the test files, not here: a spec case pins
      values, and a warning is a property of the result rather than of the arithmetic.
      The same arrangement `eos.pr_kappa`'s negative-kappa case uses.
    inputs: { a: 4.0, b: -20.0, c: 10.0, d: 1.0, T: 1000.0 }
    expected: { cp_over_r: -5.0, cp: -41.5723130907662 }
    tolerance: 1.0e-12

  - id: an_all_zero_coefficient_set
    type: reference
    status: active
    source: >
      `a = b = c = d = 0` gives `Cp = 0` exactly at every temperature, which is the
      polynomial's only exact zero. It catches an implementation that multiplies by `R`
      in the wrong place, or that treats a missing coefficient as one - either of which
      is invisible at the values a real coefficient set produces, because there a
      factor of `R` is a plausible-looking constant rather than an obvious error.
    inputs: { a: 0.0, b: 0.0, c: 0.0, d: 0.0, T: 350.0 }
    expected: { cp_over_r: 0.0, cp: 0.0 }
    tolerance: 1.0e-15

  - id: monotonic
    type: property
    property: monotonic
    status: active
    skip_reason: >
      The polynomial is not monotonic in `T` for a general coefficient set and must not
      be: `Cp` rises, turns over and falls for a real substance. A monotonicity claim
      here would be a claim about the coefficients rather than about the code, and the
      schema's `monotonic` property is written for calcs whose monotonicity is a
      consequence of the equation.

  - id: unit_round_trip
    type: property
    property: unit_round_trip
    status: active
    source: >
      `T` crosses in kelvin and the output in `J/(mol*K)`, both added with this calc, so
      the round trip is real rather than vacuous - unlike `eos.pr_kappa`, where every
      quantity is dimensionless and the test is skipped. A degree-Celsius input must
      convert to the same kelvin value, because `T` here is an absolute temperature and
      not an interval.
