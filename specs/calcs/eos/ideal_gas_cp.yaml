id: eos.ideal_gas_cp
name: Ideal-gas heat capacity from a polynomial
equation: "cp = cp_a + cp_b*T + cp_c*T**2 + cp_d*T**3 + cp_e*T**4"
latex: 'C_{p}^{\mathrm{ig}} = c_{0} + c_{1}T + c_{2}T^{2} + c_{3}T^{3} + c_{4}T^{4}'

source:
  standard: NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0
  edition: >
    `thermo/component/Component.java`, `getCp0(double)` at line 1547. The five
    coefficients are the `CPA`-`CPE` columns of NeqSim's `COMP.csv`, carried across
    as `cpa`-`cpe` in `data/components/components.csv`.

inputs:
  cp_a:
    unit: J/(mol*K)
    description: the constant term
  cp_b:
    unit: J/(mol*K**2)
    description: the coefficient of `T`
  cp_c:
    unit: J/(mol*K**3)
    description: the coefficient of `T**2`
  cp_d:
    unit: J/(mol*K**4)
    description: the coefficient of `T**3`
  cp_e:
    unit: J/(mol*K**5)
    description: the coefficient of `T**4`. Zero for a component whose heat capacity
  T:
    unit: K
    description: >
      absolute temperature. Must be in the range the coefficients were fitted over,
      which is **not checked** - see `assumptions`.

outputs:
  cp:
    unit: J/(mol*K)
    description: >
      the ideal-gas heat capacity. Carries a warning when it comes out non-positive,
      which means the polynomial has been evaluated outside the range it was fitted
      over.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute temperature; zero and below are not states, and every term but the
      first scales with it.

  - quantity: cp
    min: 0.0
    min_inclusive: false
    severity: warning
    code: OUT_OF_VALID_RANGE
    rationale: >
      a heat capacity of zero or below. Not refused, because a caller inspecting where
      a polynomial turns over is asking a legitimate question and the arithmetic is
      well defined; it is a warning because a fitted polynomial beyond its range is
      exactly how such an answer arises, and the caller should see that rather than a
      number that looks like a result.

assumptions:
  - '**the coefficients are the caller''s, and their range is not checked.** A cubic
    fitted over 200-1000 K and evaluated at 1500 K returns a number with nothing to
    distinguish it from a good one, except that it usually turns over first and the
    warning above fires.'
  - '**the polynomial is ideal-gas `Cp`, not the real fluid''s.** The departure is a
    separate model - `eos.pr_departure` - and a caller wanting the real heat capacity
    adds the two.'
  - '**the coefficients are per component.** Evaluating a mixture''s ideal-gas heat
    capacity means evaluating this once per component and taking the mole-fraction
    weighted sum, which is what `eos.molar_enthalpy_entropy` does.'

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Component.java` line
    1547.'

implementations:
  python: azoth.eos.ideal_gas_cp
  rust: azoth_eos::ideal_gas_cp

worked_example:
  source: NeqSim's own coefficients for methane, from the `CPA`-`CPE` columns of `COMP.csv`
  derivation: >
    Methane at 300 K, with the five coefficients exactly as NeqSim ships them:

      cp_a = 37.978352        cp_b = -0.07461815      cp_c = 0.000301881
      cp_d = -2.83e-07        cp_e = 9.070574e-11

    The five terms, in order:

      37.978352
      -0.07461815 * 300              = -22.385445
      0.000301881 * 300**2           = +27.16929
      -2.83e-07 * 300**3             = -7.641
      9.070574e-11 * 300**4          = +0.73469041...

    whose sum is 35.855913494 J/(mol*K). The literature value for methane's ideal-gas
    heat capacity at 300 K is about 35.7, which is the check that the coefficients are
    being read in the units NeqSim stores them in rather than in some rescaled form: a
    factor of 1000 anywhere in the column would move this by three orders.
  inputs: { cp_a: 37.978352, cp_b: -0.07461815, cp_c: 0.000301881, cp_d: -2.83e-07, cp_e: 9.070574e-11, T: 300.0 }
  expected: { cp: 35.855913494 }
  tolerance: 1.0e-12

tests:
  - id: methane_at_300_k
    type: worked_example
    status: active

  - id: propane_at_400_k
    type: reference
    status: active
    source: >
      The same polynomial evaluated for propane at 400 K, from `COMP.csv`:
      cp_a = 31.983958, cp_b = 0.042659134, cp_c = 0.000499754, cp_d = -6.56e-07,
      cp_e = 2.5598806e-10.

        cp = 93.577545936 J/(mol*K)

      A different component, and every coefficient positive except one, so a model
      that had the terms in the wrong order or had dropped one would not reproduce it
      from the worked example alone.
    inputs: { cp_a: 31.983958, cp_b: 0.042659134, cp_c: 0.000499754, cp_d: -6.56e-07, cp_e: 2.5598806e-10, T: 400.0 }
    expected: { cp: 93.577545936 }
    tolerance: 1.0e-12

  - id: co2_at_300_k
    type: reference
    status: active
    source: >
      Carbon dioxide at 300 K, whose coefficients are the one component in the file
      given to full precision rather than to six figures: cp_a = 18.58302105174049,
      cp_b = 0.0823796345114741, cp_c = -7.930390038368174e-05,
      cp_d = 4.222181385638e-08, cp_e = -9.577100164048893e-12.

        cp = 37.22197483344483 J/(mol*K)

      The case that exercises a negative `cp_c`, which the two above do not: a model
      that summed the squares of the coefficients, or took an absolute value, passes
      those and fails this.
    inputs: { cp_a: 18.58302105174049, cp_b: 0.0823796345114741, cp_c: -7.930390038368174e-05, cp_d: 4.222181385638e-08, cp_e: -9.577100164048893e-12, T: 300.0 }
    expected: { cp: 37.22197483344483 }
    tolerance: 1.0e-12

  - id: the_polynomial_turns_over
    type: property
    property: monotonic
    status: skipped
    skip_reason: >
      A quartic is not monotonic in general, and the components in the file whose
      coefficient sets turn over inside their fitted range are the ones this would
      catch - but the property that matters is monotonicity *over the fitted range*,
      and the fitted range is not recorded in the file. Asserting the wrong interval
      would be a test of the interval rather than of the model.

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
