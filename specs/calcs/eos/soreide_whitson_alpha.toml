id = "eos.soreide_whitson_alpha"
name = "Soreide-Whitson alpha function for water"
equation = "alpha = (1 + 0.453*(1 - Tr*(1 - 0.0103*salinity**1.1)) + 0.0034*((1/Tr)**3 - 1))**2"
latex = '''\alpha = \left[1 + 0.453\left(1 - T_r\left(1 - 0.0103\,S^{1.1}\right)\right) + 0.0034\left(T_r^{-3} - 1\right)\right]^2'''
assumptions = ["`salinity` is the molality (mol NaCl / kg H2O), the unit the Soreide-Whitson correlation expects; it is declared dimensionless because the vocabulary carries no molality unit.\n", "the correlation is for water; for any other component NeqSim's class delegates to the 1978 Peng-Robinson alpha (`pr78_kappa`), which is ported separately.\n"]
references = ["Soreide, I.; Whitson, C. H. (1992). \"Peng-Robinson predictions for hydrocarbons, CO2, N2, and H2S with pure water and NaCl brine.\" Fluid Phase Equilib. 77, 217-240."]
[source]
standard = "NeqSim 3.20.0 `AttractiveTermSoreideWhitson`"
edition = "`alpha(temperature)`, water branch ported verbatim"
[inputs]
[inputs.salinity]
unit = "dimensionless"
description = "the molality (mol NaCl / kg H2O)\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes `1/Tr`; zero and below are not states\n"
[[valid_range]]
quantity = "salinity"
min = 0
min_inclusive = true
severity = "error"
rationale = "the formula takes a fractional power of `salinity`; negative salinity is not a state\n"
[worked_example]
source = "derived from the equation above"
derivation = "salinity = 1.0, Tr = 0.7:\n\n  salinity**1.1 = 1.0\n  1 - 0.0103*salinity**1.1 = 0.9897\n  Tr*(1 - 0.0103*salinity**1.1) = 0.7*0.9897 = 0.69279\n  1 - Tr*(...) = 0.30721\n  0.453*(1 - Tr*(...)) = 0.453*0.30721 = 0.13916613\n  (1/Tr)**3 = (1/0.7)**3 = 2.915451895043732\n  (1/Tr)**3 - 1 = 1.915451895043732\n  0.0034*((1/Tr)**3 - 1) = 0.006512536443148689\n  A = 1 + 0.13916613 + 0.006512536443148689 = 1.1456786664431486\n  alpha = 1.1456786664431486**2 = 1.3125796067429514\n"
tolerance = 1e-12
[worked_example.inputs]
salinity = 1.0
Tr = 0.7
[worked_example.expected]
alpha = 1.3125796067429514
[implementations]
python = "azoth.eos.soreide_whitson_alpha"
rust = "azoth_eos::soreide_whitson_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
