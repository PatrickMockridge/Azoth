id = "eos.schwartzentruber_alpha"
name = "Schwartzentruber-Renon alpha function"
equation = "alpha = (1 + m*(1 - sqrt(Tr)) - p1*(1 - Tr)*(1 + p2*Tr + p3*Tr**2))**2 with m = 0.48508 + 1.55191*omega - 0.15613*omega**2"
latex = '''\alpha = \left[1 + m(1 - \sqrt{T_r}) - p_1(1 - T_r)(1 + p_2 T_r + p_3 T_r^2)\right]^2, \quad m = 0.48508 + 1.55191\omega - 0.15613\omega^2'''
assumptions = ["the three `p` parameters are the caller's fitted Schwartzentruber-Renon parameters, not derived.\n", "the alpha is cubic-agnostic; the `a` and `b` it scales are the cubic's own.\n"]
references = ["Schwartzentruber, J.; Renon, H. (1989). \"Extension of UNIFAC to high pressures and temperatures by the use of a cubic equation of state.\" Ind. Eng. Chem. Res. 28(7), 1049-1055."]
[source]
standard = "NeqSim master `AttractiveTermSchwartzentruber`"
edition = "`alpha(temperature)`, ported verbatim"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "the acentric factor\n"
[inputs.p1]
unit = "dimensionless"
description = "the first Schwartzentruber-Renon parameter\n"
[inputs.p2]
unit = "dimensionless"
description = "the second Schwartzentruber-Renon parameter\n"
[inputs.p3]
unit = "dimensionless"
description = "the third Schwartzentruber-Renon parameter\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes a square root of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "omega = 0.1, p1 = 0.3, p2 = 0.2, p3 = 0.1, Tr = 0.7:\n\n  m = 0.48508 + 1.55191*0.1 - 0.15613*0.01 = 0.6387097\n  1 - sqrt(Tr) = 1 - sqrt(0.7) = 0.16333997346592444\n  m*(1 - sqrt(Tr)) = 0.6387097*0.16333997346592444 = 0.10432682545042857\n  1 - Tr = 0.3\n  1 + p2*Tr + p3*Tr**2 = 1 + 0.2*0.7 + 0.1*0.49 = 1.189\n  p1*(1 - Tr)*(1 + p2*Tr + p3*Tr**2) = 0.3*0.3*1.189 = 0.10701\n  inner = 1 + 0.10432682545042857 - 0.10701 = 0.9973168254504285\n  alpha = 0.9973168254504285**2 = 0.9946408503265206\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.1
p1 = 0.3
p2 = 0.2
p3 = 0.1
Tr = 0.7
[worked_example.expected]
alpha = 0.9946408503265206
[implementations]
python = "azoth.eos.schwartzentruber_alpha"
rust = "azoth_eos::schwartzentruber_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "round_trip_units"
type = "property"
property = "unit_round_trip"
status = "active"
