[worked_example]
source = "the capture's `advanced_60c_50bara_ph6.5` row"
derivation = "Seawater (420, 0.05, 8, 1280, 10800, 400, 0 mg/L of Ca, Ba, Sr, Mg, Na, K, Fe; 19400, 2700, 142, 0 mg/L of Cl, SO4, HCO3, CO3) at 60 C, 50 bara and pH 6.5.\n\n  I = 0.5 sum(m z^2) = 0.6974509413079769 mol/kg\n  A = 0.5092 + 8.5e-4 (60 - 25) = 0.53895\n  gamma_2 = 10^(-A*4*(sqrtI/(1+sqrtI) - 0.3I)) = 0.29512479879482284\n  pK2 = 10.329 + 0.013 (333.15 - 298.15)/25 = 10.3472\n  a(OH-) = 10^(6.5 - pKw(333.15)) = 3.045157829187762e-7\n  SI(CaCO3) = -0.8060791957491737, SI(BaSO4) = 0.5254850466681731\n  SI(CaSO4) = 0.05426475745470505, SI(SrSO4) = -1.6550618915365867\n  SI(Mg(OH)2) = -1.6095559513991322\n"
tolerance = 1e-12
