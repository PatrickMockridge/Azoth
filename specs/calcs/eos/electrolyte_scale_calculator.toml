id = "eos.electrolyte_scale_calculator"
name = "Activity-corrected mineral-scale saturation indices from a brine analysis"
equation = "I = 0.5 sum(m_i z_i^2)\n\nlog10(gamma_z) = -A z^2 (sqrt(I)/(1 + sqrt(I)) - 0.3 I),  A = 0.5092 + 8.5e-4 (T_C - 25), floor 0.5\n\n[CO3--] = [HCO3-] 10^(pH - pK2),  pK2 = 10.329 + 0.013 (T_K - 298.15)/25\n\na(OH-) = 10^(pH - pKw),  pKw = 4470.99/T_K - 6.0875 + 0.01706 T_K\n\nSI_j = log10(IAP_j) - log10(Ksp_j),  IAP_j = (gamma_M m_M)(gamma_X m_X)\n\nwith the class's four temperature Ksp correlations and the Van't Hoff brucite form, each after the pressure correction exp(-dV (P - 1.01325)/(83.1446 T))."
latex = '''I = \frac{1}{2}\sum_i m_i z_i^2, \qquad \log_{10}\gamma_z = -A z^2\left(\frac{\sqrt{I}}{1+\sqrt{I}} - 0.3I\right), \qquad A = 0.5092 + 8.5\times10^{-4}(T_C - 25)
\mathrm{SI}_j = \log_{10}\left(a^{+}_j a^{-}_j\right) - \log_{10}K_{sp,j}, \qquad a(\mathrm{OH}^-) = 10^{\mathrm{pH} - pK_w}'''
assumptions = [
    "the class's inputs are mg/L, degrees Celsius and bara; this calc takes kg/m3, kelvin and pascal. Its molar masses are the class's own (Ca 40.08 ... CO3 60.01 g/mol), not modern atomic weights.\n",
    "`I = 0.5 sum(m_i z_i^2)` is a charge sum over the eleven ions on the class's 1 kg/L assumption, so a mol/L concentration is also its molality and the result is reported in mol/kg.\n",
    "the Debye-Huckel A is the class's linear form `0.5092 + 8.5e-4 (T_C - 25)`, floored at 0.5 and with no upper bound, in the Davies equation with its `0.3 I` term.\n",
    "pH enters twice: carbonate is `HCO3 * 10^(pH - pK2)` with `pK2 = 10.329 + 0.013 (T_K - 298.15)/25`, and the hydroxide activity is `10^(pH - pKw)` with `pKw = 4470.99/T_K - 6.0875 + 0.01706 T_K`.\n",
    "the four Ksp correlations are the class's (Plummer-Busenberg calcite, Templeton barite, gypsum and celestite); brucite is its Van't Hoff form on `log10 Ksp(25 C) = -11.16` and `dH = -113.4 kJ/mol`.\n",
    "the pressure correction `exp(-dV (P - 1.01325)/(83.1446 T_K))` runs only above 1.013 bara, with the class's cm3/mol `dV`; `pKsp` is `-log10` of the corrected Ksp, so `SI = log10(IAP) + pKsp`.\n",
    "**the `-10` sentinel in `saturationIndex` is dead.** Every activity is floored at `1e-15` before the call, so the branch cannot see a non-positive argument; it is ported as written and stays unreachable.\n",
    "**the CO2 partial-pressure setter is stored and never read**, so it is not an input. The class's eleven-name activity map holds two values (`gamma_1`, `gamma_2`) and is reported as the two.\n",
    "the class does not validate pH or the ions; the port refuses a negative concentration and a non-positive temperature or pressure, and warns outside `0 <= pH <= 14`.\n",
]
references = [
    "NeqSim master, `process/chemistry/scale/ElectrolyteScaleCalculator.java`, Apache-2.0, commit f0c7436c6923766b1e22957b7075f650600457a7.",
    "`validation/neqsim/captures/process_scale_probe.tsv` - the upstream brucite and advanced-models brines, the pH and temperature grid, the floor and the absent-ion states.",
    "Plummer, L. N.; Busenberg, E. (1982). Geochim. Cosmochim. Acta 46(6), 1011-1040. Templeton, C. C. (1960). J. Chem. Eng. Data 5(4), 514-517. Marshall, W. L.; Slusher, R. (1966). J. Chem. Eng. Data 11(3), 339-340.",
]
[source]
standard = "NeqSim master `ElectrolyteScaleCalculator`"
edition = "`calculate`, `daviesLogGamma`, `saturationIndex`, `applyPressureCorrection`, `pKsp`, the five Ksp correlations and `pKw`, ported. The setters' storage, the eleven-name activity map and the Gson report are not."
[inputs]
[inputs.calcium]
unit = "kg/m**3"
description = "calcium ion concentration, 400 mg/L as 0.4 kg/m3.\n"
[inputs.barium]
unit = "kg/m**3"
description = "barium ion concentration.\n"
[inputs.strontium]
unit = "kg/m**3"
description = "strontium ion concentration.\n"
[inputs.magnesium]
unit = "kg/m**3"
description = "magnesium ion concentration.\n"
[inputs.sodium]
unit = "kg/m**3"
description = "sodium ion concentration.\n"
[inputs.potassium]
unit = "kg/m**3"
description = "potassium ion concentration.\n"
[inputs.iron]
unit = "kg/m**3"
description = "ferrous iron concentration.\n"
[inputs.chloride]
unit = "kg/m**3"
description = "chloride ion concentration.\n"
[inputs.sulphate]
unit = "kg/m**3"
description = "sulphate ion concentration.\n"
[inputs.bicarbonate]
unit = "kg/m**3"
description = "bicarbonate concentration, which sets carbonate through `pK2` and the pH.\n"
[inputs.carbonate]
unit = "kg/m**3"
description = "carbonate ion concentration, which adds to the derived carbonate.\n"
[inputs.temperature]
unit = "K"
description = "absolute temperature.\n"
[inputs.pressure]
unit = "Pa"
description = "absolute pressure, used by the Ksp pressure correction.\n"
[inputs.ph]
unit = "dimensionless"
description = "the water's pH, which sets carbonate and the hydroxide activity.\n"
[outputs]
[outputs.ionic_strength]
unit = "mol/kg"
description = "`0.5 sum(m_i z_i^2)` over the eleven ions.\n"
[outputs.debye_hueckel_a]
unit = "dimensionless"
description = "the temperature-adjusted Debye-Huckel A, floored at 0.5.\n"
[outputs.divalent_activity_coefficient]
unit = "dimensionless"
description = "the Davies coefficient for a divalent ion.\n"
[outputs.monovalent_activity_coefficient]
unit = "dimensionless"
description = "the Davies coefficient for a monovalent ion.\n"
[outputs.si_caco3]
unit = "dimensionless"
description = "calcite's activity-corrected saturation index.\n"
[outputs.si_baso4]
unit = "dimensionless"
description = "barite's activity-corrected saturation index.\n"
[outputs.si_caso4]
unit = "dimensionless"
description = "gypsum's activity-corrected saturation index.\n"
[outputs.si_srso4]
unit = "dimensionless"
description = "celestite's activity-corrected saturation index.\n"
[outputs.si_brucite]
unit = "dimensionless"
description = "brucite's activity-corrected saturation index, from the hydroxide activity squared.\n"
[outputs.hydroxide_activity]
unit = "dimensionless"
description = "`10^(pH - pKw)` at the state's temperature.\n"
