id: eos.pr_molar_volume
name: Molar volume from a compressibility factor
equation: "v = z*R*T/P"
latex: 'v = \frac{z\,R\,T}{P}'

source:
  standard: The ideal-gas law with the compressibility factor as the departure from it
  edition: "Clapeyron, É. (1834); van der Waals, J. D. (1873) for the compressibility factor as the correction"

notes: >
  `v = z*R*T/P` is the definition of the compressibility factor rearranged: `z` is
  *defined* as `P*v/(R*T)`, so this calc is that definition solved for `v`. The
  equation is therefore not something to cite - it is the meaning of the quantity
  passed in - and no source can make it more true.

  What is worth recording instead is the two things this calc *does* bring:

  # The gas constant is exact, not measured

  Since the 2019 SI redefinition both constants in `R = N_A * k_B` are exact by
  definition - the Avogadro constant is `6.02214076e23 /mol` and the Boltzmann
  constant is `1.380649e-23 J/K`, both fixed with no uncertainty - so their product
  is a defined value rather than a measurement, and no digits are being rounded by
  writing it to 15 figures. `eos.py` computes `R` from those two constants rather
  than carrying a literal, so the arithmetic shows where it comes from. The same
  argument `hydraulics.pump_power` makes for the standard gravity.

  # The value 8.314462618 is the rounded one

  The commonly quoted `8.314462618` is this value truncated. The difference is
  about 2e-10 relative, which matters for nothing a cubic equation of state does -
  but the truncation is a *choice* and it should be a stated one rather than an
  accident of which text a number was copied from.

  What has NOT been done: checking this against any source, because there is
  nothing to check. The equation numbers below are the origin of the ideas and not
  a claim that either author wrote this line.

  # Why this calc exists at all

  It is the one place the namespace becomes dimensional. Everything else in `eos`
  is reduced variables and constitutive coefficients, deliberately unit-free; this
  is where a compressibility factor becomes a volume, and it is therefore the only
  calc here whose spec declares a unit that is not `dimensionless`. It is also the
  calc that made `m**3/mol` the seventeenth entry in the unit vocabulary.


inputs:
  z:
    unit: dimensionless
    description: >
      The compressibility factor, from `eos.pr_z_factor`. Either admissible root may
      be passed - the vapour one gives the vapour volume and the liquid one the
      liquid volume - which is why this calc takes a `z` rather than a phase.
  T:
    unit: K
    description: absolute temperature
  P:
    unit: Pa
    description: absolute pressure

outputs:
  v:
    unit: m**3/mol
    description: >
      Molar volume. Positive whenever `z`, `T` and `P` are, which is what the bounds
      below ensure.

valid_range:
  - quantity: z
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      A molar volume is positive, so a `z` at or below zero could only come from a
      caller who is not passing a compressibility factor. The cubic's admissible
      roots are all strictly above `b_reduced`, which is positive, so a `z` from
      `eos.pr_z_factor` always passes this - the bound is for the caller who computed
      one some other way.

  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states, and a negative one would give a negative volume

  - quantity: P
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      `P` is a divisor, and zero pressure is the infinite-volume limit - which is
      arithmetic rather than a state this calc can answer for. A negative pressure
      would give a negative volume.

assumptions:
  - "`z` is the compressibility factor for the *same* `T` and `P`. NOT CHECKED, and not checkable here: `z` is a function of both, and this calc has no way to know which state produced it. A `z` from a different temperature gives a volume for no state that exists."
  - the fluid is a single phase at this state. This calc divides a compressibility factor by a pressure and does not know whether the state is two-phase, supercritical, or on the unstable branch - the caller chose the root and therefore chose what the answer means.
  - no volume translation is applied. A cubic equation of state predicts liquid densities poorly, and `v` from a liquid root will be several per cent low. That is a property of the equation, not an error here, and it is the reason volume-translated variants exist.
  - "`R` is the exact value from the 2019 SI definition, not a truncated constant. A caller reproducing this by hand with `8.314` will disagree in the fourth significant figure."
  - the volume is molar. Converting to a specific volume needs a molar mass, which this calc does not take - `eos.pr_mass_density` is where that lives.

references:
  - 'Clapeyron, É. (1834). "Mémoire sur la puissance motrice de la chaleur." (the ideal-gas law; the citation is unconfirmed and the equation above is a rearrangement of a definition rather than a result from it - see `notes`)'
  - 'van der Waals, J. D. (1873). "Over de Continuiteit van den Gas- en Vloeistoftoestand." Leiden. (the compressibility factor as the departure from ideality)'
  - 'BIPM. "The International System of Units (SI)", 9th edition (2019). (the exact values of the Avogadro and Boltzmann constants, from which `R` is computed)'

worked_example:
  source: derived from the equation above
  derivation: >
    The propane-like state the rest of this namespace is built on, closed back to
    dimensional variables: `eos.pr_alpha_ab`'s worked example is at `Tr = 0.8`,
    `Pr = 0.25`, and for propane (`Tc = 369.83 K`, `Pc = 4.248e6 Pa`) that is

      T = 0.8 * 369.83      = 295.864 K
      P = 0.25 * 4.248e6    = 1062000.0 Pa

    with `eos.pr_z_factor`'s vapour root `z = 0.7907789662973796`:

      R   = 6.02214076e23 * 1.380649e-23 = 8.31446261815324 J/(mol*K)
      z*R = 0.7907789662973796 * 8.31446261815324 = 6.574902154501424
      *T  = 6.574902154501424 * 295.864           = 1945.2768510394092
      /P  = 1945.2768510394092 / 1062000.0        = 0.0018317107825229842

    written in the order the equation gives, left to right. **The order matters,
    and only just**: evaluating it as `z*(R*T/P)` instead gives a bit-identical
    answer here but a one-ulp-different one for the liquid root below, because the
    grouping changes which rounding happens first. The equation's own order is
    therefore the one both implementations use, and the spec states it so a reader
    reproducing the arithmetic by hand does the same thing.

    A density follows from a molar mass, and with propane's conventional
    `M = 0.0440956 kg/mol`:

      rho = 0.0440956 / 0.0018317107825229842 = 24.073451125981286 kg/m**3

    which is a plausible vapour density at 10.6 bar. The liquid root of the same
    state is `a_reference_for_the_liquid_root` below, and its answer is *not*
    plausible in the same way - see there.

    The numbers are not exact in binary, and the source of the inexactness is worth
    naming: `Tc` and `Pc` are decimal, so `T` and `P` are rounded before this calc
    starts, and the gas constant is a product of two exact decimals that is not
    itself exactly representable. Everything here was checked against exact decimal
    arithmetic at 50 digits.
  inputs: { z: 0.7907789662973796, T: 295.864, P: 1062000.0 }
  expected: { v: 0.0018317107825229842 }
  tolerance: 1.0e-12

implementations:
  python: azoth.eos.pr_molar_volume
  rust: azoth_eos::pr_molar_volume

tests:
  - id: propane_vapour_worked_example
    type: worked_example
    status: active

  - id: a_reference_for_the_liquid_root
    type: reference
    status: active
    source: >
      Derived from the equation above, at the same state but the *other* admissible
      root, `z = 0.036765449656896015`:

        z*R = 0.036765449656896015 * 8.31446261815324 = 0.30568495681185676
        *T  = 0.30568495681185676 * 295.864           = 90.44117406218318
        /P  = 90.44117406218318 / 1062000.0           = 8.516118084951335e-05
        rho = 0.0440956 / 8.516118084951335e-05       = 517.7899080323988 kg/m**3

      Included because it is the branch a caller usually wants - a liquid density -
      and because its answer illustrates the assumption it carries. Saturated liquid
      propane at 295.9 K is about 490 kg/m**3, and compressing it to 10.6 bar adds
      roughly one per cent, so the expected answer is near 495. This calc gives
      517.8: about 4.5% high, which is the *equation's* known error for liquid
      density, not this calc's. A cubic equation of state has no volume translation,
      so it under-predicts liquid molar volume, and that is why PRSV and the
      volume-translated variants exist.

      The case is here so that error is visible and attributed rather than
      discovered by a user comparing against a handbook.
    inputs: { z: 0.036765449656896015, T: 295.864, P: 1062000.0 }
    expected: { v: 8.516118084951335e-05 }
    tolerance: 1.0e-12

  - id: the_ideal_gas_limit_is_z_of_one
    type: reference
    status: active
    source: >
      Derived from the equation above, at `z = 1` - the ideal-gas limit - where the
      answer must be exactly `R*T/P` and nothing else:

        z*R = 1.0 * 8.31446261815324 = 8.31446261815324
        *T  = 8.31446261815324 * 300.0 = 2494.338785445972
        /P  = 2494.338785445972 / 101325.0 = 0.024617209824287906

      which is 24.617 L/mol, close to the familiar 24.6 L/mol for an ideal gas at
      300 K and one atmosphere. Worth having as an order-of-magnitude anchor any reader can
      check from memory, and because it pins the gas constant: an implementation with
      `8.314` instead of the exact value fails this in the fifth significant figure.
    inputs: { z: 1.0, T: 300.0, P: 101325.0 }
    expected: { v: 0.024617209824287906 }
    tolerance: 1.0e-12

  - id: monotonic
    type: property
    property: monotonic
    status: active
    note: >
      `v` rises with `z` and with `T`, and falls with `P` - the three partial
      derivatives of the equation. A point-value case cannot tell a correct formula
      from one with `T` and `P` transposed; three directions at once can.

  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
    note: >
      Unlike every other calc in this namespace, this one is dimensional, so the unit
      round trip is a real test rather than a formality. The same physical state
      described with `T` in kelvin and with `T` in degrees Celsius-as-an-interval, and
      with `P` in pascals and in bar, must give the same molar volume.

      It is also the first test that exercises `m**3/mol`, the unit added for this
      calc - so a conversion path that was missing or wrong fails here as well as in
      the vocabulary's own test.
