id = "eos.wax_solid_fugacity"
name = "Wax solid fugacity coefficient"
equation = "phi_wax = phi_liq(T, P) * exp( -dH_fus/(R T) (1 - T/T_tp) + dCp_SL/R (T_tp/T - 1 - ln(T_tp/T)) - (v_liq - v_sol)(P - P_ref)/(R T) )\n\nwhere `phi_liq` and `v_liq` are the **cut's own** one-component liquid on the cubic the fluid runs, at the state's own (T, P); `v_sol = 0.9 v_liq`; `dCp_SL = (0.3033 M - 4.635e-4 M T) * 4.184` with `M` the molar mass in g/mol; and `P_ref` is one bar."
latex = '''\phi^{wax} = \phi^{liq}(T,P)\exp\left[-\frac{\Delta H_{fus}}{RT}\left(1-\frac{T}{T_{tp}}\right) + \frac{\Delta C_{p,SL}}{R}\left(\frac{T_{tp}}{T} - 1 - \ln\frac{T_{tp}}{T}\right) - \frac{(v^{liq}-v^{sol})(P-P_{ref})}{RT}\right], \qquad v^{sol} = 0.9\,v^{liq}'''
assumptions = [
    "**this is NeqSim's `ComponentWax.fugcoef2`**, the default `PhaseWax` component model - `PhaseWax.addComponent` builds a `ComponentWax` unless `setWaxComponentModel` names Won, Wilson or Coutinho. Those three are carried by name.",
    "**the coefficient is a pure-component quantity**: `SolidFug = x f_liq exp(...)` and `fugacityCoefficient = SolidFug/(P x)`, so the mole fraction cancels and nothing of the mixture is left in it.",
    "`phi_liq` and `v_liq` are the **cut's own** one-component liquid on the cubic the fluid runs - NeqSim's `setSolidRefFluidPhase` clones the host phase's class and adds this component alone - so they are computed here rather than taken, and `eos` is a real input.",
    "**the pressure's reference is one bar, not zero.** `refPressure = 1.0` in NeqSim's code and its pressure is in bar, so in pascals the term is `(P - 1.0e5)`.",
    "`v_sol = 0.9 v_liq` is NeqSim's shortcut for the solid's molar volume, and it is a *ratio* rather than a measured density - a port that read a real solid density would be wrong about this term. The term is three orders larger than the fusion term at 261 K, so it is not negligible.",
    "the heat-capacity difference is Pedersen's fit `(0.3033 M - 4.635e-4 M T) * 4.184` in J/(mol K) with `M` in g/mol, and `4.184` is the calorie.",
    "`R` is `8.3144621`, which the class's compiled form states as a literal.",
    "**verified against NeqSim to `1e-14`** on seven cuts at 261 K and 5 bara. The capture prints the reference liquid's own coefficient beside the product, and the exponent recovered from them reproduces this expression exactly - the two halves were split on purpose.",
    "the coefficient is a ratio to `P x` and so dimensionless, and it is `1e50` for a component that is not a wax former: that is the class's marker for \"this substance does not precipitate\" and not a number to compute with, so this calc takes a former and says nothing about the other case.",
]
references = [
    "Pedersen, K. S.; Skovborg, P.; Rønningsen, H. P. (1991). \"Wax precipitation from North Sea crude oils. 4. Thermodynamic modeling.\" Energy & Fuels 5(6), 924-932. DOI 10.1021/ef00030a020.",
    "Won, K. W. (1986). \"Thermodynamics for solid solution-liquid-vapor equilibria: wax phase formation from heavy hydrocarbon mixtures.\" Fluid Phase Equilibria 30, 265-279. DOI 10.1016/0378-3812(86)80061-9.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ComponentWax.fugcoef2` is the port source, with `ComponentSolid.setSolidRefFluidPhase` for the reference liquid.",
]
[source]
standard = "NeqSim master `ComponentWax.fugcoef2`"
edition = "The default `Pedersen` wax component model. `ComponentWonWax`, `ComponentWaxWilson` and `ComponentCoutinhoWax` are the phase's other three and are carried."
[inputs]
[inputs.molar_mass]
unit = "kg/mol"
description = "The cut's molar mass. The heat-capacity difference is fitted in it.\n"
[inputs.tc]
unit = "K"
description = "The cut's critical temperature, which the reference liquid is a one-component phase at.\n"
[inputs.pc]
unit = "Pa"
description = "The cut's critical pressure, in the units the cubic takes. NeqSim holds it in bar internally and this states pascals.\n"
[inputs.omega]
unit = "dimensionless"
description = "The cut's acentric factor, which sets the reference liquid's alpha through `eos.srk_kappa`. **NeqSim overwrites it with the root of that polynomial whenever `AttractiveTermSrk.setm` is called**, so it is the value the component holds and not the one `calcAcentricFactor` returns.\n"
[inputs.heat_of_fusion]
unit = "J/mol"
description = "The cut's heat of fusion, which NeqSim fits as `0.1426/0.238845 M T_tp` with `M` in g/mol.\n"
[inputs.triple_point_temperature]
unit = "K"
description = "The cut's triple-point temperature, which NeqSim fits as `374.5 + 0.02617 M - 20172/M` with `M` in g/mol.\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.P]
unit = "Pa"
description = "absolute pressure\n"
[inputs.eos]
type = "enum"
values = ["pr", "srk"]
optional = true
description = "the cubic the fluid runs, which is also the one the reference liquid is built from - NeqSim clones the host phase's class, so this is a real choice and not a label"
[outputs]
[outputs.fugacity_coefficient]
unit = "dimensionless"
description = "The wax phase's fugacity coefficient for this component, `f_i^wax/(P x_i)`, which is `phi_liq exp(...)` because the `x` cancels.\n"
[[valid_range]]
quantity = "molar_mass"
min = 0
min_inclusive = false
severity = "error"
rationale = "a molar mass; the heat-capacity fit is linear in it, so a zero or a negative has no meaning\n"
[[valid_range]]
quantity = "tc"
min = 0
min_inclusive = false
severity = "error"
rationale = "a critical temperature; the reference liquid's reduced temperature divides by it\n"
[[valid_range]]
quantity = "pc"
min = 0
min_inclusive = false
severity = "error"
rationale = "a critical pressure; the reference liquid's reduced pressure divides by it\n"
[[valid_range]]
quantity = "heat_of_fusion"
min = 0
min_inclusive = false
severity = "error"
rationale = "a heat of fusion; a zero makes the solid identical to the liquid and a negative says it melts on freezing\n"
[[valid_range]]
quantity = "triple_point_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "a triple-point temperature; it divides and it is logged\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature\n"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[worked_example]
source = "NeqSim master, `ComponentWax.fugcoef2`, from `validation/neqsim/captures/wax_reference_probe.tsv`"
derivation = "The `C19`-scale wax cut - `waxPC1_PC` - at 261 K and 5 bara, where NeqSim reports `wax_phi = 9.64037175863650e-07` and its reference liquid `ref_phi = 9.38058516384021e-07` with `ref_molar_volume = 32.2483111017882` (in units of 1e-5 m3/mol):\n\n  molar mass  = 0.170 kg/mol = 170 g/mol\n  dH_fus      = 26418.6063505621 J/mol,   T_tp = 260.290076470588 K\n  v_liq       = 32.2483111017882e-5 = 3.22483111017882e-4 m3/mol\n  v_sol       = 0.9 v_liq = 2.90234799916094e-4\n\n  fusion  = -26418.6063505621/(8.3144621*261) * (1 - 261/260.290076470588)\n          = -12.17542... * (-0.00272756...) = +0.0332039...\n  dCp     = (0.3033*170 - 4.635e-4*170*261) * 4.184 = 129.673...  J/(mol K)\n  cpTerm  = 129.673.../8.3144621 * (260.290076470588/261 - 1 - ln(0.997272...))\n          = 15.596... * 3.7...e-06 = +0.0000578\n  presTerm= -(3.22483111017882e-4 - 2.90234799916094e-4) * (5.0e5 - 1.0e5) / 8.3144621 / 261\n          = -3.22483111017882e-5 * 4.0e5 / 2170.07... = -0.00594386...\n\n  exponent = 0.0332039... + 0.0000578 - 0.00594386... = 0.0273179...\n  phi     = 9.38058516384021e-07 * exp(0.0273179...) = 9.64037175863650e-07\n\nThe capture's `wax_phi` is that last number, and its reference rows are the two inputs above."
tolerance = 1e-12
[worked_example.inputs]
molar_mass = 0.17
tc = 632.271665693285
pc = 1526386.94925152
omega = 0.674258471831839
heat_of_fusion = 26418.6063505621
triple_point_temperature = 260.290076470588
T = 261.0
P = 500000.0
eos = "srk"
[worked_example.expected]
fugacity_coefficient = 9.6403717586365e-07
[implementations]
python = "azoth.eos.wax_solid_fugacity"
rust = "azoth_eos::wax_solid_fugacity"
[[tests]]
id = "the_c19_cut_worked_example"
