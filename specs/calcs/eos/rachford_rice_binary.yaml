id: eos.rachford_rice_binary
name: Rachford-Rice vapour fraction, for a binary
equation: "beta = -(z1*(K1 - 1) + (1 - z1)*(K2 - 1)) / ((K1 - 1)*(K2 - 1))"
latex: '\beta = -\frac{z_{1}\left(K_{1} - 1\right) + z_{2}\left(K_{2} - 1\right)}{\left(K_{1} - 1\right)\left(K_{2} - 1\right)}'

source:
  standard: Rachford, H. H.; Rice, J. D. (1952)
  edition: "Procedure for Use of Electronic Digital Computers in Calculating Flash Vaporization Hydrocarbon Equilibrium. Journal of Petroleum Technology, 4(10), 19-3"
  doi: "10.2118/952327-G"

inputs:
  z1:
    unit: dimensionless
    description: >
      Overall mole fraction of component 1. Component 2 is `1 - z1`, so there is no
      `z2` input - passing both would allow a pair that does not sum to one, and
      this calc would have to decide which to believe.
  K1:
    unit: dimensionless
    description: >
      The K-value of component 1, `y1/x1`. Normally the caller's, computed from
      fugacity coefficients.
  K2:
    unit: dimensionless
    description: the K-value of component 2

outputs:
  beta:
    unit: dimensionless
    description: >
      The vapour fraction that solves the Rachford-Rice equation. Named `beta` rather
      than `vapour_fraction` because that is what every source calls it and what the
      equation is written in terms of.

      Its value is a mathematical solution, not necessarily a physical state:
      outside `[0, 1]` it describes no two-phase mixture. See the warning bound.

valid_range:
  - quantity: z1
    min: 0
    max: 1
    severity: error
    rationale: a mole fraction; both ends are admitted, since a pure component is a legitimate limiting case and is a useful check

  - quantity: K1
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      `K = y/x` with both compositions positive, so a K-value is strictly positive. A
      zero or negative one is not in the range where the equation means anything, and
      it would make the vapour composition `K*x` negative.

  - quantity: K2
    min: 0
    min_inclusive: false
    severity: error
    rationale: as for `K1`

  - quantity: K1
    equals: 1
    severity: error
    rationale: >
      `K1 - 1` is a divisor in the closed form. It is also the degenerate case of the
      equation: with `K1 = 1` component 1 distributes equally and drops out of the
      sum entirely, leaving a one-component problem whose solution is entirely
      determined by `K2`. Refusing is better than returning whatever the algebra
      collapses to.

  - quantity: K2
    equals: 1
    severity: error
    rationale: as for `K1`

  - quantity: beta
    min: 0
    max: 1
    severity: warning
    rationale: >
      Outside `[0, 1]` the feed is single phase and the equation's solution is the
      *tangent-plane* value rather than a phase split. The result is returned with
      this warning rather than refused, because the value is meaningful and useful -
      a negative `beta` says the feed is subcooled liquid, and `beta > 1` says it is
      superheated vapour - but a caller must not read it as a vapour fraction.

      The warning is on the output rather than on the inputs because whether the feed
      splits depends on all three, not on any one of them, and there is no bound on
      `z1`, `K1` or `K2` individually that expresses it.

assumptions:
  - both K-values are for the same temperature and pressure. They are the caller's, and this calc has no way to know they describe one state.
  - "the K-values are consistent with each other in the thermodynamic sense - that is, derived from fugacity coefficients for the same mixture. This calc is a solver for an algebraic equation and will happily return a `beta` for a pair of K-values that no mixture would produce."
  - the feed is a single overall composition `(z1, 1 - z1)`. A three-phase problem has no single `beta`, and a feed with a non-condensable component is not describable this way.
  - "no stability test is performed. A `beta` inside `[0, 1]` says the equation has a solution there, not that the feed is unstable and *should* split - and a `beta` outside says the equation has none, which is a necessary but not a sufficient condition for the feed being single phase."

references:
  - 'Rachford, H. H.; Rice, J. D. (1952). "Procedure for Use of Electronic Digital Computers in Calculating Flash Vaporization Hydrocarbon Equilibrium." Journal of Petroleum Technology 4(10), 19-3. DOI 10.2118/952327-G. (the origin of the equation; the citation details are confirmed by search, the paper itself is not read, and the closed form for two components is our algebra rather than the paper''s - see `notes`)'

worked_example:
  source: derived from the equation above
  derivation: >
    A case chosen so the arithmetic is short, exact in principle, and checkable by
    hand: `z1 = 0.6`, `K1 = 4.0`, `K2 = 0.25`.

      A = K1 - 1 = 3.0
      B = K2 - 1 = -0.75
      z1*A + (1 - z1)*B = 0.6*3.0 + 0.4*(-0.75)
                        = 1.8 - 0.3
                        = 1.4999999999999998
      A*B = 3.0 * -0.75 = -2.25
      beta = -1.4999999999999998 / -2.25 = 0.6666666666666665

    **Which is not `2/3` to the last bit, and the reason is worth stating.** The
    numerator should be exactly 1.5, and it is not: `0.6*3.0` is 1.7999999999999998
    and `0.4*(-0.75)` is -0.30000000000000004, so their sum is one ulp light. The
    double nearest 2/3 is 0.6666666666666666, and this is 0.6666666666666665. Five
    roundings in, one ulp out - normal for a ratio of sums, and not an error.

    The check that does not depend on the exact decimal is the residual, and it
    closes exactly:

      0.6*3.0/(1 + beta*3.0) + 0.4*(-0.75)/(1 + beta*(-0.75)) = 0.0

    in double precision, at the returned `beta`. So the value genuinely solves the
    equation, which is the claim worth testing; the fifth digit of the expected value
    is not.
  inputs: { z1: 0.6, K1: 4.0, K2: 0.25 }
  expected: { beta: 0.6666666666666665 }
  tolerance: 1.0e-12

implementations:
  python: azoth.eos.rachford_rice_binary
  rust: azoth_eos::rachford_rice_binary

tests:
  - id: a_hand_checkable_case
    type: worked_example
    status: active

  - id: a_feed_that_does_not_split
    type: reference
    status: active
    source: >
      Derived from the equation above, at a feed whose K-values are both greater than
      one - so every component prefers the vapour and there is no split:

        z1 = 0.5, K1 = 2.0, K2 = 1.5
        A = 1.0, B = 0.5
        z1*A + (1 - z1)*B = 0.5 + 0.25 = 0.75
        A*B = 0.5
        beta = -0.75/0.5 = -1.5

      `beta = -1.5`, outside `[0, 1]`, so the result carries the warning. That is the
      point of the case: it exercises the single-phase path and the warning that
      distinguishes it, which a solver that clamped `beta` to `[0, 1]` - the tempting
      repair - would pass on the value and fail on the warning. A clamped solver
      would also have thrown away the information that the feed is *subcooled liquid*
      rather than merely not-split.
    inputs: { z1: 0.5, K1: 2.0, K2: 1.5 }
    expected: { beta: -1.5 }
    tolerance: 1.0e-15

  - id: a_second_two_phase_case
    type: reference
    status: active
    source: >
      Derived from the equation above, at a different composition and a much wider
      spread of K-values:

        z1 = 0.3, K1 = 5.0, K2 = 0.2
        A = 4.0, B = -0.8
        z1*A + (1 - z1)*B = 0.3*4.0 + 0.7*(-0.8) = 1.2 - 0.5599999999999999 = 0.64
        A*B = -3.2
        beta = -0.64 / -3.2 = 0.19999999999999998

      Inside `[0, 1]`, so no warning. Its residual is 1.1e-16 rather than exactly
      zero, which is the ordinary case - the worked example's exact zero is a
      coincidence of that composition, not something the method guarantees.
    inputs: { z1: 0.3, K1: 5.0, K2: 0.2 }
    expected: { beta: 0.19999999999999998 }
    tolerance: 1.0e-12

  - id: the_returned_beta_solves_the_equation
    type: property
    property: consistency_with
    status: active
  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: skipped
    skip_reason: >
      Every input and every output is dimensionless, so there is no unit to convert.
      Declared rather than omitted so the omission is a recorded decision, following
      `crane_k_factors` and the other `eos` calcs.
