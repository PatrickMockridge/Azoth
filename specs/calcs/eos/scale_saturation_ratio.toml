id = "eos.scale_saturation_ratio"
name = "Scale saturation ratio of one salt"
equation = "m1 = x1 / (x_water M_water),  m2 = x2 / (x_water M_water)       [mol/kg water]\n\nKsp = exp(A/T + B + C ln T + D T + E/T**2) * exp(-Vdelta (P - 1.01325) / (83.1446 T))\n\nIAP = (gamma1 m1)**stoc1 * (gamma2 m2)**stoc2 * a_water**waterstoc\n\nSR  = IAP / Ksp\n\nwith Ksp's five coefficients and `Vdelta` from NeqSim's `compsalt` row for the salt, and `R = 83.1446` cm3 bar/(mol K) because `Vdelta` is in cm3/mol and `P` is in bar."
latex = '''m_{i} = \\frac{x_{i}}{x_{w}M_{w}}, \\qquad \\mathrm{IAP} = (\\gamma_{1}m_{1})^{\\nu_{1}}(\\gamma_{2}m_{2})^{\\nu_{2}}a_{w}^{\\nu_{w}}, \\qquad \\mathrm{SR} = \\frac{\\mathrm{IAP}}{K_{sp}}, \\qquad K_{sp} = \\exp\\!\\left(\\frac{A}{T} + B + C\\ln T + DT + \\frac{E}{T^{2}}\\right)e^{-\\Delta V (P-P_{0})/(RT}'''
assumptions = [
    "**this is `CheckScalePotential`'s per-salt arithmetic, which is the whole of what the operation computes.** Its `run()` walks NeqSim's `compsalt` table and reports a ratio per salt whose two ions the phase has; this is one row of that, so porting the operation is looping over this.",
    "**the salt is named, and three names override the correlation.** `NaCl` is `92.78 - 0.407 T + 0.000747 T**2`, `CaCO3` is Plummer & Busenberg (1982) and `FeCO3` Greenberg & Tomson (1992), both named below. **The row's coefficients are discarded for those three**, as NeqSim's `if` chain does.",
    "**`FeS` is modified by the hydrogen-ion molality**, and only for it: without an `H3O+` component the salt is skipped entirely, and with one the Ksp is multiplied by `x(H3O+)/(x_water M_water)` before the pressure correction.",
    "`Vdelta` is in **cm3/mol** and the pressure term's `R` is `83.1446`, which is that unit's gas constant - the term is dimensionless as written and a port that used `8.3144621` against a cm3/mol volume would be out by `1e4`.",
    "the reference pressure is **1.01325 bar**, so the correction vanishes at one atmosphere and not at zero.",
    "**the ratio is clamped at `exp(69)` and floored at zero**: NeqSim returns `0` where either molality is under `1e-30` or `ln SR` is under `-69`, and `exp(69)` above `+69`. Those are overflow guards rather than physical bounds, and a `0` reads as \"too far below saturation to matter\".",
    "`x1`, `x2` and `x_water` are the **aqueous phase's mole fractions**, taken as the phase has them. NeqSim reads the phase's components and nothing else, so a brine whose ions were *stated* needs no reactive speciation - which is what makes this port-able without the chemistry.",
    "the activity coefficients are the **caller's**, and they are the phase model's own. A port that computed them here would be porting `getActivityCoefficient` as well, which is the electrolyte family's and not this one's.",
    "`a_water` is read as the phase's water activity, which NeqSim takes as the water mole fraction and multiplies by its activity coefficient **only where the component says it has one** - so the caller states `waterstoc`'s term rather than this calc deciding it.",
    "the salt row is read from `data/components/COMPSALT.csv`, which the P8 electrolyte models already read; the name is matched as the table spells it, so `CaSO4_A` and `CaSO4_G` are two rows and not one salt with a setting.",
]
references = [
    "Plummer, L. N.; Busenberg, E. (1982). \"The solubilities of calcite, aragonite and vaterite in CO2-H2O solutions between 0 and 90 C.\" Geochimica et Cosmochimica Acta 46(6), 1011-1040. DOI 10.1016/0016-7037(82)90056-4.",
    "Greenberg, J.; Tomson, M. (1992). \"Precipitation and dissolution kinetics and equilibria of aqueous ferrous carbonate vs temperature.\" Applied Geochemistry 7(2), 185-190. DOI 10.1016/0883-2927(92)90035-3.",
    "Oddo, J. E.; Tomson, M. B. (1982). \"Simplified calculation of CaCO3 saturation at high temperatures and pressures in brine solutions.\" Journal of Petroleum Technology 34(7), 1583-1590. DOI 10.2118/10352-PA.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `CheckScalePotential` is the port source; its `run()` for the Ksp chain and `computeSRLogSpace` for the ratio.",
]
[source]
standard = "NeqSim 3.20.0 `CheckScalePotential`"
edition = "One row of its `compsalt` walk, which is the whole of what the operation computes per salt."
[inputs]
[inputs.salt]
type = "string"
description = "The salt's name as `compsalt` spells it, which is what selects the row and the three overrides - `NaCl`, `CaCO3` and `FeCO3`. A name the table does not carry is refused rather than defaulted.\n"
[inputs.x1]
unit = "dimensionless"
description = "The first ion's mole fraction in the aqueous phase.\n"
[inputs.x2]
unit = "dimensionless"
description = "The second ion's mole fraction in the same phase.\n"
[inputs.x_water]
unit = "dimensionless"
description = "Water's mole fraction in the same phase, which is the denominator both molalities are per kilogram of.\n"
[inputs.gamma1]
unit = "dimensionless"
description = "The first ion's activity coefficient, from the phase's own model.\n"
[inputs.gamma2]
unit = "dimensionless"
description = "The second ion's activity coefficient.\n"
[inputs.water_activity]
unit = "dimensionless"
description = "Water's activity, which the `waterstoc` term raises to its stoichiometric power. Read only where the row states a non-zero `waterstoc`, which is one row of the 22.\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.P]
unit = "Pa"
description = "absolute pressure\n"
[inputs.h3o_molality]
unit = "mol/kg"
optional = true
description = "The hydrogen ion's molality, **read for `FeS` alone**: that salt's solubility product is multiplied by it, and NeqSim skips the salt where the phase has no `H3O+`, which a scalar calc cannot do. Required for `FeS` and ignored by every other salt.\n"
[outputs]
[outputs.saturation_ratio]
unit = "dimensionless"
description = "`IAP/Ksp`, one at saturation. **Clamped**: `exp(69)` above, `0` below `ln SR = -69` and wherever either molality is under `1e-30`, which are the operation's own overflow guards.\n"
[outputs.ion_activity_product]
unit = "dimensionless"
description = "`(gamma1 m1)**stoc1 (gamma2 m2)**stoc2 a_water**waterstoc`, the product the ratio's numerator is.\n"
[outputs.solubility_product]
unit = "dimensionless"
description = "`Ksp(T, P)` after the override, the hydrogen-ion correction and the pressure term, so a divergence can be read as either half.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; the correlation takes its logarithm\n"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[worked_example]
source = "NeqSim 3.20.0, `CheckScalePotential`, from `validation/neqsim/captures/scale_probe.tsv`"
derivation = "The probe's brine at 25 C and 10 bara, whose NaCl row the operation reports as `1.28292894726281e-07`:\n\n  T = 298.15 K,  P = 10 bar\n  x[Na+] = 3.97819175172662e-05,  x[Cl-] = the same,  x[water] = 0.994547937931656\n  gamma[Na+] = gamma[Cl-] = 0.997138700891861,  stoc1 = stoc2 = 1,  waterstoc = 0\n\n  Ksp0  = 92.78 - 0.407*298.15 + 0.000747*298.15**2 = 37.8335...\n  Vdelta = -27.0 cm3/mol, so\n  ln corr = -(-27.0)*(10 - 1.01325)/(83.1446*298.15) = +0.009789...\n  Ksp   = 37.8335 * exp(0.009789...) = 38.208500153860996\n\n  m     = 3.97819175172662e-05/(0.994547937931656*0.018015) = 2.220488...e-03 mol/kg\n  IAP   = (0.997138700891861*2.220488e-03)**2 = 4.902241...e-06\n  SR    = 4.902241e-06/38.208500153860996 = 1.282928947262809e-07\n\nThe capture's row is that last number. Its `FeCO3` row is `257932.607723642`, which the same arithmetic with the Greenberg & Tomson override gives as `257932.60772364`."
tolerance = 1e-12
[worked_example.inputs]
salt = "NaCl"
x1 = 3.97819175172662e-05
x2 = 3.97819175172662e-05
x_water = 0.994547937931656
gamma1 = 0.997138700891861
gamma2 = 0.997138700891861
water_activity = 0.994547937931656
T = 298.15
P = 1000000.0
[worked_example.expected]
saturation_ratio = 1.282928947262809e-07
[implementations]
python = "azoth.eos.scale_saturation_ratio"
rust = "azoth_eos::scale_saturation_ratio"
[[tests]]
id = "the_nacl_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "the_ferrous_carbonate_row_of_the_same_brine"
type = "reference"
status = "active"
source = "The probe's `FeCO3` row, `257932.607723642` - the same brine's other saturated salt, and the one that exercises the override and the larger `Vdelta` (`-52.9` cm3/mol against NaCl's `-27.0`). It is supersaturated where the NaCl is far under, which is why both are pinned.\n"
tolerance = 1e-12
[tests.inputs]
salt = "FeCO3"
x1 = 0.00109499727966275
x2 = 9.44820541035073e-07
x_water = 0.994547937931656
gamma1 = 0.997138700891861
gamma2 = 1.05176801306048
water_activity = 0.994547937931656
T = 298.15
P = 1000000.0
[tests.expected]
saturation_ratio = 257932.607723642
