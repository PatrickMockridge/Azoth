rationale = "A pH outside the aqueous range is a caller's mistake rather than a state; the arithmetic still runs.\n"
[worked_example]
source = "the capture's `north_sea_manual_ph_80c_100bara` row"
derivation = "North Sea produced water: Ca 400 mg/L, HCO3 150 mg/L, SO4 10 mg/L, TDS 35000 mg/L, 80 C, 100 bara, CO2 2 bar, pH 6.5.\n\n  I = 35000/40000 = 0.875 mol/L\n  A = 1.8246e6 sqrt(rho)/(eps T)^1.5 = 0.5681180315158152\n  gamma_2 = 10^(-A*4*(sqrtI/(1+sqrtI) - 0.3I)) = 0.3149231465868798\n  c_Ca = 400/40078 = 0.0099805..., c_HCO3 = 150/61017, c_SO4 = 10/96060\n  [CO3--] = K2(T) [HCO3-]/10^-6.5, then five ion-pair sweeps\n  free Ca = 0.009938888151831327 mol/L, free SO4 = 1.0114021193932607e-4, free CO3 = 4.1855661156620394e-7\n  Ksp(calcite) = 1.2499563121043342e-9 (log10 = -8.903105165986812)\n  SI(CaCO3) = log10[(c_Ca gamma_2)(c_CO3 gamma_2)/Ksp] = -0.48139366009468343\n  SI(CaSO4) = -2.117124475975582; Ba, Sr and Fe are absent, so their indices are absent\n"
tolerance = 1e-12
[worked_example.inputs]
calcium = 0.4
barium = 0.0
strontium = 0.0
iron = 0.0
magnesium = 0.0
sodium = 0.0
bicarbonate = 0.15
sulphate = 0.01
total_dissolved_solids = 35.0
temperature = 353.15
pressure = 1.0e7
co2_partial_pressure = 2.0e5
ph = 6.5
auto_ph = false
second_order_pressure_correction = false
[worked_example.expected]
ionic_strength = 875.0
debye_huckel_a = 0.5681180315158152
divalent_activity_coefficient = 0.3149231465868798
ph_used = 6.5
free_calcium = 9.938888151831327
free_sulphate = 0.10114021193932607
free_carbonate = 4.1855661156620394e-4
ksp_calcite = 1.2499563121043342e-9
log10_ksp_calcite = -8.903105165986812
si_caco3 = -0.48139366009468343
si_caso4 = -2.117124475975582
scale_risk_count = 0.0
[[tests]]
id = "north_sea_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "auto_ph_is_the_class_defect"
type = "reference"
status = "active"
source = "The capture's `north_sea_auto_ph` row: the same water with `enableAutoPH()`. The class's Henry constant gives log10(KH) = 48.69 at 353.15 K, so the estimate is pH = -45.30001384171815, free carbonate is 6.6334332524514346e-59 mol/L and the calcite index -52.281402382552564. **The port reproduces the defect rather than repairing it.**\n"
tolerance = 1e-12
[tests.inputs]
calcium = 0.4
barium = 0.0
strontium = 0.0
iron = 0.0
magnesium = 0.0
sodium = 0.0
bicarbonate = 0.15
sulphate = 0.01
total_dissolved_solids = 35.0
temperature = 353.15
pressure = 1.0e7
co2_partial_pressure = 2.0e5
ph = 6.5
auto_ph = true
second_order_pressure_correction = false
[tests.expected]
ph_used = -45.30001384171815
free_carbonate = 6.6334332524514346e-56
si_caco3 = -52.281402382552564
[[tests]]
id = "barite_supersaturated"
type = "reference"
status = "active"
