min = 0
min_inclusive = true
severity = "error"
rationale = "A partial pressure cannot be negative.\n"
[[valid_range]]
quantity = "calcium"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "barium"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "strontium"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "iron"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "magnesium"
min = 0
