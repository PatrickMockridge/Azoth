id = "eos.liquid_viscosity_pure"
name = "One component's pure-liquid viscosity from the LIQVISC correlation"
equation = "The LIQVISC model's form, times NeqSim's Lucas pressure correction: model 1 is `l1*T**l2`, model 2 `exp(l1 + l2/T)`, model 3 `exp(l1 + l2/T + l3*T + l4*T**2)` and model 4 `10**(l1*(1/T - 1/l2))`; the result is multiplied by `(pressure_correction + 1)/2`, where the correction is 1 above the critical temperature and otherwise the Lucas ratio of two polynomials in `T/Tc` and `P/Pc`."
latex = '''\mu_i = \mu_i^{\mathrm{LIQVISC}}\,\frac{1 + \mathrm{corr}(T,P)}{2},\qquad \mathrm{corr} = \frac{1 + D\left(\frac{P/P_c}{2.118}\right)^{A}}{1 + C\,\omega\,P/P_c}'''
assumptions = ["**this is not the phase's viscosity.** It is one component's, at the phase's `(T, P)` and by the component's own LIQVISC parameters - the `eta_B` the liquid diffusivity correlations take, where the phase's own viscosity is PFCT's and a different number.\n", "**NeqSim's two classes carry this ladder and disagree in one branch**: the common-phase one leaves model 2 **empty** (the component comes out at `0` cP), the liquid one implements it as `exp(l1 + l2/T)`. `form` selects which, because a phase gets whichever class its viscosity model extends.\n", "**both are on the rate-based column's path**: an oil phase's `PFCTViscosityMethodHeavyOil` inherits the common-phase class, so its n-butane comes out at zero, where an aqueous phase's \"polynom\" model is the liquid class.\n", "above the component's critical temperature the answer is `0.5` cP whatever the model, and a component with no model index at all answers `0.7` - NeqSim's two sentinels.\n", "the result is in Pa*s, where NeqSim's own value is in cP; the `1e-3` is the port's conversion and not part of the correlation.\n"]
references = ["Yaws, C. L. (2003). \\\"Yaws' Handbook of Thermodynamic and Physical Properties of Chemical Compounds.\\\" Knovel. The four liquid-viscosity temperature forms, which NeqSim stores as `LIQVISC1..4` with a model index.\n", "Lucas, K. (1981). \\\"Die Druckabhängigkeit der Viskosität von Flüssigkeiten.\\\" Chemie Ingenieur Technik 53(1), 29-32. DOI 10.1002/cite.330530107. The pressure correction `getViscosityPressureCorrection` applies.\n", "`validation/neqsim/captures/phase_transport_probe.tsv` - per phase and per component, the LIQVISC model, its four parameters and the pure viscosity NeqSim answers, on four fluids.\n"]
[source]
standard = "NeqSim master `commonphasephysicalproperties/viscosity/Viscosity` and `liquidphysicalproperties/viscosity/Viscosity`"
edition = "`calcPureComponentViscosity` and `getViscosityPressureCorrection`, ported from the two classes that carry them."
doi = "10.1002/cite.330530107"
[inputs]
[inputs.form]
type = "enum"
values = ["common_phase", "liquid"]
description = "Which of NeqSim's two ladders: `common_phase`, whose model 2 branch is empty, or `liquid`, which implements it. See the assumptions.\n"
[inputs.model]
unit = "dimensionless"
description = "The component's LIQVISC model index: 1, 2, 3 or 4. Zero - NeqSim's `LIQVISC5` absent or unset - answers the `0.7` cP sentinel.\n"
[inputs.l1]
unit = "dimensionless"
description = "The component's `LIQVISC1`, whose unit depends on the model.\n"
[inputs.l2]
unit = "dimensionless"
description = "`LIQVISC2`.\n"
[inputs.l3]
unit = "dimensionless"
description = "`LIQVISC3`, read by model 3 only.\n"
[inputs.l4]
unit = "dimensionless"
description = "`LIQVISC4`, read by model 3 only.\n"
[inputs.Tc]
unit = "K"
description = "The component's critical temperature, which the above-critical sentinel and the correction both read.\n"
[inputs.Pc]
unit = "Pa"
description = "Its critical pressure, in the correction's reduced pressure.\n"
[inputs.omega]
unit = "dimensionless"
description = "Its acentric factor, in the correction's denominator.\n"
[inputs.T]
unit = "K"
description = "Absolute temperature.\n"
[inputs.P]
unit = "Pa"
description = "Absolute pressure.\n"
[outputs]
[outputs.mu]
unit = "Pa*s"
description = "The component's pure-liquid viscosity at this state.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute temperature; zero and below are not states, and the models divide by it.\n"
[[valid_range]]
quantity = "Tc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`T/Tc` is the correction's reduced temperature.\n"
[[valid_range]]
quantity = "Pc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`P/Pc` is the reduced pressure.\n"
[worked_example]
source = "the capture's `co2_water_313K_50bar` row: its aqueous phase's water at 313.15 K and 50 bar, from the component's own LIQVISC parameters\n"
derivation = "water's LIQVISC model is 3 with `l1 = -27.952757828`, `l2 = 4665.22592993`, `l3 = 0.052323342`, `l4 = -3.8356e-5`, and its `Tc = 647.3` K, `Pc = 22089000` Pa, `omega = 0.344`:\n\n  T < Tc, so the model applies:\n  exp(-27.952757828 + 4665.22592993/313.15 + 0.052323342*313.15 + -3.8356e-5*313.15**2) = 0.633992... cP\n  corr = 1.0378860321492944, so mu = 0.633992... * (1.0378860321492944 + 1)/2 = 0.6528922494381046 cP\n  mu = 6.528922494381046e-4 Pa*s\n\nwhich is NeqSim's own `getPureComponentViscosity(1)` for that phase, to the last digit.\n"
tolerance = 1e-12
[worked_example.inputs]
form = "liquid"
model = 3
l1 = -27.952757828
l2 = 4665.22592993
l3 = 0.052323342
l4 = -3.8356e-5
Tc = 647.3
Pc = 22089000.0
omega = 0.344
T = 313.15
P = 5000000.0
[worked_example.expected]
mu = 6.528922494381046e-4
[implementations]
python = "azoth.eos.liquid_viscosity_pure"
rust = "azoth_eos::liquid_viscosity_pure"
[[tests]]
id = "water_in_the_aqueous_phase_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "model_two_is_where_the_two_ladders_disagree"
type = "reference"
status = "active"
source = "n-butane's parameters - model 2, `-7.811` and `3140.0` - at the *oil* phase's state (300 K, 20 bar), under both ladders. **NeqSim answers `0.0` cP for the common-phase class**, because its model 2 branch is empty and only the correction scales it, which is what its own `getPureComponentViscosity` returns for that phase; the liquid class answers `14.504116387418152` cP from the same parameters.\n\n  common_phase: mu = 0.0 Pa*s\n  liquid:       mu = 1.4504116387418152e-2 Pa*s\n\nThat the same component at the same state has two answers is not this id's doing: it is the class selection, and the `form` input is how the port says which one a phase got.\n"
tolerance = 1e-12
[tests.inputs]
form = "liquid"
model = 2
l1 = -7.811
l2 = 3140.0
l3 = 0.0
l4 = 0.0
Tc = 425.12
Pc = 3796000.0
omega = 0.2002
T = 300.0
P = 2000000.0
[tests.expected]
mu = 1.4504116387418152e-2
[[tests]]
id = "the_common_phase_ladder_leaves_model_two_at_zero"
type = "reference"
status = "active"
source = "The same state and parameters under the other ladder: `calcPureComponentViscosity` in `commonphasephysicalproperties.viscosity.Viscosity` has an empty branch for model 2, so the array entry stays at its initial zero and the pressure correction multiplies it. NeqSim's own oil phase reports exactly this.\n"
tolerance = 1e-12
[tests.inputs]
form = "common_phase"
model = 2
l1 = -7.811
l2 = 3140.0
l3 = 0.0
l4 = 0.0
Tc = 425.12
Pc = 3796000.0
omega = 0.2002
T = 300.0
P = 2000000.0
[tests.expected]
mu = 0.0
[[tests]]
id = "above_the_critical_temperature_the_sentinel_answers"
type = "reference"
status = "active"
source = "Methane in the capture's `methane_nbutane_300K_20bar` gas phase, at 300 K where its critical temperature is 190.56 K: the first branch wins whatever the model is, and NeqSim reports `0.5` cP. The correction is 1 above `Tc`, so the sentinel is not scaled.\n"
tolerance = 1e-12
[tests.inputs]
form = "common_phase"
model = 3
l1 = -26.87
l2 = 1150.0
l3 = 0.187
l4 = -5.21e-4
Tc = 190.56
Pc = 4599000.0
omega = 0.0115
T = 300.0
P = 2000000.0
[tests.expected]
mu = 5.0e-4
