id: eos.pr_kappa
name: Peng-Robinson attraction-parameter coefficient
equation: "kappa = 0.37464 + 1.54226*omega - 0.26992*omega**2"
latex: '\kappa = 0.37464 + 1.54226\,\omega - 0.26992\,\omega^{2}'

source:
  standard: Peng, D. Y.; Robinson, D. B. (1976)
  edition: "A New Two-Constant Equation of State. Industrial & Engineering Chemistry Fundamentals, 15(1), 59-64"
  doi: "10.1021/i160057a011"

inputs:
  omega:
    unit: dimensionless
    description: >
      Acentric factor of the pure component, as defined by Pitzer:
      -log10(Pr_sat/Pr_c) - 1 evaluated at a reduced temperature of 0.7. A
      property of the substance, supplied by the caller. This calc has no
      databank and does not look one up - see `assumptions`.

outputs:
  kappa:
    unit: dimensionless
    description: >
      The coefficient in the Peng-Robinson alpha function,
      alpha = (1 + kappa*(1 - sqrt(Tr)))**2. Dimensionless, and a property of the
      substance alone: it does not depend on temperature or pressure, which is
      what makes it separable from alpha and worth a calc of its own.

valid_range:
  - quantity: kappa
    min: 0
    min_inclusive: false
    severity: warning
    rationale: >
      The polynomial passes through zero at two values of omega, the roots of
      0.37464 + 1.54226*omega - 0.26992*omega**2 = 0: -0.23338349942403008 and
      5.947150541510574. Below the lower one - and above the upper one, which no
      real fluid reaches - kappa is negative.

      That matters because kappa enters alpha = (1 + kappa*(1 - sqrt(Tr)))**2 as
      the coefficient of how fast the attraction weakens with temperature. For
      kappa > 0 the attraction weakens as Tr rises, which is the behaviour the
      function exists to model; for kappa < 0 it strengthens, which is not a
      physical statement about any fluid. The returned value is still the
      polynomial's value and is still returned - a warning, not a refusal - but it
      is no longer a Peng-Robinson attraction parameter.

      This fires for real fluids, not for a theoretical corner. Helium
      (omega = -0.385) is below the root and produces kappa = -0.259138992;
      hydrogen (-0.216) is just above it and produces kappa = +0.02891845248, a
      coefficient small enough that alpha is very nearly 1 at every temperature.
      That PR handles the quantum fluids poorly is well known, and this bound says
      so in a way a caller can branch on rather than in a footnote.

      The roots are stated to full precision rather than rounded because they are
      the boundary this bound is drawn at, and a reader checking where the sign
      changes should get the same answer this does. They are the roots of the
      quadratic as published; see `notes` for what that qualification means
      here.

assumptions:
  - the acentric factor supplied is correct for the component intended. NOT CHECKED - this calc has no databank and no second source; omega comes from the caller and is taken at face value.
  - omega is taken as the constant Pitzer acentric factor evaluated at Tr = 0.7. A component whose acentric factor has been derived some other way, or fitted to a different reduced temperature, is not the quantity this correlation expects.
  - the coefficient applies to the 1976 Peng-Robinson alpha function and to nothing else. Peng-Robinson-Stryjek-Vera, PR-Twu and every other revision change exactly this temperature dependence, and a kappa from here is not comparable with one from those.
  - the range of acentric factors over which the correlation was fitted is NOT established, and no bound asserts one. Values far outside the usual band - above about 1, or below 0 - are an extrapolation of a quadratic fitted elsewhere, and the correlation's behaviour there is a property of the polynomial rather than a claim anyone has checked. See `notes`.
  - this calc returns a coefficient, not an equation of state. It makes no claim about the Z factor, fugacity coefficient or phase behaviour that alpha feeds into; those are separate calcs with their own sources and their own ranges.

references:
  - 'Peng, D. Y.; Robinson, D. B. (1976). "A New Two-Constant Equation of State." Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011. (the origin of the alpha function and of this coefficient; the citation is confirmed, the coefficients are not - see `notes`)'
  - 'Pitzer, K. S. (1955). "The Volumetric and Thermodynamic Properties of Fluids. I. Theoretical Basis and Virial Coefficients." Journal of the American Chemical Society 77(13), 3427-3433. DOI 10.1021/ja01618a002. (the definition of the acentric factor this calc takes as an input)'

worked_example:
  source: derived from the equation above
  derivation: >
    Propane-like, omega = 0.152 - the conventional acentric factor for propane,
    rounded to three decimals so that the substitution below is readable:

      1.54226 * omega      = 1.54226 * 0.152            = 0.23442352
      omega**2             = 0.152 * 0.152              = 0.023104
      0.26992 * omega**2   = 0.26992 * 0.023104         = 0.00623623168
      0.37464 + 0.23442352 = 0.60906352
      0.60906352 - 0.00623623168 = 0.60282728832

    kappa = 0.60282728832.

    Every line above was checked against the exact decimal arithmetic in
    arbitrary-precision arithmetic, not against a second floating-point run, and
    each intermediate is the correctly rounded double for its exact value. The
    input 0.152 is not itself exactly representable in binary - it is 19/125, and
    the stored double is the nearest one to it - so the honest claim is not that
    the arithmetic is exact, but that each operation rounds to the correctly
    rounded exact result and the final value is the double nearest the exact
    decimal 0.60282728832. That is why the tolerance below can be far tighter than
    any accuracy claim about the correlation would need: it is accounting for one
    rounding step per operation, not for the model.
  inputs: { omega: 0.152 }
  expected: { kappa: 0.60282728832 }
  tolerance: 1.0e-12

implementations:
  python: azoth.eos.pr_kappa
  rust: azoth_eos::pr_kappa

tests:
  - id: propane_worked_example
    type: worked_example
    status: active

  - id: methane_at_a_very_different_acentric_factor
    type: reference
    status: active
    source: >
      Derived from the equation above, at an acentric factor far from the worked
      example's so that an implementation which had hardcoded the worked example's
      answer would fail. Methane, omega = 0.01142 - two orders of magnitude
      smaller, and the smallest of any common hydrocarbon:

        1.54226 * 0.01142       = 0.0176126092
        0.01142**2              = 0.0001304164
        0.26992 * 0.0001304164  = 0.000035201994688
        0.37464 + 0.0176126092  = 0.3922526092
        0.3922526092 - 0.000035201994688 = 0.392217407205312

      kappa = 0.392217407205312, the exact decimal value.

      The near-ideal-gas end of the scale, where the quadratic term is almost
      negligible: 0.3922174 against the linear estimate 0.3922526. The two differ
      in the fourth decimal, so this case would also catch an implementation that
      dropped the omega**2 term.
    inputs: { omega: 0.01142 }
    expected: { kappa: 0.392217407205312 }
    tolerance: 1.0e-12

  - id: a_negative_acentric_factor_warns
    type: reference
    status: active
    source: >
      Derived from the equation above, at helium's acentric factor, omega = -0.385.
      This is the case the `valid_range` bound exists for, and it is run rather than
      assumed so the bound is known to fire:

        1.54226 * -0.385    = -0.59377010
        (-0.385)**2         = 0.148225
        0.26992 * 0.148225  = 0.04000889200
        0.37464 - 0.59377010 = -0.21913010
        -0.21913010 - 0.04000889200 = -0.25913899200

      kappa = -0.259138992, which is negative - below the polynomial's root at
      omega = -0.23338349942403008 - so the value is returned carrying
      OUT_OF_VALID_RANGE. A refusal would be wrong here: the arithmetic is well
      defined and the caller may be deliberately inspecting the limit, which is a
      thing this library's "warnings are not errors" rule exists to allow.
    inputs: { omega: -0.385 }
    expected: { kappa: -0.259138992 }
    tolerance: 1.0e-9

  - id: monotonic
    type: property
    property: monotonic
    status: active
  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: skipped
    skip_reason: >
      Both the input and the output are dimensionless, so there is no unit to
      convert and the round trip would assert that a dimensionless quantity
      survives conversion untouched - which `test_units_conversion.py` already
      asserts for the dimensionless entry in the vocabulary, once, rather than
      once per dimensionless calc. Declared rather than omitted so the omission is
      a recorded decision; the practice follows `crane_k_factors`, which skips this
      test for the same reason.
