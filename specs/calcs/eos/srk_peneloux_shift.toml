id = "eos.srk_peneloux_shift"
name = "Soave-Redlich-Kwong Peneloux volume-translation parameter"
equation = "c = 0.40768*(0.29441 - Z_RA)*R*Tc/Pc,  Z_RA = 0.29056 - 0.08775*omega"
latex = '''c = 0.40768\,\left(0.29441 - Z_{\mathrm{RA}}\right)\frac{R\,T_c}{P_c}, \qquad Z_{\mathrm{RA}} = 0.29056 - 0.08775\,\omega'''
assumptions = ["the acentric factor, critical temperature and critical pressure are those of the component intended. NOT CHECKED - this calc has no databank and no second source; all three come from the caller and are taken at face value.\n", "`Z_RA` is the Rackett compressibility from `Z_RA = 0.29056 - 0.08775*omega`. NeqSim defaults to it when a databank Rackett Z is absent, and this library ships no Rackett Z column, so the default is the whole correlation.\n", "`R` is the exact molar gas constant from the 2019 SI definition, not NeqSim's truncated `8.3144621` - the same value `eos.pr_molar_volume` uses, and the shift is subtracted from that calc's volume.\n", "the shift is a volume translation only: it corrects the reported molar volume and density and does not change phase equilibrium.\n", "applying the shift is the caller's step: `v_corr = v - sum_i x_i*c_i`, with `v` from `eos.pr_molar_volume` and the per-component shifts mixed linearly.\n"]
references = ["Péneloux, A.; Rauzy, E.; Fréze, R. (1982). \\\"A consistent correction for Redlich-Kwong-Soave volumes.\\\" Fluid Phase Equilibria 8(1), 7-23. DOI 10.1016/0378-3812(82)80002-2.", "Rackett, H. G. (1970). \\\"Equation of state for saturated liquids.\\\" J. Chem. Eng. Data 15(4), 514-517. DOI 10.1021/je60047a012."]
[source]
standard = "Péneloux, A.; Rauzy, E.; Fréze, R. (1982)"
edition = "A consistent correction for Redlich-Kwong-Soave volumes. Fluid Phase Equilibria, 8(1), 7-23"
doi = "10.1016/0378-3812(82)80002-2"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "Acentric factor of the pure component, as in `eos.srk_kappa`.\n"
[inputs.Tc]
unit = "K"
description = "Critical temperature of the pure component.\n"
[inputs.Pc]
unit = "Pa"
description = "Critical pressure of the pure component.\n"
[outputs]
[outputs.c]
unit = "m**3/mol"
description = "The volume-translation parameter. A property of the substance alone; `v_corr = v - c` where `v` is the untranslated molar volume.\n"
[[valid_range]]
quantity = "Tc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Tc` is a factor in the numerator, so a non-positive value would give a non-positive or reversed shift, and a critical temperature at or below zero is not a substance.\n"
[[valid_range]]
quantity = "Pc"
min = 0
min_inclusive = false
severity = "error"
rationale = "`Pc` is a divisor; zero pressure is not a critical point and a negative one is not a state.\n"
[worked_example]
source = "derived from the equation above"
derivation = "Propane-like, omega = 0.152, Tc = 369.83 K, Pc = 4.248e6 Pa:\n\n  Z_RA = 0.29056 - 0.08775*0.152 = 0.277222\n  0.29441 - Z_RA              = 0.017188\n  0.40768 * 0.017188          = 0.00700720384\n  R = 6.02214076e23 * 1.380649e-23 = 8.31446261815324 J/(mol*K)\n  R*Tc/Pc = 8.31446261815324 * 369.83 / 4.248e6 = 0.000723855393143035\n  c = 0.00700720384 * 0.000723855393143035 = 5.072202290436595e-06 m**3/mol\n\nThe shift is positive: this component's untranslated volume is too large, so `v_corr = v - c` shrinks it.\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.152
Tc = 369.83
Pc = 4248000.0
[worked_example.expected]
c = 5.072202290436595e-06
[implementations]
python = "azoth.eos.srk_peneloux_shift"
rust = "azoth_eos::srk_peneloux_shift"
[[tests]]
id = "propane_worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "methane_at_a_very_different_acentric_factor"
type = "reference"
status = "active"
source = "Derived from the equation above, at methane's acentric factor, omega = 0.01142, Tc = 190.56 K, Pc = 4.599e6 Pa:\n\n  Z_RA = 0.29056 - 0.08775*0.01142 = 0.289557895\n  0.29441 - Z_RA = 0.004852105\n  0.40768 * 0.004852105 = 0.0019781061664\n  R*Tc/Pc = 8.31446261815324 * 190.56 / 4.599e6 = 0.00034454321694427266\n  c = 0.0019781061664 * 0.00034454321694427266 = 6.814784334802521e-07 m**3/mol\n"
tolerance = 1e-12
[tests.inputs]
omega = 0.01142
Tc = 190.56
Pc = 4599000.0
[tests.expected]
c = 6.814784334802521e-07
