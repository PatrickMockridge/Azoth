id = "eos.de_waard_milliams_corrosion"
name = "De Waard-Milliams CO2, H2S and elemental-sulfur corrosion rate"
equation = "log10(V_cor) = 5.8 - 1710/T + 0.67 log10(pCO2)\n\nV = V_cor f_pH f_scale f_glycol f_flow (1 - IE) + V_sulfur\n\nf_pH = 10^(0.32(pH_sat - pH)) above pH_sat, else 1\npH_sat = 3.71 - 0.5 log10(pCO2) + 0.00133 T_C\nf_scale = 1 below 60 C; above 80 C with pH > 5, max(0.1, 1 - min(0.7, (T_C - 80) 0.01 (pH - 4)))\nf_glycol = 1 at zero, 0.05 above 0.8, else 1 - x\nf_flow = min(v^0.8, 5) above 1 m/s, else 1\nV_sulfur = S8 rate 1.74 / 7850\nV_FeS = min(exp(7.96 - 2320/T + 0.67 ln pH2S), 100) mm/yr"
latex = '''V = V_{\mathrm{cor}}\,f_{\mathrm{pH}}\,f_{\mathrm{scale}}\,f_{\mathrm{glycol}}\,f_{\mathrm{flow}}\,(1-\eta)\quad [\mathrm{mm/yr}]'''
assumptions = [
    "the class takes C, bar, kg/(m2 yr) and mm/yr; this calc takes kelvin, pascal, kg/(m2 s) and returns m/s over the class's 365.25-day year.\n",
    "**the baseline is de Waard-Milliams 1991**, `log10(V) = 5.8 - 1710/T_K + 0.67 log10(pCO2)` mm/yr, zero at or below a zero pCO2.\n",
    "**the pH correction is de Waard-Lotz**, `10^(0.32(pHsat - pH))` at or above the saturation pH and one below it; `pHsat = 3.71 - 0.5 log10(pCO2) + 0.00133 T_C`.\n",
    "**the scale correction** is one below 60 C; above 80 C and pH 5 it is `max(0.1, 1 - min(0.7, (T_C-80)*0.01*(pH-4)))`, whose 0.1 floor the 0.7 cap keeps out of reach.\n",
    "the glycol factor is one at zero, 0.05 above 0.8 and `1-x` between; the flow factor is one to 1 m/s and `min(v^0.8, 5)` above; the inhibitor factor is one minus the efficiency clamped to `[0, 1]`.\n",
    "**sulfur and H2S add to the CO2 rate**: sulfur as 1.74 kg Fe per kg S8 over steel's 7850 kg/m3, FeS as `min(exp(7.96 - 2320/T_K + 0.67 ln pH2S), 100)` mm/yr.\n",
    "the severity bands are NORSOK M-001 on the corrected CO2-plus-sulfur rate; the FeCO3 index and the morphology are the class's estimates; sour service is H2S above 0.003 bar.\n",
    "the class's total-pressure and pipe-diameter setters reach only its JSON and no arithmetic, and the three correction flags have no setters, so neither becomes an input.\n",
]
references = [
    "NeqSim master, `pvtsimulation/flowassurance/DeWaardMilliamsCorrosion.java`, Apache-2.0, commit f0c7436c6923766b1e22957b7075f650600457a7.",
    "`validation/neqsim/captures/flow_assurance_remainder_probe.tsv` - the thirty-one states: the four severity bands, both sides of the pH saturation, the scale and glycol and flow branches, both inhibitor clamps, the sulfur and FeS contributions and the FeS cap, and the four morphologies.",
    "NORSOK M-506 and NACE MR0175 / ISO 15156.",
]
[source]
standard = "NeqSim master `DeWaardMilliamsCorrosion`"
edition = "`calculateBaselineRate`, the four correction factors, `getSulfurCorrosionRate`, `getFeSCorrosionRate`, `getFeCO3SaturationIndex`, `getCorrosionSeverity`, `getFeSScaleMorphology` and `estimateCorrosionAllowance`. The comprehensive map, the temperature sweep and the Gson report are compositions."
[inputs]
[inputs.temperature]
unit = "K"
description = "the operating temperature.\n"
[inputs.co2_partial_pressure]
unit = "Pa"
description = "the CO2 partial pressure, zero when no CO2 is present.\n"
[inputs.ph]
unit = "dimensionless"
description = "the aqueous phase's pH.\n"
[inputs.h2s_partial_pressure]
unit = "Pa"
description = "the H2S partial pressure, zero for a sweet service.\n"
[inputs.flow_velocity]
unit = "m/s"
description = "the bulk flow velocity.\n"
[inputs.inhibitor_efficiency]
unit = "dimensionless"
description = "the film-forming inhibitor efficiency, clamped to 0..1.\n"
[inputs.glycol_fraction]
unit = "dimensionless"
description = "the glycol weight fraction in the aqueous phase, clamped to 0..1.\n"
[inputs.sulfur_deposition_rate]
unit = "kg/(m**2*s)"
description = "the elemental-sulfur deposition rate on the wall.\n"
[inputs.design_life]
unit = "s"
description = "the exposure time the corrosion allowance is scaled by.\n"
[outputs]
[outputs.baseline_rate]
unit = "m/s"
description = "the uncorrected de Waard-Milliams 1991 rate.\n"
[outputs.ph_correction_factor]
unit = "dimensionless"
description = "the de Waard-Lotz pH factor, at most one where the film protects.\n"
[outputs.scale_correction_factor]
unit = "dimensionless"
description = "the protective-scale factor above 80 C and pH 5.\n"
[outputs.glycol_correction_factor]
unit = "dimensionless"
description = "the glycol factor on the aqueous phase's water activity.\n"
[outputs.flow_correction_factor]
unit = "dimensionless"
description = "the mass-transfer factor above 1 m/s, capped at five.\n"
[outputs.inhibitor_factor]
unit = "dimensionless"
description = "one minus the clamped inhibitor efficiency.\n"
[outputs.corrected_rate]
unit = "m/s"
description = "the CO2 rate with every factor and the sulfur contribution.\n"
[outputs.sulfur_rate]
unit = "m/s"
description = "the elemental-sulfur contribution.\n"
[outputs.fes_rate]
unit = "m/s"
description = "the H2S/FeS contribution, capped at 100 mm/yr.\n"
[outputs.co2_corrected_rate]
unit = "m/s"
description = "the corrected rate less the sulfur contribution.\n"
[outputs.total_corrosion_rate]
unit = "m/s"
description = "the corrected rate plus the FeS contribution.\n"
[outputs.feco3_saturation_index]
unit = "dimensionless"
description = "the FeCO3 saturation index, above one where scale forms.\n"
[outputs.feco3_scale_forming]
type = "boolean"
description = "whether the FeCO3 index exceeds one.\n"
[outputs.is_sour_service]
type = "boolean"
description = "NACE MR0175 sour service: H2S above 0.003 bar.\n"
[outputs.corrosion_severity]
type = "enum"
values = ["low", "medium", "high", "very_high"]
description = "the NORSOK M-001 severity band.\n"
[outputs.fes_morphology]
type = "enum"
values = ["none", "mackinawite", "cubic_fes_troilite", "pyrrhotite"]
description = "the FeS morphology and protectiveness the temperature band predicts.\n"
[outputs.corrosion_allowance]
unit = "m"
description = "the corrected rate times the design life.\n"
[[valid_range]]
quantity = "temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute temperature; zero and below are not states.\n"
[[valid_range]]
quantity = "co2_partial_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "A partial pressure cannot be negative; zero is the class's own no-CO2 guard.\n"
[[valid_range]]
quantity = "h2s_partial_pressure"
min = 0
min_inclusive = true
severity = "error"
rationale = "A partial pressure cannot be negative; zero is a sweet service.\n"
[[valid_range]]
quantity = "flow_velocity"
min = 0
min_inclusive = true
severity = "error"
rationale = "The correlation is written for the magnitude of a flowing bulk velocity.\n"
[[valid_range]]
quantity = "design_life"
min = 0
min_inclusive = true
severity = "error"
rationale = "A design life is a duration, not a signed quantity.\n"
[worked_example]
source = "the capture's `default` row"
derivation = "The class's own default state: 60 C, 2 bar CO2, pH 4.5, 2 m/s, no inhibitor, glycol or sulfur, over a 25-year life.\n\n  T_K = 333.15, pHsat = 3.71 - 0.5 log10(2) + 0.00133*60 = 3.6395\n  f_pH = 10^(0.32*(3.6395 - 4.5)) = 0.53036\n  baseline = 10^(5.8 - 1710/333.15 + 0.67 log10(2)) = 7.3938 mm/yr\n  f_flow = 2^0.8 = 1.74110\n  corrected = 7.3938 * 0.53036 * 1.74110 = 6.8275 mm/yr\n  FeCO3 index = 10^(2*(4.5-7) + log10(2) - (-10.5 + 2000/333.15)) = 0.62767\n  allowance = 6.8275 mm/yr * 25 yr = 0.17069 m\n"
tolerance = 1e-09
