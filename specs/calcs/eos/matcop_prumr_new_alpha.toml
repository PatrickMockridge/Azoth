id = "eos.matcop_prumr_new_alpha"
name = "Five-parameter Mathias-Copeman alpha function, UMR-PR new variant"
equation = "alpha = (1 + mc1*u + mc2*u**2 + mc3*u**3 + mc4*u**4 + mc5*u**5)**2 with u = 1 - sqrt(Tr), falling back to the standard PR form (1 + m*(1 - sqrt(Tr)))**2 with m = 0.384401 + 1.52276*omega - 0.213808*omega**2 + 0.034616*omega**3 - 0.001976*omega**4 when mc1 < 1e-20"
latex = '''\alpha = \begin{cases} \left(1 + m(1 - \sqrt{T_r})\right)^2 & c_1 < 10^{-20} \\ \left(1 + c_1 u + c_2 u^2 + c_3 u^3 + c_4 u^4 + c_5 u^5\right)^2 & \text{otherwise} \end{cases}, \quad u = 1 - \sqrt{T_r}, \quad m = 0.384401 + 1.52276\omega - 0.213808\omega^2 + 0.034616\omega^3 - 0.001976\omega^4'''
assumptions = ["the five Mathias-Copeman coefficients are the caller's fitted parameters, not derived.\n", "when the first coefficient is below 1e-20 the alpha falls back to the standard Peng-Robinson form; the supercritical fallback is disabled (``useStandardAlphaForSupercritical = false`` in NeqSim).\n", "the fallback ``m`` is the UMR-PR kappa, a fourth-order fit in the acentric factor, unlike `matcop5_prumr_alpha` whose fallback uses the standard Peng-Robinson kappa.\n"]
references = ["Tasios, I.; et al. (2025). Fluid Phase Equilib. DOI 10.1016/j.fluid.2024.114241 - the five-parameter form for non-self-associating compounds in UMR-CPA.", "Mathias, P. M.; Copeman, T. W. (1983). \"Extension of the Peng-Robinson equation of state to complex mixtures: evaluation of the various forms of the local composition concept.\" Fluid Phase Equilib. 13, 91-108. DOI 10.1016/0378-3812(83)80084-3."]
[source]
standard = "NeqSim 3.20.0 `AtractiveTermMatCopPRUMRNew`"
edition = "`alpha(temperature)`, ported verbatim"
doi = "10.1016/j.fluid.2024.114241"
[inputs]
[inputs.omega]
unit = "dimensionless"
description = "the acentric factor, used only for the fallback\n"
[inputs.mc1]
unit = "dimensionless"
description = "the first Mathias-Copeman coefficient\n"
[inputs.mc2]
unit = "dimensionless"
description = "the second Mathias-Copeman coefficient\n"
[inputs.mc3]
unit = "dimensionless"
description = "the third Mathias-Copeman coefficient\n"
[inputs.mc4]
unit = "dimensionless"
description = "the fourth Mathias-Copeman coefficient\n"
[inputs.mc5]
unit = "dimensionless"
description = "the fifth Mathias-Copeman coefficient\n"
[inputs.Tr]
unit = "dimensionless"
description = "the reduced temperature\n"
[outputs]
[outputs.alpha]
unit = "dimensionless"
description = "the temperature-dependent alpha function\n"
[[valid_range]]
quantity = "Tr"
min = 0
min_inclusive = false
severity = "error"
rationale = "the formula takes a square root of `Tr`; zero and below are not states\n"
[worked_example]
source = "derived from the equation above"
derivation = "omega = 0.1, mc1 = 0.5, mc2 = 0.2, mc3 = -0.1, mc4 = 0.05, mc5 = 0.01, Tr = 0.7:\n\n  u = 1 - sqrt(0.7) = 0.16333997346592444\n  u**2 = 0.0266799469318489\n  u**3 = 0.004357901823920471\n  u**4 = 0.0007118195682862735\n  u**5 = 0.0001162685893964057\n  inner = 1 + 0.5*0.16333997346592444 + 0.2*0.0266799469318489 - 0.1*0.004357901823920471 + 0.05*0.0007118195682862735 + 0.01*0.0001162685893964057 = 1.086606939601248\n  alpha = 1.086606939601248**2 = 1.1807146411895904\n"
tolerance = 1e-12
[worked_example.inputs]
omega = 0.1
mc1 = 0.5
mc2 = 0.2
mc3 = -0.1
mc4 = 0.05
mc5 = 0.01
Tr = 0.7
[worked_example.expected]
alpha = 1.1807146411895904
[implementations]
python = "azoth.eos.matcop_prumr_new_alpha"
rust = "azoth_eos::matcop_prumr_new_alpha"
[[tests]]
id = "worked_example"
type = "worked_example"
status = "active"
[[tests]]
id = "zero_first_coefficient_falls_back_to_pr"
type = "reference"
status = "active"
source = "With mc1 = 0 the alpha falls back to the standard Peng-Robinson form with the UMR-PR kappa, m = 0.384401 + 1.52276*0.1 - 0.213808*0.01 + 0.034616*0.001 - 0.001976*0.0001 = 0.5345733384:\n\n  1 - sqrt(0.7) = 0.16333997346592444\n  alpha = (1 + 0.5345733384*0.16333997346592444)**2 = 1.1822586823466172\n"
tolerance = 1e-12
[tests.inputs]
omega = 0.1
mc1 = 0.0
mc2 = 0.0
mc3 = 0.0
mc4 = 0.0
mc5 = 0.0
Tr = 0.7
[tests.expected]
alpha = 1.1822586823466172
