id = "eos.firozabadi_ramley_interface_tension"
name = "Interface tension from the Firoozabadi-Ramey correlation"
equation = "sigma = (a1 * (|rho_2 - rho_1|/1000)**(b1 + 1) / (T/Tc_pseudo)**0.3125)**4 / 1000, where (a1, b1) is 2.2062/-0.94716 for |rho_2 - rho_1|/1000 below 0.2, 2.915/-0.76852 below 0.5, and 3.3858/-0.62590 otherwise."
latex = '''\sigma = 10^{-3}\left[\frac{a_1}{T_r^{0.3125}}\left(\frac{|\rho_2-\rho_1|}{1000}\right)^{b_1+1}\right]^4'''
assumptions = ["`Tc_pseudo` is the **first** phase's pseudo-critical temperature, `sum(x_i Tc_i)` over that phase's composition; NeqSim takes it from the first argument of `calcSurfaceTension`, so a caller that supplies the second phase's answers a different `Tr`.\n", "the two densities are mass densities in kg/m**3; the division by `1000` puts their difference in the g/cm**3-like unit the fitted constants were published against.\n", "the correlation is the class's `calcSurfaceTension`, not its `calcPureComponentSurfaceTension` (a Macleod-Sugden pure-component form the mixture path does not call).\n", "the class answers 0.0 when the system has fewer than two phases; this calculation's inputs are two states, so that guard has no input here.\n"]
references = ["Firoozabadi, A.; Ramey, H. J. (1988). \"Surface tension of water-hydrocarbon systems at reservoir conditions.\" Journal of Canadian Petroleum Technology 27(3), 41-48. DOI 10.2118/88-03-03. The NeqSim class spells the second author \"Ramley\".", "NeqSim master, `physicalproperties/interfaceproperties/surfacetension/FirozabadiRamleyInterfaceTension.java`, Apache-2.0, commit f0c7436c6923766b1e22957b7075f650600457a7."]
[source]
standard = "NeqSim master `FirozabadiRamleyInterfaceTension`"
edition = "`calcSurfaceTension`, ported verbatim: the piecewise corresponding-states form over the density difference and the first phase's pseudo-critical temperature."
doi = "10.2118/88-03-03"
[inputs]
[inputs.T]
unit = "K"
description = "Absolute temperature at the interface.\n"
[inputs.pseudo_critical_temperature]
unit = "K"
description = "The first phase's pseudo-critical temperature, `sum(x_i Tc_i)` over its composition.\n"
[inputs.rho_1]
unit = "kg/m**3"
description = "Mass density of the first phase.\n"
[inputs.rho_2]
unit = "kg/m**3"
description = "Mass density of the second phase.\n"
[outputs]
[outputs.sigma]
unit = "N/m"
description = "The interfacial tension.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "The reduced temperature divides by `Tc_pseudo` and takes `T`; a non-positive absolute temperature is not a state.\n"
[[valid_range]]
quantity = "pseudo_critical_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "It is the denominator of `Tr`; a non-positive value is not a mixture's critical temperature.\n"
[[valid_range]]
quantity = "rho_1"
min = 0
min_inclusive = false
severity = "error"
rationale = "A phase with no mass density has no interface.\n"
[[valid_range]]
quantity = "rho_2"
min = 0
min_inclusive = false
severity = "error"
rationale = "A phase with no mass density has no interface.\n"
[worked_example]
source = "the capture's `nheptane_water_300K_1bara` row, where the oil phase is first and the aqueous phase second:\n\n  rho_1 = 690.6031246582897 kg/m**3, rho_2 = 1000.0024520207028 kg/m**3, T = 300 K\n  Tc_pseudo = 540.2432308699056 K (phase 1: x = n-heptane 0.9995963504210497, water 4.0364957895032145e-4)\n"
derivation = "  delta = |1000.0024520207028 - 690.6031246582897| = 309.39932736241303 kg/m**3\n  x = delta/1000 = 0.30939932736241305, so 0.2 <= x < 0.5: a1 = 2.915, b1 = -0.76852\n  Tr = 300 / 540.2432308699056 = 0.5553054306981999\n  temp1 = 2.915 * 0.30939932736241305**0.23148 / 0.5553054306981999**0.3125 = 2.6701628945887625\n  sigma = temp1**4 / 1000 = 0.05083361859364053 N/m\n"
tolerance = 1e-12
[worked_example.inputs]
T = 300.0
pseudo_critical_temperature = 540.2432308699056
rho_1 = 690.6031246582897
rho_2 = 1000.0024520207028
[worked_example.expected]
sigma = 0.05083361859364053
