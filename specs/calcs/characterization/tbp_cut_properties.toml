pc = 1196293.59599742
boiling_temperature = 746.89
acentric_factor = 1.36586663262266
attraction_exponent = 2.228110216
watson_k = 12.5418146375894
[[tests]]
id = "pedersen_srk_heavy_oil_is_a_no_op"
type = "reference"
status = "active"
source = "The capture's `PedersenSRKHeavyOil` cut[4]. The class shadows its parent's coefficient fields, so it must give `PedersenSRK`'s numbers exactly rather than the heavy set's. The case would fail if a port 'fixed' the shadowing.\n"
tolerance = 1e-12
[tests.inputs]
model = "pedersen_srk_heavy_oil"
molar_mass = 0.5
density = 880.0
[tests.expected]
tc = 891.945256085426
pc = 1196293.59599742
boiling_temperature = 746.89
acentric_factor = 1.36586663262266
attraction_exponent = 2.228110216
watson_k = 12.5418146375894
[[tests]]
id = "riazi_daubert_switches_to_its_parent_above_mw_300"
type = "reference"
status = "active"
source = "The capture's `RiaziDaubert` cut[3] is at exactly `M = 300` g/mol and takes the **Riazi-Daubert** pair, because the test is `M > 300` and 300 is not greater; its cut[4] at `M = 500` falls back to `PedersenSRK`'s `tc` and `pc` and still uses its own boiling point. A port that read the threshold as `>=` would agree at cut[4] and differ at cut[3].\n"
tolerance = 1e-12
[tests.inputs]
model = "riazi_daubert"
molar_mass = 0.3
density = 850.0
[tests.expected]
tc = 815.802701858322
pc = 1081341.69675997
boiling_temperature = 644.547792011568
acentric_factor = 0.697599640892113
watson_k = 12.3620439797047
[[tests]]
id = "cavett_applies_its_api_correction_below_30"
type = "reference"
status = "active"
source = "The capture's `Cavett` cut[4]: `d = 0.88` gives API `141.5/0.88 - 131.5 = 29.295`, below 30, so both corrections apply. At cut[3], `d = 0.85` gives API 34.9 and neither does.\n"
tolerance = 1e-12
[tests.inputs]
model = "cavett"
molar_mass = 0.5
density = 880.0
[tests.expected]
tc = 894.305850190858
pc = 735341.797507176
boiling_temperature = 765.014651094374
acentric_factor = 1.18279252714060
watson_k = 12.6424549207867
[[tests]]
id = "standing_is_riazi_daubert_without_the_switch"
type = "reference"
status = "active"
source = "The capture's `Standing` cut[4]. It uses the Riazi-Daubert pair at every molar mass, where `RiaziDaubert` itself falls back above 300 g/mol, so the two agree at cut[3] and must differ at cut[4] - `tc = 942.447643628006` against `891.945256085426`.\n"
tolerance = 1e-12
[tests.inputs]
model = "standing"
molar_mass = 0.5
density = 880.0
[tests.expected]
tc = 942.447643628006
pc = 522599.858109319
boiling_temperature = 785.228404434496
acentric_factor = 1.21363914242666
watson_k = 12.752837620579
[[tests]]
