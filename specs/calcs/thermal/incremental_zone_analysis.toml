id = "thermal.incremental_zone_analysis"
name = "A shell-and-tube exchanger's incremental zone analysis"
equation = "h_tube = Shah(q) | Gungor-Winterton(q) | Nu*k/d_i; h_shell = Kern; 1/U = 1/h_shell + R_f,s + d_o*ln(d_o/d_i)/(2*k_w) + (d_o/d_i)*R_f,t + (d_o/d_i)/h_tube; LMTD from the four zone temperatures; A = Q/(U*LMTD)"
latex = '''\frac{1}{U} = \frac{1}{h_o} + R_{f,o} + \frac{d_o \ln(d_o/d_i)}{2 k_w} + \frac{d_o}{d_i} R_{f,i} + \frac{d_o}{d_i h_i}'''
assumptions = [
    "**`target_zone_count` is not an input**: the constructor clamps it to at least three and stores it, but `calculate()` reads the zone list's size; the probe pins identical results at 3, 20 and 100.\n",
    "**the tube side dispatches on the regime**: `CONDENSING` is Shah's liquid-only coefficient averaged over the quality range, `EVAPORATING` is Gungor-Winterton averaged, and every other regime - `TWO_PHASE` included - is the single-phase path.\n",
    "**the shell side is always Kern and ignores `shell_phase_regime`**, which is carried and read by nothing. The wall viscosity is the bulk viscosity.\n",
    "**the evaporating heat flux is `duty/(tube_count*pi*tube_id*tube_length/n_zones)`**, zero when the tube count or the bore is not positive.\n",
    "**the zone LMTD falls back to `max(|dt1|,|dt2|)` when either endpoint difference is not positive, and to their mean when the two differ by less than 0.01 K.**\n",
    "**the weighted average U is `sum(U*A)/sum(A)` and the minimum approach is the smaller absolute hot-cold endpoint difference in any zone**, `f64::MAX` with no zones.\n",
    "**the shell drop's baffle count is `max(1, round(tube_length/baffle_spacing/n_zones))`**; the tube length is divided equally between the zones, so the summed single-phase tube drop does not move with the zone count while the shell drop does.\n",
    "**a zero or non-positive flow is refused by the port.** The class answers it: a zero tube flow gives the laminar `32.08` W/(m**2 K) and U `24.59`, which is a coefficient, not an answer this port publishes.\n",
    "**omitted two-phase fields take the `IncrementalZone` defaults**: liquid 800 kg/m**3, 5e-4 Pa s, 2500 J/(kg K), 0.13 W/(m K); vapour 5 kg/m**3, 1e-5 Pa s; quality 0.9 to 0.7; reduced pressure 0.1; surface tension 0.01 N/m; latent heat 200 kJ/kg.\n",
]
references = [
    "Shah, M.M. (1979). \"A general correlation for heat transfer during film condensation inside pipes.\" Int. J. Heat Mass Transfer 22(4), 547-556. The condensing coefficient.",
    "Gungor, K.E.; Winterton, R.H.S. (1986). \"A general correlation for flow boiling in tubes and annuli.\" Int. J. Heat Mass Transfer 29(3), 351-358. The evaporating coefficient.",
    "Friedel, L. (1979). \"Improved friction pressure drop correlations for horizontal and vertical two-phase pipe flow.\" European Two-Phase Flow Group Meeting. The two-phase pressure drop.",
    "Kern, D.Q. (1950). Process Heat Transfer. McGraw-Hill. The shell-side coefficient and pressure drop.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/IncrementalZoneAnalysis.java` is the port source, with the correlations in `ShahCondensation`, `BoilingHeatTransfer`, `TwoPhasePressureDrop` and `BellDelawareMethod`.",
    "`validation/neqsim/captures/incremental_zone_analysis_probe.tsv` - the class driven on one liquid zone, a liquid/vapour pair, the phase cycle, a `TWO_PHASE` tube regime, the LMTD branches, a single-point quality range, zero flow, no zones, the target counts and the baffle scaling.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/IncrementalZoneAnalysis.java"
edition = "`calculate()` with `calcTubeSideHTC`, `calcShellSideHTC`, `calcSinglePhaseHTC`, `calcOverallU`, `calcZoneLMTD`, `calcTubeSideMassFlux`, both zone pressure drops and the totals; the correlations are `ShahCondensation`, `BoilingHeatTransfer`, `TwoPhasePressureDrop` and `BellDelawareMethod`'s."
[inputs]
[inputs.tube_inside_diameter]
unit = "m"
description = "the tube inside diameter. NeqSim's default is `0.01483` m.\n"
[inputs.tube_outside_diameter]
unit = "m"
description = "the tube outside diameter. NeqSim's default is `0.01905` m.\n"
[inputs.tube_length]
unit = "m"
description = "the tube length, divided equally between the zones for the pressure drops. NeqSim's default is `6.096` m.\n"
[inputs.tube_count]
unit = "dimensionless"
description = "the tube count; a pass's flow area is `tube_count / tube_passes` tubes. NeqSim's default is `100`.\n"
[inputs.tube_passes]
unit = "dimensionless"
description = "the tube passes. NeqSim's default is `2`.\n"
[inputs.shell_inside_diameter]
unit = "m"
description = "the shell inside diameter. NeqSim's default is `0.5` m.\n"
[inputs.baffle_spacing]
unit = "m"
description = "the baffle spacing, which the shell-side drop's per-zone baffle count divides. NeqSim's default is `0.2` m.\n"
[inputs.tube_pitch]
unit = "m"
description = "the tube pitch. NeqSim's default is `0.02381` m.\n"
[inputs.triangular_pitch]
type = "boolean"
description = "the tube layout: `true` is triangular. NeqSim's default is `true`.\n"
[inputs.tube_wall_conductivity]
unit = "W/(m*K)"
description = "the tube-wall thermal conductivity. NeqSim's default is `52` W/(m*K).\n"
[inputs.fouling_tube]
unit = "dimensionless"
description = "the tube-side fouling resistance in m**2*K/W, declared dimensionless because no vocabulary unit expresses it. NeqSim's default is `0.000176`.\n"
[inputs.fouling_shell]
unit = "dimensionless"
description = "the shell-side fouling resistance in m**2*K/W, likewise. NeqSim's default is `0.000176`.\n"
[inputs.zones]
type = "record_list"
row_type = "IncrementalZoneInput"
description = "the zones, in the caller's order; the class neither reorders nor subdivides them.\n"
[inputs.zones.fields]
[inputs.zones.fields.zone_name]
type = "string"
description = "the zone's name, echoed.\n"
[inputs.zones.fields.duty]
unit = "W"
description = "the zone's duty, which its area and the evaporating heat flux divide.\n"
[inputs.zones.fields.hot_inlet_temp]
unit = "K"
description = "the zone's hot-side inlet temperature.\n"
[inputs.zones.fields.hot_outlet_temp]
unit = "K"
description = "the zone's hot-side outlet temperature.\n"
[inputs.zones.fields.cold_inlet_temp]
unit = "K"
description = "the zone's cold-side inlet temperature.\n"
[inputs.zones.fields.cold_outlet_temp]
unit = "K"
description = "the zone's cold-side outlet temperature.\n"
[inputs.zones.fields.tube_phase_regime]
type = "enum"
values = ["vapor", "liquid", "condensing", "evaporating", "two_phase"]
description = "the tube-side regime, which selects the coefficient: condensing and evaporating are the two-phase correlations, everything else is single-phase.\n"
[inputs.zones.fields.tube_density]
unit = "kg/m**3"
description = "the tube-side bulk density, read by the single-phase coefficient and drop. Default `800`.\n"
[inputs.zones.fields.tube_viscosity]
unit = "Pa*s"
description = "the tube-side bulk viscosity. Default `5e-4` Pa*s.\n"
[inputs.zones.fields.tube_cp]
unit = "J/(kg*K)"
description = "the tube-side specific heat capacity. Default `2500` J/(kg*K).\n"
[inputs.zones.fields.tube_conductivity]
unit = "W/(m*K)"
description = "the tube-side thermal conductivity. Default `0.13` W/(m*K).\n"
[inputs.zones.fields.tube_mass_flow]
unit = "kg/s"
description = "the tube-side mass flow, which the mass flux divides. Default `10` kg/s.\n"
[inputs.zones.fields.shell_phase_regime]
type = "enum"
values = ["vapor", "liquid", "condensing", "evaporating", "two_phase"]
description = "the shell-side regime; carried and read by nothing, because the shell side is always Kern.\n"
[inputs.zones.fields.shell_density]
unit = "kg/m**3"
description = "the shell-side density. Default `1000` kg/m**3.\n"
[inputs.zones.fields.shell_viscosity]
unit = "Pa*s"
description = "the shell-side viscosity. Default `8e-4` Pa*s.\n"
[inputs.zones.fields.shell_cp]
unit = "J/(kg*K)"
description = "the shell-side specific heat capacity. Default `4180` J/(kg*K).\n"
[inputs.zones.fields.shell_conductivity]
unit = "W/(m*K)"
description = "the shell-side thermal conductivity. Default `0.6` W/(m*K).\n"
[inputs.zones.fields.shell_mass_flow]
unit = "kg/s"
description = "the shell-side mass flow. Default `20` kg/s.\n"
[inputs.zones.fields.tube_liquid_density]
unit = "kg/m**3"
optional = true
description = "the tube-side liquid density for Shah and Gungor-Winterton. Absent is `800` kg/m**3.\n"
[inputs.zones.fields.tube_vapor_density]
unit = "kg/m**3"
optional = true
description = "the tube-side vapour density for Friedel and Gungor-Winterton. Absent is `5` kg/m**3.\n"
[inputs.zones.fields.tube_liquid_viscosity]
unit = "Pa*s"
optional = true
description = "the tube-side liquid viscosity. Absent is `5e-4` Pa*s.\n"
[inputs.zones.fields.tube_vapor_viscosity]
unit = "Pa*s"
optional = true
description = "the tube-side vapour viscosity. Absent is `1e-5` Pa*s.\n"
[inputs.zones.fields.tube_liquid_cp]
unit = "J/(kg*K)"
optional = true
description = "the tube-side liquid specific heat capacity. Absent is `2500` J/(kg*K).\n"
[inputs.zones.fields.tube_liquid_conductivity]
unit = "W/(m*K)"
optional = true
description = "the tube-side liquid thermal conductivity. Absent is `0.13` W/(m*K).\n"
[inputs.zones.fields.tube_quality_in]
unit = "dimensionless"
optional = true
description = "the zone's inlet vapour quality. Absent is `0.9`.\n"
[inputs.zones.fields.tube_quality_out]
unit = "dimensionless"
optional = true
description = "the zone's outlet vapour quality. Absent is `0.7`.\n"
[inputs.zones.fields.tube_reduced_pressure]
unit = "dimensionless"
optional = true
description = "the reduced pressure `P/Pc` for the Shah correlation. Absent is `0.1`.\n"
[inputs.zones.fields.tube_surface_tension]
unit = "N/m"
optional = true
description = "the tube-side surface tension for Friedel. Absent is `0.01` N/m.\n"
[inputs.zones.fields.tube_heat_of_vaporization]
unit = "dimensionless"
optional = true
description = "the latent heat in J/kg, declared dimensionless because no vocabulary unit expresses it. Absent is `200000`.\n"
[outputs]
[outputs.number_of_zones]
unit = "dimensionless"
description = "the number of zones rated.\n"
[outputs.total_required_area]
unit = "m**2"
description = "the sum of the zone areas `duty/(U*LMTD)`.\n"
[outputs.total_duty]
unit = "W"
description = "the sum of the zone duties.\n"
[outputs.weighted_average_u]
unit = "W/(m**2*K)"
description = "`sum(U*A)/sum(A)`, or zero with no area.\n"
[outputs.total_tube_side_pressure_drop]
unit = "Pa"
description = "the sum of the zone tube-side drops.\n"
[outputs.total_shell_side_pressure_drop]
unit = "Pa"
description = "the sum of the zone shell-side drops.\n"
[outputs.minimum_approach_temperature]
unit = "K"
description = "the smallest absolute hot-cold endpoint difference in any zone; `f64::MAX` with no zones.\n"
[outputs.zones]
type = "record_list"
description = "one row per zone, in the input order.\n"
[outputs.zones.fields]
[outputs.zones.fields.zone_index]
unit = "dimensionless"
description = "the one-based position in the caller's list.\n"
[outputs.zones.fields.zone_name]
type = "string"
description = "the zone's name, echoed.\n"
[outputs.zones.fields.tube_phase_regime]
type = "string"
description = "the tube regime's class spelling.\n"
[outputs.zones.fields.shell_phase_regime]
type = "string"
description = "the shell regime's class spelling, carried and unread.\n"
[outputs.zones.fields.tube_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the zone's tube-side coefficient.\n"
[outputs.zones.fields.shell_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the zone's Kern shell-side coefficient.\n"
[outputs.zones.fields.overall_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the zone's overall coefficient on the outside area.\n"
[outputs.zones.fields.lmtd]
unit = "K"
description = "the zone's LMTD, from the class's three branches.\n"
[outputs.zones.fields.duty]
unit = "W"
description = "the zone's duty, echoed.\n"
[outputs.zones.fields.required_area]
unit = "m**2"
description = "`duty/(U*LMTD)`, zero when either denominator is not positive.\n"
[outputs.zones.fields.tube_side_pressure_drop]
unit = "Pa"
description = "the zone's tube-side drop: Friedel for the two-phase regimes, Darcy friction otherwise.\n"
[outputs.zones.fields.shell_side_pressure_drop]
unit = "Pa"
description = "the zone's Kern shell-side drop with the scaled baffle count.\n"
[outputs.zones.fields.hot_inlet_temp]
unit = "K"
description = "the zone's hot-side inlet temperature, echoed.\n"
[outputs.zones.fields.hot_outlet_temp]
unit = "K"
description = "the zone's hot-side outlet temperature, echoed.\n"
[outputs.zones.fields.cold_inlet_temp]
unit = "K"
description = "the zone's cold-side inlet temperature, echoed.\n"
[outputs.zones.fields.cold_outlet_temp]
unit = "K"
description = "the zone's cold-side outlet temperature, echoed.\n"
[[valid_range]]
quantity = "tube_inside_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the bore divides the mass flux and the coefficient."
[[valid_range]]
quantity = "tube_outside_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the outside diameter sets the resistance ratio and the shell geometry."
[[valid_range]]
quantity = "tube_length"
min = 0
min_inclusive = false
severity = "error"
rationale = "the length divides the per-zone drop."
[[valid_range]]
quantity = "tube_count"
min = 1
severity = "error"
rationale = "a tube count is a positive whole number."
[[valid_range]]
quantity = "tube_passes"
min = 1
severity = "error"
rationale = "the passes divide the tube count for the flow area."
[[valid_range]]
quantity = "shell_inside_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the shell diameter drives the crossflow area."
[[valid_range]]
quantity = "baffle_spacing"
min = 0
min_inclusive = false
severity = "error"
rationale = "the spacing divides the per-zone baffle count."
[[valid_range]]
quantity = "tube_pitch"
min = 0
min_inclusive = false
severity = "error"
rationale = "the pitch drives the shell geometry."
[[valid_range]]
quantity = "tube_wall_conductivity"
min = 0
min_inclusive = false
severity = "error"
rationale = "the wall resistance is a logarithm over this conductivity."
[[valid_range]]
quantity = "fouling_tube"
min = 0
severity = "error"
rationale = "a fouling resistance cannot be negative."
[[valid_range]]
quantity = "fouling_shell"
min = 0
severity = "error"
rationale = "a fouling resistance cannot be negative."
[worked_example]
source = "the capture's `single_liquid_default` row at NeqSim f0c7436c: one liquid zone on the class's default geometry."
derivation = "The tube-side mass flux is 10/(pi/4*0.01483**2*50) = 1157.4 kg/(m**2 s); Re is 34342.27 and the Gnielinski coefficient is 2353.2086219276475 W/(m**2 K), the same as the rating's default. The shell side is Kern with the liquid properties: h_shell = 5663.977997811559. With 1/U = 1/h_shell + 0.000176 + d_o ln(d_o/d_i)/(2*52) + (d_o/d_i)*0.000176 + (d_o/d_i)/h_tube the answer is 854.4225155154656, and 150000/(854.4225155154656*80) = 2.1944646424361007 m**2.\n"
tolerance = 1e-9
[worked_example.inputs]
tube_inside_diameter = 0.01483
tube_outside_diameter = 0.01905
tube_length = 6.096
tube_count = 100
tube_passes = 2
shell_inside_diameter = 0.5
baffle_spacing = 0.2
tube_pitch = 0.02381
triangular_pitch = true
tube_wall_conductivity = 52.0
fouling_tube = 0.000176
fouling_shell = 0.000176
zones = [{ zone_name = "liquid", duty = 150000.0, hot_inlet_temp = 400.0, hot_outlet_temp = 380.0, cold_inlet_temp = 300.0, cold_outlet_temp = 320.0, tube_phase_regime = "liquid", tube_density = 800.0, tube_viscosity = 5e-4, tube_cp = 2500.0, tube_conductivity = 0.13, tube_mass_flow = 10.0, shell_phase_regime = "liquid", shell_density = 998.0, shell_viscosity = 0.001, shell_cp = 4180.0, shell_conductivity = 0.60, shell_mass_flow = 20.0 }]
[worked_example.expected]
