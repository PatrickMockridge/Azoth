id = "thermal.tube_insert_model"
name = "Tube-insert heat-transfer enhancement and pressure-drop penalty"
equation = "h_ratio = h_enhanced/h_plain; f_ratio = f_enhanced/f_plain; PEC = h_ratio/f_ratio**(1/3); h_enhanced = h_plain*h_ratio; dP_enhanced = dP_plain*f_ratio"
latex = '''\mathrm{PEC} = \frac{h_{enh}/h_{plain}}{\left(f_{enh}/f_{plain}\right)^{1/3}}'''
assumptions = [
    "**the twisted tape's twist ratio is floored at `2`**, so a ratio of one answers the ratio-of-two enhancement; the tape thickness **cancels** in the blockage factor because the class writes `t/(t/0.05)`, which is `0.05` for any non-zero thickness.\n",
    "**the blockage factor is `pi/(pi - 4 t w/(t/0.05))` clamped to `[1, 1.5]`** and feeds both the laminar and the turbulent branches of the tape correlations.\n",
    "**the tape's laminar branches read neither Reynolds nor Prandtl number**, being `(1 + 0.769/y)**(1/3)` times the blockage and `(1 + 2.75/y)` times its `1.29` power.\n",
    "**the tape's turbulent heat ratio is `(1 + 2/y) blockage**0.8 / swirl**0.2`** and its friction `(1 + 2.75/y) swirl**0.8`**, with `swirl = sqrt(1 + (pi/(2y))**2)` and both floored at one.\n",
    "**a Reynolds number exactly at a boundary takes the upper branch**: the tape and wire matrix switch at `2300` with a strict `<`, and the wire matrix switches at `500` likewise.\n",
    "**the wire matrix's `effectiveRe = Re (1 + 3 density)` is computed and unread**, and its laminar friction is `1.5 (1 + 8 density)` independent of Reynolds number.\n",
    "**the coiled wire's coil pitch cancels against itself** (`p/(p/e)` is the roughness ratio for any non-zero pitch) and its laminar branches answer `1 + 10 e` for both ratios, reading neither Reynolds nor Prandtl number.\n",
    "**the coiled wire's turbulent correlations are the class's simplified Ravigururajan-Bergles forms**, with the helix angle in degrees and both the `p/D` and `Pr` powers applied as the class writes them.\n",
    "**the performance evaluation criterion divides the heat ratio by the cube root of the friction ratio**, so a laminar tape can score below one, and `applyEnhancement` multiplies the plain coefficient and drop by the two ratios.\n",
]
references = [
    "Manglik, R.M.; Bergles, A.E. (1993). \"Heat transfer and pressure drop correlations for twisted-tape inserts in isothermal tubes.\" Journal of Heat Transfer 115(4), 881-889. The twisted-tape forms.",
    "Ravigururajan, T.S.; Bergles, A.E. (1996). \"Development and verification of general correlations for pressure drop and heat transfer in single-phase turbulent flow in enhanced tubes.\" Experimental Thermal and Fluid Science 13(1), 55-70. The coiled-wire forms.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/TubeInsertModel.java` is the port source.",
    "`validation/neqsim/captures/tube_insert_probe.tsv` - the four insert types across every regime boundary and the twist-ratio clamp, with the enhancement applied to a fixed plain state.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/TubeInsertModel.java"
edition = "`getHeatTransferEnhancementRatio`, `getPressureDropPenaltyRatio`, `getPerformanceEvaluationCriteria` and `applyEnhancement`, with the three per-type private correlation pairs and the four factories' parameter sets."
[inputs]
[inputs.insert]
type = "enum"
values = ["none", "twisted_tape", "wire_matrix", "coiled_wire"]
description = "the insert type: a plain tube, a twisted tape, a wire matrix or a coiled wire.\n"
[inputs.reynolds_number]
unit = "dimensionless"
description = "the plain-tube Reynolds number the enhancement is taken at.\n"
[inputs.prandtl_number]
unit = "dimensionless"
description = "the Prandtl number, read by the turbulent coiled-wire branch only.\n"
[inputs.plain_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the plain-tube coefficient the enhancement is applied to.\n"
[inputs.plain_pressure_drop]
unit = "Pa"
description = "the plain-tube pressure drop the penalty is applied to.\n"
[inputs.twist_ratio]
unit = "dimensionless"
optional = true
description = "the twisted tape's `y = H/(2D)`, floored at `2`. Absent is the class's `5`.\n"
[inputs.tape_thickness]
unit = "m"
optional = true
description = "the tape thickness. Absent is `0.001`; it cancels in the blockage factor and is carried for the class's own state.\n"
[inputs.tape_width_fraction]
unit = "dimensionless"
optional = true
description = "the tape width over the tube bore. Absent is `0.95`.\n"
[inputs.wire_diameter]
unit = "m"
optional = true
description = "the wire diameter. Absent is `0.001`; no arithmetic reads it.\n"
[inputs.wire_coil_pitch]
unit = "m"
optional = true
description = "the wire coil pitch. Absent is `0.010`; it cancels against itself in the coiled-wire `p/D`.\n"
[inputs.matrix_density]
unit = "dimensionless"
optional = true
description = "the wire matrix density factor in `[0, 1]`. Absent is `0.5`.\n"
[inputs.roughness_ratio]
unit = "dimensionless"
optional = true
description = "the coiled wire's `e/D`. Absent is `0.02`.\n"
[inputs.helix_angle]
unit = "dimensionless"
optional = true
description = "the coiled wire's helix angle in degrees. Absent is `45`; the correlations divide it by `90`.\n"
[outputs]
[outputs.heat_transfer_enhancement_ratio]
unit = "dimensionless"
description = "`h_enhanced/h_plain` at the stated Reynolds and Prandtl numbers.\n"
[outputs.pressure_drop_penalty_ratio]
unit = "dimensionless"
description = "`f_enhanced/f_plain` at the stated Reynolds number.\n"
[outputs.performance_evaluation_criteria]
unit = "dimensionless"
description = "`h_ratio/f_ratio**(1/3)` at constant pumping power.\n"
[outputs.enhanced_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "`plain_heat_transfer_coefficient * heat_transfer_enhancement_ratio`.\n"
[outputs.enhanced_pressure_drop]
unit = "Pa"
description = "`plain_pressure_drop * pressure_drop_penalty_ratio`.\n"
[[valid_range]]
quantity = "reynolds_number"
min = 0
severity = "error"
rationale = "zero is the laminar-tape state the capture pins; a negative Reynolds number is refused.\n"
[[valid_range]]
quantity = "prandtl_number"
min = 0
min_inclusive = false
severity = "error"
rationale = "the coiled-wire turbulent branch raises it to a negative power.\n"
[[valid_range]]
quantity = "twist_ratio"
min = 0
severity = "error"
rationale = "a ratio is non-negative; the class floors it at two.\n"
[[valid_range]]
quantity = "tape_thickness"
min = 0
min_inclusive = false
severity = "error"
rationale = "the blockage factor divides by it; the class's own default is positive.\n"
[[valid_range]]
quantity = "tape_width_fraction"
min = 0
max = 1
severity = "error"
rationale = "a width fraction is in `[0, 1]` of the bore.\n"
[[valid_range]]
quantity = "wire_diameter"
min = 0
severity = "error"
rationale = "a diameter is non-negative, though no arithmetic reads it.\n"
[[valid_range]]
quantity = "wire_coil_pitch"
min = 0
min_inclusive = false
severity = "error"
rationale = "the coiled-wire `p/D` divides by it.\n"
[[valid_range]]
quantity = "matrix_density"
min = 0
max = 1
severity = "error"
rationale = "the class's density factor is in `[0, 1]`.\n"
[[valid_range]]
quantity = "roughness_ratio"
min = 0
severity = "error"
rationale = "a roughness height is non-negative.\n"
[[valid_range]]
quantity = "helix_angle"
min = 0
max = 90
severity = "error"
rationale = "the correlations raise `angle/90` to a fractional power, so a negative angle answers NaN; 90 is the coil's limit.\n"
[[valid_range]]
quantity = "plain_heat_transfer_coefficient"
min = 0
severity = "error"
rationale = "a coefficient cannot be negative.\n"
[[valid_range]]
quantity = "plain_pressure_drop"
min = 0
severity = "error"
rationale = "a drop cannot be negative here; the enhancement multiplies it.\n"
[worked_example]
source = "the capture's `twisted_tape_turbulent` row at NeqSim f0c7436c, the class's default tape at Re 10000 and Pr 5."
derivation = "y = 5, t = 0.001 m, w = 0.95, Re = 10000, Pr = 5, plain h = 1000 W/(m2 K), plain dP = 5000 Pa.\n\n  swirl = sqrt(1 + (pi/(2*5))**2) = 1.048167...\n  blockage = pi/(pi - 4*0.001*0.95/(0.001/0.05)) = pi/(pi - 0.19) = 1.06397...\n  enhancement = swirl**0.8 * blockage**0.8 = 1.091...\n  h_ratio = max(1, enhancement*(1 + 2/5)/swirl) = 1.4578573849941363\n  f_ratio = max(1, (1 + 2.75/5)*swirl**1.8/swirl) = 1.6094693940681604\n  PEC = h_ratio/f_ratio**(1/3) = 1.2440012030177174\n  enhanced h = 1000*h_ratio = 1457.8573849941363 W/(m2 K)\n  enhanced dP = 5000*f_ratio = 8047.346970340802 Pa\n"
tolerance = 1e-9
[worked_example.inputs]
insert = "twisted_tape"
reynolds_number = 10000.0
prandtl_number = 5.0
twist_ratio = 5.0
tape_thickness = 0.001
tape_width_fraction = 0.95
plain_heat_transfer_coefficient = 1000.0
plain_pressure_drop = 5000.0
[worked_example.expected]
heat_transfer_enhancement_ratio = 1.4578573849941363
pressure_drop_penalty_ratio = 1.6094693940681604
performance_evaluation_criteria = 1.2440012030177174
enhanced_heat_transfer_coefficient = 1457.8573849941363
enhanced_pressure_drop = 8047.346970340802
[implementations]
python = "azoth.thermal.tube_insert_model"
rust = "azoth_thermal::tube_insert_model"
[[tests]]
