id = "thermal.shell_and_tube_design"
name = "A shell-and-tube exchanger's detailed TEMA design"
summary = "A detailed shell-and-tube exchanger design from a duty and stream data, applying TEMA layout and ASME wall rules. Use it to size a new exchanger."
equation = "N_t = ceil(A_req / (pi*d_o*L)); shell ID from the bundle area plus the rear-head clearance, snapped to a standard size; t_shell = P*R/(S*E - 0.6*P); t_UHX = G*sqrt(F*P/S); MAWP = S*E*t/(R + 0.6*t); hydro = 1.3*MAWP*S(20)/S(T)"
latex = '''t = \frac{P R}{S E - 0.6 P}, \qquad t_{UHX} = G \sqrt{\frac{F P}{S}}, \qquad MAWP = \frac{S E t}{R + 0.6 t}'''
assumptions = ["A zero or negative flow, or a thermal side with any property missing, is refused rather than answered with a zero coefficient or a NaN pressure drop."]
notes = ["**the pipeline is single-pass**: TEMA configuration, material lookup, tube bundle, shell dimensions, baffles, UHX-13, UG-37, UG-27, UG-99, the optional NACE assessment, the optional thermal and vibration block, weights and costs. Nothing iterates.\n", "**the geometry is millimetres and the pressures bar/MPa**: the ASME formulas use `P*0.1` MPa, MAWP is multiplied by 10 to bar, and the thermal core is fed metres and pascals.\n", "**the fixed defaults are carried, not settable**: tube wall 2.108 mm, corrosion 3.175 mm shell and 0 tube, triangular-30 pitch at ratio 1.25, single-segmental baffles at 25 per cent cut, 85 per cent joint efficiency and 248 HV.\n", "**the material table is NeqSim's 22-row design table, looked up by exact grade.** A grade that is not in it leaves the class's defaults (138/117 MPa, 52 W/(m K)) and the `Carbon Steel ...` strings.\n", "**NACE compliance is `Yes`.equalsIgnoreCase against a `true`/`false` column, so every grade reads not compliant.** The port reproduces the defect; the sour threshold itself is 0.003 bar, exclusive.\n", "**the price test is `contains(\"STAINLESS\")` against the specification string `ASME-II-A SA-...`, so every grade prices as carbon steel at 1.5 USD/kg.** The 5 USD/kg branch is unreachable.\n", "**the shell minimum wall is the TEMA tube-wall minimum of the class**, and the weight uses a separate tubesheet estimate rather than the reported UHX-13 thickness.\n", "**weights use 7850 kg/m3 for steel and 1000 for water**, and the material row's density is not read. `shell_joint_efficiency` reaches UG-37 and UG-27, not the shell-wall formula.\n", "**the vibration screen fixes E 200 GPa, tube density 7850, sonic velocity `sqrt(1.4*8314*300/29)` and damping 0.03/0.01 by shell density**, and it reads the tube-side fluid density, which may be zero.\n", "**the costs are USD and the vocabulary has no currency unit**, so the three costs are dimensionless with USD named in their descriptions.\n", "**the class appends to its standards list without clearing**, so a second `calculate()` duplicates entries; this port returns one assessment per call.\n"]
references = [
    "TEMA (2019). Standards of the Tubular Exchanger Manufacturers Association, 10th ed. The configuration classes and the minimum wall and spacing tables.",
    "ASME Boiler and Pressure Vessel Code, Section VIII Division 1 (2019). UHX-13 tubesheets, UG-37 reinforcement, UG-27 shell thicknesses and UG-99 hydrostatic test.",
    "NACE MR0175/ISO 15156 (2015). The sour-service threshold and the material compliance flags.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/ShellAndTubeDesignCalculator.java` is the port source, over `TEMAStandard`, `ThermalDesignCalculator` and `VibrationAnalysis`.",
    "`validation/neqsim/captures/shell_and_tube_design_probe.tsv` - the class driven on its defaults, every rear-head branch, the size table ends, all tube sizes, the derating boundaries, five material pairs, the NACE threshold, joint efficiencies, nozzles and the thermal block.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/ShellAndTubeDesignCalculator.java"
edition = "`calculate()` single pass: tube bundle, shell dimensions, baffles, UHX-13, UG-37, UG-27, UG-99, the NACE assessment, the thermal and vibration block, weights and costs; the lookup is `loadMaterialFromDB`."
[inputs]
[inputs.tema_designation]
type = "string"
description = "The three-letter TEMA designation, e.g. `AES`. Defaults to `AES`.\n"
[inputs.tema_class]
type = "enum"
values = ["R", "C", "B"]
description = "The construction class: severe, moderate or light service. Defaults to `R`.\n"
[inputs.required_area]
unit = "m**2"
description = "The required heat-transfer area, which the tube count divides. Defaults to 100 m**2.\n"
[inputs.shell_side_pressure]
unit = "bar"
description = "The shell-side design pressure. Defaults to 10 bar.\n"
[inputs.tube_side_pressure]
unit = "bar"
description = "The tube-side design pressure. Defaults to 10 bar.\n"
[inputs.design_temperature]
unit = "K"
description = "The design temperature; the allowable stress is derated at 200, 300 and 400 C. Defaults to 150 C.\n"
[inputs.shell_material_grade]
type = "string"
description = "The shell material grade, looked up by exact name. Defaults to `SA-516-70`.\n"
[inputs.tube_material_grade]
type = "string"
description = "The tube material grade, looked up by exact name. Defaults to `SA-179`.\n"
[inputs.tube_size]
type = "enum"
values = ["tube_3_8_inch", "tube_1_2_inch", "tube_5_8_inch", "tube_3_4_inch", "tube_1_inch"]
description = "The standard tube size. Defaults to `tube_3_4_inch`.\n"
[inputs.tube_length]
unit = "mm"
description = "The tube length. Defaults to 6096 mm.\n"
[inputs.tube_passes]
unit = "dimensionless"
description = "The tube passes. Defaults to 2.\n"
[inputs.shell_joint_efficiency]
unit = "dimensionless"
description = "The shell joint efficiency, used by UG-37 and UG-27 rather than the shell-wall formula. Defaults to 0.85.\n"
[inputs.nozzle_diameter]
unit = "mm"
description = "The nozzle finished inside diameter. Defaults to 150 mm.\n"
[inputs.nozzle_wall_thickness]
unit = "mm"
description = "The nozzle wall thickness. Defaults to 7.11 mm.\n"
[inputs.sour_service_assessment]
type = "boolean"
description = "Whether the NACE assessment runs. Defaults to false.\n"
[inputs.h2s_partial_pressure]
unit = "bar"
optional = true
description = "the H2S partial pressure, read only when the assessment runs. Absent is `0`; the sour threshold is 0.003 bar.\n"
[inputs.fouling_tube]
unit = "dimensionless"
optional = true
description = "the tube-side fouling resistance in m**2*K/W for the thermal block. Absent is `0.000176`.\n"
[inputs.fouling_shell]
unit = "dimensionless"
optional = true
description = "the shell-side fouling resistance in m**2*K/W, likewise. Absent is `0.000176`.\n"
[inputs.shell_side_method]
type = "enum"
values = ["kern", "bell_delaware"]
optional = true
description = "the shell-side method of the thermal block. Absent is `kern`.\n"
[inputs.tube_side_density]
unit = "kg/m**3"
optional = true
description = "the tube-side density; the five tube properties are all-or-none, and their presence turns the thermal block on.\n"
[inputs.tube_side_viscosity]
unit = "Pa*s"
optional = true
description = "the tube-side viscosity.\n"
[inputs.tube_side_cp]
unit = "J/(kg*K)"
optional = true
description = "the tube-side specific heat capacity.\n"
[inputs.tube_side_conductivity]
unit = "W/(m*K)"
optional = true
description = "the tube-side thermal conductivity.\n"
[inputs.tube_side_mass_flow]
unit = "kg/s"
optional = true
description = "the tube-side mass flow.\n"
[inputs.shell_side_density]
unit = "kg/m**3"
optional = true
description = "the shell-side density; the five shell properties are all-or-none, and a positive density turns the vibration screen on.\n"
[inputs.shell_side_viscosity]
unit = "Pa*s"
optional = true
description = "the shell-side viscosity.\n"
[inputs.shell_side_cp]
unit = "J/(kg*K)"
optional = true
description = "the shell-side specific heat capacity.\n"
[inputs.shell_side_conductivity]
unit = "W/(m*K)"
optional = true
description = "the shell-side thermal conductivity.\n"
[inputs.shell_side_mass_flow]
unit = "kg/s"
optional = true
description = "the shell-side mass flow.\n"
[outputs]
[outputs.tema_designation]
type = "string"
description = "the designation, echoed.\n"
[outputs.tema_class]
type = "string"
description = "The TEMA construction class.\n"
[outputs.shell_inside_diameter]
unit = "mm"
description = "the bundle diameter plus the rear-head clearance, snapped to a standard shell size.\n"
[outputs.shell_outside_diameter]
unit = "mm"
description = "the inside diameter plus twice the wall.\n"
[outputs.shell_wall_thickness]
unit = "mm"
description = "The ASME circumferential-stress thickness, floored at the minimum and rounded to a plate thickness.\n"
[outputs.shell_material]
type = "string"
description = "the specification and grade, e.g. `ASME-II-A SA-516-70`.\n"
[outputs.shell_material_grade]
type = "string"
description = "the grade, echoed.\n"
[outputs.shell_allowable_stress]
unit = "MPa"
description = "the shell allowable stress after the temperature derating.\n"
[outputs.shell_smys]
unit = "MPa"
description = "the shell minimum yield strength from the table.\n"
[outputs.shell_joint_efficiency]
unit = "dimensionless"
description = "the joint efficiency, echoed.\n"
[outputs.tube_count]
unit = "dimensionless"
description = "the area-derived tube count, rounded up to a multiple of the passes.\n"
[outputs.tube_outer_diameter]
unit = "mm"
description = "the standard tube outside diameter.\n"
[outputs.tube_wall_thickness]
unit = "mm"
description = "The minimum tube wall thickness.\n"
[outputs.tube_length]
unit = "mm"
description = "the tube length, echoed.\n"
[outputs.tube_passes]
unit = "dimensionless"
description = "the passes, echoed.\n"
[outputs.tube_pitch]
unit = "mm"
description = "`tube_outer_diameter * 1.25`.\n"
[outputs.tube_pitch_pattern]
type = "string"
description = "The tube pitch pattern, e.g. `Triangular 30°`.\n"
[outputs.tube_material]
type = "string"
description = "the specification and grade of the tube material.\n"
[outputs.tube_material_grade]
type = "string"
description = "the tube grade, echoed.\n"
[outputs.tube_allowable_stress]
unit = "MPa"
description = "the tube allowable stress after the temperature derating.\n"
[outputs.tube_thermal_conductivity]
unit = "W/(m*K)"
description = "the tube material's conductivity from the table.\n"
[outputs.baffle_type]
type = "string"
description = "The baffle type, e.g. `Single Segmental`.\n"
[outputs.baffle_count]
unit = "dimensionless"
description = "`(tube_length - 2*spacing)/spacing` floored, at least one.\n"
[outputs.baffle_spacing]
unit = "mm"
description = "0.4 of the shell diameter, clamped by the TEMA minimum, the maximum and the unsupported span.\n"
[outputs.baffle_cut]
unit = "dimensionless"
description = "The baffle cut, e.g. 0.25.\n"
[outputs.required_area]
unit = "m**2"
description = "the required area, echoed.\n"
[outputs.actual_area]
unit = "m**2"
description = "`tube_count * pi * d_o * L`.\n"
[outputs.area_margin]
unit = "dimensionless"
description = "`(actual - required)/required`.\n"
[outputs.tubesheet_thickness_uhx]
unit = "mm"
description = "The UHX-13 tubesheet thickness, floored at the minimum.\n"
[outputs.mawp_shell_side]
unit = "bar"
description = "the shell MAWP per UG-27.\n"
[outputs.mawp_tube_side]
unit = "bar"
description = "the tube MAWP per UG-27.\n"
[outputs.hydro_test_pressure_shell]
unit = "bar"
description = "`1.3 * MAWP * S(20 C)/S(design)`.\n"
[outputs.hydro_test_pressure_tube]
unit = "bar"
description = "the same on the tube side.\n"
[outputs.nozzle_reinforcement_area]
unit = "m**2"
description = "The available reinforcement area per UG-37.\n"
[outputs.nozzle_reinforcement_adequate]
type = "boolean"
description = "whether the available area meets the required one.\n"
[outputs.sour_service_required]
type = "boolean"
description = "whether the H2S partial pressure exceeds the 0.003 bar threshold.\n"
[outputs.h2s_partial_pressure]
unit = "bar"
optional = true
description = "the stated partial pressure, echoed when the assessment runs.\n"
[outputs.shell_nace_compliant]
type = "boolean"
description = "Whether the shell material meets NACE.\n"
[outputs.tube_nace_compliant]
type = "boolean"
description = "the tube material's compliance flag, likewise.\n"
[outputs.shell_max_hardness]
unit = "dimensionless"
description = "The shell hardness in HV.\n"
[outputs.tube_max_hardness]
unit = "dimensionless"
description = "the tube hardness in HV, likewise.\n"
[outputs.nace_issues]
type = "record_list"
description = "The NACE assessment's issue strings.\n"
[outputs.nace_issues.fields]
[outputs.nace_issues.fields.message]
type = "string"
description = "one issue.\n"
[outputs.applied_standards]
type = "record_list"
description = "The standards the design pipeline applied.\n"
[outputs.applied_standards.fields]
[outputs.applied_standards.fields.name]
type = "string"
description = "one standard.\n"
[outputs.tube_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the thermal block's tube-side coefficient.\n"
[outputs.shell_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the thermal block's shell-side coefficient.\n"
[outputs.overall_heat_transfer_coefficient]
unit = "W/(m**2*K)"
optional = true
description = "the thermal block's overall coefficient.\n"
[outputs.tube_side_pressure_drop]
unit = "Pa"
optional = true
description = "the thermal block's tube-side drop.\n"
[outputs.shell_side_pressure_drop]
unit = "Pa"
optional = true
description = "the thermal block's shell-side drop.\n"
[outputs.tube_side_velocity]
unit = "m/s"
optional = true
description = "the thermal block's tube-side velocity.\n"
[outputs.shell_side_velocity]
unit = "m/s"
optional = true
description = "the thermal block's shell-side velocity.\n"
[outputs.tube_side_reynolds]
unit = "dimensionless"
optional = true
description = "the thermal block's tube-side Reynolds number.\n"
[outputs.shell_side_reynolds]
unit = "dimensionless"
optional = true
description = "the thermal block's shell-side Reynolds number.\n"
[outputs.effective_tube_inside_diameter]
unit = "m"
optional = true
description = "the tube flow diameter the thermal block read.\n"
[outputs.outside_heat_transfer_area]
unit = "m**2"
optional = true
description = "the outside area the thermal block read.\n"
[outputs.tube_fouling_layer_resistance_outside]
unit = "dimensionless"
optional = true
description = "the deposit resistance on the outside area; zero without a deposit.\n"
[outputs.jc]
unit = "dimensionless"
optional = true
description = "the Bell-Delaware baffle-cut factor.\n"
[outputs.jl]
unit = "dimensionless"
optional = true
description = "the Bell-Delaware leakage factor.\n"
[outputs.jb]
unit = "dimensionless"
optional = true
description = "the Bell-Delaware bypass factor.\n"
[outputs.js]
unit = "dimensionless"
optional = true
description = "the Bell-Delaware spacing factor, 1.0.\n"
[outputs.jr]
unit = "dimensionless"
optional = true
description = "the Bell-Delaware adverse-gradient factor.\n"
[outputs.passed]
type = "boolean"
optional = true
description = "whether the vibration screen passed.\n"
[outputs.natural_frequency]
unit = "1/s"
optional = true
description = "the first natural frequency.\n"
[outputs.vortex_shedding_frequency]
unit = "1/s"
optional = true
description = "the Strouhal shedding frequency.\n"
[outputs.vortex_shedding_ratio]
unit = "dimensionless"
optional = true
description = "`f_vs/f_n`.\n"
[outputs.vortex_shedding_critical]
type = "boolean"
optional = true
description = "whether the shedding ratio is inside the 0.8-1.2 band.\n"
[outputs.critical_velocity]
unit = "m/s"
optional = true
description = "Connors' critical crossflow velocity.\n"
[outputs.velocity_ratio]
unit = "dimensionless"
optional = true
description = "the crossflow velocity over the safety-factored critical one.\n"
[outputs.fluid_elastic_critical]
type = "boolean"
optional = true
description = "whether the velocity ratio exceeds one.\n"
[outputs.acoustic_frequency]
unit = "1/s"
optional = true
description = "the shell acoustic frequency.\n"
[outputs.acoustic_ratio]
unit = "dimensionless"
optional = true
description = "`f_vs/f_ac`.\n"
[outputs.acoustic_critical]
type = "boolean"
optional = true
description = "whether the acoustic ratio is inside the 0.8-1.2 band.\n"
[outputs.shell_weight]
unit = "kg"
description = "the shell metal mass.\n"
[outputs.tube_weight]
unit = "kg"
description = "the tube metal mass.\n"
[outputs.tubesheet_weight]
unit = "kg"
description = "the tubesheet mass, one sheet for a U-tube and two otherwise.\n"
[outputs.head_weight]
unit = "kg"
description = "the two heads' mass as hemispheres.\n"
[outputs.baffle_weight]
unit = "kg"
description = "the baffle mass at 6.35 mm.\n"
[outputs.total_dry_weight]
unit = "kg"
description = "the five component masses.\n"
[outputs.operating_weight]
unit = "kg"
