[worked_example]
source = "the capture's `defaults` row at NeqSim f0c7436c: the design calculator's own constructor defaults."
derivation = "The tube bundle answers 276 tubes (100 m2 over pi*0.01905*6.096) and a 508.0 mm shell at the S-head's 35 mm clearance. The shell wall is 12.7 mm, the baffles 203.2 mm apart and 28 of them, the UHX thickness 79.80326511472613 mm, the shell MAWP 43.019559902200484 bar and the tube MAWP 223.38224792093808 bar. The five weights sum to 2936.980449631322 kg dry, and the material cost is 4405.470674446983 USD at 1.5 USD/kg.\n"
tolerance = 1e-9
