id = "thermal.tema_standard"
name = "TEMA configuration, class limits and layout rules"
summary = "TEMA construction class, configuration limits, recommended designation and a relative cost factor. Use it to select a shell-and-tube configuration and check its layout rules."
equation = "cost = 1 + front + shell + rear; N = int(A_eff / a_tube); L_max = L_band * material_factor; S_min = max(D/5, floor); S_max = D"
latex = '''cost = 1 + \sum front + \sum shell + \sum rear, \qquad S_{min} = \max(D/5,\; floor)'''
assumptions = ["The configuration is one of the TEMA designations. The limits and the relative cost factor come from the TEMA tables this calculation carries, not from a vendor quotation.\n"]
notes = ["**every length is SI metres**; the class's millimetre constants (wall 12.7, 9.5, 6.35 mm; corrosion 4.76, 3.18, 2.11 mm; spans 660, 889, 1067, 1321 mm; floors 50.8 and 38.1 mm) are converted at the table boundary, and only the inch echo is declared in inches.\n", "**the configuration is built from its three letters**, so a designation outside the class's ten-common table is accepted as a custom configuration rather than a null lookup - the table is a lookup of the same triple, not a different set of rules.\n", "**the configuration cost factor starts at one and adds the class's steps in its order**: front `D` 0.4, `A` 0.15, `C` or `N` 0.1; shell `K` 0.3, `F` 0.2; rear `T` 0.25, `S` 0.2, `P` or `W` 0.15.\n", "**a bundle is removable, and handles thermal expansion, when the rear head is floating (`P`, `S`, `T` or `W`) or is the `U`-tube**, which is the class's own predicate.\n", "**the tube count truncates to an integer**: the bundle clearance removes one tube diameter on each side, the pass lanes scale the area by `1 - 0.05 (passes - 1)`, and a tube occupies `pitch**2 sqrt(3)/2` (triangular) or `pitch**2` (square).\n", "**the unsupported span is the diameter band (12.7, 19.05 or 25.4 mm, else 1321 mm) times a material factor**, matched by upper-cased substring: `STAINLESS`/`SS` 0.95, `COPPER`/`CU` 0.75, `TITANIUM`/`TI` 0.90, else one.\n", "**the tube-size enum stops at 25.4 mm, so the 1321 mm band is unreachable through this calculation**; the capture's 28 mm row pins the class's own method.\n", "**the minimum baffle spacing is `max(shell/5, 50.8 mm)`**, with `38.1 mm` as the floor for class `B`, and the maximum is the shell diameter.\n", "**the recommended designation is the class's four-branch string tree, published verbatim**, and it is not required to be a designation in the common table - `AEW` is a recommendation the table does not hold.\n", "**the tube size's available wall-thickness rows are carried by the enum and read by no formula here**, so only the outside diameter and its inch echo are published.\n"]
references = [
    "TEMA (2019). Standards of the Tubular Exchanger Manufacturers Association, 10th edition. The head, shell and rear-head letters, the construction classes and their limits, the tube pitches, the baffle types and the unsupported-span table.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/TEMAStandard.java` is the port source.",
    "`validation/neqsim/captures/tema_standard_probe.tsv` - five common and two custom configurations, every enum row, all eight recommendation branches, the tube-count estimates and the span bands.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/TEMAStandard.java"
edition = "the seven enum tables and `TEMAConfiguration`'s cost and head predicates, with `recommendConfiguration`, `calculateMinTubePitch`, `estimateTubeCount`, `getMaxUnsupportedSpan`, `getMinBaffleSpacing` and `getMaxBaffleSpacing`."
[inputs]
[inputs.front_head]
type = "enum"
values = ["A", "B", "C", "N", "D"]
description = "the stationary head letter: channel with removable cover, bonnet, two integral channels or the special high-pressure closure.\n"
[inputs.shell]
type = "enum"
values = ["E", "F", "G", "H", "J", "K", "X"]
description = "the shell letter, which also carries the shell-side pressure drop factor.\n"
[inputs.rear_head]
type = "enum"
values = ["L", "M", "N", "P", "S", "T", "U", "W"]
description = "the rear head letter; `P`, `S`, `T` and `W` are floating, and `U` is the U-tube.\n"
[inputs.tema_class]
type = "enum"
values = ["R", "C", "B"]
description = "the construction class: severe, moderate or light service.\n"
[inputs.tube_size]
type = "enum"
values = ["tube_3_8_inch", "tube_1_2_inch", "tube_5_8_inch", "tube_3_4_inch", "tube_1_inch"]
description = "the standard tube size: 3/8, 1/2, 5/8, 3/4 or 1 inch outside diameter.\n"
[inputs.pitch_pattern]
type = "enum"
values = ["triangular_30", "triangular_60", "square_90", "square_45"]
description = "the tube layout: triangular or rotated triangular, square or rotated square.\n"
[inputs.baffle_type]
type = "enum"
values = ["single_segmental", "double_segmental", "triple_segmental", "no_tubes_in_window", "disc_and_doughnut", "rod_baffles"]
description = "the baffle type, which carries its heat-transfer and pressure-drop factors relative to a single segmental.\n"
[inputs.shell_inside_diameter]
unit = "m"
description = "the shell inside diameter, which sets the bundle area, the baffle spacings and their floor.\n"
[inputs.tube_pitch]
unit = "m"
description = "the tube pitch, whose minimum the pattern declares and whose area the count divides by.\n"
[inputs.tube_passes]
unit = "dimensionless"
description = "the number of tube passes; each pass past the first takes five per cent of the bundle area.\n"
[inputs.needs_cleanable]
type = "boolean"
description = "whether the shell side needs mechanical cleaning, in the recommendation.\n"
[inputs.large_temperature_difference]
type = "boolean"
description = "whether the service has a large temperature differential, in the recommendation.\n"
[inputs.high_pressure]
type = "boolean"
description = "whether the service is high pressure, in the recommendation.\n"
[inputs.hazardous]
type = "boolean"
description = "whether the service is hazardous, in the recommendation.\n"
[inputs.tube_material]
type = "string"
optional = true
description = "The tube material name, matched by upper-cased substring for the span factor. Absent means no factor.\n"
[outputs]
[outputs.configuration_cost_factor]
unit = "dimensionless"
description = "the configuration's relative cost factor, one for the plainest head, shell and rear.\n"
[outputs.shell_pressure_drop_factor]
unit = "dimensionless"
description = "the shell letter's pressure drop factor relative to an `E` shell.\n"
[outputs.bundle_removable]
type = "boolean"
description = "whether the rear head allows the bundle to be removed.\n"
[outputs.good_thermal_expansion]
type = "boolean"
description = "Whether the rear head handles thermal expansion.\n"
[outputs.class_cost_factor]
unit = "dimensionless"
description = "The construction class's cost factor relative to class `B`.\n"
[outputs.min_tube_wall_thickness]
unit = "m"
description = "The minimum tube wall thickness for the class.\n"
[outputs.min_corrosion_allowance]
unit = "m"
description = "The minimum corrosion allowance for the class.\n"
[outputs.tube_outer_diameter]
unit = "m"
description = "the standard tube size's outside diameter.\n"
[outputs.tube_outer_diameter_inch]
unit = "in"
description = "the same diameter in inches, which is how the size is named.\n"
[outputs.layout_angle]
unit = "dimensionless"
description = "the layout angle in degrees: 30, 60, 90 or 45.\n"
[outputs.min_pitch_ratio]
unit = "dimensionless"
description = "the pattern's minimum pitch over tube diameter.\n"
[outputs.pitch_heat_transfer_factor]
unit = "dimensionless"
description = "the pattern's heat-transfer factor relative to square 90.\n"
[outputs.baffle_heat_transfer_factor]
unit = "dimensionless"
description = "the baffle type's heat-transfer factor relative to a single segmental.\n"
[outputs.baffle_pressure_drop_factor]
unit = "dimensionless"
description = "the baffle type's pressure-drop factor relative to a single segmental.\n"
[outputs.min_tube_pitch]
unit = "m"
description = "`tube_outer_diameter * min_pitch_ratio`.\n"
[outputs.estimated_tube_count]
unit = "dimensionless"
description = "the truncated bundle-area estimate at the stated pitch and passes.\n"
[outputs.max_unsupported_span]
unit = "m"
description = "The maximum unsupported tube span for the diameter band and material.\n"
[outputs.min_baffle_spacing]
unit = "m"
description = "The greater of one fifth of the shell diameter and the minimum baffle spacing.\n"
[outputs.max_baffle_spacing]
unit = "m"
description = "the shell inside diameter.\n"
[outputs.recommended_designation]
type = "string"
description = "The recommended TEMA designation.\n"
[[valid_range]]
quantity = "shell_inside_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "the diameter divides the baffle spacing and sets the bundle area.\n"
[[valid_range]]
quantity = "tube_pitch"
min = 0
min_inclusive = false
severity = "error"
rationale = "the tube count divides by its square.\n"
[[valid_range]]
quantity = "tube_passes"
min = 1
severity = "error"
rationale = "a bundle has at least one pass; a non-integral count is refused.\n"
[worked_example]
source = "the capture's `aes_r` row at NeqSim f0c7436c, the most common configuration at class R."
derivation = "AES, class R, 3/4 inch tubes, triangular 30, single segmental, D = 0.5 m, pitch = 0.02381 m, 2 passes, carbon steel, no recommendation flags.\n\n  cost = 1 + 0.15 (A) + 0 (E) + 0.2 (S) = 1.3499999999999999\n  shell dp factor = 1.0 (E);  rear S is floating, so removable and good expansion\n  class R: cost 1.0, wall 0.0127 m, corrosion 0.00476 m\n  tube 3/4 inch: OD 0.01905 m, 0.7500000000000001 in\n  triangular 30: angle 30, ratio 1.25, heat factor 1.1;  single segmental: 0.75, 1.0\n  min pitch = 0.01905*1.25 = 0.0238125 m\n  A_eff = pi*((0.5 - 2*0.01905)/2)**2*(1 - 0.05) = 1.59215e-1 m2;  a_tube = 0.02381**2*sqrt(3)/2 = 4.909e-4 m2\n  count = int(324.3) = 324\n  span = 889 mm * 1.0 = 0.889 m;  min baffle = max(0.1, 0.0508) = 0.1 m;  max = 0.5 m\n  recommendation(false, false, false, false) = BEM\n"
tolerance = 1e-9
[worked_example.inputs]
front_head = "A"
shell = "E"
rear_head = "S"
tema_class = "R"
tube_size = "tube_3_4_inch"
pitch_pattern = "triangular_30"
baffle_type = "single_segmental"
shell_inside_diameter = 0.5
tube_pitch = 0.02381
tube_passes = 2.0
tube_material = "CARBON_STEEL"
needs_cleanable = false
large_temperature_difference = false
high_pressure = false
hazardous = false
[worked_example.expected]
configuration_cost_factor = 1.3499999999999999
shell_pressure_drop_factor = 1.0
bundle_removable = true
good_thermal_expansion = true
class_cost_factor = 1.0
min_tube_wall_thickness = 0.0127
min_corrosion_allowance = 0.00476
tube_outer_diameter = 0.01905
tube_outer_diameter_inch = 0.7500000000000001
layout_angle = 30.0
min_pitch_ratio = 1.25
pitch_heat_transfer_factor = 1.1
baffle_heat_transfer_factor = 0.75
baffle_pressure_drop_factor = 1.0
min_tube_pitch = 0.0238125
estimated_tube_count = 324.0
max_unsupported_span = 0.889
min_baffle_spacing = 0.1
max_baffle_spacing = 0.5
recommended_designation = "BEM"
[implementations]
python = "azoth.thermal.tema_standard"
rust = "azoth_thermal::tema_standard"
