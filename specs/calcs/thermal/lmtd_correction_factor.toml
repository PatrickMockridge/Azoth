id = "thermal.lmtd_correction_factor"
name = "The LMTD correction factor for a shell-and-tube exchanger"
equation = "R = (T_h,in - T_h,out)/(T_c,out - T_c,in); P = (T_c,out - T_c,in)/(T_h,in - T_c,in); F_t = sqrt(R*R+1)*ln((1-P)/(1-R*P)) / ((R-1)*ln((2-P*(R+1-sqrt(R*R+1)))/(2-P*(R+1+sqrt(R*R+1)))))"
latex = '''F_t = \frac{\sqrt{R^2+1}\,\ln\!\left(\frac{1-P}{1-RP}\right)}{(R-1)\ln\!\left(\frac{2-P(R+1-\sqrt{R^2+1})}{2-P(R+1+\sqrt{R^2+1})}\right)}'''
assumptions = [
    "**`R` and `P` are the class's ratios**: `R = (Th_in - Th_out)/(Tc_out - Tc_in)` with a zero cold-side change answering 1.0, and `P = (Tc_out - Tc_in)/(Th_in - Tc_in)` with a zero hot-cold inlet difference answering 0.\n",
    "**the single-shell formula is the analytic Bowman-Mueller-Nagle relation**, with the `R = 1` special case inside `|R - 1| < 1e-6`, the `R*P >= 1` temperature-cross zero, and the general branch clamped to `[0, 1]`.\n",
    "**the `R = 1` branch is not clamped**, unlike the general branch; its ratio is the formula's own, which stays below one on the captured states but is not forced there.\n",
    "**multi-pass P is converted to a per-shell `P1` before the single-shell formula**, with the `R = 1` branch `P/(N-(N-1)P)`; an undefined or out-of-range `P1` answers 1.0 rather than zero, which is why the cross row reads 1.0 at two passes.\n",
    "**`required_shell_passes` scans one to six and answers -1 when none reaches `MIN_ACCEPTABLE_FT = 0.75`.**\n",
    "**a shell-pass count below one is the class's clamp to one**, not a refusal.\n",
    "**the four temperatures enter only as differences**, so any consistent unit works; the spec states K and the differences are the same.\n",
]
references = [
    "Kern, D.Q. (1950). Process Heat Transfer. McGraw-Hill. The R and P ratios and the correction-factor use.",
    "Bowman, R.A.; Mueller, A.C.; Nagle, W.M. (1940). \"Mean temperature difference in design.\" Trans. ASME 62, 283-294. The multi-pass correction-factor relation.",
    "TEMA (2019). Standards of the Tubular Exchanger Manufacturers Association, 10th edition. The shell-pass configurations.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/LMTDcorrectionFactor.java` is the port source.",
    "`validation/neqsim/captures/lmtd_correction_probe.tsv` - the class's R/P state, the R = 1 pair, no heat transfer, equal inlets, a cross, a four-pass need and an unachievable state.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/LMTDcorrectionFactor.java"
edition = "`calcFt`, `calcFtFromRP` and the four helpers behind them - `calcR`, `calcP`, `calcFtSingleShell`, `convertPtoPerShell` - plus `requiredShellPasses`."
[inputs]
[inputs.hot_inlet_temperature]
unit = "K"
description = "the hot stream's inlet temperature; only its differences enter R and P.\n"
[inputs.hot_outlet_temperature]
unit = "K"
description = "the hot stream's outlet temperature.\n"
[inputs.cold_inlet_temperature]
unit = "K"
description = "the cold stream's inlet temperature.\n"
[inputs.cold_outlet_temperature]
unit = "K"
description = "the cold stream's outlet temperature.\n"
[inputs.shell_passes]
unit = "dimensionless"
optional = true
description = "the number of shell passes the stated `ft` is for. Absent is `1`; below one is the class's clamp to one.\n"
[outputs]
[outputs.r]
unit = "dimensionless"
description = "the capacity ratio `(Th_in - Th_out)/(Tc_out - Tc_in)`.\n"
[outputs.p]
unit = "dimensionless"
description = "the thermal effectiveness `(Tc_out - Tc_in)/(Th_in - Tc_in)`.\n"
[outputs.ft]
unit = "dimensionless"
description = "the correction factor for the stated number of shell passes.\n"
[outputs.ft_1_shell_pass]
unit = "dimensionless"
description = "the correction factor for one shell pass, the class's dedicated wrapper.\n"
[outputs.ft_2_shell_passes]
unit = "dimensionless"
description = "the correction factor for two shell passes, the class's dedicated wrapper.\n"
[outputs.required_shell_passes]
unit = "dimensionless"
description = "the first pass count from one to six whose correction factor reaches 0.75, or -1 when none does.\n"
[[valid_range]]
quantity = "hot_inlet_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature.\n"
[[valid_range]]
quantity = "hot_outlet_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature.\n"
[[valid_range]]
quantity = "cold_inlet_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature.\n"
[[valid_range]]
quantity = "cold_outlet_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature.\n"
[worked_example]
source = "the capture's `class_rp_state` row at NeqSim f0c7436c, the class's own `testCalcRandP` state."
derivation = "Hot 150 to 90 K, cold 30 to 80 K, the class's own test state:\n\n  R = (150 - 90)/(80 - 30) = 1.2\n  P = (80 - 30)/(150 - 30) = 0.4166666666666667\n  W = sqrt(1.2**2 + 1) = 1.5620499351813308\n  (1-P)/(1-R P) = 0.5833333333333334/0.5 = 1.1666666666666667, ln = 0.15415067982725836\n  arg2 = (2 - P(R+1-W))/(2 - P(R+1+W)) = 1.7341897/0.4324772 = 4.009898, ln = 1.3888462\n  F_t = 1.56205*0.15415/((1.2-1)*1.38885) = 0.8669282341207655\n  F_t(2 passes) = 0.969546690791266\n  required shell passes = 1, because the one-pass factor already clears 0.75\n\nA temperature cross at one pass reads 0.0, but at two passes the per-shell conversion of P is undefined and the class answers 1.0; the `temperature_cross` row records that.\n"
tolerance = 1e-9
[worked_example.inputs]
hot_inlet_temperature = 150.0
hot_outlet_temperature = 90.0
cold_inlet_temperature = 30.0
cold_outlet_temperature = 80.0
shell_passes = 1.0
[worked_example.expected]
r = 1.2
p = 0.4166666666666667
ft = 0.8669282341207655
ft_1_shell_pass = 0.8669282341207655
ft_2_shell_passes = 0.969546690791266
required_shell_passes = 1.0
[implementations]
python = "azoth.thermal.lmtd_correction_factor"
rust = "azoth_thermal::lmtd_correction_factor"
