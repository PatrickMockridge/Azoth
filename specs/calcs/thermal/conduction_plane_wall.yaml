id: thermal.conduction_plane_wall
name: Steady conduction through a plane wall
equation: "q = k * A * dT / L"
latex: 'q = \frac{k\,A\,\Delta T}{L}'

source:
  standard: Fourier, J. (1822)
  edition: "Théorie analytique de la chaleur, Paris: Firmin Didot"

inputs:
  k:
    unit: W/(m*K)
    description: >
      Thermal conductivity of the wall material, taken as constant across the
      temperature range. A real material's conductivity varies with temperature,
      so this is a single representative value and the caller chooses it.
  A:
    unit: m**2
    description: area of the wall face through which the heat flows
  dT:
    unit: K
    interval: true
    description: >
      temperature difference across the wall. May be negative, and then `q` is
      negative - see the sign convention on the output.

      `interval` marks this as a *difference* rather than an absolute
      temperature. Both are kelvin-dimensioned and they are not interchangeable:
      a 30 K difference is a 30 degC difference, while an absolute 30 degC is
      303.15 K. The flag makes the Python boundary refuse an offset unit instead
      of silently applying the offset, which is what `uom`'s `TemperatureInterval`
      already gives the Rust side.
  L:
    unit: m
    description: wall thickness in the direction of heat flow

outputs:
  q:
    unit: W
    description: >
      Heat flow rate through the wall, positive in the direction of decreasing
      temperature. The sign follows `dT`: with `dT` negative the flow is from the
      face that was named second, and `q` is negative rather than the calc
      reordering the two faces. Nothing here knows which side is which, so
      reversing the sign is the caller's to interpret - see `assumptions`.

valid_range:
  - quantity: k
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      Thermal conductivity is strictly positive for any real material. A zero or
      negative value is not a limiting case to warn about but a number that is
      wrong, and it would produce a heat flow in the wrong direction or none at
      all.

  - quantity: A
    min: 0
    min_inclusive: false
    severity: error
    rationale: an area is positive by definition; zero area carries no heat and would make `q` zero regardless of the temperature difference

  - quantity: L
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      `L` is a divisor, so `L = 0` is singular - and physically it is the
      infinite-heat-flow limit of a zero-thickness wall, which is not a state the
      steady plane-wall model describes.

assumptions:
  - steady state; the wall has been at these conditions long enough that the temperature profile is no longer changing. NOT CHECKED - it cannot be, because this calc has no density or heat capacity and so no thermal mass to reason about.
  - "one-dimensional conduction: heat flows normal to the faces and nowhere else. NOT CHECKED - the calc has no lateral dimensions."
  - the wall is homogeneous and isotropic, so a single `k` describes it in the flow direction
  - "`k` is constant across the temperature range. A material whose conductivity varies appreciably with temperature is not described by one value, and the error is not bounded by anything this calc can see."
  - no internal heat generation within the wall
  - no contact resistance at either face, and no convective film on either side; `dT` is the temperature difference across the solid itself, not between two fluids
  - both faces are isothermal
  - "edge effects are neglected, which is the plane-wall idealisation: valid while the wall's lateral extent is large compared with its thickness"
  - the sign of `q` follows the sign of `dT`, and this calc does not know which physical face is which. It models a temperature difference across a slab, not a named hot side and cold side.

references:
  - 'Fourier, J. (1822). "Théorie analytique de la chaleur." Paris: Firmin Didot. (the origin of the law; the citation is unconfirmed - see `notes`)'

worked_example:
  source: derived from the equation above
  derivation: >
    A carbon steel plate 50 mm thick and 2 m square, with a 30 K difference between
    its faces, at a representative conductivity of 45 W/(m*K):
      k * A    = 45.0 * 2.0    = 90.0 W/K
      dT / L   = 30.0 / 0.05   = 600.0 K/m
      q = 90.0 * 600.0         = 54000.0 W
    Equivalently in one step: 45.0 * 2.0 * 30.0 / 0.05 = 2700.0 / 0.05 = 54000.0 W.
    The numbers are chosen so every intermediate is exact in binary floating point
    (45, 2, 30 and 0.05 are all exactly representable, and 0.05 is 1/20), which
    means the expected value can be asserted at a tolerance far tighter than any
    rounding would need - see the tolerance below.
  inputs: { k: 45.0, A: 2.0, dT: 30.0, L: 0.05 }
  expected: { q: 54000.0 }
  tolerance: 1.0e-12

implementations:
  python: azoth.thermal.conduction_plane_wall
  rust: azoth_thermal::conduction_plane_wall

tests:
  - id: steel_plate_worked_example
    type: worked_example
    status: active

  - id: brick_wall_different_numbers
    type: reference
    status: active
    source: >
      Derived from the equation above, with a different material and geometry from
      the worked example so that an implementation which had hardcoded the worked
      example's answer would fail: a 200 mm brick wall, 10 m^2 of face, 20 K across
      it, at k = 0.7 W/(m*K) - a representative value for brickwork.
        0.7 * 10.0 = 7.0 W/K
        20.0 / 0.2 = 100.0 K/m
        q = 7.0 * 100.0 = 700.0 W
      Every value is exact in binary floating point, so the tolerance below is a
      formality rather than a slack allowance.
    inputs: { k: 0.7, A: 10.0, dT: 20.0, L: 0.2 }
    expected: { q: 700.0 }
    tolerance: 1.0e-12

  - id: sign_follows_the_temperature_difference
    type: reference
    status: active
    source: >
      Derived from the equation above. The same wall as the worked example with
      `dT` reversed must give exactly the negated heat flow, because the calc models
      a temperature difference across a slab and not a named hot face:
        q(k=45, A=2, dT=-30, L=0.05) = -q(k=45, A=2, dT=30, L=0.05) = -54000.0 W
      This pins the sign convention, which is the one modelling decision this calc
      makes that a caller has to know about. A bound rejecting negative `dT` would
      have been the other defensible choice, and the spec says why this one was
      taken.
    inputs: { k: 45.0, A: 2.0, dT: -30.0, L: 0.05 }
    expected: { q: -54000.0 }
    tolerance: 1.0e-12

  - id: monotonic
    type: property
    property: monotonic
    status: active
  - id: round_trip_units
    type: property
    property: unit_round_trip
    status: active
