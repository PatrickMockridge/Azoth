tube_mass_flow = 10.0
shell_density = 1.5
shell_viscosity = 1.5e-5
shell_cp = 1100.0
shell_conductivity = 0.025
shell_mass_flow = 5.0
fouling_tube = 0.000176
fouling_shell = 0.000176
shell_side_method = "kern"
