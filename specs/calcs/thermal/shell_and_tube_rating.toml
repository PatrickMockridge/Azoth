id = "thermal.shell_and_tube_rating"
name = "A shell-and-tube exchanger's thermal-hydraulic rating"
equation = "h_tube = Nu * k_tube / d_f; h_shell = h_ideal * Jc * Jl * Jb * Js * Jr; 1/U = 1/h_shell + R_f_shell + d_o*ln(d_o/d_i)/(2*k_w) + (d_o/d_i)*R_f_tube + d_o/(d_f*h_tube); dP_tube = N_p*(f*L/d_f*rho*v**2/2 + 2.5*rho*v**2/2)"
latex = '''\frac{1}{U_o} = \frac{1}{h_o} + R_{f,o} + \frac{d_o \ln(d_o/d_i)}{2 k_w} + \frac{d_o}{d_i} R_{f,i} + \frac{d_o}{d_f h_i}'''
assumptions = [
    "**the port implements `calculateStrict()`, not `calculate()`.** An invalid state is refused; the permissive path's silent zeros are not published as an answer.\n",
    "**`tubeHeating` is set by the equipment path from the outlet temperature and read by no arithmetic here.** The tube correlation is Gnielinski above Re 3000, the class's 3.66 below 2300, and its own linear interpolation between.\n",
    "**`Js` is computed with the central baffle spacing three times**, as the class does, so it is exactly 1.0; the inlet and outlet spacings are never varied.\n",
    "**`bypassArea <= 0` is estimated as `(shell_id - 0.9*shell_id) * baffle_spacing`**, which the class caches on the calculator; the pure form recomputes the same number.\n",
    "**the Darcy friction factor is 64/Re below 2300 and the smooth Swamee-Jain form** `0.25/log10(5.74/Re**0.9)**2` above, the class's own helper rather than the library's Colebrook.\n",
    "**the deposit layer is validated on assignment**: a thickness that leaves `tube_id - 2*t <= 0` is refused, and a non-positive conductivity is refused even at zero thickness.\n",
    "**the outside area is `pi * tube_od * tube_length * tube_count`**, one count per physical tube and independent of passes; an inner deposit leaves it unchanged.\n",
    "**the Bell-Delaware factors are 1.0 on the Kern path**, as the class leaves them; `Jr` is 1.0 above Re 100, and `Jc` is `0.55 + 0.72*Fc`.\n",
    "**the twenty shell-side helpers are `BellDelawareMethod`'s, with its inline constants.** The port does not substitute a published correlation where the class hard-codes a coefficient.\n",
    "**the strict geometry guards are the class's**: `OD > ID`, `pitch > OD`, shell ID > OD, baffle spacing no greater than tube length, equal tubes per pass, `0 < baffle_cut < 0.5`, and the Bell-Delaware clearance bounds.\n",
]
references = [
    "Bell, K.J. (1981). \"Delaware Method for Shell-Side Design.\" In Heat Exchangers: Thermal-Hydraulic Fundamentals and Design, Hemisphere Publishing. The shell-side correction factors.",
    "Kern, D.Q. (1950). Process Heat Transfer. McGraw-Hill. The shell-side equivalent diameter and the Kern HTC and pressure-drop correlations.",
    "Gnielinski, V. (1976). \"New equations for heat and mass transfer in turbulent pipe and channel flow.\" Int. Chem. Eng. 16(2), 359-368. The tube-side Nusselt number.",
    "Swamee, P.K.; Jain, A.K. (1976). \"Explicit equations for pipe-flow problems.\" J. Hydraul. Div. ASCE 102(5), 657-664. The smooth-pipe friction factor.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/ThermalDesignCalculator.java` is the port source, with `BellDelawareMethod.java` and the two Nusselt helpers in `HeatTransferCoefficientCalculator.java`.",
    "`validation/neqsim/captures/thermal_rating_probe.tsv` - the calculator driven directly on the class's defaults, the fouling test's geometry, both shell-side methods, both pitches, all three tube-side regimes, the fouling pair, the deposit layer, a wall viscosity and a stated bypass.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/ThermalDesignCalculator.java"
edition = "`calculate()` and `calculateStrict()` with `calculateTubeSide`, `calculateShellSide` (Kern and Bell-Delaware), `calculateOverallU`, both pressure drops and `calcDarcyFriction`; the shell-side helpers are `BellDelawareMethod`'s."
[inputs]
[inputs.tube_outside_diameter]
unit = "m"
description = "the tube outside diameter, which the shell-side correlations and the outside area use. NeqSim's default is `0.01905` m.\n"
[inputs.tube_inside_diameter]
unit = "m"
description = "the nominal tube inside diameter, before any deposit layer. NeqSim's default is `0.01483` m.\n"
[inputs.tube_length]
unit = "m"
description = "the tube length, which the outside area and the straight-tube friction term use. NeqSim's default is `6.096` m.\n"
[inputs.tube_count]
unit = "dimensionless"
description = "the nominal tube count; the class requires it to divide evenly by `tube_passes`. NeqSim's default is `100`.\n"
[inputs.tube_passes]
unit = "dimensionless"
description = "the tube passes; each pass's flow area is `tube_count / tube_passes` tubes. NeqSim's default is `2`.\n"
[inputs.tube_pitch]
unit = "m"
description = "the tube pitch, which the shell-side equivalent diameter and crossflow area read. NeqSim's default is `0.02381` m.\n"
[inputs.triangular_pitch]
type = "boolean"
description = "the tube layout: `true` is triangular (staggered), `false` is square (inline). NeqSim's default is `true`.\n"
[inputs.shell_inside_diameter]
unit = "m"
description = "the shell inside diameter. NeqSim's default is `0.5` m.\n"
[inputs.baffle_spacing]
unit = "m"
description = "the central baffle spacing. NeqSim's default is `0.2` m.\n"
[inputs.baffle_count]
unit = "dimensionless"
description = "the baffle count, which the shell-side pressure drop's compartment count reads. NeqSim's default is `10`.\n"
[inputs.baffle_cut]
unit = "dimensionless"
description = "the fractional baffle cut, between zero and one half. NeqSim's default is `0.25`.\n"
[inputs.tube_wall_conductivity]
unit = "W/(m*K)"
description = "the tube-wall thermal conductivity. NeqSim's default is `52` W/(m*K), carbon steel.\n"
[inputs.tube_density]
unit = "kg/m**3"
description = "the tube-side fluid's mass density. NeqSim's default is `800` kg/m**3.\n"
[inputs.tube_viscosity]
unit = "Pa*s"
description = "the tube-side fluid's dynamic viscosity. NeqSim's default is `5e-4` Pa*s.\n"
[inputs.tube_cp]
unit = "J/(kg*K)"
description = "the tube-side fluid's specific heat capacity. NeqSim's default is `2500` J/(kg*K).\n"
[inputs.tube_conductivity]
unit = "W/(m*K)"
description = "the tube-side fluid's thermal conductivity. NeqSim's default is `0.13` W/(m*K).\n"
[inputs.tube_mass_flow]
unit = "kg/s"
description = "the tube-side mass flow. NeqSim's default is `10` kg/s.\n"
[inputs.shell_density]
unit = "kg/m**3"
description = "the shell-side fluid's mass density. NeqSim's default is `1.5` kg/m**3.\n"
[inputs.shell_viscosity]
unit = "Pa*s"
description = "the shell-side fluid's bulk dynamic viscosity. NeqSim's default is `1.5e-5` Pa*s.\n"
[inputs.shell_cp]
unit = "J/(kg*K)"
description = "the shell-side fluid's specific heat capacity. NeqSim's default is `1100` J/(kg*K).\n"
[inputs.shell_conductivity]
unit = "W/(m*K)"
description = "the shell-side fluid's thermal conductivity. NeqSim's default is `0.025` W/(m*K).\n"
[inputs.shell_mass_flow]
unit = "kg/s"
description = "the shell-side mass flow. NeqSim's default is `5` kg/s.\n"
[inputs.fouling_tube]
unit = "dimensionless"
description = "the tube-side fouling resistance in m**2*K/W, declared dimensionless because no vocabulary unit expresses it. NeqSim's default is `0.000176`.\n"
[inputs.fouling_shell]
unit = "dimensionless"
description = "the shell-side fouling resistance in m**2*K/W, likewise. NeqSim's default is `0.000176`.\n"
[inputs.tube_fouling_layer_thickness]
unit = "m"
optional = true
description = "a uniform deposit thickness measured inward from the nominal inner wall. Absent is `0`, which disables the layer.\n"
[inputs.tube_fouling_layer_conductivity]
unit = "W/(m*K)"
optional = true
description = "the deposit's thermal conductivity. Absent is the class's `1.0`; it is ignored when the thickness is zero, but a non-positive value is refused.\n"
[inputs.shell_side_method]
type = "enum"
values = ["kern", "bell_delaware"]
description = "the shell-side method. NeqSim's default is `kern`.\n"
[inputs.shell_viscosity_wall]
unit = "Pa*s"
optional = true
description = "the shell-side viscosity at the tube wall. Absent, or negative, selects the bulk viscosity, as the class does; zero is refused.\n"
[inputs.has_sealing]
type = "boolean"
optional = true
description = "whether sealing strips are installed. Absent is false.\n"
[inputs.sealing_pairs]
unit = "dimensionless"
optional = true
description = "the sealing-strip pairs. Absent is `0`; a stated seal with no pair is refused in Bell-Delaware.\n"
[inputs.tube_to_baffle_clearance]
unit = "m"
optional = true
description = "the tube-to-baffle hole clearance. Absent is the class's `0.0004` m.\n"
[inputs.shell_to_baffle_clearance]
unit = "m"
optional = true
description = "the shell-to-baffle clearance. Absent is the class's `0.003` m.\n"
[inputs.bypass_area]
unit = "m**2"
optional = true
description = "the bundle-to-shell bypass area. Absent or zero estimates it as `(shell_id - 0.9*shell_id) * baffle_spacing`, as the class does.\n"
[outputs]
[outputs.tube_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the tube-side film coefficient.\n"
[outputs.shell_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the shell-side film coefficient after the Bell-Delaware factors, or the Kern value.\n"
[outputs.overall_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the overall coefficient on the outside area, from the five resistances.\n"
[outputs.tube_side_pressure_drop]
unit = "Pa"
description = "the tube-side pressure drop over all passes, friction plus return losses.\n"
[outputs.shell_side_pressure_drop]
unit = "Pa"
description = "the shell-side pressure drop: Kern's, or Bell-Delaware's crossflow, window and end-zone terms.\n"
[outputs.tube_side_velocity]
unit = "m/s"
description = "the tube-side velocity in one pass.\n"
[outputs.shell_side_velocity]
unit = "m/s"
description = "the shell-side crossflow velocity.\n"
[outputs.tube_side_reynolds]
unit = "dimensionless"
description = "the tube-side Reynolds number on the effective flow diameter.\n"
[outputs.shell_side_reynolds]
unit = "dimensionless"
description = "the shell-side Reynolds number; Kern uses the equivalent diameter, Bell-Delaware the tube outside diameter.\n"
[outputs.effective_tube_inside_diameter]
unit = "m"
description = "`tube_inside_diameter - 2*deposit_thickness`, the flow diameter.\n"
[outputs.outside_heat_transfer_area]
unit = "m**2"
description = "`pi * tube_outside_diameter * tube_length * tube_count`.\n"
[outputs.tube_fouling_layer_resistance_outside]
unit = "dimensionless"
description = "the deposit's cylindrical resistance in m**2*K/W on the outside area; zero without a layer.\n"
[outputs.jc]
unit = "dimensionless"
description = "the baffle-cut correction factor; 1.0 on the Kern path.\n"
[outputs.jl]
unit = "dimensionless"
description = "the baffle-leakage correction factor; 1.0 on the Kern path.\n"
[outputs.jb]
unit = "dimensionless"
description = "the bundle-bypass correction factor; 1.0 on the Kern path.\n"
[outputs.js]
unit = "dimensionless"
description = "the unequal-spacing correction factor; 1.0 on the Kern path and 1.0 here because the class passes the central spacing three times.\n"
[outputs.jr]
unit = "dimensionless"
description = "the adverse-temperature-gradient correction factor; 1.0 above Re 100.\n"
