[worked_example]
source = "the capture's `defaults_kern` row at NeqSim f0c7436c, the calculator's own constructor defaults driven through `calculate()`."
derivation = "The calculator's defaults, and every line below is the capture's:\n\n  d_f = 0.01483 m;  A_tube = pi/4 * d_f**2 * (100/2) = 0.008636 m**2\n  v_tube = 10/(800 * A_tube) = 1.4473308700393204 m/s;  Re = 800 * v * d_f / 5e-4 = 34342.26688429299\n  Pr = 2500 * 5e-4 / 0.13 = 9.615385;  f = 0.25/log10(5.74/Re**0.9)**2\n  Nu = f/8 (Re - 1000) Pr / (1 + 12.7 sqrt(f/8)(Pr**(2/3) - 1)) = 2684.9\n  h_tube = Nu * 0.13 / d_f = 2353.2086219276475 W/(m**2 K)\n  De = 0.017703 m;  A_cross = 0.2 * 0.5 * (1 - 0.01905/0.02381) = 0.020000 m**2\n  v_shell = 5/(1.5 * A_cross) = 166.73669467787116 m/s;  Re_shell = 229503.17367432438\n  h_shell = 0.36 (k/De) Re**0.55 Pr**(1/3) = 505.55308270672384 W/(m**2 K)\n  1/U = 1/h_shell + 0.000176 + d_o ln(d_o/d_i)/(2*52) + (d_o/d_i)*0.000176 + d_o/(d_f*h_tube)\n  U = 336.4897827229193 W/(m**2 K)\n  dP_tube = 2*(f*6.096/d_f*800*v**2/2 + 2.5*800*v**2/2) = 19782.237035818427 Pa\n  dP_shell = 272192.1070911514 Pa\n\nThe Kern path leaves Jc, Jl, Jb, Js and Jr at 1.0, which is why the worked example does not move them.\n"
tolerance = 1e-9
[worked_example.inputs]
tube_outside_diameter = 0.01905
tube_inside_diameter = 0.01483
tube_length = 6.096
tube_count = 100
tube_passes = 2
tube_pitch = 0.02381
triangular_pitch = true
shell_inside_diameter = 0.5
baffle_spacing = 0.2
baffle_count = 10
