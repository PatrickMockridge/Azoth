max_inclusive = false
severity = "error"
rationale = "the class refuses a cut at or beyond one half."
[[valid_range]]
quantity = "tube_wall_conductivity"
min = 0
min_inclusive = false
severity = "error"
rationale = "the wall's resistance is a logarithm over this conductivity."
[[valid_range]]
quantity = "tube_mass_flow"
min = 0
min_inclusive = false
severity = "error"
rationale = "a zero flow has no velocity."
[[valid_range]]
quantity = "shell_mass_flow"
min = 0
min_inclusive = false
severity = "error"
rationale = "a zero flow has no crossflow velocity."
[[valid_range]]
quantity = "fouling_tube"
min = 0
severity = "error"
rationale = "a fouling resistance cannot be negative."
[[valid_range]]
quantity = "fouling_shell"
min = 0
severity = "error"
rationale = "a fouling resistance cannot be negative."
[[valid_range]]
quantity = "tube_fouling_layer_thickness"
min = 0
severity = "error"
rationale = "a deposit thickness cannot be negative."
[[valid_range]]
quantity = "tube_fouling_layer_conductivity"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class's setter refuses a non-positive deposit conductivity."
[[valid_range]]
quantity = "sealing_pairs"
min = 0
severity = "error"
rationale = "a pair count cannot be negative."
[[valid_range]]
quantity = "tube_to_baffle_clearance"
min = 0
severity = "error"
rationale = "a clearance cannot be negative."
[[valid_range]]
quantity = "shell_to_baffle_clearance"
min = 0
severity = "error"
rationale = "a clearance cannot be negative."
[[valid_range]]
quantity = "bypass_area"
min = 0
severity = "error"
rationale = "a bypass area cannot be negative; zero selects the class's estimate."
[worked_example]
source = "the capture's `doc_single_desuperheating` row at NeqSim f0c7436c: the class's documented zone example on its constructor defaults."
derivation = "The base request is the class's constructor state; the zone overrides the eight transport properties. The capture gives h_tube = 3313.408891395497, h_shell = 2642.339167648388 and U = 823.6629043830286 W/(m**2 K), and the area is 0.15 * 150000 / (823.6629043830286 * 40) = 0.6829250133843835 m**2.\n\nThe base's own 800/5e-4/2500/0.13 and 1.5/1.5e-5/1100/0.025 fluid properties are never read, because every zone overrides all eight.\n"
tolerance = 1e-9
[worked_example.inputs]
tube_outside_diameter = 0.01905
tube_inside_diameter = 0.01483
tube_length = 6.096
tube_count = 100
tube_passes = 2
tube_pitch = 0.02381
triangular_pitch = true
shell_inside_diameter = 0.5
baffle_spacing = 0.2
baffle_count = 10
baffle_cut = 0.25
tube_wall_conductivity = 52.0
tube_mass_flow = 10.0
shell_mass_flow = 5.0
fouling_tube = 0.000176
fouling_shell = 0.000176
shell_side_method = "kern"
zones = [{ zone_name = "desuperheating", duty_fraction = 0.15, total_duty = 150000.0, lmtd = 40.0, tube_density = 5.0, tube_viscosity = 1.2e-5, tube_cp = 2100.0, tube_conductivity = 0.025, shell_density = 998.0, shell_viscosity = 0.001, shell_cp = 4180.0, shell_conductivity = 0.60 }]
[worked_example.expected]
zone_count = 1
zones = [{ zone_name = "desuperheating", duty_fraction = 0.15, tube_side_heat_transfer_coefficient = 3313.408891395497, shell_side_heat_transfer_coefficient = 2642.339167648388, overall_heat_transfer_coefficient = 823.6629043830286, lmtd = 40.0, required_area = 0.6829250133843835 }]
[implementations]
python = "azoth.thermal.zone_rating"
rust = "azoth_thermal::zone_rating"
