  { zone_name = "subcooling", duty_fraction = 0.3, total_duty = 1500000.0, lmtd = 25.0, tube_density = 800.0, tube_viscosity = 5e-4, tube_cp = 2500.0, tube_conductivity = 0.13, shell_density = 998.0, shell_viscosity = 0.001, shell_cp = 4180.0, shell_conductivity = 0.60 },
