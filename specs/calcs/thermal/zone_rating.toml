id = "thermal.zone_rating"
name = "A shell-and-tube exchanger rated zone by zone"
equation = "U_i = evaluate(geometry, zone_i); A_i = dutyFraction_i * totalDuty_i / (U_i * lmtd_i) when U_i > 0 and lmtd_i > 0, else 0"
latex = '''A_i = \frac{f_i Q_i}{U_i \Delta T_{lm,i}}'''
assumptions = [
    "**the port implements the class's permissive `calculate()` arithmetic, and refuses the states that path would leave unanswered.** A zone whose transport properties are not positive finite is refused, not given a zero or NaN coefficient.\n",
    "**a zone overrides only the eight transport properties** - density, viscosity, cp and conductivity on each side. Mass flows, fouling, the deposit layer, wall viscosity, sealing, clearances, bypass, method and every geometry stay the base request's.\n",
    "**`required_area` is `duty_fraction * total_duty / (U * lmtd)` and is zero when either `U` or `lmtd` is non-positive**, the class's own ternary. A negative duty fraction is multiplied, not refused.\n",
    "**the class restores the eight properties after each zone but not the results.** The port computes every zone from its declared inputs, so no coefficient from an earlier zone can reach a later one.\n",
    "**`lmtd` is a caller-supplied temperature difference in K, not a computed LMTD.** This path never reads the four terminal temperatures; the zone's own number is the one used.\n",
    "**the zone name is echoed unchanged and may be empty.** The port invents no name and applies no fallback.\n",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/mechanicaldesign/heatexchanger/ThermalDesignCalculator.java` is the port source: `calculateZones`, with the nested `ZoneDefinition` and `ZoneResult`.",
    "`validation/neqsim/captures/zone_analysis_probe.tsv` - the class's documented desuperheating example, a three-zone case, Bell-Delaware with sealing, an inner deposit, degenerate properties, zero and negative LMTD, and the restore row.\n",
]
[source]
standard = "NeqSim process/mechanicaldesign/heatexchanger/ThermalDesignCalculator.java"
edition = "`calculateZones(ZoneDefinition[])` over the permissive `calculate()`; the per-zone rating arithmetic is `thermal.shell_and_tube_rating`'s, reused rather than transcribed twice."
[inputs]
[inputs.tube_outside_diameter]
unit = "m"
description = "the tube outside diameter. NeqSim's default is `0.01905` m.\n"
[inputs.tube_inside_diameter]
unit = "m"
description = "the nominal tube inside diameter, before any deposit layer. NeqSim's default is `0.01483` m.\n"
[inputs.tube_length]
unit = "m"
description = "the tube length. NeqSim's default is `6.096` m.\n"
[inputs.tube_count]
unit = "dimensionless"
description = "the tube count; it must divide evenly by `tube_passes`. NeqSim's default is `100`.\n"
[inputs.tube_passes]
unit = "dimensionless"
description = "the tube passes. NeqSim's default is `2`.\n"
[inputs.tube_pitch]
unit = "m"
description = "the tube pitch. NeqSim's default is `0.02381` m.\n"
[inputs.triangular_pitch]
type = "boolean"
description = "the tube layout: `true` is triangular. NeqSim's default is `true`.\n"
[inputs.shell_inside_diameter]
unit = "m"
description = "the shell inside diameter. NeqSim's default is `0.5` m.\n"
[inputs.baffle_spacing]
unit = "m"
description = "the central baffle spacing. NeqSim's default is `0.2` m.\n"
[inputs.baffle_count]
unit = "dimensionless"
description = "the baffle count. NeqSim's default is `10`.\n"
[inputs.baffle_cut]
unit = "dimensionless"
description = "the fractional baffle cut, between zero and one half. NeqSim's default is `0.25`.\n"
[inputs.tube_wall_conductivity]
unit = "W/(m*K)"
description = "the tube-wall thermal conductivity. NeqSim's default is `52` W/(m*K).\n"
[inputs.tube_mass_flow]
unit = "kg/s"
description = "the tube-side mass flow, which no zone overrides. NeqSim's default is `10` kg/s.\n"
[inputs.shell_mass_flow]
unit = "kg/s"
description = "the shell-side mass flow, which no zone overrides. NeqSim's default is `5` kg/s.\n"
[inputs.fouling_tube]
unit = "dimensionless"
description = "the tube-side fouling resistance in m**2*K/W, declared dimensionless because no vocabulary unit expresses it. NeqSim's default is `0.000176`.\n"
[inputs.fouling_shell]
unit = "dimensionless"
description = "the shell-side fouling resistance in m**2*K/W, likewise. NeqSim's default is `0.000176`.\n"
[inputs.shell_side_method]
type = "enum"
values = ["kern", "bell_delaware"]
description = "the shell-side method. NeqSim's default is `kern`.\n"
[inputs.tube_fouling_layer_thickness]
unit = "m"
optional = true
description = "a uniform deposit thickness measured inward from the nominal inner wall. Absent is `0`, which disables the layer.\n"
[inputs.tube_fouling_layer_conductivity]
unit = "W/(m*K)"
optional = true
description = "the deposit's thermal conductivity. Absent is the class's `1.0`; a non-positive value is refused even at zero thickness.\n"
[inputs.shell_viscosity_wall]
unit = "Pa*s"
optional = true
description = "the shell-side viscosity at the tube wall. Absent, or negative, selects the bulk viscosity; zero is refused.\n"
[inputs.has_sealing]
type = "boolean"
optional = true
description = "whether sealing strips are installed. Absent is false.\n"
[inputs.sealing_pairs]
unit = "dimensionless"
optional = true
description = "the sealing-strip pairs. Absent is `0`; a stated seal with no pair is refused in Bell-Delaware.\n"
[inputs.tube_to_baffle_clearance]
unit = "m"
optional = true
description = "the tube-to-baffle hole clearance. Absent is the class's `0.0004` m.\n"
[inputs.shell_to_baffle_clearance]
unit = "m"
optional = true
description = "the shell-to-baffle clearance. Absent is the class's `0.003` m.\n"
[inputs.bypass_area]
unit = "m**2"
optional = true
description = "the bundle-to-shell bypass area. Absent or zero estimates it as `(shell_id - 0.9*shell_id) * baffle_spacing`.\n"
[inputs.zones]
type = "record_list"
row_type = "ZoneDefinitionRow"
description = "the zones, in the caller's order; each carries its own transport properties and its caller-stated LMTD.\n"
[inputs.zones.fields]
[inputs.zones.fields.zone_name]
type = "string"
description = "the zone's name, echoed unchanged.\n"
[inputs.zones.fields.duty_fraction]
unit = "dimensionless"
description = "the zone's fraction of the total duty.\n"
[inputs.zones.fields.total_duty]
unit = "W"
description = "the exchanger's total duty, which the zone's area divides.\n"
[inputs.zones.fields.lmtd]
unit = "K"
interval = true
description = "the zone's log-mean temperature difference, supplied by the caller rather than computed.\n"
[inputs.zones.fields.tube_density]
unit = "kg/m**3"
description = "the zone's tube-side density.\n"
[inputs.zones.fields.tube_viscosity]
unit = "Pa*s"
description = "the zone's tube-side viscosity.\n"
[inputs.zones.fields.tube_cp]
unit = "J/(kg*K)"
description = "the zone's tube-side specific heat capacity.\n"
[inputs.zones.fields.tube_conductivity]
unit = "W/(m*K)"
description = "the zone's tube-side thermal conductivity.\n"
[inputs.zones.fields.shell_density]
unit = "kg/m**3"
description = "the zone's shell-side density.\n"
[inputs.zones.fields.shell_viscosity]
unit = "Pa*s"
description = "the zone's shell-side viscosity.\n"
[inputs.zones.fields.shell_cp]
unit = "J/(kg*K)"
description = "the zone's shell-side specific heat capacity.\n"
[inputs.zones.fields.shell_conductivity]
unit = "W/(m*K)"
description = "the zone's shell-side thermal conductivity.\n"
[outputs]
[outputs.zone_count]
unit = "dimensionless"
description = "the number of zones rated, which is the input list's length.\n"
[outputs.zones]
type = "record_list"
description = "one row per zone, in the input order.\n"
[outputs.zones.fields]
[outputs.zones.fields.zone_name]
type = "string"
description = "the zone's name, echoed.\n"
[outputs.zones.fields.duty_fraction]
unit = "dimensionless"
description = "the zone's duty fraction, echoed.\n"
[outputs.zones.fields.tube_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the zone's tube-side film coefficient.\n"
[outputs.zones.fields.shell_side_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the zone's shell-side film coefficient.\n"
[outputs.zones.fields.overall_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "the zone's overall coefficient on the outside area.\n"
[outputs.zones.fields.lmtd]
unit = "K"
description = "the zone's stated LMTD, echoed.\n"
[outputs.zones.fields.required_area]
unit = "m**2"
description = "`duty_fraction * total_duty / (U * lmtd)`, or zero when either denominator is non-positive.\n"
[[valid_range]]
quantity = "tube_outside_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "a diameter is positive."
[[valid_range]]
quantity = "tube_inside_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "a diameter is positive."
[[valid_range]]
quantity = "tube_length"
min = 0
min_inclusive = false
severity = "error"
rationale = "the length divides the friction term."
[[valid_range]]
quantity = "tube_pitch"
min = 0
min_inclusive = false
severity = "error"
rationale = "the pitch drives the shell-side geometry."
[[valid_range]]
quantity = "shell_inside_diameter"
min = 0
