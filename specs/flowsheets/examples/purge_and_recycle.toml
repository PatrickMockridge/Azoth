# A splitter closes a recycle: half the flow is purged, half returns to the mixer.
id = "flowsheets.example_purge_and_recycle"
name = "Split, purge and recycle"

products = ["purge"]

[[inputs]]
name = "feed_1"
components = ["methane", "n-butane"]
n = 1.0
z = [0.9, 0.1]
P = 5.0e5
T = 300.0

[[instances]]
id = "mix1"
unit = "unit_ops.mixer"

[[instances]]
id = "split1"
unit = "unit_ops.splitter"
[instances.parameters]
split_factors = [0.5, 0.5]

[[connections]]
from = "feed_1"
to = "mix1.feed"

[[connections]]
from = "mix1.product"
to = "split1.feed"

[[connections]]
from = "split1.products[0]"
to = "purge"

[[recycles]]
stream = "recycle_1"
from = "split1.products[1]"
to = "mix1.feed"

[layout.inputs]
feed_1 = [0.0, 60.0]

[layout.instances]
mix1 = [280.0, 60.0]
split1 = [560.0, 60.0]

[layout.products]
purge = [840.0, 0.0]
