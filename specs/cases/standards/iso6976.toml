model = "standards.iso6976"

[[cases]]
id = "pure_methane_15_25"
tolerance = 1e-09
source = "NeqSim master, `Standard_ISO6976` on pure methane at the volumetric reference 15.0 C and the energy reference 25.0 C, from `validation/neqsim/captures/process_gas_quality.tsv`. The reference type is `molar` and the reference state `real`; the capture prints the class's own units (g/mol and kJ/mol) and this case states SI, so the molar mass divides by 1000 and the calorific values multiply by it. **The class answers exactly these numbers**: the compression factor, the relative density and the two densities agree to the last bit, because this calc is the class's own sums."
[cases.inputs]
components = ["methane"]
z = [1.0]
volumetric_reference_temperature = 288.15
energy_reference_temperature = 298.15
[cases.expected]
molar_mass = 0.016042999999999998
compression_factor = 0.99800191
relative_density = 0.5547423719626038
density_ideal = 0.6784954068722058
density_real = 0.679853815983384
superior_calorific_value = 890630.0
inferior_calorific_value = 802600.0

