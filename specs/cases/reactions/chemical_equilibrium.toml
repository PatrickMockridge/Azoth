[[cases]]
id = "co2_h2s_water_does_not_converge"
tolerance = 1e-05
source = "The capture's second fluid, whose solve **fails**. The error settles at 117 against a tolerance of 1e-8 and NeqSim returns its last iterate with `converged` false. **The composition is deliberately not pinned**: an iterate that never converged is where two rounding paths part company rather than an answer, and this port lands elsewhere on the trace ions while reproducing the failure itself. The flag is asserted in the model's own test.\n"
