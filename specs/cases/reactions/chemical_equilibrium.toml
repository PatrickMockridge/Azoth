[[cases]]
id = "pitzer_solute_molality_basis"
tolerance = 1e-01
source = "NeqSim master, `ChemicalEquilibrium.solve` through `validation/neqsim/PitzerReactionBasisProbe.java`, whose capture is `captures/pitzer_reaction_basis_probe.tsv`. **The one state that takes the solute-molality basis**: `SystemPitzer` selects it, water's reference state is `solvent` and every other substance's is `solute`, so the activity term is `ln n_i - ln n_t` for water and `ln n_i - ln w_solvent` for the rest with `w_solvent = 0.18015 kg`. The fluid is the one `PitzerHydrogenSulfideEquilibriumTest` builds, and the answer is its **direct** solve - 14 passes, error `4.9e-10` - because the operation's own `solveChemEq` does not converge on it (`max_reaction_log_residual` 14.3). **The tolerance is loose on purpose, and what it is loose for is measured**: the port carries the answer to `4.2e-5` on CO2 and `1.5e-2` on the trace ion whose value is `1.2e-11`, and **that gap is not the conditioning**. The two kernels agree to `5.2e-10` on this state and a one-ulp change to an input moves the answer `6.9e-10`, so the matrix's amplification floor is `~1e-10` - five orders below the gap. The dominant cause is the divergence this model's own spec records: `ChemicalEquilibrium.solve` **refreshes the activity vector on every accepted step** and this port holds the caller's fixed. `PitzerReactionBasisProbe` prints the vector at the answer beside the initial one, and substituting it cuts the CO2 gap `8.3x` (`4.2e-5` to `5.0e-6`) and the worst case `7.5x`. **A residue of `5.0e-6 .. 7.7e-3` remains and conditioning does not explain it.**\n"
[cases.inputs]
a_matrix = [
    [0.0, 1.0, 0.0, 0.0, 1.0, 1.0],
    [2.0, 0.0, 1.0, 3.0, 1.0, 0.0],
    [1.0, 2.0, 1.0, 1.0, 3.0, 3.0],
    [0.0, 0.0, -1.0, 1.0, -1.0, -2.0],
]
b = [0.0100000002, 20.000000000499995, 10.0200000008, 0.0]
whole_system = false
moles = [10.0, 0.01, 1.0e-10, 1.0e-10, 1.0e-10, 1.0e-10]
chem_ref = [
    23.78310085986042,
    -32.940389825685756,
    15.342032518644482,
    64.44833840215271,
