moles = [10.0, 55.508435061791985, 0.540339675351135, 0.28239120684612296, 0.822730882197258, 0.0, 0.0, 0.0, 0.0]
T = 283.15
P = 5000000.0
[cases.expected]
phase_count = 2.0
phase_fractions = [0.119700156811226, 0.880299843188774]
minimum_trial_distance = -0.793097484269184
