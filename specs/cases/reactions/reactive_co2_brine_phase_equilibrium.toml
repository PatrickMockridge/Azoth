model = "reactions.reactive_co2_brine_phase_equilibrium"
[[cases]]
id = "the_50_bara_brine_at_rest"
tolerance = 5e-07
source = "NeqSim master, from `validation/neqsim/captures/reactive_brine_probe.tsv`: the five-component brine `BrineProbe` builds - CO2 `10` mol, water `1/0.01801528`, Na+ and K+ from the salt scale, Cl- their sum - grown to nine species by `chemicalReactionInit`, at 283.15 K and 50 bara. The expected values are the capture's phase rows. **Its `iterations = 4` and `final_reaction_log_residual = 2.1e-7` are not asserted**: the spec's assumptions record why the port's path differs, and the accepted phase inventory is what the capture and the port agree on."
