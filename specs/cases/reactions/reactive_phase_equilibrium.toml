model = "reactions.reactive_phase_equilibrium"
[[cases]]
id = "co2_water_aqueous_phase"
tolerance = 1e-06
source = "NeqSim master, from `validation/neqsim/captures/reaction_operations_probe.tsv`: the CO2-water fluid's aqueous phase after a flash, with the element matrix and the element amounts the facade built for it and the ideal Newton solve's own answer. **The LP estimate is absent on this state**, so the solve starts from the composition the phase holds and the case pins the answer rather than a seed. The phase charge is summed from the capture's `n_before`. **`error` is not pinned**: it is the quantity the loop stops on, and the bordered matrix's conditioning spreads it between the two kernels; the composition is what the case holds.\n"
[cases.inputs]
concentration_basis = "mole_fraction"
source = "standard"
seed = "none"
phase = "aqueous"
components = ["CO2", "water", "OH-", "H3O+", "HCO3-", "CO3--"]
moles = [
    1.1772758526856489e-04,
    9.999740017845612,
    1.429788322751092e-11,
    2.279087916763068e-05,
    2.2790864872950143e-05,
    8.37416022446026e-15,
]
whole_system = false
phase_charge = -1.995100962072944e-14
phase_moles = 9.99990332718923
log_activity = [
    -2.5143685467909904e-04,
    1.7483241521176751e-09,
    1.980300722914663e-04,
    -3.8031741354416226e-04,
    1.4494253645924715e-04,
    2.6309691635084675e-05,
]
T = 298.15
max_iterations = 100
tolerance = 1e-08
[cases.expected]
