model = "reactions.reactive_phase_equilibrium"
[[cases]]
id = "co2_water_aqueous_phase"
tolerance = 1e-06
source = "NeqSim master, from `validation/neqsim/captures/reaction_operations_probe.tsv`: the CO2-water fluid's aqueous phase after a flash, with the element matrix and the element amounts the facade built for it and the ideal Newton solve's own answer. **The seed is on and does nothing here**: `LinearProgrammingChemicalEquilibrium`'s program has no exact solution on this state, so the estimate is absent and the two paths start from the same composition - the divergence this case records is the adaptive-derivative refinement and the certification, and the case pins the absence as well as the answer. The phase charge is summed from the capture's `n_before`, which is the state the caller is holding. The composition agrees to `1.5e-7` relative, worst on the trace ions, at the same pass count. **`error` is not pinned**: it is the quantity the loop stops on, and the bordered matrix's conditioning (`2.5e13` here) spreads it - the capture has `3.37e-8`, the reference `2.27e-8` and the extension `3.72e-8`, which is why `converged` crosses with it.\n"
