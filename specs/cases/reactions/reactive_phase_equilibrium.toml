[[cases]]
id = "a_single_gas_phase_is_skipped"
tolerance = 1e-09
source = "The capture's gas-condensate fluid at 400 K: one gas phase after the flash, so `getReactivePhaseIndex` returns -1 and the solve is skipped. **The matrix, the element amounts and the reference potentials are still built**, as NeqSim's constructor builds them, and the composition comes back untouched - which is why this case pins all four. Whether the solve was skipped is a boolean and is asserted in the model's own test. **`b` is pinned from the capture's `b_from_moles` and not from its `b`**: the facade's `calcBVector` reads a cached `nVector` that only a solve getting past the phase search refreshes, so on this fluid it is the constructor's stale one - `3.2e-12` where the phase holds `0.01` mol of carbon.\n"
[cases.inputs]
concentration_basis = "mole_fraction"
source = "standard"
seed = "none"
phase = "gas"
components = ["CO2", "water", "OH-", "H3O+", "HCO3-", "CO3--"]
