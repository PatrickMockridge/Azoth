[[cases]]
id = "bicarbonate_brine_carries_its_spectator_charge"
tolerance = 1e-02
source = "The capture's bicarbonate brine, where the charge row is **not** zero. `HCO3-` and `CO3--` are in the reaction set and `Na+` is in no reaction the table carries, so the sodium's 0.02 mol of charge stays outside the reactive set and `b`'s last entry carries it. A port that assumed the electroneutrality row was zero passes the first case and fails here. **The composition is pinned loosely on purpose**: the bordered Lagrange matrix here has a condition number of `6.7e16`, past the double-precision limit, so its multipliers are not determined and the three trace ions land `1.99e-3` from the capture in *both* kernels and no closer. NeqSim's own two implementations part by as much. The matrix, the amounts and the potentials are exact and are pinned exactly. **`error` is not pinned**, for the reason the first case gives: the capture has `4.55e-9`, and the two kernels land either side of it.\n"
[cases.inputs]
concentration_basis = "mole_fraction"
source = "standard"
seed = "none"
phase = "aqueous"
components = ["CO2", "water", "HCO3-", "CO3--", "OH-", "H3O+"]
moles = [
