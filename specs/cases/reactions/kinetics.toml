model = "reactions.kinetics"
[[cases]]
id = "co2_water_aqueous_phase_at_298_15"
tolerance = 1e-12
source = "NeqSim master, `Kinetics.calcReacMatrix` on the aqueous phase of the water-gas-shift fluid, from `validation/neqsim/captures/kinetics_probe.tsv`. **All six rows of the rate matrix are pinned**, each against a fresh `Kinetics` object so that the fields the class never resets are read per call rather than cumulatively - the capture holds the shared object's sticky values beside them. **CO2's `phiInfinite` is the field's initial zero**, because none of the three reactions has a sibling on its own side of it and a fresh object reads back the value it was constructed with - the capture's `fresh_phi_infinite[CO2]=0.0` is that line.\n"
