model = "eos.pcsaft_phase"
[[cases]]
id = "methane_butane_vapour_against_neqsim"
tolerance = 1e-09
source = """NeqSim 3.20.0, `SystemPCSAFT` - which builds `PhasePCSAFTRahmat`, not `PhasePCSAFT` - run from `validation/neqsim/PcsaftProbe.java`: `java -cp .:neqsim-3.20.0.jar PcsaftProbe 350 30 methane 0.6 n-butane 0.4`. The probe's `volumeSAFT`, `Z` and `lnPhi` agree with the model at **2.3e-11**, **2.4e-10**, **2.0e-9** and **1.2e-9** relative, and its `d`, `md3`, `m_bar`, `S1`, `S2`, `I1`, `I2`, `C1` and three Helmholtz terms reproduce layer by layer in `crates/azoth-eos/tests/pcsaft.rs`.

**The state is a mixture on purpose.** Methane alone has `m = 1`, so `m_bar - 1` is zero and the chain term, `m_bar`'s derivatives and the whole `k_ij` column vanish: a pure-fluid case would pass with any of them wrong. This pair has `k_ij = 0.022` in the `KIJPCSAFT` column, which no shipped model read before this one.

**The numbers are the model's own, recorded from it**, with the oracle's agreement above stated rather than asserted through the digit the case compares. The probe is `validation/neqsim/PcsaftProbe.java`, and the class it drives has two recorded defects that do not touch this state: `validation/neqsim/PcsaftVolumeProbe.java` shows its volume solve leaving the physical domain at n-butane 300 K / 50 bara, and `PcsaftDVdVProbe.java` shows `PhasePCSAFT.dF_HC_SAFTdVdV`'s chain term short a factor of `dnSAFT/dV` - which `PhasePCSAFTa` inherits and `PhasePCSAFTRahmat` does not."""
[cases.inputs]
components = ["methane", "n-butane"]
T = 350.0
P = 3000000.0
z = [0.6, 0.4]
compressed_phase = "vapour"
[cases.expected]
v = 0.0008141097344383686
z_factor = 0.8392705810810248
ln_phi = [0.022979895153786956, -0.4210924858670044]
