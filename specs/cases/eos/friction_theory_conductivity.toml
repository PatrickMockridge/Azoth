[[cases]]
id = "pr_pure_methane_gas"
tolerance = 1e-12
source = "The capture's `pr_methane_300K_10bara` row: a pure gas, where both mixing rules are the identity and the dense term is the viscosity excess alone. The arithmetic, which is the spec's worked example:\n\n  Vc_cm3 = 99, M_g = 16.043\n  Fc = 1 - 0.2756*0.0115 = 0.9968306\n  T* = 1.2593*300/190.56 = 1.982525188916877\n  Omega = 1.16145*T*^-0.14874 + 0.52487*exp(-0.7732 T*) + 2.16178*exp(-2.43787 T*) = 1.179576645518974\n  eta0 = 40.785*0.9968306*sqrt(16.043*300)/(99^(2/3)*1.179576645518974) = 111.73149724549656 micropoise = 1.1173149724549656e-5 Pa s\n  alpha = Cv0/R - 1.5 = 1.81280016226185\n  beta = 0.7862 - 0.7109*0.0115 + 1.3168*0.0115^2 = 0.7781987968\n  z = 2 + 10.5*(300/190.56)^2 = 28.023656643973375\n  psi = 1 + alpha*(0.215 + 0.28288 alpha - 1.061 beta + 0.26665 z)/(0.6366 + beta z + 1.061 alpha beta) = 1.5583961077549813\n  lambda0 = 3.75*R*psi*eta0/M = 0.03384023073765177 W/(m K)\n  eucken = Cv0 + 1.25 R = 37.937229019\n  dense = (1.1403910448332615e-5 - 1.1173149724549656e-5)*37.937229019/0.016043 = 0.0005456848735737892\n  lambda = 0.03384023073765177 + 0.0005456848735737892 = 0.03438591561122556 W/(m K)\n"
[cases.inputs]
cv0 = [27.544151393999996]
tc = [190.55999999999997]
critical_volume = [9.9e-5]
omega = [0.0115]
dipole = [0.0]
molar_mass = [0.016042999999999998]
x = [1.0]
T = 300.0
viscosity = 1.1403910448332615e-5
[cases.expected]
conductivity = 0.034385915611225566
pure_component_conductivity = [0.03384023073765177]
dilute_conductivity = 0.03384023073765177
dense_conductivity = 0.0005456848735737973
