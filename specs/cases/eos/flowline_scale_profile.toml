model = "eos.flowline_scale_profile"

# Every row is the capture's, converted to SI: mg/L to kg/m3 by 1e-3, C to K by +273.15,
# bara to Pa by 1e5. An index the capture prints as NaN is an absent field here.

[[cases]]
id = "upstream_state"
tolerance = 1.0e-09
source = "The capture's `upstream_state` row: a produced water cooling from 80 C and 200 bara to 20 C and 50 bara over ten segments. Barite's index rises from 0.333 at the inlet to 1.048 at the outlet while celestite and anhydrite fall; siderite has no iron and is absent at every point.\n"
[cases.inputs]
calcium = 0.4
barium = 0.01
strontium = 0.005
iron = 0.0
magnesium = 0.15
sodium = 0.01
bicarbonate = 0.15
sulphate = 0.01
total_dissolved_solids = 40.0
co2_partial_pressure = 2.0e5
auto_ph = false
inlet_temperature = 353.15
inlet_pressure = 2.0e7
outlet_temperature = 293.15
outlet_pressure = 5.0e6
segments = 10
[cases.expected]
max_caco3 = -0.5354413918208152
max_baso4 = 1.048081964483009
max_srso4 = -2.220118043642967
max_caso4 = -2.1200032759616736
