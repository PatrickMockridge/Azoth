model = "eos.pt_phase_envelope"
[[cases]]
id = "methane_butane_from_1_bar"
tolerance = 1e-04
source = "This library's own output, recorded, except for the comparisons below. The **critical point is computed**, by `eos.critical_point`'s Heidemann-Khalil construction on the feed, and it is `374.1082 K / 98.4725 bar` - `0.21 K` and `0.50 bar` from NeqSim's `calcPTphaseEnvelope()` value of `374.3214 K / 98.9683 bar` (validation/neqsim/PhaseEnvelope.java). That is a stronger check than NeqSim is: Heidemann-Khalil is the definition, and it agrees with NeqSim to a fifth of a kelvin. The cricondenbar is `109.9172 bar`; NeqSim's envelope reports `109.8346` (0.08 bar) and NeqSim's *direct* bubble-point flash, a second opinion on the same quantity, reports `109.9576 bar at 340.0 K` (validation/neqsim/BubblePressureProbe.java) - so this sits between the two, and NeqSim's own envelope is the one furthest from its own flash. The cricondentherm is `384.0183 K` against `384.1096` (0.09 K). `residual` is the gap between where the two branches stopped, `1.16 K`; the detection that stops them is a heuristic and a coarse step can carry a branch past the critical point, which is why the critical point is not read off the trace. Every field agrees between the kernels to about `1e-10` relative. The branch extents are not declared here because a continuation trace's *point sequence* is not reproducible across implementations even when its physics is, so what this case pins is the quantities the trace computes rather than the path it took to them. **The mixture carries a `kij` and these numbers need it**: `mixture_of` resolves the pair to `0.01289789`, the value NeqSim's own classic mixing rule reads from the same `INTER.csv` row. Under `kij = 0` the cricondenbar falls to `107.85 bar` from `109.92`, which is the difference between agreeing with NeqSim and not."
[cases.inputs]
components = ["methane", "n-butane"]
z = [0.5, 0.5]
P = 100000.0
[cases.expected]
critical_temperature = 374.10816823385227
critical_pressure = 9847254.291361708
cricondenbar_temperature = 338.1730734329673
cricondenbar_pressure = 10991724.974149518
cricondentherm_temperature = 384.01825099724374
cricondentherm_pressure = 7700036.838731829
iterations = 62
