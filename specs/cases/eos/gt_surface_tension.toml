model = "eos.gt_surface_tension"
[[cases]]
id = "methane_nbutane_at_300_k_and_20_bar"
tolerance = 1e-06
source = "NeqSim master `GTSurfaceTensionFullGT.runcase` on methane/n-butane 0.5/0.5 at 300 K and 20 bar, from `validation/neqsim/captures/full_gt_probe.tsv`, where it is also model 1's gas-oil slot. The influence parameters are methane `9.634812734820117e-21` and n-butane `2.7571945977326497e-19`.\n"
[cases.inputs]
components = ["methane", "n-butane"]
eos = "srk"
influence_parameters = [9.634812734820117e-21, 2.7571945977326497e-19]
T = 300.0
P = 2000000.0
z = [0.5, 0.5]
[cases.expected]
sigma = 0.00950471504464287
