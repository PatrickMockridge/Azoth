[[cases]]
id = "co2_water_at_313_k_and_50_bar"
tolerance = 1e-06
source = "The same class on CO2/water 0.02/0.98 at 313.15 K and 50 bar. **Direct `FullGT` on this pair is robust** - unlike `GTSurfaceTensionSimple`, whose profile collapses on it - so this is a real state of the class, not model 1's gas-aqueous slot (which is GT-simple).\n"
[cases.inputs]
components = ["CO2", "water"]
eos = "srk"
influence_parameters = [3.453431599008472e-20, 1.9939776242117276e-20]
T = 313.15
P = 5000000.0
z = [0.02, 0.98]
[cases.expected]
sigma = 0.018431814630995885
