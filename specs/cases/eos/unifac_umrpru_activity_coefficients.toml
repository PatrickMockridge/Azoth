model = "eos.unifac_umrpru_activity_coefficients"
[[cases]]
id = "methanol_water_umr_at_the_reference_temperature"
tolerance = 1e-09
source = "methanol/water 0.5/0.5 at 298.15 K, from NeqSim 3.20.0's `ComponentGEUnifacUMRPRU` on the `_umr` tables. **Not the numbers `eos.unifac_activity_coefficients` carries at the same state**, although the two models' `a` matrices agree on this pair and the temperature offset vanishes here: their combinatorial terms differ - Flory-Huggins against Staverman-Guggenheim - and that alone moves both `ln gamma`. Because this pair is one the two tables share, the difference between the two cases is the combinatorial term and nothing else."
[cases.inputs]
components = ["methanol", "water"]
parameters = "umr"
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.1301457842119748, 0.21058484854616538]
gamma = [1.138994418625428, 1.23439978580613]
[[cases]]
id = "methanol_water_umrmc_at_the_reference_temperature"
tolerance = 1e-09
source = "derived from NeqSim's `UNIFACInterParamA_UMRMC` table through the same model, at the same state as the case above. The two sets are a different parameterisation - their `a` matrices differ in 370 of 4 898 cells - so the answer moving here is the whole point of the parameter set being an input rather than an inference."
[cases.inputs]
components = ["methanol", "water"]
parameters = "umrmc"
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.12324232727606305, 0.1682814563408821]
gamma = [1.131158498295627, 1.1832696025168774]
[[cases]]
id = "water_methane_umr_at_350_k"
tolerance = 1e-09
source = "derived from NeqSim's `UNIFACInterParam{A,B,C}_UMR` tables through `a_mn(T) = a_mn + b_mn (T - 298.15) + c_mn (T - 298.15)^2`. The pair is water/methane rather than methanol/water because it carries a non-zero offset in all three terms, which is what makes the reference temperature visible: at 350 K a model fitting about zero would answer differently."
[cases.inputs]
components = ["water", "methane"]
parameters = "umr"
T = 350.0
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [-0.11770245129283669, -1.015316464175723]
gamma = [0.8889605223204923, 0.36228776059156376]
