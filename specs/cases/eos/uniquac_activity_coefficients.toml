model = "eos.uniquac_activity_coefficients"
[[cases]]
id = "methanol_water_equimolar_at_298_15_k"
tolerance = 1e-09
source = "Standard UNIQUAC (Abrams-Prausnitz 1975) for methanol/water 0.5/0.5 at 298.15 K. `r`/`q` are the UNIFAC group sums, resolved from the databank; `aij` is a representative UNIQUAC pair, because no upstream table carries one. There is no differential oracle: upstream `c5ec5fb` (PR #3774) makes `ComponentGEUniquac.getGamma` throw and refuses both standalone constructors."
[cases.inputs]
components = ["methanol", "water"]
T = 298.15
x = [0.5, 0.5]
aij = [[0.0, -71.0], [209.0, 0.0]]
[cases.expected]
ln_gamma = [0.1976568551186017, 0.29402288919456004]
gamma = [1.2185441848728196, 1.3418146163712932]
