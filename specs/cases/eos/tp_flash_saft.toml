model = "eos.tp_flash_saft"
[[cases]]
id = "methane_butane_two_phase_against_neqsim"
tolerance = 1e-04
source = """NeqSim 3.20.0, `SystemSAFTVRMie` with `TPflashSAFT`, run from `validation/neqsim/SaftVrMieFlashProbe.java` - which runs the class three ways because **they disagree**. `ThermodynamicOperations.TPflash()` dispatches to it and reports a single gas phase at every state tried; so does the class run directly; and only the class run on a system that was initialised first finds the split, at `beta = 0.535808206580083` here.

**The reason is one statement of ordering.** `run()` reads `getz()` *before* its own `system.init(0)`, and on a fresh system that is `0.0` for every component - so the Rachford-Rice solves a zero feed, whose residual is identically zero, and the vapour fraction walks to zero until the loop's bound fires. The seed is fine: after its own `init(0)` the class reads the correct Wilson K-values. Written up at `~/Desktop/neqsim-tpflashsaft-reads-a-zero-feed.md`.

So the numbers a port is checked against are the `init(0)`-first ones: the probe's `x = [0.163196975571159, 0.836803024428841]`, `y = [0.978419594354518, 0.0215804056454816]`, `K = [5.99533083741967, 0.0257891174857343]`, which the model's own values below agree with to `1e-5`. The other two probe states - 350 and 200 K at 30 bara - are checked in `crates/azoth-eos/tests/tp_flash_saft.rs` against `0.970118166758440` and `0.406167928288498`.

**The tolerance is the loop's own stopping rule, not a measurement of the model**, at `1e-4`: the loop stops on a relative K change of `1e-5`, so the iterate carries that by construction through `1/(1 + beta (K-1))`, and `1e-4` is a decade above where the two kernels' own rounding lands it. The compositions are one quantity; the two kernels agree on the phase and the vapour fraction to `1e-5` either way."""
[cases.inputs]
components = ["methane", "n-butane"]
T = 250.0
P = 3000000.0
z = [0.6, 0.4]
[cases.expected]
beta = 0.5358099100649695
x = [0.1631945070550116, 0.8368054929449847]
y = [0.9784192439248908, 0.021580756075112423]
k = [5.995400724282181, 0.025789345710502048]
z_liquid = 0.12428945085670298
z_vapour = 0.8971134509509505
phase = "two_phase"
