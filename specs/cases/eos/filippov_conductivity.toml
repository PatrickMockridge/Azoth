[cases.inputs]
liquid_conductivity = [[-0.384, 0.00525, -6.37e-6]]
molar_mass = [0.018015]
z = [1.0]
tc = [647.3]
pc = [22089000.0]
T = 300.0
P = 100000000.0
filippov_coefficient = 0.72
use_pressure_correction = true
