model = "eos.unifac_activity_coefficients"
[[cases]]
id = "acetone_n_hexane_equimolar_at_298_15_k"
tolerance = 1e-09
source = "NeqSim 3.20.0 `ComponentGEUnifac.getGamma` for acetone/n-hexane 0.5/0.5 at 298.15 K, via `validation/neqsim/UnifacGamma.java`, which synchronises the group array NeqSim's own constructor leaves empty. The group tables resolve from NeqSim's UNIFACcomp/UNIFACGroupParam/UNIFACInterParam."
[cases.inputs]
components = ["acetone", "n-hexane"]
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.42003577558486405, 0.4424161881344282]
gamma = [1.522016005657412, 1.556463387246744]
[[cases]]
id = "methanol_water_equimolar_at_298_15_k"
