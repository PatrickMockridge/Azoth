model = "eos.unifac_activity_coefficients"
[[cases]]
id = "acetone_n_hexane_equimolar_at_298_15_k"
tolerance = 1e-09
source = "Standard UNIFAC (Hansen et al. 1991) for acetone/n-hexane 0.5/0.5 at 298.15 K. No differential oracle exists - see the spec's assumptions and `validation/neqsim/FlashTp.java` - so the expected values are the published model's, and the group tables resolve from NeqSim's UNIFACcomp/UNIFACGroupParam/UNIFACInterParam."
[cases.inputs]
components = ["acetone", "n-hexane"]
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.42003577558486405, 0.4424161881344282]
gamma = [1.522016005657412, 1.556463387246744]
[[cases]]
id = "methanol_water_equimolar_at_298_15_k"
tolerance = 1e-09
source = "Standard UNIFAC (Hansen et al. 1991) for methanol/water 0.5/0.5 at 298.15 K. No differential oracle exists - see the spec's assumptions and `validation/neqsim/FlashTp.java` - so the expected values are the published model's, and the group tables resolve from NeqSim's UNIFACcomp/UNIFACGroupParam/UNIFACInterParam."
[cases.inputs]
components = ["methanol", "water"]
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.109465434560284, 0.18285472222380844]
gamma = [1.1156815062468024, 1.200639969105366]
