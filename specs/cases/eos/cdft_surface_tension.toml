[[cases]]
id = "methane_nbutane_at_300_k_and_20_bar"
tolerance = 1e-05
source = "The mixture branch on methane/n-butane 0.5/0.5 at 300 K and 20 bar, from the same capture. The tolerance is the branch's own conditioning: its equilibrium potentials are a central difference that leaves about nine digits, and the class's answer is a floating-point artefact at that precision.\n"
[cases.inputs]
components = ["methane", "n-butane"]
eos = "srk"
T = 300.0
x_liquid = [0.09542082642782022, 0.9045791735721797]
x_vapour = [0.8356249351028912, 0.1643750648971088]
molar_volume_liquid = 1.0590737562944744e-4
molar_volume_vapour = 0.001153452734177525
[cases.expected]
sigma = 0.004745726951688798
