model = "eos.cdft_surface_tension"
[[cases]]
id = "methane_at_150_k_pr"
tolerance = 1e-10
source = "NeqSim master `CDFTSurfaceTension.solvePureComponent` on methane at its 150 K bubble point (10.4716 bar), from `validation/neqsim/captures/cdft_probe.tsv`; the two states are the saturated pair the bubble-point flash produced, which is the only two-phase state a pure fluid has.\n"
[cases.inputs]
components = ["methane"]
eos = "pr"
T = 150.0
x_liquid = [1.0]
x_vapour = [1.0000000011004573]
molar_volume_liquid = 4.128785631897625e-5
molar_volume_vapour = 9.709562218655069e-4
[cases.expected]
sigma = 0.002875574857984931
