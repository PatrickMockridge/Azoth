model = "eos.hydrate_risk_map"

[[cases]]
id = "four_points"
tolerance = 1e-03
source = "The capture's `four_points` row: the class's four-point profile on a wet gas: a warm inlet, two points inside the hydrate region and the cold outlet.\n"
[cases.inputs]
components = ["methane", "ethane", "propane", "water"]
z = [0.82,0.06,0.03,0.09]
distances = [0.0,10000.0,25000.0,50000.0]
pressures = [10000000.0,9500000.0,8000000.0,6000000.0]
temperatures = [303.15,298.15,288.15,281.15]
eos = "srk"
hydrate_model = "pvtsim"
[cases.expected]
overall_risk = "critical"
critical_point_count = 2
unknown_point_count = 0
total_points = 4
minimum_subcooling = -9.206761518400754
points = [
    { distance = 0.0, pressure = 10000000.0, actual_temperature = 303.15, hydrate_temperature = 293.627585881478, subcooling = 9.522414118521965, risk_level = "low" },
    { distance = 10000.0, pressure = 9500000.0, actual_temperature = 298.15, hydrate_temperature = 293.3304441618965, subcooling = 4.819555838103497, risk_level = "medium" },
    { distance = 25000.0, pressure = 8000000.0, actual_temperature = 288.15, hydrate_temperature = 292.2840773927619, subcooling = -4.134077392761924, risk_level = "critical" },
    { distance = 50000.0, pressure = 6000000.0, actual_temperature = 281.15, hydrate_temperature = 290.35676151840073, subcooling = -9.206761518400754, risk_level = "critical" },
]

