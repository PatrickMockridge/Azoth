model = "eos.pr_cpa_phase"
[[cases]]
id = "water_methanol_pr_liquid"
tolerance = 1e-09
source = """**This model's own values, because NeqSim 3.20.0 has no PR-CPA answer to compare against.** `validation/neqsim/PrCpaFlash.java` builds `SystemPrCPA` at this state and prints `phase_sites=0` beside `component_sites=4,2`. `PhaseSrkCPA` sums its components' sites in its init path (`PhaseSrkCPA.java:138-155`) and **`PhasePrCPA` has the field, the getter and the setter and no block that ever sets it**, so every association term it computes is computed over nothing. The same is true of the newer checkout (`805cf0f`), so it is open upstream. Setting the count from outside would be reimplementing the missing block in the oracle, which is not NeqSim's answer.

**And the rest of it is not a Peng-Robinson either.** `validation/neqsim/PrCpaSubstitution.java` runs a pair that associates in neither through both classes and prints the components: NeqSim's PR-CPA carries the **SRK** `Omega_a`/`Omega_b` - `0.427480233540342` and `0.08664034996483` at methane, to fifteen digits, against Peng-Robinson's `0.45724`/`0.07780` - and, where a component has one, the **`aCPA_SRK`/`bCPA_SRK`** fit with its acentric factor back-solved from `mCPA_SRK`. So its answer is a third model, not a wrong version of this one, and this case records the model. Write-up: `~/Desktop/neqsim-pr-cpa-is-not-a-peng-robinson.md`.

Both kernels compute these numbers and `test_cross_impl` runs the case through each, so the PR family's columns and its `cpakij_PR` column - read by no shipped model before this one - are compared in two languages. The state mirrors `eos.srk_cpa_phase`'s case so the two families read side by side.

**The departures moved by 28% when the association's departure term was corrected**, and that this case did not notice is the point: nothing ran it. The term carried a spurious `A/(RT)` beside `-T d(A/RT)/dT`; `eos.umr_cpa_phase`'s oracle found it, and `test_model_cases.py` is the floor that now runs every case's recorded values."""
[cases.inputs]
components = ["water", "methanol"]
eos = "pr"
associating = true
T = 300.0
P = 10000000.0
z = [0.6, 0.4]
compressed_phase = "liquid"
[cases.expected]
z_factor = 0.1075970257848238
ln_phi = [-7.317420134313837, -7.878653311740308]
h_res = -43490.57273629496
s_res = -82.26162261793057
