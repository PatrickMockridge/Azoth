[[cases]]
id = "the_pure_two_phase_state_needs_its_entropy"
tolerance = 0.001
source = "`process_equilibrium_sound_speed.tsv`'s `two_phase_co2` row: the feed's isentrope at 40 bara, a two-phase state whose equilibrium speed (`57.08`) is a fifth of the frozen phase value (`408.76`). The state's entropy is stated because a pure fluid on its saturation line has no unique temperature at a pressure."
[cases.inputs]
components = ["CO2"]
T = 278.5666675376772
P = 4000000.0
z = [1.0]
specific_entropy = -1537.9517199354361
[cases.expected]
sound_speed = 57.08170902262859
status = "converged"
stencil = "central"

