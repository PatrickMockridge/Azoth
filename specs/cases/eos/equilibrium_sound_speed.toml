model = "eos.equilibrium_sound_speed"

[[cases]]
id = "the_dense_single_phase_matches_the_frozen_phase_speed"
tolerance = 0.001
source = "`process_equilibrium_sound_speed.tsv`'s `dense_co2` row: CO2 at 298.15 K and 150 bara, where the equilibrium speed (`456.226`) and the frozen phase value (`456.226`) coincide."
[cases.inputs]
components = ["CO2"]
T = 298.15
P = 15000000.0
z = [1.0]
[cases.expected]
sound_speed = 456.22605621637035
status = "converged"
stencil = "central"
specific_entropy = -1537.9517199354361

[[cases]]
id = "the_dilute_gas_is_the_ideal_gas_limit"
tolerance = 0.001
source = "`process_equilibrium_sound_speed.tsv`'s `dilute_nitrogen` row: nitrogen at 350 K and 100 Pa, within `2e-4` of `sqrt(gamma R T / M)` in the pinned test."
