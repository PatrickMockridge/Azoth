model = "eos.desmukh_mather_phase"
[[cases]]
id = "mdea_plus_chloride_co2_at_313_k"
tolerance = 1e-08
source = "NeqSim 3.20.0 `ComponentDesmukhMather.getGamma` and `fugcoef`, on a live `SystemDesmukhMather`: validation/neqsim/GeElectrolyteProbe.java. **The pair sum is live here**: MDEA+/CO2 is one of the four nonzero `aijDesMath` rows, and it is why MDEA+'s and Cl-'s `ln_gamma` differ by exactly `2 * 0.0678732 * m_CO2` although both are monovalent ions at the same molality."
[cases.inputs]
components = ["water", "MDEA+", "Cl-", "CO2"]
T = 313.15
P = 500000.0
x = [0.89, 0.04, 0.04, 0.03]
[cases.expected]
gamma = [1.12359550561798, 0.429375480220153, 0.333064679011398, 1.57647906673492]
ln_gamma = [0.116533816255951, -0.84542349758949, -1.09941857659668, 0.455193921598877]
molality = [
    55.509297807382744,
    2.494799901455404,
    2.494799901455404,
    1.871099926091553,
]
ionic_strength = 2.494799901455404
solvent_molar_mass = 0.018015
ln_phi = [
    -4.09271615638785,
    -34.538776394910684,
    -34.538776394910684,
    3.1621179888375215,
]
[[cases]]
id = "sodium_chloride_at_313_k"
tolerance = 1e-08
source = "The same probe. **Every pair here is zero**, from a zero row or from no row at all, so this is the Debye-Huckel term alone - and the two ions' `ln_gamma` agreeing is what says the pair sum contributes nothing where the table carries nothing. Water's `gamma` is exactly `1/x_water` because its own pair sum is zero and the conversion is `m M / x`."
[cases.inputs]
components = ["water", "Na+", "Cl-"]
T = 313.15
P = 500000.0
x = [0.90, 0.05, 0.05]
[cases.expected]
gamma = [1.11111111111111, 0.302269779010361, 0.302269779010361]
ln_gamma = [0.105360515657826, -1.19643535238806, -1.19643535238806]
molality = [55.509297807382744, 3.08384987818793, 3.08384987818793]
ionic_strength = 3.08384987818793
solvent_molar_mass = 0.018015
ln_phi = [-4.1038894569859705, -34.538776394910684, -34.538776394910684]
[[cases]]
id = "water_methanol_sodium_chloride_at_313_k"
tolerance = 1e-08
source = "The same probe. **A two-component solvent**, which is the case `REFERENCESTATETYPE` selects for: methanol is tagged `solvent` and carries a real Antoine row, so it joins water in the solvent weight and the mean molar mass is `0.0187943` - neither component's. Water's `gamma` is then `1.11111` rather than the `1.17647` a water-only solvent would give, so a port that matched the name instead of the reference state is wrong on this brine and right on the other two."
[cases.inputs]
components = ["water", "methanol", "Na+", "Cl-"]
T = 313.15
P = 500000.0
x = [0.85, 0.05, 0.05, 0.05]
[cases.expected]
gamma = [1.11111111111111, 1.11111111111111, 0.307561742004006, 0.307561742004006]
ln_gamma = [0.105360515657826, 0.105360515657826, -1.17907942488568, -1.17907942488568]
molality = [50.251701906904295, 2.9559824651120175, 2.9559824651120175, 2.9559824651120175]
ionic_strength = 2.9559824651120175
solvent_molar_mass = 0.018794277777777774
ln_phi = [
    -4.1038894569859705,
    -2.5413181254443002,
    -34.538776394910684,
    -34.538776394910684,
]
