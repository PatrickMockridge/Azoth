model = "eos.scale_control_assessor"

# The capture's `control_assessor` rows. mg/L to kg/m3 by 1e-3, C to K by +273.15,
# bara to Pa by 1e5. An absent index is an omitted record field.

[[cases]]
id = "rca_state"
tolerance = 1.0e-09
source = "The capture's `rca_state` row: the RCA test's water at 80 C, 100 bara and pH 7 with a calcite phosphonate inhibitor at SR 1.6852 and a 20 mg/L dose. The calcite risk falls to -2.1874 while barite stays at its index.\n"
[cases.inputs]
calcium = 2.0
barium = 0.05
strontium = 0.0
iron = 0.0
magnesium = 0.0
sodium = 20.0
bicarbonate = 0.8
sulphate = 0.5
total_dissolved_solids = 80.0
temperature = 353.15
pressure = 1.0e7
co2_partial_pressure = 2.0e5
ph = 7.0
inhibitors = [
    { scale_type = "caco3", inhibitor_chemistry = "phosphonate", temperature = 353.15, saturation_ratio = 1.6851624454329173, total_dissolved_solids = 80.0, calcium = 2.0, available_dose = 0.02 },
]
[cases.expected]
thermodynamic_si = [
    { scale = "CACO3", saturation_index = 0.22664177212405553 },
    { scale = "BASO4", saturation_index = 2.4351734337231576 },
    { scale = "SRSO4" },
    { scale = "CASO4", saturation_index = -0.09682449444821394 },
    { scale = "FECO3" },
]
kinetic_risk_index = [
    { scale = "CACO3", risk_index = -2.187371248783493 },
    { scale = "BASO4", risk_index = 2.4351734337231576 },
    { scale = "SRSO4" },
    { scale = "CASO4", risk_index = -0.09682449444821394 },
    { scale = "FECO3" },
]
worst_kinetic_risk_index = 2.4351734337231576
kinetically_controlled = false

