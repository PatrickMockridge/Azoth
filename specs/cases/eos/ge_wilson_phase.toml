model = "eos.ge_wilson_phase"
[[cases]]
id = "octane_decane_lean_at_350_k_1_bar"
tolerance = 1e-08
source = "NeqSim master `getFugacityCoefficient`, as the first case: validation/neqsim/GeWilsonPhi.java. Both members carry a real vapour-pressure row, unlike the heavy pseudo-components, so no part of this state rests on a repeated tuple and NeqSim confirms both components."
[cases.inputs]
components = ["n-octane", "nc10"]
T = 350.0
P = 100000.0
x = [0.4, 0.6]
[cases.expected]
gamma = [1.3244982894719637, 1.2690654430682413]
ln_gamma = [0.28103373827725736, 0.23828075798428433]
ln_phi = [-0.7223683220963804, -2.469267539112864]
p_sat = [36663.00196112154, 6670.013533199678]
[[cases]]
id = "heptane_nonane_at_320_k_1_bar"
tolerance = 1e-08
source = "NeqSim master `getFugacityCoefficient`, as the first case: validation/neqsim/GeWilsonPhi.java. The lightest pair here, and the one the Wilson correlation's own parameterisation covers best: it is a paraffin-wax model, and both members are well inside its range."
[cases.inputs]
components = ["n-heptane", "n-nonane"]
T = 320.0
P = 100000.0
x = [0.6, 0.4]
[cases.expected]
gamma = [1.11569378278132, 1.6877976784227413]
ln_gamma = [0.10947643811901124, 0.5234245302358307]
ln_phi = [-1.2171489374520243, -2.6890676330028507]
p_sat = [26537.12803675743, 4025.616322494449]
[[cases]]
id = "water_co2_at_298_15_k_1_bar"
tolerance = 1e-09
source = "NeqSim master `PhaseGEWilson` via `ComponentGE.fugcoef`, run from validation/neqsim/GeHenryProbe.java and captures/ge_henry_probe.tsv. **The aqueous Henry arm.** CO2 is tagged `solute`, so it takes `(gamma/gamma^inf) H / P`; the phase carries water, so `H` is the IAPWS G7-04 value (`1656.4458917920526` bar) and shadows the databank row's `51.65`. `gamma_inf` is the Wilson correlation on the solute-water pair at `[1e-11, 1 - 1e-11]`."
[cases.inputs]
components = ["water", "CO2"]
T = 298.15
P = 100000.0
x = [0.98, 0.02]
[cases.expected]
gamma = [1.0002027278421228, 2.6635921591267024]
ln_gamma = [0.00020270729561069683, 0.9796756475372412]
ln_phi = [-3.448478538071742, 7.392429559187266]
p_sat = [3178.7528699883305, 0.0]
henry = [0.0, 165644589.17920527]
gamma_inf = [1.0, 2.7174002841642664]
[[cases]]
id = "methanol_co2_at_298_15_k_10_bar"
tolerance = 1e-09
source = "NeqSim master `PhaseGEWilson`, as the aqueous case: validation/neqsim/GeHenryProbe.java and captures/ge_henry_probe.tsv. **The no-water arm.** With no water component there is no IAPWS reference and no pair, so `H` is the databank's CO2 row (`51.654509287851646` bar) and `gamma^inf` is the full composition cloned with CO2 at `x = 1e-10` and the rest renormalised."
[cases.inputs]
components = ["methanol", "CO2"]
T = 298.15
P = 1000000.0
x = [0.98, 0.02]
[cases.expected]
gamma = [1.0002027278279388, 2.6633472699415957]
ln_gamma = [0.0002027072814295844, 0.9795837038654425]
ln_phi = [-4.07783075367807, 1.621992407101495]
p_sat = [16940.747558344778, 0.0]
henry = [0.0, 5165450.928785165]
gamma_inf = [1.0, 2.7171504438636984]
