model = "eos.ge_wilson_phase"
[[cases]]
id = "octane_decane_lean_at_350_k_1_bar"
tolerance = 1e-08
source = "NeqSim master `getFugacityCoefficient`, as the first case: validation/neqsim/GeWilsonPhi.java. Both members carry a real vapour-pressure row, unlike the heavy pseudo-components, so no part of this state rests on a repeated tuple and NeqSim confirms both components."
[cases.inputs]
components = ["n-octane", "nc10"]
T = 350.0
P = 100000.0
x = [0.4, 0.6]
[cases.expected]
gamma = [1.3244982894719637, 1.2690654430682413]
ln_gamma = [0.28103373827725736, 0.23828075798428433]
ln_phi = [-0.7223683220963804, -2.469267539112864]
p_sat = [36663.00196112154, 6670.013533199678]
[[cases]]
id = "heptane_nonane_at_320_k_1_bar"
tolerance = 1e-08
source = "NeqSim master `getFugacityCoefficient`, as the first case: validation/neqsim/GeWilsonPhi.java. The lightest pair here, and the one the Wilson correlation's own parameterisation covers best: it is a paraffin-wax model, and both members are well inside its range."
[cases.inputs]
components = ["n-heptane", "n-nonane"]
T = 320.0
P = 100000.0
x = [0.6, 0.4]
[cases.expected]
gamma = [1.11569378278132, 1.6877976784227413]
ln_gamma = [0.10947643811901124, 0.5234245302358307]
ln_phi = [-1.2171489374520243, -2.6890676330028507]
p_sat = [26537.12803675743, 4025.616322494449]
