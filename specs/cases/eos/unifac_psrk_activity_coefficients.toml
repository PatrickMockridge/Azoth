model = "eos.unifac_psrk_activity_coefficients"
[[cases]]
id = "methanol_water_equimolar_at_298_15_k"
tolerance = 1e-09
source = "Standard UNIFAC (Hansen et al. 1991) for methanol/water 0.5/0.5 at 298.15 K - the same case `eos.unifac_activity_coefficients` carries, and rightly the same numbers: this pair's `b` and `c` are both zero in NeqSim's PSRK tables, so at every temperature PSRK must reproduce plain UNIFAC exactly. This is the one case here that is checked against something outside the library."
[cases.inputs]
components = ["methanol", "water"]
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.109465434560284, 0.18285472222380844]
gamma = [1.1156815062468024, 1.200639969105366]
[[cases]]
id = "water_methane_equimolar_at_250_k"
tolerance = 1e-09
source = "derived from NeqSim's `UNIFACInterParam`/`B`/`C` tables through the equation `a_mn(T) = a_mn + b_mn T + c_mn T^2`. There is no differential oracle - NeqSim's `ComponentGEUnifacPSRK` returns NaN - so this value is this library's own output at a pair whose `b` and `c` are non-zero, recorded so a change to the temperature dependence cannot pass unnoticed."
[cases.inputs]
components = ["water", "methane"]
T = 250.0
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.8381920105028207, 0.9674010863177143]
gamma = [2.3121827932351917, 2.631097570496052]
[[cases]]
id = "water_methane_equimolar_at_400_k"
tolerance = 1e-09
source = "derived from NeqSim's `UNIFACInterParam`/`B`/`C` tables through `a_mn(T) = a_mn + b_mn T + c_mn T^2`, the second temperature the first case cannot supply. `c_7,57` is non-zero and negative, so the interaction does not move linearly with `T` between the two."
[cases.inputs]
components = ["water", "methane"]
T = 400.0
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.887381334379193, 0.8684378121136531]
gamma = [2.4287612030473236, 2.3831849613326668]
