model = "eos.liquid_conductivity_polynom"
[[cases]]
id = "co2_water_aqueous_phase"
tolerance = 1e-12
source = "NeqSim master, the aqueous phase of a CO2-water fluid at 313.15 K and 50 bar, from `validation/neqsim/captures/phase_transport_probe.tsv`. Its `conductivityCalc` is the liquid `Conductivity` class - the polynom model - and not PFCT's, which is the dispatch this id exists for. **The weighting is the test**: the phase is 99.93 per cent water by moles, so a mole-weighted mean would answer 0.6354 where the mass-weighted one answers 0.6344.\n"
[cases.inputs]
liquid_conductivity = [
    [0.251502, 0.0005238919, -3.82111e-06],
    [-0.384, 0.00525, -6.37e-06],
]
molar_mass = [0.04401, 0.018015]
z = [0.0006691762234084198, 0.9993308237765915]
T = 313.15
[cases.expected]
k = 0.6344057039895419
[[cases]]
id = "methane_nbutane_oil_phase"
tolerance = 1e-12
source = "The capture's `methane_nbutane_300K_20bar` row: the **oil** phase's conductivity, which NeqSim computes with PFCT and this id computes anyway - the inputs are its LIQCOND polynomials, so the case records what the polynom model answers on a phase that does not use it. That the two differ is the point: `eos.thermal_conductivity` answers `0.09534463941597507` for this phase, and this model answers another number from the same state.\n"
[cases.inputs]
liquid_conductivity = [
    [0.290304, -0.0004720407, -4.320339e-06],
    [0.24688, -0.0004719916, -6.249512e-08],
]
molar_mass = [0.016043, 0.058123]
z = [0.09542082642782022, 0.9045791735721797]
T = 300.0
[cases.expected]
k = 0.09683839660866919
