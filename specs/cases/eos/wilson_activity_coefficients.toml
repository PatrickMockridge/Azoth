model = "eos.wilson_activity_coefficients"
[[cases]]
id = "n_butane_nc12_equimolar_at_298_15_k"
tolerance = 1e-09
source = "NeqSim 3.20.0 `ComponentGEWilson.getWilsonActivityCoefficient` for n-butane/nc12 0.5/0.5 at 298.15 K. The molar mass and critical temperature are the databank rows `components` resolves to."
[cases.inputs]
components = ["n-butane", "nc12"]
T = 298.15
x = [0.5, 0.5]
[cases.expected]
ln_gamma = [0.19314718055973779, 0.49999935609153545]
gamma = [1.213061319425015, 1.648720209074888]
