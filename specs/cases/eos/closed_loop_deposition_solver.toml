inhibitor_efficiency = 0.0
tolerance = 0.0001
max_iterations = 10
eos = "srk"
[cases.expected]
iterations_taken = 3
converged = true
final_effective_diameter = 0.08794649351135078
diameter_history = [0.1, 0.08794649351135078, 0.08794649351135078]
