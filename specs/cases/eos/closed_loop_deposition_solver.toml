model = "eos.closed_loop_deposition_solver"

# The capture's eight solves at 80 mol/s on the 1000 m, 0.1 m line. mg/L to kg/m3 by 1e-3,
# the class's year as 31557600 s, mm to m by 1e-3.

[[cases]]
id = "base_1yr"
tolerance = 1.0e-5
source = "The capture's `base_1yr` row: a one-year service whose first step already meets the 1e-4 m tolerance, so the loop stops at one iteration.\n"
[cases.inputs]
components = ['methane', 'CO2', 'water']
inlet_n = 80.0
inlet_z = [0.85, 0.05, 0.1]
inlet_p = 1.0e7
inlet_t = 333.15
length = 1000.0
diameter = 0.1
elevation = 0.0
number_of_increments = 10
roughness = 1e-05
calcium = 1.0
bicarbonate = 0.5
sulphate = 0.1
barium = 0.01
sodium = 20.0
total_dissolved_solids = 50.0
ph = 6.5
service_time = 31557600.0
scale_density = 2700.0
base_rate = 1.5844043908606944e-08
inhibitor_efficiency = 0.0
tolerance = 0.0001
max_iterations = 10
eos = "srk"
[cases.expected]
iterations_taken = 1
converged = true
final_effective_diameter = 0.09998794649351135
diameter_history = [0.1]
max_thickness_history = [6.026753244324614e-06]
velocity_history = [2.347648653523357]

[[cases]]
id = "service_1000yr"
tolerance = 1.0e-5
source = "The capture's `service_1000yr` row: a 6.03 mm thickness whose step is wider than the tolerance, so the loop runs three iterations and converges when the step repeats itself.\n"
[cases.inputs]
components = ['methane', 'CO2', 'water']
