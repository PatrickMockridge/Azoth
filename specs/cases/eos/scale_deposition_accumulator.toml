model = "eos.scale_deposition_accumulator"

# The capture's `scale_deposition` rows. mg/L to kg/m3 by 1e-3, bara to Pa by 1e5,
# the class's year as 31557600 s, mm to m by 1e-3. The isothermal pipe's temperature list
# is one value, so its one segment spans the whole length; the cooled pipe has eleven.

[[cases]]
id = "base"
tolerance = 1.0e-09
source = "The capture's `base` row on the isothermal pipe: one segment at 60 C and 100 bara, a CaCO3 index of 0.0139, 5.112 kg of deposit and a half-blockage in 4148 years.\n"
[cases.inputs]
calcium = 1.0
bicarbonate = 0.5
sulphate = 0.1
barium = 0.01
sodium = 20.0
total_dissolved_solids = 50.0
ph = 6.5
diameter = 0.1
length = 1000.0
segment_temperatures = [333.15]
segment_pressures = [1.0e7]
service_time = 31557600.0
scale_density = 2700.0
base_rate = 1.5844043908606944e-8
inhibitor_efficiency = 0.0
[cases.expected]
total_deposition_mass = 5.112073003689538
max_thickness = 6.026753244324613e-6
time_to_blockage = 130906305271.9047
segments = [
    { saturation_index = 0.013908764040233352, deposition_mass = 5.112073003689538, thickness = 6.026753244324613e-6 },
]

