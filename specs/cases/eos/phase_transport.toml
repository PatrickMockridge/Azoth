model = "eos.phase_transport"
[[cases]]
id = "methane_nitrogen_298k_1atm_gas"
tolerance = 1e-4
source = "The capture's `methane_nitrogen_298k_1atm` row, its **gas** phase: NeqSim's `PhysicalProperties` for that phase kind, whose model classes the same row prints. The viscosity and the conductivity are its own numbers, and the model's own test holds the matrix to them; **the effective vector is not stated here** because the class leaves it at zero on a liquid - its `SiddiqiLucasMethod` never computes one - and `eos.effective_diffusion` is what the port assembles instead. See the model's assumptions. **The tolerance is the PFCT conductivity's own band** - the port's `eos.thermal_conductivity` case is stated at `1e-5` and this state measures `5.7e-5`, because the correlation's reference methane flash is a solve of its own - and the viscosity and the matrix agree to `1e-9` well inside it.\n"
[cases.inputs]
components = ["methane", "nitrogen"]
phase = "gas"
T = 298.15
P = 101325.0
z = [0.5, 0.5]
[cases.expected]
mu = 1.4506127676908967e-05
k = 0.029958794899910723
