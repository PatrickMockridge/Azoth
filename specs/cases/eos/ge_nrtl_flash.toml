model = "eos.ge_nrtl_flash"
[[cases]]
id = "methanol_water_equimolar_at_350_k_1_bar"
tolerance = 1e-08
source = "NeqSim 3.20.0 `SystemNRTL` - `PhaseSrkEos` over `PhaseGENRTL` - driven through the gamma-phi update of `TPflash.sucsSubsGammaPhi` by validation/neqsim/NrtlGammaPhiFlash.java. The tolerance is not tighter because azoth stops on `rms |d ln K|` of 1e-10 and successive substitution amplifies that into the compositions: at the stopping point the two agree to about 6e-11 relative, and the fixed point both approach is beta = 0.73837882729015591."
[cases.inputs]
components = ["methanol", "water"]
T = 350.0
P = 100000.0
z = [0.5, 0.5]
eos = "srk"
[cases.expected]
beta = 0.7383788272348035
x = [0.15024680583034586, 0.8497531941696541]
y = [0.623923977040005, 0.37607602295999487]
k = [4.152660508281079, 0.4425708847658819]
ln_phi_liquid = [1.407971375990098, -0.8255925261695424]
ln_phi_vapour = [-0.01577783917724521, -0.0104378903674061]
z_vapour = 0.9861438898397017
phase = "two_phase"
