model = "eos.pcsaft_rahmat_phase"
[[cases]]
id = "methane_butane_vapour_against_neqsim"
tolerance = 1e-09
source = """NeqSim master, `SystemPCSAFT` - the only non-associating PC-SAFT it has, building `PhasePCSAFTRahmat` - run from `validation/neqsim/PcsaftProbe.java`: `java -cp .:neqsim-f0c7436.jar PcsaftProbe 350 30 methane 0.6 n-butane 0.4`. Its `volumeSAFT`, `Z` and two `lnPhi` values agree at **1.2e-9**, **1.2e-9**, **3.8e-8** and **2.4e-10** relative - the third is methane's, whose `ln phi` here is `0.023`, so a `1e-9` state difference reads as `4e-8` on it - and its `d`, `md3`, `m_bar`, `S1`, `S2`, `I1`, `I2`, `C1` and three Helmholtz terms reproduce in `crates/azoth-eos/tests/pcsaft.rs`.

**The state is a mixture on purpose.** Methane alone has `m = 1`, so `m_bar - 1` is zero and the chain term, `m_bar`'s derivatives and the whole `k_ij` column vanish: a pure-fluid case would pass with any of them wrong. This pair has `k_ij = 0.022` in the `KIJPCSAFT` column, which no shipped model read before this one.

**The numbers are the model's own, recorded from it**, with the oracle's agreement stated rather than asserted through the digit the case compares; they moved in the twelfth digit when the vapour solve's Newton was given the sign its residual needs. `validation/neqsim/PcsaftCompositionProbe.java` differences NeqSim's own `getF()` at fixed temperature and volume, so the derivative behind `ln_phi` is compared against the oracle's arithmetic and not only its answer; the two agree to `1.1e-9` relative. The class it drives has two defects recorded elsewhere: `PcsaftVolumeProbe.java` shows its volume solve leaving the physical domain at n-butane 300 K / 50 bara, and `PcsaftDVdVProbe.java` shows `PhasePCSAFT.dF_HC_SAFTdVdV`'s chain term short a factor of `dnSAFT/dV`.

**The departures are checked against a finite difference of NeqSim's energy at fixed volume, not against its `HresTP`**: `PhasePCSAFT.getdDSAFTdT` carries an extra `3 d_i**2`, so its `-1536.95 J/mol` is 3% from the `-1487.25` the energy terms give. `PcsaftDepartureProbe.java` prints both."""
[cases.inputs]
components = ["methane", "n-butane"]
T = 350.0
P = 3000000.0
z = [0.6, 0.4]
compressed_phase = "vapour"
[cases.expected]
v = 0.0008141097344315069
z_factor = 0.8392705810739511
ln_phi = [0.02297989515406737, -0.4210924858702312]
h_res = -1487.2509968943298
s_res = -2.963464837211711
