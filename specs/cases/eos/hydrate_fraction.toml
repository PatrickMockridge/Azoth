model = "eos.hydrate_fraction"
[[cases]]
id = "the_probes_feed_at_288_15_k"
tolerance = 1e-09
source = """**This library's own answer, recorded.** The probe's NeqSim state at this feed closes its own
balance to `7.3e-13` on methane and `0.0` on water, and returns a fraction that moves with the
temperature, so the oracle here is this model's own solve and
`validation/neqsim/captures/hydrate_fraction_probe.tsv` records the other side of it.

`balance_error` is the invariant beside the answer: the largest `|sum_p beta_p x_ip - z_i|`
over the components. It is zero on this model by construction, so a case that pinned only
`beta` would not say which of the two it is looking at.

`residual` is the objective at the feed, which is what decides between no hydrate and all of
the water; `eos.hydrate_formation_temperature` drives the same quantity to zero, so the two
models are checked against one equilibrium rather than against each other."""
[cases.inputs]
components = ["methane", "ethane", "propane", "water"]
eos = "srk"
hydrate_model = "pvtsim"
T = 288.15
P = 10000000.0
z = [
    0.7810182896688087,
    0.09985170538803756,
    0.020266930301532374,
    0.09886307464162135,
]
[cases.expected]
beta = 0.1151303722044179
structure = "structure_ii"
balance_error = 0.0
[[cases]]
id = "the_probes_feed_at_283_15_k"
tolerance = 1e-09
source = """The probe's second state, and the one that says the fraction moves with the
temperature: NeqSim returns `0.114923674828150` at 288.15 K and `0.115164244122972` here, and
this model's bound is `z_water/w_water`, where `w_water` is the hydrate's own composition -
which the cages refill as the temperature falls. The two solves differ by `1.4e-4` at this
state, so the case pins this one's answer and not NeqSim's."""
[cases.inputs]
components = ["methane", "ethane", "propane", "water"]
eos = "srk"
hydrate_model = "pvtsim"
T = 283.15
P = 10000000.0
z = [
    0.7810182896688087,
    0.09985170538803756,
    0.020266930301532374,
    0.09886307464162135,
]
[cases.expected]
beta = 0.1153041888231433
structure = "structure_ii"
balance_error = 0.0
[[cases]]
id = "the_probes_feed_at_278_15_k"
tolerance = 1e-09
source = """The probe's third state. The three are pinned together because the temperature
is the axis the answer moves along - `0.114924`, `0.115164` and `0.115365` on NeqSim's side."""
[cases.inputs]
components = ["methane", "ethane", "propane", "water"]
eos = "srk"
hydrate_model = "pvtsim"
T = 278.15
P = 10000000.0
z = [
    0.7810182896688087,
    0.09985170538803756,
    0.020266930301532374,
    0.09886307464162135,
]
[cases.expected]
beta = 0.1154586779476380
structure = "structure_ii"
balance_error = 0.0
