[[cases]]
id = "the_ideal_gas_limit"
tolerance = 0.001
source = "`process_sound_speed.tsv`'s `gas_methane_low_pressure` row: methane at 27 C and 1 bara, `Z = 0.9978`, `449.53` m/s - and `sqrt(gamma R T/M) = 450.6`, which is the identity the low-pressure limit holds to.\n"
[cases.inputs]
components = ["methane"]
T = 300.15
P = 100000.0
z = [1.0]
[cases.expected]
