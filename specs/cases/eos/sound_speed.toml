[[cases]]
id = "the_two_phase_state_weights_the_phases"
tolerance = 0.01
source = "`process_sound_speed.tsv`'s `two_phase_methane_butane` row: methane/n-butane 0.5/0.5 at 250 K and 30 bara splits, the gas at `373.64` m/s with `beta = 0.36254` and the liquid at `862.99`, and the system value is the class's beta-weighted mean, `685.58` - an arithmetic mean, not a physical mixture speed.\n"
[cases.inputs]
components = ["methane", "n-butane"]
T = 250.0
P = 3000000.0
z = [0.5, 0.5]
[cases.expected]
sound_speed = 373.6430578285567
system_sound_speed = 685.5795111384601
phase = "two_phase"
[[cases]]
id = "liquid_propane"
tolerance = 0.001
source = "`process_sound_speed.tsv`'s `liquid_propane` row: PR propane at 20 C and 100 bara is an oil phase whose root gives `706.78` m/s.\n"
[cases.inputs]
components = ["propane"]
T = 293.15
P = 10000000.0
z = [1.0]
[cases.expected]
sound_speed = 706.7752466817828
system_sound_speed = 706.7752466817828
