model = "eos.sound_speed"
[[cases]]
id = "the_nine_component_gas"
tolerance = 0.001
source = "`process_sound_speed.tsv`'s `gas_nine_component` row: the compressor tranche's nine-component gas on PR at 24 C and 48 bara, flashed single phase. The phase and the system values agree because `beta = 1`; `390.72` m/s against the ideal-gas `sqrt(gamma R T/M)` of about `392`.\n"
[cases.inputs]
components = ["nitrogen", "CO2", "methane", "ethane", "propane", "i-butane", "n-butane", "i-pentane", "n-pentane"]
T = 297.15
P = 4800000.0
z = [0.01208165393330526, 0.013435200224588424, 0.8820509735507028, 0.05271812147827308, 0.03291624055024163, 0.0008221540435942168, 0.004882792917443703, 0.0005614710541619043, 0.000531392247688945]
[cases.expected]
sound_speed = 390.7205902869134
system_sound_speed = 390.7205902869134
phase = "all_vapour"
[[cases]]
id = "the_nine_component_gas_cold"
tolerance = 0.001
