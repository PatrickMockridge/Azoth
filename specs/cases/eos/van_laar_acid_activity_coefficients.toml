model = "eos.van_laar_acid_activity_coefficients"
[[cases]]
id = "water_nitric_sulfuric_ternary_at_250_k"
tolerance = 1e-09
source = "NeqSim 3.20.0 `NitricSulfuricAcidVaporPressure.activityCoefficientWater/NitricAcid/SulfuricAcid`, called directly from validation/neqsim/FlashTp.java's `vanLaarAcid()`."
[cases.inputs]
components = ["water", "hno3", "h2so4"]
T = 250.0
x = [0.5, 0.3, 0.2]
[cases.expected]
ln_gamma = [-4.744406075149099, -0.22475453013437338, -7.032862995958898]
gamma = [0.008700227753081819, 0.7987122544877442, 8.824018478058464e-4]
[[cases]]
id = "water_nitric_binary_at_220_k"
