[[cases]]
id = "water_with_a_dissolved_carrier_gas_at_250_k"
tolerance = 1e-09
source = "NeqSim 3.20.0 `NitricSulfuricAcidVaporPressure.activityCoefficient*` for the acid basis this mixture renormalises to, `[0.625, 0.375, 0.0]` at 250 K - which is *not* the ternary case's, because the nitrogen is left out of the basis. The penalty for a species outside the model is `ComponentGEVanLaarAcid.NON_MODELED_COMPONENT_PENALTY`, read from the source rather than run."
[cases.inputs]
components = ["water", "hno3", "nitrogen"]
T = 250.0
x = [0.5, 0.3, 0.2]
[cases.expected]
ln_gamma = [-1.6703822245219693, -2.5993237294026637, 27.631021115928547]
gamma = [0.18817512674335166, 0.07432382423947895, 1.0e12]
