model = "eos.stream_scale_analyzer"

# The capture's `stream_scale_analyzer` rows. mg/L to kg/m3 by 1e-3, C to K by +273.15,
# bara to Pa by 1e5, litres/day to m3/s by 1/1000/86400. The mass rate is the precipitated
# mass per cubic metre times the volumetric flow.

[[cases]]
id = "sulphate_limited_davies"
tolerance = 1.0e-09
source = "The capture's `sulphate_limited davies` row: the equilibrium's sulphate-limited brine at 70 C and 100 bara, with 100000 L/day and barite as the only precipitate.\n"
[cases.inputs]
calcium = 1.0
barium = 1.0
strontium = 3.0
iron = 0.0
magnesium = 0.0
sodium = 0.0
bicarbonate = 0.2
sulphate = 1.5
total_dissolved_solids = 60.0
temperature = 343.15
pressure = 1.0e7
co2_partial_pressure = 1.0e5
ph = 0.0
auto_ph = false
second_order_pressure_correction = false
activity_model = "davies"
water_flow = 0.0011574074074074073
[cases.expected]
total_scale_mass = 1.6994196722154927
total_scale_rate = 0.001966920916916079
dominant_scale = "BaSO4"
has_scaling = true
minerals = [
    { mineral = "BaSO4", initial_si = 4.876927696794577, final_si = 8.355304428255001e-10, precipitated_mass = 1.6994196722154927, scale_rate = 0.001966920916916079 },
    { mineral = "SrSO4", initial_si = 0.6239941092936203, final_si = -0.024562773607350038, precipitated_mass = 0.0, scale_rate = 0.0 },
    { mineral = "CaSO4", initial_si = 0.5172688634939727, final_si = -0.13128801940699758, precipitated_mass = 0.0, scale_rate = 0.0 },
    { mineral = "CaCO3", initial_si = -6.977584279583682, final_si = -6.977584279583682, precipitated_mass = 0.0, scale_rate = 0.0 },
]

