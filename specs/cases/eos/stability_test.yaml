# Instances of `eos.stability_test`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: eos.stability_test
cases:
- id: a_two_phase_feed_is_unstable
  inputs:
    components:
    - methane
    - n-butane
    T: 330.0
    P: 2500000.0
    z:
    - 0.6
    - 0.4
  expected:
    tm:
    - 4.440892098500626e-16
    - -0.21428474257353658
    w:
    - - 0.6000000000028418
      - 0.3999999999971582
    - - 0.06787627290819705
      - 0.9321237270918029
    iterations:
    - 16
    - 9
  tolerance: 1.0e-09
- id: a_trivial_flash_is_not_a_stable_feed
  inputs:
    components:
    - methane
    - n-butane
    T: 430.0
    P: 6000000.0
    z:
    - 0.6
    - 0.4
  expected:
    tm:
    - 0.0
    - 2.220446049250313e-16
    w:
    - - 0.6000000000116659
      - 0.39999999998833413
    - - 0.5999999999966463
      - 0.40000000000335373
    iterations:
    - 15
    - 17
  tolerance: 1.0e-09
