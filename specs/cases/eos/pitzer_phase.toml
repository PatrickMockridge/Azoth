source = "The **gate's other half**: the same salt-free phase the case above reaches the table through, with CO2 instead of methane. Every gate is open except the reactive qualification, and that one alone keeps the answer on the database row - `51.65450928785164` against the table's `1656.4458917920526 bar`. Two fluids that differ only in the solute, and the two arms are told apart by the name. The dataset is `legacy`, as on the case above."
