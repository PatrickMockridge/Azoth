[[cases]]
id = "methane_in_brine_at_10_bar"
tolerance = 1e-08
source = "The same arm on a substance the table fits nothing for. Methane's row is the `900` sentinel, so `exp(900)` overflows and the cap turns it into the insoluble `1e12 bar` - which is what the capture's `henry_effective` says and what makes the ion entries and this one **the same number by different routes**: `1e12` by the class clause for an ion, `1e12` by the overflow for a hydrocarbon. Its `phi` is therefore `1.0 * 1e12 * 62.51 / 10`, the captured `6.25094614712092e12`."
