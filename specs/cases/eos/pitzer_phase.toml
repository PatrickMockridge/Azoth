model = "eos.pitzer_phase"
[[cases]]
id = "sodium_chloride_at_298_k"
tolerance = 1e-08
source = "NeqSim master `ComponentGePitzer.getGamma` and `PhasePitzer.getOsmoticCoefficientOfWater`, end to end on a live `SystemPitzer`: validation/neqsim/PitzerArithmetic.java. The catalogue covers this brine, so `dataset = phreeqc`. The `gamma` entries are `exp` of the logarithms NeqSim returns; `water_activity` is `gamma_w x_w`, the conversion `getWaterGamma` documents."
[cases.inputs]
components = ["water", "Na+", "Cl-"]
T = 298.15
x = [0.88, 0.06, 0.06]
[cases.expected]
gamma = [0.9782070355447849, 0.7652808165351388, 0.7652808165351388]
ln_gamma = [-0.0220339385649971, -0.267512432075052, -0.267512432075052]
molality = [55.50929780738273, 3.784724850503368, 3.784724850503368]
ionic_strength = 3.784724850503368
osmotic_coefficient = 1.09902694054914
water_activity = 0.8608221912794107
dataset = "phreeqc"
[[cases]]
id = "sodium_calcium_chloride_at_298_k"
tolerance = 1e-08
source = "NeqSim master, same probe. The divalent calcium activates both flags the ion branch gates on - `unequal-charge-same-sign` and `non-2-2 beta2` - so this is the case the two exist for. The catalogue carries a `B2` for Ca++/Cl- where the CSV carries none."
[cases.inputs]
components = ["water", "Na+", "Ca++", "Cl-"]
T = 298.15
x = [0.88, 0.03, 0.03, 0.06]
[cases.expected]
gamma = [0.9452412202388173, 0.6039528596541243, 0.15860761980456956, 2.0680365507955862]
ln_gamma = [-0.0563151245495846, -0.504259131023400, -1.84132192677047, 0.726599630955942]
molality = [
    55.50929780738273,
    1.892362425251684,
    1.892362425251684,
    3.784724850503368,
]
ionic_strength = 6.623268488380894
osmotic_coefficient = 1.35042230443611
water_activity = 0.8318122738101592
dataset = "phreeqc"
[[cases]]
id = "sodium_bicarbonate_on_the_legacy_dataset_at_298_k"
tolerance = 1e-08
source = "NeqSim master, same probe. The catalogue carries no `C0` row for Na+/HCO3-, so this brine falls back to `PitzerParameters.csv` and reads every parameter through the two-coefficient Silvester form instead of the six. Its chloride twin above is the same ionic strength on the other dataset, and `phi` differs by 0.22 between them."
[cases.inputs]
components = ["water", "Na+", "HCO3-"]
T = 298.15
x = [0.88, 0.06, 0.06]
[cases.expected]
gamma = [1.0079613527261757, 0.4564520167612656, 0.4564520167612656]
ln_gamma = [0.00792982836473036, -0.784271695618960, -0.784271695618960]
molality = [55.50929780738273, 3.784724850503368, 3.784724850503368]
ionic_strength = 3.784724850503368
osmotic_coefficient = 0.879292649731133
water_activity = 0.8870059903990346
dataset = "legacy"
