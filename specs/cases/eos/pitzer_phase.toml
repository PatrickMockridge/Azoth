[[cases]]
id = "hydrogen_sulphide_in_water_at_one_atmosphere"
tolerance = 1e-08
source = "The neutral arm **with no ions in the phase**, which is where the IAPWS table becomes reachable - and the case that shows it does not answer here. `IapwsHenryLaw.isSupportedSpecies(\"H2S\")` is true and its `henry_bar` is `539.9279861457985`, yet the phase reads `9.300854319275573e7` from the row: **CO2 and H2S are the two substances `requiresReactivePitzerQualification` excludes**, whatever the phase. Four and a half orders of magnitude separate the two arms on this fluid, which is why the gate is worth a case. The dataset is `legacy`, the salt-free fallback the case above names."
[cases.inputs]
components = ["H2S", "water"]
T = 298.15
P = 101325.0
x = [0.000999000999000999, 0.999000999000999]
[cases.expected]
gamma = [1.0, 1.0]
ln_gamma = [0.0, 0.0]
ln_phi = [22.352588957775026, -3.4618442318936333]
henry = [93008543.19275573, 0.0]
gamma_inf = [1.0, 1.0]
molality = [0.055509297807382736, 55.50929780738274]
ionic_strength = 0.0
osmotic_coefficient = 1.0
water_activity = 0.999000999000999
dataset = "legacy"
[[cases]]
id = "methane_in_water_at_one_atmosphere"
tolerance = 1e-08
source = "**The IAPWS arm, reached and answered.** No ions, no neutral interaction family for methane and water, and methane is not reactive-qualified, so all three gates open and the table's `39479.65646000571 bar` is converted by water's molar mass: `711.2370654308118`, times `m / x = 55.5648`, over `P = 1.01325 bar` is the captured `39002.96111199066`. The row's own value would give a `phi` four orders smaller, so this case is the gate rather than the arithmetic. **The dataset is `legacy`**: a salt-free water/neutral brine is not a topology the catalogue covers, and the salt-free fluids are the ones that reach the table and fall back together."
[cases.inputs]
components = ["methane", "water"]
T = 298.15
P = 101325.0
x = [0.000999000999000999, 0.999000999000999]
[cases.expected]
gamma = [1.0, 1.0]
ln_gamma = [0.0, 0.0]
ln_phi = [10.571392848178034, -3.4618442318936333]
henry = [711.2370654308118, 0.0]
gamma_inf = [1.0, 1.0]
molality = [0.055509297807382736, 55.50929780738274]
ionic_strength = 0.0
osmotic_coefficient = 1.0
water_activity = 0.999000999000999
dataset = "legacy"
