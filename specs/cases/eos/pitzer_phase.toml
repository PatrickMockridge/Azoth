tolerance = 1e-08
source = "The third of `PitzerArithmetic.java`'s brines, which is the **legacy** dataset's case, so this pins the fugacity surface on the other parameter set. **The reference state does not follow the brine onto the legacy dataset**: `gamma_inf` is `0.9999804068927719` here, the same number the two phreeqc brines carry, because the reference phase is a two-component one and `Na+`/`water` is a pair the PHREEQC catalogue covers - so the dataset is chosen per phase, by that phase's own topology, and the reference phase is a different phase from the brine."
