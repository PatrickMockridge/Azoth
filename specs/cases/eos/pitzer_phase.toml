model = "eos.pitzer_phase"
[[cases]]
id = "sodium_chloride_at_298_k"
tolerance = 1e-08
source = "NeqSim master, `PitzerFugacityProbe`'s `nacl` fluid - the composition `PitzerArithmetic.java` pins the activity coefficients on, at its own state of 298.15 K and 1.0 bar. Pinning the same fluid twice is deliberate: the fugacity surface was added to a model that already answered, so this case is the check that the addition moved nothing. The three arms are all present - water's `gamma P0 / P` at `0.9782070355447849 * 0.031787528699883306 / 1.0`, the ions' `(gamma / gamma_inf) 1e12 / 1`, with `gamma_inf` from the two-component reference phase. `henry` is zero on the water entry because that arm reads none."
[cases.inputs]
components = ["water", "Na+", "Cl-"]
T = 298.15
P = 100000.0
x = [0.88, 0.06, 0.06]
[cases.expected]
gamma = [0.9782070355447849, 0.7652808165351391, 0.7652808165351391]
ln_gamma = [-0.0220339385649971, -0.2675124320750516, -0.2675124320750516]
ln_phi = [-3.4707151839323496, 27.36352827715267, 27.36352827715267]
henry = [0.0, 1000000000000.0, 1000000000000.0]
gamma_inf = [1.0, 0.9999804068927719, 0.9999804068927719]
molality = [55.50929780738273, 3.784724850503368, 3.784724850503368]
ionic_strength = 3.784724850503368
osmotic_coefficient = 1.099026940549135
water_activity = 0.8608221912794107
dataset = "phreeqc"
