[[cases]]
id = "carbon_dioxide_in_brine_at_10_bar"
tolerance = 1e-08
source = "The **neutral arm, with the database Henry correlation**, from `PitzerFugacityProbe`'s `co2-water-nacl` fluid. CO2's row is one of the two real correlations in the compiled table, and this is the case that shows the `m / x` conversion: `gamma H (m/x) / P` is `1.0 * 51.65450928785164 * 58.0090 / 10`, the captured `299.6444831649862`. **The ions are why the row and not the IAPWS table answers**: CO2 is reactive-qualified *and* the phase has ions, and either gate alone sends it here. The dataset is `legacy` - the catalogue has no `ZETA(CO2, Na+, Cl-)` row, pairing CO2 with sulphate instead - so the neutral layer here is the sparse one."
