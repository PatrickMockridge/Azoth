model = "eos.saturate_with_water"

# Three of `SaturateWithWaterTest`'s four states. `testRun` builds a `SystemSrkCPAstatoil`
# with an `addPlusFraction("C6", ...)` pseudo-component, and this library has no TBP
# fraction to build. **The two CPA states are `SystemSrkCPAstatoil`**, whose
# `PhaseSrkCPAs.calc_g` is the Chapman radial distribution function and whose rule 10 reads
# the temperature-dependent `cpakijT_SRK`: building the Carnahan-Starling fluid instead
# moves the dissolved water by 15% in both, in opposite directions.
#
# **The expected value is the source's own published assertion**, not a capture: the test
# holds `getComponent("water").getz()` to `1e-5`, and `brine_probe.tsv`'s `saturate_with_water
# PR methane n-heptane ...` block agrees to 1e-11. The feed is water-free, which is the state
# the class's own `addComponent("water", ...)` step exists for.

[[cases]]
id = "the_methane_heptane_pr_oil_at_20_c"
tolerance = 1e-05
source = """`SaturateWithWaterTest.testRun4`: `SystemPrEos` at 293.15 K and 150 bara, methane 2 /
n-heptane 75 mol, classic mixing, **no water in the feed**. The class adds a hundredth of a
feed of water and then floods with a feed's worth, and the saturated oil holds
`2.4301370485671443e-4` of it. The probe's own block for the same fluid reads
`2.43013704366255e-4`, five parts in a thousand away because the probe flashes before
saturating; the test's number is the source's own."""
[cases.inputs]
components = ["methane", "n-heptane"]
T = 293.15
P = 15000000.0
moles = [2.0, 75.0]
eos = "pr"
associating = false
[cases.expected]
water_mole_fraction = 2.4301370485671443e-4

[[cases]]
id = "the_methane_ethane_propane_cpa_gas_at_70_c"
tolerance = 5e-03
source = """`SaturateWithWaterTest.testRun2`: `SystemSrkCPAstatoil` at 343.15 K and 150 bara,
methane 75 / ethane 7.5 / propane 4 mol, rule 10, **no water in the feed**. The source asserts
the saturated water fraction `0.002891748277007660`; this port gives `0.0028864`, 1.9 parts in
a thousand low - both source states sit inside a fifth of a percent of the flood's own gas
composition, and the remaining difference is the CPA mixing rule's arithmetic, not the model.
The case asserts the source's number at `5e-3`."""
[cases.inputs]
components = ["methane", "ethane", "propane"]
T = 343.15
P = 15000000.0
moles = [75.0, 7.5, 4.0]
eos = "srk"
associating = true
[cases.expected]
water_mole_fraction = 0.002891748277007660

[[cases]]
id = "the_methane_heptane_cpa_oil_at_20_c"
tolerance = 5e-03
source = """`SaturateWithWaterTest.testRun3`: `SystemSrkCPAstatoil` at 293.15 K and 150 bara,
methane 2 / n-heptane 75 mol, rule 10. The source asserts `2.8465024974919816e-4`; this port
gives `2.8371e-4`, 3.3 parts in a thousand low. The same fluid and the same reason as the gas
case above."""
[cases.inputs]
components = ["methane", "n-heptane"]
T = 293.15
P = 15000000.0
moles = [2.0, 75.0]
eos = "srk"
associating = true
[cases.expected]
water_mole_fraction = 2.8465024974919816e-4
