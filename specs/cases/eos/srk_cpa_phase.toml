model = "eos.srk_cpa_phase"
[[cases]]
id = "water_methanol_liquid_against_neqsim"
tolerance = 1e-09
source = """NeqSim 3.20.0, `SystemSrkCPA` with `setMixingRule(10)`, run from `validation/neqsim/CpaSweep.java`: `java -cp .:neqsim-3.20.0.jar CpaSweep 300 100 0.6`. `z_factor` is its `PhaseInterface.getZ()` on the single-phase state `init(1)` leaves - the liquid root here - and **it agrees to 5.5e-13**, so the whole volume solve is right: the fitted substitution, the `cpakij_SRK` column, the association's pressure and the site-fraction solve.

**`ln_phi` is not asserted because this model's is wrong, and the difference was first recorded the wrong way round.** NeqSim prints `[-8.02010646183615, -6.14028423012298]` where this model gives `[-9.678032114120995, -9.67863909421079]`. That gap was recorded as NeqSim diverging from its own Helmholtz energy. It does not: `validation/neqsim/CpaFdProbe.java` isolates `dF/dn_i` at constant `T` and `V` from constant-`T,P` solves and finds `ComponentEos.dFdN` equal to the derivative of `ComponentEos.getF()` to `3e-10` relative - with `PhaseSrkCPA.dFdV()` as the chain rule's volume term, since it is `FV() + dFCPAdV()` while a bare `FV()` is the cubic part alone. `CpaSweep`'s `euler_dFdN`/`euler_scale` pair is the same check with no finite difference in it, and agrees to `3e-11`. NeqSim's fugacity coefficient is therefore a true derivative of a Helmholtz energy whose repulsive and attractive terms are the textbook ones at the same `a_mix`, `b_mix` and `Z` this model uses.

Two true derivatives of the same function cannot differ by 1.7, so the gap is here. It is in the cubic part: `dFCPAdN` agrees to ten digits with this model's association term, and this model's `ln_phi` for water and methanol differ by `6e-4` where NeqSim's differ by `1.88`.

**`h_res` and `s_res` are not asserted either**: NeqSim reports absolute enthalpies against its own datum, so the sweep has no reading to record; the enthalpy path is pinned to a finite difference of the solve in `python/tests/test_association_agreement.py`."""
[cases.inputs]
components = ["water", "methanol"]
T = 300.0
P = 10000000.0
z = [0.6, 0.4]
compressed_phase = "liquid"
[cases.expected]
z_factor = 0.105050962879418
