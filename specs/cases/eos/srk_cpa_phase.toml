model = "eos.srk_cpa_phase"
[[cases]]
id = "water_methanol_liquid_against_neqsim"
tolerance = 1e-09
source = """NeqSim 3.20.0, `SystemSrkCPA` with `setMixingRule(10)`, run from `validation/neqsim/CpaSweep.java`: `java -cp .:neqsim-3.20.0.jar CpaSweep 300 100 0.6`. `z_factor` is its `PhaseInterface.getZ()` on the single-phase state `init(1)` leaves - the liquid root here - and **it agrees to 5.5e-13**, so the whole volume solve is right: the fitted substitution, the `cpakij_SRK` column, the association's pressure and the site-fraction solve.

**`ln_phi` is not asserted because NeqSim diverges from its own Helmholtz energy, and `validation/neqsim/CubicFdProbe.java` measures it.** `ComponentEos.fugcoef` is `dFdN - ln Z`, so its `ln phi` is the derivative of its `F`; that probe isolates `dF/dn_i` at constant `T` and `V` from constant-`T,P` solves. For a plain Peng-Robinson mixture `dFdN` **is** that derivative, to ten digits. For `SystemSrkCPA` it is not: NeqSim prints `[-8.02010646183615, -6.14028423012298]` where this model gives `[-9.678032114120995, -9.67863909421079]`, the association part (`dFCPAdN = [-9.80708161964733, -8.29830382139314]`) agrees to ten digits either way, and the whole difference is the cubic part.

This model evaluates the textbook Soave-Redlich-Kwong `ln phi` - written from its own `a`, `b`, `z` and `kij` and agreeing with `Mixture::phase_state` to fifteen digits. **`h_res` and `s_res` are not asserted either**: NeqSim reports absolute enthalpies against its own datum, so the sweep has no reading to record; the enthalpy path is pinned to a finite difference of the solve in `python/tests/test_association_agreement.py`."""
[cases.inputs]
components = ["water", "methanol"]
T = 300.0
P = 10000000.0
z = [0.6, 0.4]
compressed_phase = "liquid"
[cases.expected]
z_factor = 0.105050962879418
