model = "eos.srk_cpa_phase"
[[cases]]
id = "water_methanol_liquid_against_neqsim"
tolerance = 1e-09
source = """NeqSim 3.20.0, `SystemSrkCPA` with `setMixingRule(10)`, run from `validation/neqsim/CpaSweep.java`: `java -cp .:neqsim-3.20.0.jar CpaSweep 300 100 0.6`. `z_factor` is its `PhaseInterface.getZ()` on the single-phase state `init(1)` leaves - the liquid root here - agreeing to **5.5e-13**; `ln_phi` is its `ComponentInterface.getFugacityCoefficient()`, agreeing to **2.2e-11**. So the whole model agrees: the fitted substitution, the `cpakij_SRK` column, the association's pressure, the site-fraction solve and the fugacity coefficient itself.

**`ln_phi` was 1.7 out here until the cubic term was put right, and that gap was recorded as NeqSim's.** The SRK closed form carries a `Z - 1`, and that `Z - 1` is the *equation of state's*: `B/(Z - B) - A Z/((Z+d1 B)(Z+d2 B))`, which is `z - 1` only where the volume solves the SRK cubic. An associating mixture's volume does not - the association carries a pressure - so the closed form evaluated there is not the derivative of the cubic Helmholtz energy. `Cubic::eos_z_minus_one` is the equation of state's, and the two differ by `0.0328` in component 0 at 356 K and 1 bara.

The record said NeqSim's `ComponentSrkCPA.dFdN` was not the derivative of its own `getF`, on the strength of `validation/neqsim/CpaFdProbe.java` subtracting `FV()` where the chain rule needs `dFdV()` - which is `FV() + dFCPAdV()`, and the association's `dFCPAdV` is seventeen times the cubic's `FV()` at that state. With `dFdV()` the derivative is reproduced to `3e-10`, `CpaSweep`'s `euler_*` pair is the same statement without a finite difference in it, and a plain Peng-Robinson control passes either way because there the two are the same method.

**`h_res` and `s_res` are not asserted**: NeqSim reports absolute enthalpies against its own datum, so the sweep has no reading to record; the enthalpy path is pinned to a finite difference of the solve in `python/tests/test_association_agreement.py`."""
[cases.inputs]
components = ["water", "methanol"]
T = 300.0
P = 10000000.0
z = [0.6, 0.4]
compressed_phase = "liquid"
[cases.expected]
z_factor = 0.105050962879418
ln_phi = [-8.02010646183615, -6.14028423012298]
