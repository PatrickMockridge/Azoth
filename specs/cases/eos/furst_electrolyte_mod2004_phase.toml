model = "eos.furst_electrolyte_mod2004_phase"

[[cases]]
id = "the_shipped_test_aqueous_phase"
tolerance = 1e-08
source = """**This library's own answer, recorded.** Mod2004 draws its Born mole derivative as
`FBornX XBorni + FBornD solventdiElectricdn` - the base model's expression - so the two
revisions differ by the zeroed derivatives and not by an added term. NeqSim's own
`SystemFurstElectrolyteEosMod2004` at this state gives
`lnPhi = [8.37259590824234, -5.74878329688428, -275.908793598670, -166.578354735104]`, which
is this answer to `1.3e-8` or better on every component.

**The tolerance is `1e-8`, the other electrolyte cases'.** It was `1e-6` while the variant
added an extensive term to every `ln phi`, which a composition cannot express and a tight
tolerance cannot pin; with the term gone both sides are intensive and the two agree.

The state is NeqSim's own test mixture - methane, water, Na+ and Cl- at `0.1 1.0 0.001 0.001`
- flashed at 25 C and 10.01325 bara, from the same probe (`reportMod2004`)."""
[cases.inputs]
components = ["methane", "water", "Na+", "Cl-"]
T = 298.15
P = 1001325.0
x = [
    0.000226524776743935,
    0.997777272904135,
    0.000998101159560386,
    0.000998101159560386,
]
compressed_phase = "liquid"
[cases.expected]
z_factor = 0.009635856436241555
ln_phi = [8.372595802264165, -5.748783297111036, -275.90879316740336, -166.57835487746573]
[[cases]]
id = "the_shipped_test_gas"
tolerance = 1e-06
source = """The same probe at the same state on the other root: `Z = 0.983240760727211` and
`lnPhi = [-0.0168629980706277, -0.01945168784894277, -71.76613018523096, -96.53977553024383]`.

**The Born term this case would carry vanishes here.** `FBornD` is built from
`bornX = sum_i n_i z_i^2/sigma_i`, and the vapour's ions sit at `1e-43` mole fraction, so it
is zero to the precision the answer is read at - which is why the two roots move differently
and why NeqSim's own vapour value moves only in the tenth digit too.

The ions' `ln phi` are the `FBornX XBorni` term on its own, and the vapour's `Z` differs from
the base model's because the zeroed derivatives enter the root through the electrolyte's
pressure."""
[cases.inputs]
components = ["methane", "water", "Na+", "Cl-"]
T = 298.15
P = 1001325.0
x = [
    0.996758133992898,
    0.00324186600710256,
    1.00009866771630e-43,
    1.00009866771630e-43,
]
compressed_phase = "vapour"
[cases.expected]
z_factor = 0.9832407607272112
ln_phi = [-0.0168629980706277, -0.01945168784894277, -71.76613018523096, -96.53977553024383]
