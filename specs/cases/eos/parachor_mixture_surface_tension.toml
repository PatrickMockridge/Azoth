model = "eos.parachor_mixture_surface_tension"
[[cases]]
id = "methane_nbutane_gas_oil"
tolerance = 1e-12
source = "NeqSim master, `InterfaceProperties.getSurfaceTension` on a two-phase methane/n-butane fluid at 300 K and 20 bara, from `validation/neqsim/captures/parachor_probe.tsv`. **The two phases are both printed**: density and molar mass per phase, and each phase's own composition - so the case pins the *sum*, not one phase's contribution to it. The dispatch reaches `gasLiquidSurfaceTensionCalc` here, whose default is `ParachorSurfaceTension`.\n"
[cases.inputs]
parachors = [77.3, 191.7]
rho_gas = 19.938328330315997
M_gas = 0.022959902730870334
x_gas = [0.8356249351028912, 0.1643750648971088]
rho_liquid = 549.3851668858096
M_liquid = 0.054107691623917306
x_liquid = [0.09542082642782022, 0.9045791735721797]
[cases.expected]
sigma = 0.009424889197268286
[[cases]]
id = "three_component_gas_oil"
tolerance = 1e-12
source = "The capture's second row: the same state with n-heptane added, so the sum is over three terms and the smallest one - n-heptane's gas fraction at `0.0021` - is in it. With two components a port could pass by summing the wrong pair; with three the terms cannot be transposed.\n"
[cases.inputs]
parachors = [77.3, 191.7, 311.0]
rho_gas = 17.488347210328868
M_gas = 0.020524091668986343
x_gas = [0.8956085095409251, 0.10229325961290625, 0.002098230846168715]
rho_liquid = 608.1986162758507
M_liquid = 0.06778863659145379
x_liquid = [0.0929335558496635, 0.5844515346496558, 0.3226149095006806]
[cases.expected]
sigma = 0.012857410974774119
[[cases]]
id = "co2_water_gas_aqueous"
tolerance = 1e-12
source = "The capture's third row, which is the branch `gasAqueousSurfaceTensionCalc` and the state `RateBasedPackedColumnTest` runs its CO2 absorber at. **The two phases' molar masses differ by 2.4x and their densities by 8.7x**, so a port that used one phase's molar density for both, or the wrong phase's, cannot land here.\n"
[cases.inputs]
parachors = [78.0, 52.8786226]
rho_gas = 113.27066791939949
M_gas = 0.04395427203887297
x_gas = [0.9978562046113857, 0.002143795388614308]
rho_liquid = 988.9287133030801
M_liquid = 0.018032395235927503
x_liquid = [0.0006691762234084198, 0.9993308237765915]
[cases.expected]
sigma = 0.053145026912194734
[[cases]]
id = "methane_water_gas_aqueous"
tolerance = 1e-12
source = "The capture's fourth row: a methane-rich gas over water, where the *gas* is 99.99 per cent methane and the aqueous phase is 99.99 per cent water. **The dissolved-gas fractions are `3e-7` and `7e-4`**, so a port that dropped the small terms would still pass the first rows and fail this one only if the drop were gross - it is here as the state most like a dehydration or hydrate calculation.\n"
[cases.inputs]
parachors = [77.3, 52.8786226]
rho_gas = 34.86438099173673
M_gas = 0.016044320517662743
x_gas = [0.9993303662967818, 0.0006696337032181434]
rho_liquid = 1000.9892088811749
M_liquid = 0.018014999423996814
x_liquid = [2.92090864962477e-07, 0.9999997079091351]
[cases.expected]
sigma = 0.058892233350760124
