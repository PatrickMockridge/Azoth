model = "eos.ge_flash"
[[cases]]
id = "van_laar_acid_fluid_at_273_15_k"
tolerance = 2e-04
source = "NeqSim master, `TPflash`'s direct gamma-phi route on `SystemVanLaarActivitySRK`, from `validation/neqsim/captures/van_laar_gamma_phi_probe.tsv`. The fluid and the state are `SystemEosGEOperationsTest.createTwoPhaseSystem`'s - CO2 10 / water 0.70 / nitric acid 0.15 / sulfuric acid 0.15 mol at 273.15 K and 1 bar - and this is **the only system in `src/main` that reaches that route**, because it is the only one overriding `requiresDirectGammaPhiFlash()`. `x` is the aqueous phase and `y` the gas: the capture prints NeqSim's phase 1 first and its beta is the *liquid* fraction, so the two are transposed here. **This case pins the liquid and the state, and the vapour has its own case below**: the liquid's own model is the model this id is about, and it agrees to `1.05e-4` worst on the composition (nitric acid) and `2.0e-5` on `ln_phi_liquid`, because the system's tuning does not touch the liquid. **The vapour's coefficients are the other case's**, because the override replaces exactly those.\n"
[cases.inputs]
components = ["CO2", "water", "nitric acid", "sulfuric acid"]
liquid_model = "van_laar_acid"
cubic = "srk"
T = 273.15
P = 100000.0
z = [0.9090909090909091, 0.06363636363636363, 0.013636363636363636, 0.013636363636363636]
[cases.expected]
beta = 0.9101615466858757
x = [9.923246171795144e-13, 0.7011681817398651, 0.14704421358299002, 0.15178760467615265]
ln_phi_liquid = [
    27.631021115928547,
    -6.9114435631978655,
    -5.765979127979182,
    -31.749973352727675,
]
z_vapour = 0.993446874971783
phase = "two_phase"
[[cases]]
id = "the_same_fluid_vapour_at_its_own_tolerance"
tolerance = 1e-02
source = "The same capture and the same run, pinned on the vapour composition and the K-values at the tolerance **the untuned loop actually reaches there**: the worst entries are `y[2]` (`3.78e-3`) and `k[2]` (`3.89e-3`), and everything else is under `1.0e-4`. **The cause is measured and it is the system's, not the loop's**: `SystemVanLaarActivitySRK` overrides the vapour fugacity coefficient for an activity component in a CO2-rich vapour with a **fitted constant** (`carbonDioxideCarrierFugacityCoefficient`), caps nitric acid's K at `0.45`, and damps the K update by `0.25` - or `0.05` within `1e-4` of a phase boundary. None of the three is ported, so this route is reproduced for the liquid and approximated for the vapour, and a port that carried the three hooks would tighten this case rather than change the model. **The vapour's fugacity coefficients are deliberately not pinned**: they are what the override replaces, and a relative comparison of numbers near zero - water's is `-0.0136`, and the cubic answers `1.8e-4` away - measures the magnitude rather than the disagreement.\n"
[cases.inputs]
components = ["CO2", "water", "nitric acid", "sulfuric acid"]
liquid_model = "van_laar_acid"
cubic = "srk"
T = 273.15
P = 100000.0
z = [0.9090909090909091, 0.06363636363636363, 0.013636363636363636, 0.013636363636363636]
[cases.expected]
y = [0.9988236839943918, 7.08114595836434e-4, 4.682014097692246e-4, 2.570656866497064e-15]
k = [1.0065493354718438e12, 0.0010099069157407177, 0.0031840859178384282, 1.6935881371747747e-14]
