source = """The same root at 283.15 K: `2553765.013200786896050` Pa here against
NeqSim's `25.5377610408892` bara, `4.34e-6` relative apart, with its residual at its own
pressure `-5.271e-7` against `7.585e-9` at this one."""
[cases.inputs]
