model = "process.gas_scrubber"
[[cases]]
id = "the_equilibrium_split"
tolerance = 0.0002
source = "NeqSim master, `GasScrubber.run` on a 0.7/0.3 methane/n-butane mixture at 300 K and 20 bara, from `validation/neqsim/captures/process_gas_scrubber.tsv`. **The numbers are `process.separator`'s own first row, and that is the measurement**: `GasScrubber extends Separator` and does not override `run` - `grep -c \\\"public void run\\\"` returns zero - so the steady state is the separator's flash exactly, and this capture is that row through the other class. The tolerance is the separator's, for the separator's reason.\\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
[cases.expected]
vapour_n = 0.8182211906421439
vapour_z = [0.8339243334525452, 0.16607566654745468]
vapour_p = 2000000.0
vapour_t = 300.0
vapour_h = 530.1529163915932
liquid_n = 0.18177880935785606
liquid_z = [0.09718095876744991, 0.9028190412325501]
liquid_p = 2000000.0
liquid_t = 300.0
liquid_h = -17268.958496924708
[[cases]]
id = "a_pressure_drop_is_not_a_throttling"
tolerance = 0.0002
source = "The same feed with `setPressureDrop(2.0)`, which the separator's own case records: `run` reduces the pressure and runs a `TPflash` at the *feed's* temperature, so the outlets are at the feed's temperature and their enthalpies move with the pressure. This is the separator's second row through the scrubber, and it is here so that the delegation is measured on a second state rather than one.\\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 200000.0
gas_in_liquid = 0.0
[cases.expected]
vapour_n = 0.8360536845155941
vapour_z = [0.8203430710096191, 0.1796569289903808]
vapour_p = 1800000.0
vapour_t = 300.0
vapour_h = 594.757372548732
liquid_n = 0.16394631548440586
liquid_z = [0.08630357366533918, 0.9136964263346607]
liquid_p = 1800000.0
liquid_t = 300.0
liquid_h = -17457.57964433711
[[cases]]
id = "the_capacity_utilization_of_a_one_metre_vessel"
tolerance = 0.0002
source = "The same feed with `setInternalDiameter(1.0)` and `setDesignGasLoadFactor(0.07)`, from `validation/neqsim/captures/process_gas_scrubber.tsv`. `getCapacityUtilization` is `Q / (K sqrt((rho_l - rho_g)/rho_g) A)` with `A = pi d**2 / 4`, and this row is the whole of it on a state with no entrainment.\\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.07
[cases.expected]
capacity_utilization = 0.003341057093792472
[[cases]]
id = "the_same_vessel_at_twice_the_diameter"
tolerance = 0.0002
source = "The same row with `setInternalDiameter(2.0)`, which is the capture's fourth. It is here because the area is the only place the diameter enters: the answer is the first row's divided by four, and a port that read the diameter anywhere else would agree with the first row and not this one.\\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 2.0
design_gas_load_factor = 0.07
[cases.expected]
capacity_utilization = 8.35264273448118e-4
[[cases]]
id = "the_vessel_that_carries_five_per_cent_of_its_vapour"
tolerance = 0.0002
source = "The same vessel with `setEntrainment(0.05, \\\"mole\\\", \\\"feed\\\", \\\"gas\\\", \\\"liquid\\\")`, which is the capture's fifth. **This is the row that settles what the metric reads**: `Separator.run` applies the entrainment to the thermo system before `getCapacityUtilization` reads it, so `Q` is the vapour that is left and the oil's density is the one it has after absorbing. Reading the flashed feed instead answers the first row's number, which is 0.6 per cent away.\\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.05
internal_diameter = 1.0
design_gas_load_factor = 0.07
[cases.expected]
vapour_n = 0.7773101311100368
liquid_n = 0.22268986888996328
capacity_utilization = 0.0033609430039118087
[[cases]]
id = "the_mechanical_design_sizes_the_vertical_scrubber"
tolerance = 0.0002
source = "The scrubber mechanical capture's PR row: the class's own fixture at 10,000 kg/hr on the cubic this port carries, through `GasScrubberMechanicalDesign.calcDesign`. **The scrubber standard's `1.1` volume factor is the difference from the separator**: the base pass runs first with `1.0`, then this subclass re-sizes vertical (`Fg = 1`) at `1.1`, with a `5 d` length and a module `2 d` high.\n"
[cases.inputs]
components = ["methane", "ethane", "propane", "n-pentane"]
feed_n = 107.40852445606174
feed_z = [0.7, 0.1, 0.1, 0.1]
feed_p = 2000000.0
feed_t = 298.15
pressure_drop = 0.0
