model = "process.anti_surge_recycle"

# The machine is the charted one `process.compressor`'s curve cases use - the nine-component
# gas at 24 C and 48 bara, the eight-speed table, and the surge curve {2789, 2550, 2500,
# 2200} m3/hr over {80, 72, 70, 65} kJ/kg. **The feed flow is the probe's MSm3/day stated
# as mol/s**: 0.30 MSm3/day is 0.30 * 489.4970603565765, and 4.00 is four times it.

