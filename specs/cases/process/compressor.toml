source = "`process_anti_surge.tsv`'s `anti_surge_run_in_surge` row: the same machine at 0.30 MSm3/day with `AntiSurge` active and the default 1.05 factor. The block re-runs it at 1.05 x the surge flow and settles at a recycle fraction of 9.065; the outlet keeps the fresh moles and the power is the recycled flow's. **The discharge state is not recorded**: the class's own outlet pressure in this deep-surge state comes from a pass whose head `getPolytropicHead` does not report (the two disagree by 30%), so there is no state for a port to be held to. The 7% band is the measured 5.8% on `surge_flow_rate_std`, which compounds the surge flow with the inlet's volume-corrected `Z`; the fraction itself is 3.1% out because the fresh volume is 2.9% below NeqSim's and the recycle ratio is near ten\n"
