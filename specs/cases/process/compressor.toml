source = "`process_compressor_curve.tsv`'s `compressor_chart_run` row: `CompressorCalculationTest.testRun`'s state re-cased on PR - the nine-component gas at 24 C, 48 bara and 1 MSm3/day, the eight-speed `CompressorChartTest` table and speed `11918`. The chart solves `73.974` bara and `358.598` K, the head is `55.255` kJ/kg and the efficiency `0.42866`, and the shaft power is `1.169` MW. **The curve's head is stated in metres** - a kJ/kg curve multiplied by `1000/9.81`, the class's own `polytropicHeadMeter` - because the model carries the class's default head unit. **The `2e-2` is the two PR implementations' density divergence on this nine-component gas**: azoth's `Z` is `0.8474` against NeqSim's `0.8725` at the inlet, so the flow and the pressure ratio move together; the outlet enthalpy sits `1.1%` out and the chart head and efficiency agree with the capture to `1e-9`.\n"
