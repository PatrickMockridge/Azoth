model = "process.probit"
[[cases]]
id = "custom_triple_at_dose_one"
tolerance = 1.0e-9
source = "A probit of `(5, 0, 1)` at dose one, whose `Y` is exactly five. The class's Abramowitz-Stegun `erf` answers `1e-9` at zero, so the probability is `0.5000000005`. From `validation/neqsim/captures/process_probit.tsv` (`custom_five_at_dose_one`)."
[cases.inputs]
a = 5.0
b = 0.0
n = 1.0
dose = 1.0
[cases.expected]
probit = 5.0
probability = 0.5000000005
[[cases]]
id = "probability_at_a_stated_probit"
tolerance = 1.0e-9
source = "The class's `probability(Y)` at a stated `Y = 5`, the same half-probability. From (`custom_five_from_probit`)."
[cases.inputs]
a = 5.0
b = 0.0
n = 1.0
dose = 1.0
probit_value = 5.0
[cases.expected]
probit = 5.0
probability = 0.5000000005
