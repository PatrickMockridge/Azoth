model = "process.gaussian_plume"
[[cases]]
id = "rural_d_at_100_metres"
tolerance = 1.0e-9
source = "`GaussianPlumeTest.groundConcentrationDecreasesWithDistance`: a 1 kg/s source at an effective 10 m in D-class rural weather, evaluated at 100 m. The 1e-3 threshold is never reached on this state, so the distance is absent - the class answers NaN. From `validation/neqsim/captures/process_gaussian_plume.tsv` (`rural_d_100m`).\n"
[cases.inputs]
emission_rate = 1.0
effective_stack_height = 10.0
wind_speed = 5.0
stability = "D"
terrain = "rural"
distance = 100.0
crosswind = 0.0
height = 0.0
threshold = 0.001
[cases.expected]
sigma_y = 7.960297521679914
sigma_z = 5.595028849441882
concentration = 2.8939011685993784e-4
centerline_ground_concentration = 2.8939011685993784e-4
