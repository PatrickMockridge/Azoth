# Instances of `process.throttling_valve`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.throttling_valve
cases:
- id: a_five_bar_drop_cools_the_stream
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 500000.0
  expected:
    T: 294.96569012703566
    P: 1500000.0
  tolerance: 1.0e-09
- id: no_drop_leaves_the_stream_alone
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 0.0
  expected:
    T: 300.0
    P: 2000000.0
  tolerance: 1.0e-07
