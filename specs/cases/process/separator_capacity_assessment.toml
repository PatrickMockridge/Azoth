orientation = "inclined"
design_liquid_level_fraction = 0.8
design_basis_provenance = "design basis A"
[cases.expected]
status = "unassessed"
diagnostic = "Separator orientation must be horizontal or vertical"
design_basis_source = ""
governing_capacity_basis = ""
[[cases]]
id = "a_full_liquid_level_is_unassessed"
tolerance = 2e-04
source = "The capture's thirteenth block: the feasible state with a design liquid level of exactly one. **The class's interval is `[0, 1)`**, so one is out and the level check precedes the evidence calculation. The diagnostic is the level's own, not the geometry's.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 1.0
design_basis_provenance = "design basis A"
[cases.expected]
status = "unassessed"
diagnostic = "Design liquid level fraction must be in [0, 1)"
design_basis_source = ""
governing_capacity_basis = ""
[[cases]]
id = "a_liquid_only_feed_with_a_full_level_is_unassessed"
tolerance = 2e-04
source = "The capture's sixth block: a liquid-only feed with a design liquid level of one. **The class checks the gas phase before the level**, so the answer is the geometry sentence - a vessel with nothing to size for - rather than the level's. The two checks share a feed and differ only in which one the code reaches first, which is what this row pins.\n"
[cases.inputs]
components = ["n-butane"]
feed_n = 1.0
