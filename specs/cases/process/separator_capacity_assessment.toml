[[cases]]
id = "a_blank_provenance_is_unassessed"
tolerance = 2e-04
source = "The capture's fifth block: the feasible state with a whitespace provenance. **The class trims it and fails closed**: `unassessed`, the diagnostic `Design-basis provenance is required`, and no numeric evidence - the two string evidence fields are empty. The provenance check is the first one, so this row cannot be confused with a geometry failure.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
design_basis_provenance = " "
[cases.expected]
status = "unassessed"
diagnostic = "Design-basis provenance is required"
design_basis_source = ""
governing_capacity_basis = ""
[[cases]]
id = "a_liquid_only_feed_is_unassessed"
tolerance = 2e-04
source = "The capture's sixth block: n-butane at 250 K and 5 bar, a single liquid phase. **The class refuses to assess a vessel with no gas to size for** and answers `unassessed` with the geometry diagnostic, not a zero utilisation - that is `getCapacityUtilization`'s answer, and this snapshot is a different question.\n"
[cases.inputs]
components = ["n-butane"]
feed_n = 1.0
feed_z = [1.0]
feed_p = 500000.0
feed_t = 250.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
design_basis_provenance = "liquid only"
[cases.expected]
status = "unassessed"
diagnostic = "Finite geometry, design K-factor, and a calculated gas phase are required"
design_basis_source = ""
governing_capacity_basis = ""
[[cases]]
id = "a_zero_diameter_is_unassessed"
tolerance = 2e-04
source = "The capture's eleventh block: the feasible state with a zero diameter. **A non-positive geometry answers `unassessed` rather than a typed refusal**, which is the class's fail-closed contract and the reason this id declares no `valid_range` rows. The gas cannot be sized for a vessel of no area.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 0.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
design_basis_provenance = "design basis A"
[cases.expected]
status = "unassessed"
diagnostic = "Finite geometry, design K-factor, and a calculated gas phase are required"
design_basis_source = ""
governing_capacity_basis = ""
[[cases]]
id = "an_unknown_orientation_is_unassessed"
tolerance = 2e-04
source = "The capture's twelfth block: the feasible state with `orientation = inclined`. **The class accepts any string on the setter and fails closed at the assessment**, so the port carries the orientation as a string and reproduces that branch rather than refusing the input. The diagnostic names the two values the class knows.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
