model = "process.separator_capacity_assessment"
[[cases]]
id = "a_feasible_vessel"
tolerance = 2e-04
source = "The capture's first block: the capacity surface's two-phase state in a 1 m vertical vessel at a design `K` of `0.11`, with a stated provenance. The Souders-Brown flow governs (`0.4397141288` m3/s), the gas carries `9.3488818763e-4` m3/s and utilisation is `0.0021261272`, so the snapshot is `feasible`. **The mechanical maximum is `0.0`** - the class's field when no limit was set - and the source is `equipment`.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
design_basis_provenance = "design basis A"
[cases.expected]
status = "feasible"
diagnostic = "Gas capacity is within the evidenced design limit"
design_basis_source = "equipment"
governing_capacity_basis = "soudersBrown"
gas_area = 0.7853981633974483
gas_density = 20.157310986709366
liquid_density = 542.322967123113
maximum_gas_velocity = 0.559861417115024
current_gas_flow = 9.34888187629334e-4
mechanical_design_maximum_gas_flow = 0.0
souders_brown_maximum_gas_flow = 0.4397141287592326
maximum_gas_flow = 0.4397141287592326
utilization = 0.0021261272415043003
[[cases]]
id = "an_undersized_vessel_is_infeasible"
