design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
design_basis_provenance = "an undersized vessel"
[cases.expected]
status = "infeasible"
diagnostic = "Gas capacity exceeds the evidenced design limit"
design_basis_source = "equipment"
governing_capacity_basis = "soudersBrown"
gas_area = 0.031415926535897934
gas_density = 20.157310986709337
liquid_density = 542.3229671231129
maximum_gas_velocity = 0.5598614171150242
current_gas_flow = 0.046744409381466664
mechanical_design_maximum_gas_flow = 0.0
souders_brown_maximum_gas_flow = 0.01758856515036931
maximum_gas_flow = 0.01758856515036931
utilization = 2.6576590518803727
