source = "The capture's second block: the same fluid at 50 mol/s through a 0.2 m vessel. The gas' `0.0467444094` m3/s is nearly three times the `0.0175885652` m3/s the area admits, so utilisation is `2.6576590519` and the status is `infeasible` rather than a refusal. **The snapshot still carries every number** - an infeasible assessment is evidence, not an error.\n"
