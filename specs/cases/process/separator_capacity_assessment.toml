tolerance = 2e-04
source = "The capture's seventh block: the feasible state with a design `K` of zero. **A vessel with no settling velocity is not a vessel**, and the class's `finitePositive` check answers the geometry sentence rather than dividing by it. The separator id's own capacity surface would refuse the input; this one reports it.\n"
