[[cases]]
id = "an_overflowing_design_k_is_unassessed"
tolerance = 2e-04
source = "The capture's eighth block: a `K` of `1e308`, whose Souders-Brown velocity overflows to infinity. **The class's final evidence check refuses an infinity** - `finitePositive(maximumVelocity)` is false - so the diagnostic is the evidence one, not the geometry one. This is the branch that says an infinite number is not an assessment.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
