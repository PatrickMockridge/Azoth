# Instances of `process.expander`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.expander
cases:
- id: twenty_to_five_bar_at_ninety_percent
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    outlet_pressure: 500000.0
    efficiency: 0.9
  expected:
    T: 265.5189385513854
    P: 500000.0
    power: -19562.670287154528
    isentropic_temperature: 264.38812613858266
  tolerance: 1.0e-09
- id: a_superheated_feed_expands_to_vapour
  inputs:
    components:
    - methane
    - n-butane
    T: 450.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    outlet_pressure: 500000.0
    efficiency: 0.9
  expected:
    T: 389.722872629469
    P: 500000.0
    power: -41743.62329512539
    isentropic_temperature: 383.3906120050815
  tolerance: 1.0e-09
