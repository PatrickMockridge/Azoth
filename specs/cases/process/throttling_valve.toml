    `validation/neqsim/captures/process_valve_sizing.tsv`, row `sizing_gas_rich`.
    The same state with `setIsCalcOutPressure(true)`: the outlet pressure is solved from the trim rather than stated, and the row records what the bisection lands on - `1.4132495384` bara, the stated value to the class's own tolerance.
    """
