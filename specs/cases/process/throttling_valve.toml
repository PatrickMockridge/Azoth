[cases.expected]
outlet_n = 97.21961972278174
outlet_z = [0.1, 0.2, 0.4, 0.3]
outlet_p = 141325.0
outlet_t = 295.63504651075675
kv = 873.1112420037152
cv = 1009.3165957562948
cg = 1372670.5702285608
choked = true
gas_valve = true
calculated_molar_flow = 97.21961972278176

[[cases]]
