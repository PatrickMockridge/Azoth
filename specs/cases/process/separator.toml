model = "process.separator"
[[cases]]
id = "the_equilibrium_split"
tolerance = 2e-04
source = "NeqSim master, `Separator.run` on a 0.7/0.3 methane/n-butane mixture at 300 K and 20 bara, from `validation/neqsim/captures/process_separator.tsv`. **Nothing is asked of the vessel**: no pressure drop, no heat input, no entrainment, so the flash is at the feed's own state and the split is the equilibrium one. That is also the only row where the energy balance closes - 0.81822 x 530.15 + 0.18178 x -17268.96 = -2705.37 against a feed of -2705.35 - and the case pins both outlets' records because a port that got one right and the other wrong would look correct on a sum. **The tolerance is the measured agreement and no better, and `vapour_h` sets it.** The flow and both compositions agree to `2e-12` - they come out of the same K-values - and the enthalpies are `0.06` J/mol apart, which is `1.2e-4` relative on the vapour's `530.15` because that field is the smallest-magnitude one in the row. The same absolute `0.06` J/mol appears on the liquid here and on `process.splitter`'s and `process.pump`'s own enthalpies, so it is the flash's arithmetic rather than either port's: a relative tolerance on a quantity that happens to pass near zero is a tighter test than the physics can meet.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
[cases.expected]
vapour_n = 0.8182211906421439
vapour_z = [0.8339243334525452, 0.16607566654745468]
vapour_p = 2000000.0
vapour_t = 300.0
vapour_h = 530.1529163915932
liquid_n = 0.18177880935785606
liquid_z = [0.09718095876744991, 0.9028190412325501]
liquid_p = 2000000.0
liquid_t = 300.0
liquid_h = -17268.958496924708
[[cases]]
id = "a_pressure_drop_holds_the_temperature"
tolerance = 2e-04
source = "The capture's second row, a 2 bar drop. **The case exists because the outlets do not carry the inlet's enthalpy**: the feed is -2705.35 J/mol and the outlets weight to -2364.95, which is 340 J/mol that the balance does not account for. `Separator.run` sets the pressure to `P - pressureDrop` and runs a `TPflash`, so the vessel holds the temperature and the drop is not a throttling. A port that made it isenthalpic would be physically defensible and would disagree with the class it names - and would therefore have to say so rather than quietly improve it.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 200000.0
gas_in_liquid = 0.0
[cases.expected]
vapour_n = 0.8360536845155941
vapour_z = [0.8203430710096191, 0.1796569289903808]
vapour_p = 1800000.0
vapour_t = 300.0
vapour_h = 594.757372548732
liquid_n = 0.16394631548440586
liquid_z = [0.08630357366533918, 0.9136964263346607]
liquid_p = 1800000.0
liquid_t = 300.0
liquid_h = -17457.57964433711
[[cases]]
id = "a_heat_input_moves_the_flash"
tolerance = 2e-04
source = "The capture's third row, 1000 W into a 1 mol/s feed. **The duty is W and the enthalpy it moves is per mole**, so it adds `1000 / 1.0 = 1000` J/mol to the feed's -2705.35 and the outlets come out at 305.974 K - the temperature that carries it - rather than at the feed's 300 K. The weighted outlet enthalpy is -1704.25 against the feed's -2705.35 plus 1000, which is `Heater.run`'s one-second convention holding: a NeqSim process stream's total moles are one second of flow.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
heat_input = 1000.0
gas_in_liquid = 0.0
[cases.expected]
vapour_n = 0.8544688027651463
vapour_z = [0.8035773316657293, 0.19642266833427077]
vapour_p = 2000000.0
vapour_t = 305.9744979880211
vapour_h = 821.1818312940813
liquid_n = 0.14553119723485375
liquid_z = [0.09185823889567003, 0.90814176110433]
liquid_p = 2000000.0
liquid_t = 305.9744979880211
liquid_h = -16539.564427297686
[[cases]]
id = "entrainment_carries_vapour_into_the_liquid"
tolerance = 2e-04
source = "The capture's fourth row, `setEntrainment(0.05, \"mole\", \"feed\", \"gas\", \"liquid\")`. A twentieth of the vapour's moles move into the liquid: the vapour keeps its composition and its flow falls to 0.95 of the equilibrium one, 0.77731 against 0.81822, and the liquid becomes 0.22269 mol of a mixture that is 23% methane rather than the 9.7% the flash alone would give. `addPhaseFractionToPhase` moves the components one at a time, so the transfer is by moles and needs no root. **The liquid's enthalpy is not the mixed one**: NeqSim re-flashes the outlet at the carried temperature, so the case pins what the class reports rather than an energy balance it does not close.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.05
[cases.expected]
vapour_n = 0.7773101311100368
vapour_z = [0.8339243334525452, 0.16607566654745468]
vapour_p = 2000000.0
vapour_t = 300.0
vapour_h = 530.1529163915928
liquid_n = 0.22268986888996328
liquid_z = [0.23253041230060956, 0.7674695876993904]
liquid_p = 2000000.0
liquid_t = 300.0
liquid_h = -13999.027492525918
[[cases]]
id = "the_capacity_at_the_design_vessel"
tolerance = 2e-04
source = "The capacity capture's first block: the equilibrium fluid of the first case, with a 1 m vessel at a design `K` of `0.11` m/s and vertical orientation. **The sizing velocity is the Souders-Brown one**, `0.11 sqrt((542.322967 - 20.157311)/20.157311) = 0.5598614171` m/s, and the utilisation is the gas' `9.3488818763e-4` m3/s over `V_max A = 0.4397141288` m3/s. `gas_load_factor` is the *actual* K, `u sqrt(rho_g/(rho_l - rho_g))`, and not the design input, which is why the two are three orders apart on a vessel this empty.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
[cases.expected]
capacity_utilization = 0.0021261272415043003
max_allowable_gas_velocity = 0.559861417115024
gas_superficial_velocity = 0.0011903366103954546
gas_load_factor = 2.338739965654731e-4
is_overloaded = false
[[cases]]
id = "a_horizontal_vessel_derates_the_gas_area"
tolerance = 2e-04
source = "The capture's second block: the same feed, vessel and `K` with `orientation = horizontal`, so the gas area is `(1 - 0.8)` of `pi d**2/4`. **`max_allowable_gas_velocity` does not move** - it is a function of the densities and the design `K`, not of the area - while the superficial velocity, the load factor and the utilisation are five times the vertical ones, and the maximum allowable flow is a fifth. That factor is the class's own `getSepCrossArea() * (1 - designLiquidLevelFraction)` and the reason a scrubber left on the horizontal default is over-read five-fold.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "horizontal"
design_liquid_level_fraction = 0.8
[cases.expected]
capacity_utilization = 0.010630636207521504
max_allowable_gas_velocity = 0.559861417115024
gas_superficial_velocity = 0.005951683051977274
gas_load_factor = 0.0011693699828273657
is_overloaded = false
[[cases]]
id = "the_vertical_area_ignores_the_design_liquid_level"
tolerance = 2e-04
source = "The capture's fourth block: the first case's vessel at `design_liquid_level_fraction = 0.2`. **Every one of the five outputs is the first case's to the last digit**, which is the pin's #3154 statement - a vertical separator's gas area is the full cross-section and the horizontal liquid fraction cannot move it. The vertical pair is why the two inputs are separate even though one of them does nothing here.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.2
[cases.expected]
capacity_utilization = 0.0021261272415043003
max_allowable_gas_velocity = 0.559861417115024
gas_superficial_velocity = 0.0011903366103954546
gas_load_factor = 2.338739965654731e-4
is_overloaded = false
[[cases]]
id = "a_dry_gas_uses_the_sizing_fallback"
tolerance = 2e-04
source = "The capture's sixth block: pure methane at 50 bara, one phase, so **both density rules fall back to `1000.0`** and there is no second phase for the `10.0` floor to see. The sizing velocity is `0.11 sqrt((1000 - 35.255414)/35.255414) = 0.5754213219` m/s and the load factor `5.7938851558e-4 sqrt(35.255414/(1000 - 35.255414)) = 1.1075838571e-4` m/s. **The pin's own near-dry scrubber state is also single-phase in this jar**, so the floor is pinned by a unit test with constructed densities rather than by this row.\n"
[cases.inputs]
components = ["methane"]
feed_n = 1.0
feed_z = [1.0]
feed_p = 5000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
[cases.expected]
capacity_utilization = 0.0010068944155178085
max_allowable_gas_velocity = 0.5754213218902637
gas_superficial_velocity = 5.793885155811818e-4
gas_load_factor = 1.1075838570695891e-4
is_overloaded = false
[[cases]]
id = "entrainment_moves_the_liquid_the_metric_reads"
tolerance = 2e-04
source = "The capture's ninth block: the first case with `gas_in_liquid = 0.05`. **The liquid the metric reads is the entrained one**, because `initPhysicalProperties` recomputes its density after `addPhaseFractionToPhase`: `485.8517090078` kg/m3 against the dry `542.3229671`, which moves the sizing velocity to `0.5287214062` m/s. The gas side also reads the vapour that is *left*, `8.8814377825e-4` m3/s rather than the dry `9.3488818763e-4`, so both densities and the flow are the post-entrainment system's.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.05
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
[cases.expected]
capacity_utilization = 0.002138781911580242
max_allowable_gas_velocity = 0.5287214062139576
gas_superficial_velocity = 0.001130819779875682
gas_load_factor = 2.3526601027382664e-4
is_overloaded = false
[[cases]]
id = "an_overloaded_vessel_reports_overload"
tolerance = 2e-04
source = "The capture's eighth block: the first fluid at `50` mol/s through a `0.2` m vessel. The gas' `0.0467444094` m3/s is nearly three times the `0.0175885652` m3/s the area admits, so utilisation is `2.6576590519` and **`is_overloaded` is `true`**. The flag is `utilisation > 1.0` exactly - the class's own comparison - and not a tolerance.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 50.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_liquid = 0.0
internal_diameter = 0.2
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
[cases.expected]
capacity_utilization = 2.6576590518803727
max_allowable_gas_velocity = 0.5598614171150242
gas_superficial_velocity = 1.487920762994317
gas_load_factor = 0.2923424957068409
is_overloaded = true
[[cases]]
id = "the_metric_is_at_the_outlet_state"
tolerance = 2e-04
source = "The capture's tenth block: the first case with a 2 bar drop, so the getters read the system at 18 bara and the liquid that state carries. The gas density falls to `18.5057860742` and the liquid rises to `544.8000684` kg/m3, moving the sizing velocity to `0.5866151060` m/s. **A port that evaluated the metric at the feed's pressure would be right on the no-drop rows and wrong here**, which is what this row is for.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 200000.0
gas_in_liquid = 0.0
internal_diameter = 1.0
design_gas_load_factor = 0.11
orientation = "vertical"
design_liquid_level_fraction = 0.8
[cases.expected]
capacity_utilization = 0.002314461922247286
max_allowable_gas_velocity = 0.5866151059811591
gas_superficial_velocity = 0.001357698325808449
gas_load_factor = 2.545908114472015e-4
is_overloaded = false
