model = "process.flare"

[[cases]]
id = "binary"
tolerance = 0.0002
source = "NeqSim master, `Flare.run` on 0.9/0.1 methane/n-butane at 1.01325 bara, 288.15 K and 1 mol/s, from `validation/neqsim/captures/process_flare.tsv`. **The record passes through unchanged and the two numbers are the class's own**: the duty is `inStream.LCV() * flowSm3sec`, an energy density at 0 C times a volumetric flow at 15 C, and the emission is the gas's carbon times `44.01e-3`. **The two reported numbers agree to the last bit** - the mixture sums, the compression factor and the ideal-gas conversion are all closed form - and **the product's enthalpy is the one field that carries the libraries' offset**, `0.033` J/mol of `587.4`, which is `5.6e-5` relative and sets the tolerance. The record itself is a pass-through, so that offset is the *inlet state's* and not the flare's."
[cases.inputs]
components = ["methane", "n-butane"]
inlet_n = 1.0
inlet_z = [0.9, 0.1]
inlet_p = 101325.0
inlet_t = 288.15
[cases.expected]
product_n = 1.0
product_z = [0.9, 0.1]
product_p = 101325.0
product_t = 288.15
product_h = 587.430399954884
heat_duty = 1046833.0648978995
co2_emission = 0.057213

