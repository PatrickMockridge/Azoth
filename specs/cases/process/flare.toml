tolerance = 1.0e-6
source = "The capture's `performance_clamped_fields` block: a negative flame height, a radiant fraction of 5 and a zero tip diameter on the binary gas. **The setters clamp rather than refuse** - the height to 0, the fraction to 1 and the tip to `1e-4` m - and the row pins each: the flux at 30 m is `92.5603649` W/m2, the distance `4.5635602` m, and the velocity 23557 m/s off the floored tip.\n"
