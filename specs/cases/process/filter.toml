[[cases]]
id = "the_tabulated_curve_interpolates_between_its_points"
tolerance = 0.0002
source = "`process_filter_models.tsv`'s `tabulated_methane_1000_kg_per_hr` row: `FilterTest.testTabulatedPressureDropCurve`'s curve - `0.10` bar at half the inlet flow and `0.50` at one and a half times it - evaluated at the inlet flow, which is halfway and so lands on `0.30` bar. Selecting a curve selects the `TABULATED` model in the class; here the model is stated and the curve is its input.\n"
