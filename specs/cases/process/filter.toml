source = "The same state at `2000` kg/hr: twice the actual flow against the same reference, so `(Q/Q_ref)^2 = 4` and the clean drop is `0.40` bar. **The square is the class's `Y_STRAINER` exponent**, set by `setFilterServiceType` and read from `flowExponent`; the model states it rather than a type's default, because a type is not a declared input.\n"
[cases.inputs]
components = ["methane"]
