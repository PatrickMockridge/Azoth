tolerance = 3e-04
source = "The capture's `pr_test_run2_swapped_delta_t_1` row: the same two fluids with the cold one as the first stream. **The class's swap is index-based, not hot/cold-based** - the first stream is now the one it sets, and the conductance and duty are the same to the last digit.\n"
