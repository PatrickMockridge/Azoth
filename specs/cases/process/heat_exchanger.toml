[cases.expected]
hot_out_n = 1.0
hot_out_z = [0.8, 0.2]
hot_out_p = 2000000.0
hot_out_t = 345.4935748670965
hot_out_h = 2968.692983939156
cold_out_n = 1.0
cold_out_z = [0.5, 0.5]
cold_out_p = 500000.0
cold_out_t = 320.0
cold_out_h = -18022.51221053017

