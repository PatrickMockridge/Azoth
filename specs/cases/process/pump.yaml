# Instances of `process.pump`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.pump
cases:
- id: twenty_to_thirty_bar_at_eighty_percent
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    outlet_pressure: 3000000.0
    efficiency: 0.8
  expected:
    T: 312.41727762744597
    P: 3000000.0
    power: 8195.195890579158
    isentropic_temperature: 311.3162271821248
  tolerance: 1.0e-09
- id: a_liquid_feed_is_pumped
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 4000000.0
    n: 10.0
    z:
    - 0.2
    - 0.8
    outlet_pressure: 5000000.0
    efficiency: 0.8
  expected:
    T: 300.79302232021286
    P: 5000000.0
    power: 1124.010011876885
    isentropic_temperature: 300.61787326384484
  tolerance: 1.0e-09
