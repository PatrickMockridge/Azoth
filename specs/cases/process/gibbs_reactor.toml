[[cases]]
id = "reverse_water_gas_shift_at_1200_k"
tolerance = 0.001
source = """\
    NeqSim master, `GibbsReactor.run` on an equimolar CO2/hydrogen feed at 1200 K and
    1 bara, from `validation/neqsim/captures/process_gibbs_reactor.tsv`, row `rwgs_1200k`.
    **The capture's `outlet_moles` normalised, and not its `product_z`**: `product_z` is the
    fluid's composition after the outlet stream's own flash and on this row reports the feed, so
    the answer is the class's own list. **Every species stays significant** - the comparison
    between the two implementations is relative, so a feed whose products settle at `1e-15` and
    `1e-7` cannot be asserted at all, which is why the capture's methane/oxygen and ammonia rows
    are not cases. Measured, the whole 150-entry Gibbs energy history matches to
    `1.1e-7` relative and the four mole fractions to `3.7e-5`, so the tolerance is the class's
    own conditioning - `cond(J)` is `6.1e6` on a row where a species sits on the `1e-6` floor -
    and not a rounding allowance. **`product_h` is not asserted.** Measured, the two libraries' outlet molar enthalpies diverge by `5.4e-2` at 1000 K and `3.1e-2` at 1200 K - the reference-state and departure-enthalpy divergence the plug-flow tier already measures at `6.85e-4` in the heat capacity, grown with temperature. A case carries one tolerance, so asserting it would gut the composition to carry it; the divergence is recorded here rather than hidden under a loosened case. **`feed_n` is 0.5 because the class's was**: at 1200 K the feed fluid split into two phases, and `inlet_mole` is filled from `getNumberOfMolesInPhase`, which is per phase, so the solve was handed half the fluid. Declaring the half gives this port the same input. The class has no such guard, and its own element balance is then half the feed's."""
[cases.inputs]
components = ["CO2", "hydrogen", "CO", "water"]
feed_n = 0.5
feed_z = [0.5, 0.5, 0.0, 0.0]
feed_p = 100000.0
feed_t = 1200.0
energy_mode = "isothermal"
damping_composition = 0.05
max_iterations = 5000.0
convergence_tolerance = 0.001
min_iterations = 100.0
