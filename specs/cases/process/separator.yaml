# Instances of `process.separator`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.separator
cases:
- id: a_two_phase_feed_splits_by_the_flash_vapour_fraction
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 0.0
    heat_duty: 0.0
  expected:
    T: 300.0
    P: 2000000.0
    beta: 0.6824887179287704
    gas_flow: 6.824887179287704
    liquid_flow: 3.175112820712296
  tolerance: 1.0e-09
- id: a_pressure_drop_leaves_the_temperature_alone
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 500000.0
    heat_duty: 0.0
  expected:
    T: 300.0
    P: 1500000.0
  tolerance: 1.0e-09
- id: a_single_phase_feed_leaves_one_outlet_empty
  inputs:
    components:
    - methane
    - n-butane
    T: 450.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 0.0
    heat_duty: 0.0
  expected:
    T: 450.0
    P: 2000000.0
    gas_flow: 10.0
    liquid_flow: 0.0
  tolerance: 1.0e-09
