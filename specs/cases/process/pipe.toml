model = "process.pipe"
# One row per branch of the class's steady state, and a fourth that is a divergence.
[[cases]]
id = "gas_methane_co2_1000m"
tolerance = 0.0005
source = "NeqSim master, `AdiabaticPipe.run` with `setLength(1000)`, `setDiameter(0.1)` and `setPipeWallRoughness(1e-5)`, from `validation/neqsim/captures/process_pipe.tsv`. Methane/CO2 0.7/0.3 at 300 K, 50 bara and 1 mol/s - **not the methane/n-butane the rest of this tier's captures use**, because 0.9/0.1 methane/n-butane at 320 K and 30 bara is the one state where azoth's cubic lands on a different root from NeqSim's (`Z = 0.87296` against `0.91976`, recorded in `crates/azoth-process/tests/stream.rs`), and a pipe reads `Z` for its velocity and its `P1^2 - P2^2` term. On a gas whose root agrees, the row is faithful: measured, `outlet_p` to `1.9e-9`, `pressure_drop` to `4.4e-4` and the velocity to `1.4e-4`.\\n"
[cases.inputs]
components = ["methane", "CO2"]
inlet_n = 1.0
inlet_z = [0.7, 0.3]
inlet_p = 5000000.0
inlet_t = 300.0
length = 1000.0
diameter = 0.1
roughness = 1.0e-05
[cases.expected]
outlet_n = 1.0
outlet_z = [0.7, 0.3]
outlet_p = 4999978.227836236
outlet_t = 300.0
outlet_h = -231.601245143823
pressure_drop = 21.772163763989312
[[cases]]
id = "liquid_n_butane_1000m"
tolerance = 1e-06
source = "The same geometry on a hydrocarbon liquid: n-butane at 300 K and 20 bara. **This is the tightest row in the process tier, at `1e-6`, and the measured agreement is `6.2e-8`** - a residual that is where the two *loops* stop rather than the arithmetic, since the same one-pass state reproduces to `1e-14`. It is the row where the class's two densities were found. NeqSim's velocity takes the physical-properties density (`567.33` kg/m3, translated) and its Reynolds number takes `getKinematicViscosity()`, which divides by the untranslated cubic (`603.86`). A port that used one density for both is 6% out on `Re` and 1.9% on the friction factor, and this row would not have closed.\\n"
[cases.inputs]
components = ["n-butane"]
inlet_n = 1.0
inlet_z = [1.0]
inlet_p = 2000000.0
inlet_t = 300.0
length = 1000.0
diameter = 0.1
roughness = 1.0e-05
# **`outlet_h` is deliberately not recorded here.** This row is the tier's tightest - the
# two pressures to `1e-9` - and the enthalpy carries the libraries' ideal-gas offset, which
# is `3.4e-6` relative whatever the machine does. A case has one tolerance, so pinning the
# enthalpy would loosen the row that exists to pin the densities; the gas case below records
# it at `1e-4` instead.
[cases.expected]
outlet_n = 1.0
outlet_z = [1.0]
outlet_p = 1999981.6572976355
outlet_t = 300.0
pressure_drop = 18.3427023645
[[cases]]
id = "water_1000m"
tolerance = 1e-06
source = "The same geometry on water at 300 K and 5 bara. **This row was the tier's recorded divergence and is now a case like any other.** NeqSim's aqueous phase takes `WaterPhysicalProperties`, whose correlation is the liquid `Viscosity` class - `eos.aqueous_viscosity`, `8.5510e-4` Pa s here - where `eos.viscosity` is the PFCT form its gas and oil branches use and gives `5.3097e-4`. Before that id existed this row's Reynolds number was `1.61` times NeqSim's and the drop was `4.5944` Pa against `7.3991`; measured now, the velocity, the Reynolds number, the friction factor and the pressure agree to the band, and the pressure drop is `7.399080362802124` Pa. **`outlet_h` is not recorded**, for the reason the butane row states: it carries the libraries' ideal-gas offset, `1.5e-6` relative here, and a case has one tolerance.\n"
[cases.inputs]
components = ["water"]
inlet_n = 1.0
inlet_z = [1.0]
inlet_p = 500000.0
inlet_t = 300.0
length = 1000.0
diameter = 0.1
roughness = 1.0e-05
[cases.expected]
outlet_n = 1.0
outlet_z = [1.0]
outlet_p = 499992.6009196372
outlet_t = 300.0
pressure_drop = 7.399080362802124

[[cases]]
id = "the_adiabatic_line_drops_by_its_friction"
tolerance = 0.0005
source = "`process_pipe_modes.tsv`'s `adiabatic_50km` row: `AdiabaticPipeTest`'s 50 km state re-cased on PR - 95/5 methane/ethane at 100 bara, 25 C and 10 MSm3/day - through the compressible branch. The class drops `10.539` bar and lands at `89.461`; the effective length is the physical 50 km, the row the fittings case is measured against.\n"
[cases.inputs]
components = ["methane", "ethane"]
inlet_n = 4894.970603565765
inlet_z = [0.95, 0.05]
inlet_p = 10000000.0
inlet_t = 298.15
length = 50000.0
diameter = 0.5
roughness = 1.0e-05
[cases.expected]
outlet_n = 4894.970603565765
outlet_z = [0.95, 0.05]
outlet_p = 8946088.253356122
outlet_t = 298.15
outlet_h = -863.4836271943127
effective_length = 50000.0
pressure_drop = 1053911.746643878

[[cases]]
id = "the_fittings_add_their_equivalent_length"
tolerance = 0.0005
source = "The same line with two standard 90-degree elbows, Crane L/D `30` each: the effective length is `50000 + 60 D = 50030` m and the drop rises to `10.546` bar. **The row is the fittings' whole arithmetic** - `sum(L/D) D` added to the physical length - and the elbow's own L/D is stated by the caller rather than resolved from a table.\n"
[cases.inputs]
components = ["methane", "ethane"]
inlet_n = 4894.970603565765
inlet_z = [0.95, 0.05]
inlet_p = 10000000.0
inlet_t = 298.15
length = 50000.0
diameter = 0.5
roughness = 1.0e-05
fittings = [
    { ld_ratio = 30.0, count = 2.0 },
]
[cases.expected]
outlet_n = 4894.970603565765
outlet_z = [0.95, 0.05]
outlet_p = 8945407.149292042
outlet_t = 298.15
outlet_h = -863.3563051686726
effective_length = 50030.0
pressure_drop = 1054592.850707958

[[cases]]
id = "the_stated_outlet_pressure_solves_the_flow"
tolerance = 0.002
source = "`AdiabaticPipeTest.testSetOutletPressureMode`'s state: the same 50 km line asked for 80 bara. `calcFlow` bisects the flow - the class's own seed of the inlet flow, a `0.001` to `100` bracket, decades widened until it straddles, then fifty passes - and lands on `6656.09` mol/s, `36%` above the inlet's. **The result's `outlet_n` is the solved flow**, which the class writes back onto its inlet stream; the inlet's own flow is only the seed.\n"
[cases.inputs]
components = ["methane", "ethane"]
inlet_n = 4894.970603565765
inlet_z = [0.95, 0.05]
inlet_p = 10000000.0
inlet_t = 298.15
length = 50000.0
diameter = 0.5
roughness = 1.0e-05
outlet_pressure = 8000000.0
[cases.expected]
outlet_n = 6656.090851893372
outlet_z = [0.95, 0.05]
outlet_p = 8000000.0
outlet_t = 298.15
outlet_h = -684.2417400868012
effective_length = 50000.0
pressure_drop = 2000000.0

[[cases]]
id = "the_beggs_and_brills_march_over_the_same_geometry"
tolerance = 0.0005
source = "`process_pipe_modes.tsv`'s `beggs_and_brills_50km` row: `PipeBeggsAndBrills` over the same 50 km, 0.5 m line at five segments and zero elevation. The isothermal march drops `10.578` bar and lands at `89.422`, which is `0.04` bar more than the adiabatic single-phase form - the two are different correlations over one geometry, and the model states which one it ran.\n"
[cases.inputs]
components = ["methane", "ethane"]
inlet_n = 4894.970603565765
inlet_z = [0.95, 0.05]
inlet_p = 10000000.0
inlet_t = 298.15
length = 50000.0
diameter = 0.5
roughness = 1.0e-05
correlation = "beggs_and_brills"
number_of_increments = 5
elevation = 0.0
[cases.expected]
outlet_n = 4894.970603565765
outlet_z = [0.95, 0.05]
outlet_p = 8942233.52757637
outlet_t = 298.15
outlet_h = -862.7630099376822
effective_length = 50000.0
pressure_drop = 1057766.47242363
