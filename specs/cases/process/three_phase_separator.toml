model = "process.three_phase_separator"

[[cases]]
id = "the_equilibrium_split"
tolerance = 0.0002
source = "NeqSim master, `ThreePhaseSeparator.run` on a 0.5/0.3/0.2 methane/n-butane/water feed at 300 K and 20 bara, from `validation/neqsim/captures/process_three_phase_separator.tsv`. **The feed splits three ways, and that is what this model is for**: a `Separator` at the same state finds two phases with the water in the oil, and the tank inherits its answer. The flows and compositions agree to `2e-13`; the enthalpies are `0.06` J/mol apart, which is the two libraries' ideal-gas offset and is `1.2e-4` relative on the vapour's small magnitude - the tolerance is the separator's, for the separator's reason.\n"
[cases.inputs]
components = ["methane", "n-butane", "water"]
feed_n = 1.0
feed_z = [0.5, 0.3, 0.2]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_aqueous = 0.0
gas_in_oil = 0.0
oil_in_aqueous = 0.0
oil_in_gas = 0.0
aqueous_in_gas = 0.0
aqueous_in_oil = 0.0
