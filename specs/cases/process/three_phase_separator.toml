[[cases]]
id = "a_heat_input_moves_the_multiphase_flash"
tolerance = 0.001
source = "The capture's third row: 1000 W into the same feed, at 1 mol/s. `run` adds the duty to the total enthalpy and runs a **multiphase** `PHflash`, so the outlets land at `371.23` K and the oil phase is gone - what is left is a vapour and a water-rich liquid at `0.1617` mol/s. **The tolerance is looser than the other rows' and the reason is measured**: the temperature the two libraries solve for differs by `0.002` K, which is their ideal-gas enthalpy offset (about `0.28` J/mol at this temperature) divided by the mixture's heat capacity. The port solves the same equation on `eos.tp_multiflash` rather than on NeqSim's own PH iteration, and every field of the row lands inside `2e-4`: the vapour's water fraction is the widest at `7.5e-5`, which is that same offset divided by the water's latent heat at this temperature. **The tolerance is the trace's**: the aqueous outlet's n-butane is `3e-11`, and a relative assertion on a number that small measures the two libraries' last bits rather than the state.\n"
[cases.inputs]
components = ["methane", "n-butane", "water"]
feed_n = 1.0
feed_z = [0.5, 0.3, 0.2]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
gas_in_aqueous = 0.0
gas_in_oil = 0.0
oil_in_aqueous = 0.0
oil_in_gas = 0.0
aqueous_in_gas = 0.0
aqueous_in_oil = 0.0
heat_input = 1000.0
[cases.expected]
vapour_n = 0.8383179024874746
vapour_z = [0.5964323238825336, 0.3578594696648377, 0.04570820645262857]
vapour_p = 2000000.0
vapour_t = 371.2337801579336
vapour_h = 5143.330332745325
heavy_liquid_n = 0.16168209751152537
heavy_liquid_z = [6.510707274410019e-7, 3.057238296098721e-11, 0.9999993488987003]
heavy_liquid_p = 2000000.0
heavy_liquid_t = 371.2337801579336
heavy_liquid_h = -38899.826680291575

