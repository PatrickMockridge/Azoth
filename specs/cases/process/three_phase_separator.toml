[[cases]]
id = "a_dry_feed_has_no_aqueous_outlet"
tolerance = 0.0002
source = "The capture's sixth row: a 0.7/0.3 methane/n-butane feed, which has no aqueous phase at all. `run` gives the aqueous outlet a `1e-20 kg/hr` clone of the whole system, whose composition is `[0.3411672805114989, 0.06794331480957302]` - **it does not sum to one** - and whose enthalpy is that clone's own `612.29` J/mol. This port answers with a zero-flow outlet instead and the row is declared rather than pinned: the class reports a state for a stream that carries nothing, and reproducing a composition that is not a composition would be reproducing a defect.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.7, 0.3]
feed_p = 2000000.0
feed_t = 300.0
pressure_drop = 0.0
