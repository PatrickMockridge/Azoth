model = "process.pfp_demand"

[[cases]]
id = "pool_fire_thin_wall_requires_h60"
tolerance = 1.0e-12
source = "`PfpDemandCalculatorTest.testPoolFireRequiresPfp`: 100 kW/m2 on a 0.012 m wall, 3600 s. From `validation/neqsim/captures/process_pfp_demand.tsv` (`pfp_pool_thin_wall_h60`); the class's rating `H60` is the port's `h60`."
[cases.inputs]
incident_heat_flux = 100000.0
steel_thickness = 0.012
required_survival_time = 3600.0
[cases.expected]
steel_mass_per_area = 94.2
bare_steel_time_to_critical = 197.45366666666666
required_survival_time = 3600.0
pfp_required = true
required_pfp_thickness = 0.028057215110380333
required_pfp_thickness_mm = 28.057215110380334
rating = "h60"

