model = "process.stripping_column"
[[cases]]
id = "hydrocarbon_stripper"
tolerance = 0.0001
source = "NeqSim's `StrippingColumnTest.stripsLightHydrocarbonsAtModeratePressureWithWarmReuseAndNearbyFeed`, re-cased on PR and **left unpinned**, from `validation/neqsim/captures/process_absorber.tsv`: five trays at 12 bara, a methane-to-n-pentane stripping gas at 70 C against a rich liquid of the same substances at 70 C, and a gate of `1e-4` K. **The class's own case pins every tray and states `MESH_RESIDUAL`**, so its row stops after one sweep under a rung this port refuses; the capture keeps it as evidence and this row is the oracle. The port reaches NeqSim's state: every tray temperature within `5.3e-4` K and the two products within `2e-6` relative.\n"
[cases.inputs]
stripping_gas_components = ["methane", "propane", "n-butane", "n-pentane", "n-heptane"]
rich_liquid_components = ["methane", "propane", "n-butane", "n-pentane", "n-heptane"]
stripping_gas_n = 2.547079374624363
stripping_gas_z = [0.99, 0.008, 0.0015, 0.0005, 0.0]
stripping_gas_p = 1200000.0
stripping_gas_t = 343.15
rich_liquid_n = 2.9489815574232177
rich_liquid_z = [0.02, 0.08, 0.12, 0.15, 0.63]
rich_liquid_p = 1200000.0
rich_liquid_t = 343.15
number_of_stages = 5
top_pressure = 1200000.0
bottom_pressure = 1200000.0
temperature_tolerance = 1e-04
max_iterations = 80
