# Instances of `process.heater`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.heater
cases:
- id: fifty_kilowatts_on_ten_moles_per_second
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 0.0
    heat_duty: 50000.0
  expected:
    T: 325.2262607503454
    P: 2000000.0
  tolerance: 1.0e-09
- id: no_duty_is_the_identity
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    pressure_drop: 0.0
    heat_duty: 0.0
  expected:
    T: 300.0
    P: 2000000.0
  tolerance: 1.0e-07
