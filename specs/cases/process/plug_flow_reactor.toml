[[cases]]
id = "isothermal"
tolerance = 0.005
source = "The capture's `isothermal_rk4` row: `setEnergyMode(ISOTHERMAL)`, so `dT/dz` is zero and the temperature is overridden back to the inlet after every step. The outlet is at the feed's own 600 K and the conversion is `0.0411` against the adiabatic row's `0.1067` - a colder reactor reacts less - and the duty the vessel had to supply is `1646.51` W, which is the enthalpy the reaction released. **This is the one branch whose output does not carry the heat-capacity divergence**, because the energy balance that divides by `Cp * sum F` is the branch it skips."
[cases.inputs]
components = ["methane", "oxygen", "nitrogen"]
feed_n = 1.0
feed_z = [0.05, 0.1, 0.85]
feed_p = 500000.0
feed_t = 600.0
length = 5.0
