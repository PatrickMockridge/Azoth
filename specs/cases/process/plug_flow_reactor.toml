outlet_temperature = 654.2137334012193
temperature_profile = [600.0, 605.4214, 610.8427, 616.2641, 621.6855, 627.1069, 632.5282, 637.9496, 643.371, 648.7924, 654.2137]

[[cases]]
id = "hundred_steps"
tolerance = 0.005
source = "The capture's `rk4_default` row: the class's own defaults - a hundred steps and a refresh every ten - so this is the machine a bare `new PlugFlowReactor(name, inlet)` is. It reaches twice the conversion of the ten-step row (`0.1067` against `0.0426`) at the same length, and **every bit of that difference is the refresh schedule**: the same march at fifty steps lands at `0.0848`, so the step count moves the answer through where the properties are re-read and not through the integration order."
[cases.inputs]
