[[cases]]
id = "frozen_ten_steps"
tolerance = 0.005
source = "NeqSim master, `PlugFlowReactor.run` on 0.05/0.10/0.85 methane/oxygen/nitrogen at 600 K, 5 bara and 1 mol/s, through `methanecombustion` as a power law with `A = 1e4`, `Ea = 80000` J/mol and `dH = -802000` J/mol, over five metres of 0.10 m tube in ten RK4 steps, from `validation/neqsim/captures/process_plug_flow_reactor.tsv`. **Ten steps is the setter's own floor and the reason this row is the case**: `numberOfSteps` is clamped to `max(10, n)`, and at ten steps with the default `propertyUpdateFrequency` of ten the refresh never fires inside the loop - `s % 10 == 0 && s < 10` is false for every `s` - so this is a purely frozen march and the class's own rate stays at `5.428858e-2` at every station. The tolerance is the libraries' heat-capacity divergence, `6.85e-4`, which integrates into the temperature and then into the conversion."
[cases.inputs]
components = ["methane", "oxygen", "nitrogen"]
feed_n = 1.0
feed_z = [0.05, 0.1, 0.85]
feed_p = 500000.0
feed_t = 600.0
length = 5.0
diameter = 0.1
number_of_tubes = 1.0
energy_mode = "adiabatic"
coolant_temperature = 298.15
overall_heat_transfer_coefficient = 50.0
number_of_steps = 10.0
integration_method = "rk4"
property_update_frequency = 10.0
thermodynamic_coupling = "frozen_properties"
reaction = "methanecombustion"
reaction_orders = [1.0, 1.0]
rate_type = "power_law"
pre_exponential_factor = 10000.0
activation_energy = 80000.0
temperature_exponent = 0.0
heat_of_reaction = -802000.0
[cases.expected]
product_n = 1.0
product_z = [0.04786809248091879, 0.09573618496183758, 0.85, 0.00213190751908123, 0.00426381503816246]
product_p = 499998.8740008154
product_t = 654.2137334012193
product_h = 11618.534781752565
conversion = 0.04263815038162422
pressure_drop = 1.1259991845591344
outlet_temperature = 654.2137334012193
heat_duty = 0.0
positions = [0.0, 0.5, 1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]
temperature_profile = [600.0, 605.4214, 610.8427, 616.2641, 621.6855, 627.1069, 632.5282, 637.9496, 643.371, 648.7924, 654.2137]
pressure_profile = [500000.0, 499999.9, 499999.8, 499999.7, 499999.5, 499999.4, 499999.3, 499999.2, 499999.1, 499999.0, 499998.9]
conversion_profile = [0.0, 0.00426382, 0.00852763, 0.01279145, 0.01705526, 0.02131908, 0.02558289, 0.02984671, 0.03411052, 0.03837434, 0.04263815]

[[cases]]
id = "euler_ten_steps"
tolerance = 0.005
source = "The capture's `euler_ten_steps` row: the same reactor with `setIntegrationMethod(\"EULER\")`. **Every value is the RK4 row's to the last digit the capture prints**, and that is the measurement rather than a coincidence: a frozen march has a constant derivative at every station - the rate is `5.428858e-2` throughout - so the two schemes integrate the same straight line and neither is more accurate than the other. The case exists so that a change which made them differ would fail, which is what a frozen-property coupling is supposed to prevent."
[cases.inputs]
components = ["methane", "oxygen", "nitrogen"]
feed_n = 1.0
feed_z = [0.05, 0.1, 0.85]
feed_p = 500000.0
feed_t = 600.0
length = 5.0
diameter = 0.1
number_of_tubes = 1.0
energy_mode = "adiabatic"
coolant_temperature = 298.15
overall_heat_transfer_coefficient = 50.0
number_of_steps = 10.0
integration_method = "euler"
property_update_frequency = 10.0
thermodynamic_coupling = "frozen_properties"
reaction = "methanecombustion"
reaction_orders = [1.0, 1.0]
rate_type = "power_law"
pre_exponential_factor = 10000.0
