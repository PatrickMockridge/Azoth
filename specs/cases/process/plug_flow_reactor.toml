conversion = 0.041060028350672906
outlet_temperature = 600.0
heat_duty = 1646.5071368619836

[[cases]]
id = "catalyst_bed"
tolerance = 0.005
source = "The capture's `bed_rk4` row: the same reactor with `setCatalystBed(new CatalystBed(3.0, 0.40, 800.0))`, the class's own default pellet. **The bed is what makes the pressure row the Ergun equation**, and the difference is four orders of magnitude - `1.76` bar over the tube against the `1.2e-5` the empty-tube Darcy branch gives - so the outlet leaves at `3.24` bara rather than `5`. The lower pressure is a lower density, and the rate is second order in concentration, so the conversion falls to `0.0557` even though the bed's activity factor is one and its rate basis is volumetric."
[cases.inputs]
components = ["methane", "oxygen", "nitrogen"]
feed_n = 1.0
feed_z = [0.05, 0.1, 0.85]
feed_p = 500000.0
feed_t = 600.0
length = 5.0
diameter = 0.1
number_of_tubes = 1.0
energy_mode = "adiabatic"
coolant_temperature = 298.15
overall_heat_transfer_coefficient = 50.0
number_of_steps = 100.0
integration_method = "rk4"
property_update_frequency = 10.0
thermodynamic_coupling = "frozen_properties"
reaction = "methanecombustion"
reaction_orders = [1.0, 1.0]
rate_type = "power_law"
pre_exponential_factor = 10000.0
activation_energy = 80000.0
temperature_exponent = 0.0
heat_of_reaction = -802000.0
catalyst_bulk_density = 800.0
catalyst_activity_factor = 1.0
catalyst_particle_diameter = 0.003
catalyst_void_fraction = 0.4
