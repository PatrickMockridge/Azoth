model = "process.absorption_column"
[[cases]]
id = "lean_oil_absorber"
tolerance = 0.0001
source = "NeqSim's `AbsorptionColumnTest.recoversHeavyHydrocarbonsWithLeanOilAtModeratePressure`, re-cased on PR and **left unpinned**, from `validation/neqsim/captures/process_absorber.tsv`: five trays at 15 bara, a methane-to-n-pentane gas at 30 C against pure n-heptane at 20 C, and a gate of `1e-4` K. **The class's own case pins every tray**, which makes the base's own gate - the mean tray-temperature change - zero, so that row stops after one sweep; the port refuses the state it lands on, because that state's energy closure is `0.28` against the class's default gate of `1.6e-2`. Unpinned at `1e-4` K the port reaches NeqSim's state: every tray temperature within `5.3e-4` K and every traffic rate within `2e-6` relative.\\n"
