[cases.inputs]
mass_flow = 2.0
heat_of_combustion = 50000000.0
radiative_fraction = 0.2
relative_humidity = 0.5
distance = 50.0
[cases.expected]
total_radiative_power = 20000000.0
transmissivity = 0.4445289824297164
