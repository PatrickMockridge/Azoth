model = "process.jet_fire"
[[cases]]
id = "test_state_at_twenty_metres"
tolerance = 1.0e-9
source = "`FireModelsTest.jetFireFluxDecreasesWithDistance`'s state, 2 kg/s at 50 MJ/kg and a 0.20 radiative fraction, read at 20 m with the default humidity. From `validation/neqsim/captures/process_jet_fire.tsv` (`jet_fire_test_20m`)."
[cases.inputs]
mass_flow = 2.0
heat_of_combustion = 50000000.0
radiative_fraction = 0.2
distance = 20.0
[cases.expected]
total_radiative_power = 20000000.0
transmissivity = 0.5326676326817309
incident_heat_flux = 2119.417169158887
[[cases]]
id = "test_state_at_eighty_metres"
tolerance = 1.0e-9
source = "The same test state read at 80 m; the flux falls. From (`jet_fire_test_80m`)."
[cases.inputs]
mass_flow = 2.0
heat_of_combustion = 50000000.0
radiative_fraction = 0.2
distance = 80.0
[cases.expected]
total_radiative_power = 20000000.0
transmissivity = 0.3964089088042082
incident_heat_flux = 98.57880831539701
[[cases]]
id = "distance_to_twelve_point_five_kw"
tolerance = 1.0e-9
source = "`FireModelsTest.jetFireDistanceToFluxConsistent`'s target, 12.5 kW/m2, whose inverse is the class's fixed point. From (`jet_fire_distance_12500`)."
[cases.inputs]
mass_flow = 2.0
heat_of_combustion = 50000000.0
radiative_fraction = 0.2
target_flux = 12500.0
[cases.expected]
total_radiative_power = 20000000.0
distance_to_flux = 8.780123032005108
[[cases]]
id = "humidity_half_at_fifty_metres"
