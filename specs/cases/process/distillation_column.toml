tolerance = 0.001
source = "The same column with the gate at `1e-2` instead of `1e-6`. **Not a sloppier version of the first row - a different measurement.** Where a solve stops is what its answer is, so NeqSim's 7 iterations land on `3.7913503170929044` mol/s of distillate against the rigorous row's `3.7914997294607584`: the same separation to four figures, and a state 1.7e-4 away, which is what sets this case's tolerance.\n"
