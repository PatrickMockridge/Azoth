tolerance = 2.0e-4
source = "`side_draw_pumparound_return_binary`: **the binary column this model reproduces exactly, with one mechanism added** - `addLiquidPumparound` on draw tray 1, return tray 3, a tenth and five kelvin, a tenth of tray 1's liquid cooled by five kelvin and returned to tray 3. It is a labelled substitution: the class's own pumparound state lives in `DistillationColumnCoordinatedFlowTest`, whose column *also* has a reflux ratio, a vapor boilup ratio, a `MESH_RESIDUAL` solve and a side draw beside it - four things this port refuses - so the recycle cannot be separated from them there. **A return is an inlet and its draw is an outlet**, so both closures count them, or a state that closes exactly reports a 12 per cent imbalance. What the port reproduces: the return is the draw at exactly `T - 5 K`, its flow settles to a `2.8e-5` relative change against the class's own `1e-4`, the cooler takes `-438.78` W, and the profile moves - tray 1 at `334.5849` K against the ideal column's `336.15`.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 7.490704036290964
feed_z = [0.49999999999999994, 0.49999999999999994]
feed_p = 2000000.0
feed_t = 300.0
