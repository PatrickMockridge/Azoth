tolerance = 0.0001
source = "A **top duty** specification of -20000 W, applied directly to the condenser rather than searched for. **The condenser's temperature is deliberately not stated**: `setCondenserTemperature` reaches the tray's own `outTemperature`, and a stated one makes the tray take a `TPflash` branch that never reads the heat input - the capture's `spec_top_duty_under_a_pin_is_inert` row is that case, and it is declared uncased. Here the duty bites, and lands on the target to `3e-8` relative.\\n"
[cases.inputs]
