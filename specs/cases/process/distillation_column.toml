[[cases]]
id = "spec_top_purity"
tolerance = 0.0001
source = "A **top purity** specification on the binary column: 0.98 mole fraction of methane in the distillate, which the class drives with an outer secant on the condenser's temperature. It searches its way to 241.0 K, where the distillate is 97.9996 per cent methane, and the port finds the same temperature to **1e-9 K** - the tightest agreement in this tranche, because the searched quantity is the one thing the specification fixes. The tolerance is set by the duty, which is an enthalpy difference carrying the libraries' ideal-gas offset.\\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 7.490704036290964
