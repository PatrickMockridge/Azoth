model = "process.distillation_column"
[[cases]]
id = "binary_rigorous"
tolerance = 0.0002
source = "NeqSim master, `DistillationColumn` under its default `DIRECT_SUBSTITUTION`, from `validation/neqsim/captures/process_column.tsv`: four stages, the feed on stage 2, a condenser at -20 C and a reboiler at 100 C, 19 bara at the top and 20 at the bottom, and a gate of `1e-6` K. **The port reaches the same fixed point one iteration apart** - 15 against 14 - so the profile and the products agree: measured, every tray temperature within `1.4e-4` K, every traffic rate within `5e-6` relative, and both products' compositions within `3e-15`. **The tolerance is set by the duties and the enthalpies**, which are enthalpy differences carrying the libraries' ideal-gas offset - measured at `1.8e-5` and `2.2e-5` relative on the two duties. `iterations` and the three residuals are deliberately not expected values: they are one apart and differently defined, and the kernel's own test asserts them.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 7.490704036290964
feed_z = [0.49999999999999994, 0.49999999999999994]
feed_p = 2000000.0
feed_t = 300.0
number_of_stages = 4
feed_stage = 2
has_reboiler = true
has_condenser = true
top_pressure = 1900000.0
bottom_pressure = 2000000.0
reboiler_temperature = 373.15
condenser_temperature = 253.14999999999998
temperature_tolerance = 1e-06
max_iterations = 200
