# Instances of `process.compressor`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.compressor
cases:
- id: a_two_to_one_pressure_rise_at_three_quarters_efficiency
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    outlet_pressure: 4000000.0
    efficiency: 0.75
  expected:
    T: 322.096301712808
    P: 4000000.0
    power: 14951.486632779171
    isentropic_temperature: 319.5206991094713
  tolerance: 1.0e-09
- id: unit_efficiency_reaches_the_ideal_temperature
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    outlet_pressure: 4000000.0
    efficiency: 1.0
  expected:
    P: 4000000.0
    isentropic_temperature: 319.5206991094713
  tolerance: 1.0e-09
