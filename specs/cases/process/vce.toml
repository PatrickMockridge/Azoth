model = "process.vce"
[[cases]]
id = "test_state_at_twenty_metres"
tolerance = 1.0e-9
source = "`FireModelsTest.vceOverpressureDecreasesWithDistance`'s state, 1000 kg at 46 MJ/kg and strength class 4, read at 20 m. From `validation/neqsim/captures/process_vce.tsv` (`vce_test_20m`)."
[cases.inputs]
cloud_fuel_mass = 1000.0
heat_of_combustion = 46000000.0
strength_class = 4.0
distance = 20.0
[cases.expected]
combustion_energy = 46000000000.0
scaled_distance = 0.2602253427568675
dimensionless_overpressure = 0.1
overpressure = 10132.5
[[cases]]
id = "test_state_at_two_hundred_metres"
tolerance = 1.0e-9
source = "The same state read at 200 m, in the power-law branch. From (`vce_test_200m`)."
[cases.inputs]
cloud_fuel_mass = 1000.0
heat_of_combustion = 46000000.0
strength_class = 4.0
distance = 200.0
[cases.expected]
combustion_energy = 46000000000.0
scaled_distance = 2.602253427568675
dimensionless_overpressure = 0.03842823260047794
overpressure = 3893.740668243427
