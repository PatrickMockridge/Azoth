model = "process.pool_fire"
[[cases]]
id = "test_state_at_the_near_bound"
tolerance = 1.0e-9
source = "`FireModelsTest.poolFireGeometryAndFluxArePositive`'s state, 10 m and 0.06 kg/(m2 s) with the class's other three values, read at `R + 0.1`. From `validation/neqsim/captures/process_pool_fire.tsv` (`pool_fire_test_5m1`)."
[cases.inputs]
pool_diameter = 10.0
burn_rate = 0.06
distance = 5.1
[cases.expected]
total_burn_rate = 4.71238898038469
flame_height = 16.678690349069907
surface_emissive_power = 56143.30542946426
view_factor = 0.20857009934124066
incident_heat_flux = 11709.814790768976
