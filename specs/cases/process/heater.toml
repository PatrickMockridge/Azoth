source = "NeqSim capture `process_heater_capacity.tsv`, block `no_limits`: with neither limit set, `getCapacityConstraints` initializes an empty map - the mechanical design's duty and pressure-drop constraints are absent while its limits are zero - so the summary is the empty-map answer.\n"
