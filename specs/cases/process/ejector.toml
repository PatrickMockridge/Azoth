[[cases]]
id = "a_higher_discharge_pressure_recovers_more"
tolerance = 0.0005
source = "The capture's third row: discharging at 14 bara instead of 10. The diffuser's pressure rise is larger, so more of the mixing velocity's kinetic energy comes back as enthalpy and the outlet is *cooler* - `358.32` K against `357.55` - even though the discharge is denser. The class reports the compression ratio at `2.8` and the mixing Mach past one, at `1.05`. **The tolerance is this row's**, at `5e-4`: the libraries' enthalpy offset is `1.1` J/mol here against `0.35` on the others, which is `3.3e-4` of a `3403` J/mol outlet. The offset grows with the state's density, so the row that discharges hardest carries the widest band.\n"
[cases.inputs]
motive_components = ["methane", "n-butane"]
motive_n = 1.0
motive_z = [0.9, 0.1]
motive_p = 3000000.0
motive_t = 400.0
suction_components = ["methane", "n-butane"]
suction_n = 0.5
suction_z = [0.9, 0.1]
suction_p = 500000.0
suction_t = 300.0
discharge_pressure = 1400000.0
motive_nozzle_efficiency = 0.75
suction_nozzle_efficiency = 0.9
mixing_efficiency = 0.85
diffuser_efficiency = 0.8
