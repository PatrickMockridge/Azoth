model = "process.ejector"

[[cases]]
id = "the_class_at_its_own_defaults"
tolerance = 0.0002
source = "NeqSim master, `Ejector.run` on 1 mol/s of 0.9/0.1 methane/n-butane at 30 bara and 400 K expanding into 0.5 mol/s of the same fluid at 5 bara, discharging at 10 bara, from `validation/neqsim/captures/process_ejector.tsv`. The efficiencies are the class's own field initialisers - `0.75`, `0.90`, `0.85` and `0.80` - and the mixing pressure is its estimate rather than a stated input. **No temperature, pressure or flow is an input of the machine beyond the two inlets and the discharge**: the outlet's `357.55` K is what the momentum-and-diffuser route leaves, and the entrainment `0.5`, compression `2.0` and expansion `3.0` are `0.5/1.0`, `10/5` and `30/10` read back off the record. The enthalpies are `0.35` J/mol apart, which is the libraries' enthalpy model offset - the same magnitude the separator's and the tank's rows carry. The row's `design_` lines are `updateDesign`'s container: the four areas from each stage's own density and velocity, their diameters, the four fixed length multiples, and the swept cylinders the two volumes sum.\n"
[cases.inputs]
motive_components = ["methane", "n-butane"]
motive_n = 1.0
motive_z = [0.9, 0.1]
motive_p = 3000000.0
motive_t = 400.0
suction_components = ["methane", "n-butane"]
suction_n = 0.5
suction_z = [0.9, 0.1]
suction_p = 500000.0
suction_t = 300.0
discharge_pressure = 1000000.0
motive_nozzle_efficiency = 0.75
suction_nozzle_efficiency = 0.9
mixing_efficiency = 0.85
diffuser_efficiency = 0.8
[cases.expected]
outlet_n = 1.5
outlet_z = [0.9, 0.10000000000000002]
outlet_p = 1000000.0
outlet_t = 357.55282081845144
outlet_h = 3446.5843564496936
motive_nozzle_throat_area = 9.16682253604558e-06
motive_nozzle_diameter = 0.0034163666302758993
