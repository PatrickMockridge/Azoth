[[cases]]
id = "wilson_fallback_superheated_gas"
tolerance = 0.0001
source = "The same mixture at 450 K, where the flash finds **one** phase. This is the row that reaches the Wilson branch: the class has no `y` and no `x` to divide, so it estimates `K_i = (Pc_i/P) exp(5.373 (1 + omega_i) (1 - Tc_i/T))` on the flashed fluid's own temperature and pressure, and the feed quality is `0` because the single phase is a gas. The `5.373` is the class's constant. **Tolerance**: the worst field is `distillate_h` at `7.6e-5` relative, which is the libraries' ideal-gas enthalpy offset and not this arithmetic - the FUG chain agrees to `3e-12` or better. Azoth is `0.886` J/mol below NeqSim on these products, the offset `tests/stream.rs` measures.\n"
[cases.inputs]
components = ["methane", "ethane", "propane", "n-butane"]
feed_n = 1.0
feed_z = [0.1, 0.3, 0.4, 0.2]
feed_p = 2000000.0
feed_t = 450.0
light_key = "propane"
heavy_key = "n-butane"
light_key_recovery_distillate = 0.98
heavy_key_recovery_bottoms = 0.98
reflux_ratio_multiplier = 1.2
[cases.expected]
relative_volatility = 2.360742641862776
minimum_stages = 9.061531808008356
minimum_reflux_ratio = 0.8355991286740769
