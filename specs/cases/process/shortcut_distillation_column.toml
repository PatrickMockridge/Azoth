[[cases]]
id = "binary_methane_nbutane"
tolerance = 0.0002
source = "A binary, which is the row a reader can check by hand: with the light key more than forty times as volatile as the heavy key and both recoveries at 0.99, the split fractions are `0.99` and `1 - 0.99` and the products come out at 0.99/0.01 either way. The distillate and the bottoms each carry half the feed, so the Kirkbride argument's `B/D` is one and the square's placement does not show up here. **Tolerance**: the worst field is `distillate_h` at `1.1e-4` relative, which is the libraries' ideal-gas enthalpy offset and not this arithmetic - the FUG chain agrees to `3e-12` or better. Azoth is `0.0634` J/mol below NeqSim on these products, the offset `tests/stream.rs` measures.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 1.0
feed_z = [0.5, 0.5]
feed_p = 2000000.0
feed_t = 300.0
light_key = "methane"
heavy_key = "n-butane"
