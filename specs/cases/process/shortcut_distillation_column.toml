model = "process.shortcut_distillation_column"
[[cases]]
id = "propane_nbutane_split"
tolerance = 0.0001
source = "NeqSim master, `ShortcutDistillationColumn.run` on a two-phase PR feed, from `validation/neqsim/captures/process_shortcut_distillation_column.tsv`. Four components so every branch of the class's own split-fraction estimate is reached: methane and ethane are more volatile than the light key (the `0.999` branch), propane is the light key, n-butane the heavy key, and nothing sits between the keys. The feed's flash finds two phases, so the K-values are the flash's `y/x` and not Wilson's. **The feed tray is where the port and the published correlation part**: this argument is the class's, and the assumptions give the expression. **Tolerance**: the worst field is `distillate_h` at `2.8e-5` relative, which is the libraries' ideal-gas enthalpy offset and not this arithmetic - the FUG chain agrees to `3e-12` or better. Azoth is `0.0636` J/mol below NeqSim on these products, the offset `tests/stream.rs` measures.\n"
[cases.inputs]
components = ["methane", "ethane", "propane", "n-butane"]
feed_n = 1.0
feed_z = [0.1, 0.3, 0.4, 0.2]
feed_p = 2000000.0
feed_t = 300.0
light_key = "propane"
heavy_key = "n-butane"
light_key_recovery_distillate = 0.98
heavy_key_recovery_bottoms = 0.98
reflux_ratio_multiplier = 1.2
[cases.expected]
relative_volatility = 2.7769364052320538
minimum_stages = 7.620946291100026
minimum_reflux_ratio = 0.44008894984866465
actual_reflux_ratio = 0.5281067398183975
actual_stages = 20.510953860048968
feed_tray_number = 14.0
condenser_duty = -36472.85166598551
reboiler_duty = 36378.53354647986
distillate_n = 0.7956000000005571
distillate_z = [0.12556561086035364, 0.3766968325795219, 0.49270990447366647, 0.005027652086458033]
distillate_p = 2000000.0
distillate_t = 300.0
distillate_h = -2243.812676863934
bottoms_n = 0.20439999999944294
bottoms_z = [0.0004892367906107846, 0.0014677103718262435, 0.03913894324859146, 0.9589041095889715]
bottoms_p = 2000000.0
bottoms_t = 300.0
bottoms_h = -18697.707831107058
[[cases]]
id = "pressures_stated_move_the_product_phase"
tolerance = 0.005
source = "The same feed and the same keys with both product pressures stated - 18 bara on the distillate and 21 on the bottoms. **Every FUG number is identical**, because the class reads the two pressures only where it creates the products; what moves is the products' state. The distillate's enthalpy goes from -2243.81 to -13.32 J/mol, which is not two bar of compression but a phase change: at 18 bara the distillate flashes to a single vapour, and this row is the measurement of that. **Tolerance**: the worst field is `distillate_h` at `4.8e-3` relative, because a distillate at -13 J/mol divides a 0.063 J/mol offset by almost nothing, which is the libraries' ideal-gas enthalpy offset and not this arithmetic - the FUG chain agrees to `3e-12` or better. Azoth is `0.0634` J/mol below NeqSim on these products, the offset `tests/stream.rs` measures.\n"
[cases.inputs]
components = ["methane", "ethane", "propane", "n-butane"]
feed_n = 1.0
feed_z = [0.1, 0.3, 0.4, 0.2]
feed_p = 2000000.0
feed_t = 300.0
light_key = "propane"
heavy_key = "n-butane"
light_key_recovery_distillate = 0.98
heavy_key_recovery_bottoms = 0.98
reflux_ratio_multiplier = 1.2
condenser_pressure = 1800000.0
reboiler_pressure = 2100000.0
