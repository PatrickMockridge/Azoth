model = "process.separator_performance"

# The rows are `validation/neqsim/captures/process_separator_performance.tsv`: the class's own
# `SeparatorPerformanceCalculatorTest` states, plus a log-normal/custom-curve row, the
# calibration test's base and tuned machines, and the gravity section switched off.

[[cases]]
id = "two_phase_horizontal_wire_mesh"
tolerance = 1.0e-09
source = "`process_separator_performance.tsv`'s `two_phase_horizontal_wire_mesh` row - the class's own two-phase test state. The gravity section removes the large droplets and the wire mesh takes the rest, so `overall_gas_liquid_efficiency` is 0.99696 and `oil_in_gas` is 0.003038. `mist_eliminator_efficiency` is the class's default 5 um, 2.5, 0.998 curve."
[cases.inputs]
gas_density = 50.0
oil_density = 800.0
water_density = 0.0
gas_viscosity = 1.5e-05
oil_viscosity = 0.002
water_viscosity = 0.0
gas_velocity = 1.0
vessel_diameter = 2.0
vessel_length = 8.0
orientation = "horizontal"
liquid_level_fraction = 0.5
gas_liquid_distribution = "rosin_rammler"
gas_liquid_characteristic_diameter = 1.0e-04
gas_liquid_spread = 2.6
mist_eliminator = "wire_mesh"
[cases.expected]
oil_in_gas = 0.0030383004536480573
water_in_gas = 0.0
gas_in_oil = 0.0
gas_in_water = 0.0
oil_in_water = 0.0
water_in_oil = 0.0
gravity_section_efficiency = 0.5431962998374725
mist_eliminator_efficiency = 0.9958746771661382
overall_gas_liquid_efficiency = 0.9969616995463519
liquid_liquid_gravity_efficiency = 0.0
gravity_cut_diameter = 1.2162572181754543e-04

