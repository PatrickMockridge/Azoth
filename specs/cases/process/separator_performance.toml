[[cases]]
id = "the_enhanced_two_phase_chain"
tolerance = 0.0002
source = "The enhanced capture's `two_phase_horizontal` row: `calculateEnhanced` on the class's own constants, with the wire-mesh eliminator and no explicit gas-liquid distribution, so the slug regime's generated one is used. **The chain is a second solver**: the regime is SLUG, the default HALF_PIPE device takes 41% in bulk, the geometry is a half-full 2.4 m x 7 m vessel, and the K factor's `4.9955` utilisation floods the eliminator, leaving the gravity stage's 0.5644 as the downstream efficiency. The API 12J record is non-compliant on both sections. The boolean flags are asserted in the kernel's own test, not here.\n"
