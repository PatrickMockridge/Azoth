# Instances of `process.mixer`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.mixer
cases:
- id: two_different_feeds_blend
  inputs:
    components:
    - methane
    - n-butane
    T:
    - 300.0
    - 350.0
    P:
    - 2000000.0
    - 1500000.0
    n:
    - 6.0
    - 4.0
    z:
    - - 0.6
      - 0.4
    - - 0.4
      - 0.6
  expected:
    T: 321.5288782883907
    P: 1500000.0
    flow: 10.0
    z_out:
    - 0.5199999999999999
    - 0.4800000000000001
  tolerance: 1.0e-09
- id: two_identical_feeds_double_the_flow_and_change_nothing_else
  inputs:
    components:
    - methane
    - n-butane
    T:
    - 300.0
    - 300.0
    P:
    - 2000000.0
    - 2000000.0
    n:
    - 6.0
    - 4.0
    z:
    - - 0.6
      - 0.4
    - - 0.6
      - 0.4
  expected:
    T: 300.0
    P: 2000000.0
    flow: 10.0
    z_out:
    - 0.6
    - 0.4
  tolerance: 1.0e-07
