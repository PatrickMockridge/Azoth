model = "process.packed_column"
[[cases]]
id = "packed_binary_2m"
tolerance = 0.0002
source = "The base column's own binary state at a packed height of `2.0` m, from `validation/neqsim/captures/process_packed_column.tsv`: the packed height makes `ceil(2.0 / 0.5)` = four middle trays, which is `process.distillation_column`'s `binary_rigorous` case exactly - the same feed, the same feed stage, the same two end pins, the same gate. **The expected values below are that case's own numbers, and that is this id's claim rather than a copy.** NeqSim's `PackedColumn` at `2.0` m and its `DistillationColumn` at four stages report bit-identical answers on all twenty-two captured quantities - the tray profile, both products and both duties - so the packing changed nothing but the stage count, and the port's `packed_column` reaches the base's own fixed point by construction rather than by a second solve.\n"
[cases.inputs]
components = ["methane", "n-butane"]
feed_n = 7.490704036290964
feed_z = [0.49999999999999994, 0.49999999999999994]
feed_p = 2000000.0
feed_t = 300.0
packed_height = 2.0
feed_stage = 2
has_reboiler = true
has_condenser = true
top_pressure = 1900000.0
bottom_pressure = 2000000.0
reboiler_temperature = 373.15
condenser_temperature = 253.14999999999998
temperature_tolerance = 1e-06
max_iterations = 200
