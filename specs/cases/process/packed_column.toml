tray_temperature = [373.15, 336.15382381733946, 303.0710539116486, 302.1225394582587, 296.84208939635556, 253.14999999999998]
tray_pressure = [2000000.0, 1980000.0, 1960000.0000000002, 1939999.9999999998, 1920000.0, 1900000.0]
tray_gas_n = [1.373278181743518, 0.5259031551756898, 4.5761815164886315, 4.558039582740156, 4.451759798394696, 3.7914997294607584]
