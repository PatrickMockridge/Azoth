converged = true
total_absolute_molar_transfer = 0.0
segment_height_from_bottom = [0.0, 0.0, 0.0, 0.0]
segment_heat_transfer_rate = [0.0, 0.0, 0.0, 0.0]
segment_net_molar_transfer = [0.0, 0.0, 0.0, 0.0]
[[cases]]
id = "billet_schultes"
tolerance = 0.0001
source = "`RateBasedPackedColumnTest.configuredColumn`'s own state at `BILLET_SCHULTES_1999`, from `validation/neqsim/captures/process_rate_based_billet.tsv`. **The other mass-transfer value, carried by both implementations** - it is not a correlation: it multiplies `kGa` by `max(0.1, Ch/6/0.4)` and `kLa` by `max(0.1, Cp)`, the two constants the packing's own row carries, so the pair is this state beside `co2_water_absorber`'s. **The packing is named `Pall-Ring-50-plastic`**: before upstream PR #4405 the class's `Pall-Ring-50` resolved to that row by the file's order, and the fix made the built-in row the reference, whose constants are `1.0` and `0.40` - the multipliers are then the identity. Naming the plastic row keeps this case the distinct measurement it was: NeqSim stops after sixteen passes at `1.4863066333248298e-10` mol/s where the Onda row takes fifteen, and the transfer is smaller - less liquid-film capacity retains less CO2. **The port's own gate is met one pass earlier**, at `4.96e-10` mol/s, where the class takes sixteen; the converged state below is the class's.\n"
[cases.inputs]
gas_components = ["methane", "CO2"]
gas_n = 14.744278187963598
gas_z = [0.9, 0.1]
gas_p = 5000000.0
gas_t = 313.15
liquid_components = ["water", "CO2"]
liquid_n = 30.8384987818793
liquid_z = [1.0, 0.0]
liquid_p = 5000000.0
liquid_t = 303.15
transfer_components = ["CO2"]
column_diameter = 1.0
packed_height = 6.0
