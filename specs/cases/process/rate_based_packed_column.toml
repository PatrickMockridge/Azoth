[[cases]]
id = "heat_transfer_disabled"
tolerance = 0.0002
source = "The same state with `heat_transfer_model = \"none\"`, which is `testCanDisableExplicitHeatTransfer`'s own state. **Both zeros are exact, and the case's band is the model's own rather than the exactness's.** The harness compares every field at one tolerance, and this model's fields agree across the two kernels inside `1e-4` - so a case stated at `1e-9` would fail on the segment's enthalpy closure, a sum of enthalpies of order `35` W that differs in the last few digits. The exactness is asserted where it belongs: `crates/azoth-process/tests/rate_based_packed_column.rs` holds both fields with `assert_eq!`, and a coefficient computed under the analogy is of order `1e5` - so a wrong one fails at any band either way. the class returns `0.0` before any correlation runs, so a port that computed a coefficient and clamped it to zero would not reproduce this. The capture's `heat_transfer_disabled` row holds the same two numbers under SRK. **The band is `2e-4` because the layer diff's worst key is `segment1_kla` at `1.4e-4`**, measured against the capture after the packing fix moved the reference row.\n"
[cases.inputs]
gas_components = ["methane", "CO2"]
gas_n = 14.744278187963598
gas_z = [0.9, 0.1]
gas_p = 5000000.0
gas_t = 313.15
liquid_components = ["water", "CO2"]
liquid_n = 30.8384987818793
liquid_z = [1.0, 0.0]
liquid_p = 5000000.0
liquid_t = 303.15
transfer_components = ["CO2"]
column_diameter = 1.0
packed_height = 6.0
number_of_segments = 4
packing_type = "Pall-Ring-50"
max_iterations = 20
convergence_tolerance = 1e-09
mass_transfer_correction = 3.0
heat_transfer_model = "none"
[cases.expected]
segment_overall_heat_transfer_coefficient = [0.0, 0.0, 0.0, 0.0]
segment_heat_transfer_rate = [0.0, 0.0, 0.0, 0.0]
[[cases]]
id = "zero_packed_height"
tolerance = 0.0001
source = "The same state with no bed at all, which is `testZeroPackedHeightGivesNoTransfer`. **A height of zero is a valid state** - `validateSetup` refuses only a negative one - and it is a *converged* solve on its first pass: the gate is short-circuited and the whole transfer block is behind the class's own `if (segmentHeight > 0.0)`. So the transfer is exactly zero, the component totals are empty and the profile is still four records.\n"
[cases.inputs]
gas_components = ["methane", "CO2"]
gas_n = 14.744278187963598
gas_z = [0.9, 0.1]
gas_p = 5000000.0
gas_t = 313.15
liquid_components = ["water", "CO2"]
liquid_n = 30.8384987818793
liquid_z = [1.0, 0.0]
liquid_p = 5000000.0
liquid_t = 303.15
transfer_components = ["CO2"]
column_diameter = 1.0
