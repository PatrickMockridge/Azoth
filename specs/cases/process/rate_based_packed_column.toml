model = "process.rate_based_packed_column"
[[cases]]
id = "co2_water_absorber"
tolerance = 0.0001
source = "`RateBasedPackedColumnTest.configuredColumn`'s own state, re-cased on PR, from `validation/neqsim/captures/process_rate_based_packed_column.tsv`. The class's own test runs SRK; this library's process layer resolves PR, so the capture holds the state on **both** cubics and this case is the PR row - the class's SRK row differs by three-fold on the transfer. **The convergence pair is the sharpest thing here**: the target stops after fifteen passes at `6.406918099353953e-10` mol/s; the port lands on the same fifteen at `6.395179173550314e-10`. **The target's interface surface tension is 0.2 per cent above the port's**, so the wetted area, `kla` and the transfer below are the port's own answers; the layer diff records that divergence, and the products and temperatures stay inside `1e-4`.\n"
[cases.inputs]
gas_components = ["methane", "CO2"]
gas_n = 14.744278187963598
gas_z = [0.9, 0.1]
gas_p = 5000000.0
gas_t = 313.15
liquid_components = ["water", "CO2"]
liquid_n = 30.8384987818793
liquid_z = [1.0, 0.0]
liquid_p = 5000000.0
liquid_t = 303.15
transfer_components = ["CO2"]
column_diameter = 1.0
packed_height = 6.0
number_of_segments = 4
packing_type = "Pall-Ring-50"
max_iterations = 20
convergence_tolerance = 1e-09
mass_transfer_correction = 3.0
mass_transfer_correlation = "onda_1968"
film_model = "maxwell_stefan_matrix"
heat_transfer_model = "chilton_colburn_analogy"
segment_solver = "sequential_explicit"
column_solver = "fixed_point_profile"
[cases.expected]
iterations = 15
convergence_residual = 6.395179173550314e-10
converged = true
total_absolute_molar_transfer = 0.022279561458409265
gas_out_n = 14.740731987732326
gas_out_z = [0.9002165143637915, 0.0997834856362085]
liquid_out_n = 30.842044981427513
liquid_out_z = [0.9998850206090306, 0.00011497939096938298]
segment_gas_temperature = [308.74401428390894, 306.2282092936267, 304.7914144738604, 303.9707072369302]
segment_k_ga = [138.9759216130051, 138.5725286347088, 138.34903454512272, 138.2433575964469]
segment_k_la = [0.009693192089756934, 0.00954797738183964, 0.009473544500961287, 0.009439049624305999]
segment_wetted_area = [56.404228115056824, 55.95635725355144, 55.71310702141193, 55.574516395403165]
