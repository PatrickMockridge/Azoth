model = "process.rate_based_packed_column"
[[cases]]
id = "co2_water_absorber"
tolerance = 0.0001
source = "`RateBasedPackedColumnTest.configuredColumn`'s own state, re-cased on PR, from `validation/neqsim/captures/process_rate_based_packed_column.tsv`. The class's own test runs SRK; this library's process layer resolves PR, so the capture holds the state on **both** cubics and this case is the PR row - the class's SRK row differs by three-fold on the transfer. **The convergence pair is the sharpest thing here**: NeqSim stops after fifteen passes at `6.770219315721526e-10` mol/s, and the port lands on the same fifteen and the same residual to four figures. The tolerance is the `1e-4` band the hydraulics and the heat rate are reproduced inside; the products and the transport quantities agree to `1e-6` or better.\n"
[cases.inputs]
gas_components = ["methane", "CO2"]
gas_n = 14.744278187963598
gas_z = [0.9, 0.1]
gas_p = 5000000.0
gas_t = 313.15
liquid_components = ["water", "CO2"]
liquid_n = 30.8384987818793
liquid_z = [1.0, 0.0]
liquid_p = 5000000.0
liquid_t = 303.15
transfer_components = ["CO2"]
column_diameter = 1.0
packed_height = 6.0
number_of_segments = 4
packing_type = "Pall-Ring-50"
max_iterations = 20
convergence_tolerance = 1e-09
mass_transfer_correction = 3.0
mass_transfer_correlation = "onda_1968"
film_model = "maxwell_stefan_matrix"
heat_transfer_model = "chilton_colburn_analogy"
segment_solver = "sequential_explicit"
column_solver = "fixed_point_profile"
[cases.expected]
iterations = 15
convergence_residual = 6.770219315721526e-10
converged = true
total_absolute_molar_transfer = 0.025846775244300083
gas_out_n = 14.740164200367678
gas_out_z = [0.9002511904742714, 0.09974880952572864]
liquid_out_n = 30.842612768752357
liquid_out_z = [0.999866613541988, 0.00013338645801194666]
segment_gas_temperature = [308.74413554097646, 306.2282564923705, 304.79129250460346, 303.9706462523017]
segment_k_ga = [138.97591872603377, 138.57527821768343, 138.3559707881975, 138.25671456700022]
segment_k_la = [0.011209042099418165, 0.011066985320574114, 0.010995184081562897, 0.010963418987031579]
segment_wetted_area = [87.20366010445194, 87.13727028512417, 87.10322450830841, 87.08210249266754]
