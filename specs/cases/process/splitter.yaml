# Instances of `process.splitter`.
#
# The model is the type - what the machine is, what it accepts, what it computes
# and where it is valid. Each entry below is one machine to run: its components,
# its state, its settings, and the numbers the run must reproduce. A case that
# violates the type's contract is a broken test rather than a discovery.
model: process.splitter
cases:
- id: thirty_seventy_split_of_a_two_phase_feed
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
    fractions:
    - 0.3
    - 0.7
  expected:
    T: 300.0
    P: 2000000.0
    beta: 0.6824390296509162
    flows:
    - 3.0
    - 7.0
  tolerance: 1.0e-09
- id: a_single_branch_takes_everything
  inputs:
    components:
    - methane
    - n-butane
    T: 300.0
    P: 2000000.0
    n: 10.0
    z:
    - 0.6
    - 0.4
