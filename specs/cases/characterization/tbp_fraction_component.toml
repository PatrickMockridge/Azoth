model = "characterization.tbp_fraction_component"

# Every expected value is a field of `validation/neqsim/captures/tbp_fraction_component_probe.tsv`,
# taken from the component's own getters after `addTBPfraction` - `component_*` where the
# capture has both, because the model's and the component's acentric factors differ.

