model = "characterization.transfer_binary_interaction_parameters"

# Every expected value is a matrix row of
# `validation/neqsim/captures/characterization_fluid_rebuild_probe.tsv`. The target's initial
# matrix is the input `target_kij`; the answer is the capture's `target_final_kij`.

[[cases]]
id = "base_and_pseudo_pairs"
tolerance = 1.0e-12
source = "A reference with two base components and three cuts, against a target with the same bases and two. The bases' pair is replaced, the cuts are matched by position, and the target's own values elsewhere survive."
[cases.inputs]
reference_components = [{ name = "methane", pseudo_component = false }, { name = "CO2", pseudo_component = false }, { name = "C7_PC", pseudo_component = true }, { name = "C8_PC", pseudo_component = true }, { name = "C9_PC", pseudo_component = true }]
target_components = [{ name = "methane", pseudo_component = false }, { name = "CO2", pseudo_component = false }, { name = "C10_PC", pseudo_component = true }, { name = "C11_PC", pseudo_component = true }]
reference_kij = [[0.0000000000000000,0.090000000000000000,0.0000000000000000,0.040000000000000000,0.0000000000000000],[0.090000000000000000,0.0000000000000000,0.10000000000000000,0.10000000000000000,0.020000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000,0.010000000000000000,0.0000000000000000],[0.040000000000000000,0.10000000000000000,0.010000000000000000,0.0000000000000000,0.0000000000000000],[0.0000000000000000,0.020000000000000000,0.0000000000000000,0.0000000000000000,0.0000000000000000]]
target_kij = [[0.0000000000000000,0.097300000000000000,0.0000000000000000,0.0000000000000000],[0.097300000000000000,0.0000000000000000,0.10000000000000000,0.10000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000,0.0000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000,0.0000000000000000]]
[cases.expected]
target_kij = [[0.0000000000000000,0.090000000000000000,0.0000000000000000,0.040000000000000000],[0.090000000000000000,0.0000000000000000,0.10000000000000000,0.10000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000,0.010000000000000000],[0.040000000000000000,0.10000000000000000,0.010000000000000000,0.0000000000000000]]

[[cases]]
id = "target_has_fewer_pcs"
tolerance = 1.0e-12
source = "A target with one cut against a reference with three. Only the first positional pair can transfer, and the reference's nonzero interaction with its second cut has nowhere to go."
[cases.inputs]
reference_components = [{ name = "methane", pseudo_component = false }, { name = "CO2", pseudo_component = false }, { name = "C7_PC", pseudo_component = true }, { name = "C8_PC", pseudo_component = true }, { name = "C9_PC", pseudo_component = true }]
target_components = [{ name = "methane", pseudo_component = false }, { name = "CO2", pseudo_component = false }, { name = "C10_PC", pseudo_component = true }]
reference_kij = [[0.0000000000000000,0.090000000000000000,0.0000000000000000,0.040000000000000000,0.0000000000000000],[0.090000000000000000,0.0000000000000000,0.10000000000000000,0.10000000000000000,0.020000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000,0.010000000000000000,0.0000000000000000],[0.040000000000000000,0.10000000000000000,0.010000000000000000,0.0000000000000000,0.0000000000000000],[0.0000000000000000,0.020000000000000000,0.0000000000000000,0.0000000000000000,0.0000000000000000]]
target_kij = [[0.0000000000000000,0.097300000000000000,0.0000000000000000],[0.097300000000000000,0.0000000000000000,0.10000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000]]
[cases.expected]
target_kij = [[0.0000000000000000,0.090000000000000000,0.0000000000000000],[0.090000000000000000,0.0000000000000000,0.10000000000000000],[0.0000000000000000,0.10000000000000000,0.0000000000000000]]

