model = "characterization.characterize_to_reference"

[[cases]]
id = "five_cuts_onto_three"
tolerance = 1.0e-12
source = "NeqSim master, `PseudoComponentCombiner.characterizeToReference` on a five-cut source and a three-cut reference, from `validation/neqsim/captures/pseudo_component_combiner_probe.tsv`. The keys are the probe's own sorting keys - each cut's normal boiling point, which `addTBPfraction` derives from its molar mass and gravity - and the densities cross as kg/m3 where the class carries g/cm3.\n"
[cases.inputs]
source = [
    { moles = 1.0, molar_mass = 0.1, density = 700.0, boiling_point = 378.77 },
    { moles = 1.5, molar_mass = 0.14, density = 760.0, boiling_point = 444.67 },
    { moles = 2.0, molar_mass = 0.18, density = 800.0, boiling_point = 502.058 },
    { moles = 1.0, molar_mass = 0.24, density = 840.0, boiling_point = 573.86 },
    { moles = 0.5, molar_mass = 0.32, density = 880.0, boiling_point = 646.972 },
]
reference = [
    { molar_mass = 0.12, boiling_point = 412.832 },
    { molar_mass = 0.2, boiling_point = 527.8 },
    { molar_mass = 0.3, boiling_point = 630.83 },
]
[cases.expected]
group_moles = [
    2.5, 3.0, 0.5,
]
group_molar_mass = [
    0.124, 0.2, 0.32,
]
group_density = [
    739.551569506727, 815.533980582524, 880.0,
]

[[cases]]
id = "a_source_below_the_first_cut"
tolerance = 1.0e-12
source = "A source entirely below the reference's first cut, so **every row lands in one group and the second is dropped rather than reported empty**: three components in, one component out, against a reference of two. `reference_index` is what says which of the two it is.\n"
[cases.inputs]
source = [
    { moles = 3.0, molar_mass = 0.09, density = 680.0, boiling_point = 360.875 },
    { moles = 1.0, molar_mass = 0.1, density = 700.0, boiling_point = 378.77 },
]
reference = [
    { molar_mass = 0.2, boiling_point = 527.8 },
    { molar_mass = 0.3, boiling_point = 630.83 },
]
[cases.expected]
group_moles = [
    4.0,
]
group_molar_mass = [
    0.0925,
]
group_density = [
    685.291828793774,
]

[[cases]]
id = "one_reference_cut"
tolerance = 1.0e-12
source = "A reference of one cut, which leaves no adjacent pair and therefore no boundary. Every row falls in the single group, and the answer is the whole source re-averaged - mass over moles, mass over volume - rather than the reference's own properties.\n"
[cases.inputs]
source = [
    { moles = 1.0, molar_mass = 0.1, density = 700.0, boiling_point = 378.77 },
    { moles = 1.0, molar_mass = 0.2, density = 820.0, boiling_point = 527.8 },
]
reference = [
    { molar_mass = 0.25, boiling_point = 584.315 },
]
[cases.expected]
group_moles = [
    2.0,
]
group_molar_mass = [
    0.15,
]
group_density = [
    775.675675675676,
]

[[cases]]
id = "the_reference_properties_are_inherited"
tolerance = 1.0e-12
source = "The same five-cut source onto the same three-cut reference as the first case, with `inherit_reference_properties` set. **The walk is identical and two numbers are not**: the group moles are unchanged, and each group's molar mass and density are now the reference row's own - 0.12, 0.2 and 0.3 kg/mol, and 740, 820 and 870 kg/m3 - where the first case averages its own rows.\n"
[cases.inputs]
inherit_reference_properties = true
source = [
    { moles = 1.0, molar_mass = 0.1, density = 700.0, boiling_point = 378.77 },
    { moles = 1.5, molar_mass = 0.14, density = 760.0, boiling_point = 444.67 },
    { moles = 2.0, molar_mass = 0.18, density = 800.0, boiling_point = 502.058 },
    { moles = 1.0, molar_mass = 0.24, density = 840.0, boiling_point = 573.86 },
    { moles = 0.5, molar_mass = 0.32, density = 880.0, boiling_point = 646.972 },
]
reference = [
    { molar_mass = 0.12, boiling_point = 412.832, density = 740.0 },
    { molar_mass = 0.2, boiling_point = 527.8, density = 820.0 },
    { molar_mass = 0.3, boiling_point = 630.83, density = 870.0 },
]
[cases.expected]
reference_index = [
    0.0, 1.0, 2.0,
]
group_moles = [
    2.5, 3.0, 0.5,
]
group_molar_mass = [
    0.12, 0.2, 0.3,
]
group_density = [
    740.0, 820.0, 870.0,
]

[[cases]]
id = "one_group_inherits_the_first_reference_row"
tolerance = 1.0e-12
source = "A source entirely below the reference's first cut, with the flag set: **one group, and it takes the first reference row's properties** rather than the second's or the ones its own two rows average to.\n"
[cases.inputs]
inherit_reference_properties = true
source = [
    { moles = 3.0, molar_mass = 0.09, density = 680.0, boiling_point = 360.875 },
    { moles = 1.0, molar_mass = 0.1, density = 700.0, boiling_point = 378.77 },
]
reference = [
    { molar_mass = 0.2, boiling_point = 527.8, density = 820.0 },
    { molar_mass = 0.3, boiling_point = 630.83, density = 870.0 },
]
[cases.expected]
reference_index = [
    0.0,
]
group_moles = [
    4.0,
]
group_molar_mass = [
    0.2,
]
group_density = [
    820.0,
]

[[cases]]
id = "delumped_source_before_recharacterization"
tolerance = 1.0e-12
source = "The first three-case fluid with `delump_before_recharacterization` set: **each source row becomes four sub-fractions before the walk bins them**, so the groups are not the rows a caller stated. The moles still sum to the source's own."
[cases.inputs]
delump_before_recharacterization = true
delump_resolution = 4
source = [
    { moles = 1.0, molar_mass = 0.1, density = 700.0, boiling_point = 378.77 },
    { moles = 1.5, molar_mass = 0.14, density = 760.0, boiling_point = 444.67 },
    { moles = 2.0, molar_mass = 0.18, density = 800.0, boiling_point = 502.058 },
    { moles = 1.0, molar_mass = 0.24, density = 840.0, boiling_point = 573.86 },
    { moles = 0.5, molar_mass = 0.32, density = 880.0, boiling_point = 646.972 },
]
reference = [
    { molar_mass = 0.12, density = 740.0, boiling_point = 412.832 },
    { molar_mass = 0.2, density = 820.0, boiling_point = 527.8 },
    { molar_mass = 0.3, density = 870.0, boiling_point = 630.83 },
]
[cases.expected]
group_moles = [
    3.42033626530695, 0.719413786691631, 1.86024994800142,
]
group_molar_mass = [
    0.126871819697231, 0.173047477528467, 0.274996902167632,
]
group_density = [
    787.3450907747141, 779.885259851057, 817.288476091106,
]

[[cases]]
