# The unit vocabulary, and the dimensions behind it.
#
# This is the one hand-written source of the canonical units a spec may declare.
# `tools/gen_vocabulary.py` compiles it into Rust, Python and JSON Schema, and
# `--check` fails if any of the three has drifted from it.
#
# A unit is declared here as a *dimension* and a *name in each units library*.
# No magnitude appears anywhere in this file. A conversion factor is a number
# `uom` and `pint` each already know, and writing one down here would be a second
# answer to a question they have answered - the failure that produced this
# repository's millimetre defect, where a restated factor disagreed by 1000x.
#
# Exponents are in the slot order below, which is uom::si::ISQ's. The order is
# not cosmetic: every generated exponent tuple and every uom quantity type is
# built from it, so a different order would permute all of them at once.

schema_version: 1

# Length, mass, time, electric current, thermodynamic temperature, amount of
# substance, luminous intensity. The SI base dimensions, in the order uom's
# ISQ system declares them.
slots: [L, M, T, I, Th, N, J]

dimensions:
  - {id: dimensionless, exponents: [0, 0, 0, 0, 0, 0, 0]}
  - {id: length, exponents: [1, 0, 0, 0, 0, 0, 0]}
  - {id: area, exponents: [2, 0, 0, 0, 0, 0, 0]}
  - {id: volume_rate, exponents: [3, 0, -1, 0, 0, 0, 0]}
  - {id: mass_rate, exponents: [0, 1, -1, 0, 0, 0, 0]}
  - {id: molar_flow, exponents: [0, 0, -1, 0, 0, 1, 0]}
  - {id: mass_density, exponents: [-3, 1, 0, 0, 0, 0, 0]}
  - {id: velocity, exponents: [1, 0, -1, 0, 0, 0, 0]}
  - {id: pressure, exponents: [-1, 1, -2, 0, 0, 0, 0]}
  - {id: dynamic_viscosity, exponents: [-1, 1, -1, 0, 0, 0, 0]}
  - {id: thermodynamic_temperature, exponents: [0, 0, 0, 0, 1, 0, 0]}
  - {id: power, exponents: [2, 1, -3, 0, 0, 0, 0]}
  - {id: specific_heat_capacity, exponents: [2, 0, -2, 0, -1, 0, 0]}
  - {id: thermal_conductivity, exponents: [1, 1, -3, 0, -1, 0, 0]}
  - {id: heat_transfer, exponents: [0, 1, -3, 0, -1, 0, 0]}
  - {id: molar_mass, exponents: [0, 1, 0, 0, 0, -1, 0]}
  - {id: molar_volume, exponents: [3, 0, 0, 0, 0, -1, 0]}
  - {id: molar_energy, exponents: [2, 1, -2, 0, 0, -1, 0]}
  - {id: molar_heat_capacity, exponents: [2, 1, -2, 0, -1, -1, 0]}
  - {id: molar_heat_capacity_coefficient_2, exponents: [2, 1, -2, 0, -2, -1, 0]}
  - {id: molar_heat_capacity_coefficient_3, exponents: [2, 1, -2, 0, -3, -1, 0]}
  - {id: molar_heat_capacity_coefficient_4, exponents: [2, 1, -2, 0, -4, -1, 0]}
  - {id: molar_heat_capacity_coefficient_5, exponents: [2, 1, -2, 0, -5, -1, 0]}

# The canonical unit strings, exactly as a spec spells them in `unit:`.
#
# `pint` is the unit's name in pint's registry, and pint supplies the conversion
# factor, which is why none is written down here.
#
# `uom` is the conversion path in uom, `<dimension module>::<unit>`, or null
# where uom has no such quantity. The quantity type is deliberately **not**
# declared: the generator derives it from the exponents through its own map, so
# the generated Rust asserts `let _: <derived type> = <ctor>(1.0)` and a wrong
# exponent fails to compile rather than being waved through by a matching name.
#
# A null is a structural fact rather than an oversight. uom's `quantity!` macro
# has to run inside `uom::si`, and the `Units` trait that makes `.new::<u>()`
# compile is assembled by `system!` from a closed list, so no crate outside uom
# can add a quantity to `uom::si`. A null here is the list of dimensions azoth
# names itself, stated rather than implied; the generated conversion for one is
# the identity, because mol/s and J/(mol*K**n) are already their own SI base unit.
#
# `rust_ctor` names a hand-written constructor in `crates/azoth-core/src/units.rs`
# that the generated conversion calls. The generator never invents one: a unit
# with a `uom` path and no `rust_ctor` is a generation error, not a default.
units:
  - {id: dimensionless, dimension: dimensionless, pint: dimensionless, uom: null}
  - {id: m, dimension: length, pint: meter, uom: length::meter,
     rust_ctor: meters}
  - {id: mm, dimension: length, pint: millimeter, uom: length::millimeter,
     rust_ctor: millimeters}
  - {id: m**2, dimension: area, pint: "meter**2", uom: area::square_meter,
     rust_ctor: square_meters}
  - {id: m**3/s, dimension: volume_rate, pint: "meter**3/second",
     uom: volume_rate::cubic_meter_per_second, rust_ctor: cubic_meters_per_second}
  - {id: kg/s, dimension: mass_rate, pint: "kilogram/second",
     uom: mass_rate::kilogram_per_second, rust_ctor: kilograms_per_second}
  - {id: mol/s, dimension: molar_flow, pint: "mole/second", uom: null}
  - {id: kg/m**3, dimension: mass_density, pint: "kilogram/meter**3",
     uom: mass_density::kilogram_per_cubic_meter,
     rust_ctor: kilograms_per_cubic_meter}
  - {id: m/s, dimension: velocity, pint: "meter/second",
     uom: velocity::meter_per_second, rust_ctor: meters_per_second}
  - {id: Pa, dimension: pressure, pint: pascal, uom: pressure::pascal,
     rust_ctor: pascals}
  - {id: Pa*s, dimension: dynamic_viscosity, pint: "pascal*second",
     uom: dynamic_viscosity::pascal_second, rust_ctor: pascal_seconds}
  - {id: K, dimension: thermodynamic_temperature, pint: kelvin,
     uom: thermodynamic_temperature::kelvin, rust_ctor: kelvins}
  - {id: W, dimension: power, pint: watt, uom: power::watt, rust_ctor: watts}
  - {id: J/(kg*K), dimension: specific_heat_capacity,
     pint: "joule/(kilogram*kelvin)",
     uom: specific_heat_capacity::joule_per_kilogram_kelvin,
     rust_ctor: joules_per_kilogram_kelvin}
  - {id: W/(m*K), dimension: thermal_conductivity,
     pint: "watt/(meter*kelvin)",
     uom: thermal_conductivity::watt_per_meter_kelvin,
     rust_ctor: watts_per_meter_kelvin}
  - {id: W/(m**2*K), dimension: heat_transfer,
     pint: "watt/(meter**2*kelvin)",
     uom: heat_transfer::watt_per_square_meter_kelvin,
     rust_ctor: watts_per_square_meter_kelvin}
  - {id: kg/mol, dimension: molar_mass, pint: "kilogram/mole",
     uom: molar_mass::kilogram_per_mole, rust_ctor: kilograms_per_mole}
  - {id: m**3/mol, dimension: molar_volume, pint: "meter**3/mole",
     uom: molar_volume::cubic_meter_per_mole, rust_ctor: cubic_meters_per_mole}
  - {id: J/mol, dimension: molar_energy, pint: "joule/mole",
     uom: molar_energy::joule_per_mole, rust_ctor: joules_per_mole}
  - {id: J/(mol*K), dimension: molar_heat_capacity,
     pint: "joule/(mole*kelvin)",
     uom: molar_heat_capacity::joule_per_kelvin_mole,
     rust_ctor: joules_per_mole_kelvin}
  - {id: J/(mol*K**2), dimension: molar_heat_capacity_coefficient_2,
     pint: "joule/(mole*kelvin**2)", uom: null}
  - {id: J/(mol*K**3), dimension: molar_heat_capacity_coefficient_3,
     pint: "joule/(mole*kelvin**3)", uom: null}
  - {id: J/(mol*K**4), dimension: molar_heat_capacity_coefficient_4,
     pint: "joule/(mole*kelvin**4)", uom: null}
  - {id: J/(mol*K**5), dimension: molar_heat_capacity_coefficient_5,
     pint: "joule/(mole*kelvin**5)", uom: null}
