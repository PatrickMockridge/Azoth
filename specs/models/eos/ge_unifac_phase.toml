id = "eos.ge_unifac_phase"
name = "Fugacity coefficients of a UNIFAC activity-coefficient liquid"
kind = "direct"
assumptions = [
    "this is NeqSim's `PhaseGEUnifac` liquid: `phi_i = gamma_i P0_i / P` on the solvent arm. There is no cubic in it - an activity-coefficient phase's non-ideality is `gamma`, and its standard state is the pure liquid at the state's temperature.",
    "**both reference states are here.** `ComponentGE.fugcoef` gives a `solvent` component `gamma_i P0_i/P` and every other `(gamma_i/gamma_i^inf) H_i/P`; `gamma_i^inf` is this phase's UNIFAC on the solute-water pair `[1e-11, 1 - 1e-11]`, or on the diluted composition when the phase carries no water.",
    "`H_i` prefers the IAPWS G7-04 table for its 14 gases in a water-bearing phase, inside the row's fitted window, and fails closed to `1e12 bar` outside it; otherwise it is the databank's `HenryCoef1..4` correlation capped to `1e12 bar`, with the cap asked before any fittedness check.",
    "**three states are refused rather than given a number**: a non-ion Henry row with the four zeros the table uses for no correlation (NeqSim evaluates 1.802 bar), a solvent-tagged IAPWS species in water (NeqSim builds a one-component reference phase and throws), and a solvent with no Antoine row.",
    "an ion is `1e12 bar` whatever its row says. This phase takes no mixture, so it reaches the cap; `eos.ge_flash` builds a cubic with `mixture_of`, which refuses an ion, so the flash does not.",
    "`gamma_i` comes from `eos.unifac_activity_coefficients` on the same group tables, and `P0_i` from `eos.antoine_vapor_pressure` on the component's own coefficients and form. Neither is recomputed here, so the phase cannot disagree with them.",
    "the combinatorial and residual terms are classic UNIFAC's, with `qUNIQUAQ` and `rUNIQUAQ` read from the group sums and not from `UNIFACcomp.csv`'s own columns, which are zero for 109 of the 112 rows. The activity model's spec carries that measurement.",
    "an Antoine label that names no form falls through to Wagner, which is NeqSim's own dispatch and the same fall-through `eos.antoine_vapor_pressure` documents. It is reproduced rather than refused.",
    "`P0_i`, `H_i` and `gamma_i^inf` are reported beside `ln_phi` so a reader can check the correlation and the arithmetic separately; either a wrong reference quantity and a wrong `gamma` produce the same kind of wrong answer.",
    "this is a *liquid* phase. A vapour over it is a cubic, and combining the two is a gamma-phi flash, which is a separate model.",
    "`x` is checked (non-negative, sums to one) rather than renormalised.",
]
references = [
    "Fredenslund, A.; Jones, R. L.; Prausnitz, J. M. (1975). \"Group-contribution estimation of activity coefficients in nonideal liquid mixtures.\" AIChE Journal 21(6), 1086-1099.",
    "Hansen, H. K.; Rasmussen, P.; Fredenslund, A.; Schiller, M.; Gmehling, J. (1991). \"Vapor-liquid equilibria by UNIFAC group contribution. 5. Revision and extension.\" Industrial & Engineering Chemistry Research 30(10), 2352-2355.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `PhaseGEUnifac` and `ComponentGE.fugcoef` are the port source.",
]
[source]
standard = "NeqSim master `PhaseGEUnifac`"
edition = "`ComponentGE.fugcoef`, ported verbatim; the activity coefficient is `eos.unifac_activity_coefficients`'s, ported from `ComponentGEUnifac`."
doi = "10.1021/ie00058a017"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against NeqSim's `UNIFACcomp.csv` for each one's subgroup decomposition, `UNIFACInterParam.csv` for the group interactions, and `COMP.csv` for each component's Antoine vapour-pressure correlation"
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the liquid's mole fractions; non-negative and summing to one."
[outputs]
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the UNIFAC activity coefficient of each component"
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each activity coefficient"
[outputs.ln_phi]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each component's fugacity coefficient: `ln(gamma_i P0_i / P)` on the solvent arm and `ln(gamma_i / gamma_i^inf) + ln(H_i / P)` on the Henry arm"
[outputs.p_sat]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the pure-component saturation pressure of each component at `T`, and **zero where the arm reads a Henry coefficient instead**"
[outputs.henry]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the Henry coefficient each component's arm read, in pascals, and **zero where the arm reads none** - which is the solvent arm, whose reference is its own Antoine row"
[outputs.gamma_inf]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the infinite-dilution activity coefficient each component's Henry arm divided by, and **one where the arm does not divide by one**"
[implementations]
python = "azoth.eos.ge_unifac_phase"
rust = "azoth_eos::ge_unifac_phase"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
