id: eos.molar_enthalpy_entropy
name: Molar enthalpy and entropy of a mixture

source:
  standard: The composition of ideal-gas and residual contributions
  edition: >
    Standard thermodynamics: an absolute enthalpy or entropy is a reference value plus
    an ideal-gas integral plus a departure, and the split between them is a convention
    rather than a result. No source states this particular assembly, because the
    assembly is not a discovery - what matters is that the terms are written down and
    the datum is the caller's, which is what this spec does.

kind: direct

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: "N x N, symmetric, zero diagonal"
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      the constant term of each component's `Cp` polynomial, in J/(mol*K). Together
      with the four below, this is everything the ideal-gas enthalpy and entropy are
      integrated from - there is no separate datum, because NeqSim's is a fixed
      reference temperature rather than a value a caller supplies.
  cp_b:
    type: vector
    unit: J/(mol*K**2)
    length: one per component
    description: the coefficient of `T`, in J/(mol*K**2)
  cp_c:
    type: vector
    unit: J/(mol*K**3)
    length: one per component
    description: the coefficient of `T**2`, in J/(mol*K**3)
  cp_d:
    type: vector
    unit: J/(mol*K**4)
    length: one per component
    description: the coefficient of `T**3`, in J/(mol*K**4)
  cp_e:
    type: vector
    unit: J/(mol*K**5)
    length: one per component
    description: the coefficient of `T**4`, in J/(mol*K**5)
  T:
    unit: K
    description: absolute temperature of the state
  P:
    unit: Pa
    description: absolute pressure of the state
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the mixture's mole fractions, checked rather than renormalised
  compressibility:
    unit: dimensionless
    description: >
      the cubic's root for the phase wanted. Not solved for here: which root describes
      the phase is a choice, and a caller holding a `z` has already made it.
outputs:
  h:
    unit: J/mol
    description: the molar enthalpy, `h_ideal + h_departure`
  s:
    unit: J/(mol*K)
    description: the molar entropy, `s_ideal + s_departure`
  h_ideal:
    unit: J/mol
    description: >
      the ideal-gas part: the reference enthalpies plus the heat-capacity integrals.
      Reported separately because it is the term that carries the datum, so a caller can
      see which part of the answer came from where.
  s_ideal:
    unit: J/(mol*K)
    description: >
      the ideal-gas part of the entropy - the reference values, the heat-capacity
      integrals, `-R ln(P/P_ref)` for the pressure and `-R sum_i z_i ln z_i` for the
      mixing. The last two do not vanish when the heat-capacity coefficients do.
  h_departure:
    unit: J/mol
    description: the residual enthalpy, `R*T*h_dep_rt`
  s_departure:
    unit: J/(mol*K)
    description: >
      the residual entropy, `R*s_dep_r`. **Does not include the entropy of mixing**,
      which is an ideal-gas term; see the notes.
  psi_bar:
    unit: dimensionless
    description: >
      the composition-weighted average of the components' `psi` that the mixture
      departure functions are built on. Reported because it is what makes the mixture
      departure differ from a pure component's, and because at `N = 1` it must equal
      that component's own `psi` exactly - a test asserts it.
  cp:
    unit: J/(mol*K)
    description: >
      the molar heat capacity at constant pressure, `cp_ideal + cp_departure`.
  cp_ideal:
    unit: J/(mol*K)
    description: >
      the ideal-gas part of the heat capacity - the same polynomial whose integral
      gives the ideal enthalpy, evaluated at the state's temperature rather than
      integrated.
  cp_departure:
    unit: J/(mol*K)
    description: >
      the residual heat capacity, `R*cp_dep_r`. It is the departure form of the
      derivative the isentropic and isenthalpic flashes step on: theirs is `dS/dT =
      cp/T` in the entropy's case, and `dH/d(1/T) = -T**2*cp` in the enthalpy's.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states

  - quantity: P
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states

  - quantity: compressibility
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      `Z = P v /(R T)` is positive for any state with a positive volume. The stricter
      check that actually matters - that the root exceeds the mixture's `B`, without
      which `ln(Z - B)` is the logarithm of a negative number - needs the composition
      and belongs to the implementation rather than to this table.

assumptions:
  - "**`h_ref` and `s_ref` are the caller's datum, and their correctness and consistency are NOT CHECKED.** Two enthalpies computed from different datums are not comparable, and subtracting them gives a plausible number rather than an error. This is the single most likely way to get a wrong answer out of this model."
  - "**`Tc`, `Pc`, `omega`, `kij` and the four heat-capacity coefficients are the caller's, and their correctness is NOT CHECKED.** A databank of critical constants ships with the library; the heat-capacity coefficients are not in it."
  - "the heat-capacity polynomial is valid over the range it was fitted to, and `T`, `T_ref` and the integration path between them all lie in it. The coefficients describe the ideal-gas heat capacity at every temperature on that path, which is an assumption the caller makes and this model cannot."
  - "the departure functions are relative to the ideal-gas *mixture* at the same temperature, pressure and composition, not to the pure ideal gases. The entropy of mixing is therefore in `s_ideal` and not in `s_departure`."
  - "**which root `compressibility` names is the caller's choice and is not checked against the phase it describes.** Passing a liquid root for a vapour state gives a number that is internally consistent and describes a state that does not exist."
  - "no energy balance and no reaction. This is a property of one state, and what a caller does with two of them - a difference, a heat of mixing, a reaction enthalpy - is a composition this model does not make and cannot check."

references:
  - 'Poling, B. E.; Prausnitz, J. M.; O''Connell, J. P. "The Properties of Gases and Liquids", 5th ed. (the split of an absolute enthalpy into a reference value, an ideal-gas integral and a departure; the edition is described rather than page-cited, and is unconfirmed)'
  - 'Peng, D. Y.; Robinson, D. B. (1976). "A New Two-Constant Equation of State." Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011. (the equation of state the departure functions come from; the citation is confirmed and the equation numbers are not)'

implementations:
  python: azoth.eos.molar_enthalpy_entropy
  rust: azoth_eos::molar_enthalpy_entropy
