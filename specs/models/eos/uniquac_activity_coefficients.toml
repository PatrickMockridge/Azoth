id = "eos.uniquac_activity_coefficients"
name = "Activity coefficients from the UNIQUAC model"
kind = "direct"
assumptions = [
    "`r` and `q` are resolved from the named components, as the group sums `r_i = sum_k nu_ik R_k` and `q_i = sum_k nu_ik Q_k` over the same UNIFAC decomposition `eos.unifac_activity_coefficients` uses.\n",
    "`aij` stays the caller's: no upstream table carries a UNIQUAC interaction matrix. NeqSim's `ComponentGEUniquac` reads the generic `intparam`, which for a GE phase is the SRK `kij` matrix and not a UNIQUAC parameter, so there is nothing to resolve it from.\n",
    "`tau_ij = exp(-aij[i][j] / T)` carries no gas constant, so `aij` is in Kelvin, and it is directional (`a_ij != a_ji`) with a zero diagonal.\n",
    "the combinatorial term uses `Z = 10`, so `l_i = 5 (r_i - q_i) - (r_i - 1)`.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
    "the group sums are also what NeqSim's `ComponentGEUnifac.getR`/`getQ` compute. NeqSim's own `rUNIQUAQ`/`qUNIQUAQ` columns are *not* the source: they are 0.0 for 109 of the 112 components `UNIFACcomp.csv` carries, so `ComponentGEUniquac` divides by zero for almost every mixture.\n",
]
references = [
    "Abrams, D. S.; Prausnitz, J. M. (1975). \"Statistical thermodynamics of liquid mixtures: A new expression for the excess Gibbs energy of partly or completely miscible systems.\" AIChE Journal 21(1), 116-128.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ComponentGEUniquac`, the port source; NeqSim 3.20.0's UNIQUAC is non-functional, so there is no differential oracle.\n",
]
[source]
standard = "Abrams, D. S.; Prausnitz, J. M. (1975)"
edition = "AIChE Journal 21(1), 116-128"
doi = "10.1002/aic.690210115"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against NeqSim's `UNIFACcomp.csv` group decomposition and the `UNIFACGroupParam` group constants\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[inputs.aij]
type = "matrix"
unit = "K"
shape = "N x N, asymmetric, zero diagonal"
description = "the interaction energy matrix: `tau_ij = exp(-aij[i][j] / T)`\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.uniquac_activity_coefficients"
rust = "azoth_eos::uniquac_activity_coefficients"
