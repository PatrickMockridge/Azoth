id = "eos.tp_multiflash_wax"
name = "Wax multiphase flash at fixed temperature and pressure"
kind = "procedure"
assumptions = [
    "**the wax phase's fugacity coefficient is `eos.wax_solid_fugacity`'s**, and it depends on the state and the component and *not* on the phase's composition - the mole fraction cancels out of `SolidFug/(P x)` - so where a cubic phase's are rebuilt every trial, the solid's are one vector.",
    "**a substance that is not a wax former is excluded by a number**: NeqSim's `ComponentWax.fugcoef` returns `1e50` for one, and `x_i = z_i/(E_i phi_i)` is then zero to any precision the answer is read at. That is why the phase can be in the set at all rather than the set being assembled per state.",
    "**the run is `eos.tp_multiflash`'s, with one more phase in the set.** The two-phase flash seeds it, the fraction Newton solves it, and the same merge drops what does not survive - so this model adds a phase and reuses the solve rather than restating it.",
    "**the wax phase is kept only when the solve converges with it above the phase floor.** Where no wax forms the three-phase set does not converge - measured, `1.6e1` at 290 K and `8.7e-1` at 275 K - and the answer is the two-phase flash's, which is the same state, to `1e-15` at both.",
    "**`nc15` and `nc17`-`nc24` carry a placeholder melt** - `6000` J/mol at `273.0` K - where `n-hexane` carries its measured `13080` J/mol at `177.83` K. A fluid of the higher alkanes should precipitate far above 265 K and this one does not, and that is the table rather than the model.",
    "the phases are reported in the solve's own order with the wax **last** when it is there, and no other order is promised. `wax_fraction` is the answer the phase's index would otherwise have to be read for.",
    "an inhibitor, a pour-point depressant and an energy balance are not modelled, as for the rest of this family.",
    "`z` is checked (non-negative, sums to one) rather than renormalised, and `eos` is the cubic the wax reference liquid is built from as well as the fluid's own.",
]
references = [
    "Won, K. W. (1986). \"Thermodynamics for solid solution-liquid-vapor equilibria: wax phase formation from heavy hydrocarbon mixtures.\" Fluid Phase Equilibria 30, 265-279. DOI 10.1016/0378-3812(86)80061-9.",
    "Pedersen, K. S.; Skovborg, P.; Rønningsen, H. P. (1991). \"Wax precipitation from North Sea crude oils. 4. Thermodynamic modeling.\" Energy & Fuels 5(6), 924-932. DOI 10.1021/ef00030a020.",
    "Michelsen, M. L. (1982). \"The isothermal flash problem. Part II. Phase-split calculation.\" Fluid Phase Equilibria 9(1), 21-40. The `E`/`Q` fraction formulation the solve uses.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `TPmultiflashWAX` and `ComponentWax.fugcoef2` are the port source.",
]
[source]
standard = "NeqSim master `TPmultiflashWAX`"
edition = "The `Pedersen` component model (`ComponentWax`), which is `PhaseWax`'s default. The Won, Wilson and Coutinho models are that class's other three and are carried."
[algorithm]
scheme = "multiphase_fraction_newton"
initialisation = "two_phase_flash_plus_wax"
convergence = "absolute"
tolerance = 1e-12
max_iterations = 50
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name. At least one must be a wax former, which the databank states with its `waxformer` column - the 16 n-alkanes from n-hexane to nc24."
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "overall mole fractions. Checked rather than renormalised."
[inputs.eos]
type = "enum"
values = ["pr", "srk"]
optional = true
description = "the cubic the fluid runs, which is also the one each wax former's reference liquid is built from"
[outputs]
[outputs.wax_fraction]
unit = "dimensionless"
description = "the fraction of the feed's moles in the wax phase, and zero where none forms"
[outputs.phase_count]
unit = "dimensionless"
description = "how many phases the feed splits into: two, or three where the wax survives"
[outputs.beta]
type = "vector"
unit = "dimensionless"
length = "one per phase"
description = "the mole fraction of the feed in each phase, summing to one. The wax phase is last when it is there."
[outputs.x]
type = "matrix"
unit = "dimensionless"
shape = "one row per phase, one column per component"
description = "the composition of each phase, each row summing to one"
[outputs.iterations]
unit = "dimensionless"
description = "fraction-solve steps taken"
[outputs.residual]
unit = "dimensionless"
description = "the norm of the last fraction correction"
[outputs.converged]
unit = "dimensionless"
description = "whether the residual met the tolerance. **False means the two-phase answer was returned**, so this is the flag that says which of the two was solved."
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[implementations]
python = "azoth.eos.tp_multiflash_wax"
rust = "azoth_eos::tp_multiflash_wax"
