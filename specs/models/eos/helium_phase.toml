id = "eos.helium_phase"
name = "Helium reference phase state"
kind = "procedure"
assumptions = [
    "the fluid is pure helium; the equation of state is the Vega multiparameter Helmholtz formulation of NeqSim's `thermo.util.Vega.Vega` (the NIST helium EOS, IR 8474), with a monatomic ideal-gas part and polynomial, exponential and Gaussian residual terms.",
    "the density solve is Newton's method from the ideal-gas guess, so it finds the gas-like root; the dense (liquid) root is not selected.",
    "every property follows from the Helmholtz derivatives, so the property set is a rearrangement of one derivative evaluation.",
    "the gas constant is the equation's own `R = 8.314472` J/(mol.K), the value the NIST EOS publishes rather than the full CODATA constant.",
    "the heat capacities are the closed-form derivatives. NeqSim's `AlpharVega` drops the `(de/dtau)^2` term in its Gaussian tau-derivative and flips the sign of `d^2 e/ddelta^2` in its exponential delta-derivative, so its `Cv` and `Cp` are slightly off; this model does not reproduce them.",
]
references = [
    "Arp, V. D.; McCarty, R. D.; Friend, D. G. (1998). \"Thermophysical Properties of Helium-4 from 0.8 to 1500 K with Pressures to 2000 MPa.\" NIST Technical Note 1334 (revised).",
    "NIST IR 8474 (2023), the helium fundamental equation of state.",
    "NeqSim 3.20.0, `thermo/util/Vega/Vega.java`, Apache-2.0, commit dedba8735d030c6411e09b6fd7e69f6c4a136114.",
]
[source]
standard = "Vega (NIST IR 8474) helium equation of state"
edition = "The multiparameter Helmholtz equation for helium, evaluated in the reduced variables tau = Tc/T and delta = rho/rho_c and differentiated for the full property set."
[algorithm]
scheme = "newton_density_solve"
initialisation = "ideal_gas"
convergence = "absolute"
tolerance = 1e-12
max_iterations = 100
[inputs]
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[outputs]
[outputs.z_factor]
unit = "dimensionless"
description = "the compressibility factor `Z = P/(rho R T) = 1 + delta d(alpha^r)/d(delta)`"
[outputs.u]
unit = "J/mol"
description = "the internal energy"
[outputs.h]
unit = "J/mol"
description = "the enthalpy"
[outputs.s]
unit = "J/(mol*K)"
description = "the entropy"
[outputs.cv]
unit = "J/(mol*K)"
description = "the isochoric heat capacity"
[outputs.cp]
unit = "J/(mol*K)"
description = "the isobaric heat capacity"
[outputs.g]
unit = "J/mol"
description = "the Gibbs energy, `h - T s`"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[implementations]
python = "azoth.eos.helium_phase"
rust = "azoth_eos::helium_phase"
