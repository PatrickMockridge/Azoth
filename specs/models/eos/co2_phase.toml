id = "eos.co2_phase"
name = "CO2 reference phase state"
kind = "procedure"
assumptions = [
    "the fluid is pure carbon dioxide; the equation of state is the Span-Wagner multiparameter Helmholtz formulation of NeqSim's `thermo.util.spanwagner.NeqSimSpanWagner`, with a Planck-Einstein ideal-gas part and power-exponential and Gaussian residual terms.",
    "the density solve is Newton's method from the ideal-gas guess, so it finds the gas-like root; the dense (liquid) root is not selected.",
    "every property follows from the Helmholtz derivatives, so the property set is a rearrangement of one derivative evaluation.",
    "the gas constant is the equation's own `R = 8.31451` J/(mol.K), the value Span and Wagner publish rather than the full CODATA constant.",
]
references = [
    "Span, R.; Wagner, W. (1996). \"A New Equation of State for Carbon Dioxide Covering the Fluid Region from the Triple-Point Temperature to 1100 K at Pressures up to 800 MPa.\" Journal of Physical and Chemical Reference Data 25(6), 1509-1596.",
    "NeqSim 3.20.0, `thermo/util/spanwagner/NeqSimSpanWagner.java`, Apache-2.0, commit 805cf0f910819a19fdc45702fc44c4a3675d93d8.",
]
[source]
standard = "Span, R.; Wagner, W. (1996)"
edition = "The multiparameter Helmholtz equation for carbon dioxide, evaluated in the reduced variables tau = Tc/T and delta = rho/rho_c and differentiated for the full property set."
[algorithm]
scheme = "newton_density_solve"
initialisation = "ideal_gas"
convergence = "absolute"
tolerance = 1e-12
max_iterations = 100
[inputs]
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[outputs]
[outputs.z_factor]
unit = "dimensionless"
description = "the compressibility factor `Z = P/(rho R T) = 1 + delta d(alpha^r)/d(delta)`"
[outputs.u]
unit = "J/mol"
description = "the internal energy"
[outputs.h]
unit = "J/mol"
description = "the enthalpy"
[outputs.s]
unit = "J/(mol*K)"
description = "the entropy"
[outputs.cv]
unit = "J/(mol*K)"
description = "the isochoric heat capacity"
[outputs.cp]
unit = "J/(mol*K)"
description = "the isobaric heat capacity"
[outputs.g]
unit = "J/mol"
description = "the Gibbs energy, `h - T s`"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[implementations]
python = "azoth.eos.co2_phase"
rust = "azoth_eos::co2_phase"
