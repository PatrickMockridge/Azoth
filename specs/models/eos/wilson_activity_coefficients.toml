id = "eos.wilson_activity_coefficients"
name = "Activity coefficients from the paraffin-wax Wilson model"
kind = "direct"
assumptions = [
    "the molar mass and critical temperature come from the named components' databank rows, with the keycard's overrides applied; a card-added component without a molar mass is refused rather than defaulted to zero.\n",
    "this is NeqSim's paraffin-wax (Coutinho) Wilson, not the classical fitted-`Aij` Wilson: the interaction energy is a correlation over carbon number and the sublimation enthalpy, so it needs no interaction-parameter table.\n",
    "`Lambda_ij = 1` when `i == j` or `M_i > M_j` - the branch in NeqSim's `getCharEnergyParamter` where the heavier first component collapses the exponent to zero - and `exp(-(lambda_j - lambda_i) / (R T))` otherwise.\n",
    "`T` must be below each component's `Tc`: the vaporization-enthalpy correlation is a power of `1 - T/Tc`, and a supercritical component yields NaN exactly as NeqSim does, which is not refused here.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Coutinho, J. A. P.; Andersen, S. I.; Stenby, E. H. (1995). \"Evaluation of activity coefficient models in prediction of alkane solid-liquid equilibria.\" Fluid Phase Equilibria 103, 23-39.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ComponentGEWilson.getWilsonActivityCoefficient`, the port source; NeqSim master's `getActivityCoefficient` returns 0, so the oracle is the direct method.\n",
]
[source]
standard = "Coutinho et al. (1995)"
edition = "Fluid Phase Equilibria 103, 23-39"
doi = "10.1016/0378-3812(94)02603-Y"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank with the keycard's overrides applied; the correlation reads their molar mass and critical temperature\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.wilson_activity_coefficients"
rust = "azoth_eos::wilson_activity_coefficients"
