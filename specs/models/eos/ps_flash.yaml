id: eos.ps_flash
name: Pressure-entropy flash
kind: procedure

source:
  standard: Standard thermodynamics, as in Smith, Van Ness & Abbott; Michelsen & Mollerup
  edition: >
    The procedure is the ordinary one: the entropy of a mixture at fixed pressure is a
    strictly increasing function of temperature, so inverting it is well posed, and the
    entropy of a two-phase state is the phase-fraction weighted sum of the two phase
    entropies, each evaluated at its own composition. **The specific text has not been read** and no equation number is
    claimed. What is checked is against this project's own pieces, and the spec's notes
    say what that does and does not establish.

references:
  - 'Michelsen, M. L.; Mollerup, J. M. (2004). "Thermodynamic Models: Fundamentals and
    Computational Aspects." Tie-Line Publications. (named as where the treatment of
    isenthalpic flashes lives; not read, and no equation number is claimed - see `notes`)'
  - 'Smith, J. M.; Van Ness, H. C.; Abbott, M. M. "Introduction to Chemical Engineering
    Thermodynamics." (the standard statement that both the enthalpy and the entropy of
    a mixture increase with temperature at fixed pressure; not read here)'

algorithm:
  scheme: ps_flash_temperature_newton
  convergence: absolute
  tolerance: 1.0e-5
  max_iterations: 200
  initial_temperature: 300.0
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      acentric factors, in the same order. All three vectors are the caller's - this
      library ships a databank of them (`azoth.eos.component`) - and they must be
      mutually consistent, which is not checked.
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the constant term of each component's `Cp/R` polynomial, as in
      `eos.molar_enthalpy_entropy`. Together with the three below and the reference
      values, this is the datum the requested entropy is measured from.
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. This is the datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      each component's ideal-gas molar entropy at `T_ref` and `P_ref`. **Not used by
      this model** - an isentropic flash does not need it - and required only because
      it belongs to the same ideal-gas model the entropy is computed from, and a
      coefficient set without a reference state is not a thermodynamic model.
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: >
      the pressure `s_ref` is given at. It does not enter this model's answer, for the
      same reason `s_ref` does not.
  P:
    unit: Pa
    description: absolute pressure. Held fixed; the temperature is what is solved for.
  S:
    unit: J/(mol*K)
    description: >
      the molar entropy the mixture is to reach, as a difference from the datum above.
      A magnitude, and it may be negative - a reference state that puts zero anywhere is
      a convention, not a physical floor.
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions. Checked rather than renormalised.

outputs:
  T:
    unit: K
    description: the temperature that satisfies the entropy. This is the answer.
  beta:
    unit: dimensionless
    description: >
      the vapour fraction at that temperature. Absent for a single-phase feed, where
      the flash reports an extrapolated split rather than a physical one - see the
      notes.
  x:
    type: vector
    unit: dimensionless
    length: one per component
    description: liquid-phase mole fractions at the answer
  y:
    type: vector
    unit: dimensionless
    length: one per component
    description: vapour-phase mole fractions at the answer
  k:
    type: vector
    unit: dimensionless
    length: one per component
    description: '`K_i = y_i / x_i` at the answer, reported because the flash is one'
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour]
    description: which phase the feed is in at the answer
  z_liquid:
    unit: dimensionless
    description: the liquid root of the cubic at the answer
  z_vapour:
    unit: dimensionless
    description: the vapour root
  iterations:
    unit: dimensionless
    description: Newton iterations taken
  residual:
    unit: J/(mol*K)
    description: '`|S(T) - S_target|` at the answer, in the property''s own unit'

valid_range:
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute pressure; zero and below are not states, and the cubic's reduced
      variables divide by it.

assumptions:
  - '**the iteration is quasi-Newton from `initial_temperature`, not a scan.** The step is `factor * residual / (dS/dT)` with `dS/dT = cp/T`, `factor` halving whenever the residual grows and returning to one when it falls, and every step clamped to ten kelvin. A trial temperature where the inner flash cannot settle is not fatal: the step is undone, `factor` is halved and the iteration continues from the last good temperature.'
  - '**the tolerance is `max(1e-5, |S_target| * 1e-10)`, in J/(mol*K).** The floor is upstream''s, stated per mole because this model carries no flow where upstream would have a total. A solve that stops improving at a residual below `1e-4` for five consecutive iterations is accepted rather than driven to the cap, which is upstream''s stagnation rule and the reason a state at the edge of the cubic''s validity returns an answer instead of an error.'
  - '**the starting temperature is declared, where upstream reads one off its system.** Upstream iterates from the temperature its thermodynamic system already holds - for a compressor, the inlet temperature. A model here has no system, so the spec states the start, and both implementations take the same path from it.'
  - '**the flash at each trial temperature is converged, not exact.** The inner iteration carries its own tolerance, so the entropy this model inverts is the entropy of a converged approximation. Tighter than the outer tolerance.'
  - '**no check that the feed is stable.** This model asks where the energy balance is
    satisfied, not whether the state it finds is the equilibrium one - the same
    division `eos.bubble_pressure` makes about its own input.'
  - '**the entropy is a difference from a supplied datum.** It is not an absolute
    quantity and is not comparable with a value computed from a different reference
    state.'

implementations:
  python: azoth.eos.ps_flash
  rust: azoth_eos::ps_flash

cases:
  - id: two_phase_round_trip
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      P: 2000000.0
      S: -39.078496670600245
      z: [0.6, 0.4]
    expected:
      T: 300.0
      beta: 0.6824390269029676
    tolerance: 1.0e-7

  - id: single_phase_vapour_round_trip
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      P: 2000000.0
      S: -7.568398845188517
      z: [0.6, 0.4]
    expected:
      T: 450.0
    tolerance: 1.0e-7
