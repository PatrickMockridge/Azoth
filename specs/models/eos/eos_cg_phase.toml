id = "eos.eos_cg_phase"
name = "EOS-CG phase state"
kind = "procedure"
assumptions = [
    "the equation of state is the EOS-CG multi-fluid Helmholtz model of Gernert et al., as NeqSim's `thermo.util.gerg.EOSCGModel` carries it: composition-averaged reducing parameters, an ideal and a residual Helmholtz part, and a pairwise departure contribution.",
    "the density solve is the logarithmic-volume Newton iteration of the reference implementation, from the ideal-gas guess; the returned root is the gas-like one at the given pressure.",
    "the component names are the EOS-CG set (`methane`, `nitrogen`, `CO2`, `ethane`, ... `MDEA`), mapped to the model's fixed component order rather than resolved against the general databank.",
    "the coefficients are vendored verbatim from NeqSim's `EOSCGModel.setup()`, not transcribed by hand.",
]
references = [
    "Gernert, J.; Span, R. (2016). \"EOS-CG: A Helmholtz energy mixture model for humid gases and CCS mixtures.\" Journal of Chemical Thermodynamics 93, 274-293.",
    "NeqSim 3.20.0, `thermo/util/gerg/EOSCGModel.java`, Apache-2.0, commit 805cf0f910819a19fdc45702fc44c4a3675d93d8.",
]
[source]
standard = "Gernert, J.; Span, R. (2016)"
edition = "The 28-component EOS-CG Helmholtz mixture, evaluated in the reduced variables tau = Tr/T and delta = D/Dr with the reducing parameters composition-averaged over binary interaction parameters and a pairwise departure contribution."
[algorithm]
scheme = "log_volume_newton"
initialisation = "ideal_gas"
convergence = "absolute"
tolerance = 1e-7
max_iterations = 50
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the EOS-CG component names, mapped to the model's fixed 28-component order"
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the mixture's mole fractions, one per component, summing to one"
[outputs]
[outputs.z_factor]
unit = "dimensionless"
description = "the compressibility factor `Z = P v/(R T)`"
[outputs.u]
unit = "J/mol"
description = "the internal energy"
[outputs.h]
unit = "J/mol"
description = "the enthalpy"
[outputs.s]
unit = "J/(mol*K)"
description = "the entropy"
[outputs.cv]
unit = "J/(mol*K)"
description = "the isochoric heat capacity"
[outputs.cp]
unit = "J/(mol*K)"
description = "the isobaric heat capacity"
[outputs.g]
unit = "J/mol"
description = "the Gibbs energy, `h - T s`"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[implementations]
python = "azoth.eos.eos_cg_phase"
rust = "azoth_eos::eos_cg_phase"
