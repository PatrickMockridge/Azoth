id = "eos.mason_saxena_conductivity"
name = "Gas mixture conductivity by Mason-Saxena mixing over Chung pure-component conductivities"
kind = "direct"
assumptions = [
    "the per-component constants are those of the gas components intended, and the caller resolved them from the databank by name - this model takes the numbers, not the names.\n",
    "each pure-component conductivity is `eos.chung_conductivity`'s at the mixture temperature, which is what NeqSim's `ChungConductivityMethod.calcConductivity` does.\n",
    "the pure-component conductivity is the *dilute-gas* correlation, so it carries no density dependence and the model takes no molar volume.\n",
    "`z` is checked (non-negative, sums to one) rather than renormalised, so a composition error is a loud failure, not a silently different fluid.\n",
    "the correlation is for a gas; the dilute-gas form stops being valid into the liquid region.\n",
]
references = [
    "Mason, E. A.; Saxena, S. C. (1958). \"Approximate formula for the thermal conductivity of gas mixtures.\" Physics of Fluids 1(5), 361-369. DOI 10.1063/1.1724352.",
    "Chung, T.-H.; Ajlan, M.; Lee, L. L.; Starling, K. E. (1988). \"Generalized multiparameter correlation for nonpolar and polar fluid transport properties.\" Ind. Eng. Chem. Res. 27(4), 671-679. DOI 10.1021/ie00076a024.",
]
[source]
standard = "Mason, E. A.; Saxena, S. C. (1958); Chung et al. (1988)"
edition = "Mason-Saxena mixing is Mason & Saxena, Physics of Fluids 1(5), 361-369; the pure-component conductivity it mixes is Chung et al., Ind. Eng. Chem. Res. 27(4), 671-679."
doi = "10.1063/1.1724352"
[inputs]
[inputs.Cv0]
type = "vector"
unit = "J/(mol*K)"
length = "one per component"
description = "ideal-gas heat capacity at constant volume of each component at `T`\n"
[inputs.M]
type = "vector"
unit = "kg/mol"
length = "one per component"
description = "molar mass of each component\n"
[inputs.omega]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "acentric factor of each component\n"
[inputs.Tc]
type = "vector"
unit = "K"
length = "one per component"
description = "critical temperature of each component\n"
[inputs.Vc]
type = "vector"
unit = "m**3/mol"
length = "one per component"
description = "critical volume of each component\n"
[inputs.dipole]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "dipole moment of each component, in debye\n"
[inputs.kappa]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "viscosity correction factor of each component\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.k]
unit = "W/(m*K)"
description = "the gas mixture thermal conductivity\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.mason_saxena_conductivity"
rust = "azoth_eos::mason_saxena_conductivity"
