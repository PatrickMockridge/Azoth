id = "eos.ge_wilson_phase"
name = "Fugacity coefficients of a Wilson activity-coefficient liquid"
kind = "direct"
assumptions = [
    "this is NeqSim's `PhaseGEWilson` liquid: `phi_i = gamma_i P0_i / P` on the solvent arm. There is no cubic in it - an activity-coefficient phase's non-ideality is `gamma`, and its standard state is the pure liquid at the state's temperature.",
    "**both reference states are here.** `ComponentGE.fugcoef` gives a `solvent` component `gamma_i P0_i/P` and every other `(gamma_i/gamma_i^inf) H_i/P`; `gamma_i^inf` is this phase's Wilson correlation on the solute-water pair `[1e-11, 1 - 1e-11]`, or on the diluted composition when the phase carries no water.",
    "`H_i` prefers the IAPWS G7-04 table for its 14 gases in a water-bearing phase, inside the row's fitted window, and fails closed to `1e12 bar` outside it; otherwise it is the databank's `HenryCoef1..4` correlation capped to `1e12 bar`, with the cap asked before any fittedness check.",
    "**three states are refused rather than given a number**: a non-ion Henry row with the four zeros the table uses for no correlation (NeqSim evaluates 1.802 bar), a solvent-tagged IAPWS species in water (NeqSim builds a one-component reference phase and throws), and a solvent with no Antoine row.",
    "an ion is `1e12 bar` whatever its row says. This phase takes a `Mixture` whose builder refuses an ion, so an ion-bearing fluid does not reach it.",
    "`gamma_i` is `eos.wilson_activity_coefficients`', from the paraffin-wax Wilson correlation on each component's molar mass and critical temperature, and `P0_i` is `eos.antoine_vapor_pressure`'s. Neither is recomputed here.",
    "NeqSim supplies this coefficient and the oracle reads its own: commit `c5ec5fb` (PR #3774, closing upstream #3770) stores `gamma` in `getWilsonActivityCoefficient` and delegates `getGamma` to it, so `ComponentGE.fugcoef` reads a published value where it used to read zero.",
    "**a component whose Antoine data upstream has retracted is refused**, not evaluated: `nc12` and the acids are among the 93 rows that carried one repeated filler tuple and that `83b64e5` (PR #3775) has since marked `none`. A phase over one raises `PropertyUnavailable`.",
    "`P0_i`, `H_i` and `gamma_i^inf` are reported beside `ln_phi` so a reader can check the correlation and the arithmetic separately; either a wrong reference quantity and a wrong `gamma` produce the same kind of wrong answer.",
    "this is a *liquid* phase. A vapour over it is a cubic, and combining the two is a gamma-phi flash, which is a separate model.",
    "`x` is checked (non-negative, sums to one) rather than renormalised.",
]
references = [
    "Wilson, G. M. (1964). \"Vapor-Liquid Equilibrium. XI. A New Expression for the Excess Free Energy of Mixing.\" Journal of the American Chemical Society 86(2), 127-130.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `PhaseGEWilson`, `ComponentGEWilson.getWilsonActivityCoefficient` and `ComponentGE.fugcoef` are the port source.",
]
[source]
standard = "NeqSim master `PhaseGEWilson`"
edition = "`ComponentGE.fugcoef`, ported verbatim; the activity coefficient is `eos.wilson_activity_coefficients`', ported from `ComponentGEWilson.getWilsonActivityCoefficient`."
doi = "10.1021/ja01056a002"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name. The Wilson correlation resolves each one's molar mass and critical temperature against the databank, and its Antoine vapour-pressure correlation with them."
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the liquid's mole fractions; non-negative and summing to one."
[outputs]
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the Wilson activity coefficient of each component"
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each activity coefficient"
[outputs.ln_phi]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each component's fugacity coefficient: `ln(gamma_i P0_i / P)` on the solvent arm and `ln(gamma_i / gamma_i^inf) + ln(H_i / P)` on the Henry arm"
[outputs.p_sat]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the pure-component saturation pressure of each component at `T`, and **zero where the arm reads a Henry coefficient instead**"
[outputs.henry]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the Henry coefficient each component's arm read, in pascals, and **zero where the arm reads none** - which is the solvent arm, whose reference is its own Antoine row"
[outputs.gamma_inf]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the infinite-dilution activity coefficient each component's Henry arm divided by, and **one where the arm does not divide by one**"
[implementations]
python = "azoth.eos.ge_wilson_phase"
rust = "azoth_eos::ge_wilson_phase"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
