id = "eos.ge_wilson_phase"
name = "Fugacity coefficients of a Wilson activity-coefficient liquid"
kind = "direct"
assumptions = [
    "this is NeqSim's `PhaseGEWilson` liquid: `phi_i = gamma_i P0_i / P`, which is what `ComponentGE.fugcoef` sets and what no GE phase overrides. There is no cubic in it - an activity-coefficient phase's non-ideality is `gamma`, and its standard state is the pure liquid at the state's temperature.",
    "this is the *solvent* branch of `ComponentGE.fugcoef`. Any other `REFERENCESTATETYPE` gives that method a Henry's-law coefficient instead, which is not ported - 49 of the databank's 173 substances are tagged so, and a phase over one is refused.",
    "`gamma_i` is `eos.wilson_activity_coefficients`', from the paraffin-wax Wilson correlation on each component's molar mass and critical temperature, and `P0_i` is `eos.antoine_vapor_pressure`'s. Neither is recomputed here.",
    "NeqSim's own `PhaseGEWilson` cannot supply a fugacity coefficient: `getExcessGibbsEnergy` never writes `gamma` back and `ComponentGEWilson.getGamma` is stubbed to zero, so `fugcoef` sets `phi_i = 0`. The oracle composes NeqSim's `getWilsonActivityCoefficient` over its `getAntoineVaporPressure`.",
    "the cases' substances are tagged `solvent` in NeqSim's database. `nc12` and every heavier pseudo-component share one default vapour-pressure row in `COMP.csv` - identical for `nc12`, `nc14`, `nc16`, `nc20` and `nc6-benzene` - so a case stated only over the heavy end would be stated over filler.",
    "`P0_i` is reported beside `ln_phi` so a reader can check the correlation and the arithmetic separately; a wrong `P0` and a wrong `gamma` produce the same kind of wrong answer.",
    "this is a *liquid* phase. A vapour over it is a cubic, and combining the two is a gamma-phi flash, which is a separate model.",
    "`x` is checked (non-negative, sums to one) rather than renormalised.",
]
references = [
    "Wilson, G. M. (1964). \"Vapor-Liquid Equilibrium. XI. A New Expression for the Excess Free Energy of Mixing.\" Journal of the American Chemical Society 86(2), 127-130.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `PhaseGEWilson`, `ComponentGEWilson.getWilsonActivityCoefficient` and `ComponentGE.fugcoef` are the port source.",
]
[source]
standard = "NeqSim 3.20.0 `PhaseGEWilson`"
edition = "`ComponentGE.fugcoef`, ported verbatim; the activity coefficient is `eos.wilson_activity_coefficients`', ported from `ComponentGEWilson.getWilsonActivityCoefficient`."
doi = "10.1021/ja01056a002"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name. The Wilson correlation resolves each one's molar mass and critical temperature against the databank, and its Antoine vapour-pressure correlation with them."
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the liquid's mole fractions; non-negative and summing to one."
[outputs]
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the Wilson activity coefficient of each component"
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each activity coefficient"
[outputs.ln_phi]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each component's fugacity coefficient, `ln(gamma_i P0_i / P)`"
[outputs.p_sat]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the pure-component saturation pressure of each component at `T`"
[implementations]
python = "azoth.eos.ge_wilson_phase"
rust = "azoth_eos::ge_wilson_phase"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
