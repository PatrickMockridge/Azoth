id = "eos.tp_solid_flash"
name = "Solid flash at fixed temperature and pressure"
kind = "procedure"
assumptions = [
    "**the solid is one pure component**, named by the caller - NeqSim's `setSolidPhaseCheck(name)` - because the equations and the phase storage behind them represent one solid. Upstream raises where two selected components would both precipitate, and this refuses a name the feed does not carry.",
    "**the precipitating component's fugacity is pinned by the solid, not by the material balance.** Its `E_i` is `z_i/phi_solid` rather than `sum_k beta_k/phi_ik`, so `x_i^k = phi_solid/phi_ik` holds in every fluid phase, and the Hessian loses that component's term.",
    "**the solid's amount is the material balance's remainder**, `z_solid - sum_k beta_k phi_solid/phi_ik`, and not a Newton unknown. That is what makes the loop an outer iteration on the amount and an inner one on the fluid fractions.",
    "**the solid's fugacity coefficient depends on the state alone**: `SolidFug/(P x)` cancels the mole fraction out, so there is no trial composition to make and no root to choose.",
    "**the solid-liquid heat-capacity difference is overridden to `37.12` J/(mol K) for the component named `water`** and taken from the component's own `CPsolid`/`CPliquid` tables otherwise. That override is NeqSim's own, and the class is written around ice.",
    "**the solid-liquid volume difference is read from the two density correlations at the triple point**, each falling back to the reference liquid's molar volume where the table carries none. NeqSim's fallback divides by `Phase.getDensity()`'s own `1e5`; it is ported as written.",
    "**the two routes to this state do not agree.** `SolidFlash` (a `TPflash` with the solid check on, the route the asphaltene onsets take) normalises each phase; `SolidFlash1` (`TPSolidflash()`) normalises nothing and line-searches on `Q`. This port follows `SolidFlash`.",
    "**a fluid phase the Newton takes under `1.01e-9` is removed and the solve restarts**, which is what leaves a near-freezing feed with one fluid phase rather than a second one at the floor.",
    "**NeqSim's route to this class is not the one a caller reaches by hand.** `setSolidPhaseCheck` turns the multiphase check on as a side effect and `Flash`'s solid hook is guarded on that flag being off, so a two-phase fluid comes back as the feed. The port seeds from the plain two-phase flash.",
    "the phases are reported in the solve's own order with the solid **last**, and no other order is promised. `solid_fraction` is the answer the phase's index would otherwise have to be read for.",
    "an inhibitor, a hydrate and an energy balance are not modelled, as for the rest of this family.",
    "`z` is checked (non-negative, sums to one) rather than renormalised, and `eos` is the cubic the solid's reference liquid is built from as well as the fluid's own.",
]
references = [
    "Michelsen, M. L. (1982). \"The isothermal flash problem. Part II. Phase-split calculation.\" Fluid Phase Equilibria 9(1), 21-40. The `E`/`Q` fraction formulation the solve uses.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `SolidFlash`, `Flash.solidPhaseFlash` and `ComponentSolid.fugcoef2` are the port source.",
]
[source]
standard = "NeqSim 3.20.0 `SolidFlash`"
edition = "The tabulated `ComponentSolid` route: `ComponentSolid.fugcoef2` over the component's own `HEATOFFUSION`, `TRIPLEPOINTTEMPERATURE`, `CPsolid`, `CPliquid`, `SOLIDDENSITYCOEFS` and `LIQUIDDENSITYCOEFS` columns. The Helmholtz solid routes and `SolidFlash12` are carried."
[algorithm]
scheme = "solid_fraction_newton"
initialisation = "two_phase_flash_plus_solid"
convergence = "absolute"
tolerance = 1e-08
max_iterations = 100
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name"
[inputs.solid]
type = "string"
description = "the one component allowed to precipitate, by name. NeqSim's `setSolidPhaseCheck`."
[inputs.T]
unit = "K"
description = "absolute temperature, below the named component's triple point or nothing freezes"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "overall mole fractions. Checked rather than renormalised."
[inputs.eos]
type = "enum"
values = ["pr", "srk"]
optional = true
description = "the cubic the fluid runs, which is also the one the solid's reference liquid is built from"
[outputs]
[outputs.solid_fraction]
unit = "dimensionless"
description = "the fraction of the feed's moles in the pure solid, and zero where none forms"
[outputs.phase_count]
unit = "dimensionless"
description = "how many phases the feed splits into, the solid counted when it is there"
[outputs.beta]
type = "vector"
unit = "dimensionless"
length = "one per phase"
description = "the mole fraction of the feed in each phase, summing to one. The solid is last when it is there."
[outputs.x]
type = "matrix"
unit = "dimensionless"
shape = "one row per phase, one column per component"
description = "the composition of each phase, each row summing to one"
[outputs.solid_fugacity_coefficient]
unit = "dimensionless"
description = "the pure solid's fugacity coefficient, the number the phase exists at all is answered from"
[outputs.iterations]
unit = "dimensionless"
description = "fraction-solve steps taken by the last solve"
[outputs.residual]
unit = "dimensionless"
description = "the norm of the last fraction correction"
[outputs.converged]
unit = "dimensionless"
description = "whether the residual met the tolerance"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure"
[implementations]
python = "azoth.eos.tp_solid_flash"
rust = "azoth_eos::tp_solid_flash"
