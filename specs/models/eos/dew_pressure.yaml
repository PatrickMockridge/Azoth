id: eos.dew_pressure
name: Dew-point pressure

source:
  standard: Michelsen, M. L. (1982)
  edition: >
    The isothermal flash problem. Part II. Phase-split calculation. Fluid Phase
    Equilibria 9(1), 21-40. The dew-point iteration is the same successive-
    substitution scheme as the bubble point's with the roles of the two phases
    exchanged.
  doi: "10.1016/0378-3812(82)85002-4"

kind: procedure

algorithm:
  scheme: dew_pressure_successive_substitution
  initialisation: wilson_raoult
  convergence: absolute
  tolerance: 1.0e-12
  max_iterations: 200

inputs:
  components:
    type: components
    length: one entry per component
    description: >
      the substances the mixture is made of, by name, resolved against the component
      databank this library ships (`data/components/`, compiled from NeqSim's COMP.csv
      and INTER.csv) with the loaded keycard's overrides applied. The critical
      constants, the acentric factors, the binary interaction parameters and the
      ideal-gas heat-capacity coefficients all come from there.

      **A name, rather than nine parallel vectors of numbers.** Until this input
      existed, `Tc`, `Pc`, `omega`, `kij` and `cp_a`..`cp_e` were retyped into every
      spec and every case - numbers in a YAML file that nothing could check against
      anything, and that in fact disagreed with the databank. `azoth.eos.components`
      lists what is available; a keycard adds a substance the databank does not have.
  T:
    unit: K
    description: >
      absolute temperature. The dew point is sought at this temperature; the pressure
      is what is solved for.
  y:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the vapour's mole fractions. Checked rather than renormalised, as the flash's
      feed is.

outputs:
  pressure:
    unit: Pa
    description: the dew-point pressure
  incipient:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the composition of the liquid that first appears - the `x` in equilibrium with
      the supplied `y`.
  k:
    type: vector
    unit: dimensionless
    length: one per component
    description: K-values at the converged pressure, as in `eos.bubble_pressure`
  z_liquid:
    unit: dimensionless
    description: the liquid root of the cubic at the converged state
  z_vapour:
    unit: dimensionless
    description: the vapour root
  min_t_over_tc:
    unit: dimensionless
    description: the smallest `T / Tc_i` over the components
  iterations:
    unit: dimensionless
    description: pressure updates taken
  residual:
    unit: dimensionless
    description: >
      `|sum_i y_i / K_i - 1|` at the last completed step. Not a value a case pins,
      for the same cancellation reason the guard above exists.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states

  - quantity: min_t_over_tc
    max: 1.0
    max_inclusive: false
    severity: warning
    rationale: >
      Above the nearest component's critical temperature the iteration converges more
      slowly and the answer is less trustworthy. A warning rather than an error
      because a mixture's critical temperature is not any one component's, so a
      mixture can still have a dew point where this bound is crossed.

assumptions:
  - "**A component's constants come from the databank and from nowhere else.** `Tc`, `Pc`, `omega` and every `kij` are read out of `data/components/`, compiled from NeqSim's `COMP.csv` and `INTER.csv`, with the loaded keycard's overrides applied on top - one path, the same one every model here takes. There is deliberately no way to hand a calculation a component's numbers directly: that second path is what let a spec file carry numbers that disagreed with NeqSim and be checked against nothing. Whether a tabulated constant describes the fluid in front of a caller is the caller's judgement, and the keycard is where it is exercised."
  - "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes, and the mixture fugacity coefficient is the one `eos.pt_flash` uses."
  - "**the model is for mixtures, and refuses a single component.** For one component the dew point is the saturation pressure that `eos.pure_saturation` computes."
  - "**the pressure is solved for at a fixed temperature.** A dew point at a fixed pressure, with the temperature as the unknown, is a later milestone."
  - "the vapour composition is the caller's and is taken as given, and its stability is not asked. A vapour that would have condensed earlier is not detected."
  - "no energy balance. The dew point is a statement about phase equilibrium at one temperature and pressure."

references:
  - 'Michelsen, M. L. (1982). "The isothermal flash problem. Part II. Phase-split calculation." Fluid Phase Equilibria 9(1), 21-40. DOI 10.1016/0378-3812(82)85002-4. (the successive-substitution scheme; the DOI is confirmed and the paper has not been read)'
  - 'Wilson, G. M. (1969). "A Modified Redlich-Kwong Equation of State, Application to General Physical Data Calculations." Paper 15C, AIChE 65th National Meeting. (the K-value estimate the initial guess is built from)'

implementations:
  python: azoth.eos.dew_pressure
  rust: azoth_eos::dew_pressure
