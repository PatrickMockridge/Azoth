id = "eos.phase_transport"
name = "A phase's transport properties, by NeqSim's phase-type dispatch"
kind = "direct"
assumptions = [
    "**the phase kind decides which correlations run**, and that is the id. `PhysicalProperties` is built by phase type and each subclass assigns its own models, so one fluid's gas and liquid answer from different correlations at the same state.\n",
    "**a gas phase's viscosity and conductivity are PFCT** - the heavy-oil liquid correlations - because `GasPhysicalProperties`' constructor comments the Chung lines out; only its *diffusivity* is a gas one, Chapman-Enskog on the database's Lennard-Jones parameters.\n",
    "**an aqueous phase takes the polynom models**: the liquid `Viscosity` (the mass-weighted log-mean of the LIQVISC pure viscosities) and the liquid `Conductivity` (the mass-weighted mean of the LIQCOND polynomials).\n",
    "**an oil phase takes PFCT for the two and `SiddiqiLucasMethod` for the diffusivity**, and that method's `autoSelectCorrelation` is **false**, so every liquid - an oil included - takes the *aqueous* form of the correlation.\n",
    "**the two liquid kinds read different ladders for the pure viscosity the diffusivity divides by**: an oil's PFCT class inherits the common-phase one, whose LIQVISC model 2 branch is empty, and an aqueous phase's polynom class implements it - `eos.liquid_viscosity_pure`'s `form`.\n",
    "**and a non-positive pure viscosity falls back to the phase's own**, which on an oil is the *normal* path rather than an edge: the empty branch answers zero, the class takes the phase's viscosity instead, and the clamp at `0.01` cP never fires. The captured oil phase measures it - `0.1347` cP, its own viscosity, where the ladder alone would give `0.01`.\n",
    "the molar volume the liquid diffusivity takes per component is the normal-boiling-point one: `M/rho` from the table's `LIQDENS`, and where that is absent the Tyn-Calus estimate inverted, which is `databank::normal_boiling_molar_volume`.\n",
    "**fewer than two components is refused.** The effective diffusivity divides by the sum over the *other* components, so NeqSim answers a `NaN` for a pure phase; a `NaN` is not a state this library reports.\n",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `physicalproperties/system/PhysicalProperties.java` and its per-phase subclasses are the port source; the correlations behind them are the ids named in the assumptions.",
    "`validation/neqsim/captures/phase_transport_probe.tsv` - four fluids, and per phase: T, P, density, molar mass, viscosity, conductivity, the composition, the default binary matrix and effective vector, the **model class behind each property**, the components' LIQVISC parameters and pure viscosities, and the value the explicitly selected `Chapman-Enskog` model answers.\n",
]
[source]
standard = "NeqSim master `PhysicalProperties` and its per-phase subclasses"
edition = "The phase-type dispatch, with each subclass's own model assignments; `PFCTViscosityMethodHeavyOil`, `PFCTConductivityMethodMod86`, the polynom `Viscosity` and `Conductivity`, `Diffusivity` and `SiddiqiLucasMethod` behind it."
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the phase is made of, resolved against the component databank: every correlation here reads the components' own parameters, and the gas diffusivity reads their Lennard-Jones pair.\n"
[inputs.phase]
type = "enum"
values = ["gas", "oil", "aqueous"]
description = "which of NeqSim's three phase kinds this is, **which decides the correlations**: see the assumptions.\n"
[inputs.T]
unit = "K"
description = "absolute temperature of the state.\n"
[inputs.P]
unit = "Pa"
description = "absolute pressure of the state.\n"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the phase's mole fractions, checked rather than renormalised.\n"
[outputs]
[outputs.mu]
unit = "Pa*s"
description = "the phase's dynamic viscosity, from the correlation the phase kind selects.\n"
[outputs.k]
unit = "W/(m*K)"
description = "the phase's thermal conductivity, likewise.\n"
[outputs.d_binary]
type = "matrix"
unit = "m**2/s"
shape = "one row per component, one column per component"
description = "the pairwise diffusion coefficients. **Not symmetric on a liquid**, because each entry is one component's coefficient in the other and the correlation divides by the *solvent*'s pure viscosity; symmetric on a gas.\n"
[outputs.d_effective]
type = "vector"
unit = "m**2/s"
length = "one per component"
description = "each component's effective coefficient, assembled from the binary matrix by `eos.effective_diffusion`.\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute temperature; zero and below are not states.\n"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "An absolute pressure.\n"
[[valid_range]]
quantity = "z"
min = 0
min_inclusive = true
severity = "error"
rationale = "a mole fraction cannot be negative, and NeqSim reads one without checking it\n"
[implementations]
python = "azoth.eos.phase_transport"
rust = "azoth_eos::phase_transport"
