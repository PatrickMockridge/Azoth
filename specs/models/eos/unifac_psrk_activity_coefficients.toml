id = "eos.unifac_psrk_activity_coefficients"
name = "Activity coefficients from UNIFAC with PSRK temperature-dependent interaction parameters"
kind = "direct"
assumptions = [
    "UNIFAC with the PSRK interaction parameters: `a_mn(T) = a_mn + b_mn T + c_mn T^2`, NeqSim's `ComponentGEUnifacPSRK.calcaij`. Everything else - the group basis, the combinatorial term, the residual - is `eos.unifac_activity_coefficients` unchanged.\n",
    "`a`, `b` and `c` are resolved from the named components, from NeqSim's `UNIFACInterParam`, `UNIFACInterParamB` and `UNIFACInterParamC` over the same group union, so the three matrices line up column for column.\n",
    "a pair the interaction tables do not carry is zero in all three terms, which makes `a_mn(T)` zero and the pair ideal. A mixture whose pairs all have `b = c = 0` therefore reduces this model to plain UNIFAC exactly, at every temperature.\n",
    "NeqSim's own PSRK has no usable oracle. `ComponentGEUnifacPSRK` reads no groups and returns NaN until one is supplied from NeqSim's `unifaccomp`; with one, methanol/water at 298.15 K gives `[2.9652072701594276, 3.1135350534804456]` where this model gives `[1.1156815062468024, 1.200639969105366]`.\n",
    "that pair is the sharpest test there is: its `b` and `c` are zero in NeqSim's own tables, so PSRK *must* reduce to classic UNIFAC there, and classic UNIFAC's oracle gives this model's numbers exactly. NeqSim's PSRK does not reduce.\n",
    "the cases are therefore this library's own output rather than external values, recorded so the temperature dependence cannot change unnoticed.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Holderbaum, T.; Gmehling, J. (1991). \"PSRK: A group contribution equation of state based on UNIFAC.\" Fluid Phase Equilibria 70(2-3), 251-265.",
    "Fredenslund, A.; Jones, R. L.; Prausnitz, J. M. (1975). \"Group-contribution estimation of activity coefficients in nonideal liquid mixtures.\" AIChE Journal 21(6), 1086-1099.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ComponentGEUnifacPSRK` and `PhaseGEUnifacPSRK` are the port source; neither can produce an oracle, for the reason the assumptions give.\n",
]
[source]
standard = "Holderbaum, T.; Gmehling, J. (1991)"
edition = "Fluid Phase Equilibria 70(2-3), 251-265"
doi = "10.1016/0378-3812(91)80033-8"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against NeqSim's `UNIFACcomp.csv` group decomposition and the `UNIFACGroupParam` group constants\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.unifac_psrk_activity_coefficients"
rust = "azoth_eos::unifac_psrk_activity_coefficients"
