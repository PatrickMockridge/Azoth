id = "eos.ge_uniquac_phase"
name = "Fugacity coefficients of a UNIQUAC activity-coefficient liquid"
kind = "direct"
assumptions = [
    "this is NeqSim's `PhaseGEUniquac` liquid: `phi_i = gamma_i P0_i / P` on the solvent arm. There is no cubic in it - an activity-coefficient phase's non-ideality is `gamma`, and its standard state is the pure liquid at the state's temperature.",
    "**both reference states are here.** `ComponentGE.fugcoef` gives a `solvent` component `gamma_i P0_i/P` and every other `(gamma_i/gamma_i^inf) H_i/P`; `gamma_i^inf` is this phase's UNIQUAC on the solute-water pair `[1e-11, 1 - 1e-11]`, or on the diluted composition when the phase carries no water.",
    "`H_i` prefers the IAPWS G7-04 table for its 14 gases in a water-bearing phase, inside the row's fitted window, and fails closed to `1e12 bar` outside it; otherwise it is the databank's `HenryCoef1..4` correlation capped to `1e12 bar`, with the cap asked before any fittedness check.",
    "**three states are refused rather than given a number**: a non-ion Henry row with the four zeros the table uses for no correlation (NeqSim evaluates 1.802 bar), a solvent-tagged IAPWS species in water (NeqSim builds a one-component reference phase and throws), and a solvent with no Antoine row.",
    "an ion is `1e12 bar` whatever its row says. This phase takes no mixture, so it reaches the cap; no flash carries this liquid model.",
    "`gamma_i` is `eos.uniquac_activity_coefficients`', and `P0_i` is `eos.antoine_vapor_pressure`'s on the component's own coefficients. Neither is recomputed here.",
    "`aij` is the caller's, as it is for the activity model: no upstream table carries a UNIQUAC interaction matrix, so it arrives as an argument or from a keycard entry at `coefficients.\"eos.ge_uniquac_phase\".aij`. It is in Kelvin and directional, with a zero diagonal.",
    "`r` and `q` are the UNIFAC group sums, not NeqSim's `rUNIQUAQ`/`qUNIQUAQ` columns - which are 0.0 for 109 of `UNIFACcomp.csv`'s 112 rows and which `ComponentGEUniquac`'s own constructor reads - one of the incomplete implementations `c5ec5fb` cites for withdrawing the phase.",
    "there is no differential oracle: upstream `c5ec5fb` (PR #3774, closing #3770) makes `ComponentGEUniquac.getGamma` and both standalone constructors throw, so NeqSim has withdrawn the phase this library runs. The `r`/`q` half *is* checked, against `ComponentGEUnifac.getR`/`getQ`.",
    "the cases' `aij` is a representative UNIQUAC pair, the same one the activity model's case uses, and their expected values are this library's own output recorded so a change cannot pass unnoticed.",
    "`P0_i`, `H_i` and `gamma_i^inf` are reported beside `ln_phi` so a reader can check the correlation and the arithmetic separately; either a wrong reference quantity and a wrong `gamma` produce the same kind of wrong answer.",
    "this is a *liquid* phase. A vapour over it is a cubic, and combining the two is a gamma-phi flash, which is a separate model.",
    "`x` is checked (non-negative, sums to one) rather than renormalised.",
]
references = [
    "Abrams, D. S.; Prausnitz, J. M. (1975). \"Statistical thermodynamics of liquid mixtures: A new expression for the excess Gibbs energy of partly or completely miscible systems.\" AIChE Journal 21(1), 116-128.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `PhaseGEUniquac` and `ComponentGE.fugcoef` are the port source.",
]
[source]
standard = "NeqSim master `PhaseGEUniquac`"
edition = "`ComponentGE.fugcoef`, ported verbatim; the activity coefficient is `eos.uniquac_activity_coefficients`'. Upstream commit `c5ec5fb` (PR #3774) rejects standalone UNIQUAC outright, so there is no upstream `gamma` and the phase's composition is checked by construction rather than against an oracle."
doi = "10.1002/aic.690210115"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name. `r` and `q` resolve as the UNIFAC group sums over the same decomposition `eos.unifac_activity_coefficients` uses, and each component's Antoine vapour-pressure correlation with them."
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the liquid's mole fractions; non-negative and summing to one."
[inputs.aij]
type = "matrix"
unit = "K"
shape = "N x N, asymmetric, zero diagonal"
description = "the interaction energy matrix: `tau_ij = exp(-aij[i][j] / T)`, directional and in Kelvin. No upstream table carries it, so it is the caller's or the keycard's."
[outputs]
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the UNIQUAC activity coefficient of each component"
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each activity coefficient"
[outputs.ln_phi]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each component's fugacity coefficient: `ln(gamma_i P0_i / P)` on the solvent arm and `ln(gamma_i / gamma_i^inf) + ln(H_i / P)` on the Henry arm"
[outputs.p_sat]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the pure-component saturation pressure of each component at `T`, and **zero where the arm reads a Henry coefficient instead**"
[outputs.henry]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the Henry coefficient each component's arm read, in pascals, and **zero where the arm reads none** - which is the solvent arm, whose reference is its own Antoine row"
[outputs.gamma_inf]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the infinite-dilution activity coefficient each component's Henry arm divided by, and **one where the arm does not divide by one**"
[implementations]
python = "azoth.eos.ge_uniquac_phase"
rust = "azoth_eos::ge_uniquac_phase"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
