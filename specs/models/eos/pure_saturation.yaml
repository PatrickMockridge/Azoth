id: eos.pure_saturation
name: Pure-component saturation pressure
description: >
  The pressure at which a pure component's vapour and liquid roots have equal
  fugacity, found by bisection on pressure. The first model rather than calculation
  in this registry: what has to be pinned down is not an equation - `ln phi_L = ln
  phi_V` is one line - but the *procedure* that searches for the pressure where it
  holds, and a procedure that differs between two implementations takes a different
  number of steps to a slightly different answer.

source:
  standard: Peng, D. Y.; Robinson, D. B. (1976)
  edition: "A New Two-Constant Equation of State. Industrial & Engineering Chemistry Fundamentals, 15(1), 59-64"
  equation: "TODO: source needed"
  doi: "10.1021/i160057a011"

verification:
  status: unverified
  notes: >
    The equilibrium condition is not in doubt: a pure component at saturation has
    equal fugacity in both phases, `ln phi_L = ln phi_V`, which is the definition of
    the saturation pressure rather than a correlation for it. The Peng-Robinson
    equation both fugacities come from is `eos.pr_z_factor` and `eos.pr_departure`,
    whose own verification notes apply here unchanged - this model adds a search, not
    a correlation.

    What is ours and unverified: the **procedure**. The bracketing rule, the
    tolerance and the iteration cap are choices, not results, and no source states
    them because no source would. They are recorded here so a reader can judge the
    choices rather than having to reverse-engineer them:

    * The upper bracket is the **spinodal** - the highest reduced pressure at which
      the cubic still has three admissible roots - found by a linear scan. Above it
      there is one root, no liquid branch, and nothing to equate.
    * The lower bracket is the scan's first point, `Pr = 1e-06`. Any pressure below
      the spinodal works: the residual is positive everywhere below the saturation
      pressure and monotonically decreasing, so the bracket only has to straddle the
      root, not be tight.
    * The stopping rule is on the **bracket width**, relative, not on the residual.
      A rule on `|g|` would stop at whatever pressure makes the fugacities agree to
      within a tolerance - which is the thing being solved for, so the rule would be
      circular when the two disagree for a reason other than the pressure.

    # What the bracket is NOT

    The upper end is a spinodal. The lower end is not - and an earlier version of
    this note said it was, describing a "spinodal window" of 0.10-18.94 bar for
    propane at 300 K. That range was an artefact of where the scan happened to start.
    A cubic equation of state has three real roots at *every* pressure below the
    upper spinodal, including pressures so low that the "liquid" root describes a
    molar volume no liquid could have. The window is one-sided, and the bracket's
    lower end is arbitrary on purpose.

    # Why no accuracy claim

    PR's saturation pressures are good to a few tenths of a per cent for light
    hydrocarbons and worse elsewhere. The cases below record the deviations rather
    than asserting a band, because a band on `Tr` would look like validation while
    asserting nothing - the same argument `eos.pr_kappa` makes.

algorithm:
  scheme: saturation_pressure_bisection
  convergence: relative
  tolerance: 1.0e-12
  max_iterations: 200
  bracket:
    scheme: linear_scan_for_spinodal
    lower: 1.0e-06
    upper: 0.999
    steps: 4000

inputs:
  Tc:
    unit: K
    description: critical temperature of the pure component
  Pc:
    unit: Pa
    description: critical pressure of the pure component
  omega:
    unit: dimensionless
    description: acentric factor, as in `eos.pr_kappa`. All three of these are the caller's - this library ships no component databank.
  T:
    unit: K
    description: >
      absolute temperature at which the saturation pressure is wanted. Must be below
      `Tc`: above the critical temperature a pure component has no saturation
      pressure, and the model refuses rather than returning the critical pressure or
      a plausible-looking extrapolation.

outputs:
  p_sat:
    unit: Pa
    description: the saturation pressure
  ln_phi:
    unit: dimensionless
    description: >
      The common value of `ln phi_L` and `ln phi_V` at the converged pressure. Equal
      for both phases by construction; reported because it is the quantity the
      iteration drives to agreement, so a caller can see how well it closed rather
      than inferring it from the pressure.
  iterations:
    unit: dimensionless
    description: >
      Bisection steps taken. Carried because the answer alone does not say whether
      the search did any work, and because the cross-language agreement test compares
      iteration counts as the sharpest cheap check that both implementations ran the
      same procedure.
  residual:
    unit: dimensionless
    description: >
      The *dimensionless* half-width of the final bracket, `(hi - lo) / (2 * mid)` -
      that is, the relative uncertainty in the reduced pressure. Not `ln phi_L -
      ln phi_V`, which was measured at 2e-13 for the worked example and is a
      different number; a caller who wants that can compute both fugacities from
      `eos.pr_departure` at the returned pressure.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states

  - quantity: Tc
    min: 0
    min_inclusive: false
    severity: error
    rationale: a critical temperature is absolute and positive by definition; it is also a divisor in the reduced temperature

  - quantity: Pc
    min: 0
    min_inclusive: false
    severity: error
    rationale: a critical pressure is positive by definition, and it converts the reduced answer back to pascals

  - quantity: t_over_tc
    computed_from: [T, Tc]
    max: 1
    max_inclusive: false
    severity: error
    rationale: >
      Above the critical temperature a pure component has no saturation pressure.
      The bound is on the *ratio* because that is the quantity the model needs - a
      bound on `T` alone would have to be a bound that happened to be right for the
      `Tc` in play, which is not a bound at all.

      At exactly `Tc` the two roots have merged, there is one fugacity, and the
      residual is zero for every pressure - so the search would converge on nothing.
      Hence exclusive.

assumptions:
  - "the component's `Tc`, `Pc` and `omega` are correct and mutually consistent. NOT CHECKED - they are the caller's, and this library ships no component data."
  - the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes. PRSV, with `eos.prsv_kappa`, would give a different saturation pressure from the same inputs, and this model does not accept a coefficient.
  - "**`p_sat` is the pressure where the two *roots* agree, not necessarily the pressure where the component really saturates.** The cubic has three real roots below the spinodal at every pressure, including pressures so low that the liquid root describes an impossible molar volume; the bisection finds where their fugacities cross, which is the model's saturation pressure by definition and is a property of the equation rather than of the substance."
  - "**near the critical temperature the answer degrades sharply**, and the model cannot tell. The roots coalesce as `Tr -> 1`, the residual flattens, and the last digits of `p_sat` stop being determined by the equation - the same ill-conditioning `eos.pr_z_factor` records. A caller working close to the critical point should read `residual` and `iterations` rather than trusting the digits."
  - no stability analysis is performed. The two roots exist and their fugacities cross; whether the single-root solution would have been more stable is not asked.
  - the result is a *pure-component* property. A mixture's bubble point is a different calculation and is not this one with an extra component.

references:
  - 'Peng, D. Y.; Robinson, D. B. (1976). "A New Two-Constant Equation of State." Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011. (the equation of state whose roots this equates; the citation is confirmed and the equation numbers are not)'

implementations:
  python: azoth.eos.pure_saturation
  rust: azoth_eos::pure_saturation

cases:
  - id: propane_at_300_k
    inputs: { Tc: 369.83, Pc: 4248000.0, omega: 0.1523, T: 300.0 }
    expected: { p_sat: 997667.7436544185 }
    tolerance: 1.0e-9
    source: >
      Derived by running the specified procedure - a scan for the spinodal, then
      bisection to a relative bracket width of 1e-12 - and checked against the
      literature: propane's vapour pressure at 300 K is 9.974 bar, and this gives
      9.9767 bar, a deviation of +0.03%.

      The agreement is worth having because it is an *independent* check of the whole
      chain rather than of the search: `Tc`, `Pc` and `omega` go in, and what comes
      out matches a number nobody in this repository computed. It validates the alpha
      function, the reduced parameters, the cubic, the root selection, the fugacity
      expression and the departure functions at once.
    note: >
      The tolerance is 1e-9 rather than the 1e-12 the algorithm's own tolerance would
      allow, and the reason is the scan: the bracket's upper end is quantised by the
      step size, so the converged pressure depends on it. Two implementations with the
      same step count agree exactly; a caller reproducing this by hand with a
      different scan resolution lands within 1e-9.

      The value above is what this implementation returns, not what a hand calculation
      gives. An independent route to the same number - a scan built on a different
      cubic solver, as this spec's first draft was - agrees to about 4e-13 relative,
      which is the bracket's quantisation showing through and not a disagreement.

  - id: carbon_dioxide_at_280_k
    inputs: { Tc: 304.13, Pc: 7377000.0, omega: 0.2239, T: 280.0 }
    expected: { p_sat: 4159392.604815074 }
    tolerance: 1.0e-9
    source: >
      Derived the same way, at a second substance and a reduced temperature much
      closer to the critical point - `Tr = 0.921` against propane's `0.811`, so the
      roots are nearer to coalescing and the search is harder.

      Carbon dioxide's vapour pressure at 280 K is 41.6 bar and this gives 41.5939
      bar, a deviation of -0.01%. Worth having alongside the propane case because the
      two are on opposite sides of the true value, which a systematic error in the
      equation would not produce.
    note: >
      This case is also the one that would catch a bracket that is too narrow: at
      `Tr = 0.921` the spinodal sits far closer to the saturation pressure than at
      `Tr = 0.811`, so a scan whose upper limit overshot would find no three-root
      window and fail here while propane passed.
