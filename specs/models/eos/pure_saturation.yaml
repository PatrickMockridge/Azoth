id: eos.pure_saturation
name: Pure-component saturation pressure

source:
  standard: Peng, D. Y.; Robinson, D. B. (1976)
  edition: "A New Two-Constant Equation of State. Industrial & Engineering Chemistry Fundamentals, 15(1), 59-64"
  doi: "10.1021/i160057a011"

kind: procedure

algorithm:
  scheme: saturation_pressure_bisection
  convergence: relative
  tolerance: 1.0e-12
  max_iterations: 200
  bracket:
    scheme: linear_scan_for_spinodal
    lower: 1.0e-06
    upper: 0.999
    steps: 4000

inputs:
  Tc:
    unit: K
    description: critical temperature of the pure component
  Pc:
    unit: Pa
    description: critical pressure of the pure component
  omega:
    unit: dimensionless
    description: acentric factor, as in `eos.pr_kappa`. All three of these are the caller's; `azoth.eos.component(name)` looks them up in the databank the library ships.
  T:
    unit: K
    description: >
      absolute temperature at which the saturation pressure is wanted. Must be below
      `Tc`: above the critical temperature a pure component has no saturation
      pressure, and the model refuses rather than returning the critical pressure or
      a plausible-looking extrapolation.

outputs:
  p_sat:
    unit: Pa
    description: the saturation pressure
  ln_phi:
    unit: dimensionless
    description: >
      The common value of `ln phi_L` and `ln phi_V` at the converged pressure. Equal
      for both phases by construction; reported because it is the quantity the
      iteration drives to agreement, so a caller can see how well it closed rather
      than inferring it from the pressure.
  iterations:
    unit: dimensionless
    description: >
      Bisection steps taken. Carried because the answer alone does not say whether
      the search did any work, and because the cross-language agreement test compares
      iteration counts as the sharpest cheap check that both implementations ran the
      same procedure.
  residual:
    unit: dimensionless
    description: >
      The *dimensionless* half-width of the final bracket, `(hi - lo) / (2 * mid)` -
      that is, the relative uncertainty in the reduced pressure. Not `ln phi_L -
      ln phi_V`, which was measured at 2e-13 for the worked example and is a
      different number; a caller who wants that can compute both fugacities from
      `eos.pr_departure` at the returned pressure.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states

  - quantity: Tc
    min: 0
    min_inclusive: false
    severity: error
    rationale: a critical temperature is absolute and positive by definition; it is also a divisor in the reduced temperature

  - quantity: Pc
    min: 0
    min_inclusive: false
    severity: error
    rationale: a critical pressure is positive by definition, and it converts the reduced answer back to pascals

  - quantity: t_over_tc
    computed_from: [T, Tc]
    max: 1
    max_inclusive: false
    severity: error
    rationale: >
      Above the critical temperature a pure component has no saturation pressure.
      The bound is on the *ratio* because that is the quantity the model needs - a
      bound on `T` alone would have to be a bound that happened to be right for the
      `Tc` in play, which is not a bound at all.

      At exactly `Tc` the two roots have merged, there is one fugacity, and the
      residual is zero for every pressure - so the search would converge on nothing.
      Hence exclusive.

assumptions:
  - "the component's `Tc`, `Pc` and `omega` are correct and mutually consistent. NOT CHECKED - they are the caller's. A databank ships with the library, so they can come from there."
  - the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes. PRSV, with `eos.prsv_kappa`, would give a different saturation pressure from the same inputs, and this model does not accept a coefficient.
  - "**`p_sat` is the pressure where the two *roots* agree, not necessarily the pressure where the component really saturates.** The cubic has three real roots below the spinodal at every pressure, including pressures so low that the liquid root describes an impossible molar volume; the bisection finds where their fugacities cross, which is the model's saturation pressure by definition and is a property of the equation rather than of the substance."
  - "**near the critical temperature the answer degrades sharply**, and the model cannot tell. The roots coalesce as `Tr -> 1`, the residual flattens, and the last digits of `p_sat` stop being determined by the equation - the same ill-conditioning `eos.pr_z_factor` records. A caller working close to the critical point should read `residual` and `iterations` rather than trusting the digits."
  - no stability analysis is performed. The two roots exist and their fugacities cross; whether the single-root solution would have been more stable is not asked.
  - the result is a *pure-component* property. A mixture's bubble point is a different calculation and is not this one with an extra component.

references:
  - 'Peng, D. Y.; Robinson, D. B. (1976). "A New Two-Constant Equation of State." Industrial & Engineering Chemistry Fundamentals 15(1), 59-64. DOI 10.1021/i160057a011. (the equation of state whose roots this equates; the citation is confirmed and the equation numbers are not)'

implementations:
  python: azoth.eos.pure_saturation
  rust: azoth_eos::pure_saturation

cases:
  - id: propane_at_300_k
    inputs: { Tc: 369.83, Pc: 4248000.0, omega: 0.1523, T: 300.0 }
    expected: { p_sat: 997667.7436544185 }
    tolerance: 1.0e-9
  - id: carbon_dioxide_at_280_k
    inputs: { Tc: 304.13, Pc: 7377000.0, omega: 0.2239, T: 280.0 }
    expected: { p_sat: 4159392.604815074 }
    tolerance: 1.0e-9
