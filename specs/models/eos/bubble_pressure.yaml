id: eos.bubble_pressure
name: Bubble-point pressure

source:
  standard: Michelsen, M. L. (1982)
  edition: >
    The isothermal flash problem. Part II. Phase-split calculation. Fluid Phase
    Equilibria 9(1), 21-40. The bubble- and dew-point iterations are the standard
    successive-substitution schemes and are set out there and in any cubic-EOS text;
    the formulation here is the one every implementation uses.
  doi: "10.1016/0378-3812(82)85002-4"

kind: procedure

algorithm:
  scheme: bubble_pressure_successive_substitution
  initialisation: wilson_raoult
  convergence: absolute
  tolerance: 1.0e-12
  max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      acentric factors, in the same order. All three vectors are the caller's - this
      library ships a databank of them (`azoth.eos.component`) - and they must be mutually consistent,
      which is not checked.
  kij:
    type: matrix
    unit: dimensionless
    shape: "N x N, symmetric, zero diagonal"
    description: binary interaction parameters, as in `eos.pt_flash`
  T:
    unit: K
    description: >
      absolute temperature. The bubble point is sought at this temperature; the
      pressure is what is solved for.
  x:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the liquid's mole fractions. Checked rather than renormalised, as the flash's
      feed is.

outputs:
  pressure:
    unit: Pa
    description: the bubble-point pressure
  incipient:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the composition of the vapour that first appears - the `y` in equilibrium with
      the supplied `x`. Named `incipient` rather than `y` because that is the field a
      caller branches on: it is the phase that is not there yet.
  k:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      K-values at the converged pressure, `K_i = y_i / x_i = phi_i^L / phi_i^V`.
      Reported because they are what the trivial-solution guard is about, so a
      caller can see how far apart the two phases are rather than inferring it.
  z_liquid:
    unit: dimensionless
    description: the liquid root of the cubic at the converged state
  z_vapour:
    unit: dimensionless
    description: the vapour root
  min_t_over_tc:
    unit: dimensionless
    description: >
      the smallest `T / Tc_i` over the components. Reported because a bound is
      checked against it and because it is what the refusal above names.
  iterations:
    unit: dimensionless
    description: pressure updates taken
  residual:
    unit: dimensionless
    description: >
      `|sum_i x_i K_i - 1|` at the last completed step. **Not a value a case pins**:
      it is a weighted sum of differences and differs between implementations in its
      last digits, for the reasons the flash's spec records. See `eos.pt_flash`'s
      correction 4.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states

  - quantity: min_t_over_tc
    max: 1.0
    max_inclusive: false
    severity: warning
    rationale: >
      Above the nearest component's critical temperature the mixture may still have a
      bubble point - a mixture's critical temperature is not any one component's -
      but the iteration converges more slowly and the answer is less trustworthy.
      A warning rather than an error because the state is real, and because
      whether a bubble point exists at all is decided by the guard in the notes
      rather than by this bound.

assumptions:
  - "**`Tc`, `Pc`, `omega` and `kij` are the caller's and their correctness is NOT CHECKED.** A databank ships with the library (`azoth.eos.component`), and a caller who supplies their own values replaces it silently - nothing checks that the two agree."
  - "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes, and the mixture fugacity coefficient is the one `eos.pt_flash` uses - the same composition-checked form that reduces to `eos.pr_departure` at N = 1 and to `eos.vdw1f_mix_binary` at N = 2."
  - "**the model is for mixtures, and refuses a single component.** For one component the two phases have the same composition by construction, and the bubble point is the saturation pressure that `eos.pure_saturation` computes."
  - "**the pressure is solved for at a fixed temperature.** A bubble point at a fixed *pressure*, with the temperature as the unknown, is a later milestone - the inner solve then nests inside an outer one and the scheme is not the one named here."
  - "the liquid composition is the caller's and is taken as given. Whether that liquid is stable, or would have split into two liquids before reaching this point, is not asked - there is no stability analysis in this library yet."
  - "no energy balance. The bubble point is a statement about phase equilibrium at one temperature and pressure, not about how a stream got there."

references:
  - 'Michelsen, M. L. (1982). "The isothermal flash problem. Part II. Phase-split calculation." Fluid Phase Equilibria 9(1), 21-40. DOI 10.1016/0378-3812(82)85002-4. (the successive-substitution scheme; the DOI is confirmed and the paper has not been read)'
  - 'Wilson, G. M. (1969). "A Modified Redlich-Kwong Equation of State, Application to General Physical Data Calculations." Paper 15C, AIChE 65th National Meeting. (the K-value estimate the initial guess is built from, via the same `eos.pt_flash` records)'

implementations:
  python: azoth.eos.bubble_pressure
  rust: azoth_eos::bubble_pressure
