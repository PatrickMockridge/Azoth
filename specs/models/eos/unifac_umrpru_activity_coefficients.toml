id = "eos.unifac_umrpru_activity_coefficients"
name = "Activity coefficients from UNIFAC with UMR-PRU group-interaction parameters"
kind = "direct"
assumptions = [
    "UNIFAC with the UMR-PRU interaction parameters: `a_mn(T) = a_mn + b_mn (T - 298.15) + c_mn (T - 298.15)^2`, NeqSim's `ComponentGEUnifacUMRPRU.calcaij`. The offset from 298.15 K is the one place this differs from `eos.unifac_psrk_activity_coefficients` besides the tables.\n",
    "the group decomposition is NeqSim's `UNIFACcompUMRPRU`: 139 subgroups rather than the 133 of `UNIFACcomp`. The group constants are the shared `UNIFACGroupParam` table, so only the decomposition and the interaction differ.\n",
    "which parameter set is read is a **named input**, not something inferred. NeqSim decides it in `useMcInteractionParameters()`, reading `getComponent(0).getAttractiveTermNumber()` and choosing `_umrmc` when it is 13, 19 or 22.\n",
    "this library's component model carries no attractive-term number, so the caller states which equation of state they are pairing the model with rather than a field being invented to carry it.\n",
    "a pair the interaction tables do not carry is zero in all three terms, which makes `a_mn(T)` zero and the pair ideal.\n",
    "there is no differential oracle. NeqSim reaches `PhaseGEUnifacUMRPRU` only through `SystemUMRPRUMCEosNew`, a Mathias-Copeman cubic: every phase a flash of it produces is `PhasePrEosvolcor`, so no GE phase forms and no activity coefficient is ever read. Measured at four states.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Voutsas, E.; Magoulas, K.; Tassios, D. (2004). \"Universal mixing rule for cubic equations of state applicable to symmetric and asymmetric systems: results and simple, predictive scheme for parameters.\" Industrial & Engineering Chemistry Research 43(19), 6238-6246.",
    "Fredenslund, A.; Jones, R. L.; Prausnitz, J. M. (1975). \"Group-contribution estimation of activity coefficients in nonideal liquid mixtures.\" AIChE Journal 21(6), 1086-1099.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ComponentGEUnifacUMRPRU` and `PhaseGEUnifacUMRPRU` are the port source; neither yields a differential oracle, for the reason the assumptions give.\n",
]
[source]
standard = "Voutsas, E.; Magoulas, K.; Tassios, D. (2004)"
edition = "Industrial & Engineering Chemistry Research 43(19), 6238-6246"
doi = "10.1021/ie049832l"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against NeqSim's `UNIFACcompUMRPRU.csv` group decomposition and the `UNIFACGroupParam` group constants\n"
[inputs.parameters]
type = "enum"
values = ["umr", "umrmc"]
description = "which interaction set to read: `umr` for the original tables, or `umrmc` for the ones the Mathias-Copeman UMR-PRU variants share.\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.unifac_umrpru_activity_coefficients"
rust = "azoth_eos::unifac_umrpru_activity_coefficients"
