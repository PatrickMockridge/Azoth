id = "eos.desmukh_mather_phase"
name = "Activity coefficients of a Desmukh-Mather electrolyte phase"
kind = "direct"
assumptions = [
    "NeqSim's `ComponentDesmukhMather.getGamma` is an extended Debye-Huckel term plus a pairwise sum, then a change of scale: `ln gamma*_i = -A z_i^2 sqrt(I)/(1 + B d_i 1e-10 sqrt(I)) + 2 sum_j beta_ij m_j`, and `gamma_i = m_i M_solvent exp(ln gamma*_i) / x_i` with `A = 1.174` and `B = 3.32384e9`.",
    "**the pair sum carries four rows of the interaction table**, all one chemistry: `MDEA+`/`CO2`, `HCO3-`/`MDEA`, `CO3--`/`MDEA` and `HCO3-`/`MDEA+`. `bij` is zero on every row of the table, so `beta` does not vary with temperature at all and the model is a Debye-Huckel term plus a constant per pair.",
    "**`MDEA`/`MDEA` is `-0.0828487` and is not in the table.** `PhaseDesmukhMather.getParameters` assigns it when both components are named `MDEA` and reads nothing for that pair, so the one value the model's author fitted is in the code.",
    "**the solvent is selected by `REFERENCESTATETYPE`, not by the name `water`**: `getSolventWeight` sums `n_i M_i` over every `solvent`-reference component, so `solvent_molar_mass` is a mixture mean - where `PhasePitzer`'s is water's own.",
    "**the fugacity branch's first test is a *name*.** `fugcoef` asks for `water` by name before it asks the reference state, and only that branch carries the Poynting correction - so a `solvent`-reference component that is not water gets none. Measured, that is 0.34% at 313 K and 5 bar.",
    "the solute branch is `(gamma / gamma^infinity) H / P`, evaluated at `initRefPhases`'s reference state - **the solute at `1e-10` mol beside water at 10 mol**, so its mole fraction is `1e-11`. Measured, that ratio is one to eleven digits, so it agrees with Pitzer's form rather than differing from it.",
    "an ion gets `1e-15` - the smallest of the tranche's three insoluble-ion constants, against Pitzer's `1e12` and Kent-Eisenberg's `1e8`. A `1e-15` says the ion is absent from the vapour rather than sparingly present.",
    "`getMolality` is `n_i / getSolventWeight()`, the same override the Pitzer components make, so a molality is a function of the mole fractions alone.",
    "the four branches are: the name `water`, then a neutral on a `solvent` reference, then a neutral on a `solute` reference, then everything else. A neutral whose reference state is the literal `0.0` therefore falls to the ion constant, which is NeqSim's own fall-through.",
    "`x` is checked rather than renormalised.",
]
references = [
    "Deshmukh, R. D. and Mather, A. E. (1981). \"A mathematical model for equilibrium solubility of hydrogen sulfide and carbon dioxide in aqueous alkanolamine solutions.\" Chemical Engineering Science 36(2), 355-362.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `PhaseDesmukhMather`, `ComponentDesmukhMather` and `PhaseGE.getActivityCoefficientInfDilWater` are the port source.",
]
[source]
standard = "NeqSim master `PhaseDesmukhMather`"
edition = "`ComponentDesmukhMather.getGamma` and `fugcoef`, ported verbatim, with `PhaseDesmukhMather.getParameters`'s pair lookup and its `MDEA` diagonal."
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the phase is made of, by name. The databank supplies each one's ionic charge, `DeshMatIonicDiameter` and reference state, and the reference state is what marks the solvent."
[inputs.T]
unit = "K"
description = "absolute temperature"
[inputs.P]
unit = "Pa"
description = "absolute pressure. It enters the fugacity coefficient and not the activity coefficient."
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the phase's mole fractions; non-negative and summing to one. One must be a `solvent`-reference component, or there is no mass to measure a molality against."
[outputs]
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component, on the mole-fraction scale the conversion produces"
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each activity coefficient"
[outputs.molality]
type = "vector"
unit = "mol/kg"
length = "one per component"
description = "each component's molality `n_i / m_solvent`, where the solvent is every `solvent`-reference component together"
[outputs.ionic_strength]
unit = "mol/kg"
description = "`I = 1/2 sum m_i z_i^2` over every component"
[outputs.solvent_molar_mass]
unit = "kg/mol"
description = "the mean molar mass of the `solvent`-reference components, which multiplies every activity coefficient"
[outputs.ln_phi]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each component's fugacity coefficient. `ln(gamma P0 / P)` for a solvent, `ln((gamma / gamma^inf) H / P)` for a neutral solute, `ln(1e-15)` for an ion."
[implementations]
python = "azoth.eos.desmukh_mather_phase"
rust = "azoth_eos::desmukh_mather_phase"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
