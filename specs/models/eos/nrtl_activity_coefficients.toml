id = "eos.nrtl_activity_coefficients"
name = "Activity coefficients from the NRTL local-composition model"
kind = "direct"
assumptions = [
    "`alpha` and `Dij` are resolved from the named components, from the `NRTLALPHA`/`NRTLGIJ`/`NRTLGJI` columns of NeqSim's `INTER.csv`, so `alpha` is symmetric and both diagonals are zero by construction rather than by a check the caller could fail.\n",
    "`tau_ij = Dij[i][j] / T` carries no gas constant, so `Dij` is in Kelvin, exactly as NeqSim's `NRTLGIJ`/`NRTLGJI` columns store it.\n",
    "a pair the interaction table does not carry resolves to zero, which is an ideal interaction; a mixture the table has never seen therefore returns `gamma = 1`. A name in no table at all is refused instead.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Renon, H.; Prausnitz, J. M. (1968). \"Local compositions in thermodynamic excess functions for liquid mixtures.\" AIChE Journal 14(1), 135-144.",
]
[source]
standard = "Renon, H.; Prausnitz, J. M. (1968)"
edition = "AIChE Journal 14(1), 135-144"
doi = "10.1002/aic.690140124"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against NeqSim's `INTER.csv` (`NRTLALPHA`/`NRTLGIJ`/`NRTLGJI`, compiled to `data/components/kij.csv`)\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.nrtl_activity_coefficients"
rust = "azoth_eos::nrtl_activity_coefficients"
