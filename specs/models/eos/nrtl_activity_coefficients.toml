id = "eos.nrtl_activity_coefficients"
name = "Activity coefficients from the NRTL local-composition model"
kind = "direct"
assumptions = [
    "the caller resolved `Dij` and `alpha` from the databank by name pair - this model takes the matrices, not the names, the way `eos.wilke_viscosity` takes the constants.\n",
    "`tau_ij = Dij[i][j] / T` carries no gas constant, so `Dij` is in Kelvin, exactly as NeqSim's `NRTLGIJ`/`NRTLGJI` columns store it.\n",
    "`alpha` is symmetric and both matrices have a zero diagonal; a caller must supply them that way, and a violation is refused rather than silently symmetrised.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Renon, H.; Prausnitz, J. M. (1968). \"Local compositions in thermodynamic excess functions for liquid mixtures.\" AIChE Journal 14(1), 135-144.",
]
[source]
standard = "Renon, H.; Prausnitz, J. M. (1968)"
edition = "AIChE Journal 14(1), 135-144"
doi = "10.1002/aic.690140124"
[inputs]
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[inputs.Dij]
type = "matrix"
unit = "K"
shape = "N x N, asymmetric, zero diagonal"
description = "the NRTL energy matrix: `Dij[i][j] = g_ij` in Kelvin, with `tau_ij = g_ij / T`\n"
[inputs.alpha]
type = "matrix"
unit = "dimensionless"
shape = "N x N, symmetric, zero diagonal"
description = "the NRTL non-randomness matrix `alpha_ij`\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[implementations]
python = "azoth.eos.nrtl_activity_coefficients"
rust = "azoth_eos::nrtl_activity_coefficients"
