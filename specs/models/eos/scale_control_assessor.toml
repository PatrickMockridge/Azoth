min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "magnesium"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "sodium"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "bicarbonate"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "sulphate"
min = 0
min_inclusive = true
severity = "error"
rationale = "A concentration cannot be negative.\n"
[[valid_range]]
quantity = "total_dissolved_solids"
