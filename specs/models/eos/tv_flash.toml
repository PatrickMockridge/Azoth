id = "eos.tv_flash"
name = "Temperature-volume flash"
kind = "procedure"
references = [
    "Michelsen, M. L.; Mollerup, J. M. (2004). \"Thermodynamic Models: Fundamentals and Computational Aspects.\" Tie-Line Publications.",
]
assumptions = [
    "the iteration is quasi-Newton in pressure from an ideal-gas estimate `P = R*T/V`, with a central-difference `dV/dP` slope; every step is clamped to half the current pressure.",
    "a trial pressure the inner flash cannot settle is backed off, not fatal: the gap is halved back towards the last pressure that worked, up to fifteen times.",
    "the flash at each trial pressure is converged, not exact: the volume inverted is that of a converged approximation.",
    "no check that the feed is stable: the model asks where the volume is satisfied, not whether the state found is the equilibrium one.",
]
[source]
standard = "Standard thermodynamics, as in Michelsen & Mollerup"
edition = "The procedure is the ordinary one: the molar volume of a mixture at fixed temperature is a strictly decreasing function of pressure."
[algorithm]
scheme = "tv_flash_inverse_pressure_newton"
convergence = "relative"
tolerance = 1e-08
max_iterations = 200
initialisation = "ideal_gas"
[algorithm.inner]
scheme = "successive_substitution_flash"
initialisation = "wilson"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 300
[algorithm.inner.inner]
scheme = "rachford_rice_bisection"
convergence = "absolute"
tolerance = 1e-14
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank (`data/components/`, from NeqSim's COMP.csv and INTER.csv) with the keycard's overrides applied"
[inputs.T]
unit = "K"
description = "absolute temperature. Held fixed; the pressure is what is solved for."
[inputs.V]
unit = "m**3/mol"
description = "the molar volume the mixture is to reach, on a one-mole basis."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed's mole fractions. Checked rather than renormalised."
[outputs]
[outputs.P]
unit = "Pa"
description = "the pressure that satisfies the volume. This is the answer."
[outputs.beta]
unit = "dimensionless"
description = "the vapour fraction at that pressure. Absent for a single-phase feed."
[outputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "liquid-phase mole fractions at the answer"
[outputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "vapour-phase mole fractions at the answer"
[outputs.k]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "`K_i = y_i / x_i` at the answer"
[outputs.phase]
type = "enum"
values = ["all_liquid", "two_phase", "all_vapour"]
description = "which phase the feed is in at the answer"
[outputs.z_liquid]
unit = "dimensionless"
description = "the liquid root of the cubic at the answer"
[outputs.z_vapour]
unit = "dimensionless"
description = "the vapour root"
[outputs.iterations]
unit = "dimensionless"
description = "Newton iterations taken"
[outputs.residual]
unit = "dimensionless"
description = "`(V(P) - V_target) / |V_target|` at the answer, signed"
[[valid_range]]
quantity = "T"
min = 0.0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "V"
min = 0.0
min_inclusive = false
severity = "error"
rationale = "a molar volume; zero and below are not states, and the ideal-gas pressure estimate divides by it"
[implementations]
python = "azoth.eos.tv_flash"
rust = "azoth_eos::tv_flash"
