id = "eos.capillary_dew_point"
name = "Capillary dew point"
kind = "procedure"
assumptions = [
    "this is NeqSim's `CapillaryDewPointFlash`: the dew point of a vapour in a pore, where the interface is curved. Young-Laplace puts the liquid `2 sigma cos(theta)/r` above the vapour and the Kelvin equation shifts every K-value by `exp(-Vm_L dP_cap/(R T))`, so the dew point moves **up**.",
    "**the surface tension is the caller's.** NeqSim reads it off the phase's interphase properties and falls back to a constant `0.005 N/m`; this takes it as an argument, because a surface tension is a fitted quantity with its own provenance, and `eos.parachor_surface_tension` computes one.",
    "the molar volume in the Kelvin exponent is the liquid's at the cubic's own lower root, so the exponent reduces to `z_liquid dP_cap/P` and needs no gas constant.",
    "**NeqSim's own molar volume is not that number.** It reads `getMolarVolume(\"m3/mol\")`, which disagrees with its own `getZ` by 5.6% on the same phase - measured by `validation/neqsim/CapillaryVolume.java`, which prints both.",
    "`pore_radius` is in **metres** and `contact_angle` in **radians**, zero being a perfectly wetting liquid. The radii that matter are nanometres and the constructor takes metres - the unit hazard this port has been bitten by three times.",
    "the equation of state and the iteration are `eos.dew_temperature`'s: this is that boundary with a curvature, not a second boundary. A radius large enough to be a flat interface reproduces `eos.dew_temperature` to the last digit.",
    "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes, and the mixture fugacity coefficient is the one `eos.pt_flash` uses.",
    "`y` is checked (non-negative, sums to one) rather than renormalised.",
    "no energy balance and no pore-size distribution: one radius, one dew point. A real rock has a distribution and this is its per-radius answer.",
]
references = [
    "Kelvin, W. T. (1871). \"On the equilibrium of vapour at a curved surface of liquid.\" Philosophical Magazine 42(282), 448-452. The K-value shift this model applies.\n",
    "Young, T. (1805). \"An Essay on the Cohesion of Fluids.\" Philosophical Transactions of the Royal Society 95, 65-87, and Laplace, P. S. (1805). Traite de mecanique celeste, Vol. 4, Supplement 1. The `2 sigma cos(theta)/r` across a curved interface.\n",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `CapillaryDewPointFlash`, the port source, reached through `ThermodynamicOperations.capillaryDewPointTemperatureFlash(r[, theta])`.\n",
    "`validation/neqsim/CapillaryDew.java` - the driver, and the measurements the case records.\n",
]
[source]
standard = "NeqSim master `CapillaryDewPointFlash`"
edition = "The K-value shift and the temperature iteration are ported from `CapillaryDewPointFlash` and `ConstantDutyTemperatureFlash`; the surface tension is an argument here and an interphase property there, and that difference is in the assumptions."
[algorithm]
scheme = "capillary_dew_point_newton"
initialisation = "wilson_raoult"
convergence = "absolute"
tolerance = 1e-12
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank (`data/components/`, from NeqSim's COMP.csv and INTER.csv) with the keycard's overrides applied"
[inputs.P]
unit = "Pa"
description = "absolute pressure of the vapour"
[inputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the vapour's mole fractions; non-negative and summing to one."
[inputs.pore_radius]
unit = "m"
description = "the effective pore or capillary radius. Small radii move the dew point furthest: the shift goes as `1/r`."
[inputs.contact_angle]
unit = "dimensionless"
description = "the contact angle between the liquid and the pore wall, **in radians**. Zero is a perfectly wetting liquid, where the shift is largest; `pi/2` is non-wetting and there is no shift. Dimensionless because a radian is, and the vocabulary carries no angle."
[inputs.surface_tension]
unit = "N/m"
description = "the liquid-vapour surface tension. Not read from the mixture: it is the caller's, and `eos.parachor_surface_tension` computes one."
[outputs]
[outputs.temperature]
unit = "K"
description = "the dew-point temperature inside the pore. Never below the flat-interface dew point at the same pressure."
[outputs.incipient]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the composition of the liquid that first appears"
[outputs.k]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "K-values at the converged answer, **with the Kelvin shift applied**. They are what the residual is measured on, so they are the iterate rather than a composition."
[outputs.z_liquid]
unit = "dimensionless"
description = "the liquid root of the cubic at the converged state"
[outputs.z_vapour]
unit = "dimensionless"
description = "the vapour root"
[outputs.capillary_pressure]
unit = "Pa"
description = "the Young-Laplace pressure across the interface, `2 sigma cos(theta) / r`. Reported because it is the one quantity this model has that `eos.dew_temperature` does not, and because it is arithmetic a reader can check without re-deriving the K-value shift."
[outputs.min_t_over_tc]
unit = "dimensionless"
description = "the smallest `T / Tc_i` over the components at the answer - how close the mixture is to the nearest component's critical point."
[outputs.iterations]
unit = "dimensionless"
description = "temperature updates taken, including the final evaluation of the converged state."
[outputs.residual]
unit = "dimensionless"
description = "`|sum_i y_i / K_i - 1|` at the last completed step, with the shifted K-values."
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[[valid_range]]
quantity = "pore_radius"
min = 0.0
min_inclusive = false
severity = "error"
rationale = "The radius divides the Young-Laplace pressure, so a zero one is an infinite shift rather than a wide pore; a wide pore is a large radius."
[[valid_range]]
quantity = "surface_tension"
min = 0.0
min_inclusive = true
severity = "error"
rationale = "A negative surface tension would put the liquid below the vapour and move the dew point down, which is not a state a pore produces. Zero is allowed and is the flat interface."
[[valid_range]]
quantity = "min_t_over_tc"
max = 0.9
max_inclusive = true
severity = "warning"
rationale = "Above `T / Tc = 0.9` for every component the cubic's roots are close to coalescing and the two phases stop being distinguishable, so a dew point near the critical point is the one to distrust."
[implementations]
python = "azoth.eos.capillary_dew_point"
rust = "azoth_eos::capillary_dew_point"
