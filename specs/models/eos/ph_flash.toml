id = "eos.ph_flash"
name = "Pressure-enthalpy flash"
kind = "procedure"
references = [
    "Michelsen, M. L.; Mollerup, J. M. (2004). \"Thermodynamic Models: Fundamentals and Computational Aspects.\" Tie-Line Publications.",
    "Smith, J. M.; Van Ness, H. C.; Abbott, M. M. \"Introduction to Chemical Engineering Thermodynamics.\"",
]
assumptions = [
    "the iteration is quasi-Newton in `1/T` from `initial_temperature`, not a scan: the residual is `(H - H_target)/|H_target|` and every step is clamped to ten kelvin.",
    "a trial temperature the inner flash cannot settle is backed off, not fatal: the gap is halved back towards the last temperature that worked, up to fifteen times.",
    "the starting temperature is declared in the spec, where upstream reads one off its thermodynamic system.",
    "the flash at each trial temperature is converged, not exact: the enthalpy inverted is that of a converged approximation.",
    "no check that the feed is stable: the model asks where the energy balance is satisfied, not whether the state found is the equilibrium one.",
    "**the enthalpy is a difference from a supplied datum.** It is not an absolute quantity and is not comparable with a value computed from a different reference state.",
    "NeqSim carries a second H-flash scheme, `SysNewtonRhapsonPHflash`, which its `ThrottlingValve` and `Compressor` select. It is not ported: its Jacobian sets `dH/dT = Cp`, which this library measures to be wrong across a phase boundary, and it converges no faster where this scheme is fast.",
]
[source]
standard = "Standard thermodynamics, as in Smith, Van Ness & Abbott; Michelsen & Mollerup"
edition = "The procedure is the ordinary one: the enthalpy of a mixture at fixed pressure is a strictly increasing function of temperature."
[algorithm]
scheme = "ph_flash_inverse_temperature_newton"
convergence = "relative"
tolerance = 1e-08
max_iterations = 200
initial_temperature = 300.0
[algorithm.inner]
scheme = "successive_substitution_flash"
initialisation = "wilson"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 300
[algorithm.inner.inner]
scheme = "rachford_rice_bisection"
convergence = "absolute"
tolerance = 1e-14
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank (`data/components/`, from NeqSim's COMP.csv and INTER.csv) with the keycard's overrides applied"
[inputs.P]
unit = "Pa"
description = "absolute pressure. Held fixed; the temperature is what is solved for."
[inputs.H]
unit = "J/mol"
description = "the molar enthalpy the mixture is to reach, as a difference from the datum above; it may be negative."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed's mole fractions. Checked rather than renormalised."
[outputs]
[outputs.T]
unit = "K"
description = "the temperature that satisfies the enthalpy. This is the answer."
[outputs.beta]
unit = "dimensionless"
description = """\
    the vapour fraction at that temperature. Absent for a single-phase feed, where the flash \
    reports an extrapolated split rather than a physical one - see the notes.\n\
    """
[outputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "liquid-phase mole fractions at the answer"
[outputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "vapour-phase mole fractions at the answer"
[outputs.k]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "`K_i = y_i / x_i` at the answer, reported because the flash is one"
[outputs.phase]
type = "enum"
values = ["all_liquid", "two_phase", "all_vapour"]
description = "which phase the feed is in at the answer"
[outputs.z_liquid]
unit = "dimensionless"
description = "the liquid root of the cubic at the answer"
[outputs.z_vapour]
unit = "dimensionless"
description = "the vapour root"
[outputs.iterations]
unit = "dimensionless"
description = "Newton iterations taken"
[outputs.residual]
unit = "dimensionless"
description = "`(H(T) - H_target) / |H_target|` at the answer, signed"
[[valid_range]]
quantity = "P"
min = 0.0
min_inclusive = false
severity = "error"
rationale = """\
    an absolute pressure; zero and below are not states, and the cubic's reduced variables \
    divide by it.\n\
    """
[implementations]
python = "azoth.eos.ph_flash"
rust = "azoth_eos::ph_flash"
