id = "eos.thermal_conductivity"
name = "Liquid thermal conductivity from the Pedersen (PFCT) correlation"
kind = "direct"
assumptions = [
    "the correlation is NeqSim's liquid default (`PFCTConductivityMethodMod86`): a methane SRK reference flash, a Tc/Pc/molar-mass mixing rule, the dilute-gas methane viscosity, the ideal-gas heat capacity, the reference-conductivity correlation and a corresponding-states scaling.",
    "the reference is pure methane solved with the SRK equation of state; the mixture's own cubic and alpha are not consulted.",
    "a component's `Tc`, `Pc`, `omega`, every `kij`, its molar mass and its heat-capacity coefficients come from the databank with the keycard's overrides applied.",
    "this is a liquid-phase correlation; the gas thermal conductivity is `eos.chung_conductivity` / `eos.mason_saxena_conductivity`.",
]
references = [
    "Friend, D. G.; Ely, J. F.; Ingham, H. (1989). \"Thermophysical properties of methane.\" J. Phys. Chem. Ref. Data 18(2), 583-638. DOI 10.1063/1.555828.",
    "Pedersen, K. S.; Fredenslund, A.; Christensen, P. L.; Thomassen, P. (1984). \"Viscosity of crude oils.\" Chem. Eng. Sci. 39(6), 1011-1016. DOI 10.1016/0009-2509(84)87009-8.",
]
[source]
standard = "NeqSim master `PFCTConductivityMethodMod86`"
edition = "`calcConductivity` and `getRefComponentConductivity`, ported verbatim"
doi = "10.1063/1.555828"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank with the keycard's overrides applied"
[inputs.T]
unit = "K"
description = "absolute temperature of the state"
[inputs.P]
unit = "Pa"
description = "absolute pressure of the state"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the mixture's mole fractions, checked rather than renormalised"
[outputs]
[outputs.k]
unit = "W/(m*K)"
description = "the liquid thermal conductivity"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[implementations]
python = "azoth.eos.thermal_conductivity"
rust = "azoth_eos::thermal_conductivity"
