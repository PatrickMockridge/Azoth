id = "eos.vh_flash"
name = "Volume-enthalpy flash"
kind = "procedure"
assumptions = [
    "The decoupled 2x2 Newton of `eos.vu_flash`, with the energy target supplied whole instead of assembled. NeqSim's reachable V,H class is `VHflashQfunc`, which uses a *coupled* 2x2 with a cross term instead; that is not ported, and the assumption below records what was measured.",
    "the answer is accepted on a 1e-3 relative volume and energy error, NeqSim's own acceptance and looser than the iteration's - so an iterate the loop never settled at can pass it, and carries a `SOLVER_NOT_CONVERGED` warning saying so.",
    "a trial state the inner flash cannot settle is backed off, not fatal: the damping is reduced.",
    "the flash at each trial state is converged, not exact: the volume and enthalpy inverted are those of a converged approximation.",
    "no check that the feed is stable: the model asks where the volume and enthalpy are satisfied, not whether the state found is the equilibrium one.",
    "NeqSim's reachable V,H class is `VHflashQfunc`, which adds a cross term to the 2x2. Ported faithfully it does not converge here, and NeqSim's own copy reports 23.5 bar and 290 K for the 330 K, 25 bar state. `VHflash` has no construction site and is not ported.",
]
references = [
    "Michelsen, M. L.; Mollerup, J. M. (2004). Thermodynamic Models: Fundamentals and Computational Aspects. Tie-Line Publications.",
]
[source]
standard = "Standard thermodynamics, as in Michelsen & Mollerup"
edition = "NeqSim master `thermodynamicoperations/flashops/VHflashQfunc`, whose Q-function quartet is `OptimizedVUflash`'s with `Hspec` in place of `Uspec + P Vspec`."
[algorithm]
scheme = "vh_flash_newton_2x2"
convergence = "relative"
tolerance = 1e-08
max_iterations = 100
initial_temperature = 300.0
[algorithm.inner]
scheme = "successive_substitution_flash"
initialisation = "wilson"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 300
[algorithm.inner.inner]
scheme = "rachford_rice_bisection"
convergence = "absolute"
tolerance = 1e-14
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank (`data/components/`, from NeqSim's COMP.csv and INTER.csv) with the keycard's overrides applied"
[inputs.V]
unit = "m**3/mol"
description = "the one-mole-basis molar volume the state is held at"
[inputs.H]
unit = "J/mol"
description = "the one-mole-basis molar enthalpy. A *difference* from the datum the ideal-gas model carries, not an absolute quantity."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "overall mole fractions"
[outputs]
[outputs.P]
unit = "Pa"
description = "the pressure that satisfies the volume and enthalpy"
[outputs.T]
unit = "K"
description = "the temperature that satisfies the volume and enthalpy"
[outputs.beta]
unit = "dimensionless"
optional = true
description = "the vapour fraction at the answer, or absent for a single-phase feed"
[outputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "liquid-phase mole fractions at the answer"
[outputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "vapour-phase mole fractions at the answer"
[outputs.k]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "`K_i = y_i / x_i` at the answer"
[outputs.phase]
type = "enum"
values = ["two_phase", "all_liquid", "all_vapour", "trivial"]
description = "which phase the feed is in at the answer"
[outputs.z_liquid]
unit = "dimensionless"
description = "the liquid root of the cubic at the answer"
[outputs.z_vapour]
unit = "dimensionless"
description = "the vapour root at the answer"
[outputs.iterations]
unit = "dimensionless"
description = "Newton steps taken, including the final evaluation"
[outputs.residual]
unit = "dimensionless"
description = "the larger of the relative volume and enthalpy residuals at the answer"
[[valid_range]]
quantity = "V"
min = 0
min_inclusive = false
severity = "error"
rationale = "a molar volume; zero and below are not states"
[implementations]
python = "azoth.eos.vh_flash"
rust = "azoth_eos::vh_flash"
