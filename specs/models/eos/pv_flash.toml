id = "eos.pv_flash"
name = "Pressure-volume flash"
kind = "procedure"
references = [
    "Michelsen, M. L.; Mollerup, J. M. (2004). \"Thermodynamic Models: Fundamentals and Computational Aspects.\" Tie-Line Publications.",
]
assumptions = [
    "**the tolerance above is a floor**: the solver accepts a residual under `max(1e-08, |V_spec| * 1e-9)`. The relative term is upstream's `|V - Vspec|/Vspec < 1e-9`, and it is not slack - an absolute `1e-08` on a volume of `1e-3 m**3/mol` is `1e-05` relative.",
    "the iteration is quasi-Newton in temperature from `initial_temperature`, with a central-difference `dV/dT` slope; every step is clamped to ten kelvin.",
    "a trial temperature the inner flash cannot settle is backed off, not fatal: the gap is halved back towards the last temperature that worked.",
    "the flash at each trial temperature is converged, not exact: the volume inverted is that of a converged approximation.",
    "no check that the feed is stable: the model asks where the volume is satisfied, not whether the state found is the equilibrium one.",
    "the volume solver stops on `max(tolerance, |V_target| * 1e-9)`, so its stop is **not purely absolute** as `convergence` alone would say. The relative half is upstream's `PVflash` test `|V - V_spec|/V_spec < 1e-9`, kept because a molar volume spans orders of magnitude.",
]
[source]
standard = "Standard thermodynamics, as in Michelsen & Mollerup"
edition = "The procedure is the ordinary one: the molar volume of a mixture at fixed pressure is a strictly increasing function of temperature."
[algorithm]
scheme = "pv_flash_inverse_temperature_newton"
convergence = "absolute"
tolerance = 1e-08
max_iterations = 200
initial_temperature = 300.0
[algorithm.inner]
scheme = "successive_substitution_flash"
initialisation = "wilson"
convergence = "absolute"
tolerance = 1e-10
max_iterations = 300
[algorithm.inner.inner]
scheme = "rachford_rice_bisection"
convergence = "absolute"
tolerance = 1e-14
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank (`data/components/`, from NeqSim's COMP.csv and INTER.csv) with the keycard's overrides applied"
[inputs.P]
unit = "Pa"
description = "absolute pressure. Held fixed; the temperature is what is solved for."
[inputs.V]
unit = "m**3/mol"
description = "the molar volume the mixture is to reach, on a one-mole basis."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed's mole fractions. Checked rather than renormalised."
[outputs]
[outputs.T]
unit = "K"
description = "the temperature that satisfies the volume. This is the answer."
[outputs.beta]
unit = "dimensionless"
description = "the vapour fraction at that temperature. Absent for a single-phase feed."
[outputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "liquid-phase mole fractions at the answer"
[outputs.y]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "vapour-phase mole fractions at the answer"
[outputs.k]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "`K_i = y_i / x_i` at the answer"
[outputs.phase]
type = "enum"
values = ["all_liquid", "two_phase", "all_vapour"]
description = "which phase the feed is in at the answer"
[outputs.z_liquid]
unit = "dimensionless"
description = "the liquid root of the cubic at the answer"
[outputs.z_vapour]
unit = "dimensionless"
description = "the vapour root"
[outputs.iterations]
unit = "dimensionless"
description = "Newton iterations taken"
[outputs.residual]
unit = "dimensionless"
description = "`V(T) - V_target` at the answer, signed"
[[valid_range]]
quantity = "P"
min = 0.0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[[valid_range]]
quantity = "V"
min = 0.0
min_inclusive = false
severity = "error"
rationale = "a molar volume; zero and below are not states"
[implementations]
python = "azoth.eos.pv_flash"
rust = "azoth_eos::pv_flash"
