id = "eos.hydrate_inhibitor_concentration"
name = "Hydrate inhibitor concentration"
kind = "procedure"
assumptions = [
    "**a secant on the inhibitor's moles**, whose residual is `T_hydrate - T_target`: each trial adds inhibitor to the feed and asks what the hydrate temperature is now.",
    "**the feed is stated in moles, not as a composition.** The secant walks an *absolute* amount - the first three steps are `error * 0.01` moles and the rest are `-error / dError/dC * 0.5` moles - so a normalised feed would reproduce the equation and not the path, and stop somewhere else.",
    "**the first three steps run whatever the residual is**, and the loop's condition is `(|error| > 1e-3 && iter < 100) || iter < 3`, so three iterations always happen and the count is a floor rather than a result.",
    "the first step's secant derivative is `0/0` - both amounts are the feed's - so it is `NaN` and the three steps that never read it are why that is harmless rather than a defect.",
    "the inner equilibrium is `eos.hydrate_formation_temperature`, so every one of its assumptions and its divergence hold here too: this is a hydrate curve read for a concentration rather than a temperature.",
    "**an associating mixture and a classical one do not agree, and this library can flash neither associating water nor MEG.** The equilibrium is on water's fugacity: NeqSim's CPA fluid reaches the same target with `0.326` mol of MEG where a plain cubic needs `1.663`.",
    "the inhibitor is a component of the feed, and the answer is that component's moles *including* the amount it started with - NeqSim's own entry point reads the system's inventory back.",
    "the dosing fraction is a mass fraction of the inhibitor and the water alone, which is what a field dosing figure means: the hydrocarbons are not in its denominator.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `HydrateInhibitorConcentrationFlash` is the port source.",
    "Sloan, E. D.; Koh, C. A. (2008). \"Clathrate Hydrates of Natural Gases.\", 3rd ed., CRC Press. The inhibitor dosing correlation is its own chapter, and this is the operation around it rather than the correlation.",
]
[source]
standard = "NeqSim master `HydrateInhibitorConcentrationFlash`"
edition = "The secant and its two branches, over this library's own hydrate formation temperature. NeqSim's inner call takes a starting-temperature guess this ignores, as `eos.hydrate_equilibrium_line` ignores its own seeding - measured inert in both."
[algorithm]
scheme = "inhibitor_moles_secant"
initialisation = "feed_inventory"
convergence = "absolute"
tolerance = 1e-03
max_iterations = 100
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the fluid is made of, by name. At least one must be water, and the inhibitor must be one of them."
[inputs.moles]
type = "vector"
unit = "mol"
length = "one per component"
description = "the feed's component mole numbers. The secant adds to the inhibitor's entry, so the absolute scale is what the answer is on."
[inputs.inhibitor]
type = "string"
description = "which component is the inhibitor, by name - `MEG`, `methanol` or whatever the feed carries. It must be one of `components`."
[inputs.T_target]
unit = "K"
description = "the hydrate temperature the dosing is to hold the fluid down to."
[inputs.P]
unit = "Pa"
description = "absolute pressure at which the hydrate temperature is evaluated."
[inputs.eos]
type = "enum"
values = ["pr", "srk", "rk"]
description = "the cubic the fluid runs, as for `eos.hydrate_formation_temperature`."
[inputs.hydrate_model]
type = "enum"
values = ["pvtsim", "guo_finch"]
optional = true
description = "which of NeqSim's two fitted component models fills the cages, as for the formation temperature."
[outputs]
[outputs.inhibitor_moles]
unit = "mol"
description = "the inhibitor's moles at the answer, the feed's own included."
[outputs.weight_fraction]
unit = "dimensionless"
description = "the inhibitor's mass fraction of the inhibitor-and-water pair, which is what a dosing figure reports."
[outputs.hydrate_temperature]
unit = "K"
description = "the hydrate temperature the answer's composition gives, which should be the target to the tolerance."
[outputs.iterations]
unit = "dimensionless"
description = "secant steps taken, with a floor of three."
[outputs.residual]
unit = "K"
description = "`T_hydrate - T_target` at the answer."
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[[valid_range]]
quantity = "T_target"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; the answer is a composition whose hydrate forms there"
[[valid_range]]
quantity = "weight_fraction"
min = 0
max = 1
min_inclusive = true
max_inclusive = true
severity = "error"
rationale = "a mass fraction of two things"
[implementations]
python = "azoth.eos.hydrate_inhibitor_concentration"
rust = "azoth_eos::hydrate_inhibitor_concentration"
