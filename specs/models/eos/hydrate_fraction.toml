id = "eos.hydrate_fraction"
name = "Hydrate fraction"
kind = "procedure"
assumptions = [
    "**this is NeqSim's `TPHydrateFlash` computing the same quantity, and it does not return the same state.** The divergence is deliberate, measured, and recorded upstream, and the state is the difference: its phases hold `+0.0874` water and `-0.0734` methane against the feed.",
    "**one wrong composition explains all three symptoms.** NeqSim's hydrate gets water `46/54` and its guests from cavity 0 alone, so its fractions sum to `1.1201`, its state is out by `0.0874` water, and its bound is a constant - which is why its fraction does not move with the temperature.",
    "**the objective never crosses zero below the formation temperature, so the answer is the bound.** Measured at 288.15 K and 100 bara it runs from `-0.071993842` at zero to `-0.069796728` at a trace - the aqueous phase pins water's fugacity - and reaches `+inf` where the last water leaves.",
    "so this solves the **material balance as the bound and the equality as its check**: the fraction is `min_i z_i/w_i` from the cages' own composition, and the equality at the feed decides whether the answer is zero instead.",
    "**the answer jumps**, and that is the equilibrium rather than a tolerance: a hydrate stable at one fraction is stable at every fraction up to the bound, so the fraction goes from zero above the formation temperature to the whole of the water below it.",
    "**what decides zero is the objective at the feed**, which is monotone in the fraction and is what `eos.hydrate_formation_temperature` drives to zero - the two cross it together, measured at `-0.003202` for 293 K and `+0.010844` for 294 K against `293.2277` K.",
    "**the trial the cages are filled from is the water-free fluid**, `f_i = z_i - beta w_i` with a component the hydrate has taken all of at zero - the state at the bound rather than one near it, and why the solve never flashes a trace of water.",
    "**the hydrate's composition is the cages' own**, from both cavity types of the stable structure weighted by each type's count per unit cell - not from one cavity, which is where NeqSim's composition comes from and why its fractions sum to `1.1201`.",
    "the guests' fugacities come from the vapour phase of the flashed fluid, which is what NeqSim's `setFug` reads.",
    "the reference water phase is a one-component phase of the same cubic the fluid runs, as in `eos.hydrate_formation_temperature`.",
    "no inhibitor and no energy balance, as for the formation temperature.",
]
references = [
    "van der Waals, J. H.; Platteeuw, J. C. (1959). \"Clathrate Solutions.\" Advances in Chemical Physics 2(1), 1-57. DOI 10.1002/9780470143483.ch1.",
    "Sloan, E. D.; Koh, C. A. (2008). \"Clathrate Hydrates of Natural Gases.\", 3rd ed., CRC Press.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `TPHydrateFlash` and `ComponentHydratePVTsim` are the port source; the divergence is recorded there and in this spec's first assumption.",
]
[source]
standard = "NeqSim 3.20.0 `TPHydrateFlash`, with the composition and the bound corrected"
edition = "The same quantity from a solve that closes: the fraction on the fugacity equality with the hydrate's composition taken from both cavities, and the material balance asserted at the answer rather than left to the caller."
[algorithm]
scheme = "hydrate_bound_fixed_point"
initialisation = "feed_fluid"
convergence = "absolute"
tolerance = 1e-12
max_iterations = 40
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the fluid is made of, by name. At least one must be water and one a hydrate former."
[inputs.T]
unit = "K"
description = "absolute temperature. It must be below the formation temperature at this pressure, or the answer is zero."
[inputs.P]
unit = "Pa"
description = "absolute pressure"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the overall mole fractions, checked rather than renormalised."
[inputs.eos]
type = "enum"
values = ["pr", "srk", "rk"]
description = "the cubic the fluid runs, which is also the equation the hydrate's reference water phase is built from."
[outputs]
[outputs.beta]
unit = "dimensionless"
description = "the fraction of the feed's moles that is hydrate, on the feed's own basis."
[outputs.structure]
type = "enum"
values = ["structure_i", "structure_ii"]
description = "the stable structure, from the same comparison of the two coefficients that `eos.hydrate_formation_temperature` makes."
[outputs.balance_error]
unit = "dimensionless"
description = "The largest `|sum_p beta_p x_ip - z_i|` over the components at the answer, which is the invariant this model exists to keep: NeqSim's is `0.0874` at the states its own probe drives."
[outputs.iterations]
unit = "dimensionless"
description = "flash evaluations taken, counting the feed's, the fixed point's and the answer's own."
[outputs.residual]
unit = "dimensionless"
description = "`ln(f_w^hydrate/f_w^fluid)` at the **feed**, which is what decides between no hydrate and all of the water and is the quantity `eos.hydrate_formation_temperature` drives to zero. It is not read at the answer: the fluid there holds no water, so the ratio has no finite value at it."
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states, and the dielectric polynomial is not involved here but the flash is"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[implementations]
python = "azoth.eos.hydrate_fraction"
rust = "azoth_eos::hydrate_fraction"
