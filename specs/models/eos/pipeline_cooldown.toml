id = "eos.pipeline_cooldown"
name = "Lumped pipeline cooldown after shutdown"
kind = "direct"
assumptions = [
    "**the march is explicit Euler on one lumped thermal mass**: the fluid, steel and insulation conductances are one capacity losing heat to the ambient through the layers, as the class writes it.\n",
    "**the mass per unit length is `rho cp pi (r_outer^2 - r_inner^2)` per layer**: the fluid's bore, the steel's annulus and the insulation's annulus; the class's steel conductivity 50, insulation density 600 and insulation cp 1700 have no setters and stay constants.\n",
    "**the U value is supplied or layer-derived**: absent takes the class's 3.0 W/(m2 K); `use_layer_calculation` takes the steel, insulation and external-convection sum at the outside radius, with the coefficient's 300 W/(m2 K) default.\n",
    "**the coating enters through its radius and not its resistance**, which is the class's own layer sum: the outer area is larger and no term is added for the coating.\n",
    "**the step count is `ceil(total_time / step)`**, so the last time can pass the horizon; the class's arrays are that long and the cases pin the overshoot.\n",
    "**the time constant is `mass cp / conductance`**, the same branch the march takes, and the target crossing is linearly interpolated between nodes, zero at the first node and absent when none crosses.\n",
    "the class's wall-temperature array is private, has no getter and is never exported: the lumped wall is the fluid, and there is no wall output to pin.\n",
]
references = [
    "NeqSim master, `pvtsimulation/flowassurance/PipelineCooldownCalculator.java`, Apache-2.0, commit f0c7436c6923766b1e22957b7075f650600457a7.",
    "`validation/neqsim/captures/flow_assurance_remainder_probe.tsv` - the thirteen states: the default U and its half and double, the layer value insulated, bare and at a higher external coefficient, the ceil-step overshoot, both target outcomes, a heat-up, non-default steel and a thick coating.",
]
[source]
standard = "NeqSim master `PipelineCooldownCalculator`"
edition = "`calculate`, `getTimeHours`, `getFluidTemperature`, `getTimeConstantHours`, `getCalculatedUValue` and `getTimeToReachTemperature`. `getTemperatureAtTime` is a linear interpolation of the returned arrays, and the Gson report is a composition."
[inputs]
[inputs.internal_diameter]
unit = "m"
description = "the pipe's internal diameter.\n"
[inputs.wall_thickness]
unit = "m"
description = "the steel wall thickness.\n"
[inputs.insulation_thickness]
unit = "m"
description = "the insulation thickness, zero for a bare pipe.\n"
[inputs.coating_thickness]
unit = "m"
description = "the external coating thickness.\n"
[inputs.steel_density]
unit = "kg/m**3"
description = "the steel's density.\n"
[inputs.steel_specific_heat]
unit = "J/(kg*K)"
description = "the steel's specific heat capacity.\n"
[inputs.insulation_conductivity]
unit = "W/(m*K)"
description = "the insulation's thermal conductivity, which the U value is computed from.\n"
[inputs.fluid_density]
unit = "kg/m**3"
description = "the fluid's density at the operating point.\n"
[inputs.fluid_specific_heat]
unit = "J/(kg*K)"
description = "the fluid's specific heat capacity at the operating point.\n"
[inputs.initial_fluid_temperature]
unit = "K"
description = "the fluid temperature at shutdown.\n"
[inputs.ambient_temperature]
unit = "K"
description = "the seawater or soil temperature.\n"
[inputs.time_step]
unit = "s"
description = "the explicit-Euler step.\n"
[inputs.total_time]
unit = "s"
description = "the simulation horizon.\n"
[inputs.overall_u_value]
unit = "W/(m**2*K)"
optional = true
description = "the supplied overall U value, referenced to the outside diameter; absent takes 3.0.\n"
[inputs.use_layer_calculation]
type = "boolean"
optional = true
description = "whether the U value is computed from the layer resistances rather than supplied; absent is false.\n"
[inputs.external_htc]
unit = "W/(m**2*K)"
optional = true
description = "the external convection coefficient for the layer calculation; absent takes 300.\n"
[inputs.target_temperature]
unit = "K"
optional = true
description = "a temperature whose crossing time is wanted; absent means no interpolation is asked for.\n"
[outputs]
[outputs.time]
type = "vector"
unit = "s"
description = "the time at each march step, the first at zero.\n"
[outputs.fluid_temperature]
type = "vector"
unit = "K"
description = "the lumped fluid-and-steel temperature at each step.\n"
[outputs.time_constant]
unit = "s"
description = "the thermal mass over the per-length conductance.\n"
[outputs.calculated_u_value]
unit = "W/(m**2*K)"
description = "the layer-resistance U value, which the class's getter always recomputes.\n"
[outputs.effective_u_value]
unit = "W/(m**2*K)"
description = "the U value the march ran with: the supplied one, or the layer value.\n"
[outputs.time_to_reach_target]
unit = "s"
optional = true
description = "the interpolated crossing of the target temperature, absent when not reached.\n"
