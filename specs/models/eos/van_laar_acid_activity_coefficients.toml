id = "eos.van_laar_acid_activity_coefficients"
name = "Activity coefficients from the Van Laar model for the water-nitric-sulfuric acid system"
kind = "direct"
assumptions = [
    "this is NeqSim's `ComponentGEVanLaarAcid`, the acid-specific Van Laar model of Taleb, Ponche and Mirabel (1996). NeqSim 3.20.0 has no classical fitted-`A12`/`A21` Van Laar.\n",
    "the three species are water, nitric acid and sulfuric acid, in that order, and they are evaluated on their own mole-fraction basis: only those three fractions in `x` enter the ternary expression, so a dissolved carrier gas does not.\n",
    "that basis is renormalised to sum to one, which is the form of the port source and does not move the answer: each expression is homogeneous of degree zero in the three fractions, so any scaling of them returns the same activity coefficient.\n",
    "a component outside the three gets a `gamma` of `1.0e12` rather than a refusal. That is NeqSim's `NON_MODELED_COMPONENT_PENALTY` reproduced: a device for pushing an uncovered species out of the liquid phase, not a physical activity coefficient, so the `ln_gamma` beside it is finite but meaningless.\n",
    "a mixture with no acid at all is evaluated on pure water, which is what NeqSim's `acidMoleFractions` returns for an empty basis.\n",
    "every logarithm in the model is base-10, and `T` is in Kelvin throughout; the source is valid from about 190 K to 298 K, and a temperature outside that is reported as a warning rather than refused.\n",
    "only the activity coefficient is ported. NeqSim pairs it with `pureVaporPressure*` and a `fugcoef` override that forces the Raoult reference, which is a phase-level operation and belongs to the gamma-phi phase that does not exist yet.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Taleb, D.; Ponche, J. L.; Mirabel, P. (1996). \"Vapor pressures in the ternary system water-nitric acid-sulfuric acid at low temperature.\" Journal of Geophysical Research 101(D20), 25967-25977.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ComponentGEVanLaarAcid` and `NitricSulfuricAcidVaporPressure` are the port source; the latter documents an engineering adjustment to its pure-HNO3 vapour pressure coefficients, which is not ported because the vapour pressure is not.\n",
]
[source]
standard = "Taleb, D.; Ponche, J. L.; Mirabel, P. (1996)"
edition = "Journal of Geophysical Research 101(D20), 25967-25977"
doi = "10.1029/96JD02155"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name; water, nitric acid and sulfuric acid (`hno3`, `h2so4`) are the three the model covers, and any other name is a species it does not\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of the activity coefficient of each component\n"
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the activity coefficient of each component\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[[valid_range]]
quantity = "T"
min = 190.0
max = 298.0
severity = "warning"
rationale = "the Taleb correlation is fitted from 190 K to 298 K; outside it the model extrapolates.\n"
[implementations]
python = "azoth.eos.van_laar_acid_activity_coefficients"
rust = "azoth_eos::van_laar_acid_activity_coefficients"
