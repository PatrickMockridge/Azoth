id = "eos.pt_phase_envelope"
name = "PT phase envelope"
kind = "procedure"
assumptions = [
    "A component's `Tc`, `Pc`, `omega` and every `kij` come from the databank (`data/components/`, from NeqSim's `COMP.csv` and `INTER.csv`) with the keycard's overrides applied.",
    "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes, and the mixture fugacity coefficient is the one `eos.pt_flash` uses.",
    "the bubble and dew branches are traced separately, each at a fixed, tiny vapour fraction - near zero and near one - bootstrapped at the low pressure and continued upward until every K-value has nearly collapsed to one.",
    "**the critical point is computed, not refined out of the trace.** It is `eos.critical_point`'s Heidemann-Khalil construction on the feed: at an isopleth's critical point the two phases carry the feed's composition. Newtoning `sum (ln K)^2 = 0` from the trace does not work.",
    "a branch stops where the lightest K-value falls below 1.05 and the heaviest's rises above 0.95. That window is a heuristic and a coarse step can jump it, so a branch may stop a kelvin or two past the critical point.",
    "each branch stops at the critical region rather than continuing *through* the critical point onto the other branch as NeqSim does, so the two traces are independent and `residual` reports the bracket they put around the critical point.",
    "the next point is predicted by a cubic through the last four converged points and the step size is clamped to at most 10 K and 10 bar per point.",
    "the envelope is for mixtures; a single component's envelope is its vapour-pressure curve, which `eos.pure_saturation` computes.",
    "no energy balance. The envelope is a phase-equilibrium locus, not a statement about how a stream got there.",
]
references = [
    "Michelsen, M. L. (1980). \"Calculation of phase envelopes and critical points for multicomponent mixtures.\" Fluid Phase Equilibria 4(1-2), 1-10. DOI 10.1016/0378-3812(80)80001-8.",
    "Heidemann, R. A.; Khalil, A. M. (1980). \"The calculation of critical points.\" AIChE Journal 26(5), 769-779. DOI 10.1002/aic.690260510.",
]
[source]
standard = "Michelsen, M. L. (1980), with `eos.critical_point` for the critical point"
edition = "The trace is Michelsen's natural-parameter continuation; the critical point is Heidemann & Khalil's construction, on the feed composition."
doi = "10.1016/0378-3812(80)80001-8"
[algorithm]
scheme = "phase_envelope_continuation"
initialisation = "wilson"
convergence = "absolute"
tolerance = 5e-02
max_iterations = 9980
[algorithm.inner]
scheme = "natural_parameter_newton"
convergence = "absolute"
tolerance = 1e-05
max_iterations = 50
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against the component databank (`data/components/`, from NeqSim's COMP.csv and INTER.csv) with the keycard's overrides applied"
[inputs.P]
unit = "Pa"
description = "the low pressure the trace starts from. The envelope is traced upward from here; the starting bubble and dew points are this pressure's saturation temperatures."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the overall composition the envelope is traced for. Checked rather than renormalised."
[outputs]
[outputs.dew_temperature]
type = "vector"
unit = "K"
length = "one entry per traced dew point"
description = "the dew-point temperatures along the envelope, in trace order"
[outputs.dew_pressure]
type = "vector"
unit = "Pa"
length = "one entry per traced dew point"
description = "the dew-point pressures along the envelope, in trace order"
[outputs.bubble_temperature]
type = "vector"
unit = "K"
length = "one entry per traced bubble point"
description = "the bubble-point temperatures along the envelope, in trace order"
[outputs.bubble_pressure]
type = "vector"
unit = "Pa"
length = "one entry per traced bubble point"
description = "the bubble-point pressures along the envelope, in trace order"
[outputs.cricondenbar_temperature]
unit = "K"
description = """\
    the temperature at the cricondenbar, the highest pressure on the envelope. **The least \
    well-determined output here**: it is a *maximum*, so `dP/dT = 0` there and many temperatures \
    carry almost the same pressure. NeqSim gives `344.99 K`, this `338.17 K`, the pressures `0.08 \
    bar` apart."""
[outputs.cricondenbar_pressure]
unit = "Pa"
description = "the cricondenbar, the highest pressure on the envelope"
[outputs.cricondentherm_temperature]
unit = "K"
description = "the cricondentherm, the highest temperature on the envelope"
[outputs.cricondentherm_pressure]
unit = "Pa"
description = "the pressure at the cricondentherm"
[outputs.critical_temperature]
unit = "K"
description = "the critical temperature, from `eos.critical_point` on the feed. On the validated case it is `0.21 K` from NeqSim's `374.3214 K`."
[outputs.critical_pressure]
unit = "Pa"
description = "the critical pressure, from the same construction"
[outputs.iterations]
unit = "dimensionless"
description = "the number of continuation points traced"
[outputs.residual]
unit = "K"
description = """\
    the gap between where the two branches stopped. They approach the critical point from opposite \
    sides, so it is the width of the bracket they put around it - the trace's own statement that it \
    reached the critical point. `NaN` when a branch ran into the pressure ceiling instead."""
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[[valid_range]]
quantity = "critical_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "the critical pressure is a positive pressure, or the trace never reached the critical point"
[implementations]
python = "azoth.eos.pt_phase_envelope"
rust = "azoth_eos::pt_phase_envelope"
