description = "siderite's index.\n"
[outputs.worst_case_percent]
unit = "dimensionless"
optional = true
description = "the percentage whose worst index is the largest; absent where no mixture defines one.\n"
[outputs.worst_case_scale]
type = "string"
optional = true
description = "the mineral that produced it.\n"
[outputs.worst_case_saturation_index]
unit = "dimensionless"
optional = true
description = "the index itself.\n"
