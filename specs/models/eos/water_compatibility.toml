description = "the injection water's share this row was evaluated at.\n"
[outputs.mixtures.fields.si_caco3]
unit = "dimensionless"
optional = true
description = "calcite's index.\n"
[outputs.mixtures.fields.si_baso4]
unit = "dimensionless"
