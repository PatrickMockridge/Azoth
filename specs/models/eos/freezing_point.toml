id = "eos.freezing_point"
name = "Freezing-point temperature"
kind = "procedure"
assumptions = [
    "**two solid routes, chosen by the candidate's name.** `para-hydrogen` takes the calibrated Helmholtz solid below, and every other substance the tabulated one - `ComponentSolid.fugcoef2` over the databank's melting point, heat of fusion, heat capacities and densities.",
    "**the tabulated residual is the multiphase appearance condition**, `ln z_k - ln(sum_p beta_p phi_solid_k / phi_kp)` over the phases the flash found. The largest logarithm is taken out before exponentiating because the terms span twenty orders of magnitude and a direct sum underflows.",
    "**methane never freezes.** `ComponentSolid.fugcoef` returns `1e30` for it before any arithmetic, so a methane candidate's residual has no sign change and the search refuses rather than reporting its triple point of `90.69` K - which is what the tabulated route would otherwise solve to.",
    "**the highest freezing point of the candidates is the answer.** NeqSim loops every component its caller enabled a solid check for and keeps the maximum, because a fluid freezes at the temperature of whichever substance freezes first.",
    "the fluid is the para-Leachman reference equation, and **which of its roots** is NeqSim's own rule: a gas below the triple-point pressure and a liquid at and above it. The two are different states at the same temperature and pressure.",
    "**the solid is calibrated, not raw.** `eos.parahydrogen_solid_phase` is the thesis equation as it stands; NeqSim's `SystemLeachmanEos` shifts it to the liquid at the triple point. Unshifted it misses the triple point's own definition - the two Gibbs energies equal there - by `3.12` J/mol.",
    "the calibration's constants are computed here from the two models and are not tunables: NeqSim derives them at first use, so a port that hardcoded them would report a number whose provenance nothing holds.",
    "the residual is `(g_fluid - g_solid)/(R T)`, dimensionless, with NeqSim's `R = 8.3144621` - not the Leachman equation's own `8.31451` nor the solid's, both of which are rounded values of their own era.",
    "the answer is a property of the substance and the pressure, so the starting temperature is a search path and not a state; the spec states it in `[algorithm]` rather than as an input, where NeqSim takes it from the system it is given.",
    "no `h_res` or `s_res`: the operation reports a temperature, and the phases it passed through are the caller's to evaluate.",
]
references = [
    "Leachman, J. W.; Jacobsen, R. T.; Penoncello, S. G.; Lemmon, E. W. (2009). \"Fundamental Equations of State for Parahydrogen, Normal Hydrogen, and Orthohydrogen.\" Journal of Physical and Chemical Reference Data 38(3), 721-748.",
    "Sannerhaugen, E. (2026). The hcp phase-I solid para-hydrogen Helmholtz equation, as NeqSim's `thermo/util/solid/ParaHydrogenSolidHelmholtzEquation` carries it.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `FreezingPointTemperatureFlash`, `SystemLeachmanEos.createCalibratedParaHydrogenSolidEquation` and `PhaseSolidHelmholtzEos` are the port source.",
]
[source]
standard = "NeqSim master `FreezingPointTemperatureFlash`"
edition = "Both routes the operation has: the one that requires a `PhaseSolidHelmholtzEos`, and the tabulated solid every other system builds. Its two legacy variants are unreachable upstream rather than carried."
[algorithm]
scheme = "freezing_point_bracket_bisection"
initialisation = "span_expansion_from_the_start"
initial_temperature = 14.0
convergence = "absolute"
tolerance = 1e-10
max_iterations = 100
[algorithm.bracket]
scheme = "symmetric_span_expansion"
lower = 0.5
upper = 5000.0
steps = 50
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the fluid's substances, by name, resolved against the component databank with the keycard's overrides applied."
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the overall mole fractions. A candidate's own fraction is what decides whether it can appear, and a zero fraction is refused rather than solved."
[inputs.solid]
type = "string"
description = "which substance's freezing point is solved for, and it must be one of `components`. NeqSim loops every component its caller enabled a solid check for and keeps the highest freezing point; naming one is that loop's single-candidate case."
[inputs.P]
unit = "Pa"
description = "absolute pressure at which the freezing point is wanted; the temperature is what is solved for."
[outputs]
[outputs.temperature]
unit = "K"
description = "the freezing-point temperature: where the solid and the fluid meet, on whichever of the two routes the candidate names."
[outputs.component]
type = "string"
description = "which substance's freezing point this is. Named explicitly because a fluid can have more than one candidate and NeqSim keeps the highest."
[outputs.iterations]
unit = "dimensionless"
description = "Bracket expansions and bisection steps together, as NeqSim counts them."
[outputs.residual]
unit = "dimensionless"
description = "The dimensionless residual at the reported temperature: `(g_fluid - g_solid)/(R T)` on the Helmholtz route, and the multiphase appearance condition on the tabulated one."
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states"
[implementations]
python = "azoth.eos.freezing_point"
rust = "azoth_eos::freezing_point"
