id = "eos.wilke_viscosity"
name = "Gas mixture viscosity by Wilke's rule over Chung pure-component viscosities"
kind = "direct"
assumptions = [
    "the per-component constants are those of the gas components intended, and the caller resolved them from the databank by name - this model takes the numbers, not the names.\n",
    "each pure-component viscosity is `eos.chung_viscosity`'s, evaluated at the *mixture* molar volume `V` - not at the component's own molar volume, which is what NeqSim's `calcViscosity` does.\n",
    "`z` is checked (non-negative, sums to one) rather than renormalised, so a composition error is a loud failure, not a silently different fluid.\n",
    "the correlation is for a gas; the dense-gas term keeps it usable into the compressed region but not for a liquid.\n",
]
references = [
    "Wilke, C. R. (1950). \"A viscosity equation for gas mixtures.\" Journal of Chemical Physics 18(4), 517-519. DOI 10.1063/1.1747673.",
    "Chung, T.-H.; Ajlan, M.; Lee, L. L.; Starling, K. E. (1988). \"Generalized multiparameter correlation for nonpolar and polar fluid transport properties.\" Ind. Eng. Chem. Res. 27(4), 671-679. DOI 10.1021/ie00076a024.",
]
[source]
standard = "Wilke, C. R. (1950); Chung et al. (1988)"
edition = "Wilke's mixing rule is Wilke, J. Chem. Phys. 18(4), 517-519; the pure-component viscosity it mixes is Chung et al., Ind. Eng. Chem. Res. 27(4), 671-679."
doi = "10.1063/1.1747673"
[inputs]
[inputs.Tc]
type = "vector"
unit = "K"
length = "one per component"
description = "critical temperature of each component\n"
[inputs.Vc]
type = "vector"
unit = "m**3/mol"
length = "one per component"
description = "critical volume of each component\n"
[inputs.M]
type = "vector"
unit = "kg/mol"
length = "one per component"
description = "molar mass of each component\n"
[inputs.omega]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "acentric factor of each component\n"
[inputs.dipole]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "dipole moment of each component, in debye\n"
[inputs.kappa]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "viscosity correction factor of each component\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.V]
unit = "m**3/mol"
description = "molar volume of the gas mixture at `T`\n"
[inputs.z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.mu]
unit = "Pa*s"
description = "the gas mixture dynamic viscosity\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[[valid_range]]
quantity = "V"
min = 0
min_inclusive = false
severity = "error"
rationale = "`V` is the divisor in `y = Vc/(6*V)` inside the pure-component viscosity; a molar volume must be positive.\n"
[implementations]
python = "azoth.eos.wilke_viscosity"
rust = "azoth_eos::wilke_viscosity"
