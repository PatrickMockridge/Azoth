id = "eos.ge_nrtl_phase"
name = "Fugacity coefficients of an NRTL activity-coefficient liquid"
kind = "direct"
assumptions = [
    "this is NeqSim's `PhaseGENRTL` liquid: `phi_i = gamma_i P0_i / P` on the solvent arm. There is no cubic in it - an activity-coefficient phase's non-ideality is `gamma`, and its standard state is the pure liquid at the state's temperature.\n",
    "**both reference states are here.** `ComponentGE.fugcoef` gives a `solvent` component `gamma_i P0_i/P` and every other `(gamma_i/gamma_i^inf) H_i/P`; `gamma_i^inf` is this phase's NRTL on the solute-water pair `[1e-11, 1 - 1e-11]`, or on the diluted composition when the phase carries no water.\n",
    "`H_i` prefers the IAPWS G7-04 table for its 14 gases in a water-bearing phase, inside the row's fitted window, and fails closed to `1e12 bar` outside it; otherwise it is the databank's `HenryCoef1..4` correlation capped to `1e12 bar`, with the cap asked before any fittedness check.\n",
    "**three states are refused rather than given a number**: a non-ion Henry row with the four zeros the table uses for no correlation (NeqSim evaluates 1.802 bar), a solvent-tagged IAPWS species in water (NeqSim builds a one-component reference phase and throws), and a solvent with no Antoine row.\n",
    "an ion is `1e12 bar` whatever its row says. This phase takes no mixture, so it reaches the cap; `eos.ge_flash` and `eos.ge_nrtl_flash` build a cubic with `mixture_of`, which refuses an ion, so the flashes do not.\n",
    "`gamma_i` comes from `eos.nrtl_activity_coefficients` on the same resolved matrices, and `P0_i` from `eos.antoine_vapor_pressure` on the component's own coefficients and form. Neither is recomputed here, so the phase cannot disagree with them.\n",
    "an Antoine label that names no form falls through to Wagner, which is NeqSim's own dispatch and the same fall-through `eos.antoine_vapor_pressure` documents. It is reproduced rather than refused.\n",
    "`P0_i`, `H_i` and `gamma_i^inf` are reported beside `ln_phi` so a reader can check the correlation and the arithmetic separately; either a wrong reference quantity and a wrong `gamma` produce the same kind of wrong answer.\n",
    "this is a *liquid* phase. A vapour over it is a cubic, and combining the two is a gamma-phi flash, which is a separate model.\n",
    "`x` is checked (non-negative, sums to one) rather than renormalised.\n",
]
references = [
    "Renon, H.; Prausnitz, J. M. (1968). \"Local compositions in thermodynamic excess functions for liquid mixtures.\" AIChE Journal 14(1), 135-144.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `PhaseGENRTL` and `ComponentGE.fugcoef` are the port source.\n",
]
[source]
standard = "NeqSim master `PhaseGENRTL`"
edition = "`ComponentGE.fugcoef`, ported verbatim"
doi = "10.1002/aic.690140124"
[inputs]
[inputs.components]
type = "components"
length = "one entry per component"
description = "the substances the mixture is made of, by name, resolved against NeqSim's `INTER.csv` for the NRTL matrices and `COMP.csv` for each component's Antoine vapour-pressure correlation\n"
[inputs.T]
unit = "K"
description = "absolute temperature\n"
[inputs.P]
unit = "Pa"
description = "absolute pressure\n"
[inputs.x]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the liquid's mole fractions; non-negative and summing to one.\n"
[outputs]
[outputs.gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the NRTL activity coefficient of each component\n"
[outputs.ln_gamma]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each activity coefficient\n"
[outputs.ln_phi]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the natural logarithm of each component's fugacity coefficient: `ln(gamma_i P0_i / P)` on the solvent arm and `ln(gamma_i / gamma_i^inf) + ln(H_i / P)` on the Henry arm\n"
[outputs.p_sat]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the pure-component saturation pressure of each component at `T`, and **zero where the arm reads a Henry coefficient instead**\n"
[outputs.henry]
type = "vector"
unit = "Pa"
length = "one per component"
description = "the Henry coefficient each component's arm read, in pascals, and **zero where the arm reads none** - which is the solvent arm, whose reference is its own Antoine row\n"
[outputs.gamma_inf]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the infinite-dilution activity coefficient each component's Henry arm divided by, and **one where the arm does not divide by one**\n"
[[valid_range]]
quantity = "T"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature; zero and below are not states\n"
[[valid_range]]
quantity = "P"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure; zero and below are not states\n"
[implementations]
python = "azoth.eos.ge_nrtl_phase"
rust = "azoth_eos::ge_nrtl_phase"
