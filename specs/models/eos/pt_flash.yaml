      z_vapour: 0.6962296633271022
      min_t_over_tc: 0.8232969514490026
      iterations: 22
    tolerance: 1.0e-09
  - id: a_subcooled_liquid_feed
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599200.0, 3796000.0]
      omega: [0.01142, 0.2002]
      kij: [[0.0, 0.05], [0.05, 0.0]]
      T: 300.0
      P: 3000000.0
      z: [0.1, 0.9]
    expected:
      beta: -0.046417400850318154
      x: [0.1343066534039841, 0.8656933465960167]
      y: [0.8733970112336372, 0.12660298876638099]
      k: [6.503006285224948, 0.1462446133659167]
      ln_phi_liquid: [1.8168271437554724, -2.413916106531643]
      ln_phi_vapour: [-0.05543743164054027, -0.49144148129974313]
      z_liquid: 0.1109805757787235
      z_vapour: 0.8903679940210696
      min_t_over_tc: 0.7056831012420023
