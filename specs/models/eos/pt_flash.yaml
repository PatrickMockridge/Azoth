id: eos.pt_flash
name: Pressure-temperature flash

source:
  standard: Rachford, H. H.; Rice, J. D. (1952); Michelsen, M. L. (1982)
  edition: >
    The Rachford-Rice equation is Rachford & Rice, Journal of Petroleum Technology
    4(10), 19-3, DOI 10.2118/952327-G, the same paper `eos.rachford_rice_binary`
    cites. Successive substitution with a fugacity-coefficient update is the
    standard method and is set out in Michelsen, M. L. "The isothermal flash problem.
    Part I. Stability." Fluid Phase Equilibria 9(1), 1-19 (1982), DOI
    10.1016/0378-3812(82)85001-2.
  doi: "10.1016/0378-3812(82)85001-2"

kind: procedure

algorithm:
  scheme: successive_substitution_flash
  initialisation: wilson
  convergence: absolute
  tolerance: 1.0e-10
  max_iterations: 300
  inner:
    scheme: rachford_rice_bisection
    convergence: absolute
    tolerance: 1.0e-14
    max_iterations: 200

inputs:
  components:
    type: components
    length: one entry per component
    description: >
      the substances the mixture is made of, by name, resolved against the component
      databank this library ships (`data/components/`, compiled from NeqSim's COMP.csv
      and INTER.csv) with the loaded keycard's overrides applied. The critical
      constants, the acentric factors, the binary interaction parameters and the
      ideal-gas heat-capacity coefficients all come from there.

      **A name, rather than nine parallel vectors of numbers.** Until this input
      existed, `Tc`, `Pc`, `omega`, `kij` and `cp_a`..`cp_e` were retyped into every
      spec and every case - numbers in a YAML file that nothing could check against
      anything, and that in fact disagreed with the databank. `azoth.eos.components`
      lists what is available; a keycard adds a substance the databank does not have.
  T:
    unit: K
    description: absolute temperature
  P:
    unit: Pa
    description: absolute pressure
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      overall mole fractions. Checked rather than renormalised: the entries must be
      non-negative and sum to one to within a tolerance, and a feed that does not is
      refused. Silently renormalising would make a caller's composition error
      invisible in a way that changes every number downstream.

outputs:
  beta:
    unit: dimensionless
    optional: true
    description: >
      The vapour fraction, in `[0, 1]` for a two-phase split. Outside `[0, 1]` the
      feed is single phase and this is the negative-flash value - the amount of the
      absent phase that would have to be added to bring the feed to saturation -
      reported with `OUT_OF_VALID_RANGE` rather than suppressed, because it is a
      real reading of the same equation rather than a failure of it.

      **Absent in the two cases where there is genuinely no vapour fraction**:

      * the iteration converged to `x = y = z` (`phase: trivial`), where every `K_i`
        is 1, `g(beta)` is identically zero, and `beta` is *indeterminate* rather
        than out of range; and
      * no Rachford-Rice root exists at all (`phase: all_liquid` or `all_vapour`
        with `iterations: 1`), which is a proof that the feed is single phase.

      A caller must branch on `phase` and on presence, never on whether the number
      looks plausible. The two absences are distinguished by `iterations`: a feed
      diagnosed without a root settles on the first step, and a trivial solution is
      the result of an iteration that ran.
  x:
    type: vector
    unit: dimensionless
    length: one per component
    description: liquid-phase mole fractions
  y:
    type: vector
    unit: dimensionless
    length: one per component
    description: vapour-phase mole fractions
  k:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      K-values, `K_i = y_i / x_i = phi_i^L / phi_i^V`. Reported because they are the
      iterate the loop converges on, so a caller can see the convergence rather than
      inferring it from `residual`.
  ln_phi_liquid:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      fugacity coefficients in the liquid phase, as logarithms. Carried so the
      identity the iteration drives - that these differ from the vapour ones by
      `ln K_i` - is checkable from the result alone rather than only from a test.
  ln_phi_vapour:
    type: vector
    unit: dimensionless
    length: one per component
    description: fugacity coefficients in the vapour phase, as logarithms
  z_liquid:
    unit: dimensionless
    description: >
      the liquid root of the cubic at the liquid composition. The *smallest*
      admissible root, selected by ordering and never by an initial guess.
  z_vapour:
    unit: dimensionless
    description: the vapour root at the vapour composition, the largest admissible one
  min_t_over_tc:
    unit: dimensionless
    description: >
      the smallest `T / Tc_i` over the components - how close the mixture is to the
      nearest component's critical point. Reported because a bound is checked
      against it, and a bound whose subject a caller cannot see is a bound that
      reads as validation while asserting nothing.
  phase:
    type: enum
    values: [two_phase, all_liquid, all_vapour, trivial]
    description: >
      What the converged state is, and the field a caller must branch on.

      * `two_phase` - `beta` in `[0, 1]`. A genuine split.
      * `all_liquid` - `beta < 0`, or no Rachford-Rice root exists and every `K_i`
        is below one. The feed is subcooled liquid.
      * `all_vapour` - `beta > 1`, or no root exists and every `K_i` is above one.
        The feed is superheated vapour.
      * `trivial` - the iteration converged to `x = y = z`. The feed is single
        phase and **this does not say which one**: the K-values straddled one
        throughout, so the no-root proof never applied, and distinguishing the two
        phases is a stability analysis this model does not perform. It is the one
        outcome that is a statement about the *model* rather than about the feed.

      All four are reachable and each is covered by a test. The first three are
      diagnoses of the feed; `trivial` is an admission.
  iterations:
    unit: dimensionless
    description: >
      successive-substitution steps taken, including the final evaluation of the
      converged state. Carried because the answer alone does not say whether the
      loop did any work, and because the cross-language agreement test compares
      iteration counts as the sharpest cheap check that both implementations ran the
      same procedure.
  residual:
    unit: dimensionless
    description: >
      `rms_i |ln K_i - ln K_i_previous|` at the last step the loop completed. Not
      recomputed after the final evaluation, so it is the quantity the stopping rule
      actually tested.

      **NaN when no step completed**, which happens only for a feed diagnosed as
      single phase without a root - there is nothing to report a residual of, and
      zero would read as convergence. It is also above the tolerance when the loop
      stopped on the trivial-solution test rather than on the residual, which is
      expected rather than a failure: `iterations` and `phase` say which stopping
      rule fired.

valid_range:
  - quantity: T
    min: 0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states

  - quantity: P
    min: 0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute pressure; zero and below are not states. This also keeps every
      `B_i` positive, which `eos.pr_z_factor` requires - `B` is proportional to
      pressure and the cubic degenerates at zero.

  - quantity: min_t_over_tc
    max: 0.9
    max_inclusive: true
    severity: warning
    rationale: >
      Above `T / Tc = 0.9` for the nearest component the cubic's roots are close to
      coalescing, the two phases stop being distinguishable, and successive
      substitution converges slowly or to the trivial solution. This is a warning
      rather than an error because the arithmetic is still defined and the answer is
      still the equation's - it is the accuracy and the iteration that degrade, not
      the meaning. Recorded as a bound rather than left in prose so a caller sees
      the caveat without having to read this file.

assumptions:
  - "**A component's constants come from the databank and from nowhere else.** `Tc`, `Pc`, `omega` and every `kij` are read out of `data/components/`, compiled from NeqSim's `COMP.csv` and `INTER.csv`, with the loaded keycard's overrides applied on top - one path, the same one every model here takes. There is deliberately no way to hand a calculation a component's numbers directly: that second path is what let a spec file carry numbers that disagreed with NeqSim and be checked against nothing. Whether a tabulated constant describes the fluid in front of a caller is the caller's judgement, and the keycard is where it is exercised. A `kij` from a keycard whose convention differs by a sign produces a flash that converges cleanly to a wrong answer; see the same warning in `eos.vdw1f_mix_binary`."
  - "the equation of state is Peng-Robinson with the coefficient `eos.pr_kappa` computes. PRSV would give different K-values from the same inputs and this model does not accept a coefficient."
  - "**the mixture fugacity coefficient is not a registered calculation.** `eos.pr_departure` covers a *pure* component; the mixture form, which carries the sum over `x_j a_ij` and the `b_i / b_mix` term, lives in the model layer. That is the one piece of arithmetic here that no kernel checks, and it is mitigated by composition rather than by assertion: at `N = 1` it must reproduce `eos.pr_departure` exactly (the bracket factor collapses to 1), and at `N = 2` the mixture parameters must reproduce `eos.vdw1f_mix_binary` and the vapour fraction `eos.rachford_rice_binary`. Both are tested, in both languages."
  - "**there is no stability test.** Successive substitution finds a stationary point of the flash equations; whether the feed was stable is a different question, and a converged `trivial` is where the difference shows. Which single phase a `trivial` feed is cannot be answered by this model. This is the largest of the model layer's three: `all_liquid` and `all_vapour` are readings of `beta`, not diagnoses."
  - "**no damping and no acceleration.** Plain successive substitution, exactly as the scheme names it. Michelsen's minimum-variable Newton is a different scheme and a later milestone; this one converges slowly near the critical point and, as the notes record, sometimes to the wrong stationary point."
  - "the components' `Tc`, `Pc` and `omega` are taken to be mutually consistent and to describe the same substances the `kij` pairs name. The databank supplies both from one row per substance, so they cannot name different things - which is a property of the input's *shape* rather than a check on the numbers."
  - "the two phases are assumed to be at the same temperature and pressure as the feed - a flash, not a rigorous column stage. Nothing here does an energy balance, and the feed's enthalpy is not an input."

references:
  - 'Rachford, H. H.; Rice, J. D. (1952). "Procedure for Use of Electronic Digital Computers in Calculating Flash Vaporization Hydrocarbon Equilibrium." Journal of Petroleum Technology 4(10), 19-3. DOI 10.2118/952327-G. (the vapour-fraction equation; the citation is confirmed and the equation number is not - see eos.rachford_rice_binary, which records how the first draft of that citation was wrong in every part)'
  - 'Michelsen, M. L. (1982). "The isothermal flash problem. Part I. Stability." Fluid Phase Equilibria 9(1), 1-19. DOI 10.1016/0378-3812(82)85001-2. (successive substitution with a fugacity-coefficient update, and the stability problem this model does NOT solve; the DOI is confirmed and the paper has not been read)'
  - 'Wilson, G. M. (1969). "A Modified Redlich-Kwong Equation of State, Application to General Physical Data Calculations." Paper 15C, AIChE 65th National Meeting. (the K-value estimate the initialisation is named after. The constant 5.373 is quoted as 5.37 in some sources, and the paper is dated 1968 in some and 1969 in others; neither discrepancy is resolved here, and the value this model uses is the one in `initialisation: wilson`.)'

implementations:
  python: azoth.eos.pt_flash
  rust: azoth_eos::pt_flash
