id = "process.gibbs_reactor"
name = "Gibbs reactor"
kind = "direct"
assumptions = [
    "**the class carries its own solver and its own data.** `GibbsReactor.run` never calls `ChemicalEquilibrium`, and its formation properties are not the databank's - `GIBBSENERGYOFFORMATION` is `used` from P10 and its values are not these.",
    "**the equilibrium temperature is the feed's, and there is no setter.** The class reads `system.getTemperature()` from the fluid it is handed.",
    "**the species set is the feed's.** `useAllDatabaseSpecies` is false, so no species is added and the variables are the feed's components less the inert and the feed-excluded.",
    "**a species that needs an element the feed has none of is frozen at its feed amount**, with no minimum floor - the 'no sulfur in the feed, no sulfuric acid' rule.",
    "**a component the database does not carry is still a variable**: a composition row, no element entry, an objective reading as zero, and a skipped update. That is `testComponentNotInDatabaseMolesUnchanged`.",
    "**`elementNames` has seven entries for an eight-column table and the shift is reproduced.** The class's `Ar` balance is the file's `Na` column; its `Z` balance is the file's `Ar` column.",
    "**the eighth column is a charge and no loop reaches it: the solve does not balance charge.** `OH-` is -1 and `SO4--` is -2 in the file, and `elements[7]` is read by nothing.",
    "**the class's `Z` balance is zero on every row**, so `findActiveElements` never activates it and its Lagrange multiplier is never solved for.",
    "**the convergence test is on the undamped step.** `deltaXNorm` is the norm of `-J^-1 F` before `damping_composition` is applied, so the test and the step disagree about scale.",
    "**`min_iterations` is a floor and it bites.** Three of the capture's six rows stop at exactly 100, the first pass where `iteration >= min_iterations` holds.",
    "**reaching `max_iterations` returns success.** `converged` is set from the tolerance, so a capped run reports false while the method returns true; both are carried.",
    "**the iteration is ill-conditioned, which bounds how close a port can come.** `cond(J)` is `6.12e6` on the ammonia row and the residual is a cancelling sum; one iteration agrees, a hundred separate.",
    "**the data is compiled from the class's own two files** by `gen_databank.py`, joined on the lowercased molecule name as the class joins them; a species the coefficient file omits takes the fallback branch.",
    "**`calculateJ`'s javadoc and its code disagree on three signs.** The comment subtracts every term; the code subtracts the first and adds the other three. The code is ported.",
    "**a singular Newton system falls back to `SimpleMatrix.pseudoInverse`.** Two species against three active balances - the capture's `steam_methane_hot` row - make the Jacobian singular, and the port calls `solve_least_squares`, which is that inverse's own construction.",
    "**the fluid is PR with the classic mixing rule**, because `Stream::mixture()` has no other route. The class carries no cubic of its own, so the oracle is built on PR too.",
    "**still owed, and named in `ROADMAP.md`**: the Tikhonov regularisation and `runTransient`. **The step controls are in**: `armijo_line_search` and `adaptive_step_size` reproduce the class's own algorithm rows, held to `process_gibbs_algorithms.tsv`.",
    "**the vessel is `ReactorMechanicalDesign`, read from the inlet.** `GibbsReactor` is a `TwoPortEquipment`, and `calcDesign` takes its feed's pressure, temperature, volumetric flow and **system** density - so a two-phase feed is answered where `Stream::density` refuses. The solve is not on its path.",
    "**three branches cannot answer.** The L/D clamps cannot fire, the diameter being built at the target `4.0`; the head is always the shell's, its denominator being the larger; and the catalyst and `0.5` m floors answer at every default GHSV. The capture's `cstr` row lifts the diameter off its floor.",
    "**the space velocities are declared dimensionless.** `ghsv` and `lhsv` are reciprocal hours, and the unit vocabulary has no reciprocal-time unit; the values cross unconverted, on the `total_pressure_drop_mbar` precedent.",
    "**`super.calcDesign()`'s design-standard tree is absent.** It would overwrite the joint efficiency and the corrosion allowance from a database this workspace lacks; the capture holds both at `1.0` and `0.0`.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/equipment/reactor/GibbsReactor.java` is the port source, through `run`, `solveGibbsEquilibrium`, `calculateJacobian` and `performIterationUpdate`.\n",
    "`databank/sources/neqsim/GibbsReactDatabase/` - the class's own species table and coefficient file, compiled to `data/reactors/` and dispositioned column by column in `databank/manifest.toml`.\n",
    "`validation/neqsim/captures/process_gibbs_reactor.tsv` - six rows, each printing the convergence trace and not only the answer.\n",
    "`validation/neqsim/captures/process_gibbs_reactor_steps.tsv` - the class stopped after one and after two updates, which separates the map from the trajectory.\n",
    "**The class names no single paper.** Its `method` defaults to `DirectGibbsMinimization`; it cites Nocedal & Wright for the Newton step, Tikhonov (1963) and Gordon & McBride (1994).\n",
]
[source]
standard = "NeqSim process/equipment/reactor/GibbsReactor.java"
edition = "Its steady-state `run`: clone the inlet, take the element balance, freeze the species that need an element the feed lacks, floor every database species at `1e-6` mol, then a damped Newton iteration on `[n_i, lambda_j]`."
[inputs]
[inputs.components]
type = "components"
description = "the feed's substances, by name, resolved against the component databank and, for the species data, against the class's own table.\n"
[inputs.feed_n]
unit = "mol/s"
description = "the feed's molar flow. A Gibbs solve conserves every element but not the mole count.\n"
[inputs.feed_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed's composition, which decides which elements are available and so which species may form.\n"
[inputs.feed_p]
unit = "Pa"
description = "the feed's pressure. The residual carries `RT * ln(P/1 bara)`, so the bar value enters it and the pascals are converted at the boundary.\n"
[inputs.feed_t]
unit = "K"
description = "the feed's temperature, which is also the equilibrium temperature.\n"
[inputs.energy_mode]
type = "enum"
values = ["isothermal", "adiabatic"]
description = "how the temperature moves while the composition is solved, where isothermal is the class's own default.\n"
[inputs.damping_composition]
unit = "dimensionless"
description = "the fraction of the Newton step the compositions take, the class's default 0.05; the multipliers take the whole step.\n"
[inputs.max_iterations]
unit = "dimensionless"
description = "the iteration cap, the class's default 5000. Reaching it returns success with `converged` false.\n"
[inputs.convergence_tolerance]
unit = "dimensionless"
description = "the bound on the **undamped** step's norm, the class's default 1e-3.\n"
[inputs.min_iterations]
unit = "dimensionless"
description = "the floor below which the tolerance is not consulted, the class's default 100.\n"
[inputs.reactor_type]
type = "enum"
values = ["fixed-bed", "cstr", "packed-bed", "fluidized-bed"]
optional = true
description = "`reactorType`, and **only `cstr` reaches a branch**: `calcDesign` compares it to the class's own `\"CSTR\"` with `String.equals`, so the other three select the GHSV branch and otherwise only echo. **Absent is `fixed-bed`**, the class's field initialiser.\n"
[inputs.catalyst_bulk_density]
unit = "kg/m**3"
optional = true
description = "`catalystBulkDensity`, which turns the catalyst volume into a mass. **Absent is `800.0`.**\n"
[inputs.catalyst_particle_diameter]
unit = "mm"
optional = true
description = "`catalystParticleDiameter`, **in millimetres**, the Ergun equation's particle size. **Absent is `3.0` mm.**\n"
[inputs.bed_void_fraction]
unit = "dimensionless"
optional = true
description = "`bedVoidFraction`, the `eps` of both Ergun terms. **Absent is `0.40`.**\n"
[inputs.ghsv]
unit = "dimensionless"
optional = true
description = "`ghsv`, the gas hourly space velocity **in reciprocal hours**, declared dimensionless because the vocabulary has no reciprocal-time unit, so the value crosses unconverted. The class floors it at `1.0`. **Absent is `5000.0` 1/hr**, read by every non-`cstr` type.\n"
[inputs.lhsv]
unit = "dimensionless"
optional = true
description = "`lhsv`, the liquid hourly space velocity **in reciprocal hours**, with the same vocabulary gap as `ghsv` and the same absence of a conversion. The class floors it at `0.01`. **Absent is `1.0` 1/hr**, and it is read by `cstr` alone.\n"
[inputs.number_of_beds]
unit = "dimensionless"
optional = true
description = "`numberOfBeds`: `calcDesign` puts two `12` mm distribution plates in **each** bed's weight. **Absent is `1`.**\n"
[inputs.max_operation_pressure]
unit = "bar"
optional = true
description = "`getMaxOperationPressure()`, **absolute**: the operating pressure is `max(inlet, this)`. **Absent is `100.0`**, `MechanicalDesign`'s own field initialiser - NeqSim's equipment path would overwrite it from an economic design pressure, a tree this id does not carry.\n"
[inputs.max_operation_temperature]
unit = "K"
optional = true
description = "`getMaxOperationTemperature()`: the operating temperature is `max(inlet C, this - 273.15)`. **Absent is `100.0` K**, the base class's own initialiser, which is below every real feed and so never binds.\n"
[inputs.joint_efficiency]
unit = "dimensionless"
optional = true
description = "`getJointEfficiency()`, the `E` of both ASME thickness forms. **Absent is `1.0`**, fully radiographed; `super.calcDesign()`'s design-standard tree is absent here, so nothing overwrites it.\n"
[inputs.corrosion_allowance]
unit = "mm"
optional = true
description = "`getCorrosionAllowance()`, added to both thicknesses. **Absent is `0.0` mm.**\n"
[inputs.armijo_line_search]
type = "boolean"
optional = true
description = "`useArmijoLineSearch`: backtrack from the damped step until the total Gibbs energy meets `G(trial) <= G + c1*alpha*grad^T dn`, with the trial's fugacity coefficients recomputed. **Absent is `false`**, the class's own initialiser.\n"
[inputs.armijo_c1]
unit = "dimensionless"
optional = true
description = "`armijoC1`, the sufficient-decrease constant. **Absent is `1e-4`.** Read only when the line search is on.\n"
[inputs.armijo_rho]
unit = "dimensionless"
optional = true
description = "`armijoRho`, the backtracking contraction. **Absent is `0.5`.**\n"
[inputs.armijo_max_backtracks]
unit = "dimensionless"
optional = true
description = "`armijoMaxBacktracks`. **Absent is `20`**; on exhaustion the search returns `max(alpha, 1e-6)`.\n"
[inputs.adaptive_step_size]
type = "boolean"
optional = true
description = "`useAdaptiveStepSize`: the NASA CEA limit that keeps a major component's change under a factor of `e^ln 5` per step and stops a step crossing zero, floored at `1e-4`. **Absent is `false`.**\n"
[outputs.product_n]
unit = "mol/s"
description = "the outlet's molar flow, which the element balances do not fix.\n"
[outputs.product_z]
type = "vector"
unit = "dimensionless"
length = "one per component, the feed's order"
description = "the outlet's composition.\n"
[outputs.product_p]
unit = "Pa"
description = "the outlet's pressure, which the solve does not move.\n"
[outputs.product_t]
unit = "K"
description = "the outlet's temperature: the feed's when isothermal, and otherwise where the adiabatic loop landed.\n"
[outputs.product_h]
unit = "J/mol"
description = "the outlet's molar enthalpy at its own state.\n"
[outputs.converged]
type = "boolean"
description = "`hasConverged()`, the tolerance test and not the return value: a run that hits the cap reports false having succeeded.\n"
[outputs.iterations]
unit = "dimensionless"
description = "`getActualIterations()`, the pass the loop stopped on.\n"
[outputs.final_error]
unit = "dimensionless"
description = "`getFinalConvergenceError()`, the last undamped step norm.\n"
[outputs.lagrange_multipliers]
type = "vector"
unit = "J/mol"
length = "one per element, in the class's own seven names"
description = "the multipliers the solve found, where an exactly zero one is an element `findActiveElements` dropped. The class's arithmetic is kJ/mol; this reports joules.\n"
[outputs.element_balance_difference]
type = "vector"
unit = "mol/s"
length = "one per element, in the class's own seven names"
description = "the outlet element balance less the inlet's, which the class carries and tests for convergence.\n"
[outputs.gibbs_energy_history]
type = "vector"
unit = "W"
length = "one per iteration taken"
description = "the total Gibbs energy at the top of each iteration, before the update. **This is what makes the solve checkable**: a fixed point has no formula, so the path is the answer.\n"
[outputs.vessel_diameter]
unit = "m"
description = "`getVesselDiameter()`: `(4 V / (pi * 4))^(1/3)` off `V = catalystVolume / 0.70`, floored at `0.5` m.\n"
[outputs.vessel_length]
unit = "m"
description = "`getVesselLength()`: `4.0 * D`. The class's `2.0`/`8.0` L/D clamps are unreachable, because the ratio is `4.0` by construction.\n"
[outputs.shell_thickness]
unit = "mm"
description = "`getShellThickness()`, the ASME VIII Div 1 shell at the target diameter, floored at `6.0` mm. SI, shown in mm.\n"
[outputs.head_thickness]
unit = "mm"
description = "`getHeadThickness()`, the 2:1 ellipsoidal form floored at the shell - **which it always is**: its denominator is the larger of the two at every positive design pressure, so this equals `shell_thickness` on every state.\n"
[outputs.design_pressure]
unit = "bar"
description = "`getDesignPressureBara()`: the operating pressure times `1.10`.\n"
[outputs.design_temperature]
unit = "K"
description = "`getDesignTemperatureC()` plus `273.15`: the operating temperature plus `25` C. SI, shown in K.\n"
[outputs.catalyst_volume]
unit = "m**3"
description = "`getCatalystVolume()`: `flow_m3hr / max(GHSV, 1)` - or `max(LHSV, 0.01)` for `cstr` - floored at `0.01` m3.\n"
[outputs.catalyst_mass]
unit = "kg"
description = "`getCatalystMass()`: the volume times the bulk density.\n"
[outputs.bed_pressure_drop]
unit = "bar"
description = "`getBedPressureDrop()`: the Ergun drop over `bedLength = catalystVolume / (pi D^2 / 4)`, with the class's hard-coded `1.5e-5` Pa s viscosity.\n"
[outputs.empty_vessel_weight]
unit = "kg"
description = "`getEmptyVesselWeight()`: the shell plus both heads at the shell thickness.\n"
[outputs.total_equipped_weight]
unit = "kg"
description = "`getTotalEquippedWeight()`: the empty vessel, the catalyst, two `12` mm plates per bed, and nozzles at `10%` of the shell and heads.\n"
[outputs.reactor_type]
type = "string"
description = "`getReactorType()`, in the class's own spelling (`FIXED_BED`, `CSTR`, ...), which is what the capture prints.\n"
[outputs.number_of_beds]
unit = "dimensionless"
description = "`getNumberOfBeds()`.\n"
[[valid_range]]
quantity = "feed_n"
min = 0
min_inclusive = false
severity = "error"
rationale = "the residual takes the logarithm of a mole fraction, so a feed with no moles has none\n"
[[valid_range]]
quantity = "damping_composition"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "the composition takes a fraction of the Newton step, and a fraction is in (0, 1]\n"
[[valid_range]]
quantity = "max_iterations"
min = 1
min_inclusive = true
severity = "error"
rationale = "a loop with no passes is not a loop\n"
[[valid_range]]
quantity = "convergence_tolerance"
min = 0
min_inclusive = false
severity = "error"
rationale = "a tolerance of zero is never satisfied, so the cap is the only stop\n"
[[valid_range]]
quantity = "catalyst_bulk_density"
min = 0
min_inclusive = false
severity = "error"
rationale = "the catalyst mass is the volume times this, and a non-positive density is not a loading\n"
[[valid_range]]
quantity = "catalyst_particle_diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "both Ergun terms divide by its square\n"
[[valid_range]]
quantity = "bed_void_fraction"
min = 0
min_inclusive = false
max = 1
max_inclusive = false
severity = "error"
rationale = "the Ergun terms divide by its cube, and a void fraction of one is no bed at all\n"
[[valid_range]]
quantity = "number_of_beds"
min = 1
min_inclusive = true
severity = "error"
rationale = "a reactor with no bed carries no bed weight and no loading\n"
[[valid_range]]
quantity = "joint_efficiency"
min = 0
min_inclusive = false
severity = "error"
rationale = "both thickness forms divide by the allowable stress times this efficiency\n"
[[valid_range]]
quantity = "corrosion_allowance"
min = 0
min_inclusive = true
severity = "error"
rationale = "a negative allowance thins the vessel below its calculated wall\n"
[[valid_range]]
quantity = "max_operation_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "the design pressure is this times the margin, and a vessel is not designed at zero absolute\n"
[[valid_range]]
quantity = "max_operation_temperature"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class tests this against zero before reading it, and a non-positive Kelvin limit is not a temperature\n"
[implementations]
python = "azoth.process.gibbs_reactor"
rust = "azoth_process::gibbs_reactor"
