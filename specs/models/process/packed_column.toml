id = "process.packed_column"
name = "Packed column"
kind = "procedure"
assumptions = [
    "**the packing does not change the separation.** `PackedColumn extends DistillationColumn` and its `run` is `super.run(id)` then `calcPackingHydraulics()`, so the equations are `process.distillation_column`'s, unchanged.",
    "**what the packing changes is the stage count, at construction**: `estimateStages(packed_height, 0.5)` is `ceil(packed_height / 0.5)` floored at two, so `packed_height` replaces `number_of_stages` here.",
    "**the floor is reached rather than refused.** The capture's stage-count rows report two middle trays for `0.2` m, `0.0` m and `-1.0` m alike, because `estimateStages` and `setPackedHeight` have no domain check.",
    "**the five packing parameters reach the report and not the solve.** `ColumnInternalsDesigner` reads them after the column has converged, so `PackedColumn.run` is `super.run(id)` then a report: the last seven `[outputs]` are it.",
    "**the class's report describes a different column from the one it solved.** The constructor fixes the stage count on a `0.5` m HETP guess and the hydraulics computes the real one afterwards: the capture's own case solves ten middle trays and reports `1.597` theoretical stages.",
    "**`packing_hydraulic_capacity_factor` is refused where the class refuses it**: `setPackingHydraulicCapacityFactor` throws for a value that is not positive and finite, so the port holds to that rather than carrying it inertly.",
    "**the contactor constructor is not this id.** `PackedColumn(name, gasInStream)` fixes ten middle trays with no ends and never reads the height, so that machine is `process.absorption_column` at `number_of_stages = 10`.",
    "**`has_condenser` and `has_reboiler` are the base's**, because two of the class's three constructors take them and the class adds no end of its own.",
    "**the fluid is PR with the classic mixing rule**, because `Stream::mixture()` resolves `databank::mixture_of(names, Cubic::Pr, None)` and has no other route.",
    "**the class's own test state is captured and is not an oracle.** Run as its test runs it, the column has no internal traffic, the feed passes through the empty trays below it, and the class still reports `RIGOROUS_CONVERGED` with residuals of exactly zero.",
    "**`reactive` is measured rather than assumed**: no sibling test calls `setReactive`. On a fluid with no independent reaction the reactive route *is* the equilibrium one - bit-identical across all sixty-nine captured keys of the packed column's oracle.",
    "**On a reacting fluid the class does not converge it**: the hydrocarbon absorber at this port's own gate ends `FALLBACK_PRODUCTS`, mass residual `6.4e5` - its own log calls that not a rigorous result. The states neither library converges are refused.",
    "**the report is read at the middle tray, `trays.len() / 2`.** That is the class's own `trays.size() / 2`: on the capture's seven-tray row it is tray 3, and the three report quantities that read no surface tension reproduce the capture there to `1e-6`.",
    "**the report's surface tension is the designer's `0.02` fallback**, because the interface route answers nothing here: the capture prints `getSurfaceTension(0, 1)` as `0.0` on every tray. A third constant, distinct from the rate-based path's `0.025`.",
    "**seven of the report's quantities are published and the rest are owed.** The capture prints fourteen keys in two blocks: the first seven from `PackedColumn`'s accessors, the second from its calculator, which `packing_hydraulics` already publishes. `ROADMAP.md` names what closes the rest.\n",
]
references = [
    "NeqSim - Apache-2.0. `process/equipment/distillation/PackedColumn.java` is the port source: its `estimateStages` and its three constructors. The solve it wraps is `DistillationColumn.java`; the packing report is `ColumnInternalsDesigner`, which is mechanical design and `ROADMAP.md` names it.",
    "`validation/neqsim/captures/process_packed_column.tsv` - fifteen rows: eleven stage-count rows that build the class at a stated height and print the trays it made, and four solved rows.",
]
[source]
standard = "NeqSim process/equipment/distillation/PackedColumn.java"
edition = "Its `estimateStages` and its three constructors, over `DistillationColumn`'s `run`; and `ColumnInternalsDesigner.calculatePacked`'s report, read at the middle tray. What the report leaves owed - `TrayHydraulicsCalculator` and the mechanical design - is named in `ROADMAP.md`."
[algorithm]
scheme = "sequential_substitution_sweeps"
initialisation = "linear_temperature_profile"
convergence = "absolute"
tolerance = 1.0e-06
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
description = "the feed's substances, by name, resolved against the component databank. The order is the order of `feed_z`.\n"
[inputs.feed_n]
unit = "mol/s"
description = "the feed's molar flow.\n"
[inputs.feed_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed composition.\n"
[inputs.feed_p]
unit = "Pa"
description = "the feed's pressure, which is its own - the tray pressures come from `bottom_pressure` and `top_pressure`.\n"
[inputs.feed_t]
unit = "K"
description = "the feed's temperature, which with its pressure and composition fixes its enthalpy.\n"
[inputs.packed_height]
unit = "m"
description = "the packed bed height, which the constructor divides by a `0.5` m HETP guess to fix the stage count: `ceil(packed_height / 0.5)` floored at two. **The floor is reached rather than refused**, so a height of zero or less is a two-stage column.\n"
[inputs.feed_stage]
unit = "dimensionless"
description = "the stage the feed enters, 0-based over the trays including the ends - so stage 0 is the reboiler where there is one, and the last stage is the condenser.\n"
[inputs.has_reboiler]
type = "boolean"
description = "whether the column has a reboiler at stage 0.\n"
[inputs.has_condenser]
type = "boolean"
description = "whether the column has a condenser at the top stage.\n"
[inputs.top_pressure]
unit = "Pa"
description = "the pressure at the top stage.\n"
[inputs.bottom_pressure]
unit = "Pa"
description = "the pressure at stage 0. The two fix the profile the tray pressures interpolate.\n"
[inputs.temperature_tolerance]
unit = "K"
description = "the convergence gate on the mean tray-temperature change between iterations. Where a solve stops is what its answer is, so this is a measurement and not a knob.\n"
[inputs.max_iterations]
unit = "dimensionless"
description = "the iteration cap. A solve that reaches it without meeting the gate is refused, with its residuals named.\n"
[inputs.reboiler_temperature]
unit = "K"
optional = true
description = "the reboiler's temperature, which pins the bottom tray's flash. **Absent means no pin**, and the end's flash is then at its own enthalpy.\n"
[inputs.condenser_temperature]
unit = "K"
optional = true
description = "the condenser's temperature, which pins the top tray's flash. Absent as the reboiler's is. **A pin wins over a directly-applied duty.**\n"
[inputs.packing_type]
type = "string"
optional = true
description = "the packing's name, which `PackingSpecificationLibrary` resolves and the hydraulics reads. **It does not enter the solve.** The class defaults it to Pall-Ring-50.\n"
[inputs.structured_packing]
type = "boolean"
optional = true
description = "whether the packing is structured or random, which selects the hydraulic correlation. **It does not enter the solve.**\n"
[inputs.design_flood_fraction]
unit = "dimensionless"
optional = true
description = "the fraction of flood the packing is sized to. **It does not enter the solve**: `isGasLoadFactorWithinDesignLimit` reads it and no part of `run` does. The class defaults it to 0.70.\n"
[inputs.packing_hydraulic_capacity_factor]
unit = "dimensionless"
optional = true
description = "the selected packing's relative hydraulic capacity factor, which the hydraulics reads. **Refused where it is not positive and finite**, which is `setPackingHydraulicCapacityFactor`'s own check. The class defaults it to 1.0.\n"
[inputs.column_diameter]
unit = "m"
optional = true
description = "the column's internal diameter. **It does not enter the solve**: a value at or below zero auto-sizes it from the hydraulics through `setInternalDiameter`. The class defaults it to -1.0.\n"
[inputs.murphree_efficiency]
unit = "dimensionless"
optional = true
description = "the column-wide Murphree tray efficiency, applied to each interior stage's vapour. **Omitted means the ideal stage.** Refused with `solver_type = naphtali_sandholm`, whose solver carries a different correction.\n"
[inputs.reactive]
type = "boolean"
optional = true
description = "**whether the middle trays flash reactively** - `DistillationColumn.setReactive(true)`, inherited and not overridden. The ends never do. Measured: the section is either the plain flash or a divergence - see the notes.\n"
[inputs.reactive_start_tray]
unit = "dimensionless"
optional = true
description = "the first reactive middle tray, 0-based among the middle trays, with `reactive_end_tray` its inclusive last. **Both bounds or neither.** An absorber has no ends, so every stage is a middle tray.\n"
[inputs.reactive_end_tray]
unit = "dimensionless"
optional = true
description = "the last reactive middle tray, inclusive.\n"
[inputs.solver_type]
type = "enum"
values = ["direct_substitution", "damped_substitution", "inside_out", "matrix_inside_out", "wegstein", "sum_rates", "newton", "naphtali_sandholm", "mesh_residual", "auto"]
optional = true
description = "**`direct_substitution` and `naphtali_sandholm` are ported**; the other eight are refused by name, each with the `ColumnSolverFactory` solver behind it.\n"
[inputs.top_specification_type]
type = "enum"
values = ["product_purity", "reflux_ratio", "component_recovery", "product_flow_rate", "duty"]
optional = true
description = "the top product's degree of freedom, which `ColumnSpecification` carries. Omitted, the top is pinned by temperature - the class's other route. **The end is the parameter's name and not a value**, because the class holds exactly two specifications.\n"
[inputs.top_specification_target]
unit = "dimensionless"
optional = true
description = "the target value, in the unit its type implies: dimensionless for a purity, a recovery or a ratio, **mol/hr** for a flow rate, W for a duty.\n"
[inputs.top_specification_component]
type = "string"
optional = true
description = "the component a purity or a recovery constrains; the class's own `validate` refuses such a specification without one, and the other three types do not read it.\n"
[inputs.bottom_specification_type]
type = "enum"
values = ["product_purity", "reflux_ratio", "component_recovery", "product_flow_rate", "duty"]
optional = true
description = "the bottom product's degree of freedom, which `ColumnSpecification` carries. Omitted, the bottom is pinned by temperature - the class's other route.\n"
[inputs.bottom_specification_target]
unit = "dimensionless"
optional = true
description = "the target value, in the unit its type implies, as the top specification's is.\n"
[inputs.bottom_specification_component]
type = "string"
optional = true
description = "the component a purity or a recovery constrains; unread by the other three types.\n"
[inputs.tray_murphree_efficiency]
type = "vector"
unit = "dimensionless"
length = "one per stage, the reboiler at index 0"
optional = true
description = "one override per stage, `NaN` where a stage falls through to `murphree_efficiency` - `DistillationColumn.setMurphreeEfficiencies`, whose own resolution is `getEffectiveMurphreeEfficiency`. A length that is not the stage count is refused, and a value outside `[0, 1]` is clamped rather than refused.\n"
[inputs.gas_side_draw_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray, a zero where a tray draws nothing"
optional = true
description = "**the vapour each tray withdraws from its own outlet**, which `setGasSideDrawFraction` states as a fraction of the phase: a draw has the tray's composition, temperature and pressure and a different flow. **A fraction on an end is refused.**\n"
[inputs.liquid_side_draw_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray"
optional = true
description = "the liquid each tray withdraws as a side draw, from the same liquid a pumparound takes from: **the two are bounded together** by `validateLiquidSplitFractions` and may not sum above one.\n"
[inputs.pumparound_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray"
optional = true
description = "the liquid each tray withdraws as a pumparound. **The return is ported**: `pumparound_*` below states the tray it comes back to, its fraction and its temperature drop, and the column iterates the recycle.\n"
[inputs.side_draw_flow_tray]
unit = "dimensionless"
optional = true
description = "**the tray whose draw flow is specified**, which `addSideDrawFlowSpecification(tray, phase, flow, unit)` takes. Omitted means every draw stays a *fraction* of its stage's own phase, decided once - which is what the three fraction vectors above are.\n"
[inputs.side_draw_flow_phase]
type = "enum"
values = ["gas", "liquid"]
optional = true
description = "which of the stage's two phases the specification controls, `SideDrawPhase`. **Stated with the tray and the target or not at all**: a target without a phase is a declaration that cannot be read.\n"
[inputs.side_draw_flow_target]
unit = "kg/s"
optional = true
description = "the mass flow the draw must deliver - `getSideDrawStream(tray, phase).getFlowRate(unit)`, so a **mass** rate and not a molar one. The column moves the draw's fraction until the draw delivers it.\n"
[inputs.side_draw_flow_tolerance]
unit = "dimensionless"
optional = true
description = "the relative residual the search stops at. **Omitted means `1e-4`**, which is `ColumnSideDrawSpecification`'s own field initialiser.\n"
[inputs.side_draw_flow_max_iterations]
unit = "dimensionless"
optional = true
description = "the candidate cap for this specification. **Omitted means `12`**, the class's own field initialiser; the tear's own cap is the largest of it and `maxColumnTearIterations`.\n"

[inputs.pumparound_return_tray]
unit = "dimensionless"
optional = true
description = "**the tray the pumparound's liquid comes back to**, which `addLiquidPumparound(name, drawTray, returnTray, fraction, drop)` takes. **Stated with the draw tray, the fraction and the drop or not at all.**\n"
[inputs.pumparound_draw_tray]
unit = "dimensionless"
optional = true
description = "the tray the pumparound's liquid leaves. It must be a middle tray: the ends here are `column::reboiler` and `column::condenser` rather than stages.\n"
[inputs.pumparound_draw_fraction]
unit = "dimensionless"
optional = true
description = "the fraction of the draw tray's liquid withdrawn, which `setLiquidPumparoundDrawFraction` states on the tray - the same vector `pumparound_fractions` writes.\n"
[inputs.pumparound_temperature_drop]
unit = "K"
optional = true
description = "the drop from the draw to the return, which `updateReturnStream` subtracts before re-flashing. **The cooler's duty is the enthalpy between the two streams.**\n"
[inputs.pumparound_tolerance]
unit = "dimensionless"
optional = true
description = "the relative return-flow change the outer loop stops at. **Omitted means `1e-4`**, which is `pumparoundTolerance`'s own field initialiser.\n"
[inputs.pumparound_max_iterations]
unit = "dimensionless"
optional = true
description = "the outer loop's cap. **Omitted means `12`**, `maxPumparoundIterations`' own initialiser.\n"
[inputs.max_allowable_fs_factor]
unit = "dimensionless"
optional = true
description = "the `Fs` limit `isFsFactorWithinDesignLimit` and its two siblings read. **Absent is `2.5`**, the base class's own; `PackedColumn` overrides neither default. Read by the limit family alone.\n"

[outputs]
[outputs.tray_temperature]
type = "vector"
unit = "K"
length = "one per tray, the reboiler at stage 0 to the condenser at the top"
description = "the solved temperature profile, which is what a column's answer is rather than a scalar.\n"
[outputs.tray_pressure]
type = "vector"
unit = "Pa"
length = "one per tray"
description = "each tray's pressure, which is the linear profile between `bottom_pressure` and `top_pressure`.\n"
[outputs.tray_gas_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the vapour leaving each tray, which is its upward traffic.\n"
[outputs.tray_liquid_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid leaving each tray, which is its downward traffic.\n"
[outputs.distillate_n]
unit = "mol/s"
description = "the overhead product, which is the condenser's own outlet.\n"
[outputs.distillate_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the distillate's composition.\n"
[outputs.distillate_p]
unit = "Pa"
description = "the distillate's pressure, which is `top_pressure` where there is a condenser.\n"
[outputs.distillate_t]
unit = "K"
description = "the distillate's temperature, which is the condenser's own.\n"
[outputs.distillate_h]
unit = "J/mol"
description = "the distillate's molar enthalpy at its own state.\n"
[outputs.bottoms_n]
unit = "mol/s"
description = "the bottom product, which is the reboiler's liquid.\n"
[outputs.bottoms_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the bottoms' composition.\n"
[outputs.bottoms_p]
unit = "Pa"
description = "the bottoms' pressure, which is `bottom_pressure` where there is a reboiler.\n"
[outputs.bottoms_t]
unit = "K"
description = "the bottoms' temperature, which is the reboiler's own.\n"
[outputs.bottoms_h]
unit = "J/mol"
description = "the bottoms' molar enthalpy at its own state.\n"
[outputs.gas_side_draw_n]
type = "vector"
unit = "mol/s"
length = "one per tray, a zero where a tray draws none"
description = "the vapour each tray withdrew, zero where a tray drew none. **The three draw fractions are this id's own declared inputs**, which `PackedColumn` inherits and overrides no part of, so a stated fraction draws here exactly as it does in `process.distillation_column`.\n"
[outputs.liquid_side_draw_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid each tray withdrew as a side draw, zero where a tray drew none, on the same three inherited draw inputs as `gas_side_draw_n`.\n"
[outputs.pumparound_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid each tray withdrew as a pumparound, zero where a tray drew none, on the same three inherited inputs.\n"
[outputs.condenser_duty]
unit = "W"
description = "the condenser's duty: its products' enthalpy less the vapour's that came in, which is negative for a condenser.\n"
[outputs.reboiler_duty]
unit = "W"
description = "the reboiler's duty: its boilup and its bottoms less the downcomer's enthalpy.\n"
[outputs.iterations]
unit = "dimensionless"
description = "the iterations taken. **Where a solve stops is where its answer is**, so this is the base's count on the same state.\n"
[outputs.temperature_residual]
unit = "dimensionless"
description = "the mean tray-temperature change at the last iteration, in K - the gate the solve was held to.\n"
[outputs.mass_residual]
unit = "dimensionless"
description = "the products' worst component imbalance against the feed, relative. **The closure and not the class's MESH norm.**\n"
[outputs.energy_residual]
unit = "dimensionless"
description = "`|H_feed + duties - H_products| / |H_feed|`, the enthalpy closure. As the mass residual, not the class's norm.\n"
[outputs.hetp]
unit = "m"
description = "the height equivalent to a theoretical plate, which `ColumnInternalsDesigner` computes **after** the solve. It is clamped to `[0.1, 2 estimate]` and every captured row sits at the estimate's own two-fold ceiling, so it is `1.44` m on the 2.3 m row.\n"
[outputs.theoretical_stages]
unit = "dimensionless"
description = "**the packed height over the HETP, and it describes a different column from the one solved.** The constructor fixes the stage count on a `0.5` m guess and this is the real HETP read after: the capture's 2.3 m case solves five middle trays and reports `1.597` stages.\n"
[outputs.percent_flood]
unit = "dimensionless"
description = "the middle tray's vapour velocity as a percentage of the flooding velocity, which is the load the design window is judged on.\n"
[outputs.flooding_velocity]
unit = "m/s"
description = "the velocity at which the bed floods, from the Eckert fit at the middle tray's state.\n"
[outputs.packing_pressure_drop]
unit = "Pa"
description = "the bed's total pressure drop: Leva's dry form with its liquid-loading correction, per metre, times the packed height.\n"
[outputs.hydraulics_ok]
type = "boolean"
description = "**`PackedColumn.isHydraulicsOk()`**, which the pinned jar shows is the calculator's own `isDesignOk` - a field assigned from it, with no second predicate behind it. True when wetted and between 40 and 80 per cent of flood; every captured row prints false.\n"
[outputs.internal_diameter]
unit = "m"
description = "the column's internal diameter: the stated one, or the one `hydraulics.packing_sizing` answers where `column_diameter` is absent or at or below zero. **The capture's four solved rows all take the sizing branch**, so this is the sized value there and not an echo of the input.\n"
[outputs.fs_factor]
unit = "dimensionless"
description = "`getFsFactor`: the gas outlet's superficial velocity over the **total** `pi*D^2/4` times the square root of its system density, in `Pa**0.5`, declared dimensionless. **At the diameter the sizing resolved**, which is the one `calcPackingHydraulics` writes back.\n"
[outputs.fs_factor_utilization]
unit = "dimensionless"
description = "`getFsFactorUtilization`: the factor over the limit, and **zero where the limit is not positive** rather than an infinity.\n"
[outputs.fs_factor_within_design_limit]
type = "boolean"
description = "`isFsFactorWithinDesignLimit`: `Fs <= max_allowable_fs_factor`.\n"
[outputs.minimum_diameter_for_fs_limit]
unit = "m"
description = "`getMinimumDiameterForFsLimit`: the diameter at which the factor would reach its limit, `sqrt(4*Q*sqrt(rho)/(pi*limit))`. **A function of the flow, the density and the limit alone**.\n"
[[valid_range]]
quantity = "top_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[[valid_range]]
quantity = "bottom_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[[valid_range]]
quantity = "temperature_tolerance"
min = 0
min_inclusive = false
severity = "error"
rationale = "a convergence tolerance is positive, and zero is a solve that never stops\n"
[[valid_range]]
quantity = "feed_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature\n"
[implementations]
python = "azoth.process.packed_column"
rust = "azoth_process::packed_column"
