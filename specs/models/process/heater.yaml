id: process.heater
name: Heater and cooler
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.heatexchanger.Heater`, `run(UUID)` at lines 402-471 of the
    3.20.0 source tree. `Cooler` is in the same package and inherits it.
  edition: >
    Version 3.20.0. Taken from it: `P_out = P_in - pressureDrop` (`:432-435`),
    `H_out = H_in + Q` (`:431`) and `PHflash(P_out, H_out)` (`:445-446`). Not taken: the
    three other specifications the class switches between, the energy port and the
    caches.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Heater.java` lines
    402-471; `Cooler.java` for the inheritance.'
  - '`eos.ph_flash` - the isenthalpic flash this model is.'
  - '`eos.pt_flash` - what the two specifications this model does not carry would reduce
    to; see the notes.'

algorithm:
  scheme: duty_enthalpy_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  components:
    type: components
    length: one entry per component
    description: >
      the substances the mixture is made of, by name, resolved against the component
      databank this library ships (`data/components/`, compiled from NeqSim's COMP.csv
      and INTER.csv) with the loaded keycard's overrides applied. The critical
      constants, the acentric factors, the binary interaction parameters and the
      ideal-gas heat-capacity coefficients all come from there.

      **A name, rather than nine parallel vectors of numbers.** Until this input
      existed, `Tc`, `Pc`, `omega`, `kij` and `cp_a`..`cp_e` were retyped into every
      spec and every case - numbers in a YAML file that nothing could check against
      anything, and that in fact disagreed with the databank. `azoth.eos.components`
      lists what is available; a keycard adds a substance the databank does not have.
  T:
    unit: K
    description: the feed's absolute temperature
  P:
    unit: Pa
    description: the feed's absolute pressure, before the drop
  n:
    unit: mol/s
    description: >
      the feed's molar flow rate. Needed rather than decorative: the duty is an
      *extensive* quantity and the flash inverts a *molar* enthalpy, so the conversion
      `Q / n` is part of the model. Must be positive, which the range check enforces
      because that division is what the check protects.
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions. Checked rather than renormalised.
  pressure_drop:
    unit: Pa
    description: the pressure the exchanger drops, subtracted from `P` first
  heat_duty:
    unit: W
    description: >
      the duty, **signed**. Positive adds energy and raises the temperature; negative
      removes it and is a cooler. Zero is the identity, and the case that pins it.

outputs:
  T:
    unit: K
    description: the outlet temperature. This is the model's answer.
  P:
    unit: Pa
    description: the outlet pressure, `P - pressure_drop`
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the stream is in at the outlet
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase stream
  iterations:
    unit: dimensionless
    description: flash iterations taken

valid_range:
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      the model divides the duty by the flow. A zero would reach the arithmetic as a
      division by zero, and a negative would give a temperature change of the wrong sign
      for a stream flowing the other way.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states

assumptions:
  - '**the duty is the specification**, and the temperature is the answer. That is the
    direction this model exists to serve. See the notes for why the opposite direction is
    not a unit operation.'
  - '**the composition and the flow are unchanged.** A heater does not add or remove
    material, and nothing here reports either back.'
  - '**no pressure drop unless asked for.** `pressure_drop` defaults to nothing in the
    sense that zero is an ordinary value; a heat exchanger that drops pressure is the
    same model with the drop given.'
  - '**no heat-transfer calculation.** How much area, at what overall coefficient, for
    what approach temperature: that is heat-exchanger design, and this model is told the
    duty rather than computing it. `thermal.conduction_plane_wall` is the library''s only
    heat-transfer calculation and it is a wall, not an exchanger.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

implementations:
  python: azoth.process.heater
  rust: azoth_process::heater
