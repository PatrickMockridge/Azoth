id = "process.absorption_column"
name = "Absorption column"
kind = "direct"
assumptions = [
    "**the column has no ends and two fixed inlets.** The constructor passes `false, false`; `addGasInStream` is `addFeedStream(stream, 0)` and `addSolventInStream` is `addFeedStream(stream, getNumberOfTrays() - 1)`, each refusing a second assignment.",
    "**the arithmetic is `DistillationColumn`'s own**, which this port already carries: the same stage, the same sweeps, the same terminal products. Nothing in the class overrides `run`, and the one method it does override - `applyMurphreeCorrection` - is refused by name here.",
    "**the class's own tests solve an isothermal column, and that is a one-sweep one.** Pinning every stage makes the base's gate - the mean tray-temperature change - exactly zero, so the solve stops after its **first** sweep: the captured rows report one iteration and a temperature residual of `0.0`.",
    "**the gas load factor does not enter the solve.** `isGasLoadFactorWithinDesignLimit`, `getGasLoadFactorUtilization` and `getMinimumDiameterForGasLoadLimit` read it and none is on the run path, so the model carries it as a declaration.",
    "**the products are the class's own getters**: `getGasOutStream` is the treated gas leaving the top stage and `getLiquidOutStream` the loaded solvent leaving the bottom, which is what the terminal trays publish when there are no ends.",
    "**both inlets carry the same substances in the same order.** The class indexes every tray's components by one list built from its first feed, so a solvent naming different substances is a different fluid rather than an inlet, and this refuses it.",
    "**the fluid is PR with the classic mixing rule**, because `Stream::mixture()` resolves `databank::mixture_of(names, Cubic::Pr, None)` and has no other route.",
    "**`murphree_efficiency` and `component_murphree_efficiency` are declared and refused**, as are the eight strategies of `solver_type` this port does not carry. Each refusal names the class that would close it. What is owed here is the override, which corrects both phases.",
    "**`reactive` is measured rather than assumed**: no sibling test calls `setReactive`. On a fluid with no independent reaction the reactive route *is* the equilibrium one - bit-identical across all sixty-nine captured keys of the packed column's oracle.",
    "**On a reacting fluid the class does not converge it**: the hydrocarbon absorber at this port's own gate ends `FALLBACK_PRODUCTS`, mass residual `6.4e5` - its own log calls that not a rigorous result. The states neither library converges are refused.\n",
    "**the tray hydraulics and the mechanical design are owed**: `TrayHydraulicsCalculator` and `AbsorberMechanicalDesign` are the classes that would close them, this entry declares no parameter they read, and `ROADMAP.md` names both.\n",
    "**it is not the refused family**: `SimpleAbsorber`, `SimpleTEGAbsorber`, `SimpleAmineAbsorber` and `WaterStripperColumn` carry the MDEA/CO2 and TEG/water chemistry, and porting this id closes nothing about that.\n",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/equipment/absorber/AbsorptionColumn.java` is the port source; it extends `DistillationColumn` and overrides no `run`.",
    "`validation/neqsim/captures/process_absorber.tsv` - six rows: a lean-oil absorber and a hydrocarbon stripper, each pinned as the classes' own tests pin them, unpinned at the classes' own `1e-2` K gate, and unpinned at `1e-4` K, which is the row the port is held to.",
]
[source]
standard = "NeqSim process/equipment/absorber/AbsorptionColumn.java"
edition = "Its constructor and its two inlet methods. The class adds no arithmetic to `DistillationColumn.run`; what it adds is a gas-load-factor design surface, which `ROADMAP.md` records among the classes still owed."
[inputs]
[inputs.gas_components]
type = "components"
description = "the gas's substances, by name. The solvent must name the same substances in the same order.\n"
[inputs.gas_n]
unit = "mol/s"
description = "the gas feed's molar flow.\n"
[inputs.gas_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the gas feed's composition.\n"
[inputs.gas_p]
unit = "Pa"
description = "the gas feed's pressure, which is its own - the trays' pressures come from `bottom_pressure` and `top_pressure`.\n"
[inputs.gas_t]
unit = "K"
description = "the gas feed's temperature.\n"
[inputs.solvent_components]
type = "components"
description = "the solvent's substances, by name, in the gas's own order.\n"
[inputs.solvent_n]
unit = "mol/s"
description = "the solvent feed's molar flow.\n"
[inputs.solvent_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the solvent feed's composition.\n"
[inputs.solvent_p]
unit = "Pa"
description = "the solvent feed's pressure.\n"
[inputs.solvent_t]
unit = "K"
description = "the solvent feed's temperature.\n"
[inputs.number_of_stages]
unit = "dimensionless"
description = "the actual trays, which the constructor requires to be positive; a tray is numbered 0 at the bottom, where the gas enters, to `number_of_stages - 1`, where the solvent enters.\n"
[inputs.top_pressure]
unit = "Pa"
description = "the pressure at the top stage, inherited from `DistillationColumn.setTopPressure`.\n"
[inputs.bottom_pressure]
unit = "Pa"
description = "the pressure at the bottom stage. The class's own tests state the same value for both.\n"
[inputs.tray_temperatures]
type = "vector"
unit = "K"
length = "one per tray"
optional = true
description = "one outlet-temperature pin per tray, `NaN` where a tray has none - `SimpleTray.setOutletTemperature`, which an isothermal absorber states for every stage. **A pinned column stops after its first sweep**, because the gate is the tray-temperature change it has made zero.\n"
[inputs.temperature_tolerance]
unit = "K"
description = "the convergence gate on the mean tray-temperature change. Where a solve stops is what its answer is, so this is a measurement and not a knob: at the classes' own `1e-2` K the two libraries stop at two different points on a slowly-converging sequence.\n"
[inputs.max_iterations]
unit = "dimensionless"
description = "the iteration cap. A solve that reaches it without meeting the gate is refused, with its residuals named.\n"
[inputs.murphree_efficiency]
unit = "dimensionless"
optional = true
description = "the column-wide Murphree tray efficiency. **`AbsorptionColumn.applyMurphreeCorrection` is an override**, not the base's: both phases are blended and the flash's vapour moles are re-allocated across the components.\n"
[inputs.component_murphree_efficiency]
type = "vector"
unit = "dimensionless"
length = "one per component"
optional = true
description = "one efficiency per component, which `setComponentMurphreeEfficiency(String, double)` sets. `getComponentMurphreeEfficiency` reads this, then the base's per-tray and column-wide pair - the class's other overload writes a per-tray-per-component map this entry has no spelling for.\n"
[inputs.max_allowable_gas_load_factor]
unit = "dimensionless"
optional = true
description = "the `Fs`-factor the gas load is checked against. **It does not enter the solve**: `isGasLoadFactorWithinDesignLimit`, `getGasLoadFactorUtilization` and `getMinimumDiameterForGasLoadLimit` read it and none of them is on the run path. The class defaults it to 0.15.\n"
[inputs.reactive]
type = "boolean"
optional = true
description = "**whether the middle trays flash reactively** - `DistillationColumn.setReactive(true)`, inherited and not overridden. The ends never do. Measured: the section is either the plain flash or a divergence - see the notes.\n"
[inputs.reactive_start_tray]
unit = "dimensionless"
optional = true
description = "the first reactive middle tray, 0-based among the middle trays, with `reactive_end_tray` its inclusive last. **Both bounds or neither.** An absorber has no ends, so every stage is a middle tray.\n"
[inputs.reactive_end_tray]
unit = "dimensionless"
optional = true
description = "the last reactive middle tray, inclusive.\n"
[inputs.solver_type]
type = "enum"
values = ["direct_substitution", "damped_substitution", "inside_out", "matrix_inside_out", "wegstein", "sum_rates", "newton", "naphtali_sandholm", "mesh_residual", "auto"]
optional = true
description = "which of the base's ten solving strategies runs, by the same names `process.distillation_column` declares. **`direct_substitution` is the class's own default**; `naphtali_sandholm` refuses here, because a column with no pinned reboiler runs `solveBubblePointMethod`.\n"
[inputs.tray_murphree_efficiency]
type = "vector"
unit = "dimensionless"
length = "one per stage, the reboiler at index 0"
optional = true
description = "one override per stage, `NaN` where a stage falls through to `murphree_efficiency` - `DistillationColumn.setMurphreeEfficiencies`, whose own resolution is `getEffectiveMurphreeEfficiency`. A length that is not the stage count is refused, and a value outside `[0, 1]` is clamped rather than refused.\n"
[inputs.gas_side_draw_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray, a zero where a tray draws nothing"
optional = true
description = "**the vapour each tray withdraws from its own outlet**, which `setGasSideDrawFraction` states as a fraction of the phase: a draw has the tray's composition, temperature and pressure and a different flow. **A fraction on an end is refused.**\n"
[inputs.liquid_side_draw_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray"
optional = true
description = "the liquid each tray withdraws as a side draw, from the same liquid a pumparound takes from: **the two are bounded together** by `validateLiquidSplitFractions` and may not sum above one.\n"
[inputs.pumparound_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray"
optional = true
description = "the liquid each tray withdraws as a pumparound. **The return is ported**: `pumparound_*` below states the tray it comes back to, its fraction and its temperature drop, and the column iterates the recycle.\n"
[inputs.side_draw_flow_tray]
unit = "dimensionless"
optional = true
description = "**the tray whose draw flow is specified**, which `addSideDrawFlowSpecification(tray, phase, flow, unit)` takes. Omitted means every draw stays a *fraction* of its stage's own phase, decided once - which is what the three fraction vectors above are.\n"
[inputs.side_draw_flow_phase]
type = "enum"
values = ["gas", "liquid"]
optional = true
description = "which of the stage's two phases the specification controls, `SideDrawPhase`. **Stated with the tray and the target or not at all**: a target without a phase is a declaration that cannot be read.\n"
[inputs.side_draw_flow_target]
unit = "kg/s"
optional = true
description = "the mass flow the draw must deliver - `getSideDrawStream(tray, phase).getFlowRate(unit)`, so a **mass** rate and not a molar one. The column moves the draw's fraction until the draw delivers it.\n"
[inputs.side_draw_flow_tolerance]
unit = "dimensionless"
optional = true
description = "the relative residual the search stops at. **Omitted means `1e-4`**, which is `ColumnSideDrawSpecification`'s own field initialiser.\n"
[inputs.side_draw_flow_max_iterations]
unit = "dimensionless"
optional = true
description = "the candidate cap for this specification. **Omitted means `12`**, the class's own field initialiser; the tear's own cap is the largest of it and `maxColumnTearIterations`.\n"

[inputs.pumparound_return_tray]
unit = "dimensionless"
optional = true
description = "**the tray the pumparound's liquid comes back to**, which `addLiquidPumparound(name, drawTray, returnTray, fraction, drop)` takes. **Stated with the draw tray, the fraction and the drop or not at all.**\n"
[inputs.pumparound_draw_tray]
unit = "dimensionless"
optional = true
description = "the tray the pumparound's liquid leaves. It must be a middle tray: the ends here are `column::reboiler` and `column::condenser` rather than stages.\n"
[inputs.pumparound_draw_fraction]
unit = "dimensionless"
optional = true
description = "the fraction of the draw tray's liquid withdrawn, which `setLiquidPumparoundDrawFraction` states on the tray - the same vector `pumparound_fractions` writes.\n"
[inputs.pumparound_temperature_drop]
unit = "K"
optional = true
description = "the drop from the draw to the return, which `updateReturnStream` subtracts before re-flashing. **The cooler's duty is the enthalpy between the two streams.**\n"
[inputs.pumparound_tolerance]
unit = "dimensionless"
optional = true
description = "the relative return-flow change the outer loop stops at. **Omitted means `1e-4`**, which is `pumparoundTolerance`'s own field initialiser.\n"
[inputs.pumparound_max_iterations]
unit = "dimensionless"
optional = true
description = "the outer loop's cap. **Omitted means `12`**, `maxPumparoundIterations`' own initialiser.\n"

[outputs]
[outputs.tray_temperature]
type = "vector"
unit = "K"
length = "one per tray, the gas end at stage 0"
description = "the solved temperature profile, which is what an absorber's answer is rather than a scalar.\n"
[outputs.tray_pressure]
type = "vector"
unit = "Pa"
length = "one per tray"
description = "each tray's pressure, the linear profile between `bottom_pressure` and `top_pressure`.\n"
[outputs.tray_gas_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the vapour leaving each tray, which is its upward traffic.\n"
[outputs.tray_liquid_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid leaving each tray, which is its downward traffic.\n"
[outputs.gas_out_n]
unit = "mol/s"
description = "the treated gas, which is the top tray's own vapour.\n"
[outputs.gas_out_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the treated gas's composition.\n"
[outputs.gas_out_p]
unit = "Pa"
description = "the treated gas's pressure, which is `top_pressure`.\n"
[outputs.gas_out_t]
unit = "K"
description = "the treated gas's temperature, which is the top tray's own.\n"
[outputs.gas_out_h]
unit = "J/mol"
description = "the treated gas's molar enthalpy at its own state.\n"
[outputs.liquid_out_n]
unit = "mol/s"
description = "the loaded solvent, which is the bottom tray's own liquid.\n"
[outputs.liquid_out_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the loaded solvent's composition.\n"
[outputs.liquid_out_p]
unit = "Pa"
description = "the loaded solvent's pressure, which is `bottom_pressure`.\n"
[outputs.liquid_out_t]
unit = "K"
description = "the loaded solvent's temperature.\n"
[outputs.liquid_out_h]
unit = "J/mol"
description = "the loaded solvent's molar enthalpy at its own state.\n"
[outputs.iterations]
unit = "dimensionless"
description = "the iterations taken. **One sweep where every tray is pinned**, which is what the class's own isothermal rows are.\n"
[outputs.temperature_residual]
unit = "K"
description = "the mean tray-temperature change at the last iteration - the gate the solve was held to.\n"
[outputs.mass_residual]
unit = "dimensionless"
description = "the products' worst component imbalance against both feeds, relative.\n"
[outputs.energy_residual]
unit = "dimensionless"
description = "`|H_feeds - H_products| / |H_feeds|`, the enthalpy closure.\n"
[[valid_range]]
quantity = "number_of_stages"
min = 1
min_inclusive = true
severity = "error"
rationale = "an absorber with no trays is not an absorber\n"
[[valid_range]]
quantity = "top_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[[valid_range]]
quantity = "bottom_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[[valid_range]]
quantity = "temperature_tolerance"
min = 0
min_inclusive = false
severity = "error"
rationale = "a convergence tolerance is positive, and zero is a solve that never stops\n"
[[valid_range]]
quantity = "gas_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature\n"
[[valid_range]]
quantity = "solvent_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature\n"
[implementations]
python = "azoth.process.absorption_column"
rust = "azoth_process::absorption_column"

