id: process.splitter
name: Splitter
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.splitter.Splitter`, `run(UUID)` at lines 376-438 of the
    3.20.0 source tree.
  edition: >
    Version 3.20.0. Taken from it: the component-mole scaling by the split factor
    (`:420-425`), the inherited temperature and pressure (`:407`), and the flash of each
    branch (`:427`). Not taken: the conversion of a fixed-flow specification into
    fractions (`:385`), and the sanitising of the factors (`:388-404`) - see the notes.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Splitter.java` lines
    376-438.'
  - '`eos.pt_flash` - the isothermal flash this model runs, once.'

algorithm:
  scheme: flow_scaled_isothermal_flash
  initialisation: wilson
  convergence: absolute
  tolerance: 1.0e-10
  max_iterations: 300
  inner:
    scheme: rachford_rice_bisection
    convergence: absolute
    tolerance: 1.0e-14
    max_iterations: 200

inputs:
  components:
    type: components
    length: one entry per component
    description: >
      the substances the mixture is made of, by name, resolved against the component
      databank this library ships (`data/components/`, compiled from NeqSim's COMP.csv
      and INTER.csv) with the loaded keycard's overrides applied. The critical
      constants, the acentric factors, the binary interaction parameters and the
      ideal-gas heat-capacity coefficients all come from there.

      **A name, rather than nine parallel vectors of numbers.** Until this input
      existed, `Tc`, `Pc`, `omega`, `kij` and `cp_a`..`cp_e` were retyped into every
      spec and every case - numbers in a YAML file that nothing could check against
      anything, and that in fact disagreed with the databank. `azoth.eos.components`
      lists what is available; a keycard adds a substance the databank does not have.
  T:
    unit: K
    description: the feed's absolute temperature, and every branch's
  P:
    unit: Pa
    description: the feed's absolute pressure, and every branch's
  n:
    unit: mol/s
    description: the feed's molar flow rate, which the fractions divide
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions, and every branch's
  fractions:
    type: vector
    unit: dimensionless
    length: one per branch
    description: >
      the share of the feed each branch takes, **summing to one**. Checked rather than
      corrected - see the notes for why NeqSim's normalising is right for its context and
      wrong here.

outputs:
  T:
    unit: K
    description: the temperature every branch leaves at - the feed's
  P:
    unit: Pa
    description: the pressure every branch leaves at - the feed's
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the feed is in, and so the phase of every branch
  beta:
    unit: dimensionless
    description: the vapour fraction, absent for a single-phase feed
  flows:
    type: vector
    unit: mol/s
    length: one per branch
    description: each branch's molar flow, in the order the fractions were given
  iterations:
    unit: dimensionless
    description: flash iterations taken

valid_range:
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      a flow of zero moles has nothing to divide. The branches would all be zero and the
      fractions would have nothing to act on - a splitter with no feed is not a splitter.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states

assumptions:
  - '**one flash, not one per branch.** NeqSim flashes each branch (`Splitter.java:427`)
    and has to, because its streams are mutable objects a caller may have written to
    between the split and the flash. Here every branch is at the same temperature,
    pressure and composition by construction, and an isothermal flash is a function of
    exactly those three - so `S` flashes would return `S` copies of one answer. This runs
    it once. A splitter whose branches were at different states would be `S` separators,
    not one splitter.'
  - '**the fractions are exact, not normalised.** See the notes.'
  - '**no pressure drop.** Each branch leaves at the feed pressure. A splitter with a
    drop on a branch is this model with a `process.throttling_valve` after it.'
  - '**no ideal-gas block**, because no energy balance is done. A caller supplies no
    `Cp/R` polynomial and no reference state, and that is a statement about the model
    rather than an omission.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

implementations:
  python: azoth.process.splitter
  rust: azoth_process::splitter
