id: process.pump
name: Pump
kind: procedure

description: >
  A pressure rise in a liquid, at a stated isentropic efficiency.

  The same procedure as `process.compressor` - see that spec for the derivation and
  `crates/azoth-process/src/isentropic.rs` for the shared code - applied to a stream that
  is liquid rather than gas. What differs is the answer rather than the arithmetic: a
  liquid is nearly incompressible, so the ideal enthalpy rise is small and the
  temperature barely moves, while the power is not small at all.

  A pump is a separate model from a compressor because a caller should be able to read
  which one they are running, and because NeqSim has a separate class for it with a
  default path that happens to be the same arithmetic.

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.pump.Pump`, `run(UUID)` at lines 515-677 of a 1,700-line
    file, and specifically its default path at `:558-572`.
  edition: >
    Version 3.20.0. Taken from it: `PSflash(entropy)` at the outlet pressure (`:563`),
    `dH = (H_is - H_in) / efficiency` (`:566`) and `PHflash(H_in + dH)` (`:572`). The
    default path is the one taken when `calculateAsCompressor` is true, which it is by
    default (`:114`). Not taken: the pump-curve path (`:573-644`), the simple
    pressure-rise path (`:645-664`) and the fixed-outlet-temperature path (`:549-556`).

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Pump.java` lines 515-677.'
  - '`process.compressor` - the same procedure, and the spec where its derivation is
    written down rather than repeated here.'
  - '`hydraulics.pump_power` - the incompressible head-power calculation, which is the
    NeqSim path this model does **not** take. A caller who wants that one has it, and it
    is a different model rather than a different answer.'

algorithm:
  scheme: isentropic_efficiency_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: the constant term of each component's `Cp/R` polynomial
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: each component's ideal-gas molar entropy at `T_ref` and `P_ref`. Used.
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    unit: K
    description: the inlet absolute temperature
  P:
    unit: Pa
    description: the inlet absolute pressure. The outlet must be **above** it.
  n:
    unit: mol/s
    description: the inlet molar flow rate, which turns the molar enthalpy change into a power
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the inlet mole fractions
  outlet_pressure:
    unit: Pa
    description: the pressure the pump delivers. Must be strictly above `P`.
  efficiency:
    unit: dimensionless
    description: >
      the **isentropic** efficiency, in `(0, 1]`. Required rather than defaulted, for the
      reason `process.compressor` records: NeqSim defaults it to one and clamps.

outputs:
  T:
    unit: K
    description: >
      the outlet temperature. Above the inlet by a small amount - the ideal rise for a
      liquid is tiny and the loss scales it - but computed rather than assumed zero, which
      is the point of running the flash.
  P:
    unit: Pa
    description: the outlet pressure - the specification, not an answer
  power:
    unit: W
    description: >
      the shaft power, signed and positive here - the fluid is receiving it. The same
      convention `process.compressor` uses, so the three machines can be summed in a
      flowsheet without a rule about which sign means what.
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase stream
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the stream is in at the outlet
  isentropic_temperature:
    unit: K
    description: the temperature the fluid would have reached at unit efficiency
  iterations:
    unit: dimensionless
    description: flash iterations taken, summed over the two flashes this model runs

valid_range:
  - quantity: efficiency
    min: 0.0
    min_inclusive: false
    max: 1.0
    max_inclusive: true
    severity: error
    rationale: >
      an efficiency above one is a machine that beats the second law, and zero makes the
      ideal enthalpy change infinite. NeqSim's setter assigns without clamping here
      (`Pump.java:854`), which is worse than clamping rather than better.
  - quantity: outlet_pressure
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: a flow of zero moles has no power to compute

assumptions:
  - '**the inlet is a liquid.** Nothing checks it. A pump run on a vapour is arithmetically
    fine - the same flashes run - and returns a pressure rise nobody can achieve with a
    pump. A caller who needs the check has `eos.stability_test` and a phase-boundary model.'
  - '**one stage at one efficiency**, and no NPSH calculation. Whether the pump cavitates
    depends on the suction pressure against the vapour pressure, which is
    `eos.bubble_pressure`, and it is a separate question this model does not ask.'
  - '**the isentropic path, not the pump curve.** A real pump is specified by a
    head-flow curve; this model is told an efficiency and a pressure instead. That is the
    NeqSim default and it is what can be checked without a manufacturer''s data.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

notes: >
  # Why a liquid pump runs an entropy flash at all

  Because the temperature rises, slightly, and the model should say by how much rather
  than assume zero. For this mixture at 300 K, 20 to 30 bar at an efficiency of 0.8 the
  rise is **1.34 K** - small, real, and free here, since the flash this runs is the same
  one a compressor runs.

  The alternative - NeqSim's simple pressure-rise path, `dP * volumetric flow / efficiency`
  - takes the fluid as incompressible and would give a slightly different answer with a
  different justification. `hydraulics.pump_power` is that calculation, and it is a
  *calculation* rather than a model because it is one line. Neither is wrong; they are
  different models, and a caller should be able to tell which they are running.

  # What is checked, and what is not

  The same two identities as `process.compressor`, computed in the test from
  `eos.ps_flash` and `eos.molar_enthalpy_entropy` independently of this model: that the
  ideal state is isentropic, and that the efficiency divides. The compressor spec records
  why those two and not a recorded number.

  The recorded case pins the magnitude, which for a pump is the part that is easy to get
  wrong by a factor: the power is in kilowatts and the temperature rise is in kelvin, and
  a model that mixed them up would still produce plausible-looking numbers for both.

implementations:
  python: azoth.process.pump
  rust: azoth_process::pump

cases:
  - id: twenty_to_thirty_bar_at_eighty_percent
    note: >
      Methane/n-butane liquid at 300 K, pumped from 20 to 30 bar at an isentropic
      efficiency of 0.8. The ideal outlet is **314.26 K**, the real one **315.60 K**, and
      the power is **8.29 kW** at 10 mol/s.

      The temperature rise of 1.34 K across a 10 bar rise is the part worth reading: it
      is small, it is real, and a model that assumed a pump were isothermal - which is the
      usual hand calculation - would be wrong by exactly that.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 300.0
      P: 2000000.0
      n: 10.0
      z: [0.6, 0.4]
      outlet_pressure: 3000000.0
      efficiency: 0.8
    expected:
      T: 315.60042991638187
      P: 3000000.0
      power: 8294.833590884116
      isentropic_temperature: 314.25679302215576
    tolerance: 1.0e-9

  - id: a_liquid_feed_is_pumped
    note: >
      A butane-rich feed (z = 0.2/0.8) at 300 K, pumped from 40 to 50 bar. This feed is
      single-phase liquid at both ends, which is the branch the case above does not
      reach: there the feed is two-phase, so its enthalpy is a split rather than one
      phase's.

      The ideal outlet is **300.99 K**, the real one **301.27 K**, and the power is
      **1.12 kW** at 10 mol/s - small next to a compressor's, because a liquid is nearly
      incompressible and the work goes into pressure rather than volume.

      The state is not arbitrary: at 50 bar and the same composition the model raises
      rather than answering, because one temperature on the isentropic search's scan does
      not converge. That is recorded in the defect log rather than worked around here.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 300.0
      P: 4000000.0
      n: 10.0
      z: [0.2, 0.8]
      outlet_pressure: 5000000.0
      efficiency: 0.8
    expected:
      T: 301.2741340637207
      P: 5000000.0
      power: 1124.4762812424597
      isentropic_temperature: 300.99279785156244
    tolerance: 1.0e-9
