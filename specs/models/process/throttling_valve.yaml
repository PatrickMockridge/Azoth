id: process.throttling_valve
name: Throttling valve
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.valve.ThrottlingValve`, `run(UUID)` at lines 363-453 of the
    3.20.0 source tree, and the isenthalpic flash inside it at `:467-495`.
  edition: >
    Version 3.20.0. Taken from it: the pressure drop (`:407-412`), the clamp that stops a
    valve raising the pressure unless asked to (`:424-432`), and `PHflash(H_in)` at the
    outlet pressure (`:470`). Not taken: the IEC 60534 capacity calculation, the
    fixed-Kv outlet-pressure solve and the transient response.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ThrottlingValve.java`
    lines 363-453.'
  - '`eos.ph_flash` - the isenthalpic flash this model is, and the model its answer comes
    from directly.'
  - '`hydraulics.control_valve_cv` - the IEC 60534 sizing this model deliberately does
    not do. The capacity of a valve and the state of the stream through it are two
    questions, and this library answers them separately.'

algorithm:
  scheme: isenthalpic_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      the constant term of each component's `Cp` polynomial, in J/(mol*K). Together
      with the four below, this is everything the ideal-gas enthalpy and entropy are
      integrated from - there is no separate datum, because NeqSim's is a fixed
      reference temperature rather than a value a caller supplies.
  cp_b:
    type: vector
    unit: J/(mol*K**2)
    length: one per component
    description: the coefficient of `T`, in J/(mol*K**2)
  cp_c:
    type: vector
    unit: J/(mol*K**3)
    length: one per component
    description: the coefficient of `T**2`, in J/(mol*K**3)
  cp_d:
    type: vector
    unit: J/(mol*K**4)
    length: one per component
    description: the coefficient of `T**3`, in J/(mol*K**4)
  cp_e:
    type: vector
    unit: J/(mol*K**5)
    length: one per component
    description: the coefficient of `T**4`, in J/(mol*K**5)
  T:
    unit: K
    description: the feed's absolute temperature
  P:
    unit: Pa
    description: the feed's absolute pressure, before the drop
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions. Checked rather than renormalised.
  pressure_drop:
    unit: Pa
    description: >
      the pressure the valve drops. **There is no flow rate in this model's inputs**,
      and that is a statement about the physics rather than a saving: an isenthalpic
      flash is a molar property, so the outlet state does not depend on the flow at all,
      and neither does it change the flow or the composition.

outputs:
  T:
    unit: K
    description: >
      the outlet temperature. Below the inlet's for a real gas at ordinary conditions,
      and computed rather than assumed - see the notes.
  P:
    unit: Pa
    description: the outlet pressure, `P - pressure_drop`
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the stream is in at the outlet
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase stream
  iterations:
    unit: dimensionless
    description: flash iterations taken

valid_range:
  - quantity: pressure_drop
    min: 0.0
    min_inclusive: true
    severity: error
    rationale: >
      a throttling valve drops pressure. NeqSim has an `acceptNegativeDp` flag
      (`ThrottlingValve.java:424-432`) for the transient case; a steady-state model that
      admitted a rise would let a caller model a compressor by accident and get an answer
      that is arithmetically fine and physically nonsense.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute pressure. A drop that takes the outlet to or below zero is caught by
      the flash, whose own check on a non-positive pressure is the one that matters.

assumptions:
  - '**the valve is adiabatic.** No heat crosses its boundary, which is what makes the
    flash isenthalpic. A valve that exchanges heat with its surroundings is a valve plus
    a `process.heater`, which is the same physics composed rather than a new model.'
  - '**the flow rate does not enter.** Neither the outlet state nor the outlet flow
    depends on it. NeqSim computes a molar flow here too and applies it only on the
    transient path.'
  - '**the composition is unchanged**, so the model reports none of it back.'
  - '**no capacity calculation.** Whether the valve can pass this flow at this drop is
    `hydraulics.control_valve_cv`, and it is a separate question that this model does not
    ask. A caller who needs it runs both.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

implementations:
  python: azoth.process.throttling_valve
  rust: azoth_process::throttling_valve
