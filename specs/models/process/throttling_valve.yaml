id: process.throttling_valve
name: Throttling valve
kind: procedure

description: >
  A stream's pressure dropped at constant enthalpy.

  The classic Joule-Thomson device, and the reason it is worth a model rather than a
  subtraction: for a real gas the temperature falls, and by how much is a property of the
  equation of state rather than of the valve. A model that returned the inlet temperature
  would be wrong at every real state and would look right on a worked example that never
  checked it.

  The physics is one `PHflash` at the reduced pressure, which is why this unit could not
  be written before `eos.ph_flash` existed.

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.valve.ThrottlingValve`, `run(UUID)` at lines 363-453 of the
    3.20.0 source tree, and the isenthalpic flash inside it at `:467-495`.
  edition: >
    Version 3.20.0. Taken from it: the pressure drop (`:407-412`), the clamp that stops a
    valve raising the pressure unless asked to (`:424-432`), and `PHflash(H_in)` at the
    outlet pressure (`:470`). Not taken: the IEC 60534 capacity calculation, the
    fixed-Kv outlet-pressure solve and the transient response.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `ThrottlingValve.java`
    lines 363-453.'
  - '`eos.ph_flash` - the isenthalpic flash this model is, and the model its answer comes
    from directly.'
  - '`hydraulics.control_valve_cv` - the IEC 60534 sizing this model deliberately does
    not do. The capacity of a valve and the state of the stream through it are two
    questions, and this library answers them separately.'

algorithm:
  scheme: isenthalpic_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: the constant term of each component's `Cp/R` polynomial
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      each component's ideal-gas molar entropy at `T_ref` and `P_ref`. **Not used** - an
      isenthalpic flash needs no entropy - and required because it belongs to the same
      ideal-gas model the enthalpy comes from.
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    unit: K
    description: the feed's absolute temperature
  P:
    unit: Pa
    description: the feed's absolute pressure, before the drop
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions. Checked rather than renormalised.
  pressure_drop:
    unit: Pa
    description: >
      the pressure the valve drops. **There is no flow rate in this model's inputs**,
      and that is a statement about the physics rather than a saving: an isenthalpic
      flash is a molar property, so the outlet state does not depend on the flow at all,
      and neither does it change the flow or the composition.

outputs:
  T:
    unit: K
    description: >
      the outlet temperature. Below the inlet's for a real gas at ordinary conditions,
      and computed rather than assumed - see the notes.
  P:
    unit: Pa
    description: the outlet pressure, `P - pressure_drop`
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the stream is in at the outlet
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase stream
  iterations:
    unit: dimensionless
    description: flash iterations taken

valid_range:
  - quantity: pressure_drop
    min: 0.0
    min_inclusive: true
    severity: error
    rationale: >
      a throttling valve drops pressure. NeqSim has an `acceptNegativeDp` flag
      (`ThrottlingValve.java:424-432`) for the transient case; a steady-state model that
      admitted a rise would let a caller model a compressor by accident and get an answer
      that is arithmetically fine and physically nonsense.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute pressure. A drop that takes the outlet to or below zero is caught by
      the flash, whose own check on a non-positive pressure is the one that matters.

assumptions:
  - '**the valve is adiabatic.** No heat crosses its boundary, which is what makes the
    flash isenthalpic. A valve that exchanges heat with its surroundings is a valve plus
    a `process.heater`, which is the same physics composed rather than a new model.'
  - '**the flow rate does not enter.** Neither the outlet state nor the outlet flow
    depends on it. NeqSim computes a molar flow here too and applies it only on the
    transient path.'
  - '**the composition is unchanged**, so the model reports none of it back.'
  - '**no capacity calculation.** Whether the valve can pass this flow at this drop is
    `hydraulics.control_valve_cv`, and it is a separate question that this model does not
    ask. A caller who needs it runs both.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

notes: >
  # The temperature is the whole point

  A throttling valve is where the Joule-Thomson coefficient shows up as an engineering
  number, and the port's worked case is chosen to make that visible: methane/n-butane at
  300 K and 20 bar falls to **293.91 K** across a 5 bar drop. Fifteen hundredths of a
  kelvin per bar, computed and not assumed.

  A model that returned the inlet temperature would agree with this one at zero drop and
  at an ideal gas, which is exactly why the case is not either of those.

  # What is checked, and what is not

  The identity is the check: `H(T_out, P_out) == H(T_in, P_in)`, because that is what
  the model claims. The test computes the inlet enthalpy and the outlet enthalpy from
  `eos.molar_enthalpy_entropy` independently of this model and requires them equal, at
  several drops. **That establishes that the flash inverts the enthalpy it was given.**
  It does not establish that the enthalpy is right, and the confidence in it is whatever
  `eos.molar_enthalpy_entropy`'s own notes support.

  The recorded case is the second check and it is weaker: it says the model still does
  what it did when the number was written.

  # A bug this model found in `eos.ph_flash`

  The valve was the first caller to run an isenthalpic flash at a pressure below 20 bar,
  and it failed: `eos.ph_flash`'s bracket scan evaluates temperatures from 100 K upward
  and aborted the whole search when one of them had no admissible liquid root. On this
  mixture at 15 bar that happens at 160 K and nowhere else between 100 K and 400 K - a
  single temperature, not a range - and the scan hit it and raised.

  That was a defect in `eos.ph_flash` and not in this model. A temperature with no state
  has no property, so it cannot bracket anything and cannot be compared against the
  target; the scan now skips such a point and keeps the previous *evaluable* one. The
  fix is recorded here because this model is what exposed it, and because the failure
  looked like a caller's error rather than a gap in the search.

implementations:
  python: azoth.process.throttling_valve
  rust: azoth_process::throttling_valve

cases:
  - id: a_five_bar_drop_cools_the_stream
    note: >
      Methane/n-butane at 300 K and 20 bar, dropped to 15 bar. The outlet is **293.91 K**
      - cooler by 6.09 K, which is the Joule-Thomson effect and is the assertion. The
      stream is still two-phase at the outlet, so the case also pins that the drop did
      not change how much of it is liquid.

      The number is not a recorded measurement of this model: it is what
      `eos.molar_enthalpy_entropy` gives at the outlet state, and the test that matters
      recomputes the enthalpy balance rather than comparing against it.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 300.0
      P: 2000000.0
      z: [0.6, 0.4]
      pressure_drop: 500000.0
    expected:
      T: 293.9107699394226
      P: 1500000.0
    tolerance: 1.0e-9

  - id: no_drop_leaves_the_stream_alone
    note: >
      The same feed with nothing dropped. The outlet state is the inlet state, and the
      temperature is 300 K **exactly** rather than to a tolerance - an isenthalpic flash
      at the pressure the enthalpy was measured at is a round trip, and this is the case
      that catches a model which subtracts a drop it was not given.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 300.0
      P: 2000000.0
      z: [0.6, 0.4]
      pressure_drop: 0.0
    expected:
      T: 300.0
      P: 2000000.0
    tolerance: 1.0e-7
