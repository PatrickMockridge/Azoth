id = "process.filter"
name = "Filter"
kind = "direct"
assumptions = [
    "**an inlet carries four of the record's five fields and an outlet all five.** `h` is a state function of `(T, P, z)` - the same flash decides it - so accepting one would let a case hand over a state that does not exist.",
    "**it holds the temperature, which is what separates a filter from a throttling valve.** `run` sets the reduced pressure and runs a `TPflash`, so the outlet is at the feed's temperature and its enthalpy moves; a valve holds the enthalpy. Measured: `24.8` J/mol per bar.",
    "**a drop larger than the inlet pressure is clamped rather than refused.** `run` applies `min(max(0, dP), max(0, P_in - 1e-6 bar))` and logs, so the outlet lands a millionth of a bar above vacuum; `applied_drop` reports it and the model warns when it differs from the request.",
    "**and that clamped state is one no cubic can evaluate.** NeqSim extrapolates to `1968.3` J/mol there and azoth's does not converge (`1.9e-9` against `1e-12`), so the port reproduces the clamp and the flash after it refuses.",
    "**a drop below the class's own `1e-10` bar threshold runs no flash at all** and the outlet is the cloned inlet. A `TPflash` at the same state *is* that state, so this has no second branch and the two agree exactly - which the capture's second row is.",
    "**the capture is `updateParticleCapturePerformance`.** A beta-ratio curve or a scalar efficiency gives the nominal removal; the **current** efficiency is that nominal retained by breakthrough and bypass, and the outlet concentration and captured rate use it.",
    "Both are zero unless `inlet_particle_concentration` is stated; a generic `solids_loading_rate` source is slice B's and never fills them.",
    "**`Cv` is not an output.** `run` computes `sqrt(dP) / massFlow`, a number whose unit (`bar**0.5 * hr / kg`) this library has no dimension for; the standard flow coefficient is `hydraulics.control_valve_cv`'s. It is a function of two values the result already carries.",
    "**the clean drop is one of `FilterPressureDropModel`'s four branches.** `FIXED` returns the configured drop, `FLOW_SCALED` scales it by `(Q/Q_ref)^n`, `TABULATED` interpolates a measured curve, and `ERGUN` is the packed-bed correlation.",
    "the fluid is PR with the classic mixing rule, because `Stream::mixture()` resolves `databank::mixture_of(names, Cubic::Pr, None)` and has no other route.",
    "**`run` reads a carried loading state.** A positive finite `loading_capacity` turns `solids_loading` into a fraction, and `pressure_drop_increase_at_capacity * fraction` joins the clean drop; with the default infinite capacity that term is zero.",
    "**Breakthrough starts at a fraction of the capacity, not at the capacity.** It is zero at or below `breakthrough_start_fraction` (default 0.8, clamped to `[0, 0.999999]`) and `(fraction - start)/(1 - start)` above, capped at one.",
    "**Bypass opens above its cracking drop and reads the unclamped drop.** The bypassed fraction is `1 - sqrt(cracking/unrestricted)`, and the class sets the applied drop to the cracking pressure; `run` clamps that drop to the inlet ceiling afterwards, so the order is bypass then clamp.",
    "**The efficiency is the nominal one retained by breakthrough and bypass.** It is `nominal (1 - breakthrough) (1 - bypass)`, clamped to `[0, 1]`, and the capture's two outputs use it - so a loaded or bypassing filter reports less than its nominal removal.",
    "**The replacement check reads the unrestricted drop.** It is `unrestricted/terminal >= 1` (terminal defaults to 5 bar) or `loading_fraction >= 1`, so a bypass that lowers the applied drop does not postpone the replacement.",
    "**The element-integrity pair is read by the design, not by `run`.** `element_collapse_pressure` divides the unrestricted drop and `element_integrity_verified` suppresses a design warning; the steady run reads neither.",
    "**`calcDesign` is caller-invoked and absent unless `mechanical_design`.** It reads the inlet's volumetric flow and density, the type's defaults and the run's loading state; it does not change the run's outlet.",
    "**The type's eight constructions carry the design defaults.** Face velocity and element area are the two a caller can override; the element envelope diameter and length are the type's. Granular types size one element and the vessel cross-section.",
    "**`setFilterServiceType` also selects the class's pressure-drop model and exponent**, while this id's `filter_type` feeds the design only: the run's model selector is explicit, so a granular type's ERGUN run is the caller's to state.",
    "**The element count is `ceil(requiredArea/elementArea)`, at least `number_of_elements`.** The bundle is `sqrt(n) * diameter * 1.8`, the inside diameter is `bundle + 0.2`, floored at 0.5 m.",
    "**The L/D ratios clamp the length or the diameter.** Below the minimum the vessel lengthens; above the maximum it widens. A granular design then recomputes the cross-section, published as `design_media_area`.",
    "**The nozzle velocity is 20 m/s below 200 kg/m3 and 3 m/s above it**, unless stated; the required diameter rounds up through the class's 21 nominal sizes from 15 to 1200 mm.",
    "**The pressure boundary is the class's ASME-shaped screening.** `P = (designPressure_bara - 1.01325) * 0.1` MPa against an allowable stress in MPa, a 6 mm shell floor, and a head floored at the shell.",
    "**The weights are 7850 kg/m3 of shell and head, plus 30% accessories, plus the elements**: 10 kg per metre of element floored at 2 kg, or granular media at 1000 kg/m3 (500 for activated carbon).",
    "**The design's warnings are warnings, in the class's order**: the two utilizations, a terminal setting above the collapse rating, the face and nozzle limits, missing integrity, and missing performance data.",
    "Outside this id: the cost arithmetic (USD), the material grade (stored and reported, read by no formula), and the type's default pressure-drop selector.",
    "**A non-positive `loading_capacity` is a sentinel, not a clamp.** The setter turns it into positive infinity, so no finite capacity is checked and the fraction is zero; the other loading setters clamp negatives to zero.",
    "**The class's `runTransient` is one step here.** A positive `time_step` accretes the captured rate over the interval, subtracts the active backwash and regeneration removals, floors at zero, then runs the loaded state; the session loop is outside the id.",
    "**The accretion uses the pre-step efficiency, and the report uses the post-step one.** `runTransient` runs once to compute the captured rate, integrates it, then runs again - so a concentration model's reported capture need not equal the loading increment.",
    "**The generic `solids_loading_rate` fills no capture output.** It feeds the accretion when no concentration is stated, and `captured_rate` and `outlet_particle_concentration` stay zero, as the class's disabled concentration model leaves them.",
    "**`holdup_residence_time` is the holdup over the inlet flow.** Zero without a holdup, and **absent where the flow is zero and the holdup positive**: the class returns positive infinity and JSON cannot carry it.",
    "`resetDynamicState` is the zeroed state - absent loading, zero rates, inactive backwash and regeneration, no step.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/equipment/filter/Filter.java` is the port source, through its steady-state `run`.",
    "`validation/neqsim/captures/process_filter.tsv` - three rows: an ordinary drop, none at all, and one larger than the inlet pressure.",
    "`validation/neqsim/captures/process_filter_loading.tsv` - seven blocks: a loaded run, the bypass run, the disabled capacity sentinel, the two replacement branches, the breakthrough boundary, and an uncased clamp-after-bypass block.",
    "`validation/neqsim/captures/process_filter_dynamic.tsv` - the one-step branch: the two sequential generic-rate steps, backwash plus regeneration, the concentration sequencing, the pre-step bypass and an uncased zero-flow residence.",
    "`validation/neqsim/captures/process_filter_mechanical_design.tsv` - nine design blocks: a coalescer, a basket strainer's warnings, activated carbon, a high-flow cartridge, a low-flow Y-strainer, two initial elements, every override, a long granular bed and a liquid feed.",
    "`FilterTest.testBypassLimitsPressureDropAndReducesCapture` and `testDynamicLoadingBuildsPressureDropAndBreakthrough`'s pre-step state are the blocks' scenarios, re-cased on PR methane.",
]
[source]
standard = "NeqSim process/equipment/filter/Filter.java"
edition = "Its steady-state `run`: the selected clean drop, the carried loading and breakthrough, the bypass and the replacement check, a `TPflash` at the feed's temperature, one `runTransient` step, and `FilterMechanicalDesign.calcDesign`'s element, vessel and boundary screening."
[inputs]
[inputs.components]
type = "components"
description = "the fluid's substances, by name, resolved against the component databank. Every port of a unit operation carries the same fluid, so this is declared once.\n"
[inputs.inlet_n]
unit = "mol/s"
description = "the inlet's molar flow. A filter moves what it is given and adds no moles, so this is the outlet's too.\n"
[inputs.inlet_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the inlet composition, summing to one.\n"
[inputs.inlet_p]
unit = "Pa"
description = "the inlet pressure, which the drop reduces.\n"
[inputs.inlet_t]
unit = "K"
description = "the inlet temperature, which is also the outlet's: the flash is a `TPflash` at it.\n"
[inputs.pressure_drop]
unit = "Pa"
description = "the pressure loss across the filter, which is `unit_ops.filter`'s own parameter and the `FIXED` branch of the class's model selector. A drop past the inlet pressure is clamped rather than refused.\n"
[inputs.pressure_drop_model]
type = "enum"
values = ["fixed", "flow_scaled", "tabulated", "ergun"]
optional = true
description = "the clean-drop model. Absent is the class's own default, `FIXED`.\n"
[inputs.reference_flow]
unit = "m**3/h"
optional = true
description = "the reference actual flow `FLOW_SCALED` scales from. Absent takes the actual flow, so the ratio is one and the configured drop stands.\n"
[inputs.flow_exponent]
unit = "dimensionless"
optional = true
description = "`FLOW_SCALED`'s exponent, positive. Absent takes the class's `1.0`; a type's own default is not read, because the model's selector is stated here.\n"
[inputs.pressure_drop_curve]
type = "record_list"
row_type = "FilterDropPoint"
optional = true
description = "the `TABULATED` curve, in strictly increasing flow order. **An absent or empty curve returns the configured drop**, which is the class's own fallback.\n"
[inputs.pressure_drop_curve.fields.flow]
unit = "m**3/h"
description = "the actual volumetric flow of the test point.\n"
[inputs.pressure_drop_curve.fields.drop]
unit = "Pa"
description = "the clean drop there, non-negative and non-decreasing with flow.\n"
[inputs.media_area]
unit = "m**2"
optional = true
description = "the `ERGUN` bed's cross-sectional area. Absent takes the class's `1.0` m2.\n"
[inputs.media_bed_depth]
unit = "m"
optional = true
description = "the `ERGUN` bed's depth. Absent takes the class's `1.0` m.\n"
[inputs.media_particle_diameter]
unit = "m"
optional = true
description = "the `ERGUN` bed's representative particle diameter. Absent takes the class's `1e-3` m.\n"
[inputs.media_void_fraction]
unit = "dimensionless"
optional = true
description = "the `ERGUN` bed's void fraction in `(0, 1)`. Absent takes the class's `0.40`.\n"
[inputs.viscosity]
unit = "Pa*s"
optional = true
description = "the fluid's dynamic viscosity, which the Ergun branch reads. **Required by `ergun`**, because the class reads it from the EOS and this library's viscosity dispatch is a separate calculation.\n"
[inputs.performance_curve]
type = "record_list"
row_type = "FilterBetaPoint"
optional = true
description = "the beta-ratio curve, in strictly increasing particle-size order. **An absent or empty curve uses `nominal_removal_efficiency`.**\n"
[inputs.performance_curve.fields.particle_size]
unit = "m"
description = "the particle size the ratio is stated at.\n"
[inputs.performance_curve.fields.beta_ratio]
unit = "dimensionless"
description = "the upstream over downstream particle count at that size, at least one.\n"
[inputs.particle_size]
unit = "m"
optional = true
description = "the size the beta curve is evaluated at. Absent takes the class's `10e-6` m.\n"
[inputs.nominal_removal_efficiency]
unit = "dimensionless"
optional = true
description = "the scalar removal efficiency a filter without a beta curve uses. Absent takes the class's `0.0`.\n"
[inputs.inlet_particle_concentration]
unit = "dimensionless"
optional = true
description = "the inlet particle concentration as a mass fraction (100 mg/kg is `1e-4`). **Stating it enables the capture**, as `setInletParticleConcentration` does; absent leaves both capture outputs zero.\n"
[inputs.solids_loading]
unit = "kg"
optional = true
description = "the accumulated solids or contaminant loading on the element. Absent is 0; a negative value is clamped to zero, as `setSolidsLoading` does.\n"
[inputs.loading_capacity]
unit = "kg"
optional = true
description = "the loading at which breakthrough reaches one. Absent is the class's positive infinity; **a non-positive value is its sentinel for no finite capacity**, so the loading fraction is zero.\n"
[inputs.pressure_drop_increase_at_capacity]
unit = "Pa"
optional = true
description = "the extra drop at one loading-capacity equivalent. Absent is 0; a negative value is clamped, as `setPressureDropIncreaseAtCapacity` does.\n"
[inputs.breakthrough_start_fraction]
unit = "dimensionless"
optional = true
description = "the loading fraction where breakthrough starts. Absent is the class's `0.8`; the setter clamps it to `[0, 0.999999]`, so a start of one cannot divide by zero.\n"
[inputs.bypass_cracking_pressure]
unit = "Pa"
optional = true
description = "the differential pressure that opens the bypass. Absent leaves it closed; stating it enables the bypass, and a non-positive value is refused because `setBypassCrackingDeltaP` does.\n"
[inputs.terminal_pressure_drop]
unit = "Pa"
optional = true
description = "the differential pressure that calls for element replacement. Absent is the class's 5 bar; a non-positive value is refused because `setTerminalDeltaP` does.\n"
[inputs.time_step]
unit = "s"
optional = true
description = "one `runTransient` step. Absent or zero is the class's steady `run`; a positive value names the `calculateSteadyState=false` branch and integrates the captured solids for that interval.\n"
[inputs.holdup_volume]
unit = "m**3"
optional = true
description = "the holdup volume residence time divides by the inlet flow. Absent is 0; a negative value is clamped, as `setHoldupVolume` does.\n"
[inputs.solids_loading_rate]
unit = "kg/h"
optional = true
description = "the generic captured-solids rate. **Refused with `inlet_particle_concentration`**: the class's two setters each disable the other, so the last call decides and the port refuses the ambiguity.\n"
[inputs.backwash_removal_rate]
unit = "kg/h"
optional = true
description = "the loading a backwash removes during the step. Absent is 0; a negative value is clamped, as `setBackwashRemovalRate` does.\n"
[inputs.regeneration_removal_rate]
unit = "kg/h"
optional = true
description = "the loading a regeneration removes during the step. Absent is 0; a negative value is clamped, as `setRegenerationRemovalRate` does.\n"
[inputs.backwash_active]
type = "boolean"
optional = true
description = "whether the backwash removes loading during the step. Absent is false; inert without a positive `time_step`.\n"
[inputs.regeneration_active]
type = "boolean"
optional = true
description = "whether the regeneration removes loading during the step. Absent is false; inert without a positive `time_step`.\n"
[inputs.mechanical_design]
type = "boolean"
optional = true
description = "whether to run `FilterMechanicalDesign.calcDesign`. Absent is false; every design output is absent without it.\n"
[inputs.filter_type]
type = "enum"
values = ["cartridge", "bag", "y_strainer", "basket_strainer", "coalescer", "granular_media", "backwashable_media", "activated_carbon"]
optional = true
description = "the construction whose defaults fill the unstated design settings. Absent is the class's `CARTRIDGE`.\n"
[inputs.number_of_elements]
unit = "dimensionless"
optional = true
description = "the installed parallel elements before sizing. Absent is the class's 1; the design takes the larger of this and the flow's requirement.\n"
[inputs.max_face_velocity]
unit = "m/s"
optional = true
description = "the design face velocity. Absent is the type's default; a non-positive value is refused.\n"
[inputs.element_area]
unit = "m**2"
optional = true
description = "the effective area per element. Absent is the type's default; a non-positive value is refused.\n"
[inputs.max_nozzle_velocity]
unit = "m/s"
optional = true
description = "the nozzle velocity. Absent is the class's density switch: 20 m/s below 200 kg/m3, 3 m/s above.\n"
[inputs.min_ld_ratio]
unit = "dimensionless"
optional = true
description = "the vessel's minimum L/D. Absent is 2.0; a ratio below it lengthens the vessel.\n"
[inputs.max_ld_ratio]
unit = "dimensionless"
optional = true
description = "the vessel's maximum L/D. Absent is 5.0; a ratio above it widens the vessel. It must be at least `min_ld_ratio`.\n"
[inputs.design_pressure_margin]
unit = "dimensionless"
optional = true
description = "the design pressure's multiplier over the operating pressure. Absent is 1.10.\n"
[inputs.minimum_design_pressure_margin]
unit = "Pa"
optional = true
description = "the design pressure's additive margin. Absent is 3.5 bar.\n"
[inputs.design_temperature_margin]
unit = "K"
optional = true
description = "the design temperature's margin above the inlet. Absent is 25 K.\n"
[inputs.allowable_stress]
unit = "Pa"
optional = true
description = "the material's allowable stress at the design temperature. Absent is 138 MPa, the class's `SA-516-70` default.\n"
[inputs.joint_efficiency]
unit = "dimensionless"
optional = true
description = "the welded-joint efficiency. Absent is 0.85.\n"
[inputs.corrosion_allowance]
unit = "mm"
optional = true
description = "the corrosion allowance. Absent is 3 mm.\n"
[inputs.element_collapse_pressure]
unit = "Pa"
optional = true
description = "the element's collapse/burst rating. Absent is 10 bar; the design's collapse utilization divides by it.\n"
[inputs.element_integrity_verified]
type = "boolean"
optional = true
description = "whether element fabrication integrity has been recorded. Absent is false, which raises the class's warning.\n"
[outputs]
[outputs.outlet_n]
unit = "mol/s"
description = "the outlet molar flow, which is the inlet's: a filter moves no moles.\n"
[outputs.outlet_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the outlet composition, which is the inlet's: nothing about a particle reaches the fluid.\n"
[outputs.outlet_p]
unit = "Pa"
description = "the outlet pressure: `inlet_p - applied_drop`.\n"
[outputs.outlet_t]
unit = "K"
description = "the outlet temperature, which is the inlet's.\n"
[outputs.outlet_h]
unit = "J/mol"
description = "the outlet molar enthalpy, which is *not* the inlet's: a real fluid's enthalpy depends on pressure at fixed temperature, so an isothermal drop moves it.\n"
[outputs.clean_drop]
unit = "Pa"
description = "the clean drop the selected model computed, before the clamp. This is `Filter.getCalculatedCleanDeltaP()` after `run`.\n"
[outputs.applied_drop]
unit = "Pa"
description = "the drop actually applied: `pressure_drop` unless it exceeded what the inlet pressure allows, in which case the clamp's value. This is `Filter.getDeltaP()` after `run`, and it is an output because it can differ from the input.\n"
[outputs.nominal_removal_efficiency]
unit = "dimensionless"
description = "the nominal removal efficiency: the beta curve's value at `particle_size`, else the stated scalar.\n"
[outputs.outlet_particle_concentration]
unit = "dimensionless"
description = "the outlet particle concentration as a mass fraction: `inlet (1 - eta)`, or zero when the capture is off.\n"
[outputs.captured_rate]
unit = "kg/h"
description = "the captured particle mass rate: the inlet mass flow times the inlet concentration times the efficiency, or zero when the capture is off.\n"
[outputs.unrestricted_drop]
unit = "Pa"
description = "the clean drop plus `pressure_drop_increase_at_capacity * loading_fraction`, before bypass and before the inlet-pressure clamp. This is `getUnrestrictedDeltaP()`.\n"
[outputs.bypass_fraction]
unit = "dimensionless"
description = "the fraction of the flow bypassing the element: `1 - sqrt(cracking/unrestricted)` when the bypass is open above its cracking drop, else zero.\n"
[outputs.loading_fraction]
unit = "dimensionless"
description = "`solids_loading / loading_capacity`, or zero when the capacity is not finite or not positive.\n"
[outputs.breakthrough_fraction]
unit = "dimensionless"
description = "zero at or below `breakthrough_start_fraction`, else `(fraction - start)/(1 - start)` capped at one.\n"
[outputs.current_removal_efficiency]
unit = "dimensionless"
description = "the nominal efficiency retained by breakthrough and bypass: `nominal (1 - breakthrough) (1 - bypass)`, clamped to `[0, 1]`. The capture outputs use this.\n"
[outputs.solids_loading]
unit = "kg"
description = "the carried solids loading this run read.\n"
[outputs.differential_pressure_utilization]
unit = "dimensionless"
description = "`unrestricted_drop / terminal_pressure_drop`. Bypass does not lower it, because the check reads the unrestricted drop.\n"
[outputs.replacement_required]
type = "boolean"
description = "true when `differential_pressure_utilization >= 1` or `loading_fraction >= 1`. The class's `isReplacementRequired`.\n"
[outputs.holdup_residence_time]
unit = "s"
optional = true
description = "the holdup volume over the inlet's volumetric flow. Zero without a holdup; **absent where the flow is zero and the holdup positive**, the class's positive infinity.\n"
[outputs.design_pressure]
unit = "Pa"
optional = true
description = "the design pressure: the larger of `operating * design_pressure_margin` and `operating + minimum_design_pressure_margin`.\n"
[outputs.design_temperature]
unit = "K"
optional = true
description = "the inlet temperature plus `design_temperature_margin`.\n"
[outputs.required_elements]
unit = "dimensionless"
optional = true
description = "the element count the design requires, at least `number_of_elements`. A granular type reports 1.\n"
[outputs.vessel_inner_diameter]
unit = "m"
optional = true
description = "the vessel's inside diameter, from the element bundle or the granular cross-section, floored at 0.5 m.\n"
[outputs.vessel_outer_diameter]
unit = "m"
optional = true
description = "the inside diameter plus twice the shell thickness.\n"
[outputs.vessel_length]
unit = "m"
optional = true
description = "the tangent-to-tangent length: the active length plus the diameter, then clamped to the L/D window.\n"
[outputs.shell_thickness]
unit = "m"
optional = true
description = "the shell thickness from the class's ASME-shaped screening formula, floored at 6 mm.\n"
[outputs.head_thickness]
unit = "m"
optional = true
description = "the 2:1 ellipsoidal head's thickness, floored at the shell's.\n"
[outputs.effective_element_area]
unit = "m**2"
optional = true
description = "the element area the design used: the stated override or the type's default.\n"
[outputs.calculated_face_velocity]
unit = "m/s"
optional = true
description = "the flow over the effective element area, or over the granular vessel's cross-section.\n"
[outputs.required_nozzle_diameter]
unit = "m"
optional = true
description = "the hydraulic nozzle diameter the nozzle velocity requires.\n"
[outputs.selected_nozzle_diameter]
unit = "m"
optional = true
description = "the next nominal nozzle diameter at or above the required one, from the class's 15 to 1200 mm table.\n"
[outputs.calculated_nozzle_velocity]
unit = "m/s"
optional = true
description = "the flow over the selected nozzle's area.\n"
[outputs.empty_vessel_weight]
unit = "kg"
optional = true
description = "the shell and head metal at 7850 kg/m3.\n"
[outputs.total_equipped_weight]
unit = "kg"
optional = true
description = "the empty vessel, 30% of it for accessories, and the elements or granular media.\n"
[outputs.collapse_pressure_utilization]
unit = "dimensionless"
optional = true
description = "the unrestricted drop over `element_collapse_pressure`.\n"
[outputs.differential_pressure_design_acceptable]
type = "boolean"
optional = true
description = "true when both the terminal and the collapse utilizations are below one.\n"
[outputs.design_media_area]
unit = "m**2"
optional = true
description = "the vessel cross-section a granular design writes to the filter's hydraulic area; absent for a cartridge type.\n"
[[valid_range]]
quantity = "inlet_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[[valid_range]]
quantity = "flow_exponent"
min = 0
min_inclusive = false
severity = "error"
rationale = "the scaling is a positive power of the flow ratio"
[[valid_range]]
quantity = "media_void_fraction"
min = 0
min_inclusive = false
max = 1
max_inclusive = false
severity = "error"
rationale = "a bed's void fraction is strictly between zero and one"
[[valid_range]]
quantity = "nominal_removal_efficiency"
min = 0
min_inclusive = true
max = 1
max_inclusive = true
severity = "error"
rationale = "a removal efficiency is a fraction"
[[valid_range]]
quantity = "pressure_drop"
min = 0
min_inclusive = true
severity = "warning"
rationale = "a negative drop would raise the pressure. `Filter.setDeltaP` clamps it to zero rather than refusing, so this is a warning and the kernel clamps - a refusal here would be inventing a bound the class does not have."
[[valid_range]]
quantity = "solids_loading"
min = 0
min_inclusive = true
severity = "warning"
rationale = "`Filter.setSolidsLoading` clamps a negative loading to zero rather than refusing, so this is a warning and the kernel clamps."
[[valid_range]]
quantity = "pressure_drop_increase_at_capacity"
min = 0
min_inclusive = true
severity = "warning"
rationale = "`setPressureDropIncreaseAtCapacity` clamps a negative increase to zero; the loaded drop cannot fall with loading."
[[valid_range]]
quantity = "breakthrough_start_fraction"
min = 0
min_inclusive = true
max = 0.999999
max_inclusive = true
severity = "warning"
rationale = "`setBreakthroughStartFraction` clamps the fraction to `[0, 0.999999]`; the ceiling is what keeps the breakthrough division above zero."
[[valid_range]]
quantity = "bypass_cracking_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "`setBypassCrackingDeltaP` throws on a non-positive or non-finite pressure; a zero cracking drop would bypass the whole flow."
[[valid_range]]
quantity = "terminal_pressure_drop"
min = 0
min_inclusive = false
severity = "error"
rationale = "`setTerminalDeltaP` throws on a non-positive or non-finite pressure; the utilization divides by it."
[[valid_range]]
quantity = "time_step"
min = 0
min_inclusive = true
severity = "warning"
rationale = "`runTransient` takes `Math.max(0, dt)`, so a negative step is no step rather than an error."
[[valid_range]]
quantity = "holdup_volume"
min = 0
min_inclusive = true
