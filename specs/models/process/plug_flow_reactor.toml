id = "process.plug_flow_reactor"
name = "Plug-flow reactor"
kind = "direct"
assumptions = [
    "**the answer is a profile, not an outlet row.** The march is `[F1..Fn, T, P]` advanced in a fixed number of steps, and the four profile outputs are every station including the inlet.\n",
    "**the state's pressure is in bar.** `calculateDerivatives` writes its pressure row as `-dPdz / 1e5`, so the march carries bara and the pascals appear only at the boundary.\n",
    "**two volumes are read in one derivative.** The rate's concentration is the Peneloux-corrected molar density and the superficial velocity is the untranslated cubic's - measured `4.2e-4` apart on the capture's own feed state.\n",
    "**properties are frozen by default.** The rate law reads the last re-flash and never an RK4 sub-state, which is why the class's RK4 and Euler agree to thirteen digits on its own default.\n",
    "**the refresh never happens after the last step.** The class re-flashes at the top of step `s` when `s % frequency == 0 && s > 0`, so the residence time - computed before the final state update - reads a ninety-step temperature on a hundred-step march.\n",
    "**the pressure row is the empty-tube branch unless a bed is declared**, which is the class's default: `1.2e-5` bar over five metres against Ergun's `1.76` on a default bed.\n",
    "**a species a reaction names and the feed does not carry is added at 1e-20 mol**, in the reaction's own stoichiometry order, which is also the order the profile is described in.\n",
    "**a component is floored at 1e-30 mol** before each flash, so a spent reactant is present and out of the rate.\n",
    "**the species order is the feed's, then the added ones.** The profile vectors are over stations and not species, so this fixes which components the outlet composition is over.\n",
    "**the class's summed volumetric reaction rate is deliberately not an output.** It is mol/(m3*s), this vocabulary has no dimension for an amount per volume per time and uom carries no such quantity, so it stays in the kernel and the capture - the same absence as ISO 6976's Wobbe index.\n",
    "**which component the conversion is of is not an output either**, because this schema has no string output anywhere; it is the `key_component` input, and where that is omitted it is the first reactant of the first reaction as the class derives it.\n",
    "**the residence time is not an output, and this one is a gap rather than a choice.** The vocabulary has no dimension of time, so a *duration* is not expressible here. Closing it adds a canonical unit and a `Gate.lean` line with it, so it is named rather than folded in.\n",
    "**the stoichiometry is read, not declared.** `KineticReaction` is configured in Java, but a declaration cannot carry a coefficient map, so the reaction id resolves against `data/reactions/stoichiometry.csv` and only the orders are declared.\n",
    "**LHHW with no adsorption terms added is its own power law**: the denominator is `(1 + 0)**m`, which is one. The class has the same behaviour when `addAdsorptionTerm` is never called, and a declaration cannot carry the terms.\n",
    "**a reactor with no reaction is refused.** The class logs a warning and returns its feed through; a tube with no reaction is a tube, and passing it through would hide a wiring error.\n",
    "the fluid is PR with the classic mixing rule, because `Stream::mixture()` resolves `databank::mixture_of(names, Cubic::Pr, None)` and has no other route.\n",
    "**`ReactorMechanicalDesign`, `runTransient` and the JSON profile export are not ported.** The class names no paper; its schemes are the textbook RK4 and Euler it writes out itself.\n",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/equipment/reactor/PlugFlowReactor.java` is the port source, through its `run` and `calculateDerivatives`; `KineticReaction.java` is the rate law and `CatalystBed.java` the bed.\n",
    "Runge, C. (1895), Math. Ann. 46, 167-178 - the fourth-order scheme the class's `IntegrationMethod.RK4` is, and the reason the port names a method rather than a paper the class does not cite.\n",
    "Ergun, S. (1952), Chem. Eng. Prog. 48(2), 89-94 - the packed-bed pressure drop `CatalystBed.calculatePressureDrop` writes, and which the class cites nowhere.\n",
    "`validation/neqsim/captures/process_plug_flow_reactor.tsv` - eight rows, each with the whole axial profile: both schemes, two step counts, two update frequencies, an isothermal branch, and two rows against a catalyst bed.\n",
]
[source]
standard = "NeqSim process/equipment/reactor/PlugFlowReactor.java"
edition = "Its steady-state `run`: `ensureProductComponentsExist`, a `TPflash`, then `numberOfSteps` fixed steps over `[F1..Fn, T, P]`, flows clamped at zero and pressure at 0.1 bar after each, temperature overridden when isothermal, properties re-flashed every `propertyUpdateFrequency` steps."
[inputs]
[inputs.components]
type = "components"
description = "the feed's substances, by name, resolved against the component databank.\n"
[inputs.feed_n]
unit = "mol/s"
description = "the feed's molar flow, which the march carries through every species balance.\n"
[inputs.feed_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed's composition, which the added species widen with zeros.\n"
[inputs.feed_p]
unit = "Pa"
description = "the feed's pressure, which the march carries in bara from here.\n"
[inputs.feed_t]
unit = "K"
description = "the feed's temperature, which is also what an isothermal reactor holds.\n"
[inputs.length]
unit = "m"
description = "the tube length, `unit_ops.plug_flow_reactor`'s own parameter and the class's default 5.0.\n"
[inputs.diameter]
unit = "m"
description = "the tube's internal diameter, the class's default 0.10, which sets the area and the perimeter.\n"
[inputs.number_of_tubes]
unit = "dimensionless"
description = "how many tubes the flow is split across; the class's default 1.\n"
[inputs.energy_mode]
type = "enum"
values = ["adiabatic", "isothermal", "coolant"]
description = "how the temperature moves along the tube, where adiabatic is the class's own default.\n"
[inputs.coolant_temperature]
unit = "K"
description = "the coolant's temperature on the coolant branch, the class's default 298.15.\n"
[inputs.overall_heat_transfer_coefficient]
unit = "W/(m**2*K)"
description = "U on the coolant branch, whose heat is `U * perimeter * numberOfTubes * (T_coolant - T)`.\n"
[inputs.number_of_steps]
unit = "dimensionless"
description = "the fixed number of steps the march takes, the class's default 100 and its setter's floor 10.\n"
[inputs.integration_method]
type = "enum"
values = ["rk4", "euler"]
description = "which scheme advances the profile, where rk4 is the class's default.\n"
[inputs.property_update_frequency]
unit = "dimensionless"
description = "steps between re-flashes on the frozen coupling, the class's default 10.\n"
[inputs.thermodynamic_coupling]
type = "enum"
values = ["frozen_properties", "fully_coupled"]
description = "the class's default reuses the last flash between updates; fully_coupled re-flashes per residual.\n"
[inputs.reaction]
type = "string"
description = "the rate law's name, resolved against the reaction data for its stoichiometry - the same route `process.stirred_tank_reactor` takes - which is also what widens the species set.\n"
[inputs.reaction_orders]
type = "vector"
unit = "dimensionless"
length = "one per reactant the reaction data names, in the table's order"
description = "the power-law orders, which the class sets through `addReactant`'s third argument and which the data does not carry. A zero order takes that reactant out of the rate.\n"
[inputs.rate_type]
type = "enum"
values = ["power_law", "lhhw", "equilibrium"]
description = "which rate expression evaluates the rate, where equilibrium is evaluated as a power law by the class's own dispatch.\n"
[inputs.pre_exponential_factor]
unit = "dimensionless"
description = "A in `k(T) = A * T**n * exp(-Ea/(R*T))`, the class's default 1.0e10.\n"
[inputs.activation_energy]
unit = "J/mol"
description = "Ea in the same expression, the class's default 100000.\n"
[inputs.temperature_exponent]
unit = "dimensionless"
description = "n in the same expression, the class's default 0; a magnitude below 1e-10 is taken as exactly zero.\n"
[inputs.heat_of_reaction]
unit = "J/mol"
description = "the reaction's enthalpy, which the energy balance consumes; the class's default 0.\n"
[inputs.catalyst_bulk_density]
unit = "kg/m**3"
optional = true
description = "the bed's bulk density, which converts a mass-basis rate to a volumetric one. Supplying it is what sets a bed; the class's default 800.\n"
[inputs.catalyst_activity_factor]
unit = "dimensionless"
optional = true
description = "the bed's activity factor, in [0, 1], which scales every rate; the class's default 1.\n"
[inputs.catalyst_particle_diameter]
unit = "m"
optional = true
description = "the pellet diameter the Ergun equation and the Thiele modulus read; the class's default 0.003.\n"
[inputs.catalyst_void_fraction]
unit = "dimensionless"
optional = true
description = "the bed's void fraction, which the Ergun equation reads on both terms; the class's default 0.40.\n"
[inputs.catalyst_molecular_diffusivity]
unit = "m**2/s"
optional = true
description = "the diffusivity the effectiveness factor divides by, the class's default 1.0e-5. Unread unless effectiveness is enabled.\n"
[inputs.catalyst_effectiveness_enabled]
type = "boolean"
optional = true
description = "whether the pellet's Thiele modulus scales the rate; off by default.\n"
[inputs.key_component]
type = "string"
optional = true
description = "which component the reported conversion is of. When omitted it is the first reactant of the first reaction, which is what the class does.\n"
[outputs.product_n]
unit = "mol/s"
description = "the outlet's molar flow, which a balanced stoichiometry leaves unchanged.\n"
[outputs.product_z]
type = "vector"
unit = "dimensionless"
length = "one per species, the feed's order then the added ones"
description = "the outlet's composition.\n"
[outputs.product_p]
unit = "Pa"
description = "the outlet's pressure, the feed's less the whole march's drop.\n"
[outputs.product_t]
unit = "K"
description = "the outlet's temperature: the held one when isothermal, and otherwise where the energy balance lands.\n"
[outputs.product_h]
unit = "J/mol"
description = "the outlet's molar enthalpy at its own state.\n"
[outputs.conversion]
unit = "dimensionless"
description = "the key component's conversion over the whole reactor, clamped to [0, 1] as the class clamps it.\n"
[outputs.pressure_drop]
unit = "Pa"
description = "the inlet pressure less the outlet's, the class's bara difference converted at the boundary.\n"
[outputs.outlet_temperature]
unit = "K"
description = "the outlet temperature the march reports, which is the last state's and not the last refresh's.\n"
[outputs.heat_duty]
unit = "W"
description = "the duty an isothermal reactor supplies, from each reaction's enthalpy and its first reactant's moles reacted; zero otherwise.\n"
[outputs.positions]
type = "vector"
unit = "m"
length = "number_of_steps + 1"
description = "every station's axial position, the inlet first.\n"
[outputs.temperature_profile]
type = "vector"
unit = "K"
length = "number_of_steps + 1"
description = "every station's temperature.\n"
[outputs.pressure_profile]
type = "vector"
unit = "Pa"
length = "number_of_steps + 1"
description = "every station's pressure. The march carries bara, as `calculateDerivatives` writes its own row, and this reports the pascals.\n"
[outputs.conversion_profile]
type = "vector"
unit = "dimensionless"
length = "number_of_steps + 1"
description = "every station's conversion of the key component.\n"
[[valid_range]]
quantity = "length"
min = 0
min_inclusive = false
severity = "error"
rationale = "a tube has a positive length\n"
[[valid_range]]
quantity = "diameter"
min = 0
min_inclusive = false
severity = "error"
rationale = "a tube has a positive diameter\n"
[[valid_range]]
quantity = "number_of_steps"
min = 1
min_inclusive = true
severity = "error"
rationale = "a march with no steps is not a march\n"
[[valid_range]]
quantity = "property_update_frequency"
min = 1
min_inclusive = true
severity = "error"
rationale = "the class's setter floors it at one\n"
[[valid_range]]
quantity = "catalyst_activity_factor"
min = 0
min_inclusive = true
max = 1
max_inclusive = true
severity = "error"
rationale = "an activity factor scales a rate by a fraction of it\n"
[implementations]
python = "azoth.process.plug_flow_reactor"
rust = "azoth_process::plug_flow_reactor"
