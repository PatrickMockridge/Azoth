id: process.compressor
name: Compressor
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.compressor.Compressor`, `run(UUID)` at lines 1005-1817 of a
    6,593-line file, and specifically its default isentropic path at `:1721-1776`.
  edition: >
    Version 3.20.0. Taken from it: `PSflash(entropy)` at the outlet pressure (`:1725`),
    `dH = (H_is - H_in) / efficiency` (`:1738`) and `PHflash(H_in + dH)` (`:1766`). Not
    taken: the compressor chart, the speed solve, the anti-surge recycle, the three
    polytropic paths, the outlet-temperature efficiency solve and the mechanical design.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Compressor.java` lines
    1005-1817; the isentropic path is 55 of them.'
  - '`eos.ps_flash` - the isentropic flash that finds the ideal outlet state.'
  - '`eos.ph_flash` - the isenthalpic flash that finds the real one.'
  - '`process.expander` and `process.pump` - the same procedure, with the efficiency
    scaling the other way and with a liquid instead of a gas.'

algorithm:
  scheme: isentropic_efficiency_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: the constant term of each component's `Cp/R` polynomial
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      each component's ideal-gas molar entropy at `T_ref` and `P_ref`. **Used**, unlike
      in the units whose only flash is isenthalpic: the ideal outlet state is found at
      constant entropy, so the datum the entropy is measured from is part of the model.
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    unit: K
    description: the inlet absolute temperature
  P:
    unit: Pa
    description: the inlet absolute pressure. The outlet must be **above** it.
  n:
    unit: mol/s
    description: the inlet molar flow rate, which turns the molar enthalpy change into a power
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the inlet mole fractions. Checked rather than renormalised.
  outlet_pressure:
    unit: Pa
    description: >
      the pressure the compressor delivers. Must be strictly above `P` - a compressor
      that lowers the pressure is an expander, and there is one.
  efficiency:
    unit: dimensionless
    description: >
      the **isentropic** efficiency, in `(0, 1]`. The fraction of the ideal enthalpy rise
      that the ideal rise represents: `h_out = h_in + (h_ideal - h_in) / efficiency`, so
      a smaller number gives a hotter outlet and a larger power.

outputs:
  T:
    unit: K
    description: the outlet temperature. Above the ideal one, which is what the loss means.
  P:
    unit: Pa
    description: the outlet pressure - the specification, not an answer
  power:
    unit: W
    description: >
      the shaft power, **signed**, and positive here: the fluid is receiving it. The same
      convention for all three machines, so an expander's is negative and the three can
      be summed in a flowsheet without a rule about which sign means what.
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase stream
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the stream is in at the outlet
  isentropic_temperature:
    unit: K
    description: >
      the temperature the fluid would have reached at **unit** efficiency. An efficiency
      is a statement about the gap between this and `T`, and a caller sizing an intercooler
      needs it; it cannot be recovered from the rest of the result, which is why it is
      reported rather than left to be recomputed.
  iterations:
    unit: dimensionless
    description: flash iterations taken, summed over the two flashes this model runs

valid_range:
  - quantity: efficiency
    min: 0.0
    min_inclusive: false
    max: 1.0
    max_inclusive: true
    severity: error
    rationale: >
      an efficiency above one is a machine that beats the second law, and zero makes the
      ideal enthalpy change infinite. NeqSim allows the same range and **clamps** to it
      rather than refusing (`Compressor.java:2118`); a clamp turns a caller's mistake into
      a slightly different answer that looks deliberate, so this refuses instead.
  - quantity: outlet_pressure
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: a flow of zero moles has no power to compute

assumptions:
  - '**one stage at one efficiency.** NeqSim models a train of stages, an intercooler
    between them and a chart-driven speed solve. This is one machine, and a train is this
    model composed with a `process.heater` between the stages - which is what a train is.'
  - '**the isentropic efficiency is the specification**, not a polytropic one. NeqSim
    defaults to this (`usePolytropicCalc` is false, `Compressor.java:111`) and offers
    three polytropic paths as alternatives; none is ported. A polytropic path needs a
    volume exponent and, for two of the three, a measured chart.'
  - '**no pressure drop and no heat loss** across the machine itself. Both are separate
    unit operations.'
  - '**no surge line, no chart, no speed.** Those need a manufacturer''s curve, which is
    data this library does not ship and could not check.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace. A real compressor''s
    outlet is often above the range where a cubic is trustworthy, and that is a property
    of the equation of state rather than of this model.'

implementations:
  python: azoth.process.compressor
  rust: azoth_process::compressor
