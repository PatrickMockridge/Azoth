id = "process.distillation_column"
name = "Distillation column"
kind = "procedure"
assumptions = [
    "**the solve is `DIRECT_SUBSTITUTION`**, which is `DistillationColumn`'s own default: `init` flashes the feed stage, seeds a linear temperature profile and links the trays, then the sweeps run each tray from its neighbours' outlets until the mean tray-temperature change is under the tolerance.",
    "**the relaxation is the class's, and its controller reads one term of three.** It damps on a combined residual carrying its scaled temperature, mass and energy terms, and the others are `ColumnMeshResidualEvaluator`'s - a MESH norm this port does not carry.",
    "**that matters only where a solve struggles.** On the captured binary row both libraries keep a relaxation of one and reach the same fixed point.",
    "**the linear seed enters through the inlets.** `SimpleTray.init()` re-states every inlet stream's temperature to the tray's before its first run, which is how the profile reaches the trays at all.",
    "**the external feed is restored afterwards**, which is why the sweeps see the feed's own state and not the seeded one.",
    "**the reboiler's `init` inlet is the feed stage's liquid**, not the first tray's - `init` links it that way and the sweeps then replace it with the first tray's. The two differ only during the seeding.",
    "**the ends are pinned by temperature**: `setCondenserTemperature` reaches the tray's own `outTemperature`, so its flash is a `TPflash` there rather than at the mixed enthalpy. A middle tray has no pin and flashes at its enthalpy.",
    "**pressures run linearly** from `bottom_pressure` at stage 0 to `top_pressure` at the top stage, which is the class's own rule and is why the two are both declared.",
    "**`number_of_stages` counts the trays between the ends**, so a reboiler or a condenser adds one stage each: the stage a feed enters is 0-based over the trays *including* them, and stage 0 is the reboiler where there is one.",
    "**the mass and energy residuals are the closure, not the class's.** They are the products' worst component imbalance against the feed, and the enthalpy balance; `getLastMassResidual` is a norm over the MESH equations. The capture prints both, and they are not comparable.",
    "**the product specifications are `ColumnSpecification`'s five types**, and the class splits them in two: a **reflux ratio** and a **duty** are written straight onto the end, and the other three by an **outer secant on the end's temperature**.",
    "**a specification's location follows its slot.** `validateColumnSpecification` refuses a `TOP` spec handed to `setBottomSpecification`, so the location is a spelling of the slot; both ends are reachable, the top's secant on the condenser and the bottom's on the reboiler.",
    "**that secant takes two guesses five kelvin apart**, then steps capped at 50 K and clamped to `[100, 1000]` K, and it converges when the product's value is within `1e-4` of the target.",
    "**there is no specification homotopy here, and that is a measurement.** `getEffectiveSpecificationHomotopySteps` returns three staged targets only when the solver is `AUTO`, and the field it otherwise reads is one - so the continuation the class carries belongs to the solver this port refuses.",
    "**a pin wins over a directly-applied duty.** The tray tests its stated outlet temperature first and takes a `TPflash` there, so a heat input a `DUTY` wrote is never read: the capture's inert row reports `-21323.04` W for a target of `-20000`.",
    "**nothing reports that gap**: a `DUTY` is not *adjusted*, so its residual is zero by construction - a zero that means \"not checked\" rather than \"satisfied\".",
    "**a reflux-ratio specification is not reproduced, and the reason is measured.** The end's `PVrefluxflash` searches for the state whose vapour fraction is `1/(1 + ratio)`; NeqSim lands on `402.24` K, past the dew point of the captured mixture.",
    "**this port's flash refuses to converge there** rather than landing on a state its own equations do not place.",
    "**`murphree_efficiency` is ported for the sequential solve**: each interior stage's vapour is blended as `y_in + E(y_eq - y_in)`, clamped and renormalised. The ends and an ideal stage are never corrected, a gas draw on a corrected stage is refused, and the products are reconciled against the feed.",
    "**`naphtali_sandholm` with an efficiency is refused by name.** `NaphtaliSandholmSolver.applyMurphreeEfficiencyToK` corrects a tray's K-values by an Edmister `K^eta` proxy rather than blending the outlet, so the two solves carry two different corrections and this model ports the sequential one.",
    "**Four corrected rows, and the port reproduces one exactly.** `binary_murphree_0_6` is the oracle; **`0_85` it does not reach**, by up to `7` K on tray 3, and **the cause is not established**.",
    "**what is established is that the divergence is in the map.** One pass from NeqSim's endpoint - a warm start, and the `_tight` row shows it is converged - moves trays 2, 3 and 4 by `2.73`, `9.83` and `10.19` K and leaves the ends and tray 1 alone. `process_column_divergence.tsv` is the instrument.",
    "**the relaxation and the seed are excluded by argument, not experiment.** A damped map has the same fixed points as the undamped one, and the instrument starts from a stated state rather than a seed. The inert relaxation write-back is fixed regardless.",
    "**`tray_murphree_efficiency` is the per-stage override, and the resolution is exact.** `getEffectiveMurphreeEfficiency` reads the stage's own entry when it is present and not `NaN`, and the column-wide value otherwise - so an all-`NaN` vector is that value to the last digit.",
    "**the override's own endpoint is the `0_85` divergence again.** `process_column_efficiency.tsv` puts `0.6` everywhere with stage 3 at `0.85`: NeqSim lands `321.44` K on tray 3 and this port `302.19`, the column-wide state to `1.3e-3` K.",
    "**two of `solver_type`'s ten strategies are ported**: `direct_substitution`, the class's own default, and `naphtali_sandholm`, the simultaneous MESH correction. The other eight are refused by name.",
    "**the eight strategies this spec's rows refuse are a measured non-port.** On the captured binary column all ten land within `2.5e-6` K of each other on tray 1 and within `1.1e-7` relative on the distillate, on three bit-identical states - each one where a solve stopped.",
    "**four of them land on the substitution core's own state exactly**: `inside_out`, `matrix_inside_out`, `mesh_residual`, and `wegstein`, which reports `direct_substitution` because it fell back to it.",
    "**`auto` reports `damped_substitution`** on the captured binary column although `candidateSolvers` lists the mesh solve first: it is a ladder over the others rather than a method.",
    "**the second solve linearises the whole column at once**: `N` tray blocks of `C + 2` variables, `C` component balances, the energy equation and `sum(K x) = 1`, with a finite-difference Jacobian and a block-tridiagonal solve.",
    "**its seed is the class's warm start**: the substitution core's converged trays, which `initializeTrayStateFromColumn` maps onto the MESH variables.",
    "**the class's cold seed is owed, and `ROADMAP.md` names it**: `runBostonSullivanRefinement`, declined on a measurement - without it the class's first Newton step moves the variables by `1e11` times their own size.",
    "**both implementations carry it**: the Python reference is `_column_mesh.py`, and the case `binary_mesh_solve` pins the pair against the capture's own `naphtali_sandholm` row.",
    "**`AUTO` is a ladder and not one method** - the parking note's finding - so it is refused with them rather than silently resolved.",
    "**the fluid is PR with the classic mixing rule**, because `Stream::mixture()` resolves `databank::mixture_of(names, Cubic::Pr, None)` and has no other route.",
    "**NeqSim's own deethanizer state is written on SRK**, and on PR it does not converge in NeqSim at all - the capture keeps that as evidence.",
    "**a side draw is a split of the tray's own outlet phase**: `getGasOutStream` is the vapour scaled by `1 - gas` and `getLiquidOutStream` the liquid by `1 - liquid - pumparound`, so a draw carries the tray's own composition, temperature and pressure. **A fraction on an end is refused.**",
    "**the two closures count the draws**, which is what `columnReportsSideDrawAsOutletStream` asserts: a closure that ignored them reads `0.248` on the captured state rather than `4.1e-8`.",
    "**both recycles are ported, and the pair is refused on a measurement.** A specified draw *flow* is a candidate search and a pumparound return is a fixed point; stating both puts the class on `solveWithColumnTearVariables`' coordinated loop, which `process_column_tear.tsv` shows does not converge.",
    "**the coordinated loop fails by orders**: 18 of 30 candidates rejected and a `4.4e-4` residual on the draw alone, against `0.447` with an empty candidate history once the pumparound is beside it.",
    "**the class's own liquid-and-pumparound row is where its balance does not close**: `RECONCILED_PRODUCTS`, a `2.449` kg/hr imbalance, and products `0.0200` mol/s above this port's, which closes to `9.7e-9`.",
    "**the trayed half of the internals tree is owed, and the tray calculator is not**: `TrayHydraulicsCalculator` is the registered `hydraulics.tray_hydraulics`; what is left is `ColumnInternalsDesigner.calculateTrayed` and `DistillationColumnMechanicalDesign`, which `ROADMAP.md` names.",
    "**the side-draw scan's constants are the port's, and no field holds them.** `_SIDE_DRAW_SCAN_STEP = 0.005` mirrors `SIDE_DRAW_CANDIDATE_SCAN_STEP`; `_SIDE_DRAW_SEED_FRACTION = 0.05` seeds an uncontrolled draw; `_SIDE_DRAW_IDENTITY = 1e-12` is the identity tolerance. The three siblings inherit them.\n",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/equipment/distillation/DistillationColumn.java` is the port source, through `init` and `solveSequential`; the stage is `SimpleTray.java`, ported as `crates/azoth-process/src/column/tray.rs`.",
    "`validation/neqsim/captures/process_column.tsv` - eleven rows: NeqSim's own deethanizer taken to 80 and to 200 iterations, the binary column at a `1e-6` and at a `1e-2` gate, one row per specification type, and the bottom location on the same purity its top case asks for.",
    "`validation/neqsim/captures/process_column_solvers.tsv` - the binary column under each of `ColumnSolverFactory`'s ten strategies and the deethanizer under `naphtali_sandholm`, which is the only one of the ten that converges it.",
    "`validation/neqsim/captures/process_side_draw.tsv` - the side draws, from `SimpleTraySideDrawTest`: two standalone pure-component trays and a pumparound row, the class's own three one-tray columns with no ends, and the binary column drawing vapour and then liquid with a pumparound.",
]
[source]
standard = "NeqSim process/equipment/distillation/DistillationColumn.java"
edition = "Its `init` and its `solveSequential` under the default `DIRECT_SUBSTITUTION`: the feed-stage flash, the linear temperature seed, the two links, and the sweeps. The other nine solving strategies are refused by name."
[algorithm]
scheme = "sequential_substitution_sweeps"
initialisation = "linear_temperature_profile"
convergence = "absolute"
tolerance = 1.0e-06
max_iterations = 200
[inputs]
[inputs.components]
type = "components"
description = "the feed's substances, by name, resolved against the component databank. The order is the order of `feed_z`.\n"
[inputs.feed_n]
unit = "mol/s"
description = "the feed's molar flow.\n"
[inputs.feed_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the feed composition.\n"
[inputs.feed_p]
unit = "Pa"
description = "the feed's pressure, which is its own - the column's tray pressures come from `bottom_pressure` and `top_pressure`.\n"
[inputs.feed_t]
unit = "K"
description = "the feed's temperature, which with its pressure and composition fixes its enthalpy.\n"
[inputs.number_of_stages]
unit = "dimensionless"
description = "the theoretical trays between the ends, which is the palette's own parameter; a reboiler or a condenser adds one stage each.\n"
[inputs.feed_stage]
unit = "dimensionless"
description = "the stage the feed enters, 0-based over the trays including the ends - so stage 0 is the reboiler where there is one, and the last stage is the condenser.\n"
[inputs.has_reboiler]
type = "boolean"
description = "whether the column has a reboiler at stage 0.\n"
[inputs.has_condenser]
type = "boolean"
description = "whether the column has a condenser at the top stage.\n"
[inputs.top_pressure]
unit = "Pa"
description = "the pressure at the top stage.\n"
[inputs.bottom_pressure]
unit = "Pa"
description = "the pressure at stage 0. The two fix the profile the tray pressures interpolate.\n"
[inputs.temperature_tolerance]
unit = "K"
description = "the convergence gate on the mean tray-temperature change between iterations. Where a solve stops is what its answer is, so this is a measurement and not a knob.\n"
[inputs.max_iterations]
unit = "dimensionless"
description = "the iteration cap. A solve that reaches it without meeting the gate is refused, with its residuals named.\n"
[inputs.reboiler_temperature]
unit = "K"
optional = true
description = "the reboiler's temperature, which pins the bottom tray's flash. **Absent means no pin**, and the end's flash is then at its own enthalpy - which is what `setReboilerTemperature` not having been called does, and what makes a duty specification reachable at all.\n"
[inputs.condenser_temperature]
unit = "K"
optional = true
description = "the condenser's temperature, which pins the top tray's flash. Absent as the reboiler's is. **A pin wins over a directly-applied duty**: the tray tests its stated outlet temperature first and takes a `TPflash` there, so a heat input a duty specification wrote is never read.\n"
[inputs.murphree_efficiency]
unit = "dimensionless"
optional = true
description = "the column-wide Murphree tray efficiency, applied to each interior stage's vapour. **Omitted means the ideal stage.** Refused with `solver_type = naphtali_sandholm`, whose solver carries a different correction.\n"
[inputs.tray_murphree_efficiency]
type = "vector"
unit = "dimensionless"
length = "one per stage, the reboiler at index 0"
optional = true
description = "one override per stage, `NaN` where a stage falls through to `murphree_efficiency` - `DistillationColumn.setMurphreeEfficiencies`, whose own resolution is `getEffectiveMurphreeEfficiency`. A length that is not the stage count is refused, and a value outside `[0, 1]` is clamped rather than refused.\n"
[inputs.solver_type]
type = "enum"
values = ["direct_substitution", "damped_substitution", "inside_out", "matrix_inside_out", "wegstein", "sum_rates", "newton", "naphtali_sandholm", "mesh_residual", "auto"]
optional = true
description = "**`direct_substitution` and `naphtali_sandholm` are ported**; the other eight are refused by name, each with the `ColumnSolverFactory` solver behind it, and the capture measures that they are path variants rather than different physics.\n"
[inputs.top_specification_type]
type = "enum"
values = ["product_purity", "reflux_ratio", "component_recovery", "product_flow_rate", "duty"]
optional = true
description = "the top product's degree of freedom, which `ColumnSpecification` carries. Omitted, the top is pinned by temperature - the class's other route. **The end is the parameter's name and not a value**, because the class holds exactly two specifications.\n"
[inputs.top_specification_target]
unit = "dimensionless"
optional = true
description = "the target value, in the unit its type implies: dimensionless for a purity, a recovery or a ratio, **mol/hr** for a flow rate, W for a duty - which is `ColumnSpecification.defaultTargetUnit`'s own convention.\n"
[inputs.top_specification_component]
type = "string"
optional = true
description = "the component a purity or a recovery constrains; the class's own `validate` refuses such a specification without one, and the other three types do not read it.\n"
[inputs.bottom_specification_type]
type = "enum"
values = ["product_purity", "reflux_ratio", "component_recovery", "product_flow_rate", "duty"]
optional = true
description = "the bottom product's degree of freedom, which `ColumnSpecification` carries. Omitted, the bottom is pinned by temperature - the class's other route. **The end is the parameter's name and not a value**, because the class holds exactly two specifications.\n"
[inputs.bottom_specification_target]
unit = "dimensionless"
optional = true
description = "the target value, in the unit its type implies, as the top specification's is.\n"
[inputs.bottom_specification_component]
type = "string"
optional = true
description = "the component a purity or a recovery constrains; unread by the other three types.\n"
[inputs.reactive]
type = "boolean"
optional = true
description = "**whether the middle trays flash reactively** - `DistillationColumn.setReactive(true)`. The two ends never do, which `replaceMiddleTrays` decides by walking only the range between them. Omitted means every tray is an equilibrium stage.\\n"
[inputs.reactive_start_tray]
unit = "dimensionless"
optional = true
description = "the first reactive middle tray, 0-based among the middle trays - `setReactive(true, start, end)`. **Both bounds or neither**: the class has no form that states one end alone. Omitted with `reactive = true` covers every middle tray.\\n"
[inputs.reactive_end_tray]
unit = "dimensionless"
optional = true
description = "the last reactive middle tray, inclusive.\\n"
[inputs.gas_side_draw_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray, a zero where a tray draws nothing"
optional = true
description = "**the vapour each tray withdraws from its own outlet**, which `setGasSideDrawFraction` states as a fraction of the phase: a draw has the tray's composition, temperature and pressure and a different flow. **A fraction on an end is refused.**\n"
[inputs.liquid_side_draw_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray"
optional = true
description = "the liquid each tray withdraws as a side draw, from the same liquid a pumparound takes from: **the two are bounded together** by `validateLiquidSplitFractions` and may not sum above one.\n"
[inputs.pumparound_fractions]
type = "vector"
unit = "dimensionless"
length = "one per tray"
optional = true
description = "the liquid each tray withdraws as a pumparound. **The return is ported**: `pumparound_*` below states the tray it comes back to, its fraction and its temperature drop, and the column iterates the recycle.\n"
[inputs.side_draw_flow_tray]
unit = "dimensionless"
optional = true
description = "**the tray whose draw flow is specified**, which `addSideDrawFlowSpecification(tray, phase, flow, unit)` takes. Omitted means every draw stays a *fraction* of its stage's own phase, decided once - which is what the three fraction vectors above are.\n"
[inputs.side_draw_flow_phase]
type = "enum"
values = ["gas", "liquid"]
optional = true
description = "which of the stage's two phases the specification controls, `SideDrawPhase`. **Stated with the tray and the target or not at all**: a target without a phase is a declaration that cannot be read.\n"
[inputs.side_draw_flow_target]
unit = "kg/s"
optional = true
description = "the mass flow the draw must deliver - `getSideDrawStream(tray, phase).getFlowRate(unit)`, so a **mass** rate and not a molar one. The column moves the draw's fraction until the draw delivers it.\n"
[inputs.side_draw_flow_tolerance]
unit = "dimensionless"
optional = true
description = "the relative residual the search stops at. **Omitted means `1e-4`**, which is `ColumnSideDrawSpecification`'s own field initialiser.\n"
[inputs.side_draw_flow_max_iterations]
unit = "dimensionless"
optional = true
description = "the candidate cap for this specification. **Omitted means `12`**, the class's own field initialiser; the tear's own cap is the largest of it and `maxColumnTearIterations`.\n"

[inputs.pumparound_return_tray]
unit = "dimensionless"
optional = true
description = "**the tray the pumparound's liquid comes back to**, which `addLiquidPumparound(name, drawTray, returnTray, fraction, drop)` takes. **Stated with the draw tray, the fraction and the drop or not at all.**\n"
[inputs.pumparound_draw_tray]
unit = "dimensionless"
optional = true
description = "the tray the pumparound's liquid leaves. It must be a middle tray: the ends here are `column::reboiler` and `column::condenser` rather than stages.\n"
[inputs.pumparound_draw_fraction]
unit = "dimensionless"
optional = true
description = "the fraction of the draw tray's liquid withdrawn, which `setLiquidPumparoundDrawFraction` states on the tray - the same vector `pumparound_fractions` writes.\n"
[inputs.pumparound_temperature_drop]
unit = "K"
optional = true
description = "the drop from the draw to the return, which `updateReturnStream` subtracts before re-flashing. **The cooler's duty is the enthalpy between the two streams.**\n"
[inputs.pumparound_tolerance]
unit = "dimensionless"
optional = true
description = "the relative return-flow change the outer loop stops at. **Omitted means `1e-4`**, which is `pumparoundTolerance`'s own field initialiser.\n"
[inputs.pumparound_max_iterations]
unit = "dimensionless"
optional = true
description = "the outer loop's cap. **Omitted means `12`**, `maxPumparoundIterations`' own initialiser.\n"
[inputs.column_diameter]
unit = "m"
optional = true
description = "the column's internal diameter, which both capacity-limit families divide the gas outlet's volumetric flow by. **Absent is the class's own `1.0` m**; a value at or below zero is the \"no area\" it answers a zero factor from. The solve is indifferent to it.\n"
[inputs.max_allowable_fs_factor]
unit = "dimensionless"
optional = true
description = "the `Fs` limit `isFsFactorWithinDesignLimit` and its two siblings read. **Absent is `2.5`**, this class's own; the absorber pair defaults it to `3.0`. Read by the limit family alone.\n"
[inputs.internals_type]
type = "enum"
values = ["sieve", "valve", "bubble-cap"]
optional = true
description = "which tray the internals tree is designed as, read by the tray calculator's four branches. **Absent is `sieve`**, the class's own constructor default. Read after the solve and by nothing on the run path.\n"
[inputs.tray_spacing]
unit = "m"
optional = true
description = "the tray spacing the internals are designed at. **Absent is `0.6`**, `ColumnInternalsDesigner`'s own initialiser.\n"
[inputs.weir_height]
unit = "m"
optional = true
description = "the weir height the internals are designed at. **Absent is `0.05` m**, the designer's own initialiser.\n"
[inputs.hole_diameter]
unit = "mm"
optional = true
description = "the sieve hole diameter, **in millimetres**, which is the designer's own field. **Absent is `12.7` mm**.\n"
[inputs.hole_area_fraction]
unit = "dimensionless"
optional = true
description = "the hole area over the active area. **Absent is `0.1`**, the designer's own initialiser.\n"
[inputs.downcommer_area_fraction]
unit = "dimensionless"
optional = true
description = "the downcomer area over the total. **Absent is `0.1`.**\n"
[inputs.design_flood_fraction]
unit = "dimensionless"
optional = true
description = "the fraction of flood the internals are sized to, which fixes the design velocity the sizing divides by. **Absent is `0.8`**, the designer's own initialiser - and not the packed column's `0.70`, which is a different parameter under the same name.\n"
[inputs.column_diameter_override]
unit = "m"
optional = true
description = "a stated internal diameter, which **replaces the sizing branch entirely**. **Absent, or at or below zero, is the class's own `-1.0`** - the value that sizes the internals off the controlling tray.\n"
[inputs.hydraulic_pressure_drop_coupling]
type = "boolean"
optional = true
description = "**whether the profile is rewritten from the column's own tray hydraulics.** It is a *solver* change and not a report: the flag is one of `hasActiveColumnTearVariables`' own terms, so setting it puts the column on the outer tear loop. **Absent is `false`.**\n"
[inputs.hydraulic_pressure_drop_internals_type]
type = "enum"
values = ["sieve", "valve", "bubble-cap"]
optional = true
description = "which tray the coupling's own designer is built as. **Absent is `sieve`**, the class's own default. **The geometry is not a degree of freedom here**: `calcColumnInternals` sets the type alone.\n"

[outputs]
[outputs.tray_temperature]
type = "vector"
unit = "K"
length = "one per tray, the reboiler at stage 0 to the condenser at the top"
description = "the solved temperature profile, which is what a column's answer is rather than a scalar.\n"
[outputs.tray_pressure]
type = "vector"
unit = "Pa"
length = "one per tray"
description = "each tray's pressure, which is the linear profile between `bottom_pressure` and `top_pressure`.\n"
[outputs.tray_gas_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the vapour leaving each tray, which is its upward traffic.\n"
[outputs.tray_liquid_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid leaving each tray, which is its downward traffic.\n"
[outputs.distillate_n]
unit = "mol/s"
description = "the overhead product, which is the condenser's own outlet.\n"
[outputs.distillate_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the distillate's composition.\n"
[outputs.distillate_p]
unit = "Pa"
description = "the distillate's pressure, which is `top_pressure` where there is a condenser.\n"
[outputs.distillate_t]
unit = "K"
description = "the distillate's temperature, which is the condenser's own.\n"
[outputs.distillate_h]
unit = "J/mol"
description = "the distillate's molar enthalpy at its own state.\n"
[outputs.bottoms_n]
unit = "mol/s"
description = "the bottom product, which is the reboiler's liquid.\n"
[outputs.bottoms_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the bottoms' composition.\n"
[outputs.bottoms_p]
unit = "Pa"
description = "the bottoms' pressure, which is `bottom_pressure` where there is a reboiler.\n"
[outputs.bottoms_t]
unit = "K"
description = "the bottoms' temperature, which is the reboiler's own.\n"
[outputs.bottoms_h]
unit = "J/mol"
description = "the bottoms' molar enthalpy at its own state.\n"
[outputs.gas_side_draw_n]
type = "vector"
unit = "mol/s"
length = "one per tray, a zero where a tray draws none"
description = "the vapour each tray withdrew. **Its composition is the tray's own vapour**, and a draw taken from the wrong phase shows up in `mass_residual`, which counts the draws.\n"
[outputs.liquid_side_draw_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid each tray withdrew as a side draw.\n"
[outputs.pumparound_n]
type = "vector"
unit = "mol/s"
length = "one per tray"
description = "the liquid each tray withdrew as a pumparound.\n"
[outputs.condenser_duty]
unit = "W"
description = "the condenser's duty: its products' enthalpy less the vapour's that came in, which is negative for a condenser.\n"
[outputs.reboiler_duty]
unit = "W"
description = "the reboiler's duty: its boilup and its bottoms less the downcomer's enthalpy.\n"
[outputs.iterations]
unit = "dimensionless"
description = "the iterations taken. **One apart from NeqSim's on the captured row** - 14 against 15 - because where a solve stops is where its answer is.\n"
[outputs.temperature_residual]
unit = "dimensionless"
description = "the mean tray-temperature change at the last iteration, in K - the gate the solve was held to. **Under `naphtali_sandholm` it is the scaled MESH norm** instead, which is that solver's own measure; NeqSim reports a `NaN` in this field there.\n"
[outputs.mass_residual]
unit = "dimensionless"
description = "the products' worst component imbalance against the feed, relative. **The closure and not the class's MESH norm** - see the assumptions.\n"
[outputs.energy_residual]
unit = "dimensionless"
description = "`|H_feed + duties - H_products| / |H_feed|`, the enthalpy closure. As the mass residual, not the class's norm.\n"
[outputs.fs_factor]
unit = "dimensionless"
description = "`getFsFactor`: the gas outlet's superficial velocity over the **total** `pi*D^2/4` times the square root of its system density, in `Pa**0.5` - dimensionless because no vocabulary unit expresses it. **Not the tray calculator's own `Fs`**.\n"
[outputs.fs_factor_utilization]
unit = "dimensionless"
description = "`getFsFactorUtilization`: the factor over the limit, and **zero where the limit is not positive** rather than an infinity.\n"
[outputs.fs_factor_within_design_limit]
type = "boolean"
description = "`isFsFactorWithinDesignLimit`: `Fs <= max_allowable_fs_factor`.\n"
[outputs.minimum_diameter_for_fs_limit]
unit = "m"
description = "`getMinimumDiameterForFsLimit`: the diameter at which the factor would reach its limit, `sqrt(4*Q*sqrt(rho)/(pi*limit))`. **A function of the flow, the density and the limit alone**.\n"
[outputs.required_diameter]
unit = "m"
description = "`getRequiredDiameter`: the diameter `ColumnInternalsDesigner` resolved for the trayed internals - **the stated override where it is positive, and otherwise the round up of the diameter the controlling tray sizes to**. Not the column's own `column_diameter`, which is what the solve ran at.\n"
[outputs.controlling_tray_index]
unit = "dimensionless"
description = "`getControllingTrayIndex`: **the tray with the largest vapour mass flow, the first such where two are equal**, counted from the reboiler at 0 - the tray the diameter was sized from.\n"
[outputs.internals_design_ok]
type = "boolean"
description = "`isDesignOk`: every tray's own verdict and-ed together, so one tray outside its window is the report's answer and not a warning. **The per-tray verdicts are not published beside it**: they are flags, and this schema has no vector of booleans.\n"
[outputs.max_percent_flood]
unit = "dimensionless"
description = "`getMaxPercentFlood`: the largest per-tray load, in per cent of flood.\n"
[outputs.min_percent_flood]
unit = "dimensionless"
description = "`getMinPercentFlood`: **the smallest load above zero** - a tray reading exactly zero is skipped rather than taken - starting from the class's own `100`.\n"
[outputs.average_tray_efficiency]
unit = "dimensionless"
description = "`getAverageTrayEfficiency`: the mean of the per-tray efficiencies, or the class's own `0.65` where its loop walked no tray at all.\n"
[outputs.total_pressure_drop]
unit = "Pa"
description = "`getTotalPressureDrop`: the trays' own pressure drops, summed over every tray the designer walked.\n"
[outputs.total_pressure_drop_mbar]
unit = "dimensionless"
description = "`getTotalPressureDropMbar`, which the class publishes beside it: the same sum over `100`, in mbar. **Declared dimensionless because no vocabulary unit expresses mbar**, the spelling `hydraulics.tray_hydraulics`' own millibar output already takes.\n"
[outputs.tray_percent_flood]
type = "vector"
unit = "dimensionless"
length = "one per tray, the reboiler at index 0"
description = "`getTrayResults`' own per-tray load, one entry per tray in the column's order - **at the diameter the sizing resolved**, so every entry is a tray at the controlling one's answer rather than at its own.\n"
[outputs.tray_pressure_drop]
type = "vector"
unit = "Pa"
length = "one per tray"
description = "The per-tray total pressure drop, which `total_pressure_drop` sums.\n"
[outputs.tray_efficiency]
type = "vector"
unit = "dimensionless"
length = "one per tray"
description = "The per-tray efficiency, which `average_tray_efficiency` means - O'Connell's, from the tray's own relative volatility and liquid viscosity.\n"
[[valid_range]]
quantity = "number_of_stages"
min = 1
min_inclusive = true
severity = "error"
rationale = "a column with no stages between its ends is not a column\n"
[[valid_range]]
quantity = "top_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[[valid_range]]
quantity = "bottom_pressure"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute pressure\n"
[[valid_range]]
quantity = "temperature_tolerance"
min = 0
min_inclusive = false
severity = "error"
rationale = "a convergence tolerance is positive, and zero is a solve that never stops\n"
[[valid_range]]
quantity = "feed_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature\n"
