id = "process.expander"
name = "Expander"
kind = "direct"
assumptions = [
    "**an inlet carries four of the record's five fields and an outlet all five.** `h` is a state function of `(T, P, z)` - the same flash decides it - so accepting one would let a case hand over a state that does not exist, while an outlet reports the `h` it reached because a machine changes it.",
    "**the step is isentropic, and the inlet's entropy is derived rather than carried.** `s = f(T, P, z)` from the same flash that gives the inlet's enthalpy. The captured efficiency-of-one row is the demonstration: the outlet's entropy equals the inlet's and the step's production is zero.",
    "**the efficiency multiplies the isentropic step**: `h_out = h_in + (h_is - h_in) * eta`, so an efficiency below one recovers less work than the reversible step. Dividing - the compressor's rule - would beat the reversible machine, because an expansion's difference is negative.",
    "**the outlet temperature is solved, not assumed isothermal.** The work moves the enthalpy and `Stream::from_ph` finds the temperature at which the mixture carries it, so a compressor's outlet is hotter and an expander's colder than a `v (P2 - P1)` reading would give.",
    "**the shaft power is an output, and it is negative.** NeqSim's `getPower` is the machine's `dH = h_out - h_in`, which is below zero for an expansion; `power` reports it times the molar flow, so the recovered-work magnitude is its absolute value.",
    "the fluid is PR with the classic mixing rule, because `Stream::mixture()` resolves `databank::mixture_of(names, Cubic::Pr, None)` and has no other route.",
    "**`use_polytropic_calc` selects the stepped branch.** `Expander.run` divides the pressure range into `number_of_steps` equal increments - five by default - flashes each isentropically, multiplies the step by `polytropic_efficiency` and flashes the enthalpy; a count below one is one.",
    "**the map is `expander_chart.rs`, and its only consumer is `process.turbo_expander_compressor`.** `Expander` never reads one here; the dynamic nozzle and the transient are outside this surface.",
    "**`setPower` states the total enthalpy change, and the run back-computes the efficiency.** The port's `shaft_power` is that total, so `power/n` is the molar step; `eta = dH/(h_isentropic - h_in)` may exceed one or be negative.",
    "**The outlet-temperature surface is the inherited `solveEfficiency`, not a run mode.** `Expander.run` never reads `useOutTemperature`; a secant over the efficiency runs the isentropic branch, with a `+0.01` first step, a `+-0.01` fallback and the `[1e-6, 1]` clamp.",
    "**An unreachable target lands on the nearest clamp**: the hot side is the isenthalpic floor, the cold side the reversible outlet, after at most fifty iterations.",
    "**Both modes are the isentropic branch's.** `use_polytropic_calc` with either is refused, and so is stating both; a zero isentropic step leaves the reported efficiency absent, the class's `NaN`.",
    "**the recovered-power constraint is the only enabled one.** The parent's `speed`, `surgeMargin` and `stonewallMargin` constraints are disabled without a chart, and the summaries skip them. A positive rating adds HARD `recoveredPower`: design = the rating, max = 1.1 x it, value = `|power|`.",
    "**two thresholds, not one.** `capacity_exceeded` is `|power|` above the rating (utilization above 1), while `hard_limit_exceeded` is `|power|` above `1.1 x` the rating - the constraint's `maxValue`. A non-positive rating creates no constraint at all.",
    "**`mechanical_design` is an explicit `calcDesign` call, not part of `run`**, and it has no parameters: `ExpanderMechanicalDesign` exposes no setter, so the design is the run state and the class's constants alone.",
    "**the design stores the run's isentropic efficiency and no sizing arithmetic reads it**, so the effective efficiency - stated, back-computed or solved - is not a design input and not a design output.",
    "**the API 617 constants are the class's**: `450` m/s tip, `1.10` pressure and `30` degC margins, `0.7` velocity ratio, `70` specific speed, `50` MPa shaft shear with the `1.5` factor, `946` rotor dynamics, `137.9` MPa casing with `0.85`/`0.9` derates, `0.85` joint, `+3` mm and a `10` mm floor.",
    "**the base class's geometry is millimetres in this class**, unlike the pump's metres. The outputs are SI and the conversion is at the boundary.",
    "**`mixed_flow` and the compressor load are never selected.** `selectExpanderType` writes only `radial_inflow`/`axial` and `generator`/`brake`, so the other two enum members are stated rather than reachable.",
    "**the design's max-continuous and trip speeds and its wheel, shaft and generator weights have no public getter.** The capture reads the class's fields, and the model publishes the same stored values rather than dropping them.",
    "cost estimation (`ExpanderCostEstimate`) is out: the unit system carries no currency.",
]
references = [
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/equipment/compressor/Compressor.java` is the port source, through its no-chart steady-state branch.",
    "Smith, J. M.; Van Ness, H. C.; Abbott, M. M. (2005). \"Introduction to Chemical Engineering Thermodynamics.\", 7th ed., McGraw-Hill. The isentropic efficiency and the reversible-work reference it divides.",
    "`validation/neqsim/captures/process_expander.tsv` - the isentropic limit at an efficiency of one, and a real machine at 0.75.",
    "`validation/neqsim/captures/process_expander_steps.tsv` - the stepped branch at five and forty increments, and the isentropic row.",
    "`validation/neqsim/captures/process_expander_power_modes.tsv` - the stated power at four fractions and a negative one, and the outlet-temperature solve at 280, 250 and 240 K.",
    "`validation/neqsim/captures/process_expander_mechanical_design.tsv` - the radial/brake, axial/generator and the two casing-stress-derate states, with every design field.",
    "NeqSim master, `process/mechanicaldesign/expander/ExpanderMechanicalDesign.java`, Apache-2.0: `calcDesign`, its wheel, shaft, rotor, casing and generator sizing, and its weights and module.",
]
[source]
standard = "NeqSim process/equipment/compressor/Compressor.java"
edition = "Its `run`: the isentropic branch, the stepped polytropic branch, the `recoveredPower` constraint, the stated power's back-computed efficiency and the outlet-temperature secant; and `ExpanderMechanicalDesign.calcDesign` behind `mechanical_design`."
[inputs]
[inputs.components]
type = "components"
description = "the fluid's substances, by name, resolved against the component databank. Every port of a unit operation carries the same fluid, so this is declared once.\n"
[inputs.inlet_n]
unit = "mol/s"
description = "the inlet's molar flow. A compressor moves what it is given and adds no moles, so this is the outlet's too.\n"
[inputs.inlet_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the inlet composition, summing to one.\n"
[inputs.inlet_p]
unit = "Pa"
description = "the inlet pressure, which with `inlet_t` and `inlet_z` fixes the state whose entropy the step follows.\n"
[inputs.inlet_t]
unit = "K"
description = "the inlet temperature, which fixes the inlet enthalpy.\n"
[inputs.outlet_pressure]
unit = "Pa"
description = "the pressure the machine takes the stream to, which is `unit_ops.expander`'s own parameter.\n"
[inputs.isentropic_efficiency]
unit = "dimensionless"
description = "the machine's isentropic efficiency, in `(0, 1]`. One is the reversible limit, and the capture's second row is exactly that.\n"
[inputs.use_polytropic_calc]
type = "boolean"
optional = true
description = "whether the stepped polytropic branch runs instead of the isentropic one. Absent is the class's `false`.\n"
[inputs.polytropic_efficiency]
unit = "dimensionless"
optional = true
description = "the stepped branch's polytropic efficiency, in `(0, 1]`. Absent takes the class's `1.0`, the reversible limit. Ignored in the isentropic branch.\n"
[inputs.rated_recovered_power]
unit = "W"
optional = true
description = "`setRatedRecoveredPower`, the recovered-power rating. **Absent is 0, which creates no constraint**, and so does any non-positive value; a positive rating initializes the map.\n"
[inputs.number_of_steps]
unit = "dimensionless"
optional = true
description = "the stepped branch's pressure increments. Absent takes `Expander.DEFAULT_EXPANDER_CALC_STEPS`' `5`; a value below one is one, as the class's `Math.max(1, ...)` makes it.\n"
[inputs.shaft_power]
unit = "W"
optional = true
description = "the total shaft power the run applies instead of an efficiency, **negative for an expansion**. Stating it back-computes `reported_isentropic_efficiency`; refused with `outlet_temperature` and with `use_polytropic_calc`.\n"
[inputs.outlet_temperature]
unit = "K"
optional = true
description = "the outlet temperature the efficiency is solved for. **The class's `solveEfficiency` is a method, not a run mode**; refused with `shaft_power` and the stepped branch.\n"
[inputs.mechanical_design]
type = "boolean"
optional = true
description = "run `ExpanderMechanicalDesign.calcDesign` and publish its API 617 design. **Absent is false**, and every design output is absent then. There are no design parameters: the class exposes no setter.\n"
[outputs]
[outputs.outlet_n]
unit = "mol/s"
description = "the outlet molar flow, which is the inlet's: a turbomachine adds no moles.\n"
[outputs.outlet_z]
type = "vector"
unit = "dimensionless"
length = "one per component"
description = "the outlet composition, which is the inlet's.\n"
[outputs.outlet_p]
unit = "Pa"
description = "the outlet pressure, which is `outlet_pressure` rather than something the machine solves for.\n"
[outputs.outlet_t]
unit = "K"
description = "the outlet temperature, solved from the shifted enthalpy at the outlet pressure.\n"
[outputs.outlet_h]
unit = "J/mol"
description = "the outlet molar enthalpy: the inlet's plus the isentropic step over the efficiency. Reported because the shaft work the machine does is this difference times the flow.\n"
[outputs.power]
unit = "W"
description = "the recovered shaft power: the enthalpy change times the molar flow, **negative** for an expansion, as `getPower()` is.\n"
[outputs.recovered_power_utilization]
unit = "dimensionless"
optional = true
description = "the `recoveredPower` constraint's `min(|power| / rating, 9.99)`. Present only when the rating is positive.\n"
[outputs.max_utilization]
unit = "dimensionless"
description = "the enabled constraints' largest utilization; 0.0 without a rating, because the parent's chart constraints are disabled.\n"
[outputs.capacity_exceeded]
type = "boolean"
description = "`isCapacityExceeded`: the utilization above 1.0, so `|power|` above the rating.\n"
[outputs.hard_limit_exceeded]
type = "boolean"
description = "`isHardLimitExceeded`: `|power|` above `1.1 x` the rating, the constraint's `maxValue` - narrower than the utilization's own 1.0.\n"
[outputs.bottleneck_constraint]
type = "string"
optional = true
description = "`getBottleneckConstraint`'s name: `recoveredPower` when its utilization is above zero, and absent otherwise.\n"
[outputs.reported_isentropic_efficiency]
unit = "dimensionless"
optional = true
description = "the efficiency the mode produced: `dH/(h_isentropic - h_in)` for a stated power (above one or negative allowed), or the solved one. Absent in the ordinary branch and where the isentropic step is zero.\n"
[outputs.design_expander_type]
type = "string"
optional = true
description = "`getExpanderType`: `radial_inflow` below the class's `100000` m3/hr inlet-volume-flow threshold, `axial` above it. **`mixed_flow` is never selected** and is listed for completeness.\n"
[outputs.design_load_type]
type = "string"
optional = true
description = "`getLoadType`: `generator` above `100` kW recovered, `brake` below. **`compressor` is never selected**.\n"
[outputs.design_number_of_stages]
unit = "dimensionless"
optional = true
description = "`getNumberOfStages`: one for a radial machine, `ceil(dH/50 kJ/kg)` for an axial one.\n"
[outputs.design_wheel_diameter]
unit = "m"
optional = true
description = "`getWheelDiameter`, from the tip speed and the rated speed, clamped to `100-1000` mm; the `300` mm default where the drop or the volume flow is non-positive.\n"
[outputs.design_tip_speed]
unit = "m/s"
optional = true
description = "`getTipSpeed`: `0.7 sqrt(2 dH)` capped at `450` m/s.\n"
[outputs.design_shaft_diameter]
unit = "m"
optional = true
description = "`getShaftDiameter`: the torque's shear-stress diameter at `50` MPa, times `1.5`, rounded up to 5 mm and floored at `30` mm.\n"
[outputs.design_rated_speed]
unit = "dimensionless"
optional = true
description = "`getRatedSpeed`, in revolutions per minute.\n"
[outputs.design_max_continuous_speed]
unit = "dimensionless"
optional = true
description = "`maxContinuousSpeed`, in revolutions per minute: `1.05` times the rated speed, or the class's `21000` where the wheel sizing takes its default.\n"
[outputs.design_trip_speed]
unit = "dimensionless"
optional = true
description = "`tripSpeed`, in revolutions per minute: `1.10` times the rated speed, or the class's `23100` where the wheel sizing takes its default.\n"
[outputs.design_first_critical_speed]
unit = "dimensionless"
optional = true
description = "`getFirstCriticalSpeed`, in revolutions per minute: the Rayleigh-Ritz estimate floored at half the rated speed.\n"
[outputs.design_casing_pressure]
unit = "Pa"
optional = true
description = "`getCasingDesignPressure`: the inlet pressure times `1.10`.\n"
[outputs.design_casing_temperature]
unit = "K"
optional = true
description = "`getCasingDesignTemperature`: the hotter of the inlet and outlet, plus `30` degC.\n"
[outputs.design_casing_wall_thickness]
unit = "m"
optional = true
description = "`casingWallThickness`: the ASME shell formula at `137.9` MPa with the temperature derate, plus `3` mm and floored at `10` mm.\n"
[outputs.design_bearing_span]
unit = "m"
optional = true
description = "`bearingSpan`: `2.5` wheel diameters.\n"
[outputs.design_wheel_weight]
unit = "kg"
optional = true
description = "`wheelWeight`: the hollowed wheel's disc volume at 70 % of the steel density.\n"
[outputs.design_shaft_weight]
unit = "kg"
optional = true
description = "`shaftWeight`: the shaft cylinder at the steel density.\n"
[outputs.design_generator_weight]
unit = "kg"
optional = true
description = "`generatorWeight`: a banded empirical function of the recovered power, zero for a brake load.\n"
[outputs.design_seal_type]
type = "string"
optional = true
description = "`getSealType`: `dry_gas` above `50` bara casing pressure, `labyrinth` otherwise.\n"
[outputs.design_bearing_type]
type = "string"
optional = true
description = "`getBearingType`, by rated speed: active magnetic above `50000`, tilting pad above `20000`, sleeve otherwise.\n"
[outputs.design_inner_diameter]
unit = "m"
optional = true
description = "the casing's inner diameter, `1.3` wheel diameters.\n"
[outputs.design_outer_diameter]
unit = "m"
optional = true
description = "the casing's outer diameter: the inner one plus twice the wall thickness.\n"
[outputs.design_tantan_length]
unit = "m"
optional = true
description = "`tantanLength`: `2.0` bearing spans.\n"
[outputs.design_weight_vessel]
unit = "kg"
optional = true
description = "the base class's `weightVessel`: the casing weight, at `1.5` times the steel volume.\n"
[outputs.design_weight_internals]
unit = "kg"
optional = true
description = "the base class's `weigthInternals`: the wheel, the shaft and 30 % of the wheel.\n"
[outputs.design_weight_piping]
unit = "kg"
optional = true
description = "the base class's `weightPiping`: 15 % of the equipment weight plus the lube and seal systems.\n"
[outputs.design_weight_electro_instrument]
unit = "kg"
optional = true
description = "the base class's `weightElectroInstrument`: `0.3` times the recovered power for a generator, `50` kg for a brake.\n"
[outputs.design_weight_structural_steel]
unit = "kg"
optional = true
description = "the base class's `weightStructualSteel`: 10 % of the equipment weight plus the baseplate's 20 %.\n"
[outputs.design_weight_total]
unit = "kg"
optional = true
description = "`getWeightTotal`: the equipment, lube, seal, baseplate, piping, electrical and structural weights summed.\n"
[outputs.design_module_length]
unit = "m"
optional = true
description = "`getModuleLength`.\n"
[outputs.design_module_width]
unit = "m"
optional = true
description = "`getModuleWidth`.\n"
[outputs.design_module_height]
unit = "m"
optional = true
description = "`getModuleHeight`.\n"
[[valid_range]]
quantity = "isentropic_efficiency"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "the step multiplies by it, so zero recovers nothing and above one would beat the reversible machine"
[[valid_range]]
quantity = "polytropic_efficiency"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "each step multiplies by it, and above one would beat the reversible step"
[[valid_range]]
quantity = "inlet_t"
min = 0
min_inclusive = false
severity = "error"
rationale = "an absolute temperature"
[implementations]
python = "azoth.process.expander"
rust = "azoth_process::expander"
