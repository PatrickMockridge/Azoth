id: process.separator
name: Separator
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.separator.Separator`, `run(UUID)` at lines 674-782 of the
    3.20.0 source tree. See `NOTICE` at the repository root for the attribution.
  edition: >
    Version 3.20.0. The thermodynamic sequence taken from it is: `setPressure(P - dP)`;
    `PHflash(H + Q)` when a heat input is set and `TPflash()` otherwise; then each
    outlet built from the flashed phase, `setThermoSystemFromPhase`. What is *not* taken
    is the memoization guard, the low-flow bypass, the internal mixer and the
    entrainment model - see the notes.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Separator.java` lines
    674-782 for the procedure, and `Stream.setThermoSystemFromPhase` for how an outlet
    is built from a flashed phase.'
  - '`eos.pt_flash` - the isothermal flash this model runs when no duty is set, and the
    model its answer is checked against.'
  - '`eos.ph_flash` - the isenthalpic flash it runs when a duty is set.'

algorithm:
  scheme: flash_then_phase_split
  initialisation: wilson
  convergence: absolute
  tolerance: 1.0e-10
  max_iterations: 300
  inner:
    scheme: rachford_rice_bisection
    convergence: absolute
    tolerance: 1.0e-14
    max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the constant term of each component's `Cp/R` polynomial, as in
      `eos.molar_enthalpy_entropy`. The ideal-gas block is required even when
      `heat_duty` is zero, because the model's signature is fixed and the duty branch
      is the same model.
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: each component's ideal-gas molar entropy at `T_ref` and `P_ref`
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    unit: K
    description: >
      the feed's temperature. It is the outlet temperature too when `heat_duty` is
      zero, which is the common case - a separator with no heat input does not change
      the temperature of what it is holding.
  P:
    unit: Pa
    description: the feed's absolute pressure, before the pressure drop
  n:
    unit: mol/s
    description: >
      the feed's molar flow rate. Every answer is linear in it, and doubling it doubles
      both outlet flows and changes nothing else - which is a property of the model
      rather than of the number, and the reason the flow is a scale factor rather than
      part of the thermodynamic state.
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions. Checked rather than renormalised.
  pressure_drop:
    unit: Pa
    description: >
      the pressure the vessel drops, subtracted from `P` before the flash. Zero is a
      separator held at its feed pressure, which is the default in NeqSim and here.
  heat_duty:
    unit: W
    description: >
      the duty applied to the feed. Zero means the separator is isothermal at its feed
      temperature and the procedure is a `TPflash`; non-zero makes it a `PHflash` at
      `P - pressure_drop`. A negative duty is a cooled separator and is not special.

outputs:
  T:
    unit: K
    description: >
      the temperature both outlets leave at. The feed's temperature unless a duty is
      set, in which case it is the flash's answer.
  P:
    unit: Pa
    description: the pressure both outlets leave at, `P - pressure_drop`
  beta:
    unit: dimensionless
    description: >
      the vapour fraction. Absent for a single-phase feed. **Read `phase`, not this** -
      see the notes.
  gas_flow:
    unit: mol/s
    description: molar flow to the gas outlet. Zero when the feed is all liquid.
  gas_z:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the gas outlet's mole fractions, or the feed's when `gas_flow` is zero. A
      zero-flow stream has no phase composition of its own, and a row of zeros is not a
      composition - see the notes.
  liquid_flow:
    unit: mol/s
    description: molar flow to the liquid outlet. Zero when the feed is all vapour.
  liquid_z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the liquid outlet's mole fractions, by the same convention
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: >
      which phase the feed was in. Four values, not the three `eos.ph_flash` declares:
      the `TPflash` branch can report `trivial`, where the flash converged to
      `x = y = z` and established that the feed is single phase but not which one.
  iterations:
    unit: dimensionless
    description: flash iterations taken, and the evidence the split was made at a converged state

valid_range:
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      a flow of zero moles is not a stream, and the duty branch divides by it - so a
      zero would reach the arithmetic as a division by zero rather than as a rejected
      input.
  - quantity: pressure_drop
    min: 0.0
    min_inclusive: true
    severity: error
    rationale: >
      a separator drops pressure. A negative drop is a pressure rise, which is a
      compressor, and admitting it here would let a caller model one by accident and
      get an answer that is arithmetically fine and physically nonsense.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute pressure; zero and below are not states. `P - pressure_drop` at or
      below zero is caught by the flash rather than here, because the check the flash
      already applies is the one that matters.

assumptions:
  - '**the two outlets are at one temperature and one pressure.** That is what a
    separator is, and it is why the result carries a single `T` and `P` rather than a
    pair each. A model that let the outlets differ would be modelling a heat exchanger
    with a phase split.'
  - '**the feed is mixed by the caller.** NeqSim runs its own internal `Mixer` over a
    separator''s inlet streams before flashing; this takes one feed. A separator with
    several inlets is `process.mixer` upstream of this, which is the same physics
    composed rather than duplicated.'
  - '**`trivial` is routed to the gas outlet, and that is a convention rather than a
    finding.** The flash converged to `x = y = z`, which says the feed is single phase
    and *not which one*. There is no defensible way to choose, so the whole feed goes
    to one outlet, `phase` reports that it happened, and a caller who needs to know
    which phase it is holding has to ask `eos.stability_test` or a phase-boundary
    model. This is a real limitation and it is not checked.'
  - '**entrainment is not modelled.** A real separator carries droplets of one phase
    into the other outlet. NeqSim has both a fixed carry-over fraction
    (`addPhaseFractionToPhase`) and a performance model behind it; neither is ported,
    and the outlets here are exactly the flashed phases.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace, with the alpha
    function and mixing rule `eos.pt_flash` uses. A separator''s split is a property of
    the model, not of the mixture alone.'
  - '**no check that the feed is stable.** This asks what the flash answers, not
    whether the answer is the equilibrium state - the same division `eos.ph_flash`
    makes.'

implementations:
  python: azoth.process.separator
  rust: azoth_process::separator
