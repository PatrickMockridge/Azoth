id: process.separator
name: Separator
kind: procedure

description: >
  One feed split into a gas and a liquid at a single temperature and pressure.

  A separator is a vessel held at one state with two streams leaving it, so the
  outlets share the flash's temperature and pressure and differ only in how much of
  the feed they carry and what it is made of. The physics is one flash and the
  arithmetic that follows from it: the vapour fraction splits the molar flow, and the
  equilibrium compositions become the two outlets'.

  This is the first unit operation ported from NeqSim, and it is the one the Pareto
  argument rests on. NeqSim's `Separator.run` is 109 lines of a 4,511-line file, and
  what those 109 lines do is: drop the pressure, flash, and split. The rest of the file
  - and the missing 4,400 lines - is level control, weir flow, mist-eliminator pressure
  drop, entrainment carry-over, geometry and mechanical design.

  **It is a port, not a transcription.** The two places it differs from NeqSim's source
  are recorded in the notes, and both are about removing a dependency on something
  outside the inputs rather than about simplifying the physics.

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.separator.Separator`, `run(UUID)` at lines 674-782 of the
    3.20.0 source tree. See `NOTICE` at the repository root for the attribution.
  edition: >
    Version 3.20.0. The thermodynamic sequence taken from it is: `setPressure(P - dP)`;
    `PHflash(H + Q)` when a heat input is set and `TPflash()` otherwise; then each
    outlet built from the flashed phase, `setThermoSystemFromPhase`. What is *not* taken
    is the memoization guard, the low-flow bypass, the internal mixer and the
    entrainment model - see the notes.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Separator.java` lines
    674-782 for the procedure, and `Stream.setThermoSystemFromPhase` for how an outlet
    is built from a flashed phase.'
  - '`eos.pt_flash` - the isothermal flash this model runs when no duty is set, and the
    model its answer is checked against.'
  - '`eos.ph_flash` - the isenthalpic flash it runs when a duty is set.'

algorithm:
  scheme: flash_then_phase_split
  initialisation: wilson
  convergence: absolute
  tolerance: 1.0e-10
  max_iterations: 300
  inner:
    scheme: rachford_rice_bisection
    convergence: absolute
    tolerance: 1.0e-14
    max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: binary interaction parameters, as in `eos.pt_flash`
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the constant term of each component's `Cp/R` polynomial, as in
      `eos.molar_enthalpy_entropy`. The ideal-gas block is required even when
      `heat_duty` is zero, because the model's signature is fixed and the duty branch
      is the same model.
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: each component's ideal-gas molar entropy at `T_ref` and `P_ref`
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    unit: K
    description: >
      the feed's temperature. It is the outlet temperature too when `heat_duty` is
      zero, which is the common case - a separator with no heat input does not change
      the temperature of what it is holding.
  P:
    unit: Pa
    description: the feed's absolute pressure, before the pressure drop
  n:
    unit: mol/s
    description: >
      the feed's molar flow rate. Every answer is linear in it, and doubling it doubles
      both outlet flows and changes nothing else - which is a property of the model
      rather than of the number, and the reason the flow is a scale factor rather than
      part of the thermodynamic state.
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the feed's mole fractions. Checked rather than renormalised.
  pressure_drop:
    unit: Pa
    description: >
      the pressure the vessel drops, subtracted from `P` before the flash. Zero is a
      separator held at its feed pressure, which is the default in NeqSim and here.
  heat_duty:
    unit: W
    description: >
      the duty applied to the feed. Zero means the separator is isothermal at its feed
      temperature and the procedure is a `TPflash`; non-zero makes it a `PHflash` at
      `P - pressure_drop`. A negative duty is a cooled separator and is not special.

outputs:
  T:
    unit: K
    description: >
      the temperature both outlets leave at. The feed's temperature unless a duty is
      set, in which case it is the flash's answer.
  P:
    unit: Pa
    description: the pressure both outlets leave at, `P - pressure_drop`
  beta:
    unit: dimensionless
    description: >
      the vapour fraction. Absent for a single-phase feed. **Read `phase`, not this** -
      see the notes.
  gas_flow:
    unit: mol/s
    description: molar flow to the gas outlet. Zero when the feed is all liquid.
  gas_z:
    type: vector
    unit: dimensionless
    length: one per component
    description: >
      the gas outlet's mole fractions, or the feed's when `gas_flow` is zero. A
      zero-flow stream has no phase composition of its own, and a row of zeros is not a
      composition - see the notes.
  liquid_flow:
    unit: mol/s
    description: molar flow to the liquid outlet. Zero when the feed is all vapour.
  liquid_z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the liquid outlet's mole fractions, by the same convention
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: >
      which phase the feed was in. Four values, not the three `eos.ph_flash` declares:
      the `TPflash` branch can report `trivial`, where the flash converged to
      `x = y = z` and established that the feed is single phase but not which one.
  iterations:
    unit: dimensionless
    description: flash iterations taken, and the evidence the split was made at a converged state

valid_range:
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      a flow of zero moles is not a stream, and the duty branch divides by it - so a
      zero would reach the arithmetic as a division by zero rather than as a rejected
      input.
  - quantity: pressure_drop
    min: 0.0
    min_inclusive: true
    severity: error
    rationale: >
      a separator drops pressure. A negative drop is a pressure rise, which is a
      compressor, and admitting it here would let a caller model one by accident and
      get an answer that is arithmetically fine and physically nonsense.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      an absolute pressure; zero and below are not states. `P - pressure_drop` at or
      below zero is caught by the flash rather than here, because the check the flash
      already applies is the one that matters.

assumptions:
  - '**the two outlets are at one temperature and one pressure.** That is what a
    separator is, and it is why the result carries a single `T` and `P` rather than a
    pair each. A model that let the outlets differ would be modelling a heat exchanger
    with a phase split.'
  - '**the feed is mixed by the caller.** NeqSim runs its own internal `Mixer` over a
    separator''s inlet streams before flashing; this takes one feed. A separator with
    several inlets is `process.mixer` upstream of this, which is the same physics
    composed rather than duplicated.'
  - '**`trivial` is routed to the gas outlet, and that is a convention rather than a
    finding.** The flash converged to `x = y = z`, which says the feed is single phase
    and *not which one*. There is no defensible way to choose, so the whole feed goes
    to one outlet, `phase` reports that it happened, and a caller who needs to know
    which phase it is holding has to ask `eos.stability_test` or a phase-boundary
    model. This is a real limitation and it is not checked.'
  - '**entrainment is not modelled.** A real separator carries droplets of one phase
    into the other outlet. NeqSim has both a fixed carry-over fraction
    (`addPhaseFractionToPhase`) and a performance model behind it; neither is ported,
    and the outlets here are exactly the flashed phases.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace, with the alpha
    function and mixing rule `eos.pt_flash` uses. A separator''s split is a property of
    the model, not of the mixture alone.'
  - '**no check that the feed is stable.** This asks what the flash answers, not
    whether the answer is the equilibrium state - the same division `eos.ph_flash`
    makes.'

notes: >
  # What is ported, and what is deliberately not

  Taken from `Separator.run` (NeqSim 3.20.0, lines 674-782): the pressure drop, the
  choice between an isenthalpic and an isothermal flash, and building an outlet from a
  flashed phase. That is lines 694, 697-711 and 740-759.

  Not taken, each with a reason rather than for brevity:

  **The internal `Mixer` at line 675.** NeqSim feeds a separator through a mixer of its
  own inlet streams. Composing this model over `process.mixer` is the same arithmetic
  with one fewer place for a stream to be handled differently, and it keeps a
  single-feed unit from carrying multi-feed machinery.

  **The memoization guard at lines 684-688**, which returns early when `|dH/H|`,
  `|dF/F|` and `|dP/P|` are all below `1e-6`. That is an optimisation for a transient
  loop that re-runs the same steady state, and it makes the answer depend on what ran
  before. A model whose answer depends on its history is the opposite of what every
  worked example in this book is for.

  **The entrainment model at lines 715-738.** Real physics, and it is a *performance*
  model with droplet-size and geometry inputs - it belongs to separator sizing, which
  `docs/src/roadmap.md` records as out of scope.

  **The low-flow bypass at 676-680**, which zeroes both outlets below a minimum flow.
  The `n > 0` range check refuses that input instead, which is the same decision made
  loudly rather than quietly.

  **The re-flash of the phase outlets at 760-775.** NeqSim re-runs each outlet as a
  stream, which can re-split a phase that was already separated. The outlet of a
  separator here is the phase the flash found, at the state the flash found it.

  # The duty branch measures its enthalpy from the feed's own state

  NeqSim reads `getEnthalpy()` off a system whose pressure it has already changed but
  which it has not re-flashed, so the number it adds the duty to is whatever the last
  flash left on that object. This evaluates the feed's enthalpy at `(T, P)` explicitly,
  by calling `eos.ph_flash`'s `enthalpy_at` at the *inlet* state, so the answer depends
  on the inputs and on nothing else. It is the decision `eos.stability_test` records
  about NeqSim's `Component.getK()`: a calculation must not be coupled to whatever ran
  before it.

  # Read `phase`, not `beta`

  For a single-phase feed the flash returns no `beta` - correctly, because the number
  it would return is the *extrapolated* split, and values outside `[0, 1]` are ordinary
  there. This model therefore branches on `phase`, and multiplies the feed by `beta`
  only where the flash has said there is a genuine split. A model that multiplied by
  1.888 would produce a wrong answer shaped exactly like a right one, and no check on
  the totals would see it.

  # A zero-flow outlet carries the feed's composition

  The gas composition of an all-liquid feed is not a physical quantity, and neither is
  the liquid composition of an all-vapour one. Reporting zeros would be honest about
  that and useless downstream, because a row of zeros is not a composition - it does
  not sum to one, and the first unit to read it would produce a plausible wrong answer.
  The feed's composition is carried through instead, with `gas_flow = 0` being the
  field that says the outlet is empty. NeqSim's answer is an empty thermo system, which
  carries no composition at all; this is the same statement made in a form a caller can
  pass on.

  # What is checked, and what is not

  Two things are asserted about every case. The first is a **mole balance**: `gas_flow
  + liquid_flow` equals `n` to the tolerance, which holds at every answer rather than at
  one recorded one. The second is a **cross-model check that is not self-referential**:
  with `heat_duty = 0` this model is `eos.pt_flash` plus arithmetic, so its vapour
  fraction must equal that model's `beta` for the same state, and its two compositions
  must be that model's `x` and `y`. `eos.ph_flash`'s own worked case at 300 K and 20 bar
  is the one used, and its `beta = 0.6824390296506371` is where this model's
  `gas_flow` comes from.

  **That establishes that the split is the flash's split.** It does not establish that
  the flash is right, and the confidence in the flash is whatever `eos.pt_flash`'s own
  notes support. Nor does anything here check the entrainment that a real vessel has
  and this model does not.

implementations:
  python: azoth.process.separator
  rust: azoth_process::separator

cases:
  - id: a_two_phase_feed_splits_by_the_flash_vapour_fraction
    note: >
      A methane/n-butane feed at 300 K and 20 bar - the state `eos.ph_flash`'s own first
      case uses, where that model reports `beta = 0.6824390296506371`. Ten moles per
      second of feed therefore leaves as 6.824390296506371 mol/s of gas and
      3.175609703493629 mol/s of liquid, and those two numbers are the whole assertion.

      Nothing here is a recorded measurement: the flows are the flash's vapour fraction
      multiplied by the feed, and the vapour fraction is a number another model's spec
      already states and its tests already pin. That is the cross-check, and it is why
      this case needs no reference to NeqSim's output to be worth having.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 300.0
      P: 2000000.0
      n: 10.0
      z: [0.6, 0.4]
      pressure_drop: 0.0
      heat_duty: 0.0
    expected:
      T: 300.0
      P: 2000000.0
      beta: 0.6824390296506371
      gas_flow: 6.824390296506371
      liquid_flow: 3.175609703493629
    tolerance: 1.0e-9

  - id: a_pressure_drop_leaves_the_temperature_alone
    note: >
      The same feed with a 5 bar drop. An isothermal flash at a new pressure is still
      isothermal, so the temperature is 300 K exactly, and the outlet pressure is the
      arithmetic 20 - 5 = 15 bar. **The flows are not asserted**, because the vapour
      fraction at 15 bar is a different number and this case exists to pin the two
      parts that are not a flash - that the drop is subtracted where it says it is, and
      that it does not move the temperature.

      A model that dropped the pressure *after* flashing, or that flashed at the inlet
      pressure and then relabelled it, passes the first case and fails this one.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 300.0
      P: 2000000.0
      n: 10.0
      z: [0.6, 0.4]
      pressure_drop: 500000.0
      heat_duty: 0.0
    expected:
      T: 300.0
      P: 1500000.0
    tolerance: 1.0e-9

  - id: a_single_phase_feed_leaves_one_outlet_empty
    note: >
      The same mixture at 450 K and 20 bar, above the dew point, where `eos.ph_flash`'s
      own second case has it single-phase. All ten moles leave in one stream and the
      other carries nothing.

      **The assertion is deliberately independent of which outlet that is.** The feed
      is all vapour, and the routing in the implementation sends it to the gas outlet;
      but `trivial` - which that same flash can also report at a single-phase state,
      and which says the feed is single phase without saying which - is routed the same
      way. So `gas_flow = 10` and `liquid_flow = 0` holds under either verdict, and this
      case fails only if the model splits a feed that the flash did not split.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: 450.0
      P: 2000000.0
      n: 10.0
      z: [0.6, 0.4]
      pressure_drop: 0.0
      heat_duty: 0.0
    expected:
      T: 450.0
      P: 2000000.0
      gas_flow: 10.0
      liquid_flow: 0.0
    tolerance: 1.0e-9
