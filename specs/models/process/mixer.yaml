id: process.mixer
name: Mixer
kind: procedure

description: >
  Several feeds blended into one.

  The outlet pressure is the **lowest** inlet pressure, and the outlet temperature is
  solved for rather than averaged: the blend happens at constant enthalpy, and the
  temperature of a mixture is not the mean of its parts' temperatures because the
  enthalpy is not linear in it.

  This is the first unit operation in the port whose state is a *set* of streams rather
  than one, and the shape it establishes is the one every later multi-inlet unit uses:
  a vector per state variable, and a matrix of compositions with one row per inlet.

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.mixer.Mixer`, `run(UUID)` at lines 642-729 of the 3.20.0
    source tree, with the material balance in `mixStream()` at `:192-320` and the
    enthalpy in `calcMixStreamEnthalpy()` at `:537-544`.
  edition: >
    Version 3.20.0. Taken from it: the mole accumulation (`:292`), the outlet pressure
    (`:681`) and `PHflash(sum of inlet enthalpies)` (`:702-711`). Not taken: the
    component-matching machinery for inlets whose pseudo-fractions have different molar
    masses (`:285-291`), which cannot arise here, and the zero-flow and single-inlet
    special cases.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Mixer.java` lines 642-729
    and `mixStream()` at 192-320.'
  - '`eos.ph_flash` - the isenthalpic flash the blend is solved with.'
  - '`process.separator` - the other half of the pair the roadmap proves the process
    layer on.'

algorithm:
  scheme: blend_then_isenthalpic_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: >
      binary interaction parameters, as in `eos.pt_flash`. **One matrix for every
      inlet**: all the feeds share a component set here, which is what makes the
      accumulation a vector sum rather than the component-matching problem NeqSim has to
      solve.
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: the constant term of each component's `Cp/R` polynomial
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      each component's ideal-gas molar entropy at `T_ref` and `P_ref`. **Not used** - an
      isenthalpic flash needs no entropy - and required because it belongs to the same
      ideal-gas model the enthalpy comes from.
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    type: vector
    unit: K
    length: one per inlet
    description: each inlet's absolute temperature
  P:
    type: vector
    unit: Pa
    length: one per inlet
    description: >
      each inlet's absolute pressure. The outlet is the **minimum** of these - a mixer is
      a vessel, and nothing in it can be above the lowest pressure any feed arrives at.
      A feed arriving at 20 bar into a vessel held at 15 bar flashes as it enters.
  n:
    type: vector
    unit: mol/s
    length: one per inlet
    description: each inlet's molar flow rate
  z:
    type: matrix
    unit: dimensionless
    shape: "S x N, one row per inlet, each row summing to 1"
    description: each inlet's mole fractions, in the mixture's component order

outputs:
  T:
    unit: K
    description: the outlet temperature, from the isenthalpic flash. This is the answer.
  P:
    unit: Pa
    description: the outlet pressure, the lowest of the inlet pressures
  flow:
    unit: mol/s
    description: the outlet molar flow, the sum of the inlets'
  z_out:
    type: vector
    unit: dimensionless
    length: one per component
    description: the outlet mole fractions, the flow-weighted blend of the inlets'
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase blend
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the blend is in
  iterations:
    unit: dimensionless
    description: flash iterations taken

valid_range:
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      each inlet must carry something. A zero-flow inlet contributes no moles and no
      enthalpy, and the blend's division by the total flow would fail if they all were -
      so the check is on the *smallest* inlet, which is the one that would produce a
      meaningless composition row.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states

assumptions:
  - '**every inlet shares one component set.** NeqSim accumulates component by component
    and has to handle an inlet carrying a pseudo-fraction the others do not, or one whose
    molar mass differs from the destination''s (`Mixer.java:285-291`). azoth takes one
    `Mixture` for the whole model, so all the inlets already agree and the accumulation is
    a vector sum. A caller blending streams with different component sets has two
    mixtures, and this model is not the one to combine them.'
  - '**the outlet pressure is the minimum, not an average.** See the note on `P`. A mixer
    delivering a stream at a pressure nobody supplied would be a pump, and the arithmetic
    would still look plausible.'
  - '**no heat loss and no volume.** The blend is adiabatic at constant enthalpy. NeqSim
    carries a `specifiedOutletPressure` override (`:223-226`) and a settable outlet
    temperature; neither is here, and the outlet-pressure override in particular would
    break the one property that makes a mixer a mixer.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

notes: >
  # The one expression that had to change

  NeqSim sums **total** enthalpies in joules (`calcMixStreamEnthalpy`, `:537-544`) and its
  `PHflash` takes joules, so the sum is the whole energy balance. `eos.ph_flash` takes a
  **molar** enthalpy, so the port is the flow-weighted mean:

  ```text
  H_out = sum_s (n_s * H_s) / sum_s n_s
  ```

  Same physics - an energy balance on an open system with no heat and no work - and a
  different expression. It is the only place in this port where a formula looks different
  from the source it came from, which is why it is written down rather than left to read
  as a transcription error.

  # What is checked, and what is not

  Three identities, each computed independently of this model in the test:

  - **Moles are conserved**: `flow == sum(n)`.
  - **The composition is the blend**: `z_out == sum(n_s z_s) / sum(n_s)`, which for two
    inlets is arithmetic a reader can do by hand.
  - **The energy is conserved**: `flow * H_out == sum_s (n_s H_s)`, with each `H_s` from
    `eos.molar_enthalpy_entropy` at that inlet's own state. **This is the check that
    would catch the mean-versus-sum mistake**, because a model that passed the summed
    enthalpy to a molar flash would be wrong by a factor of `sum(n_s)` and would still
    produce a temperature.

  The recorded case is the second check and it is weaker.

  # The temperature is not between the inlets' temperatures, necessarily

  It usually is, and the worked case has it so: 300 K and 350 K blend to 320.92 K. But
  that is a consequence of the energy balance rather than a rule, and a blend of two
  streams at the same temperature is at that temperature whatever the flows. The mixer
  should not be described as averaging, and this model does not average.

implementations:
  python: azoth.process.mixer
  rust: azoth_process::mixer

cases:
  - id: two_different_feeds_blend
    note: >
      Six moles per second of methane-rich gas at 300 K and 20 bar, four at 350 K and
      15 bar with the composition reversed, blended into ten. The outlet is at **15 bar**
      - the lower of the two, not the higher - at **321.11 K**, with
      `z_out = [0.52, 0.48]`.

      The second inlet is superheated vapour at 15 bar, which is where this case stopped
      being a rounding exercise: its enthalpy used to be evaluated at the cubic root of
      the flash's extrapolated phase composition rather than at the feed's own root, and
      the blend came out 50.6 J/mol away from the energy balance. The same case now closes
      it to 1.2e-05 J/mol, and the recorded temperature moved by 0.19 K.

      The composition is the part worth reading and it is arithmetic a human can redo:
      `(6*0.6 + 4*0.4)/10 = 0.52` and `(6*0.4 + 4*0.6)/10 = 0.48`. Nothing about it needs
      the equation of state, so it is a check on the blend rather than on the flash.

      The temperature is a flash answer and the test recomputes the energy balance rather
      than trusting this number.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: [300.0, 350.0]
      P: [2000000.0, 1500000.0]
      n: [6.0, 4.0]
      z: [[0.6, 0.4], [0.4, 0.6]]
    expected:
      T: 321.10986042022694
      P: 1500000.0
      flow: 10.0
      z_out: [0.52, 0.48]
    tolerance: 1.0e-9

  - id: two_identical_feeds_double_the_flow_and_change_nothing_else
    note: >
      The same feed twice. The outlet is the inlet at twice the flow - 300 K **exactly**,
      20 bar, `z_out = z` - because a mixture of a stream with itself is itself.

      This is the case that catches a mean-versus-sum mistake in a way that does not rely
      on a flash: a model that passed the summed enthalpy would produce a temperature that
      is not 300 K, and one that averaged the compositions wrongly would move `z_out`.
    inputs:
      Tc: [190.56, 425.12]
      Pc: [4599000.0, 3796000.0]
      omega: [0.0115, 0.2002]
      kij: [[0.0, 0.01289789], [0.01289789, 0.0]]
      cp_a: [3.0, 5.0]
      cp_b: [0.0, 0.0]
      cp_c: [0.0, 0.0]
      cp_d: [0.0, 0.0]
      h_ref: [0.0, 0.0]
      s_ref: [0.0, 0.0]
      T_ref: 300.0
      P_ref: 100000.0
      T: [300.0, 300.0]
      P: [2000000.0, 2000000.0]
      n: [6.0, 4.0]
      z: [[0.6, 0.4], [0.6, 0.4]]
    expected:
      T: 300.0
      P: 2000000.0
      flow: 10.0
      z_out: [0.6, 0.4]
    tolerance: 1.0e-7
