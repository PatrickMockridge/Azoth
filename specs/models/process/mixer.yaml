id: process.mixer
name: Mixer
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.mixer.Mixer`, `run(UUID)` at lines 642-729 of the 3.20.0
    source tree, with the material balance in `mixStream()` at `:192-320` and the
    enthalpy in `calcMixStreamEnthalpy()` at `:537-544`.
  edition: >
    Version 3.20.0. Taken from it: the mole accumulation (`:292`), the outlet pressure
    (`:681`) and `PHflash(sum of inlet enthalpies)` (`:702-711`). Not taken: the
    component-matching machinery for inlets whose pseudo-fractions have different molar
    masses (`:285-291`), which cannot arise here, and the zero-flow and single-inlet
    special cases.

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Mixer.java` lines 642-729
    and `mixStream()` at 192-320.'
  - '`eos.ph_flash` - the isenthalpic flash the blend is solved with.'
  - '`process.separator` - the other half of the pair the roadmap proves the process
    layer on.'

algorithm:
  scheme: blend_then_isenthalpic_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  Tc:
    type: vector
    unit: K
    length: one per component
    description: critical temperatures, in the mixture's component order
  Pc:
    type: vector
    unit: Pa
    length: one per component
    description: critical pressures, in the same order
  omega:
    type: vector
    unit: dimensionless
    length: one per component
    description: acentric factors, in the same order
  kij:
    type: matrix
    unit: dimensionless
    shape: N x N, symmetric, zero diagonal
    description: >
      binary interaction parameters, as in `eos.pt_flash`. **One matrix for every
      inlet**: all the feeds share a component set here, which is what makes the
      accumulation a vector sum rather than the component-matching problem NeqSim has to
      solve.
  cp_a:
    type: vector
    unit: dimensionless
    length: one per component
    description: the constant term of each component's `Cp/R` polynomial
  cp_b:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta` in each component's polynomial
  cp_c:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**2`
  cp_d:
    type: vector
    unit: dimensionless
    length: one per component
    description: the coefficient of `theta**3`
  h_ref:
    type: vector
    unit: J/mol
    length: one per component
    description: each component's ideal-gas molar enthalpy at `T_ref`. The datum.
  s_ref:
    type: vector
    unit: J/(mol*K)
    length: one per component
    description: >
      each component's ideal-gas molar entropy at `T_ref` and `P_ref`. **Not used** - an
      isenthalpic flash needs no entropy - and required because it belongs to the same
      ideal-gas model the enthalpy comes from.
  T_ref:
    unit: K
    description: the temperature the reference values are given at
  P_ref:
    unit: Pa
    description: the pressure `s_ref` is given at
  T:
    type: vector
    unit: K
    length: one per inlet
    description: each inlet's absolute temperature
  P:
    type: vector
    unit: Pa
    length: one per inlet
    description: >
      each inlet's absolute pressure. The outlet is the **minimum** of these - a mixer is
      a vessel, and nothing in it can be above the lowest pressure any feed arrives at.
      A feed arriving at 20 bar into a vessel held at 15 bar flashes as it enters.
  n:
    type: vector
    unit: mol/s
    length: one per inlet
    description: each inlet's molar flow rate
  z:
    type: matrix
    unit: dimensionless
    shape: "S x N, one row per inlet, each row summing to 1"
    description: each inlet's mole fractions, in the mixture's component order

outputs:
  T:
    unit: K
    description: the outlet temperature, from the isenthalpic flash. This is the answer.
  P:
    unit: Pa
    description: the outlet pressure, the lowest of the inlet pressures
  flow:
    unit: mol/s
    description: the outlet molar flow, the sum of the inlets'
  z_out:
    type: vector
    unit: dimensionless
    length: one per component
    description: the outlet mole fractions, the flow-weighted blend of the inlets'
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase blend
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the blend is in
  iterations:
    unit: dimensionless
    description: flash iterations taken

valid_range:
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: >
      each inlet must carry something. A zero-flow inlet contributes no moles and no
      enthalpy, and the blend's division by the total flow would fail if they all were -
      so the check is on the *smallest* inlet, which is the one that would produce a
      meaningless composition row.
  - quantity: T
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute temperature; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states

assumptions:
  - '**every inlet shares one component set.** NeqSim accumulates component by component
    and has to handle an inlet carrying a pseudo-fraction the others do not, or one whose
    molar mass differs from the destination''s (`Mixer.java:285-291`). azoth takes one
    `Mixture` for the whole model, so all the inlets already agree and the accumulation is
    a vector sum. A caller blending streams with different component sets has two
    mixtures, and this model is not the one to combine them.'
  - '**the outlet pressure is the minimum, not an average.** See the note on `P`. A mixer
    delivering a stream at a pressure nobody supplied would be a pump, and the arithmetic
    would still look plausible.'
  - '**no heat loss and no volume.** The blend is adiabatic at constant enthalpy. NeqSim
    carries a `specifiedOutletPressure` override (`:223-226`) and a settable outlet
    temperature; neither is here, and the outlet-pressure override in particular would
    break the one property that makes a mixer a mixer.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace.'

implementations:
  python: azoth.process.mixer
  rust: azoth_process::mixer
