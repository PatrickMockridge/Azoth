id: process.expander
name: Expander
kind: procedure

source:
  standard: >
    NeqSim, developed at NTNU and maintained by Equinor - Apache-2.0. The port source is
    `neqsim.process.equipment.expander.Expander`, `run(UUID)` at lines 608-668 of a
    669-line file. `Expander` extends `Compressor` and overrides `run`; its isentropic
    path at `:646-660` differs from the compressor's in one line.
  edition: >
    Version 3.20.0. Taken from it: `PSflash(entropy)` at the outlet pressure (`:650`),
    `dH = (H_is - H_in) * efficiency` (`:653`) and `PHflash(H_in + dH)` (`:659`). Not
    taken: the five-step polytropic path (`:620-633`) and the specified-shaft-power
    branch (`:652`).

references:
  - 'NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `Expander.java` lines
    608-668, and `Compressor.java:1738` for the division it does not do.'
  - '`process.compressor` - the same procedure, and the spec where its derivation is
    written down.'
  - '`eos.ps_flash` - the isentropic flash that finds the ideal outlet state.'

algorithm:
  scheme: isentropic_efficiency_flash
  initialisation: wilson
  convergence: relative
  tolerance: 1.0e-8
  max_iterations: 200
  inner:
    scheme: successive_substitution_flash
    initialisation: wilson
    convergence: absolute
    tolerance: 1.0e-10
    max_iterations: 300
    inner:
      scheme: rachford_rice_bisection
      convergence: absolute
      tolerance: 1.0e-14
      max_iterations: 200

inputs:
  components:
    type: components
    length: one entry per component
    description: >
      the substances the mixture is made of, by name, resolved against the component
      databank this library ships (`data/components/`, compiled from NeqSim's COMP.csv
      and INTER.csv) with the loaded keycard's overrides applied. The critical
      constants, the acentric factors, the binary interaction parameters and the
      ideal-gas heat-capacity coefficients all come from there.

      **A name, rather than nine parallel vectors of numbers.** Until this input
      existed, `Tc`, `Pc`, `omega`, `kij` and `cp_a`..`cp_e` were retyped into every
      spec and every case - numbers in a YAML file that nothing could check against
      anything, and that in fact disagreed with the databank. `azoth.eos.components`
      lists what is available; a keycard adds a substance the databank does not have.
  T:
    unit: K
    description: the inlet absolute temperature
  P:
    unit: Pa
    description: the inlet absolute pressure. The outlet must be **below** it.
  n:
    unit: mol/s
    description: the inlet molar flow rate, which turns the molar enthalpy change into a power
  z:
    type: vector
    unit: dimensionless
    length: one per component
    description: the inlet mole fractions
  outlet_pressure:
    unit: Pa
    description: >
      the pressure the expander discharges to. Must be strictly **below** `P` - an
      expander that raises the pressure is a compressor, and the check is the mirror of
      the one that model makes.
  efficiency:
    unit: dimensionless
    description: >
      the **isentropic** efficiency, in `(0, 1]`. Here a *smaller* number gives a warmer
      outlet and less power, which is the opposite of the compressor's sense and is why
      the two are separate models rather than one with a sign.

outputs:
  T:
    unit: K
    description: >
      the outlet temperature. **Above** `isentropic_temperature` - a real expander
      delivers less work than an ideal one and leaves the fluid warmer, and the gap is the
      loss.
  P:
    unit: Pa
    description: the outlet pressure - the specification, not an answer
  power:
    unit: W
    description: >
      the shaft power, **negative**: the fluid is doing the work. The convention is the
      same one the compressor and pump use - positive into the fluid - so the three can be
      summed in a flowsheet without a rule about which sign means what. NeqSim reports the
      opposite sign on its energy port (`Expander.java:661`), which is worth knowing
      before comparing the two.
  beta:
    unit: dimensionless
    description: the vapour fraction at the outlet, absent for a single-phase stream
  phase:
    type: enum
    values: [all_liquid, two_phase, all_vapour, trivial]
    description: which phase the stream is in at the outlet
  isentropic_temperature:
    unit: K
    description: >
      the temperature the fluid would have reached at unit efficiency - the **coldest** it
      could reach for this pressure drop. It is the bound a real expander's outlet is
      always above.
  iterations:
    unit: dimensionless
    description: flash iterations taken, summed over the two flashes this model runs

valid_range:
  - quantity: efficiency
    min: 0.0
    min_inclusive: false
    max: 1.0
    max_inclusive: true
    severity: error
    rationale: >
      an efficiency above one would give more work than the isentropic drop contains.
      Inherited from NeqSim's `Compressor` setter, which clamps to this range
      (`Compressor.java:2118`); this refuses instead.
  - quantity: outlet_pressure
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states
  - quantity: P
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: an absolute pressure; zero and below are not states
  - quantity: n
    min: 0.0
    min_inclusive: false
    severity: error
    rationale: a flow of zero moles has no power to compute

assumptions:
  - '**the outlet stays single phase or splits as the flash says.** A real expander crossing
    into the two-phase region can have condensation and droplet impact; the thermodynamic
    answer is still the flash''s, and nothing here models the mechanical consequence.'
  - '**one stage at one efficiency.** The five-step polytropic path NeqSim offers
    (`Expander.java:620-633`) is a different model of the same machine, not a more
    accurate one, and it is not ported.'
  - '**no specified-shaft-power mode.** NeqSim can be given a power and solve for the
    outlet pressure (`:652`); that is a different specification with a different unknown,
    and the schema''s per-quantity range checks could not express the solve it needs.'
  - '**the cubic is Peng-Robinson**, as throughout this workspace. An expansion into the
    two-phase region is where a cubic is weakest, and that is a property of the equation
    of state rather than of this model.'

implementations:
  python: azoth.process.expander
  rust: azoth_process::expander
