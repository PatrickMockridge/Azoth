id = "process.bleve"
name = "BLEVE fireball radiation"
kind = "procedure"
assumptions = [
    "**the fireball is the CCPS/TNO correlations**: `D = 5.8 M^(1/3)` m and `t = 0.45 M^(1/3)` s over the vaporising fuel mass `M`.",
    "**the surface emissive power is `eta M dHc / (pi D^2 t)`**, the radiated fraction of the combustion energy over the fireball's area and lifetime.",
    "**the view factor is the point source's, `D^2 / (4 d^2)` capped at one**, and the transmissivity is the jet fire's Wayne correlation; the helper is shared, not copied.",
    "**the inverse is 60 halvings between `D/2 + 0.1` and 5000 m, with no early break.**",
    "**a target above the near-field flux is absent.** The class returns its near bound, `D/2 + 0.1`; the port publishes no `distance_to_flux`. A non-positive target is refused: the class answers 2217.8 m for zero.",
    "**the class's constructor validates the fuel mass and the heating value but not the radiative fraction**; a negative fraction answers a negative SEP and flux. The port refuses a fraction outside `[0, 1]`, as the jet fire does.",
    "**relative humidity is the jet fire's setter, clamped to `[0, 1]` there.** The port refuses a stated value outside `(0, 1]`: the clamp's zero makes the shared correlation `NaN`. Absent is `0.5`.",
    "**a non-positive distance is refused**: the class answers an infinite flux at zero. **Heat of combustion is in J/kg and crosses unconverted**, declared dimensionless for want of a vocabulary unit.",
]
references = [
    "CCPS (2010). Guidelines for Vapor Cloud Explosion, Pressure Vessel Burst, BLEVE and Flash Fire Hazards, 2nd Ed.",
    "TNO (2005). Yellow Book, 3rd Ed., CPR 14E, section 6, BLEVE and fireball.",
    "API STD 521 (2021). Pressure-relieving and Depressurating Systems, section 4.6.4, fireballs and BLEVEs.",
    "Wayne, F. D. (1991). \"An Economical Formula for Calculating Atmospheric Infrared Transmissivities.\" Journal of Loss Prevention in the Process Industries 4, 86-89.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `process/safety/fire/BLEVECalculator.java` is the port source.",
    "`validation/neqsim/captures/process_bleve.tsv` - the class's own test state, the 12.5 kW/m2 and small-target contours, the zero-humidity NaN, the negative fraction and the zero-distance and zero-target guards.",
]
[source]
standard = "NeqSim process/safety/fire/BLEVECalculator.java"
edition = "Its `fireballDiameterM`, `fireballDurationS`, `surfaceEmissivePowerWPerM2`, `transmissivity`, `incidentHeatFlux` and `distanceToFlux`."
[algorithm]
scheme = "ccps_fireball_point_source"
initialisation = "fireball_radius_bound"
convergence = "absolute"
tolerance = 1.0e-12
max_iterations = 60
[inputs]
[inputs.fuel_mass]
unit = "kg"
description = "the mass of vaporising fuel, above zero.\n"
[inputs.heat_of_combustion]
unit = "dimensionless"
description = "the lower heating value in J/kg, above zero. Declared dimensionless because no vocabulary unit expresses a mass-specific energy.\n"
[inputs.radiative_fraction]
unit = "dimensionless"
description = "the fraction of the combustion energy radiated, in `[0, 1]`; 0.25 to 0.40 is the class's range. **The class's constructor does not validate it; the port does.**\n"
[inputs.relative_humidity]
unit = "dimensionless"
optional = true
description = "the ambient relative humidity in `(0, 1]`, which the shared transmissivity reads. **Absent is `0.5`.** A stated zero is refused: the class answers `NaN`.\n"
[inputs.distance]
unit = "m"
optional = true
description = "the distance from the fireball centre at which the flux is asked, above zero. **Absent leaves `transmissivity` and `incident_heat_flux` absent.**\n"
[inputs.target_flux]
unit = "W/m**2"
optional = true
description = "the flux whose distance is solved for, above zero. **Absent leaves `distance_to_flux` absent.**\n"
[outputs]
[outputs.fireball_diameter]
unit = "m"
description = "`5.8 M^(1/3)`, the fireball's diameter.\n"
[outputs.fireball_duration]
unit = "s"
description = "`0.45 M^(1/3)`, the fireball's lifetime.\n"
[outputs.surface_emissive_power]
unit = "W/m**2"
description = "`eta M dHc / (pi D^2 t)`, the surface emissive power.\n"
[outputs.transmissivity]
unit = "dimensionless"
optional = true
description = "Wayne's `tau` at `distance`. Present only with `distance`.\n"
[outputs.incident_heat_flux]
unit = "W/m**2"
optional = true
description = "`SEP` times the capped point-source view factor and `tau`. Present only with `distance`.\n"
[outputs.distance_to_flux]
unit = "m"
optional = true
description = "the distance at which the flux falls to the target. **Absent when the flux at `D/2 + 0.1` is already below the target**, where the class answers that near bound.\n"
[[valid_range]]
quantity = "fuel_mass"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class's constructor refuses a non-positive mass"
[[valid_range]]
quantity = "heat_of_combustion"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class's constructor refuses a non-positive heating value"
[[valid_range]]
quantity = "radiative_fraction"
min = 0
min_inclusive = true
max = 1
max_inclusive = true
severity = "error"
rationale = "the class does not validate it, and a negative fraction answers a negative SEP and flux"
[[valid_range]]
quantity = "relative_humidity"
min = 0
min_inclusive = false
max = 1
max_inclusive = true
severity = "error"
rationale = "the class clamps to [0, 1] and answers NaN at zero, so the port refuses both"
[[valid_range]]
quantity = "distance"
min = 0
min_inclusive = false
severity = "error"
rationale = "the class answers an infinite flux at zero distance"
[[valid_range]]
quantity = "target_flux"
min = 0
min_inclusive = false
severity = "error"
rationale = "a non-positive target is not a contour; the class answers the far end of its numerical search for zero"
[implementations]
python = "azoth.process.bleve"
rust = "azoth_process::bleve"
