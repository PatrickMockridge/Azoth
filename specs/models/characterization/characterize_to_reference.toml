id = "characterization.characterize_to_reference"
name = "A fluid's pseudo-components re-cut onto another fluid's slate"
kind = "direct"
assumptions = [
    "**this is how two fluids are made comparable.** A report and a model fluid rarely share a cut slate, and a cubic cannot mix two fluids cut at different boiling points. `characterizeToReference` re-cuts one onto the other's boundaries, leaving the two differing only in mole fraction.",
    "**the reference decides where the cuts are and nothing else.** Its densities, its mole amounts and its own properties are not read by this path - only its sorting keys, and only adjacent pairs of them.",
    "**the sorting key is the normal boiling point, and the molar mass without one.** **The absence is a field the row leaves out**, and a row that states one which is not finite and positive falls back the same way.",
    "**the boundaries are the midpoints of adjacent reference keys**, `0.5*(k_i + k_i+1)`, or the larger of the two when either is not finite. They belong to the reference alone: the source's own keys decide only which group each of its rows joins.",
    "**a row joins a group by a strict comparison.** The walk advances while the row's key is **greater than** the boundary, so a key exactly on a boundary stays in the lower group. Both tables are sorted by key first, so the groups are contiguous runs of the source in ascending boiling point.",
    "**an empty group is dropped rather than reported empty.** A group whose accumulated mass or moles is at or below `1e-12` produces no profile, so a source entirely below the reference's first cut resolves to one component against a reference of many.",
    "**the outputs are therefore shorter than the reference**, and `reference_index` is what re-aligns them with it.",
    "**a group's molar mass is its accumulated mass over its accumulated moles**, and its density the mass over the volume its rows occupy: `sum(m) / sum(m/rho)`, the mass-weighted harmonic mean of the gravities and not their mass-weighted mean.",
    "**the density falls back to `sum(m*rho)/sum(m)`** when no row in the group carries a positive density, which is a mass-weighted arithmetic mean instead. A row that states no density, or one at zero, contributes to neither sum.",
    "**`inheritReferenceProperties` is a variant of this walk and not a second one.** With it set, each group keeps its own moles and takes the *reference row's* molar mass and density - Pedersen's common-EoS slate. The boundaries and the binning are the same either way.",
    "**what else is owed, named.** `combineReservoirFluids` and `characterizeToCommonSlate`, which weight several fluids into one imaginary pool before cutting; and `delumpContributions` and `determineReferenceEqualMassBoundaries`, which rebuild a fine composition and cut it equally by mass.",
    "**and three more**: `transferBinaryInteractionParameters`, which moves a two-dimensional interaction table between slates; `normalizeComposition`; and `generateValidationReport`.",
    "**all of those rebuild a fluid and not a table.** Every public method of the class takes or returns a `SystemInterface`, and the cards a pseudo-component needs to enter a `Mixture` are not the whole of it - the fluid has to be one a component can be added to.",
    "**and the rows are twenty fields wide where this id reads four.** The rest join the row when a ported method reads one, which is the rule the row was built under.",
    "the result is a bookkeeping choice and not a measurement: the same source re-cut onto two different references gives two fluids with the same mass and different components.",
]
references = [
    "Pedersen, K. S.; Christensen, P. L. (2007). \"Phase Behavior of Petroleum Reservoir Fluids.\", CRC Press. Chapter 5.6, the common equation of state and the cut grid.",
    "NeqSim - https://github.com/equinor/neqsim - Apache-2.0. `thermo/characterization/PseudoComponentCombiner.java`'s `extractComponents`, `determineReferenceBoundaries` and `distributeToProfiles` are the port source.",
    "`validation/neqsim/captures/pseudo_component_combiner_probe.tsv` - three source-and-reference pairs from `validation/neqsim/PseudoComponentCombinerProbe.java`.",
]
[source]
standard = "NeqSim master `PseudoComponentCombiner.characterizeToReference`"
edition = "Its `characterizeToReferenceCore` through `determineReferenceBoundaries` and `distributeToProfiles`, for the default options: no delumping, the boiling-point boundaries, and each group's own properties rather than the reference's."
[inputs]
[inputs.source]
type = "record_list"
row_type = "SourceRow"
description = "The source fluid's pseudo-components, one record each. **Only rows with a positive mole amount are read**: `extractComponents` skips the rest, so a zero amount is a row that is not on the grid.\n"
[inputs.source.fields.moles]
unit = "mol"
description = "The row's mole amount.\n"
[inputs.source.fields.molar_mass]
unit = "kg/mol"
description = "The row's molar mass, which is its sorting key when it states no boiling point.\n"
[inputs.source.fields.density]
unit = "kg/m**3"
optional = true
description = "The row's normal liquid density, which the group's volume is the mass over. A row that leaves it out contributes to neither the volume nor the density-mass sum.\n"
[inputs.source.fields.boiling_point]
unit = "K"
optional = true
description = "The row's normal boiling point, its sorting key where it states one. A row that leaves it out is sorted by its molar mass.\n"
[inputs.reference]
type = "record_list"
row_type = "ReferenceRow"
description = "The reference fluid's cut slate, one record each. The reference's densities and mole amounts are not read: it decides where the cuts are and nothing else.\n"
[inputs.reference.fields.molar_mass]
unit = "kg/mol"
description = "The row's molar mass, the fallback sorting key.\n"
[inputs.reference.fields.boiling_point]
unit = "K"
optional = true
description = "The row's normal boiling point, and with it the boundaries the source is cut at. A row that leaves it out is sorted by its molar mass.\n"
[inputs.reference.fields.density]
unit = "kg/m**3"
optional = true
description = "The row's normal liquid density, read only where `inherit_reference_properties` is set - a group takes it as its own density. Where the flag is absent the reference's densities are not read at all.\n"
[inputs.inherit_reference_properties]
type = "boolean"
optional = true
description = "whether each group takes the **reference row's own** molar mass and density instead of the ones its own rows average to. Absent, or false, is the class's own default entry point and the answer this id has always given.\n"
[outputs]
[outputs.reference_index]
type = "vector"
unit = "dimensionless"
length = "one per non-empty group, ascending"
description = "Which reference cut each group belongs to. **The groups are not the reference rows**: an empty group is dropped, so this is how a caller re-aligns the answer with its own slate.\n"
[outputs.group_moles]
type = "vector"
unit = "mol"
length = "one per non-empty group, aligned with `reference_index`"
description = "Each group's summed mole amount, which over all groups is the source's own total.\n"
[outputs.group_molar_mass]
type = "vector"
unit = "kg/mol"
length = "one per non-empty group, aligned with `reference_index`"
description = "Each group's molar mass, its accumulated mass over its accumulated moles.\n"
[outputs.group_density]
type = "vector"
unit = "kg/m**3"
length = "one per non-empty group, aligned with `reference_index`"
description = "Each group's density, the mass over the volume its rows occupy.\n"
[implementations]
python = "azoth.characterization.characterize_to_reference"
rust = "azoth_characterization::characterize_to_reference"
