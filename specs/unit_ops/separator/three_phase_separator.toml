id = "unit_ops.three_phase_separator"
name = "Three-phase separator"
[source]
standard = "NeqSim process/equipment/separator/ThreePhaseSeparator.java"
[parameters.pressure_drop]
required = true
unit = "Pa"
description = "the pressure drop across the vessel; the outlets flash at the feed's pressure less this, and because `run` holds the temperature the outlets do not carry the inlet's enthalpy"
[parameters.heat_input]
unit = "W"
description = "heat added to the feed before the flash; when given the outlets are at the temperature the shifted enthalpy implies rather than at the feed's, and the flash is the multiphase one `run` enables"
[parameters.gas_in_aqueous]
required = true
unit = "dimensionless"
description = "the fraction of the vapour's moles carried into the aqueous phase, on NeqSim's `feed`/`mole` basis for `setEntrainment`"
[parameters.gas_in_oil]
required = true
unit = "dimensionless"
description = "the fraction of the vapour's moles carried into the oil"
[parameters.oil_in_aqueous]
required = true
unit = "dimensionless"
description = "the fraction of the oil's moles carried into the aqueous phase"
[parameters.oil_in_gas]
required = true
unit = "dimensionless"
description = "the fraction of the oil's moles carried into the vapour; with `aqueous_in_gas` it is also what re-runs the vapour outlet as a stream"
[parameters.aqueous_in_gas]
required = true
unit = "dimensionless"
description = "the fraction of the aqueous phase's moles carried into the vapour"
[parameters.aqueous_in_oil]
required = true
unit = "dimensionless"
description = "the fraction of the aqueous phase's moles carried into the oil"
[[ports]]
name = "feed"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "vapour"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "light_liquid"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "heavy_liquid"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
