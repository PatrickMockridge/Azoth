id = "unit_ops.packed_column"
name = "Packed column"
notes = "**The packing parameters do not change the separation.** `PackedColumn extends DistillationColumn` and its `run` is `super.run(id)` followed by `calcPackingHydraulics()`, which goes through `ColumnInternalsDesigner` into `PackingHydraulicsCalculator`. So the VLE solve is the base's, and `packing_type`, `structured_packing`, `design_flood_fraction`, `packing_hydraulic_capacity_factor` and `column_diameter` are read only by the hydraulics report on the far side of the solve. **What the running parameters change is the stage count, and they change it at construction**: two of the three constructors call `estimateStages(packed_height, 0.5)`, which is `ceil(packed_height / 0.5)` floored at two stages from a hard-coded 0.5 m HETP guess, and the third fixes ten stages with no ends for contactor use. `getHETP()` and `getTheoreticalStages()` (`packed_height / hetp`) are **outputs** of the hydraulics, computed after the column has already converged on the guessed stage count. A port therefore takes `unit_ops.distillation_column`'s whole declaration, and this entry declares the packing on top of it, with what reads each parameter rather than as arithmetic the separation honours. **The solvent inlet is a feed at the top tray** - `addSolventStream` is `addFeedStream(stream, getTrays().size() - 1)` - which the base's per-feed stage already expresses. **Nothing calls it**: measured at the pin `f0c7436c69`, `PackedColumn` is constructed at no place under `src/main`; the only other mention is an `instanceof` in `DistillationColumnMechanicalDesign`. Packing hydraulics, flood and sizing are mechanical design and are not ported; `ColumnInternalsDesigner`, `PackingHydraulicsCalculator` and `PackingSpecificationLibrary` are the classes that would close them. **Ported as `process.packed_column`, and the identity is measured**: on `validation/neqsim/captures/process_packed_column.tsv` NeqSim's `PackedColumn` at a 2.0 m bed and its `DistillationColumn` at four stages report bit-identical answers on all twenty-two captured quantities - the profile, both products and both duties. The port's own case states that base column's numbers, and its test asserts the pair against each other. **The rule is measured too, and the floor is reached rather than refused**: the capture's eleven stage-count rows give two middle trays for 0.2 m, for 0.0 m and for -1.0 m alike. Two further rows are evidence rather than oracles: the class's own test case reports `RIGOROUS_CONVERGED` with residuals of exactly zero on a state where the trays below the feed carry no traffic at all, and its contactor row reports `FALLBACK_PRODUCTS`, which the class's own warning says means the products are one flash of the mixed feeds rather than the tray solution."
[source]
standard = "NeqSim process/equipment/distillation/PackedColumn.java"
[parameters.packed_height]
unit = "m"
description = "the packed bed height, which the constructor divides by a 0.5 m HETP guess to fix the base column's stage count and which the hydraulics later divides by the calculated HETP to report theoretical stages; the class defaults it to 5.0"
[parameters.packing_type]
description = "the packing's name, which `PackingSpecificationLibrary` resolves and the hydraulics reads; the class defaults it to Pall-Ring-50"
[parameters.structured_packing]
description = "whether the packing is structured or random, which selects the hydraulic correlation"
[parameters.design_flood_fraction]
unit = "dimensionless"
description = "the fraction of flood the packing is sized to, which the hydraulics reads and the solve does not; the class defaults it to 0.70"
[parameters.packing_hydraulic_capacity_factor]
unit = "dimensionless"
description = "the selected packing's relative hydraulic capacity factor, which the hydraulics reads; the class defaults it to 1.0"
[parameters.column_diameter]
unit = "m"
description = "the column's internal diameter; a value at or below zero auto-sizes it from the hydraulics, and the class defaults it to -1.0"
[[ports]]
name = "feed"
direction = "in"
multiplicity = "many"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "distillate"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "bottoms"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
