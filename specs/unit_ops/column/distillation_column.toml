id = "unit_ops.distillation_column"
name = "Distillation column"
[parameters.reactive]
description = "whether the middle trays flash reactively, which `setReactive(true)` sets: the two ends never do, and a tray that does routes its flash to `ThermodynamicOperations.reactiveTPflash` or `reactivePHflash` rather than to the equilibrium one"
[parameters.reactive_start_tray]
description = "the first reactive middle tray, 0-based among the middle trays, with `reactive_end_tray` its inclusive last - `setReactive(true, start, end)`. Both bounds are stated or neither"
[parameters.reactive_end_tray]
description = "the last reactive middle tray"
[parameters.gas_side_draw_fractions]
description = "one fraction per tray of the vapour withdrawn from that tray's own outlet, as `setGasSideDrawFraction` states it; a zero where a tray draws nothing"
[parameters.liquid_side_draw_fractions]
description = "the same for the liquid, which a pumparound draws from too - the two are bounded together and may not sum above one"
[parameters.pumparound_fractions]
description = "the same for a pumparound; its **return** to another tray is a recycle the class iterates and this port does not carry"
[parameters.side_draw_flow_tray]
description = "the tray whose draw flow is specified, which `addSideDrawFlowSpecification` takes; omitted means every draw stays a fraction of its stage's own phase"
[parameters.side_draw_flow_phase]
description = "which of the stage's two phases the specification controls - gas or liquid - `SideDrawPhase`"
[parameters.side_draw_flow_target]
description = "the **mass** flow the draw must deliver; the column moves the draw's fraction until it does"
[parameters.side_draw_flow_tolerance]
description = "the relative residual the search stops at; the class defaults it to 1e-4"
[parameters.side_draw_flow_max_iterations]
description = "the candidate cap; the class defaults it to 12, and the tear's own cap is the largest of it and `maxColumnTearIterations`"

[parameters.pumparound_return_tray]
description = "the tray a pumparound's liquid comes back to; stated with the draw tray, the fraction and the drop or not at all"
[parameters.pumparound_draw_tray]
description = "the tray a pumparound's liquid leaves, which must be a middle tray - the ends here are `column::reboiler` and `column::condenser` rather than stages"
[parameters.pumparound_draw_fraction]
description = "the fraction of the draw tray's liquid withdrawn, the same vector `pumparound_fractions` writes"
[parameters.pumparound_temperature_drop]
description = "the drop from the draw to the return; the cooler's duty is the enthalpy between the two streams"
[parameters.pumparound_tolerance]
description = "the relative return-flow change the outer loop stops at; the class defaults it to 1e-4"
[parameters.pumparound_max_iterations]
description = "the outer loop's cap; the class defaults it to 12"

[source]
standard = "NeqSim process/equipment/distillation/DistillationColumn.java"
[parameters.number_of_stages]
required = true
unit = "dimensionless"
description = "the theoretical trays between the ends, which is the constructor's `numberOfTraysLocal`; a reboiler or a condenser adds one stage each on top of it"
[parameters.feed_stage]
required = true
unit = "dimensionless"
description = "the stage each feed enters, one entry per feed beside `feed_n`/`feed_z`/`feed_p`/`feed_t`, 0-based over the trays including the ends, so stage 0 is the reboiler when there is one; `addFeedStream` refuses an index outside the tray count"
[parameters.murphree_efficiency]
unit = "dimensionless"
description = "the Murphree tray efficiency applied to every equilibrium stage, where 1 is the ideal stage; the class defaults it to 1.0"
[parameters.has_reboiler]
required = true
description = "whether the column has a reboiler at stage 0, which is the constructor's `hasReboiler`"
[parameters.has_condenser]
required = true
description = "whether the column has a condenser at the top stage, which is the constructor's `hasCondenser`"
[parameters.top_pressure]
required = true
unit = "Pa"
description = "the pressure at the top stage; `setTopPressure` takes bara, and the solver refuses a column that has neither this nor a feed to initialize from"
[parameters.bottom_pressure]
required = true
unit = "Pa"
description = "the pressure at the bottom stage; `setBottomPressure` takes bara, and the two fix the profile the stage pressures interpolate"
[parameters.reboiler_temperature]
unit = "K"
description = "the reboiler's temperature, which with the bottom specification is what pins the bottom of the column; the class defaults it to 273.15 K"
[parameters.condenser_temperature]
unit = "K"
description = "the condenser's temperature, which with the top specification is what pins the top of the column; the class defaults it to 270.15 K"
[parameters.top_specification_type]
description = "which of `ColumnSpecification`'s five types constrains the top product - product_purity, reflux_ratio, component_recovery, product_flow_rate or duty - and product_purity and component_recovery also need `top_specification_component`"
[parameters.top_specification_target]
description = "the target value, in the unit its type implies: dimensionless for a purity, a recovery or a reflux ratio, mol/hr for a product flow, W for a duty"
[parameters.top_specification_component]
description = "the component a purity or a recovery constrains; unread by the other three types"
[parameters.bottom_specification_type]
description = "which of `ColumnSpecification`'s five types constrains the bottom product, which is the same five as the top specification's and its own degree of freedom"
[parameters.bottom_specification_target]
description = "the target value, in the unit its type implies, as the top specification's is"
[parameters.bottom_specification_component]
description = "the component a purity or a recovery constrains; unread by the other three types"
[parameters.solver_type]
description = "which of the class's ten solving strategies runs - direct_substitution, damped_substitution, inside_out, matrix_inside_out, wegstein, sum_rates, newton, naphtali_sandholm, mesh_residual or auto - where auto is a ladder and not one method"
[parameters.column_diameter]
unit = "m"
description = "the column's internal diameter, which the Fs capacity limit divides the gas outlet's volumetric flow by; the class defaults it to 1.0 m and the solve is indifferent to it"
[parameters.max_allowable_fs_factor]
unit = "dimensionless"
description = "the `Fs` limit `isFsFactorWithinDesignLimit` reads and the solve does not; the class defaults it to 2.5"
[parameters.internals_type]
description = "which tray the internals tree is designed as - sieve, valve or bubble-cap; the class defaults it to sieve"
[parameters.tray_spacing]
unit = "m"
description = "the tray spacing the internals are designed at; the class defaults it to 0.6 m"
[parameters.weir_height]
unit = "m"
description = "the weir height the internals are designed at; the class defaults it to 0.05 m"
[parameters.hole_diameter]
unit = "mm"
description = "the sieve hole diameter, in millimetres; the class defaults it to 12.7 mm"
[parameters.hole_area_fraction]
unit = "dimensionless"
description = "the hole area over the active area; the class defaults it to 0.1"
[parameters.downcommer_area_fraction]
unit = "dimensionless"
description = "the downcomer area over the total; the class defaults it to 0.1"
[parameters.design_flood_fraction]
unit = "dimensionless"
description = "the fraction of flood the internals are sized to; the designer defaults it to 0.8, unlike the packed column's 0.70"
[parameters.column_diameter_override]
unit = "m"
description = "a stated internal diameter for the internals tree, which replaces its sizing branch entirely; the class's own -1.0 sizes it off the controlling tray"
[[ports]]
