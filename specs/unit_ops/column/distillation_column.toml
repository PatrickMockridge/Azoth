id = "unit_ops.distillation_column"
name = "Distillation column"
notes = "**Unparked, and its closure is a package rather than a class.** Measured at the pin `f0c7436c69`, `process/equipment/distillation/` is 46 files and 40,058 lines against the 15,633 of the class this entry names, of which `NaphtaliSandholmSolver` is 5,153, `RateBasedPackedColumn` 4,081, `ColumnSolverFactory` 1,085, `DistillationColumnMatrixSolver` 942 and `SimpleTray` 866. **`DistillationColumn` is constructed at seven places under `src/main`** - `EquipmentFactory:463`, `JsonProcessBuilder:1245`, `DexpiEquipmentFactory:351`, `DPCUModule:145`, `FlowsheetSynthesisEngine:365`, `SarirAtmosphericFractionationCase:133`, `DoeBigHillVacuumFractionationCase:79` - and every other class the rigorous family needs is constructed at none of them. `ColumnSolverFactory` selects `AUTO` as a **ladder** - `NAPHTALI_SANDHOLM`, then `MATRIX_INSIDE_OUT`, `INSIDE_OUT`, `DAMPED_SUBSTITUTION` - so the default is not one method. **`reflux_ratio` is withdrawn**: `setCondenserRefluxRatio` builds a `REFLUX_RATIO` top specification and sets it on the condenser, so a standalone parameter would be a second spelling of one degree of freedom. **The pressures are bara on the class's two setters** and are declared here in Pa. **A specification's target unit follows its type** - dimensionless for a purity, a recovery or a reflux ratio, mol/s for a product flow, W for a duty, which is `ColumnSpecification.defaultTargetUnit`'s own convention - so that parameter carries no unit. **Side draws, pumparounds, the per-stage efficiency vector, tray hydraulics and mechanical design are not ported**, and `SimpleTray.setLiquidSideDrawFraction`, `DistillationColumn.setMurphreeEfficiency(int, double)`, `TrayHydraulicsCalculator` and `DistillationColumnMechanicalDesign` are the classes that would close them. **Reactive trays are ported** (2026-09-25), and what follows is what the class does and what this port measured. The mechanism is `DistillationColumn.setReactive` setting `SimpleTray.useReactiveFlash` on the **middle** trays only - the two ends never, and the flag rather than a `ReactiveTray` instance, which `setReactive`'s own javadoc gets wrong: measured at the pin, the column constructs no `ReactiveTray` at all, and the two tests that do are the class's own. The tray's flash then routes to `ThermodynamicOperations.reactiveTPflash()` or `reactivePHflash(enthalpy, 0)`, with a reactive-PH to reactive-TP to plain-TP fallback. **The fluid was the blocker and it is closed**: azoth's reactive flashes fixed `CUBIC = Cubic::Srk` where this port's column is PR-only through `Stream::mixture()`, so the two ids now take a `cubic` and the tray flashes the fluid it carries. **Where a reactive answer has two phases of the same composition the stage refuses** - measured, the water-gas-shift states' phases converge to one composition on both cubics - and a single-phase answer is typed by this library's own flash rather than by the delegation's indices. **The NR=0 route is a separate matter and is NeqSim's own delegation**: where the fluid has no independent reaction (`FormulaMatrix::independent_reactions() == 0`) the reactive route *is* the plain flash, which the flash probe measures as a zero-iteration return and which `ReactiveDistillationTest` asserts as a reactive column matching a standard one to `0.01` kg/hr. **And the two-phase answer is not a gap in this port**: the reactive flash returns two phases of identical composition on its own oracle states, which the P10 probe records and this port reproduces."
[parameters.reactive]
description = "whether the middle trays flash reactively, which `setReactive(true)` sets: the two ends never do, and a tray that does routes its flash to `ThermodynamicOperations.reactiveTPflash` or `reactivePHflash` rather than to the equilibrium one"
[parameters.reactive_start_tray]
description = "the first reactive middle tray, 0-based among the middle trays, with `reactive_end_tray` its inclusive last - `setReactive(true, start, end)`. Both bounds are stated or neither"
[parameters.reactive_end_tray]
description = "the last reactive middle tray"
[parameters.gas_side_draw_fractions]
description = "one fraction per tray of the vapour withdrawn from that tray's own outlet, as `setGasSideDrawFraction` states it; a zero where a tray draws nothing"
[parameters.liquid_side_draw_fractions]
description = "the same for the liquid, which a pumparound draws from too - the two are bounded together and may not sum above one"
[parameters.pumparound_fractions]
description = "the same for a pumparound; its **return** to another tray is a recycle the class iterates and this port does not carry"
[source]
standard = "NeqSim process/equipment/distillation/DistillationColumn.java"
[parameters.number_of_stages]
unit = "dimensionless"
description = "the theoretical trays between the ends, which is the constructor's `numberOfTraysLocal`; a reboiler or a condenser adds one stage each on top of it"
[parameters.feed_stage]
unit = "dimensionless"
description = "the stage each feed enters, one entry per feed beside `feed_n`/`feed_z`/`feed_p`/`feed_t`, 0-based over the trays including the ends, so stage 0 is the reboiler when there is one and the last stage is the condenser; `addFeedStream` refuses an index outside `[0, number_of_stages + has_reboiler + has_condenser)`"
[parameters.murphree_efficiency]
unit = "dimensionless"
description = "the Murphree tray efficiency applied to every equilibrium stage, where 1 is the ideal stage; the class defaults it to 1.0"
[parameters.has_reboiler]
description = "whether the column has a reboiler at stage 0, which is the constructor's `hasReboiler`"
[parameters.has_condenser]
description = "whether the column has a condenser at the top stage, which is the constructor's `hasCondenser`"
[parameters.top_pressure]
unit = "Pa"
description = "the pressure at the top stage; `setTopPressure` takes bara, and the solver refuses a column that has neither this nor a feed to initialize from"
[parameters.bottom_pressure]
unit = "Pa"
description = "the pressure at the bottom stage; `setBottomPressure` takes bara, and the two fix the profile the stage pressures interpolate"
[parameters.reboiler_temperature]
unit = "K"
description = "the reboiler's temperature, which with the bottom specification is what pins the bottom of the column; the class defaults it to 273.15 K"
[parameters.condenser_temperature]
unit = "K"
description = "the condenser's temperature, which with the top specification is what pins the top of the column; the class defaults it to 270.15 K"
[parameters.top_specification_type]
description = "which of `ColumnSpecification`'s five types constrains the top product - product_purity, reflux_ratio, component_recovery, product_flow_rate or duty - and product_purity and component_recovery also need `top_specification_component`"
[parameters.top_specification_target]
description = "the target value, in the unit its type implies: dimensionless for a purity, a recovery or a reflux ratio, mol/s for a product flow, W for a duty"
[parameters.top_specification_component]
description = "the component a purity or a recovery constrains; unread by the other three types"
[parameters.bottom_specification_type]
description = "which of `ColumnSpecification`'s five types constrains the bottom product, which is the same five as the top specification's and its own degree of freedom"
[parameters.bottom_specification_target]
description = "the target value, in the unit its type implies, as the top specification's is"
[parameters.bottom_specification_component]
description = "the component a purity or a recovery constrains; unread by the other three types"
[parameters.solver_type]
description = "which of the class's ten solving strategies runs - direct_substitution, damped_substitution, inside_out, matrix_inside_out, wegstein, sum_rates, newton, naphtali_sandholm, mesh_residual or auto - where auto is a ladder and not one method"
