id = "unit_ops.absorption_column"
name = "Absorption column"
[source]
standard = "NeqSim process/equipment/absorber/AbsorptionColumn.java"
[parameters.reactive]
description = "whether the middle trays flash reactively, which `setReactive(true)` sets: a tray that does routes its flash to `ThermodynamicOperations.reactiveTPflash` or `reactivePHflash`. **An absorber has no ends**, so `setReactive(true)` flags every stage - the capture prints `11111`"
[parameters.reactive_start_tray]
description = "the first reactive middle tray, 0-based among the middle trays, with `reactive_end_tray` its inclusive last - `setReactive(true, start, end)`. Both bounds are stated or neither"
[parameters.reactive_end_tray]
description = "the last reactive middle tray"
[parameters.number_of_stages]
required = true
unit = "dimensionless"
description = "the actual trays, which the constructor requires to be positive; a tray is numbered 0 at the bottom, where the gas enters, to `number_of_stages - 1`, where the solvent enters"
[parameters.top_pressure]
required = true
unit = "Pa"
description = "the pressure at the top stage, inherited from `DistillationColumn.setTopPressure`, which takes bara"
[parameters.bottom_pressure]
required = true
unit = "Pa"
description = "the pressure at the bottom stage, inherited from `DistillationColumn.setBottomPressure`, which takes bara"
[parameters.murphree_efficiency]
unit = "dimensionless"
description = "the column-wide Murphree tray efficiency, where 1 is the ideal stage"
[parameters.component_murphree_efficiency]
unit = "dimensionless"
description = "the Murphree efficiency of one named component, one entry per component, which overrides the column-wide value for that component alone"
[parameters.max_allowable_gas_load_factor]
unit = "dimensionless"
description = "the `Fs`-factor the gas load is checked against, which `isGasLoadFactorWithinDesignLimit` reads and the solve does not; the class defaults it to 0.15"
[parameters.solver_type]
description = "which of the base's ten solving strategies runs, by the same names `unit_ops.distillation_column` declares"
[[ports]]
name = "gas_in"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "solvent_in"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "gas_out"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "liquid_out"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
