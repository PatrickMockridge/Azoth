id = "unit_ops.manifold"
name = "Manifold"
[source]
standard = "NeqSim process/equipment/manifold/Manifold.java"
[parameters.split_factors]
required = true
unit = "dimensionless"
description = "the fraction of the mixture to each outlet, one entry per outlet, summing to 1"
[[ports]]
name = "feed"
direction = "in"
multiplicity = "many"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "outlet"
direction = "out"
multiplicity = "many"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
