id = "unit_ops.throttling_valve"
name = "Throttling valve"
notes = "**`valve_opening` is withdrawn, and the sizing mode with it.** `ThrottlingValve` has two: `outlet_pressure` gives the drop and `run` flashes isenthalpically to it, while `isCalcPressure` instead *solves* the drop from the trim, calling `adjustKv(Kv, percentValveOpening)` and `calculateOutletPressure`, with `Kv` from `MechanicalDesign.calcValveSize()` and a `ValveSizingMethod` (IEC 60534). That tree is `process/mechanicaldesign/valve/`, which P11 does not port, so a form offering `valve_opening` would offer a number nothing reads - which is the defect this entry already had. Adding it back means adding the parameter and the sizing kernel together."
[source]
standard = "NeqSim process/equipment/valve/ThrottlingValve.java"
[parameters.outlet_pressure]
required = true
unit = "Pa"
description = "the pressure the valve drops the stream to"
[[ports]]
name = "inlet"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "outlet"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
