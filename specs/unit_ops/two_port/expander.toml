id = "unit_ops.expander"
name = "Expander"
[source]
standard = "NeqSim process/equipment/expander/Expander.java"
[parameters.outlet_pressure]
required = true
unit = "Pa"
description = "the pressure the expander lets the stream down to"
[parameters.isentropic_efficiency]
required = true
unit = "dimensionless"
description = "the expander's isentropic efficiency, between 0 and 1"
[parameters.rated_recovered_power]
unit = "W"
description = "`setRatedRecoveredPower`, the recovered-power rating; a positive value initializes the `recoveredPower` constraint, and a non-positive one creates none"
[[ports]]
name = "inlet"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "outlet"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
