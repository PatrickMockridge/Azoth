id = "unit_ops.stirred_tank_reactor"
name = "Stirred-tank reactor"
[source]
standard = "NeqSim process/equipment/reactor/StirredTankReactor.java"
[parameters.reaction]
required = true
description = "the reaction's id in the reaction data, which is what `addReaction` names"
[parameters.limiting_reactant]
required = true
description = "the component whose moles times the conversion set the extent of the reaction"
[parameters.conversion]
required = true
unit = "dimensionless"
description = "the fractional conversion of the limiting reactant, in [0, 1]"
[parameters.isothermal]
required = true
description = "whether the vessel holds its temperature, the class's own flag"
[parameters.reactor_temperature]
unit = "K"
description = "the temperature an isothermal vessel holds; required when isothermal and permitted and unread otherwise"
[parameters.reactor_pressure]
unit = "Pa"
description = "the pressure the vessel holds, which replaces the feed's rather than dropping from it"
[parameters.pressure_drop]
unit = "Pa"
description = "the drop the outlet takes where no reactor pressure is stated"
[parameters.vessel_volume]
unit = "m**3"
description = "the stored vessel volume, echoed by `toMap` and multiplied into `agitator_power`; `run` reads neither"
[parameters.residence_time]
unit = "h"
description = "the stored residence time, echoed by `toMap` and read by nothing in `run`"
[parameters.agitator_power_per_volume]
unit = "W/m**3"
description = "the stored specific agitator power, the other factor of `agitator_power`; the class's 1 kW/m3 is 1000 W/m3"
[[ports]]
name = "feed"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "product"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
