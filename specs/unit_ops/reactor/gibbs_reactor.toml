id = "unit_ops.gibbs_reactor"
name = "Gibbs reactor"
notes = "**Deferred with the measurement that says why, and it is not what the plan expected.** `GibbsReactor.run` does not call `ChemicalEquilibrium` - P10's Gibbs minimiser over the element balances - and it is not a composition of it. The class is **3,163 lines** carrying *its own* solver and *its own* thermodynamic data: a Lagrange-multiplier Newton iteration with an Armijo line search and Tikhonov regularisation, and a species database (`GibbsReactDatabase.csv` plus `DatabaseGibbsFreeEnergyCoeff.csv`, both already vendored under `databank/sources/neqsim/`) whose rows carry the element vector *and* per-species Gibbs, enthalpy and entropy correlations that are not the databank's formation properties. A port composed from `reactions.chemical_equilibrium` and the formation-property table would therefore answer with different numbers than the class it is porting, which is the one thing this port may not do. Its default species set is the feed's own components (`useAllDatabaseSpecies` is false), so the *shape* is tractable; what is not is the data and the solve. **What would close it**: compiling the Gibbs database and porting the solver as a tier of its own, exactly as the distillation column was unparked into one."
[source]
standard = "NeqSim process/equipment/reactor/GibbsReactor.java"
[parameters.temperature]
unit = "K"
description = "the equilibrium temperature"
[[ports]]
name = "feed"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "product"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
