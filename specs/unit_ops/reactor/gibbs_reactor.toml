id = "unit_ops.gibbs_reactor"
name = "Gibbs reactor"
notes = "**Landed, and the deferral note's measurement is what the tier cost.** `GibbsReactor.run` does not call `ChemicalEquilibrium`, and the port is not a composition of it: the class carries a Lagrange-multiplier Newton iteration over the element balances and its own species database, whose formation properties are **not** the databank's - `GIBBSENERGYOFFORMATION` is already `used` from P10 and its values are not these. So the tier is its own database (`data/reactors/`, compiled by `gen_databank.py`), its own solver, and this entry.\n\n**The entry declared `temperature` and the class has no such setter.** The equilibrium temperature is the fluid's own, read as `system.getTemperature()`; the parameter is gone and the six the run path reads are here instead. Three of the class's behaviours are load-bearing and are named rather than tidied: the convergence test is on the **undamped** step while the update takes `damping_composition` of it; `min_iterations` is a floor that bites, and three of the capture's six rows stop on it; and the element names have **seven entries for an eight-column table**, so the element the class calls `Ar` is the file's `Na` column and the element it calls `Z` is the file's `Ar` column - zero on every row, hence never active. The eighth column is a charge and no loop reaches it, so **the solve does not balance charge**.\n\n**The iteration is ill-conditioned and that bounds what a port can claim.** `cond(J)` is `6.12e6` on the ammonia row - the `RT/n` of a species on the class's `1e-6` floor against entries near `1` - and the residual is a cancelling sum, so one iteration agrees to `1e-13` and a hundred separate two runs. The methane/oxygen row closes to a part in a million and ammonia settles five per cent away; `specs/models/process/gibbs_reactor.toml` carries the numbers.\n\n**Not ported**: `SimpleMatrix.pseudoInverse`, the class's fallback for a singular Newton system, which is the one capture row (`steam_methane_hot`, two species against three active balances) this entry therefore refuses by name; the Armijo line search and the Tikhonov regularisation, both `false` by default; and `ReactorMechanicalDesign` and `runTransient`."
[source]
standard = "NeqSim process/equipment/reactor/GibbsReactor.java"
[parameters.energy_mode]
required = true
description = "isothermal, the class's own default, or adiabatic, where the energy balance moves the temperature inside the loop"
[parameters.damping_composition]
required = true
unit = "dimensionless"
description = "the fraction of each Newton step the compositions take, the class's default 0.05; the multipliers take the whole step"
[parameters.max_iterations]
required = true
unit = "dimensionless"
description = "the iteration cap, the class's default 5000; reaching it returns success with `converged` false"
[parameters.convergence_tolerance]
required = true
unit = "dimensionless"
description = "the bound on the undamped step's norm, the class's default 1e-3"
[parameters.min_iterations]
required = true
unit = "dimensionless"
description = "the floor below which the tolerance is not consulted, the class's default 100"

[[ports]]
name = "feed"
direction = "in"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
[[ports]]
name = "product"
direction = "out"
[ports.fields]
n = { dimension = "molar_flow" }
z = { dimension = "dimensionless", shape = "vector" }
P = { dimension = "pressure" }
T = { dimension = "thermodynamic_temperature" }
h = { dimension = "molar_energy" }
