id = "unit_ops.heat_exchanger"
name = "Heat exchanger"
[source]
standard = "NeqSim process/equipment/heatexchanger/HeatExchanger.java"
[parameters.duty]
unit = "W"
description = "the heat transferred from the hot to the cold stream"
[parameters.hot_outlet_temperature]
