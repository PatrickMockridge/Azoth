reader_types = ["PlateHeatExchanger", "ShellAndTubeHeatExchanger", "TubularHeatExchanger", "AirCooledHeatExchanger", "SpiralHeatExchanger", "DoubleJacketedVessel", "HeatExchanger"]
note = "TubularHeatExchanger names one geometry; this unit is a two-stream exchanger of any kind. The reader accepts every exchanger class name as the same unit."

[[unit]]
azoth_id = "unit_ops.manifold"
