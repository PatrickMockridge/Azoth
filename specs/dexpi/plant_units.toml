# The azoth palette -> DEXPI 2.0 Plant mapping.
#
# **Reading and writing are two different questions.** A native Plant writer reviewed by
# NeqSim emits a narrow set - its `Dexpi20XmlWriter.dexpiType` has ten branches, one of them
# a generic fallback this port refuses. A Plant *reader* must accept everything a P&ID can
# hold, so `reader_types` is far wider than `plant_types`. That asymmetry is NeqSim's, and
# this table states it rather than flattening it into one column.
#
#   write = "faithful" | "lossy" | "refused"  - what an export costs, as in the Process table.
#   plant_types  - the native `Plant/ProcessEquipment.*` class the writer emits (one, for a
#                  writable row; none for a refusal).
#   reader_types - the bare class names a reader accepts. A native file spells them
#                  `Plant/ProcessEquipment.<name>`; a Proteus file spells them `<name>` in
#                  `ComponentClass`. One name, one azoth unit: a class that could mean two
#                  units is mapped to the general one, and the importer does not guess.
#
# The names come from NeqSim's two reviewed mapping tables at the pin
# (`dexpi_equipment_mapping.properties`, 66 rows, and `dexpi_piping_component_mapping.properties`,
# 28 rows) plus the classes its native writer emits. A name not in either is left unmapped and
# read as `dexpi.unmapped`.
schema_version = 1
profile = "dexpi-2.0-plant"

[[unit]]
azoth_id = "unit_ops.absorption_column"
write = "refused"
plant_types = []
reader_types = ["AbsorptionColumn"]
note = "No native Plant class was reviewed for an absorption column in the writer this port follows; the reader accepts the Proteus class name."

[[unit]]
azoth_id = "unit_ops.component_splitter"
write = "refused"
plant_types = []
reader_types = []
note = "A composition split is not a plant item; no DEXPI class names one."

[[unit]]
azoth_id = "unit_ops.compressor"
write = "faithful"
plant_types = ["Plant/ProcessEquipment.CentrifugalCompressor"]
reader_types = ["CentrifugalCompressor", "ReciprocatingCompressor", "ScrewCompressor", "Fan", "Blower", "Compressor"]
note = ""

[[unit]]
azoth_id = "unit_ops.cooler"
write = "lossy"
plant_types = ["Plant/ProcessEquipment.AirCoolingSystem"]
reader_types = ["Cooler", "AirCoolingSystem"]
note = "AirCoolingSystem names one cooling technology; this unit is a generic cooler whose duty may come from any utility."

[[unit]]
azoth_id = "unit_ops.distillation_column"
write = "refused"
plant_types = []
reader_types = ["ProcessColumn", "Column", "DistillationColumn", "TrayColumn"]
note = "The native writer reviewed by this port has no column branch and falls back to a generic type, which this exchange refuses; the reader accepts the column class names."

[[unit]]
azoth_id = "unit_ops.ejector"
write = "refused"
plant_types = []
reader_types = ["Ejector", "SteamJetEjector", "EjectorPump"]
note = "No native Plant class was reviewed for an ejector in the writer this port follows."

[[unit]]
azoth_id = "unit_ops.expander"
write = "refused"
plant_types = []
reader_types = ["Expander", "Turbine"]
note = "No expander branch exists in the reviewed native writer; the reader accepts the turbine and expander class names."

[[unit]]
azoth_id = "unit_ops.filter"
write = "refused"
plant_types = []
reader_types = ["Filter"]
note = "No native Plant class was reviewed for a filter in the writer this port follows."

[[unit]]
azoth_id = "unit_ops.flare"
write = "refused"
plant_types = []
reader_types = ["Flare", "FlareStack", "WasteGasEmitter"]
note = "No flare branch exists in the reviewed native writer; the reader accepts the flare class names."

