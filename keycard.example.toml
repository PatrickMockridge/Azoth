# keycard.example.toml - the template for your own keycard.
#
# Copy it to `keycard.toml`, fill in the values you are entitled to use, and check it:
#
#     python tools/check_user_data.py keycard.toml
#     python tools/gen_user_data.py   keycard.toml     # then write the data files
#
# Every row is an invented value with a citation saying so. This file validates as it
# stands, and a test enforces that. Provenance is yours: a `citation` is optional and
# nothing here checks it.

schema_version = 2

# Who is asserting the right to use these values. Nothing in azoth reads it.
[keyholder]
name = "Example Engineering Ltd"
# licence = "https://example.com/licences/iso-5167"

# Overrides or extends `data/components/components.csv`, by name: the parameters you
# list replace the shipped ones and the rest are kept. `Tc`, `Pc` and `omega` are the
# parameters a cubic reads, and the list is closed. Units are checked, not assumed.
[components.methane.Tc]
value = 190.0
unit = "K"
citation = "EXAMPLE - not the accepted value."

# A substance the databank does not have needs all three parameters.
#
# [components.n-hexadecane.Tc]
# value = 722.0
# unit = "K"
#
# [components.n-hexadecane.Pc]
# value = 1.40e6
# unit = "Pa"
#
# [components.n-hexadecane.omega]
# value = 0.717
# unit = "dimensionless"

# Overrides or extends `data/components/kij.csv`. A pair is unordered.
[[kij]]
component_a = "methane"
component_b = "n-butane"
value = 0.0135
citation = "EXAMPLE ROW - DUMMY VALUE, not from any standard. Replace with your own."
# temperature_k, where the source gives one.

# A constant a calculation takes as an argument, keyed by calculation id and then by
# input name. An explicit argument always wins over the card. The inner key is quoted
# because the id contains a dot, which unquoted would be three levels of table.
[coefficients."hydraulics.orifice_flow".Cd]
value = 0.61
unit = "dimensionless"
citation = "EXAMPLE - a placeholder, not a value read from ISO 5167."
convention = "iso_5167_corner"

# A named mixture, so a caller does not restate it: `azoth.eos.from_model("vendor_gas")`.
# Every member below is the only value each vocabulary admits. Nothing here executes.
#
# [models.vendor_gas]
# kind = "cubic_eos"
# shape = "peng_robinson"
# alpha = "peng_robinson"
# mixing_rule = "classical_kij"
# components = ["methane", "n-butane"]

# Read by `azoth.hydraulics.crane_k_factors` and by `azoth pipe`. `n_ld` is the
# equivalent length ratio L_eq/D, and `f_t_basis` records which friction factor it was
# taken against, because the alternative basis gives a different answer.
[[fittings]]
id = "90_elbow"
family = "bend"
name = "90 degree standard elbow"
n_ld = 30.0
f_t_basis = "f_t"
citation = "EXAMPLE ROW - DUMMY VALUE, not from any standard. Replace with your own data."

# Read by `azoth pipe` and `azoth.properties`: temperature into density and viscosity,
# by linear interpolation, with no extrapolation past either end.
[[fluids.example_fluid]]
temperature_c = 0.0
density_kg_m3 = 1000.0
dynamic_viscosity_pa_s = 0.0018
citation = "EXAMPLE ROW - DUMMY VALUE, not from any standard."

[[fluids.example_fluid]]
temperature_c = 100.0
density_kg_m3 = 958.0
dynamic_viscosity_pa_s = 0.00028
citation = "EXAMPLE ROW - DUMMY VALUE, not from any standard."
